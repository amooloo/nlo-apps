<style>
:root{
  --navy:#1B2F4C;--navy-9:#11203A;--navy-7:#294169;--navy-5:#5471A0;
  --blue:#1D3EA9;--blue-1:#E5EAF8;--coral:#FA624D;--coral-7:#D8412E;--coral-1:#FFE7E1;
  --mint:#64F4C9;--mint-7:#1F9E7E;--mint-1:#E2FBF4;--amber:#F6AF24;--amber-7:#C2820A;--amber-1:#FEF2D7;
  --bg:#F2F3F4;--card:#fff;--sunk:#ECEEF0;--line:#DCE0E4;--line-2:#C3C9D0;
  --text:#33404F;--strong:#1B2F4C;--muted:#6B7685;--faint:#969FAB;
  --display:'Oswald','Bebas Neue',system-ui,sans-serif;
  --body:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --r:16px;--sh:0 1px 2px rgba(17,32,58,.06),0 8px 24px rgba(17,32,58,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--blue)}
[hidden]{display:none!important}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12.5px}.bold{font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.end{justify-content:flex-end}.grow{flex:1;min-width:0}
#gate{position:fixed;inset:0;background:radial-gradient(1200px 600px at 20% 0%,#294169,#1B2F4C 55%,#11203A);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60}
#gate .box{background:#fff;border-radius:22px;padding:38px 30px 30px;max-width:380px;width:100%;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.35)}
#gate h1{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--navy);font-size:26px;margin:14px 0 4px}
#gate p{color:var(--muted);font-size:14px;margin-bottom:22px}
.gbtn{display:inline-flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:12px 20px;font-weight:700;color:var(--navy);background:#fff}
#gateErr{color:var(--coral-7);font-size:13px;font-weight:700;margin-top:14px;min-height:18px}
.crest{width:58px;height:58px;border-radius:16px;background:var(--navy);display:inline-flex;align-items:center;justify-content:center;color:var(--mint)}
.top{background:var(--navy);color:#fff;padding:14px 18px 12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .brand{display:flex;flex-direction:column;line-height:1.1;margin-right:auto}
.top .brand b{font-family:var(--display);text-transform:uppercase;letter-spacing:.07em;font-size:19px;font-weight:600}
.top .brand span{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.6;font-weight:600;margin-top:3px}
.ibtn{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:#fff;background:rgba(255,255,255,.08)}
.ibtn:hover{background:rgba(255,255,255,.16)}
.who-top{font-size:12px;opacity:.75;font-weight:600}
.mbar{position:sticky;top:0;z-index:30;background:var(--bg);padding:10px 14px 6px}
.mbar-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mswitch{display:flex;align-items:center;gap:4px;background:#fff;border-radius:14px;box-shadow:var(--sh);padding:4px}
.mswitch button{width:38px;height:38px;border-radius:10px;font-size:20px;font-weight:700;color:var(--navy)}
.mswitch button:hover{background:var(--sunk)}
.mswitch .m{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:18px;font-weight:600;color:var(--navy);min-width:170px;text-align:center;cursor:pointer}
.tabs{display:flex;gap:6px;margin-left:auto}
.tabbtn{padding:10px 14px;border-radius:12px;font-family:var(--display);text-transform:uppercase;letter-spacing:.07em;font-size:14px;font-weight:600;color:var(--navy-5)}
.tabbtn:hover{background:rgba(27,47,76,.05)}.tabbtn.on{background:var(--navy);color:#fff}
main{max-width:1080px;margin:0 auto;padding:10px 14px 80px}
.panel>*+*{margin-top:14px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.card-h h2{font-family:var(--display);text-transform:uppercase;letter-spacing:.07em;font-size:16px;font-weight:600;color:var(--navy)}
.card-h .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:600;color:var(--navy-5)}
.hint{font-size:13px;color:var(--muted);line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 15px;border-radius:12px;font-weight:700;font-size:14px;background:var(--navy);color:#fff;white-space:nowrap}
.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.blue{background:var(--blue)}.btn.coral{background:var(--coral)}.btn.mint{background:var(--mint);color:var(--navy)}
.btn.ghost{background:var(--sunk);color:var(--navy)}.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:10px}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:800;background:var(--sunk);color:var(--navy-7)}
.tag.red{background:var(--coral-1);color:var(--coral-7)}.tag.green{background:var(--mint-1);color:var(--mint-7)}.tag.amber{background:var(--amber-1);color:var(--amber-7)}.tag.blue{background:var(--blue-1);color:var(--blue)}
.warnbar{background:var(--amber-1);color:#7a5200;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600}
.okbar{background:var(--mint-1);color:var(--mint-7);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700}
/* entry tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;text-align:right;padding:6px 6px;white-space:nowrap}
.tbl th:first-child{text-align:left}
.tbl td{padding:4px 6px;border-top:1px solid var(--line);text-align:right;font-size:14px;vertical-align:middle}
.tbl td:first-child{text-align:left;font-weight:600;color:var(--strong);font-size:13.5px}
.tbl tr.total td{font-weight:800;color:var(--navy);background:#fafbfc}
.tbl tr.sub td:first-child{padding-left:16px;font-weight:500}
.tbl .x{font-size:11px;color:var(--faint);font-weight:600;margin-left:4px}

input.num.wide{width:130px}
input.num:focus{outline:none;border-color:var(--blue);background:#fff}
input.num:disabled{background:var(--sunk);color:var(--navy-7);border-color:transparent}
.calc{font-weight:800;color:var(--navy);display:inline-block;min-width:70px}
.calc.good{color:var(--mint-7)}.calc.bad{color:var(--coral-7)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:2px 24px}
.frow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.frow .l{flex:1;min-width:0;font-weight:600;font-size:13.5px;color:var(--strong)}
.frow.calcrow .l{color:var(--navy-5)}
.q{width:20px;height:20px;border-radius:50%;background:var(--sunk);color:var(--navy-5);font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;margin-left:4px;vertical-align:1px}
.q:hover{background:var(--blue-1);color:var(--blue)}
.by{font-size:11.5px;color:var(--faint);font-weight:600}
.status{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.yr td,.yr th{white-space:nowrap}
.yr tr.clickable{cursor:pointer}.yr tr.clickable:hover td{background:var(--blue-1)}
.yr tr.empty td{color:var(--faint)}
.yr td:first-child{position:sticky;left:0;background:#fff}
.yr tr.total td:first-child{background:#fafbfc}
input.field,select.field,textarea.field{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;font-size:14.5px;background:#fff;color:var(--strong)}
label.lbl{display:block;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--navy-5);margin:14px 0 6px}
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;margin-top:10px}
.ptile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:14px;font-size:12.5px;font-weight:700;color:var(--navy);text-align:center}
.ptile:hover{background:var(--sunk)}.ptile.sel{background:var(--blue-1);outline:2px solid var(--blue)}
.av{border-radius:50%;background:var(--navy-7);color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.drop{display:flex;align-items:center;justify-content:center;text-align:center;border:2px dashed var(--line-2);border-radius:14px;padding:22px;margin-top:14px;font-weight:700;color:var(--navy-5);cursor:pointer;background:var(--sunk)}
.drop.over,.drop:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-1)}
.steps{margin:10px 0 0 20px;line-height:1.7}
#sheet{position:fixed;inset:0;z-index:80;display:none}#sheet.open{display:block}
.sheet-back{position:absolute;inset:0;background:rgba(17,32,58,.55)}
.sheet-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto;background:#fff;border-radius:20px;padding:22px 20px 18px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.sheet-card.wide{width:min(860px,calc(100vw - 24px))}
.sheet-x{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:10px;font-size:22px;color:var(--muted)}
.sheet-t{font-family:var(--display);text-transform:uppercase;letter-spacing:.07em;font-size:19px;color:var(--navy);font-weight:600;margin-bottom:6px;padding-right:34px}
@media (max-width:640px){.sheet-card{left:0;right:0;bottom:0;top:auto;transform:none;width:100%;max-height:92vh;border-radius:20px 20px 0 0}.tabs{margin-left:0;width:100%}.tabbtn{flex:1}.mswitch{width:100%;justify-content:space-between}.who-top{display:none}input.num{width:84px}}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:all .25s;z-index:120;max-width:calc(100vw - 30px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.good{background:var(--mint-7)}#toast.bad{background:var(--coral-7)}
#printArea{display:none}
@media print{body{background:#fff}#app,#sheet,#toast,#gate{display:none!important}#printArea{display:block!important;color:#111}#printArea table{width:100%;border-collapse:collapse}#printArea td,#printArea th{border-bottom:1px solid #ccc;padding:3px 5px;font-size:11.5px;text-align:right}#printArea td:first-child,#printArea th:first-child{text-align:left}#printArea h1{font-size:20px}#printArea h2{font-size:14px;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.06em}}
</style>
<style id="nlo-home-room">
/* The NLO Apps button (nlo-home.js) sits in the top-left corner: keep this app's header clear of it. */
@media screen{
/* move just the title (not the whole bar); on phones the title is a size smaller, and on the narrowest ones its small
   "Next Level Orthodontics" line is left out, so the two icons stay on the title's row */
html.nlo-home-on .top .brand{margin-left:calc(var(--nlo-home-space) - 18px)}
@media (max-width:640px){html.nlo-home-on .top .brand b{font-size:17px}}
@media (max-width:419px){html.nlo-home-on .top .brand span{display:none}}
/* while a sheet is open over the page, the button steps aside (as it does for dialogs everywhere) */
html:has(#sheet.open)>:is(nlo-home,nlo-aisa){display:none!important}
}
</style>
<style id="nlo-aisa-room">
/* Ask AISA (nlo-aisa.js) sits in the bottom-right corner: on phones the toast shows above it. */
@media screen and (max-width:600px){html.nlo-aisa-on #toast{bottom:calc(var(--nlo-aisa-lift) + 4px)}}
</style>

<script>
'use strict';
/* =====================================================================
   NLO Month-End Numbers — v1.0 (Oct 2026)
   NLO's own month-end portal (replaces the consultant's EOM / EOY pages).
   - MONTH: new patients and their outcome, treatment starts (per TC),
     production & collections, patients, accounts 30+ past due. Every %,
     conversion rate and total calculates itself; outcomes must add to 100%.
   - YEAR: Jan–Dec summary with totals, monthly averages, last year and
     growth vs the year's goals.
   - GOALS & SETUP: growth goals, goal conversion rate, last year's totals
     (when the months aren't in the app), TC columns, due day.
   Practice totals only — never patient names.
   Data: Firebase RTDB (nlo-inventory) under nlo/staffMeeting/monthEnd
   (that path already has the right access rules). Each month also stores
   computed `totals`, which the Staff Meeting Hub reads for its KPIs.
   ===================================================================== */
const APP_VERSION = '1.2.0';
const FB_CONFIG = { apiKey: "AIzaSyBFCmDgAKkdfZ4Cb81nK0KCKXtONiwMJy4", authDomain: "nlo-inventory.firebaseapp.com", databaseURL: "https://nlo-inventory-default-rtdb.firebaseio.com", projectId: "nlo-inventory", storageBucket: "nlo-inventory.firebasestorage.app", messagingSenderId: "471691286148", appId: "1:471691286148:web:b362a98186f648bd4914d1" };
const ME = 'nlo/staffMeeting/monthEnd';
const ROSTER_PATH = 'nlo/cadence/roster/people';
const OWNER_EMAIL = 'akhavan.ak@gmail.com', OWNER_ID = 's_amir', ALLOWED_DOMAIN = 'thenextlevelorthodontics.com';
const GEMINI_MODELS = ['gemini-3.8-flash', 'gemini-2.5-flash', 'gemini-2.5-flash-lite'];
const AUTHOR_TTL = 30 * 60 * 1000;
firebase.initializeApp(FB_CONFIG);
const db = firebase.database(), auth = firebase.auth();

/* ---------------------------------------------------------------- fields */
const NP_ROWS = [['np', 'New patients', 'Seen for the first time ever at NLO this month.'], ['obs', 'Went into observation'], ['pending', 'Went into pending (will think about it)'], ['sameday', 'Same-day start (contract signed)'], ['scheduled', 'Scheduled to start'], ['declined', 'Declined treatment'], ['notx', 'No treatment recommended']];
const NP_OUT = ['obs', 'pending', 'sameday', 'scheduled', 'declined', 'notx'];
const ST_ROWS = [['ph1', 'Phase I'], ['ph1a', 'Phase I aligners'], ['ph2', 'Phase II', 1], ['ph2a', 'Phase II aligners', 1], ['ft', 'Full treatment'], ['fta', 'Full treatment aligners'], ['lmt', 'Limited treatment'], ['retreat', 'Retreat']];
const ST_EXCL = ['ph2', 'ph2a'];   // not counted in conversion — Shimmin's own math (its form said retreats were left out too, but its numbers counted them)
const MONEY = [['net_coll', 'Net collections', '$', 'Payments (cash in) for the month, after patient/insurance refunds and write-offs. In Edge: Practice Statistics for the month → page 3, Receipts by Account total (same as Practice Monitor → Collections).'], ['gross_prod', 'Gross production', '$', 'Production for the month before any adjustments. In Edge: Practice Statistics → page 3, Gross Charge (Practice Monitor → Production).'], ['adj', 'Production adjustments', '$', 'Courtesies, promotions and transfer-out adjustments (use the Transfer-Out Calculator for transfers). In Edge: Practice Statistics → page 3, Total Adj (Practice Monitor → Adjust).'], ['cred_pt', 'Patient credits', '$', 'Credit balances owed to patients at month end.'], ['cred_ins', 'Insurance credits', '$', 'Credit balances owed to insurance at month end.'], ['fees', 'Treatment fees for this month’s starts', '$', 'Total contract fees for the patients who started this month — gives the average case fee. In Edge: Practice Statistics → New Treatment Fees, total Gross Tx Fee.']];
const PATIENTS = [['pending', 'Pending patients', 'Patients in pending (will think about it) at month end.'], ['active', 'Active patients (total)'], ['active_noappt', 'Active patients with no appointment'], ['obs', 'Observation patients (total)'], ['obs_noappt', 'Observation patients with no appointment'], ['past', 'Patients past their estimated completion']];
const ACCTS = [['ins', 'Insurance'], ['pt', 'Patient']];
const DEFAULT_TIPS = { ar_total: 'Total accounts receivable dollars at the end of the month. In Edge: Practice Monitor (date = last day of the month) → Balance for that month.', ins_pd: 'Accounts with balances 30+ days past due at month end.', pt_pd: 'Accounts with balances 30+ days past due at month end.' };

/* ---------------------------------------------------------------- utils */
const $ = (s, r) => (r || document).querySelector(s), $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1);
function parseYm(s) { const m = /^(\d{4})-(\d{2})$/.exec(String(s || '')); return m ? new Date(+m[1], +m[2] - 1, 15) : null; }
const addMonths = (ym, n) => { const d = parseYm(ym) || new Date(); d.setDate(15); d.setMonth(d.getMonth() + n); return ymOf(d); };
const fmtYm = (ym, o) => { const d = parseYm(ym); return d ? d.toLocaleDateString('en-US', o || { month: 'long', year: 'numeric' }) : ''; };
const fmtWhen = ts => { if (!ts) return ''; const d = new Date(ts); return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); };
function num(v) { if (v == null || v === '') return null; const n = Number(String(v).replace(/[$,%\s]/g, '')); return isFinite(n) ? n : null; }
function fmtNum(v, unit) { if (v == null || !isFinite(Number(v))) return '—'; const n = Number(v); if (unit === '$') return (n < 0 ? '−$' : '$') + Math.round(Math.abs(n)).toLocaleString('en-US'); const s = Math.abs(n) >= 1000 ? Math.round(n).toLocaleString('en-US') : String(Math.round(n * 10) / 10); return unit === '%' ? s + '%' : s; }
const ratio = (a, b) => (a != null && b) ? Math.round(Math.abs(a) / Math.abs(b) * 1000) / 10 : null;
const sumOf = (...v) => { const d = v.filter(x => x != null && isFinite(x)); return d.length ? d.reduce((s, x) => s + x, 0) : null; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const valsOf = x => x && typeof x === 'object' ? Object.values(x).filter(v => v != null && typeof v === 'object') : [];
const up = map => db.ref().update(map);
const MP = (...p) => [ME].concat(p).join('/');
const slug = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');

function arrOf(x) { if (Array.isArray(x)) return x.filter(v => v != null); if (x && typeof x === 'object') return Object.keys(x).sort((a, b) => (+a) - (+b)).map(k => x[k]).filter(v => v != null); return []; }

/* ---------------------------------------------------------------- totals (shared with the Staff Meeting Hub) */
function computeTotals(rec) {
  rec = rec || {}; const t = {}; const tcs = rec.tcs || {};
  const sumTc = k => { let s = null; Object.keys(tcs).forEach(id => { const v = num(tcs[id] && tcs[id][k]); if (v != null) s = (s || 0) + v; }); return s; };
  const set = (k, v) => { if (v != null && isFinite(v)) t[k] = Math.round(v * 100) / 100; };
  NP_ROWS.forEach(([k]) => set(k === 'np' ? 'np_total' : 'np_' + k, sumTc(k)));
  ST_ROWS.forEach(([k]) => set('st_' + k, sumTc(k)));
  const stTotal = sumOf(...ST_ROWS.map(([k]) => sumTc(k)));
  set('st_total', stTotal);
  const less = stTotal == null ? null : stTotal - ST_EXCL.reduce((s, k) => s + (sumTc(k) || 0), 0);
  set('st_less_ph2', less);
  set('conv', ratio(less, t.np_total));
  const outSum = sumOf(...NP_OUT.map(k => sumTc(k)));
  set('np_accounted', outSum);
  set('np_check', ratio(outSum, t.np_total));
  const tcConv = {}; Object.keys(tcs).forEach(id => { const c = tcs[id] || {}; const st = sumOf(...ST_ROWS.map(([k]) => num(c[k]))); const l = st == null ? null : st - ST_EXCL.reduce((s, k) => s + (num(c[k]) || 0), 0); const r = ratio(l, num(c.np)); if (r != null) tcConv[id] = r; });
  if (Object.keys(tcConv).length) t.tc_conv = tcConv;
  ['net_coll', 'gross_prod', 'cred_pt', 'cred_ins', 'fees', 'pending', 'active', 'active_noappt', 'obs', 'obs_noappt', 'past', 'ar_total'].forEach(k => set(k, num(rec[k])));
  const adj = num(rec.adj); if (adj != null) set('adj', Math.abs(adj));
  if (t.gross_prod != null) set('net_prod', t.gross_prod - (t.adj || 0));
  set('coll_rate', ratio(t.net_coll, t.net_prod));
  set('adj_rate', ratio(t.adj, t.gross_prod));
  set('cred_total', sumOf(t.cred_pt, t.cred_ins));
  if (t.fees != null && t.st_total) set('avg_fee', t.fees / t.st_total);
  set('active_noappt_pct', ratio(t.active_noappt, t.active));
  if (t.obs) set('obs_appt_pct', ratio(t.obs - (t.obs_noappt || 0), t.obs));
  set('past_pct', ratio(t.past, t.active));
  ACCTS.forEach(([p]) => { ['ar', 'ar_n', 'pd', 'pd_n'].forEach(s => set(p + '_' + s, num(rec[p + '_' + s]))); set(p + '_pd_pct', ratio(t[p + '_pd'], t[p + '_ar'])); set(p + '_pd_pct_n', ratio(t[p + '_pd_n'], t[p + '_ar_n'])); });
  return t;
}
function filledCount(rec) { const t = computeTotals(rec); return ['np_total', 'st_total', 'net_coll', 'gross_prod', 'active', 'ins_ar', 'pt_ar'].filter(k => t[k] != null).length; }

const dirty = new Set(), pending = new Set(); let raf = 0; const RENDER = {};

function flush() {
  raf = 0; let parts = [...dirty]; dirty.clear(); if (parts.includes('all')) parts = ['top', 'mbar', 'month', 'year', 'goals'];
  parts.forEach(p => { const root = $('#p-' + p); if (root) { if (S.tab !== p) return; if (editingIn(root)) { pending.add(p); return; } } try { (RENDER[p] || (() => {}))(); } catch (e) { console.error('render ' + p, e); } });
}

  'Practice Statistics: start/end = the date range printed under the title; receipts_total = the total of "RECEIPTS BY ACCOUNT"; gross_charge, total_adj, net_charge = the "Gross Charge", "Total Adj" and "Net Charge" line; patient_starts_total = the total row of "PATIENT STARTS"; new_fees = every row of "NEW TREATMENT FEES" (Phase, Count, Gross Tx Fee); new_fees_count and new_fees_gross = that table\'s total row; np_exams_total = the total of "CURRENT STATUS - NEW PATIENT EXAMS".\n' +
  'Practice Monitor: report_date = the date under the title; months = one entry per month row of the top table (Jan = 1 …) with Collections, Production, Adjust, the four "Accounts Receivable Past Due" columns (30, 60, 90, 120+) and Balance. Skip the Total and AVG rows.';

  if (/phase\s*(ii|2)\b/.test(t)) return al ? 'ph2a' : 'ph2';

function edgeValues(data, m) {

      const sum = START_KEYS.reduce((s2, k) => s2 + starts[k], 0), pst = n(st.patient_starts_total);
