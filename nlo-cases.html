<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-eq/PCMGXpD7SgNtlT67RqqUMnpHkCP5T8a+3sBCWez8=' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://app.asana.com http://127.0.0.1:8080 http://127.0.0.1:9099 http://127.0.0.1:9000 ws://127.0.0.1:9000; frame-src https://*.firebaseapp.com; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="theme-color" content="#1B2F4C">
<title>NLO Cases</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* NLO brand palette — same values as Staff Hub / Onboarding */
  --navy-900:#11203A; --navy:#1B2F4C; --navy-700:#294169; --navy-600:#385686; --navy-500:#5471A0; --navy-100:#E8ECF2;
  --blue-800:#122874; --blue-700:#16318C; --blue:#1D3EA9; --blue-500:#2E52C9; --blue-200:#BCC8EE; --blue-100:#E5EAF8;
  --coral-700:#D8412E; --coral-600:#EE4F3A; --coral:#FA624D; --coral-200:#FFC8BF; --coral-100:#FFE7E1;
  --mint-700:#1F9E7E; --mint-600:#34C49E; --mint:#64F4C9; --mint-200:#C0FBEC; --mint-100:#E2FBF4;
  --amber-700:#C2820A; --amber-600:#E29A14; --amber:#F6AF24; --amber-200:#FCE2A6; --amber-100:#FEF2D7;
  --grey-50:#F7F8F9; --grey-100:#ECEEF0; --grey-200:#DCE0E4; --grey-300:#C3C9D0; --grey-400:#969FAB; --grey-500:#6B7685; --grey-600:#4C5868; --grey-700:#33404F;
  --off:#F2F3F4; --card:#FFFFFF;
  --fd:'Oswald',system-ui,sans-serif;
  --fb:'Montserrat',system-ui,-apple-system,sans-serif;
  --sh-xs:0 1px 2px rgba(17,32,58,.07); --sh-sm:0 2px 6px rgba(17,32,58,.08);
  --sh-md:0 8px 24px rgba(17,32,58,.10); --sh-lg:0 18px 48px rgba(17,32,58,.15); --sh-xl:0 32px 70px rgba(17,32,58,.22);
  --r-sm:8px; --r:14px; --r-lg:22px;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--fb);background:var(--off);color:var(--grey-700);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--grey-700)}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue-500);outline-offset:2px;border-radius:4px}
svg.i{flex:none;display:inline-block;vertical-align:-3px}
.hidden{display:none !important}
.muted{color:var(--grey-500)}
.small{font-size:12.5px}

/* ---------- Demo banner ---------- */
#demoBar{position:fixed;left:0;right:0;bottom:0;z-index:2000;background:var(--amber);color:var(--navy-900);text-align:center;font-family:var(--fd);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px;padding:7px 12px}

/* ---------- Lock ---------- */
#lockWrap{position:fixed;inset:0;background:linear-gradient(158deg,var(--navy-900) 0%,var(--navy) 62%,#20395C 100%);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;overflow:hidden auto}
#lockWrap::before{content:"";position:absolute;width:680px;height:680px;border-radius:50%;border:88px solid rgba(255,255,255,.03);top:-300px;right:-220px;pointer-events:none}
#lockWrap::after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;border:70px solid rgba(100,244,201,.045);bottom:-260px;left:-180px;pointer-events:none}
.lockCol{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;width:100%;max-width:440px;margin:auto;padding:24px 0}
.lockBrand{display:flex;flex-direction:column;align-items:center;gap:14px}
.lockBrand img{width:160px;height:auto;display:block}
.appTag{font-family:var(--fd);font-weight:500;font-size:13px;letter-spacing:.34em;text-transform:uppercase;color:var(--mint);text-indent:.34em}
.lockCard{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-xl);width:100%;padding:32px 34px 28px}
.lockCard h1{font-family:var(--fd);font-weight:600;font-size:22px;letter-spacing:.03em;text-transform:uppercase;color:var(--navy)}
.lockCard .lsub{font-size:12.5px;color:var(--grey-500);margin-top:3px}
.lockCard p.desc{color:var(--grey-500);font-size:13.5px;margin:12px 0 18px}
.lockErr{background:var(--coral-100);color:var(--coral-700);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:500;margin-bottom:14px}
.lockOk{background:var(--mint-100);color:var(--mint-700);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:500;margin-bottom:14px}
.lockFoot{margin-top:16px;font-size:12px;color:var(--grey-400);text-align:center}
.lockFoot a,.linkBtn{color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.lockMeta{display:flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:.06em;color:#9DB0CC;text-transform:uppercase;font-family:var(--fd);font-weight:500}
.ackBox{display:flex;gap:10px;align-items:flex-start;background:var(--amber-100);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--amber-700);margin-bottom:16px;line-height:1.5}
.ackBox input{margin-top:2px;accent-color:var(--amber-600)}
.codeBox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;letter-spacing:.08em;background:var(--grey-50);border:1.5px dashed var(--grey-300);border-radius:12px;padding:16px;text-align:center;color:var(--navy);word-break:break-all;margin:6px 0 14px;user-select:all}

/* ---------- Fields ---------- */
.field{margin-bottom:14px}
.field label,.flabel{display:block;font-family:var(--fd);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey-500);margin-bottom:6px}
.field input,.field select,.field textarea,.inp{width:100%;padding:10px 13px;border:1.5px solid var(--grey-200);border-radius:10px;background:#fff;outline:none;transition:border-color .14s var(--ease),box-shadow .14s var(--ease);min-height:42px}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-100)}
.field textarea{resize:vertical;min-height:70px;line-height:1.45}
.field .hint{font-size:11.5px;color:var(--grey-500);margin-top:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 14px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:9px 20px;border-radius:999px;font-family:var(--fd);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;line-height:1.1;white-space:nowrap;transition:background .14s var(--ease),transform .14s var(--ease),box-shadow .14s var(--ease)}
.btn:active{transform:scale(.985)}
.btn-pri{background:var(--navy);color:#fff;box-shadow:var(--sh-xs)}
.btn-pri:hover{background:var(--navy-900);box-shadow:var(--sh-md)}
.btn-act{background:var(--blue);color:#fff}
.btn-act:hover{background:var(--blue-700)}
.btn-sec{background:#fff;border:1.5px solid var(--grey-300);color:var(--navy)}
.btn-sec:hover{background:var(--grey-100)}
.btn-danger{background:var(--coral-600);color:#fff}
.btn-danger:hover{background:var(--coral-700)}
.btn-mint{background:var(--mint);color:var(--navy-900)}
.btn-mint:hover{background:var(--mint-600)}
.btn-ghost{color:var(--grey-600);padding:6px 12px;min-height:34px;border-radius:999px;font-family:var(--fb);font-weight:600;font-size:12.5px;letter-spacing:0;text-transform:none}
.btn-ghost:hover{background:var(--grey-100);color:var(--navy)}
.btn-sm{min-height:34px;padding:6px 14px;font-size:12px}
.btn-block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none !important;box-shadow:none !important}
.iconBtn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--grey-600)}
.iconBtn:hover{background:var(--grey-100);color:var(--navy)}

/* ---------- Shell ---------- */
#app{display:flex;min-height:100vh}
#side{width:232px;flex:none;background:var(--navy);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sideTop{padding:28px 22px 20px;border-bottom:1px solid rgba(255,255,255,.07)}
.sideTop img{width:126px;height:auto;display:block}
.sideTop .appTag{margin-top:12px;font-size:11px;letter-spacing:.3em;text-indent:0;text-align:left}
.nav{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.navLbl{font-family:var(--fd);font-weight:500;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#7E92B5;padding:14px 12px 6px}
.navBtn{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:10px;color:#C9D4E5;font-weight:600;font-size:13.5px;text-align:left}
.navBtn:hover{background:rgba(255,255,255,.06);color:#fff}
.navBtn.on{background:rgba(100,244,201,.12);color:var(--mint)}
.navBtn .cnt{margin-left:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.12);color:#fff;border-radius:99px;padding:1px 8px}
.navBtn .cnt.red{background:var(--coral-600)}
.sideFoot{margin-top:auto;padding:16px 20px 22px;border-top:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;gap:10px}
.whoBox{display:flex;align-items:center;gap:10px;font-size:12.5px;color:#DCE4EE}
.whoBox b{display:block;color:#fff;font-size:13px}
.sideLock{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:9px 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,.22);color:#DCE4EE;font-family:var(--fd);font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
.sideLock:hover{background:rgba(255,255,255,.09);color:#fff}
.syncLine{display:flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--fd);font-weight:500;color:#9DB0CC}
.dot{width:8px;height:8px;border-radius:50%;background:var(--grey-400);flex:none}
.dot.ok{background:var(--mint)} .dot.busy{background:var(--amber)} .dot.bad{background:var(--coral)}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
.topBar{display:flex;align-items:center;gap:14px;padding:18px 28px 14px;position:sticky;top:0;z-index:20;background:var(--off)}
.topBar h2{font-family:var(--fd);font-weight:600;font-size:24px;letter-spacing:.02em;text-transform:uppercase;color:var(--navy);white-space:nowrap}
.searchBox{flex:1;max-width:380px;margin-left:auto;position:relative}
.searchBox input{width:100%;padding:10px 14px 10px 38px;border-radius:999px;border:1.5px solid var(--grey-200);background:#fff;outline:none;min-height:42px}
.searchBox input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-100)}
.searchBox svg{position:absolute;left:13px;top:12px;color:var(--grey-400)}
#view{padding:4px 28px 60px;flex:1}
.mobBar{display:none}

/* ---------- Cards / tiles ---------- */
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh-xs);border:1px solid var(--grey-100)}
.cardHd{display:flex;align-items:center;gap:10px;padding:16px 20px 12px}
.cardHd h3{font-family:var(--fd);font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--navy)}
.cardHd .sub{font-size:12px;color:var(--grey-500)}
.cardBd{padding:4px 20px 18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile{background:#fff;border-radius:var(--r);border:1px solid var(--grey-100);box-shadow:var(--sh-xs);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:92px;transition:box-shadow .14s var(--ease),transform .14s var(--ease)}
.tile:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
.tile .n{font-family:var(--fd);font-weight:600;font-size:30px;line-height:1.1;color:var(--navy)}
.tile .l{font-size:12.5px;font-weight:600;color:var(--grey-600)}
.tile.red .n{color:var(--coral-700)} .tile.amber .n{color:var(--amber-700)} .tile.blue .n{color:var(--blue)} .tile.mint .n{color:var(--mint-700)}
.twoCol{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}

/* ---------- Due groups ---------- */
.dueGrp{margin-bottom:6px}
.dueGrp h4{font-family:var(--fd);font-weight:500;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey-500);padding:12px 0 6px;border-bottom:1px solid var(--grey-100)}
.dueGrp h4.red{color:var(--coral-700)}
.row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid var(--grey-100);cursor:pointer;border-radius:8px;width:100%;text-align:left}
.row:hover{background:var(--grey-50)}
.row .pt{font-weight:700;color:var(--navy);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:12px;color:var(--grey-500);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.empty{padding:28px 10px;text-align:center;color:var(--grey-500);font-size:13px}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap;background:var(--grey-100);color:var(--grey-600)}
.badge.t-aligner{background:var(--blue-100);color:var(--blue-700)}
.badge.t-lab{background:var(--mint-100);color:var(--mint-700)}
.badge.t-appl{background:var(--navy-100);color:var(--navy-700)}
.badge.t-ret{background:var(--amber-100);color:var(--amber-700)}
.badge.t-retx{background:var(--coral-100);color:var(--coral-700)}
.badge.t-misc{background:var(--grey-100);color:var(--grey-600)}
.due{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap;background:var(--grey-100);color:var(--grey-600)}
.due.over{background:var(--coral-100);color:var(--coral-700)}
.due.soon{background:var(--amber-100);color:var(--amber-700)}
.due.none{background:transparent;color:var(--grey-400);font-weight:600}
.av{width:28px;height:28px;border-radius:50%;background:var(--navy-600);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none;letter-spacing:.02em}
.av.none{background:var(--grey-200);color:var(--grey-500)}
.av.lg{width:36px;height:36px;font-size:13px}

/* ---------- Board ---------- */
.boardTabs,.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1.5px solid var(--grey-200);border-radius:99px;padding:6px 14px;font-size:12.5px;font-weight:600;color:var(--grey-600);background:#fff;min-height:36px}
.chip:hover{border-color:var(--navy-500);color:var(--navy)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .c{opacity:.7;margin-left:4px}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;scroll-snap-type:x proximity}
.col{flex:1 0 225px;max-width:320px;background:var(--grey-100);border-radius:var(--r);padding:10px;scroll-snap-align:start;max-height:calc(100vh - 230px);display:flex;flex-direction:column}
.colHd{display:flex;align-items:center;gap:8px;padding:4px 6px 10px}
.colHd h4{font-family:var(--fd);font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.colHd .c{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--grey-500)}
.colBd{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:40px;padding:2px}
.kc{position:relative;background:#fff;border-radius:11px;box-shadow:var(--sh-xs);border:1px solid var(--grey-200);padding:10px 11px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;width:100%}
.kc:hover{box-shadow:var(--sh-md);border-color:var(--grey-300)}
.kc .pt{font-weight:700;color:var(--navy);font-size:13.5px;line-height:1.3;padding-right:36px}
.kc .dt{font-size:12px;color:var(--grey-500);line-height:1.35}
.kc .ft{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kc .adv{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--blue);background:var(--blue-100)}
.kc .adv:hover{background:var(--blue);color:#fff}

/* ---------- Table ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select{padding:8px 12px;border:1.5px solid var(--grey-200);border-radius:999px;background:#fff;font-weight:600;font-size:12.5px;min-height:38px;color:var(--grey-700)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-family:var(--fd);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--grey-500);padding:11px 14px;border-bottom:1px solid var(--grey-100);white-space:nowrap}
.tbl th button{font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--grey-100);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--grey-50)}
.tbl .pt{font-weight:700;color:var(--navy)}
.tblWrap{overflow-x:auto}

/* ---------- Drawer ---------- */
#scrim{position:fixed;inset:0;background:rgba(17,32,58,.35);z-index:900}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;z-index:901;box-shadow:var(--sh-xl);display:flex;flex-direction:column}
.dHd{padding:20px 22px 14px;border-bottom:1px solid var(--grey-100);display:flex;gap:12px;align-items:flex-start}
.dHd h3{font-family:var(--fd);font-weight:600;font-size:21px;letter-spacing:.02em;color:var(--navy);line-height:1.2}
.dHd .sub{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.dBd{flex:1;overflow-y:auto;padding:16px 22px 26px}
.dFt{padding:12px 22px;border-top:1px solid var(--grey-100);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sec{margin-top:18px}
.sec h5{font-family:var(--fd);font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey-500);margin-bottom:8px}
.stepper{display:flex;flex-direction:column;gap:6px}
.step{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--grey-200);text-align:left;font-weight:600;font-size:13px;color:var(--grey-600);background:#fff;min-height:40px}
.step:hover{border-color:var(--blue-200);background:var(--blue-100)}
.step .n{width:22px;height:22px;border-radius:50%;background:var(--grey-100);color:var(--grey-500);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.step.past{color:var(--grey-500)}
.step.past .n{background:var(--mint-200);color:var(--mint-700)}
.step.cur{border-color:var(--blue);background:var(--blue-100);color:var(--blue-700)}
.step.cur .n{background:var(--blue);color:#fff}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 16px}
.kv div{min-width:0}
.kv .k{font-family:var(--fd);font-weight:500;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey-500)}
.kv .v{font-weight:600;color:var(--navy);overflow-wrap:anywhere}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--grey-50);border-radius:10px;padding:10px 12px;font-size:13px}
.cmt{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--grey-100)}
.cmt:last-child{border-bottom:none}
.cmt .w{font-size:12px;color:var(--grey-500)}
.cmt .w b{color:var(--navy)}
.hist{font-size:12.5px;color:var(--grey-600);padding:5px 0;display:flex;gap:8px}

<script>
'use strict';
/* =====================================================================
   NLO Cases — encrypted case tracker for Next Level Orthodontics
   - Every case is encrypted in the browser (AES-256-GCM) before it is
     stored; Firestore only holds ciphertext plus non-identifying flags.
   - Each person has their own login. The office key ring is sealed to
     each person's own key pair (ECDH P-256), whose private half is
     sealed with a key derived from their password (PBKDF2-SHA256 600k).
   - Removing someone deactivates them (rules cut access at once) and
     rotates the office key so later data is under a key they never had.
   ===================================================================== */

/* ---------- Firebase project (filled in after the project is created) ---------- */
const FB_CONFIG = {
  apiKey: "__API_KEY__",
  authDomain: "__AUTH_DOMAIN__",
  projectId: "__PROJECT_ID__",
  appId: "__APP_ID__"
};
/* Synthetic login addresses for staff usernames (no mail is ever sent to them). */
const STAFF_DOMAIN = 'staff.thenextlevelorthodontics.com';
const KDF_ITER = 600000;

/* ---------- Case types and the stages each one moves through ---------- */
const FLOWS = {
  outside: { label: 'Outside aligners & braces', stages: [
    ['submit', 'To submit'], ['dra', 'Dr. A action'], ['mfg', 'Manufacturing'],
    ['shipped', 'Shipped'], ['arrived', 'Arrived'], ['milestones', 'Checked into Milestones'] ] },
  appliance: { label: 'Appliances', stages: [
    ['submit', 'To submit'], ['hold', 'Hold (CBCT/Zoom)'], ['submitted', 'Submitted to lab'],
    ['mfg', 'Manufacturing'], ['shipped', 'Shipped'], ['milestones', 'Checked into Milestones'] ] },
  inhouse: { label: 'In-house lab', stages: [
    ['txp', 'TxP needed'], ['reset', 'Reset needed in 2 days'], ['fab', 'In fabrication'],
    ['pack', 'Made – needs packaging'], ['checkedin', 'Checked in'] ] },
  retainer: { label: 'Retainers & mouthguards', stages: [
    ['print', 'Printing'], ['milestones', 'Milestones'], ['sarah', 'On Sarah’s desk'], ['pickup', 'Front desk pickup'] ] },
  retreat: { label: 'Retreatment', stages: [
    ['intake', 'Intake & assessment'], ['review', 'Pending review'], ['proposal', 'Send proposal'],
    ['progress', 'In progress'], ['completed', 'Completed'] ] },
  misc: { label: 'Dr. A (misc.)', stages: [ ['todo', 'To do'], ['waiting', 'Waiting'] ] }
};
const TYPES = [
  { k: 'oliv', l: 'Oliv', flow: 'outside', cls: 't-aligner', aligner: true },
  { k: 'angel', l: 'Angel Aligners', flow: 'outside', cls: 't-aligner', aligner: true },
  { k: 'invisalign', l: 'Invisalign', flow: 'outside', cls: 't-aligner', aligner: true },
  { k: 'ulab', l: 'uLab', flow: 'outside', cls: 't-aligner', aligner: true },
  { k: 'insmile', l: 'InSmile', flow: 'outside', cls: 't-aligner' },
  /* legacy: no longer offered for new cases (Amir, 1 Oct 2026); kept so imported or older InBrace cases still open and edit */
  { k: 'inbrace', l: 'InBrace', flow: 'outside', cls: 't-aligner', legacy: true },
  { k: 'nla', l: 'In-house aligners', flow: 'inhouse', cls: 't-lab', aligner: true },
  { k: 'appliance', l: 'Appliance', flow: 'appliance', cls: 't-appl' },
  { k: 'retainer', l: 'Retainers & whitening', flow: 'retainer', cls: 't-ret' },
  { k: 'mouthguard', l: 'Mouthguard', flow: 'retainer', cls: 't-ret' },
  { k: 'retreat', l: 'Retreatment', flow: 'retreat', cls: 't-retx' },
  { k: 'misc', l: 'Dr. A (misc.)', flow: 'misc', cls: 't-misc' }
];
const TYPE = Object.fromEntries(TYPES.map(t => [t.k, t]));
/* types to offer in pickers: retired types only while some case still uses them (or one is already chosen) */
function typesShown(cases, chosen) { return TYPES.filter(t => !t.legacy || t.k === chosen || (cases || []).some(c => c.type === t.k)); }
const SCANNERS = ['Allied Star', 'iTero', 'Other'];
/* Stages that need the doctor, and stages where the case is in fabrication. */
const DR_STAGES = ['dra', 'txp', 'todo', 'review'];
const FAB_STAGES = ['mfg', 'fab', 'print', 'submitted'];

function typeOf(c) { return TYPE[c.type] || TYPE.misc; }
function flowOf(c) { return FLOWS[typeOf(c).flow]; }
function stageLabel(c) { const s = flowOf(c).stages.find(x => x[0] === c.stage); return s ? s[1] : (c.stage || '—'); }
function stageIndex(c) { return flowOf(c).stages.findIndex(x => x[0] === c.stage); }
function firstStage(type) { return FLOWS[(TYPE[type] || TYPE.misc).flow].stages[0][0]; }

/* ---------- small utils ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function uid8() { return Array.from(crypto.getRandomValues(new Uint8Array(6)), b => b.toString(16).padStart(2, '0')).join(''); }
function todayISO() { const d = new Date(); return isoOf(d); }
function isoOf(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(iso, n) { const [y, m, d] = iso.split('-').map(Number); const dt = new Date(y, m - 1, d); dt.setDate(dt.getDate() + n); return isoOf(dt); }
function dayDiff(iso) { if (!iso) return null; const [y, m, d] = iso.split('-').map(Number); const a = new Date(y, m - 1, d); const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((a - t) / 86400000); }
function fmtDate(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-').map(Number); const dt = new Date(y, m - 1, d); const opts = { month: 'short', day: 'numeric' }; if (y !== new Date().getFullYear()) opts.year = 'numeric'; return dt.toLocaleDateString(undefined, opts); }
function fmtDay(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }); }
function fmtWhen(ms) { if (!ms) return ''; const d = new Date(ms); return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ', ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }); }
function initials(name) { const p = String(name || '').trim().split(/\s+/).filter(Boolean); if (!p.length) return '?'; return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); }
function slug(s) { return String(s || '').toLowerCase().normalize('NFKD').replace(/[^\w.\-]+/g, '').replace(/_/g, '').slice(0, 30); }
/* random characters without modulo bias (rejection sampling) */
function randChars(n) {
  const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', lim = 256 - (256 % A.length); let out = '';
  while (out.length < n) { for (const b of crypto.getRandomValues(new Uint8Array(n * 2))) { if (b < lim && out.length < n) out += A[b % A.length]; } }
  return out;
}
function tempPassword() { return randChars(12).replace(/(.{4})(?=.)/g, '$1-'); }
function recoveryCode() { return randChars(24).replace(/(.{4})(?=.)/g, '$1-'); }
function normCode(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/(.{4})(?=.)/g, '$1-'); }

/* ---------- crypto ---------- */
const TE = new TextEncoder(), TD = new TextDecoder();
function b64(buf) {
  const u = buf instanceof Uint8Array ? buf : new Uint8Array(buf), CH = 0x8000;
  let s = ''; for (let i = 0; i < u.length; i += CH) s += String.fromCharCode.apply(null, u.subarray(i, i + CH));
  return btoa(s);
}
function unb64(s) { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
function rnd(n) { return crypto.getRandomValues(new Uint8Array(n)); }
const Crypto = {
  async pwKey(pw, salt, iter) {
    const base = await crypto.subtle.importKey('raw', TE.encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  },
  async seal(key, bytes, aad) {
    const iv = rnd(12);
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: TE.encode(aad) }, key, bytes);
    return { iv: b64(iv), ct: b64(ct) };
  },
  async open(key, box, aad) {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(box.iv), additionalData: TE.encode(aad) }, key, unb64(box.ct));
    return new Uint8Array(pt);
  },
  async sealJSON(key, obj, aad) { return Crypto.seal(key, TE.encode(JSON.stringify(obj)), aad); },
  async openJSON(key, box, aad) { return JSON.parse(TD.decode(await Crypto.open(key, box, aad))); },
  async pwSeal(pw, bytes, aad, iter) {
    iter = iter || KDF_ITER; const salt = rnd(16);
    const k = await Crypto.pwKey(pw, salt, iter); const box = await Crypto.seal(k, bytes, aad);
    return { salt: b64(salt), iter, iv: box.iv, ct: box.ct };
  },
  async pwOpen(pw, box, aad) { const k = await Crypto.pwKey(pw, unb64(box.salt), box.iter || KDF_ITER); return Crypto.open(k, box, aad); },
  EC: { name: 'ECDH', namedCurve: 'P-256' },
  async newPair() { return crypto.subtle.generateKey(Crypto.EC, true, ['deriveBits']); },
  async pubJwk(pair) { const j = await crypto.subtle.exportKey('jwk', pair.publicKey); return { kty: j.kty, crv: j.crv, x: j.x, y: j.y }; },
  async privBytes(pair) { return new Uint8Array(await crypto.subtle.exportKey('pkcs8', pair.privateKey)); },
  async importPriv(bytes) { return crypto.subtle.importKey('pkcs8', bytes, Crypto.EC, false, ['deriveBits']); },
  async boxKey(bits, info) {
    const hk = await crypto.subtle.importKey('raw', bits, 'HKDF', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(32), info: TE.encode(info) }, hk, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  },
  async sealTo(pub, bytes, info) {
    const pk = await crypto.subtle.importKey('jwk', { kty: pub.kty, crv: pub.crv, x: pub.x, y: pub.y, ext: true }, Crypto.EC, false, []);
    const eph = await Crypto.newPair();
    const bits = await crypto.subtle.deriveBits({ name: 'ECDH', public: pk }, eph.privateKey, 256);
    const k = await Crypto.boxKey(bits, info); const box = await Crypto.seal(k, bytes, info);
    return { epk: await Crypto.pubJwk(eph), iv: box.iv, ct: box.ct };
  },
  async openFrom(priv, box, info) {
    const e = box.epk;
    const epk = await crypto.subtle.importKey('jwk', { kty: e.kty, crv: e.crv, x: e.x, y: e.y, ext: true }, Crypto.EC, false, []);
    const bits = await crypto.subtle.deriveBits({ name: 'ECDH', public: epk }, priv, 256);
    const k = await Crypto.boxKey(bits, info); return Crypto.open(k, box, info);
  },
  /* key ring = { "1": base64(32 random bytes), "2": ... } */
  newRingKey() { return b64(rnd(32)); },
  async ringKeys(ring) {
    const out = {};
    for (const v of Object.keys(ring)) out[v] = await crypto.subtle.importKey('raw', unb64(ring[v]), { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
    return out;
  },
  ringBytes(ring) { return TE.encode(JSON.stringify(ring)); },
  ringFrom(bytes) { return JSON.parse(TD.decode(bytes)); }
};

/* ---------- parse Asana task text (Tally-style "Key: value" notes) ---------- */
const NOTE_KEYS = [

    batchOrTx.set(ref, { caseId, rev, uid: FB.uid, sid: FB.me.staffId, at: FB.ts(), v: FB.curV, iv: box.iv, ct: box.ct, prev: prev || null });
  },
  async createCases(list, progress) {
    // list: [{data, status:'open'|'done', closedAt:ms}]; small batches keep each one well inside the rules' lookup limit
    const PER = 5; let n = 0;
    for (let i = 0; i < list.length; i += PER) {
      const b = FB.db.batch();
      for (const item of list.slice(i, i + PER)) {
        const ref = FB.db.collection('cases').doc();
        const v = FB.curV; const box = await Crypto.sealJSON(FB.keys[v], FB.clean(item.data), 'case:' + ref.id);
        const done = item.status === 'done';
        b.set(ref, { v, iv: box.iv, ct: box.ct, status: done ? 'done' : 'open', rev: 1, by: FB.uid, sid: FB.me.staffId, createdAt: FB.ts(), updatedAt: FB.ts(), closedAt: done ? firebase.firestore.Timestamp.fromMillis(item.closedAt || Date.now()) : null });
        await FB.logOps(b, ref.id, 1, null, item.action || { a: 'create' });
        item.id = ref.id;
      }
      await FB.track(b.commit()); n += Math.min(PER, list.length - i); if (progress) progress(n, list.length);
    }
    return list.map(x => x.id);
  },
  async createCase(data) { const ids = await FB.createCases([{ data, status: 'open' }]); return ids[0]; },
  /* fn(data) edits the latest decrypted copy in place; return 'done' / 'open' to change status */
  /* one person's writes to the same case run one after another, never racing each other */
  queues: {},
  mutateCase(id, fn, action) {
    const run = () => FB._mutate(id, fn, action, 0);
    const p = (FB.queues[id] || Promise.resolve()).then(run, run);
    FB.queues[id] = p.catch(() => { });
    return p;
  },
  async _mutate(id, fn, action, tries) {
    const ref = FB.db.doc('cases/' + id);
    try {
      await FB.track(FB.db.runTransaction(async tx => {
        const s = await tx.get(ref); if (!s.exists) throw errCode('gone');
        const d = s.data(); const data = FB.clean(await FB.decryptDoc(id, d));
        const st = fn(data); const status = st === 'done' || st === 'open' ? st : d.status;
        const v = FB.curV; const box = await Crypto.sealJSON(FB.keys[v], data, 'case:' + id);
        const closedAt = status === 'done' ? (d.status === 'done' && d.closedAt ? d.closedAt : FB.ts()) : null;
        tx.update(ref, { v, iv: box.iv, ct: box.ct, status, rev: d.rev + 1, by: FB.uid, sid: FB.me.staffId, updatedAt: FB.ts(), closedAt });
        await FB.logOps(tx, id, d.rev + 1, { v: d.v, iv: d.iv, ct: d.ct }, action || { a: 'save' });
      }));
    } catch (e) {
      if (tries < 2 && /permission/i.test(e.code || e.message || '')) {
        // the office key may have just been changed: refresh it and try again
        const m = (await FB.db.doc('members/' + FB.uid).get()).data();
        if (!m || !m.active) throw e;
        await FB.loadRing(m);
        await new Promise(r => setTimeout(r, 150 + Math.random() * 350));
        return FB._mutate(id, fn, action, tries + 1);
      }
      throw e;
    }
  },
  /* owner only; the last encrypted copy stays in history, so a delete can be undone */
  async deleteCase(id) {
    const ref = FB.db.doc('cases/' + id);
    await FB.track(FB.db.runTransaction(async tx => {
      const s = await tx.get(ref); if (!s.exists) throw errCode('gone'); const d = s.data();
      await FB.logOps(tx, id, d.rev + 1, { v: d.v, iv: d.iv, ct: d.ct }, { a: 'delete' });
      tx.delete(ref);
    }));
  },
  /* every saved version of one case, newest first (the copy each write replaced, plus the current one) */
  async caseVersions(id) {
    const snap = await FB.db.collection('log').where('caseId', '==', id).get();
    const out = [];
    for (const d of snap.docs) {
      const x = d.data(); if (!x.prev) continue;
      let who = null; try { who = await Crypto.openJSON(FB.keys[x.v], x, 'log:' + d.id); } catch (e) { }
      let data = null; try { data = await Crypto.openJSON(FB.keys[x.prev.v], x.prev, 'case:' + id); } catch (e) { }
      out.push({ rev: x.rev - 1, replacedAt: FB.tsMs(x.at), replacedBy: x.sid, replacedHow: who && who.a, data });
    }
    return out.sort((a, b) => b.rev - a.rev);
  },
  async restoreVersion(id, data) {
    const keep = FB.clean(data);
    return FB.mutateCase(id, d => { Object.keys(d).forEach(k => delete d[k]); Object.assign(d, keep); }, { a: 'restore' });
  },
  /* cases deleted in the last N days, recovered from their history entry */
  async deletedCases(days) {
    const since = firebase.firestore.Timestamp.fromMillis(Date.now() - days * 86400000);
    const snap = await FB.db.collection('log').where('at', '>=', since).get();
    const out = [];
    for (const d of snap.docs) {
      const x = d.data(); if (!x.prev) continue;
      let act = null; try { act = await Crypto.openJSON(FB.keys[x.v], x, 'log:' + d.id); } catch (e) { continue; }
      if (!act || act.a !== 'delete') continue;
      const still = await FB.db.doc('cases/' + x.caseId).get(); if (still.exists) continue;
      try { out.push({ caseId: x.caseId, at: FB.tsMs(x.at), sid: x.sid, data: await Crypto.openJSON(FB.keys[x.prev.v], x.prev, 'case:' + x.caseId) }); } catch (e) { }
    }
    return out.sort((a, b) => b.at - a.at);
  },
  async undelete(item) { return FB.createCases([{ data: item.data, status: 'open', action: { a: 'restore' } }]); },
  async saveSettings(patch) { await FB.track(FB.db.doc('meta/settings').set(patch, { merge: true })); },

  /* ---------- team (owner) ---------- */
  async issue(o, extra) {
    const email = o.username + '.' + o.gen + '@' + STAFF_DOMAIN;
    const temp = tempPassword();
    const sec = firebase.initializeApp(FB.cfg, 'issue' + Date.now());
    let newUid;
    try {
      const sa = sec.auth();
      if (FB.emu) sa.useEmulator('http://127.0.0.1:9099', { disableWarnings: true });
      try { await sa.setPersistence(firebase.auth.Auth.Persistence.NONE); } catch (e) { }
      const c = await sa.createUserWithEmailAndPassword(email, temp); newUid = c.user.uid;
      await sa.signOut();
    } finally { try { await sec.delete(); } catch (e) { } }
    const boot = await Crypto.pwSeal(temp, Crypto.ringBytes(FB.ring), 'boot:' + newUid);
    const b = FB.db.batch();
    b.set(FB.db.doc('members/' + newUid), { staffId: o.sid, username: o.username, name: o.name, role: 'staff', active: true, mustSetup: true, boot, ringV: FB.curV, gen: o.gen, createdAt: FB.ts() });
    b.set(FB.db.doc('roster/' + o.sid), { name: o.name, initials: initials(o.name), role: 'staff', active: true, username: o.username, gen: o.gen });
    b.set(FB.db.doc('logins/' + o.username), { email });
    if (extra) extra(b);
    await FB.track(b.commit());
    return { temp, username: o.username };
  },
  async addStaff(name, username) {
    username = slug(username);
    if (!/^[a-z0-9][a-z0-9.\-]{1,29}$/.test(username)) throw errCode('bad-username');
    const [lg, rs] = await Promise.all([FB.db.doc('logins/' + username).get(), FB.db.doc('roster/' + username).get()]);
    if (lg.exists || (rs.exists && rs.data().active)) throw errCode('taken');
    const gen = (rs.exists ? (rs.data().gen || 0) : 0) + 1;
    return FB.issue({ sid: username, name: name.trim(), username, gen });
  },
  async reissue(sid) {
    const rs = (await FB.db.doc('roster/' + sid).get()).data();
    const olds = (await FB.db.collection('members').where('staffId', '==', sid).get()).docs.filter(d => d.data().active);
    return FB.issue({ sid, name: rs.name, username: rs.username || sid, gen: (rs.gen || 1) + 1 }, b => olds.forEach(d => b.update(d.ref, { active: false })));
  },
  async removeStaff(sid) {
    const rs = (await FB.db.doc('roster/' + sid).get()).data();
    const olds = (await FB.db.collection('members').where('staffId', '==', sid).get()).docs;
    const b = FB.db.batch();
    olds.forEach(d => { if (d.data().active) b.update(d.ref, { active: false }); });
    b.update(FB.db.doc('roster/' + sid), { active: false });
    if (rs.username) b.delete(FB.db.doc('logins/' + rs.username));
    await FB.track(b.commit());
  },
  /* new office key; everyone still active gets it; every case is re-sealed under it */
  async rotate(progress) {
    const newV = FB.curV + 1;
    const ring2 = Object.assign({}, FB.ring, { [newV]: Crypto.newRingKey() });
    const ms = await FB.db.collection('members').get();
    const b = FB.db.batch(); let pendingInvites = 0; const badKeys = [];
    for (const d of ms.docs) {
      const m = d.data(); if (!m.active) continue;
      if (m.pub && m.ring) {
        try { b.update(d.ref, { ring: await Crypto.sealTo(m.pub, Crypto.ringBytes(ring2), 'ring:' + d.id), ringV: newV }); }
        catch (e) { badKeys.push(m.name || m.staffId); }
      } else pendingInvites++;
    }
    const rec = (await FB.db.doc('meta/recovery').get()).data();
    b.update(FB.db.doc('meta/recovery'), { ring: await Crypto.sealTo(rec.pub, Crypto.ringBytes(ring2), 'ring:recovery'), ringV: newV });
    await FB.track(b.commit());
    await FB.track(FB.db.doc('meta/keys').update({ current: newV }));
    FB.ring = ring2; FB.keys = await Crypto.ringKeys(ring2); FB.curV = newV; FB.ringV = newV;
    const all = (await FB.db.collection('cases').get()).docs.filter(d => d.data().v < newV);
    let n = 0, failed = 0;
    for (let i = 0; i < all.length; i += 15) {
      await Promise.all(all.slice(i, i + 15).map(d => FB.mutateCase(d.id, () => { }, { a: 'rekey' }).catch(() => { failed++; })));
      n += Math.min(15, all.length - i); if (progress) progress(n, all.length);
    }
    if (failed) throw errCode('rekey-partial', failed + ' case(s) could not be re-sealed yet');
    return { cases: all.length, pendingInvites, badKeys };
  }
};

/* --- copied unchanged from IPR_Tracker.html so the text matches exactly --- */
const NOTE_DASH = "–";
function iprInit(teeth) { const c = {}; for (let i = 0; i < teeth.length - 1; i++) c[`${teeth[i]}|${teeth[i + 1]}`] = ""; return c; }
function canonContacts(teeth, raw, blank) {
  const src = raw || {}; const c = {};
  for (let i = 0; i < teeth.length - 1; i++) { const k = `${teeth[i]}|${teeth[i + 1]}`; c[k] = src[k] === undefined || src[k] === null ? blank : src[k]; }
  return c;
}
function sumContacts(contacts) { return Object.values(contacts).reduce((s, v) => s + (parseFloat(v) || 0), 0); }
function jp(val, fallback) { if (!val) return fallback; if (typeof val === 'string') { try { return JSON.parse(val); } catch (e) { return fallback; } } return val; }
function addContacts(a, b) { const result = {}; Object.keys(a).forEach(k => { result[k] = String((parseFloat(a[k]) || 0) + (parseFloat(b[k]) || 0)); }); return result; }
function noteRowsOf(obj) { return Object.entries(obj).filter(([, v]) => parseFloat(v) > 0); }
function noteBTsOf(obj) { return Object.entries(obj).filter(([, v]) => v).map(([k]) => k); }
function mm1(v) { return (parseFloat(v) || 0).toFixed(1); }
function ckLabel(k, dash) { return k.split("|").join(dash || NOTE_DASH); }
function listRows(rows, dash, terse) { return rows.map(([k, v]) => terse ? `${ckLabel(k, dash)} ${mm1(v).replace(/^0/, "")}` : `${ckLabel(k, dash)} ${mm1(v)}mm`).join(", "); }
function buildChartNote(o) {
  const uIPR = noteRowsOf(o.upper), lIPR = noteRowsOf(o.lower);
  const uSp = noteRowsOf(o.upperSpaces), lSp = noteRowsOf(o.lowerSpaces);
  const uBT = noteBTsOf(o.upperBT), lBT = noteBTsOf(o.lowerBT);
  const uIPRt = sumContacts(o.upper), lIPRt = sumContacts(o.lower);
  const uSpt = sumContacts(o.upperSpaces), lSpt = sumContacts(o.lowerSpaces);
  const hasIPR = uIPR.length > 0 || lIPR.length > 0;
  const hasSp = uSp.length > 0 || lSp.length > 0;
  const hasBT = uBT.length > 0 || lBT.length > 0;
  const showCum = !!(o.incCum && o.cumUpper && o.visitCount > 1);
  const cUt = o.cumUpper ? sumContacts(o.cumUpper) : 0;
  const cLt = o.cumLower ? sumContacts(o.cumLower) : 0;
  // "lines" format — the IPR Tracker's default
  const blocks = [];
  if (o.incIPR) {
    const s = ["IPR THIS VISIT"];
    if (hasIPR) {
      if (uIPR.length) s.push(`Upper: ${listRows(uIPR)} (${mm1(uIPRt)}mm)`);
      if (lIPR.length) s.push(`Lower: ${listRows(lIPR)} (${mm1(lIPRt)}mm)`);
      s.push(`Total: ${mm1(uIPRt + lIPRt)}mm`);
    } else s.push("None this visit");
    blocks.push(s.join("\n"));
  }
  const sp = ["SPACING"];
  if (hasSp) {
    if (uSp.length) sp.push(`Upper: ${listRows(uSp)} (${mm1(uSpt)}mm)`);
    if (lSp.length) sp.push(`Lower: ${listRows(lSp)} (${mm1(lSpt)}mm)`);
    sp.push(`Total: ${mm1(uSpt + lSpt)}mm`);
  } else sp.push("None noted");
  blocks.push(sp.join("\n"));
  const bt = ["BLACK TRIANGLES"];
  if (hasBT) {
    if (uBT.length) bt.push(`Upper: ${uBT.map(k => ckLabel(k)).join(", ")}`);
    if (lBT.length) bt.push(`Lower: ${lBT.map(k => ckLabel(k)).join(", ")}`);
    bt.push(`Total: ${uBT.length + lBT.length}`);
  } else bt.push("None noted");
  blocks.push(bt.join("\n"));
  if (showCum) blocks.push(`CUMULATIVE IPR (${o.visitCount} visits)\nUpper: ${mm1(cUt)}mm   Lower: ${mm1(cLt)}mm   Total: ${mm1(cUt + cLt)}mm`);
  return blocks.join("\n\n");
}

/* Build the note for the newest visit of a patient's visit list (pure; used by tests too). */
function iprNoteFromVisits(visits) {
  const vs = visits.slice().sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')) || String(b.created_at || '').localeCompare(String(a.created_at || '')));
  const v = vs[0];
  const cum = (key, teeth) => vs.reduce((acc, x) => addContacts(acc, canonContacts(teeth, jp(x[key], null), "")), iprInit(teeth));
  return {
    date: v.date || '', assistant: v.assistant_initials || '', visits: vs.length,
    note: buildChartNote({
      upper: canonContacts(IPR_UPPER, jp(v.upper_ipr, null), ""), lower: canonContacts(IPR_LOWER, jp(v.lower_ipr, null), ""),
      upperSpaces: canonContacts(IPR_UPPER, jp(v.upper_spaces, null), ""), lowerSpaces: canonContacts(IPR_LOWER, jp(v.lower_spaces, null), ""),
      upperBT: canonContacts(IPR_UPPER, jp(v.upper_bt, null), false), lowerBT: canonContacts(IPR_LOWER, jp(v.lower_bt, null), false),
      incIPR: true, incCum: true, cumUpper: cum('upper_ipr', IPR_UPPER), cumLower: cum('lower_ipr', IPR_LOWER), visitCount: vs.length
    })
  };
}

const IPR = {
  app: null, auth: null, db: null, emu: false,
  init() {

    IPR.app = firebase.initializeApp(cfg, 'ipr');

    if (IPR.emu) { IPR.auth.useEmulator('http://127.0.0.1:9099', { disableWarnings: true }); IPR.db.useEmulator('127.0.0.1', 9000); }
    // this tab only, and signed out whenever NLO Cases locks (so it never outlives the person's session)
    try { IPR.auth.setPersistence(firebase.auth.Auth.Persistence.SESSION); } catch (e) { }
    return true;
  },
  user() { return IPR.auth && IPR.auth.currentUser; },
  waitUser() { return new Promise(res => { const off = IPR.auth.onAuthStateChanged(u => { off(); res(u); }); }); },
  async connect() {

    return IPR.auth.signInWithPopup(p);
  },
  async disconnect() { if (IPR.auth) await IPR.auth.signOut(); },
  norm(id) { return String(id || '').toLowerCase().replace(/[^a-z0-9]/g, ''); },
  /* { status: 'not-found' | 'no-visits' | 'ok', note, date, visits, assistant, initials } */
  async latest(chart) {
    const n = IPR.norm(chart); if (!n) return { status: 'not-found' };
    const snap = await IPR.db.ref('nlo/ipr/patients').once('value');
    const pts = Object.values(snap.val() || {}).filter(p => IPR.norm(p.patient_id) === n);
    if (!pts.length) return { status: 'not-found' };
    let visits = [];
    for (const p of pts) { const s = await IPR.db.ref('nlo/ipr/visits/' + p.id).once('value'); visits = visits.concat(Object.values(s.val() || {})); }
    if (!visits.length) return { status: 'no-visits', initials: pts[0].name || '' };

  }
};

function errText(e) {
  const c = (e && (e.code || e.message)) || '';
  if (/no-user/.test(c)) return 'No login with that username.';
  if (/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return 'Username or password is incorrect.';
  if (/inactive/.test(c)) return 'This login has been turned off. Ask Dr. A.';
  if (/not-member/.test(c)) return 'That account isn’t part of the office.';
  if (/no-setup/.test(c)) return 'The office hasn’t been set up yet.';
  if (/too-many-requests/.test(c)) return 'Too many attempts. Wait a minute and try again.';
  if (/network|unavailable/.test(c)) return 'Can’t reach the server. Check the internet connection.';
  if (/email-already-in-use/.test(c)) return 'An account with that email already exists.';
  if (/weak-password/.test(c)) return 'Password needs at least 8 characters.';
  if (/invalid-email/.test(c)) return 'That email address doesn’t look right.';
  if (/boot-failed/.test(c)) return 'That temporary password didn’t work. Ask Dr. A to reissue your login.';
  if (/boot-stale/.test(c)) return 'This invite expired after a security update. Ask Dr. A to reissue your login.';
  if (/bad-code/.test(c)) return 'That recovery code didn’t work. Check it and try again.';
  if (/taken/.test(c)) return 'That username is already in use.';
  if (/bad-username/.test(c)) return 'Usernames are 2–30 letters or numbers (dots and dashes OK).';
  if (/permission/.test(c)) return 'Not allowed. Your access may have changed.';
  if (/gone/.test(c)) return 'That case no longer exists.';
  if (/requires-recent-login/.test(c)) return 'Please sign in again, then retry.';
  return (e && e.message) ? String(e.message).replace(/^Firebase:\s*/, '') : 'Something went wrong.';
}

    try { await B.recover(S.loginPw, $('#recCode').value); S.loginPw = ''; toast('Unlocked. Your recovery code still works — keep it safe.'); enterApp(); }
    catch (x) { lockScreen('recover', { err: errText(x) }); }
  };
  const fg = $('#forgotForm');
  if (fg) fg.onsubmit = async e => {
    e.preventDefault();
    try { await B.sendReset($('#fgEmail').value.trim()); lockScreen('forgot', { ok: 'If that email has a login, a reset link is on its way.' }); }
    catch (x) { lockScreen('forgot', { err: errText(x) }); }
  };
  const sf = $('#setupForm');
  if (sf) sf.onsubmit = async e => {
    e.preventDefault(); const p1 = $('#suPw1').value, p2 = $('#suPw2').value;
    if (p1.length < 10) return lockScreen('setup', { err: 'Use at least 10 characters.' });
    if (p1 !== p2) return lockScreen('setup', { err: 'The two passwords don’t match.' });
    const btn = $('button[type=submit]', sf); busyBtn(btn, true, 'Creating…');
    S.setup = { name: $('#suName').value.trim(), email: $('#suEmail').value.trim(), pw: p1 };
    try {
      const verified = await B.setupAccount(S.setup.email, p1);
      if (verified) await finishSetup(); else lockScreen('verify');
    } catch (x) { lockScreen('setup', { err: errText(x) }); }
  };
  const vf = $('#verifyForm');
  if (vf) vf.onsubmit = async e => {
    e.preventDefault(); const btn = $('button[type=submit]', vf); busyBtn(btn, true, 'Checking…');
    try { if (await B.setupVerified()) await finishSetup(); else lockScreen('verify', { err: 'Not verified yet. Open the link in the email, then press Continue.' }); }
    catch (x) { lockScreen('verify', { err: errText(x) }); }
  };
  const ack = $('#codeAck'); if (ack) ack.onchange = () => { $('#codeDone').disabled = !ack.checked; };
}

/* ---------- enter / leave ---------- */
function enterApp() {
  S.inApp = true; S.cases = new Map(); S.closed = []; S.firstLoad = true; S.lastAct = Date.now();
  $('#lockWrap').classList.add('hidden'); $('#app').classList.remove('hidden');
  renderShell(); renderView();
  B.start({
    cases(up, gone) {
      up.forEach(c => S.cases.set(c.id, c)); gone.forEach(id => S.cases.delete(id));
      S.firstLoad = false; queueRender();
      if (S.openId && (up.some(c => c.id === S.openId) || gone.includes(S.openId))) refreshDrawer(gone.includes(S.openId));
    },
    roster(list) { S.roster = list; queueRender('team'); },
    members(list) { S.members = list; if (S.view === 'admin') queueRender('team'); },
    settings(s) { S.settings = Object.assign({ idleMin: 10 }, s || {}); if (S.view === 'admin') queueRender('team'); },
    revoked() { lockOut('Your access to NLO Cases was turned off.'); },
    rekeyed() { },
    error(e) { if (/permission/.test((e && e.code) || '')) lockOut('Your access changed. Sign in again.'); else toast(errText(e), { bad: true }); }
  });
  clearInterval(S.idleTimer);
  S.idleTimer = setInterval(() => {
    const mins = Number(S.settings.idleMin) || 10;
    if (S.inApp && Date.now() - S.lastAct > mins * 60000) lockOut('Locked after ' + mins + ' minutes without activity.');
  }, 15000);
}
async function lockOut(msg) {
  if (!S.inApp) return;
  S.inApp = false; clearInterval(S.idleTimer);
  closeModal(); closeDrawer(true);
  S.cases = new Map(); S.closed = []; S.members = []; S.roster = []; S.iprCache = {}; S.verList = null; S.delList = null; S.impList = null;
  try { await iprLink().disconnect(); } catch (e) { }
  $('#view').innerHTML = '';
  await B.signOut();
  lockScreen('login', { ok: msg });
}

/* ---------- derived data ---------- */
function meSid() { return B.me ? B.me.staffId : ''; }
function isOwner() { return B.isOwner(); }
function staff(sid) { return S.roster.find(r => r.sid === sid); }
function staffName(sid, fallback) { const r = staff(sid); return r ? r.name : (fallback || ''); }
function activeRoster() { return S.roster.filter(r => r.active).sort((a, b) => (a.role === 'owner' ? -1 : 0) - (b.role === 'owner' ? -1 : 0) || a.name.localeCompare(b.name)); }
function openCases() { return Array.from(S.cases.values()).filter(c => !c.locked); }
function matchesQ(c) {
  if (!S.q) return true; const q = S.q.toLowerCase();
  return [c.patient, c.chart, c.detail, typeOf(c).l, stageLabel(c), staffName(c.assignee, c.assigneeName)].some(x => String(x || '').toLowerCase().includes(q));
}
function dueBucket(c) {
  const d = dayDiff(c.dueDate); if (d === null) return 'none';
  if (d < 0) return 'over'; if (d === 0) return 'today'; if (d <= 6) return 'week'; if (d <= 14) return '14'; return 'later';
}
function byDue(a, b) {
  const x = a.dueDate || '9999', y = b.dueDate || '9999';
  return x < y ? -1 : x > y ? 1 : String(a.patient).localeCompare(String(b.patient));
}
function counts() {
  const all = openCases(); const me = meSid();
  return {
    all: all.length,
    over: all.filter(c => dueBucket(c) === 'over').length,
    week: all.filter(c => ['today', 'week'].includes(dueBucket(c))).length,
    dr: all.filter(c => DR_STAGES.includes(c.stage)).length,
    fab: all.filter(c => FAB_STAGES.includes(c.stage)).length,
    arrived: all.filter(c => c.stage === 'arrived').length,
    mine: all.filter(c => c.assignee === me).length
  };
}

/* ---------- rendering ---------- */
/* live updates redraw data screens only; Team & security redraws for team/settings changes;
   screens holding typed input (import, account) keep their state */
function queueRender(kind) {
  S.renderKinds = (S.renderKinds || new Set()); S.renderKinds.add(kind || 'cases');
  if (S.renderQ) return; S.renderQ = true;
  requestAnimationFrame(() => {
    S.renderQ = false; const kinds = S.renderKinds; S.renderKinds = new Set(); if (!S.inApp) return;
    renderNav();
    if (S.view === 'import' || S.view === 'account') return;
    if (S.view === 'admin' && !kinds.has('team')) return;
    renderView();
  });
}
const NAV = [

const TITLES = { today: 'Today', board: 'Board', list: 'All open cases', mine: 'My cases', done: 'Completed', admin: 'Team & security', import: 'Import & export', account: 'My account' };

/* ---------- small pieces ---------- */
function typeBadge(c) { const t = typeOf(c); return '<span class="badge ' + t.cls + '">' + esc(t.l) + '</span>'; }
function dueChip(c) {
  if (!c.dueDate) return '<span class="due none">No due date</span>';
  const d = dayDiff(c.dueDate);
  if (d < 0) return '<span class="due over" title="' + esc(fmtDay(c.dueDate)) + '">' + ic('clock', 13) + (d === -1 ? '1 day late' : (-d) + ' days late') + '</span>';
  if (d === 0) return '<span class="due soon">' + ic('clock', 13) + 'Due today</span>';
  if (d === 1) return '<span class="due soon">' + ic('clock', 13) + 'Tomorrow</span>';
  if (d <= 3) return '<span class="due soon">' + ic('clock', 13) + esc(fmtDay(c.dueDate)) + '</span>';
  return '<span class="due">' + esc(fmtDate(c.dueDate)) + '</span>';
}
function avatar(c) {
  const r = staff(c.assignee);
  if (r) return '<span class="av" title="' + esc(r.name) + '">' + esc(r.initials || initials(r.name)) + '</span>';
  if (c.assigneeName) return '<span class="av none" title="' + esc(c.assigneeName) + '">' + esc(initials(c.assigneeName)) + '</span>';

}
function row(c, meta) {

    '<span class="grow"><span class="pt">' + esc(c.patient || '(no name)') + '</span><span class="meta">' + esc(meta != null ? meta : (typeOf(c).l + ' · ' + stageLabel(c) + (c.detail ? ' · ' + c.detail : ''))) + '</span></span>' + dueChip(c) + '</button>';
}

/* ---------- Today ---------- */
function viewToday() {
  const c = counts(); const all = openCases().filter(matchesQ);
  if (S.firstLoad && !S.demo) return '<div class="empty">Loading cases…</div>';
  const tile = (n, l, cls, act) => '<button class="tile ' + cls + '" data-act="tile" data-f="' + act + '"><span class="n">' + n + '</span><span class="l">' + l + '</span></button>';
  let h = '<div class="tiles">' + tile(c.over, 'Overdue', 'red', 'over') + tile(c.week, 'Due in the next 7 days', 'amber', 'week') + tile(c.dr, 'Needs Dr. A', 'blue', 'dr') +
    tile(c.fab, 'In fabrication', '', 'fab') + tile(c.arrived, 'Arrived — check in', 'mint', 'arrived') + tile(c.mine, 'Assigned to me', '', 'mine') + '</div>';
  const soon = all.filter(x => x.dueDate && dayDiff(x.dueDate) <= 14).sort(byDue);
  const groups = [];
  soon.forEach(x => {
    const d = dayDiff(x.dueDate);
    const key = d < 0 ? 'Overdue' : d === 0 ? 'Today' : d === 1 ? 'Tomorrow' : fmtDay(x.dueDate);
    let g = groups.find(g => g.k === key); if (!g) { g = { k: key, red: d < 0, items: [] }; groups.push(g); } g.items.push(x);
  });
  const left = '<div class="card"><div class="cardHd"><h3>Coming up</h3><span class="sub">Overdue and the next 14 days</span></div><div class="cardBd">' +
    (groups.length ? groups.map(g => '<div class="dueGrp"><h4 class="' + (g.red ? 'red' : '') + '">' + esc(g.k) + ' · ' + g.items.length + '</h4>' + g.items.map(x => row(x)).join('') + '</div>').join('') :
      '<div class="empty">Nothing due in the next two weeks.</div>') + '</div></div>';
  const dr = all.filter(x => DR_STAGES.includes(x.stage)).sort(byDue);
  const noDate = all.filter(x => !x.dueDate).length;
  const right = '<div class="card"><div class="cardHd"><h3>Needs Dr. A</h3><span class="sub">' + dr.length + ' waiting</span></div><div class="cardBd">' +
    (dr.length ? dr.map(x => row(x)).join('') : '<div class="empty">Nothing waiting on Dr. A.</div>') + '</div></div>' +
    (noDate ? '<div class="card" style="margin-top:14px"><div class="cardBd" style="padding:14px 20px"><button class="linkBtn" data-act="tile" data-f="none">' + noDate + ' open case' + (noDate > 1 ? 's have' : ' has') + ' no due date</button></div></div>' : '');
  return h + '<div class="twoCol"><div>' + left + '</div><div>' + right + '</div></div>';
}

/* ---------- Board ---------- */
function viewBoard() {
  const all = openCases().filter(matchesQ);
  const flowsUsed = Object.keys(FLOWS);
  let h = '<div class="boardTabs" role="tablist">' + flowsUsed.map(k => {
    const n = all.filter(c => typeOf(c).flow === k).length;
    return '<button class="chip' + (S.boardFlow === k ? ' on' : '') + '" role="tab" aria-selected="' + (S.boardFlow === k) + '" data-act="flow" data-k="' + k + '">' + esc(FLOWS[k].label) + '<span class="c">' + n + '</span></button>';
  }).join('') + '</div>';

  h += '<div class="board">' + flow.stages.map(([sk, sl], i) => {
    const items = inFlow.filter(c => c.stage === sk || (i === 0 && !flow.stages.some(s => s[0] === c.stage))).sort(byDue);
    return '<section class="col" aria-label="' + esc(sl) + '"><div class="colHd"><h4>' + esc(sl) + '</h4><span class="c">' + items.length + '</span></div><div class="colBd">' +

  }).join('') + '</div>';

}
function kcard(c, last) {
  const mixed = S.boardFlow === 'outside' || S.boardFlow === 'inhouse' || S.boardFlow === 'retainer';
  return '<div class="kc" data-act="open" data-id="' + esc(c.id) + '" role="button" tabindex="0">' +

    '<button class="adv" data-act="' + (last ? 'complete' : 'advance') + '" data-id="' + esc(c.id) + '" title="' + (last ? 'Mark complete' : 'Move to next stage') + '" aria-label="' + (last ? 'Mark complete' : 'Move to next stage') + '">' + ic(last ? 'done' : 'next', 17) + '</button></div></div>';
}

/* ---------- List ---------- */
function applyFilters(list) {
  const f = S.f;
  return list.filter(c => {
    if (!matchesQ(c)) return false;
    if (f.type && c.type !== f.type) return false;
    if (f.stage && c.stage !== f.stage) return false;
    if (f.who === '_none' && (c.assignee || c.assigneeName)) return false;
    if (f.who && f.who !== '_none' && c.assignee !== f.who) return false;
    if (f.due) { const b = dueBucket(c); if (f.due === 'week' ? !['today', 'week'].includes(b) : f.due === '14' ? !['today', 'week', '14'].includes(b) : b !== f.due) return false; }
    if (f.grp === 'dr' && !DR_STAGES.includes(c.stage)) return false;
    if (f.grp === 'fab' && !FAB_STAGES.includes(c.stage)) return false;
    if (f.grp === 'arrived' && c.stage !== 'arrived') return false;
    return true;
  });
}
function sortList(list) {
  const { k, dir } = S.sort;
  const val = c => k === 'patient' ? String(c.patient || '').toLowerCase() : k === 'type' ? typeOf(c).l : k === 'stage' ? stageIndex(c) : k === 'who' ? staffName(c.assignee, c.assigneeName) : k === 'updated' ? -(c.updatedAt || 0) : (c.dueDate || '9999');
  return list.slice().sort((a, b) => { const x = val(a), y = val(b); return (x < y ? -1 : x > y ? 1 : byDue(a, b)) * dir; });
}
function viewList(base, showWho) {
  if (S.firstLoad && !S.demo) return '<div class="empty">Loading cases…</div>';
  const f = S.f;
  const stageOpts = f.type ? FLOWS[TYPE[f.type].flow].stages : [];
  const grpLabel = { dr: 'Needs Dr. A', fab: 'In fabrication', arrived: 'Arrived' }[f.grp];
  let h = '<div class="filters">' +
    '<select data-f="type" aria-label="Type"><option value="">All types</option>' + typesShown(Array.from(S.cases.values()), f.type).map(t => '<option value="' + t.k + '"' + (f.type === t.k ? ' selected' : '') + '>' + esc(t.l) + '</option>').join('') + '</select>' +
    (stageOpts.length ? '<select data-f="stage" aria-label="Stage"><option value="">All stages</option>' + stageOpts.map(([k, l]) => '<option value="' + k + '"' + (f.stage === k ? ' selected' : '') + '>' + esc(l) + '</option>').join('') + '</select>' : '') +
    (showWho ? '<select data-f="who" aria-label="Assigned to"><option value="">Anyone</option><option value="_none"' + (f.who === '_none' ? ' selected' : '') + '>Unassigned</option>' + activeRoster().map(r => '<option value="' + esc(r.sid) + '"' + (f.who === r.sid ? ' selected' : '') + '>' + esc(r.name) + '</option>').join('') + '</select>' : '') +
    '<select data-f="due" aria-label="Due"><option value="">Any due date</option>' + [['over', 'Overdue'], ['today', 'Due today'], ['week', 'Next 7 days'], ['14', 'Next 14 days'], ['none', 'No due date']].map(([k, l]) => '<option value="' + k + '"' + (f.due === k ? ' selected' : '') + '>' + l + '</option>').join('') + '</select>' +
    (grpLabel ? '<button class="chip on" data-act="clearGrp">' + esc(grpLabel) + ' ✕</button>' : '') +
    ((f.type || f.stage || f.who || f.due || f.grp) ? '<button class="btn btn-ghost" data-act="clearF">Clear filters</button>' : '') + '</div>';
  const list = sortList(applyFilters(base));
  if (!list.length) return h + '<div class="card"><div class="empty">' + (base.length ? 'No cases match.' : 'No open cases yet.') + '</div></div>';
  const th = (k, l, cls) => '<th class="' + (cls || '') + '"><button data-act="sort" data-k="' + k + '">' + l + (S.sort.k === k ? (S.sort.dir > 0 ? ' ↑' : ' ↓') : '') + '</button></th>';
  h += '<div class="card tblWrap"><table class="tbl"><thead><tr>' + th('patient', 'Patient') + th('type', 'Type', 'hideM') + th('stage', 'Stage') + th('due', 'Due') + th('who', 'Assigned', 'hideM') + th('updated', 'Updated', 'hideM') + '</tr></thead><tbody>' +
    list.map(c => '<tr class="click" data-act="open" data-id="' + esc(c.id) + '" tabindex="0"><td><div class="pt">' + esc(c.patient || '(no name)') + '</div><div class="small muted">' + esc(c.detail || '') + '</div></td>' +
      '<td class="hideM">' + typeBadge(c) + '</td><td>' + esc(stageLabel(c)) + '</td><td>' + dueChip(c) + '</td>' +
      '<td class="hideM">' + avatar(c) + ' <span class="small">' + esc(staffName(c.assignee, c.assigneeName)) + '</span></td><td class="hideM small muted">' + esc(c.updatedAt ? fmtWhen(c.updatedAt) : '') + '</td></tr>').join('') +
    '</tbody></table></div><div class="small muted" style="margin-top:8px">' + list.length + ' case' + (list.length === 1 ? '' : 's') + '</div>';
  return h;
}

/* ---------- Completed ---------- */
function viewDone() {
  if (!S.closedLoaded) { loadClosed(); return '<div class="empty">Loading completed cases…</div>'; }

  if (!list.length) return h + '<div class="card"><div class="empty">No completed cases' + (S.q ? ' match' : '') + '.</div></div>';

    list.map(c => '<tr class="click" data-act="openClosed" data-id="' + esc(c.id) + '" tabindex="0"><td><div class="pt">' + esc(c.patient) + '</div><div class="small muted">' + esc(c.detail || '') + '</div></td><td class="hideM">' + typeBadge(c) + '</td><td class="small">' + esc(fmtWhen(c.closedAt)) + '</td><td class="hideM small">' + esc(stageLabel(c)) + '</td></tr>').join('') +

async function loadClosed() {

/* ---------- Drawer ---------- */

async function iprAutoLoad(c, force) {

/* ---------- modals ---------- */
function openModal(html, onReady) {

  w.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + '</div>';
  // a stray click outside a case form must not throw away what was tapped in
  w.addEventListener('mousedown', e => { if (e.target === w && !w.querySelector('#ncForm')) closeModal(); });
  document.body.appendChild(w);
  const f = $('input:not([type=hidden]),select,textarea', w); if (f) f.focus();

}
function closeModal() { const w = $('#modalWrap'); if (w) w.remove(); }
/* text is plain text (escaped here), never HTML */

  return new Promise(res => {
    openModal('<h3>' + esc(title) + '</h3><p class="lsub" style="font-size:13.5px;color:var(--grey-600)">' + esc(text) + '</p><div class="mFt"><button class="btn btn-sec" id="cbNo">Cancel</button><button class="btn ' + (danger ? 'btn-danger' : 'btn-pri') + '" id="cbYes">' + esc(okLabel) + '</button></div>', w => {
      $('#cbNo', w).onclick = () => { closeModal(); res(false); }; $('#cbYes', w).onclick = () => { closeModal(); res(true); }; $('#cbYes', w).focus();

/* New case / edit form: fill the IPR box from the IPR Tracker using the chart # */
async function iprPull(btn) {
  const root = btn.closest('.modal') || $('#drawer'); const msg = $('#cf-iprMsg', root);
  const chart = ($('#cf-chart', root).value || '').trim();
  if (!chart) { msg.textContent = 'Enter the chart # first.'; return; }
  const L = iprLink(); if (!L.init()) { msg.textContent = 'IPR link unavailable in this browser.'; return; }
  try {
    if (!L.user()) await L.connect();
    msg.textContent = 'Reading the IPR Tracker…';
    const r = await L.latest(chart);
    if (r.status === 'not-found') { msg.textContent = 'No IPR Tracker patient with chart # ' + chart + '.'; return; }
    if (r.status === 'no-visits') { msg.textContent = 'Patient found, but no visits recorded yet.'; return; }
    $('#cf-ipr', root).value = r.note; msg.textContent = 'From the visit on ' + fmtDay(r.date) + (r.initials ? ' (' + r.initials + ')' : '') + '.';
  } catch (e) { msg.textContent = /popup/i.test(String(e && (e.code || e.message))) ? 'Allow pop-ups for this site, then try again.' : /permission|denied/i.test(String(e && (e.code || e.message))) ? 'This Google account can’t read the IPR Tracker.' : 'Couldn’t reach the IPR Tracker.'; }
}

/* ---------- actions ---------- */
async function act(fn, okMsg) { try { await fn(); if (okMsg) toast(okMsg); } catch (e) { toast(errText(e), { bad: true }); } }
function nextStage(c) { const st = flowOf(c).stages; const i = stageIndex(c); return i >= 0 && i < st.length - 1 ? st[i + 1][0] : null; }
async function moveStage(id, to) {
  const c = findCase(id); if (!c || c.stage === to) return;
  const from = c.stage; c.stage = to; queueRender(); if (S.openId === id) renderDrawer();
  try { await B.mutateCase(id, d => { d.stage = to; }, { a: 'stage', from, to }); }
  catch (e) { c.stage = from; queueRender(); if (S.openId === id) renderDrawer(); toast(errText(e), { bad: true }); }
}
async function completeCase(id) {
  const c = findCase(id); if (!c) return;
  try {
    await B.mutateCase(id, () => 'done', { a: 'close' });
    if (S.openId === id) closeDrawer(true);
    S.closedLoaded = false;
    toast((c.patient || 'Case') + ' marked complete', { action: 'Undo', onAction: () => act(() => B.mutateCase(id, () => 'open', { a: 'reopen' }), 'Reopened') });
  } catch (e) { toast(errText(e), { bad: true }); }
}
function onClick(e) {

  const a = t.dataset.act; const id = t.dataset.id;
  if (t.tagName === 'SELECT') return;
  if (a === 'advance' || a === 'complete') { e.stopPropagation(); }
  switch (a) {
    case 'nav': S.view = t.dataset.v; if (S.view !== 'list') S.f = { type: '', stage: '', who: '', due: '', grp: '' }; renderNav(); renderView(); window.scrollTo(0, 0); break;
    case 'tile': { const f = t.dataset.f; S.f = { type: '', stage: '', who: '', due: '', grp: '' };
      if (f === 'mine') { S.view = 'mine'; } else { S.view = 'list'; if (['over', 'week', 'none'].includes(f)) S.f.due = f; else S.f.grp = f; }
      renderNav(); renderView(); break; }
    case 'flow': S.boardFlow = t.dataset.k; renderView(); break;
    case 'open': openDrawer(id); break;
    case 'openClosed': openDrawer(id); break;
    case 'closeDrawer': closeDrawer(); break;
    case 'advance': { const c = findCase(id); const n = c && nextStage(c); if (n) moveStage(id, n); break; }
    case 'complete': completeCase(id); break;
    case 'setStage': moveStage(S.openId, t.dataset.k); break;
    case 'reopen': act(async () => { await B.mutateCase(S.openId, () => 'open', { a: 'reopen' }); S.closed = S.closed.filter(c => c.id !== S.openId); closeDrawer(true); }, 'Reopened'); break;
    case 'addCmt': { const txt = ($('#cmtText').value || '').trim(); if (!txt) return; const cid = S.openId;
      $('#cmtText').value = ''; act(() => B.mutateCase(cid, d => { d.comments = (d.comments || []).concat([{ id: uid8(), at: Date.now(), by: meSid(), text: txt }]); }, { a: 'comment' })); break; }
    case 'edit': { const c = findCase(S.openId); S.editBase = JSON.parse(JSON.stringify(c)); S.editing = true; renderDrawer(); break; }
    case 'cancelEdit': S.editing = false; renderDrawer(); break;
    case 'saveEdit': saveEdit(); break;
    case 'delCase': (async () => { const c = findCase(S.openId); if (await confirmBox('Delete this case?', 'This removes ' + c.patient + ' from every list. Dr. A can bring it back from Team & security for 90 days. To finish a case normally, use “Mark complete” instead.', 'Delete', true)) { const cid = S.openId; closeDrawer(true); act(() => B.deleteCase(cid), 'Case deleted'); } })(); break;
    case 'newCase': newCaseModal(); break;
    case 'closeModal': closeModal(); break;
    case 'clearF': S.f = { type: '', stage: '', who: '', due: '', grp: '' }; renderView(); break;
    case 'clearGrp': S.f.grp = ''; renderView(); break;
    case 'sort': { const k = t.dataset.k; S.sort = { k, dir: S.sort.k === k ? -S.sort.dir : 1 }; renderView(); break; }

    case 'lock': lockOut('Locked. Sign in to continue.'); break;
    case 'lockSignOut': B.signOut().then(() => lockScreen('login')); break;
    case 'forgot': lockScreen('forgot'); break;
    case 'toLogin': lockScreen('login'); break;
    case 'copyCode': navigator.clipboard && navigator.clipboard.writeText(t.dataset.code).then(() => toast('Copied')); break;
    case 'printCode': printCode(); break;
    case 'codeDone': enterApp(); break;
