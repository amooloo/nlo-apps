const NLO_RULES = "rules_version = '2';\n// NLO Cases \u2014 Firestore security rules.\n// Case bodies are encrypted in the browser; these rules decide WHO may read or\n// write the ciphertext, keep the history log append-only, and stop anyone who\n// is not an active member (or a removed member) from touching anything.\nservice cloud.firestore {\n  match /databases/{db}/documents {\n    function authed() { return request.auth != null; }\n    function hasSetup() { return exists(/databases/$(db)/documents/meta/setup); }\n    function isOwner() { return authed() && hasSetup() && get(/databases/$(db)/documents/meta/setup).data.owner == request.auth.uid; }\n    function myDoc() { return /databases/$(db)/documents/members/$(request.auth.uid); }\n    function isMember() { return authed() && exists(myDoc()) && get(myDoc()).data.active == true; }\n    function mySid() { return get(myDoc()).data.staffId; }\n    function curV() { return get(/databases/$(db)/documents/meta/keys).data.current; }\n    // true only inside the one-time office setup batch, and only for the practice owner's\n    // verified email address (stops anyone else claiming an empty office)\n    function bootstrapping() {\n      return authed() && !hasSetup()\n        && request.auth.token.email == '__OWNER_EMAIL__' && request.auth.token.email_verified == true\n        && getAfter(/databases/$(db)/documents/meta/setup).data.owner == request.auth.uid;\n    }\n    // a public key must look like a P-256 JWK (the owner's client also tolerates bad ones)\n    function okPub(d) {\n      return !('pub' in d) || (d.pub is map && d.pub.keys().hasOnly(['kty', 'crv', 'x', 'y'])\n        && d.pub.kty == 'EC' && d.pub.crv == 'P-256' && d.pub.x is string && d.pub.y is string\n        && d.pub.x.size() == 43 && d.pub.y.size() == 43);\n    }\n\n    match /meta/setup {\n      allow get: if isMember();\n      allow create: if bootstrapping()\n        && request.resource.data.keys().hasOnly(['owner', 'at'])\n        && request.resource.data.owner == request.auth.uid\n        && request.resource.data.at == request.time\n        && getAfter(myDoc()).data.role == 'owner';\n      allow update, delete: if false;\n    }\n    match /meta/keys {\n      allow get: if isMember();\n      allow create: if bootstrapping() && request.resource.data.keys().hasOnly(['current']) && request.resource.data.current == 1;\n      allow update: if isOwner() && request.resource.data.keys().hasOnly(['current'])\n        && request.resource.data.current == resource.data.current + 1;\n      allow delete: if false;\n    }\n    match /meta/settings {\n      allow get: if isMember();\n      allow create: if bootstrapping() || isOwner();\n      allow update: if isOwner();\n      allow delete: if false;\n    }\n    match /meta/recovery {\n      allow get: if isOwner();\n      allow create: if bootstrapping() || isOwner();\n      allow update: if isOwner();\n      allow delete: if false;\n    }\n    // username -> sign-in address. Readable one at a time (needed before sign-in), never listable.\n    match /logins/{name} {\n      allow get: if true;\n      allow list: if false;\n      allow create, update: if isOwner() && request.resource.data.keys().hasOnly(['email']) && request.resource.data.email is string;\n      allow delete: if isOwner();\n    }\n    match /members/{uid} {\n      allow get: if authed() && (request.auth.uid == uid || isOwner());\n      allow list: if isOwner();\n      allow create: if (isOwner() && request.resource.data.role == 'staff')\n        || (bootstrapping() && uid == request.auth.uid && request.resource.data.role == 'owner' && request.resource.data.active == true);\n      // the owner manages everyone (and can never demote themself); a person may only\n      // update their own key material, and only while still active\n      allow update: if (isOwner() && (uid != request.auth.uid || (request.resource.data.role == 'owner' && request.resource.data.active == true)))\n        || (authed() && request.auth.uid == uid && resource.data.active == true\n            && (!request.resource.data.diff(resource.data).affectedKeys().hasAny(['pub']) || okPub(request.resource.data))\n            && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['pub', 'priv', 'privPrev', 'ring', 'ringV', 'boot', 'mustSetup', 'lastLogin']));\n      allow delete: if false;\n    }\n    match /roster/{sid} {\n      allow read: if isMember();\n      allow create, update: if isOwner() || bootstrapping();\n      allow delete: if false;\n    }\n    // Every write to a case must come with a history entry, at the fixed id \"<case>_<rev>\",\n    // holding the previous encrypted copy. History can't be edited or deleted, so any\n    // overwrite \u2014 buggy, careless or malicious \u2014 can be undone from it.\n    function histAfter(id, rev) { return existsAfter(/databases/$(db)/documents/log/$(id + '_' + string(rev))); }\n    match /cases/{id} {\n      function okCase() {\n        let d = request.resource.data;\n        return d.keys().hasOnly(['v', 'iv', 'ct', 'status', 'rev', 'by', 'sid', 'createdAt', 'updatedAt', 'closedAt'])\n          && d.v == curV() && d.iv is string && d.ct is string && d.ct.size() < 600000\n          && d.rev is int && d.by == request.auth.uid && d.sid == mySid()\n          && d.updatedAt == request.time\n          && ((d.status == 'open' && d.closedAt == null) || (d.status == 'done' && d.closedAt is timestamp));\n      }\n      allow read: if isMember();\n      allow create: if isMember() && okCase() && request.resource.data.rev == 1\n        && request.resource.data.createdAt == request.time && histAfter(id, 1);\n      allow update: if isMember() && okCase() && request.resource.data.rev == resource.data.rev + 1\n        && request.resource.data.createdAt == resource.data.createdAt && histAfter(id, request.resource.data.rev);\n      allow delete: if isOwner() && histAfter(id, resource.data.rev + 1);\n    }\n    match /log/{lid} {\n      function caseBefor async function asana(tok, path) {
  const r = await fetch('https://app.asana.com/api/1.0' + path, { headers: { Authorization: 'Bearer ' + tok, Accept: 'application/json' } });
  if (r.status === 401) throw errCode('asana-auth', 'Asana rejected that token.');
  if (!r.ok) throw errCode('asana', 'Asana error ' + r.status);
  return r.json();
}

  const roster = S.roster.map(r => ({ sid: r.sid, name: r.name }));
  const list = []; let skipped = 0, doneSkipped = 0, delivered = 0;
  const skipDelivered = !$('#impDelivered') || $('#impDelivered').checked, weekAgo = addDays(todayISO(), -7);

    if (t.gid && existing.has(String(t.gid))) { skipped++; return; }

    const c = caseFromAsana(t, t.project, roster); if (!c.patient) return;

  const unmatched = Array.from(new Set(list.filter(c => c.assigneeName).map(c => c.assigneeName)));

  box.innerHTML = '<div class="card" style="box-shadow:none"><div class="cardBd" style="padding:14px 16px">' +
    '<div class="flabel">Ready to import: ' + list.length + '</div>' +
    (list.length ? '<ul class="small" style="padding-left:18px;margin:6px 0 10px">' + Object.keys(byType).map(k => '<li>' + esc(k) + ': ' + byType[k] + '</li>').join('') + '</ul>' : '') +

/* ---------- Team from Staff Hub's office roster (Amir: "for the team, can I just add from staff hub?")
   Staff Hub shares a basic roster (name they go by, title, active / last day, photo) in the nlo-inventory database,
   which Cadence, the calendar and the IPR Tracker already follow. Here it's read with the IPR link's Google sign-in
   (it ends when NLO Cases locks). Logins are still made here: each person's own password unlocks the office key. ---------- */
const SH = { data: null, err: '', loading: false, at: 0 };
function shPeople() { return Object.values((SH.data && SH.data.people) || {}).filter(p => p && p.id && p.name); }
function shNorm(s) { return String(s || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/^dr\.?\s+/, '').replace(/[^a-z\s'-]/g, ' ').replace(/\s+/g, ' ').trim(); }
/* this NLO Cases person in the roster: by the id saved when they were added from it, else by name */
function shMatch(r, people) {
  if (r.rid) return people.find(p => p.id === r.rid) || null;
  const n = shNorm(r.name), parts = n.split(' '), f = parts[0] || '', l = parts.length > 1 ? parts[parts.length - 1] : '';
  let hit = people.filter(p => shNorm(p.name) === n); if (hit.length === 1) return hit[0];
  hit = people.filter(p => [p.first, p.nick].some(x => x && shNorm(x) === f) && (!l || !p.last || shNorm(p.last) === l));
  return hit.length === 1 ? hit[0] : null;
}
function shGone(p) { return p.active === false || (!!p.end && p.end < todayISO()); }
function shState() {
  const people = shPeople(), used = new Set(), link = new Map();
  S.roster.forEach(r => { const p = shMatch(r, people); if (p) { used.add(p.id); link.set(r.sid, p); } });
  const add = people.filter(p => !used.has(p.id) && !shGone(p) && p.id !== 's_amir').sort((a, b) => a.name.localeCompare(b.name));
  const mine = S.roster.filter(r => r.active && r.role !== 'owner' && link.has(r.sid));
  return { add, left: mine.filter(r => shGone(link.get(r.sid))).map(r => ({ r, p: link.get(r.sid) })),
    leaving: mine.filter(r => !shGone(link.get(r.sid)) && link.get(r.sid).end).map(r => ({ r, p: link.get(r.sid) })), linked: link.size };
}
function shUsername(p) {
  const taken = u => S.roster.some(r => r.sid === u || r.username === u);
  const f = slug(p.first || firstName(p.name)), l = slug(p.last || '').slice(0, 1);
  if (f && !taken(f)) return f; if (f && l && !taken(f + l)) return f + l;
  for (let i = 2; i < 20; i++) if (!taken(f + i)) return f + i;

}

/* bring each linked person's Staff Hub photo onto their NLO Cases roster entry (Amir: "import staff photos"), so everyone sees it,
   staff included (they don't sign in to Staff Hub). Shrunk to 96 px; only when the Staff Hub photo has changed. */
async function shPhotos() {
  if (!isOwner() || !B.setStaffPhoto || SH.syncing) return; SH.syncing = true; let n = 0;
  try {
    const people = shPeople();
    for (const r of S.roster) {
      const p = shMatch(r, people); if (!p) continue;
      const src = /^data:image\/(jpeg|png|webp);base64,/.test(p.photo || '') ? p.photo : '';
      const h = src ? Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', TE.encode(src))).subarray(0, 8), b => b.toString(16).padStart(2, '0')).join('') : '';
      if ((r.photoSrc || '') === h) continue;
      const small = src ? await shrinkPhoto(src, 96) : ''; if (src && !small) continue;
      await B.setStaffPhoto(r.sid, small, h); n++;
    }
  } catch (e) { } finally { SH.syncing = false; }
  if (n) toast(n + ' staff photo' + (n > 1 ? 's' : '') + ' brought in from Staff Hub');
}
function shrinkPhoto(src, px) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => { try { const c = document.createElement('canvas'); c.width = c.height = px; const g = c.getContext('2d'), s = Math.min(im.naturalWidth, im.naturalHeight);
      g.fillStyle = '#fff'; g.fillRect(0, 0, px, px); g.imageSmoothingQuality = 'high';
      g.drawImage(im, (im.naturalWidth - s) / 2, (im.naturalHeight - s) / 2, s, s, 0, 0, px, px); res(c.toDataURL('image/jpeg', 0.85)); } catch (e) { res(''); } };
    im.onerror = () => res(''); im.src = src;
  });
}

/* =====================================================================
   Lab emails → case updates (Amir, 2 Oct 2026: "just like how I had it set up on Asana")
   A Google Apps Script in the office's Gmail accounts (nlo-cases-mail.gs, set up from Team & security)
   forwards lab emails, each sealed to the office inbox key: the script can add to /inbox but read nothing.
   Whenever someone has the app open, the app opens them here, reads each patient's update (one email can
   name several), finds the case — the company's own case # saved on it, else the name among that company's
   open cases — and applies it: moves the case forward (never back), saves the tracking #, the lab's case #

   Reading the emails happens here, not in the script, so a new lab format only needs an app update.
   The website's appointment requests come through the same script (the last sender below) but belong to

/* ---------- reading an email ---------- */
function decodeEnt(s) {
  const cp = n => { try { return String.fromCodePoint(n); } catch (e) { return ' '; } };
  return String(s || '').replace(/&nbsp;/gi, ' ').replace(/&#(\d+);/g, (m, n) => cp(+n)).replace(/&#x([0-9a-f]+);/gi, (m, n) => cp(parseInt(n, 16)))
    .replace(/&lt;/gi, '<').replace(/&gt;/gi, '>').replace(/&quot;/gi, '"').replace(/&#39;|&apos;/gi, "'").replace(/&amp;/gi, '&');
}
/* HTML → lines; a table row becomes one line with its cells kept apart */
function htmlRows(html) {
  const s = String(html || '').replace(/[\r\n]+/g, ' ').replace(/<(script|style)\b[\s\S]*?<\/\1\s*>/gi, ' ')
    .replace(/<\/(td|th)\s*>/gi, '\u0001').replace(/<\/tr\s*>/gi, '\n').replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/(p|div|h[1-6]|table|li|caption|thead|tbody)\s*>/gi, '\n').replace(/<[^>]*>/g, '');
  return decodeEnt(s).split('\n').map(line => {
    const cells = line.split('\u0001').map(c => c.replace(/\s+/g, ' ').trim());
    while (cells.length > 1 && cells[cells.length - 1] === '') cells.pop();
    return cells;
  }).filter(cells => cells.some(Boolean));
}
function htmlLinks(html) {
  const out = [], re = /<a\b[^>]*?href\s*=\s*"([^"]*)"[^>]*>([\s\S]*?)<\/a\s*>/gi; let x;
  while ((x = re.exec(String(html || '')))) out.push({ href: decodeEnt(x[1]).trim(), text: decodeEnt(x[2].replace(/<[^>]*>/g, ' ')).replace(/\s+/g, ' ').trim() });
  return out;
}
function linkFor(html, re) { const l = htmlLinks(html).find(x => re.test(x.text)); return l ? l.href : ''; }
function mailText(m) { const t = String(m.text || '').replace(/\r/g, ''); return t.trim() ? t : htmlRows(m.html).map(r => r.join(' ')).join('\n'); }
function cleanName(s) {
  return String(s || '').replace(/[​ ]/g, ' ').replace(/\s+(click here|tracking|order number|patient name|case number)\b.*$/i, '')
    .replace(/\s+/g, ' ').replace(/^[\s"'“”(:,.-]+|[\s"'“”):,-]+$/g, '').slice(0, 80);
}
/* uLab: "Your uLab order X has shipped." — Order Number / Patient Name / tracking #, maybe several orders */
function parseUlab(m) {
  const t = mailText(m), out = [];
  if (!/shipped|on the way/i.test((m.subject || '') + ' ' + t)) return out;
  t.split(/Order Number\s*:/i).slice(1).forEach(p => {
    const name = (p.match(/Patient Name\s*:\s*([^\n]+)/i) || [])[1];
    if (name) out.push({ kind: 'shipped', name, ref: (p.match(/^\s*([A-Za-z0-9-]{2,30})/) || [])[1] || '', tracking: (p.match(/track your order\s*:?\s*([A-Za-z0-9]{8,34})/i) || [])[1] || '' });
  });
  return out;
}
/* Partners Dental Studio: the daily summary — tables of cases received, shipped (tracking + carrier) and on hold */
function parsePartners(m) {
  const out = []; let sec = '', cols = null;
  htmlRows(m.html).forEach(r => {
    const line = r.join(' ');
    const head = r.length === 1 && /^(no\s+)?cases\s+(received|shipped|(?:placed\s+)?on hold)/i.exec(line);
    if (head) { sec = head[1] ? '' : /received/i.test(head[2]) ? 'received' : /shipped/i.test(head[2]) ? 'shipped' : 'hold'; cols = null; return; }
    if (/^patient name$/i.test(r[0] || '')) { cols = r.map(c => c.toLowerCase()); return; }
    if (!sec || !cols || r.length < 2) return;
    const get = k => { const i = cols.findIndex(c => c.indexOf(k) >= 0); return i >= 0 ? String(r[i] || '').trim() : ''; };
    const name = get('patient'); if (!name || /^patient name$/i.test(name)) return;
    out.push({ kind: sec, name, ref: get('case'), invoice: get('invoice'), tracking: get('tracking').replace(/\s+/g, ''), carrier: get('carrier'), holdDate: get('hold date'), reason: get('reason') });
  });
  return out;
}
/* Oliv: "Oliv™: F. Last (123456) setup is ready"; "The aligners for F. Last, case #123456 (…) have been delivered/shipped" */
function parseOliv(m) {
  const s = m.subject || '', t = mailText(m), out = [];
  const plan = /:\s*(.+?)\s*\((\d{3,})\)\s*setup is ready/i.exec(s);
  if (plan) out.push({ kind: 'plan', name: plan[1], ref: plan[2], planUrl: linkFor(m.html, /treatment plan/i) });
  const re = /aligners for\s+(.+?),\s*case\s*#\s*(\d{3,})[^.\n]*?have\s+(?:been\s+)?(delivered|shipped)/gi; let y;
  while ((y = re.exec(t))) out.push({ kind: y[3].toLowerCase(), name: y[1], ref: y[2], trackUrl: linkFor(m.html, /track/i) });
  return out;
}
/* Angel (iOrtho): "(patient:Full Name #ID ) is ready for review"; "Your case for patient Full Name #ID has shipped" */
function parseAngel(m) {
  const t = mailText(m), out = []; let y;
  const plan = /patient\s*:\s*([^#()\n]+?)\s*#\s*([A-Za-z0-9]{3,})\s*\)?[^.\n]*?ready for review/gi;
  while ((y = plan.exec(t))) out.push({ kind: 'plan', name: y[1], ref: y[2] });
  const ship = /case for patient\s+([^#\n]+?)\s*#\s*([A-Za-z0-9]{3,})\s+has shipped/gi;
  while ((y = ship.exec(t))) out.push({ kind: 'shipped', name: y[1], ref: y[2] });
  return out;

/* =====================================================================
   Patient photos (Amir, 2 Oct 2026: "much easier to recall cases").
   One small square picture per case, shown next to the patient's name.
   - Cropped and shrunk here to a 160 px JPEG (a few KB), which also drops
     the camera's EXIF data (location etc.); the full-size picture never
     leaves the device.
   - Sealed with the office key like the case itself (backend photos/{id});
     the case's own `photo` field holds the picture's version id, so a new
     or changed photo is a normal case save and shows in its history.
   - Loaded only for names on screen, kept in memory until the app locks.
   - "Hide photos" blurs them on this device (screens patients can see).
   ===================================================================== */

  minus: '<path d="M5 12h14"/>',
  camera: '<path d="M4 8h3.2l1.6-2.5h6.4L16.8 8H20a1 1 0 011 1v9a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1z"/><circle cx="12" cy="13.2" r="3.7"/>',
  image: '<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="9.5" r="1.8"/><path d="M4 17.5l5-4.5 4 3.5 2.6-2.2L20 18"/>',
  eye: '<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>',
  eyeOff: '<path d="M3 3l18 18"/><path d="M10.6 5.6A10 10 0 0112 5.5C18 5.5 21.5 12 21.5 12a17 17 0 01-3.2 4M6.6 6.7C3.9 8.5 2.5 12 2.5 12S6 18.5 12 18.5c1.6 0 3-.4 4.3-1"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/>'
});
const PH_SIL = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="9.2" r="4.3"/><path d="M3.6 22c.8-4.6 4.3-7.4 8.4-7.4s7.6 2.8 8.4 7.4z"/></svg>';

/* the round picture next to a patient's name (a plain placeholder until, and unless, the case has a photo) */
function ptAv(c, size) {
  const has = !!(c && c.id && c.photo && !c.locked);
  return '<span class="pav s' + (size || 32) + (has ? ' has' : '') + '"' + (c && c.id ? ' data-pav="' + esc(c.id) + '"' : '') + (has ? ' data-pv="' + esc(c.photo) + '"' : '') + ' aria-hidden="true">' + PH_SIL + '</span>';
}
function phUrl(bytes) { return 'data:image/jpeg;base64,' + b64(bytes); }
function phPut(id, pv, bytes) { const e = { pv, seen: pv, bytes, url: phUrl(bytes) }; PH.cache.set(id, e); return e; }

  el.appendChild(im); el.classList.add('on');

/* after anything is drawn: fill in photos already in memory, fetch the rest once they're on screen */
function phPaint() {
  if (!S.inApp) return;
  if (PH.io) PH.io.disconnect();
  $$('.pav.has:not(.on)').forEach(el => {
    const x = phCached(el.dataset.pav, el.dataset.pv);
    if (x) { phShow(el, x.url); return; }
    if (!window.IntersectionObserver) { phLoad(el.dataset.pav, el.dataset.pv); return; }
    if (!PH.io) PH.io = new IntersectionObserver(list => list.forEach(e => {
      if (e.isIntersecting) { PH.io.unobserve(e.target); phLoad(e.target.dataset.pav, e.target.dataset.pv); }

function phFill(id) {

/* a few at a time, so a long list doesn't fire dozens of reads at once */
async function phSlot() { while (PH.active >= 4) await new Promise(r => PH.waiters.push(r)); PH.active++; }

/* the case's current photo ({ pv, bytes, url }) or null; `pv` is the version the case names */
function phLoad(id, pv) {
  const x = PH.cache.get(id);
  if (x && (x.pv === pv || x.seen === pv)) { phFill(id); return Promise.resolve(x.url ? x : null); }
  const lk = id + '|' + pv; if (PH.loading.has(lk)) return PH.loading.get(lk);
  const gen = PH.gen;
  const p = (async () => {
    await phSlot();
    try {
      if (gen !== PH.gen) return null;
      const r = await B.getPhoto(id);
      if (gen !== PH.gen) return null; // locked meanwhile
      // (a case restored to an older version can name an older version id than the picture it has: keep showing that picture)
      const e = r ? Object.assign(phPut(id, r.pv, r.bytes), { seen: pv }) : { pv: '', seen: pv, url: '' };

function phReset() { PH.gen++; PH.cache.clear(); PH.loading.clear(); if (PH.io) PH.io.disconnect(); PH.io = null; phClose(); }

/* ---------- a case's photo (from the case, or by pasting a picture while it's open) ---------- */
function phCaseEdit(c, file) {
  if (!c || c.locked) return;
  const x = c.photo ? phCached(c.id, c.photo) : null;
  phEditor({ name: c.patient, current: x ? x.url : '', file, onSave: bytes => phSaveCase(c.id, bytes), onRemove: c.photo ? () => phRemoveCase(c.id) : null });
  if (c.photo && !x) phLoad(c.id, c.photo).then(r => { const el = $('#phNow'); if (r && el) { el.classList.remove('none'); phShow(el, r.url); } });
}
const skipOk = e => { if (!(e && e.code === 'skip')) throw e; };
async function phSaveCase(id, bytes) {
  const c = findCase(id); if (!c) throw errCode('gone');
  const old = c.photo ? (phCached(id, c.photo) || await phLoad(id, c.photo)) : null, oldBytes = old && old.bytes;
  const pv = await B.setPhoto(id, bytes, { a: 'photo', how: c.photo ? 'change' : 'add' });
  phPut(id, pv, bytes); c.photo = pv;
  // the same patient's other open cases that have no photo yet get it too
  const copied = [];
  for (const o of openCases().filter(o => o.id !== id && !o.photo && !o.locked && samePatient(o, c))) {
    try { const p2 = await B.setPhoto(o.id, bytes, { a: 'photo', how: 'copy' }); phPut(o.id, p2, bytes); o.photo = p2; copied.push(o.id); } catch (e) { }
  }
  queueRender(); if (S.openId === id && !S.editing) renderDrawer();
  toast((old ? 'Photo changed' : 'Photo added') + (copied.length ? ' (also on ' + copied.length + ' other open case' + (copied.length > 1 ? 's' : '') + ' for this patient)' : ''), { action: 'Undo', ms: 9000, onAction: () => act(async () => {
    if (oldBytes) { const p = await B.setPhoto(id, oldBytes, { a: 'photo', how: 'undo' }); phPut(id, p, oldBytes); }
    else await B.setPhoto(id, null, { a: 'photo', how: 'remove' }).catch(skipOk);
    for (const oid of copied) await B.setPhoto(oid, null, { a: 'photo', how: 'remove' }).catch(skipOk);
  }, 'Undone') });
}
async function phRemoveCase(id) {
  const c = findCase(id); const x = c && c.photo ? (phCached(id, c.photo) || await phLoad(id, c.photo)) : null, keep = x && x.bytes;
  await B.setPhoto(id, null, { a: 'photo', how: 'remove' }).catch(skipOk);
  if (c) c.photo = ''; queueRender(); if (S.openId === id && !S.editing) renderDrawer();
  toast('Photo removed', keep ? { action: 'Undo', onAction: () => act(async () => { const p = await B.setPhoto(id, keep, { a: 'photo', how: 'undo' }); phPut(id, p, keep); }, 'Photo put back') } : {});
}
/* the drawer's photo also takes a picture dropped on it */
function phWireDrawer(d) {
  const b = $('.dPh', d); if (!b) return;
  b.addEventListener('dragover', e => { e.preventDefault(); b.classList.add('over'); });
  b.addEventListener('dragleave', () => b.classList.remove('over'));
  b.addEventListener('drop', e => { e.preventDefault(); b.classList.remove('over'); const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; const c = findCase(S.openId); if (f && c) phCaseEdit(c, f); });
}

/* ---------- New case form: the photo goes in with the case; a patient who already has one gets it again ---------- */
function phSlotHTML() {
  return '<button type="button" class="phSlot" id="cf-photo" data-act="cfPhoto" aria-label="Patient photo">' + ptAv(null, 64) + '<span class="phSlotL">' + ic('camera', 13) + '<span>Add photo</span></span></button>';
}
function phWireForm(root) {
  const slot = $('#cf-photo', root); if (!slot) return;
  root._ph = null; root._phOff = '';
  ensureHist(); // completed cases too, to find this patient's photo
  slot.addEventListener('dragover', e => { e.preventDefault(); slot.classList.add('over'); });
  slot.addEventListener('dragleave', () => slot.classList.remove('over'));
  slot.addEventListener('drop', e => { e.preventDefault(); slot.classList.remove('over'); const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) phFormEdit(root, f); });
  let t = null; const look = () => { clearTimeout(t); t = setTimeout(() => phFormReuse(root), 350); };
  ['#cf-patient', '#cf-chart'].forEach(s => { const el = $(s, root); if (el) el.addEventListener('input', look); });
}
function phFormEdit(root, file) {
  const cur = root._ph;
  phEditor({ name: ($('#cf-patient', root) || {}).value || '', current: cur ? cur.url : '', file,
    onSave: async bytes => { root._ph = { bytes, url: phUrl(bytes), from: 'new' }; phFormShow(root); },
    // (taking a reused photo off sticks for this patient while the form is open)
    onRemove: cur ? async () => { if (cur.from === 'reuse') root._phOff = normName(($('#cf-patient', root) || {}).value); root._ph = null; phFormShow(root); } : null });
}
function phFormShow(root) {
  const slot = $('#cf-photo', root); if (!slot) return; const p = root._ph, av = $('.pav', slot);
  if (p) phShow(av, p.url); else phBlank(av);
  slot.classList.toggle('set', !!p);
  $('.phSlotL span', slot).textContent = p ? (p.from === 'reuse' ? 'From their other case' : 'Change photo') : 'Add photo';
}
function phFormReuse(root) {
  if (!root.isConnected || (root._ph && root._ph.from === 'new')) return; // a photo picked here wins
  const probe = { patient: (($('#cf-patient', root) || {}).value || '').trim(), chart: (($('#cf-chart', root) || {}).value || '').trim() };
  const src = probe.patient ? casePool().filter(x => x && x.id && x.photo && !x.locked && samePatient(x, probe)).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0] : null;
  if (!src) { if (root._ph) { root._ph = null; phFormShow(root); } return; }
  if ((root._phOff && root._phOff === normName(probe.patient)) || (root._ph && root._ph.srcId === src.id)) return;
  phLoad(src.id, src.photo).then(x => {
    if (!x || !x.bytes || !root.isConnected || (root._ph && root._ph.from === 'new')) return;
    root._ph = { bytes: x.bytes, url: x.url, from: 'reuse', srcId: src.id }; phFormShow(root);
  });
}

/* ---------- pasting a picture: into the photo editor, the New case form, or the open case ---------- */
function phClipFile(dt) {
  if (!dt) return null;
  const it = Array.from(dt.items || []).find(i => i.kind === 'file' && /^image\//.test(i.type));
  return it ? it.getAsFile() : null;
}
function phBindPaste() {
  document.addEventListener('paste', e => {
    if (!S.inApp || S.rulesOld) return;
    const f = phClipFile(e.clipboardData); if (!f) return;
    // text being pasted into a field stays text (copying from a web page can carry a picture along)
    const t = e.target, editable = t && (t.isContentEditable || /^(INPUT|TEXTAREA)$/.test(t.tagName));
    if (editable && Array.from(e.clipboardData.types || []).includes('text/plain')) return;
    if ($('#phWrap')) { e.preventDefault(); if (PH.onFile) PH.onFile(f); return; }
    const nc = $('#ncForm'); if (nc) { const root = nc.closest('#modalWrap'); if (root && $('#cf-photo', root)) { e.preventDefault(); phFormEdit(root, f); } return; }
    if (S.openId && !S.editing && $('#drawer') && !$('#modalWrap')) { const c = findCase(S.openId); if (c && !c.locked) { e.preventDefault(); phCaseEdit(c, f); } }
  });
}

Object.assign(ADMIN_ACTS, {
  phHide() { phToggleHide(); },
  phEdit() { const c = findCase(S.openId); if (c) phCaseEdit(c); },
  cfPhoto(t) { const root = t.closest('#modalWrap'); if (root) phFormEdit(root); }
});

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
