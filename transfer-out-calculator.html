  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ODONTICS \u2014 COLOR TOKENS\n   Brand palette sourced from NLO Brand/Colors (HEX + Pantone)\n   ============================================================ */\n\n:root {\n  /* --- BRAND CORE (exact brand hexes) --- */\n  --nlo-navy:        #1B2F4C; /* PANTONE 2767 \u2014 primary ink / dark surface */\n  --nlo-off-white:   #F2F3F4; /* PANTONE 649  \u2014 light app background        */\n  --nlo-blue:        #1D3EA9; /* PANTONE 286  \u2014 primary action / link       */\n  --nlo-coral:       #FA624D; /* PANTONE 178  \u2014 energetic accent / CTA       */\n  --nlo-mint:        #64F4C9; /* PANTONE 3245 \u2014 fresh accent / success       */\n  --nlo-amber:       #F6AF24; /* PANTONE 7548 \u2014 warm accent / highlight      */\n  --nlo-white:       #FFFFFF;\n\n  /* --- NAVY / INK SCALE (cool, toward brand navy) --- */\n  --nlo-navy-900: #11203A;\n  --nlo-navy-800: #1B2F4C; /* brand */\n  --nlo-navy-700: #294169;\n  --nlo-navy-600: #385686;\n  --nlo-navy-500: #5471A0;\n\n  /* --- BLUE SCALE (action) --- */\n  --nlo-blue-800: #122874;\n  --nlo-blue-700: #16318C;\n  --nlo-blue-600: #1D3EA9; /* brand */\n  --nlo-blue-500: #2E52C9;\n  --nlo-blue-200: #BcC8EE;\n  --nlo-blue-100: #E5EAF8;\n\n  /* --- CORAL SCALE --- */\n  --nlo-coral-700: #D8412E;\n  --nlo-coral-600: #EE4F3A;\n  --nlo-coral-500: #FA624D; /* brand */\n  --nlo-coral-200: #FFC8BF;\n  --nlo-coral-100: #FFE7E1;\n\n  /* --- MINT SCALE --- */\n  --nlo-mint-700: #1F9E7E; /* accessible text-on-light */\n  --nlo-mint-600: #34C49E;\n  --nlo-mint-500: #64F4C9; /* brand */\n  --nlo-mint-200: #C0FBEC;\n  --nlo-mint-100: #E2FBF4;\n\n  /* --- AMBER SCALE --- */\n  --nlo-amber-700: #C2820A;\n  --nlo-amber-600: #E29A14;\n  --nlo-amber-500: #F6AF24; /* brand */\n  --nlo-amber-200: #FCE2A6;\n  --nlo-amber-100: #FEF2D7;\n\n  /* --- NEUTRAL / GREY SCALE (slightly cool) --- */\n  --nlo-grey-50:  #F7F8F9;\n  --nlo-grey-100: #ECEEF0;\n  --nlo-grey-200: #DCE0E4;\n  --nlo-grey-300: #C3C9D0;\n  --nlo-grey-400: #969FAB;\n  --nlo-grey-500: #6B7685;\n  --nlo-grey-600: #4C5868;\n  --nlo-grey-700: #33404F;\n\n  /* ===========================================================\n     SEMANTIC ALIASES \u2014 reference these in components, not raw hex\n     =========================================================== */\n\n  /* Surfaces */\n  --color-bg:          var(--nlo-off-white);\n  --surface-page:      var(--nlo-off-white);\n  --surface-card:      var(--nlo-white);\n  --surface-sunken:    var(--nlo-grey-100);\n  --surface-inverse:   var(--nlo-navy-800);\n  --surface-inverse-2: var(--nlo-navy-900);\n\n  /* Text */\n  --text-strong:    var(--nlo-navy-800);\n  --text-body:      var(--nlo-grey-700);\n  --text-muted:     var(--nlo-grey-500);\n  --text-on-dark:   var(--nlo-off-white);\n  --text-on-dark-muted: #A7B2C2;\n  --text-inverse:   var(--nlo-white);\n\n  /* Brand / action */\n  --brand-primary:        var(--nlo-navy-800);\n  --brand-primary-hover:  var(--nlo-navy-900);\n  --action:               var(--nlo-blue-600);\n  --action-hover:         var(--nlo-blue-700);\n  --accent-coral:         var(--nlo-coral-500);\n  --accent-coral-hover:   var(--nlo-coral-700);\n  --accent-mint:          var(--nlo-mint-500);\n  --accent-amber:         var(--nlo-amber-500);\n  --link:                 var(--nlo-blue-600);\n\n  /* Status */\n  --status-success: var(--nlo-mint-700);\n  --status-warning: var(--nlo-amber-600);\n  --status-danger:  var(--nlo-coral-700);\n  --status-info:    var(--nlo-blue-600);\n\n  /* Lines & focus */\n  --border-subtle:  var(--nlo-grey-200);\n  --border-default: var(--nlo-grey-300);\n  --border-strong:  var(--nlo-navy-800);\n  --focus-ring:     var(--nlo-blue-500);\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   NEXT LEVEL ORTHODONTICS \u2014 TYPOGRAPHY TOKENS\n   Brand: Headlines = Rift (Adobe). Body = Proxima Nova.\n   Webfont substitutes (Google): Oswald (display), Montserrat (body).\n   ============================================================ */\n\n:root {\n  /* Families */\n  --font-display: 'Oswald', 'Rift', 'Bebas Neue', system-ui, sans-serif;\n  --font-body:    'Montserrat', 'Proxima Nova', system-ui, -apple-system, sans-serif;\n  --font-mono:    'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;\n\n  /* Weights */\n  --weight-regular:  400;\n  --weight-medium:   500;\n  --weight-semibold: 600;\n  --weight-bold:     700;\n\n  /* Display scale \u2014 condensed, uppercase, tight tracking */\n  --text-display-2xl: 88px;\n  --text-display-xl:  68px;\n  --text-display-lg:  52px;\n  --text-display-md:  40px;\n  --text-display-sm:  30px;\n\n  /* Body / UI scale */\n  --text-xl:  22px;\n  --text-lg:  18px;\n  --text-md:  16px;\n  --text-sm:  14px;\n  --text-xs:  12px;\n\n  /* Line heights */\n  --leading-display: 0.96;\n  --leading-tight:   1.15;\n  --leading-snug:    1.35;\n  --leading-normal:  1.55;\n  --leading-relaxed: 1.7;\n\n  /* Letter spacing */\n  --tracking-display: 0.01em;  /* Oswald set tight */\n  --tracking-eyebrow: 0.18em;  /* uppercase labels   */\n  --tracking-wide:    0.04em;\n  --tracking-normal:  0em;\n}\n\n/* ---- Reusable type classes (optional helpers) ---- */\n.nlo-display {\n  font-family: var(--font-display);\n  font-weight: var(--weight-bold);\n  line-height: var(--leading-display);\n  letter-spacing: var(--tracking-display);\n  text-transform: uppercase;\n  color: var(--text-strong);\n}\n.nlo-eyebrow {\n  font-family: var(--font-display);\n  font-weight: var(--weight-semibold);\n  text-transform: uppercase;\n  letter-spacing: var(--tracking-eyebrow);\n  font-size: var(--text-sm);\n  color: var(--action);\n}\n.nlo-body {\n  font-family: var(--font-body);\n  font-weight: var(--weight-regular);\n  line-height: var(--leading-normal);\n  color: var(--text-body);\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   NEXT LEVEL ORTHODONTICS \u2014 SPACING, RADII, SHADOWS, MOTION\n   4px base grid.\n   ============================================================ */\n\n:root {\n  /* Spacing scale */\n  --space-0:  0;\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  24px;\n  --space-6:  32px;\n  --space-7:  48px;\n  --space-8:  64px;\n  --space-9:  96px;\n  --space-10: 128px;\n\n  /* Container widths */\n  --container-sm: 640px;\n  --container-md: 960px;\n  --container-lg: 1200px;\n  --container-xl: 1320px;\n\n  /* Radii \u2014 geometric brand, softly rounded (echoes logo terminals) */\n  --radius-xs:   4px;\n  --radius-sm:   8px;\n  --radius-md:   14px;\n  --radius-lg:   22px;\n  --radius-xl:   32px;\n  --radius-pill: 999px;\n  --radius-circle: 50%;\n\n  /* Shadows \u2014 soft, navy-tinted */\n  --shadow-xs: 0 1px 2px rgba(17, 32, 58, 0.07);\n  --shadow-sm: 0 2px 6px rgba(17, 32, 58, 0.08);\n  --shadow-md: 0 8px 24px rgba(17, 32, 58, 0.10);\n  --shadow-lg: 0 18px 48px rgba(17, 32, 58, 0.15);\n  --shadow-xl: 0 32px 70px rgba(17, 32, 58, 0.22);\n\n  /* Borders */\n  --border-width: 1px;\n  --border-width-strong: 2px;\n\n  /* Motion \u2014 calm, confident easing; no bounce */\n  --ease-standard: cubic-bezier(0.4, 0.0, 0.2, 1); /* @kind other */\n  --ease-out:      cubic-bezier(0.16, 1, 0.3, 1);  /* @kind other */\n  --ease-in:       cubic-bezier(0.4, 0.0, 1, 1);   /* @kind other */\n  --duration-fast:   140ms; /* @kind other */\n  --duration-medium: 240ms; /* @kind other */\n  --duration-slow:   420ms; /* @kind other */\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   NEXT LEVEL ORTHODONTICS \u2014 GLOBAL STYLE ENTRY\n   Consumers link this ONE file. It only @imports the token and\n   font closures \u2014 never declare rules directly here.\n   ============================================================ */\n\n/* ============================================================\n   NEXT LEVEL ORTHODONTICS \u2014 WEBFONTS\n   ------------------------------------------------------------\n   The licensed brand fonts are R n/* cyrillic */\n@font-face {\n  font-family: 'Oswald';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"8cffa4f3-08f1-44ac-8f6a-97f67cad3b3c\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Oswald';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"d4b2a24d-921c-4bb8-b8ce-fab703ca328c\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Oswald';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"72b858ca-da24-47ec-9895-ce5ab7a2c8e6\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Oswald';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"a9d940a7-8e80-4070-a83b-48c1069d87e5\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ============================================================\n   NEXT LEVEL ORTHODONTICS \u2014 COLOR TOKENS\n   Brand palette sourced from NLO Brand/Colors (HEX + Pantone)\n   ============================================================ */\n\n:root {\n  /* --- BRAND CORE (exact brand hexes) --- */\n  --nlo-navy:        #1B2F4C; /* PANTONE 2767 \u2014 primary ink / dark surface */\n  --nlo-off-white:   #F2F3F4; /* PANTONE 649  \u2014 light app background        */\n  --nlo-blue:        #1D3EA9; /* PANTONE 286  \u2014 primary action / link       */\n  --nlo-coral:       #FA624D; /* PANTONE 178  \u2014 energetic accent / CTA       */\n  --nlo-mint:        #64F4C9; /* PANTONE 3245 \u2014 fresh accent / success       */\n  --nlo-amber:       #F6AF24; /* PANTONE 7548 \u2014 warm accent / highlight      */\n  --nlo-white:       #FFFFFF;\n\n  /* --- NAVY / INK SCALE (cool, toward brand navy) --- */\n  --nlo-navy-900: #11203A;\n  --nlo-navy-800: #1B2F4C; /* brand */\n  --nlo-navy-700: #294169;\n  --nlo-navy-600: #385686;\n  --nlo-navy-500: #5471A0;\n\n  /* --- BLUE SCALE (action) --- */\n  --nlo-blue-800: #122874;\n  --nlo-blue-700: #16318C;\n  --nlo-blue-600: #1D3EA9; /* brand */\n  --nlo-blue-500: #2E52C9;\n  --nlo-blue-200: #BcC8EE;\n  --nlo-blue-100: #E5EAF8;\n\n  /* --- CORAL SCALE --- */\n  --nlo-coral-700: #D8412E;\n  --nlo-coral-600: #EE4F3A;\n  --nlo-coral-500: #FA624D; /* brand */\n  --nlo-coral-200: #FFC8BF;\n  --nlo-coral-100: #FFE7E1;\n\n  /* --- MINT SCALE --- */\n  --nlo-mint-700: #1F9E7E; /* accessible text-on-light */\n  --nlo-mint-600: #34C49E;\n  --nlo-mint-500: #64F4C9; /* brand */\n  --nlo-mint-200: #C0FBEC;\n  --nlo-mint-100: #E2FBF4;\n\n  /* --- AMBER SCALE --- */\n  --nlo-amber-700: #C2820A;\n  --nlo-amber-600: #E29A14;\n  --nlo-amber-500: #F6AF24; /* brand */\n  --nlo-amber-200: #FCE2A6;\n  --nlo-amber-100: #FEF2D7;\n\n  /* --- NEUTRAL / GREY SCALE (slightly cool) --- */\n  --nlo-grey-50:  #F7F8F9;\n  --nlo-grey-100: #ECEEF0;\n  --nlo-grey-200: #DCE0E4;\n  --nlo-grey-300: #C3C9D0;\n  --nlo-grey-400: #969FAB;\n  --nlo-grey-500: #6B7685;\n  --nlo-grey-600: #4C5868;\n  --nlo-grey-700: #33404F;\n\n  /* ===========================================================\n     SEMANTIC ALIASES \u2014 reference these in components, not raw hex\n     =========================================================== */\n\n  /* Surfaces */\n  --color-bg:          var(--nlo-off-white);\n  --surface-page:      var(--nlo-off-white);\n  --surface-card:      var(--nlo-white);\n  --surface-sunken:    var(--nlo-grey-100);\n  --surface-inverse:   var(--nlo-navy-800);\n  --surface-inverse-2: var(--nlo-navy-900);\n\n  /* Text */\n  --text-strong:    var(--nlo-navy-800);\n  --text-body:      var(--nlo-grey-700);\n  --text-muted:     var(--nlo-grey-500);\n  --text-on-dark:   var(--nlo-off-white);\n  --text-on-dark-muted: #A7B2C2;\n  --text-inverse:   var(--nlo-white);\n\n  /* Brand / action */\n  --brand-primary:        var(--nlo-navy-800);\n  --brand-primary-hover:  var(--nlo-navy-900);\n  --action:               var(--nlo-blue-600);\n  --action-hover:         var(--nlo-blue-700);\n  --accent-coral:         var(--nlo-coral-500);\n  --accent-coral-hover:   var(--nlo-coral-700);\n  --accent-mint:          var(--nlo-mint-500);\n  --accent-amber:         var(--nlo-amber-500);\n  --link:                 var(--nlo-blue-600);\n\n  /* Status */\n  --status-success: var(--nlo-mint-700);\n  --status-warning: var(--nlo-amber-600);\n  --status-danger:  var(--nlo-coral-700);\n  --status-info:    var(--nlo-blue-600);\n\n  /* Lines & focus */\n  --border-subtle:  var(--nlo-grey-200);\n  --border-default: var(--nlo-grey-300);\n  --border-strong:  var(--nlo-navy-800);\n  --focus-ring:     var(--nlo-blue-500);\n}\n\n/* ============================================================\n   NEXT LEVEL ORTHODONTICS \u2014 TYPOGRAPHY TOKENS\n   Brand: Headlines = Rift (Adobe). Body = Proxima Nova.\n   Webfont substitutes (Google): Oswald (display), Montserrat (body).\n   ============================================================ */\n\n:root {\n  /* Families */\n  --font-display: 'Oswald', 'Rift', 'Bebas Neue', system-ui, sans-serif;\n  --font-body:    'Montserrat', 'Proxima Nova', system-ui, -apple-system, sans-serif;\n  --font-mono:    'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;\n\n  /* Weights */\n  --weight-regular:  400;\n  --weight-medium:   500;\n  --weight-semibold: 600;\n  --weight-bold:     700;\n\n  /* Display scale \u2014 condensed, uppercase, tight tracking */\n  --text-display-2xl: 88px;\n  --text-display-xl:  68px;\n  --text-display-lg:  52px;\n  --text-display-md:  40px;\n  --text-display-sm:  30px;\n\n  /* Body / UI scale */\n  --text-xl:  22px;\n  --text-lg:  18px;\n  --text-md:  16px;\n  --text-sm:  14px;\n  --text-xs:  12px;\n\n  /* Line heights */\n  --leading-display: 0.96;\n  --leading-tight:   1.15;\n  --leading-snug:    1.35;\n  --leading-normal:  1.55;\n  --leading-relaxed: 1.7;\n\n  /* Letter spacing */\n  --tracking-display: 0.01em;  /* Oswald set tight */\n  --tracking-eyebrow: 0.18em;  /* uppercase labels   */\n  --tracking-wide:    0.04em;\n  --tracking-normal:  0em;\n}\n\n/* ---- Reusable type classes (optional helpers) ---- */\n.nlo-display {\n  font-family: var(--font-display);\n  font-weight: var(--weight-bold);\n  line-height: var(--leading-display);\n  letter-spacing: var(--tracking-display);\n  text-transform: uppercase;\n  color: var(--text-strong);\n}\n.nlo-eyebrow {\n  font-family: var(--font-display);\n  font-weight: var(--weight-semibold);\n  text-transform: uppercase;\n  letter-spacing: var(--tracking-eyebrow);\n  font-size: var(--text-sm);\n  color: var(--action);\n}\n.nlo-body {\n  font-family: var(--font-body);\n  font-weight: var(--weight-regular);\n  line-height: var(--leading-normal);\n  color: var(--text-body);\n}\n\n/* ============================================================\n   NEXT LEVEL ORTHODONTICS \u2014 SPACING, RADII, SHADOWS, MOTION\n   4px base grid.\n   ============================================================ */\n\n:root {\n  /* Spacing scale */\n  --space-0:  0;\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  24px;\n  --space-6:  32px;\n  --space-7:  48px;\n  --space-8:  64px;\n  --space-9:  96px;\n  --space-10: 128px;\n\n  /* Container widths */\n  --container-sm: 640px;\n  --container-md: 960px;\n  --container-lg: 1200px;\n  --container-xl: 1320px;\n\n  /* Radii \u2014 geometric brand, softly rounded (echoes logo terminals) */\n  --radius-xs:   4px;\n  --radius-sm:   8px;\n  --radius-md:   14px;\n  --radius-lg:   22px;\n  --radius-xl:   32px;\n  --radius-pill: 999px;\n  --radius-circle: 50%;\n\n  /* Shadows \u2014 soft, navy-tinted */\n  --shadow-xs: 0 1px 2px rgba(17, 32, 58, 0.07);\n  --shadow-sm: 0 2px 6px rgba(17, 32, 58, 0.08);\n  --shadow-md: 0 8px 24px rgba(17, 32, 58, 0.10);\n  --shadow-lg: 0 18px 48px rgba(17, 32, 58, 0.15);\n  --shadow-xl: 0 32px 70px rgba(17, 32, 58, 0.22);\n\n  /* Borders */\n  --border-width: 1px;\n  --border-width-strong: 2px;\n\n  /* Motion \u2014 calm, confident easing; no bounce */\n  --ease-standard: cubic-bezier(0.4, 0.0, 0.2, 1); /* @kind other */\n  --ease-out:      cubic-bezier(0.16, 1, 0.3, 1);  /* @kind other */\n  --ease-in:       cubic-bezier(0.4, 0.0, 1, 1);   /* @kind other */\n  --duration-fast:   140ms; /* @kind other */\n  --duration-medium: 240ms; /* @kind other */\n  --duration-slow:   420ms; /* @kind other */\n}\n\n<\u002Fstyle>\n<script src=\"d32f6988-98c2-4382-851c-6708fd6cb1d1\"><\u002Fscript>\n<style>\n  body { margin: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }\n\n  /* ============================================================\n     PRINT \u2014 fit the whole worksheet on a single Letter page.\n     Screen layout is untouched; every rule below is print-only.\n     ============================================================ */\n  @page { margin: 0.35in 0.45in; }\n\n  @media print {\n    html, body { background: #fff !important; }\n\n    /* interactive chrome never prints */\n    .nlo-backlink,\n    .nlo-legend,\n    .nlo-actions { display: none !important; }\n\n    /* let the sheet, not the viewport, define the height */\n    .nlo-page { min-height: 0 !important; background: #fff !important; }\n    .nlo-calc { max-width: none !important; margin: 0 !important; padding: 0 !important; }\n\n    .nlo-print-date { font-size: 8.5px !important; margin-bottom: 4px !important; }\n\n    /* masthead */\n    .nlo-header { margin-bottom: 8px !important; padding-bottom: 6px !important; border-bottom-width: 2px !important; }\n    .nlo-header img { height: 23px !important; margin-bottom: 4px !important; }\n    .nlo-header h1 { font-size: 15.5px !important; margin: 0 !important; }\n    .nlo-header p { display: none !important; }\n\n    /* patient + date */\n    .nlo-meta { padding: 7px 10px !important; gap: 12px !important; margin-bottom: 6px !important;\n                box-shadow: none !important; border: 1px solid var(--border-default) !important; }\n    .nlo-meta label { font-size: 8px !important; margin-bottom: 2px !important; }\n    .nlo-meta input { padding: 4px 7px !important; font-size: 11.5px !important; }\n    .nlo-meta input[type=\"date\"]::-webkit-calendar-picker-indicator { display: none !important; }\n\n    /* step cards */\n    .nlo-card { margin-bottom: 4px !important; box-shadow: none !important;\n                border: 1px solid var(--nlo-grey-300) !important; }\n    .nlo-card--final { margin-bottom: 0 !important; border: 1.5px solid var(--nlo-navy-800) !important; }\n    .nlo-card-head { padding: 4px 10px !important; gap: 7px !important; }\n    .nlo-card-title { font-size: 10.5px !important; }\n    .nlo-step-num { width: 16px !important; height: 16px !important; font-size: 9.5px !important; }\n    .nlo-card-body { padding: 6px 10px !important; }\n    .nlo-card--final .nlo-card-body { padding: 8px 10px !important; }\n    .nlo-hint { font-size: 8.5px !important; line-height: 1.3 !important; margin: 0 0 4px !important; }\n\n    /* treatment chips \u2014 print only the one that was chosen */\n    .nlo-txrow { gap: 5px !important; margin-bottom: 6px !important; }\n    .nlo-txrow:has(.nlo-tx-btn[data-active=\"1\"]) .nlo-tx-btn[data-active=\"0\"] { display: none !important; }\n    .nlo-tx-btn { padding: 4px 10px !important; font-size: 9.5px !important; border-width: 1.5px !important; }\n    .nlo-tx-btn span + span { font-size: 8px !important; }\n\n    /* fields */\n    .nlo-card-body la "From Step 3\" value=\"{{ feeAllAJFmt }}\" style=\"width:140px;box-sizing:border-box;padding:9px 11px;border:2px solid var(--nlo-blue-500);border-radius:var(--radius-sm);font-family:var(--font-body);font-size:15px;font-weight:700;text-align:right;background:var(--nlo-blue-100);color:var(--nlo-blue-700);\">\n          <\u002Fdiv>\n          <div class=\"nlo-op\" style=\"font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--text-muted);padding-bottom:9px;min-width:18px;text-align:center;\">\u00d7<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:3px;\">\n            <label style=\"font-family:var(--font-display);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);\">% Mos Progression<\u002Flabel>\n            <input type=\"number\" step=\"any\" min=\"0\" max=\"100\" placeholder=\"0.8 or 80\" value=\"{{ mosPct }}\" sc-camel-on-change=\"{{ onMosPctChange }}\" style=\"width:110px;box-sizing:border-box;padding:9px 11px;border:2px solid var(--nlo-coral-500);border-radius:var(--radius-sm);font-family:var(--font-body);font-size:15px;font-weight:500;text-align:right;background:var(--nlo-coral-100);color:var(--text-strong);\" style-focus=\"outline:none;box-shadow:0 0 0 3px var(--nlo-coral-200);\">\n            <div class=\"nlo-note\" style=\"font-family:var(--font-body);font-size:11px;font-weight:600;line-height:1.3;max-width:210px;margin-top:2px;{{ mosNoteStyle }}\">{{ mosNoteText }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"nlo-op\" style=\"font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--text-muted);padding-bottom:9px;min-width:18px;text-align:center;\">=<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:3px;\">\n            <label style=\"font-family:var(--font-display);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--nlo-blue-700);\">Fee Due for AJs<\u002Flabel>\n            <input type=\"text\" readonly=\"\" value=\"{{ feeDueAJFmt }}\" style=\"width:140px;box-sizing:border-box;padding:9px 11px;border:2px solid var(--nlo-blue-500);border-radius:var(--radius-sm);font-family:var(--font-body);font-size:15px;font-weight:700;text-align:right;background:var(--nlo-blue-100);color:var(--nlo-blue-700);\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"nlo-card\" style=\"background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);margin-bottom:16px;overflow:hidden;break-inside:avoid;\">\n      <div class=\"nlo-card-head\" style=\"display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--nlo-navy-800);color:#fff;\">\n        <div class=\"nlo-step-num\" style=\"background:#fff;color:var(--nlo-navy-800);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:13px;flex-shrink:0;\">5<\u002Fdiv>\n        <div class=\"nlo-card-title\" style=\"font-family:var(--font-display);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:0.02em;\">Total Fee Due for Treatment Rendered<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"nlo-card-body\" style=\"padding:20px;\">\n        <p class=\"nlo-hint\" style=\"font-family:var(--font-body);font-size:13px;color:var(--text-muted);margin:0 0 14px;\">Fee for Recs/TxPlan/INV (Step 1) + Fee Due for AJs (Step 4).<\u002Fp>\n        <div style=\"display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;\">\n          <div style=\"display:flex;flex-direction:column;gap:3px;\">\n            <label style=\"font-family:var(--font-display);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--nlo-blue-700);\">Recs/TxPlan/INV<\u002Flabel>\n            <input type=\"text\" readonly=\"\" value=\"{{ step5RecsFmt }}\" style=\"width:140px;box-sizing:border-box;padding:9px 11px;border:2px solid var(--nlo-blue-500);border-radius:var(--radius-sm);font-family:var(--font-body);font-size:15px;font-weight:700;text-align:right;background:var(--nlo-blue-100);color:var(--nlo-blue-700);\">\n          <\u002Fdiv>\n          <div class=\"nlo-op\" style=\"font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--text-muted);padding-bottom:9px;min-width:18px;text-align:center;\">+<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:3px;\">\n            <label style=\"font-family:var(--font-display);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--nlo-blue-700);\">Fee Due for AJs<\u002Flabel>\n            <input type=\"text\" readonly=\"\" value=\"{{ step5AJFmt }}\" style=\"width:140px;box-sizing:border-box;padding:9px 11px;border:2px solid var(--nlo-blue-500);border-radius:var(--radius-sm);font-family:var(--font-body);font-size:15px;font-weight:700;text-align:right;background:var(--nlo-blue-100);color:var(--nlo-blue-700);\">\n          <\u002Fdiv>\n          <div class=\"nlo-op\" style=\"font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--text-muted);padding-bottom:9px;min-width:18px;text-align:center;\">=<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:3px;\">\n            <label style=\"font-family:var(--font-display);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--nlo-blue-700);\">Total Fee Due for Tx<\u002Flabel>\n            <input type=\"text\" readonly=\"\" value=\"{{ totalFeeDueTxFmt }}\" style=\"width:160px;box-sizing:border-box;padding:9px 11px;border:2px solid var(--nlo-blue-500);border-radius:var(--radius-sm);font-family:var(--font-body);font-size:16px;font-weight:700;text-align:right;background:var(--nlo-blue-100);color:var(--nlo-blue-700);\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"nlo-card nlo-card--final\" style=\"background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-md);margin-bottom:20px;overflow:hidden;border:2px solid var(--nlo-navy-800);break-inside:avoid;\">\n      <div class=\"nlo-card-head\" style=\"display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--nlo-navy-900);color:#fff;\">\n        <div class=\"nlo-step-num\" style=\"background:#fff;color:var(--nlo-navy-900);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:14px;flex-shrink:0;\">\u2713<\u002Fdiv>\n        <div class=\"nlo-card-title\" style=\"font-family:var(--font-display);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:0.02em;\">Final Balance \u2014 Refund or Amount Owed<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"nlo-card-body\" style=\"padding:24px 20px;\">\n        <p class=\"nlo-hint\" style=\"font-family:var(--font-body);font-size:13px;color:var(--text-muted);margin:0 0 16px;\">Total Paid (Step 2) \u2212 Total Fee Due for Tx Rendered (Step 5).<\u002Fp>\n        <div class=\"nlo-final-row\" style=\"display:flex;align-items:flex-end;gap:12px;justify-content:center;margin-bottom:20px;flex-wrap:wrap;\">\n          <div style=\"display:flex;flex-direction:column;gap:3px;\">\n            <label style=\"font-family:var(--font-display);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--nlo-blue-700);\">Total Paid<\u002Flabel>\n            <input type=\"text\" readonly=\"\" value=\"{{ finalPaidFmt }}\" style=\"width:140px;box-sizing:border-box;padding:9px 11px;border:2px solid var(--nlo-blue-500);border-radius:var(--radius-sm);font-family:var(--font-body);font-size:15px;font-weight:700;text-align:right;background:var(--nlo-blue-100);color:var(--nlo-blue-700);\">\n          <\u002Fdiv>\n          <div class=\"nlo-op\" style=\"font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--text-muted);padding-bottom:9px;min-width:18px;text-align:center;\">\u2212<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:3px;\">\n            <label style=\"font-family:var(--font-display);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--nlo-blue-700);\">Total Fee Due Tx<\u002Flabel>\n            <input type=\"text\" readonly=\"\" value=\"{{ finalFeeDueFmt }}\" style=\"width:160px;box-sizing:border-box;padding:9px 11px;border:2px solid var(--nlo-blue-500);border-radius:var(--radius-sm);font-family:var(--font-body);font-size:15px;font-weight:700;text-align:right;background:var(--nlo-blue-100);color:var(--nlo-blue-700);\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"nlo-result\" style=\"text-align:center;padding:22px 16px;background:var(--surface-sunken);border-radius:var(--radius-md);\">\n          <div class=\"nlo-amount\" style=\"font-family:var(--font-display);font-weight:700;font-size:38px;text-transform:uppercase;letter-spacing:0.01em;margin:0 0 10px;color:{{ balanceColor }};\">{{ balanceAmountText }}<\u002Fdiv>\n          <div class=\"nlo-badge\" style=\"display:inline-block;font-family:var(--font-display);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:0.05em;padding:7px 18px;border-radius:var(--radius-pill);color:{{ balanceLabelColor }};background:{{ balanceLabelBg }};\">{{ balanceLabelText }}<\u002Fdiv>\n          <div class=\"nlo-formula\" style=\"font-family:var(--font-mono);font-size:12px;color:var(--text-muted);margin-top:12px;\">{{ formulaText }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"nlo-actions\" style=\"display:flex;gap:14px;justify-content:center;margin-top:8px;{{ actionsHide }}\">\n      <x-import component-from-global-scope=\"NextLevelOrthodonticsDesignSystem_1cb734.Button\" variant=\"primary\" sc-camel-on-click=\"{{ handlePrint }}\" hint-size=\"auto,48px\">Print for Reference<\u002Fx-import>\n      <x-import component-from-global-scope=\"NextLevelOrthodonticsDesignSystem_1cb734.Button\" variant=\"outline\" sc-camel-on-click=\"{{ handleClear }}\" hint-size=\"auto,48px\">Clear All<\u002Fx-import>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showLegend&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Behavior&quot;}, &quot;showBackLink&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Behavior&quot;}, &quot;backLinkUrl&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;index.html&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Behavior&quot;}}\">\nconst TX_PRESETS = [\n  { type: 'Braces', fee: 800 },\n  { type: 'Oliv', fee: 1225 },\n  { type: 'Inv', fee: 1800 },\n  { type: 'Angel Aligners', fee: 1225 },\n  { type: 'NLA', fee: 950 },\n  { type: 'Inbrace', fee: 1500 },\n];\n\nfunction todayISO() {\n  const d = new Date();\n  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');\n}\n\nfunction fmt(v) {\n  return (v || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n}\n\nfunction num(v) {\n  const n = parseFloat(String(v || '').replace(/,/g, ''));\n  return isFinite(n) ? n : 0;\n}\n\nfunction pctLabel(p) {\n  const s = (p * 100).toFixed(2);\n  return (s.indexOf('.') > -1 ? s.replace(/0+$/, '').replace(/\\.$/, '') : s) + '%';\n}\n\nclass Component extends DCLogic {\n  state = {\n    patientName: '',\n    calcDate: todayISO(),\n    selectedType: '',\n    selectedFee: 0,\n    insPaid: '',\n    rpPaid: '',\n    totalFee: '',\n    mosPct: '',\n    isPrinting: false,\n    printDate: '',\n  };\n\n  componentDidMount() {\n    this._onBeforePrint = () => {\n      const now = new Date();\n      this.setState({ isPrinting: true, printDate: 'Printed: ' + now.toLocaleDateString() + ' ' + now.toLocaleTimeString() });\n    };\n    this._onAfterPrint = () => this.setState({ isPrinting: false });\n    window.addEventListener('beforeprint', this._onBeforePrint);\n    window.addEventListener('afterprint', this._onAfterPrint);\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('beforeprint', this._onBeforePrint);\n    window.removeEventListener('afterprint', this._onAfterPrint);\n  }\n\n  noteStyle(kind) {\n    if (kind === 'ok') return 'color:var(--nlo-mint-700);';\n    if (kind === 'warn') return 'color:var(--nlo-amber-700);background:var(--nlo-amber-100);border-left:3px solid var(--nlo-amber-500);padding:3px 7px;border-radius:4px;';\n    if (kind === 'error') return 'color:var(--nlo-coral-700);background:var(--nlo-coral-100);border-left:3px solid var(--nlo-coral-500);padding:3px 7px;border-radius:4px;';\n    return '';\n  }\n\n  readMosPct(raw) {\n    const cleaned = String(raw || '').replace(/[%,\\s]/g, '').trim();\n    if (cleaned === '') return { value: 0, text: '', kind: '' };\n    const n = parseFloat(cleaned);\n    if (!isFinite(n)) return { value: 0, text: 'Not a number \u2014 reading as 0%.', kind: 'error' };\n    if (n < 0) return { value: 0, text: 'Negative entry \u2014 reading as 0%.', kind: 'error' };\n    if (n > 100) return { value: 1, text: n + ' is over 100% \u2014 capped at 100%. Check the entry.', kind: 'error' };\n    if (n > 1) {\n      const p = n / 100;\n      return { value: p, text: 'Reading as ' + pctLabel(p) + '  (' + (+p.toFixed(4)) + ')', kind: 'warn' };\n    }\n    return { value: n, text: '= ' + pctLabel(n) + ' of months completed', kind: 'ok' };\n  }\n\n  clearAll() {\n    this.setState({\n      patientName: '', calcDate: todayISO(), selectedType: '', selectedFee: 0,\n      insPaid: '', rpPaid: '', totalFee: '', mosPct: '',\n    });\n  }\n\n  renderVals() {\n    const s = this.state;\n    const feeRecs = s.selectedFee || 0;\n    const insPaid = num(s.insPaid);\n    const rpPaid = num(s.rpPaid);\n    const totalPaid = insPaid + rpPaid;\n    const totalFee = num(s.totalFee);\n    const remainingFee = totalFee - feeRecs;\n    const remainingNoteText = (totalFee > 0 && remainingFee < -0.005)\n      ? 'Total fee is below the ' + fmt(feeRecs) + ' records/lab fee \u2014 check Step 1 and the fee entered.'\n      : '';\n\n    const feeAllAJ = remainingFee;\n    const mos = this.readMosPct(s.mosPct);\n    const feeDueAJ = feeAllAJ * mos.value;\n    const totalFeeDueTx = feeRecs + feeDueAJ;\n    const balance = totalPaid - totalFeeDueTx;\n\n    let balanceAmountText, balanceColor, balanceLabelText, balanceLabelColor, balanceLabelBg;\n    if (balance < -0.005) {\n      balanceAmountText = '$' + fmt(Math.abs(balance));\n      balanceColor = 'var(--nlo-coral-700)';\n      balanceLabelText = 'Patient Owes';\n      balanceLabelColor = 'var(--nlo-coral-700)';\n      balanceLabelBg = 'var(--nlo-coral-100)';\n    } else if (balance > 0.005) {\n      balanceAmountText = '$' + fmt(balance);\n      balanceColor = 'var(--nlo-mint-700)';\n      balanceLabelText = 'We Refund';\n      balanceLabelColor = 'var(--nlo-mint-700)';\n      balanceLabelBg = 'var(--nlo-mint-100)';\n    } else {\n      balanceAmountText = '$0.00';\n      balanceColor = 'var(--nlo-grey-600)';\n      balanceLabelText = 'Balanced \u2014 Nothing Owed';\n      balanceLabelColor = 'var(--nlo-grey-600)';\n      balanceLabelBg = 'var(--nlo-grey-100)';\n    }\n\n    const txButtons = TX_PRESETS.map(p => {\n      const active = p.type === s.selectedType;\n      return {\n        type: p.type,\n        feeLabel: '$' + p.fee.toLocaleString(),\n        active: active ? '1' : '0',\n        style: active ? 'border-color:var(--nlo-navy-800);background:var(--nlo-navy-800);color:#fff;' : '',\n        subStyle: active ? 'opacity:0.8;' : '',\n        onSelect: () => this.setState({ selectedType: p.type, selectedFee: p.fee }),\n      };\n    });\n\n    const showLegend = this.props.showLegend ?? true;\n    const showBackLink = this.props.showBackLink ?? true;\n    const backLinkUrl = this.props.backLinkUrl || 'index.html';\n\n    return {\n      backLinkUrl,\n      backLinkHide: showBackLink ? (s.isPrinting ? 'display:none;' : '') : 'display:none;',\n      legendHide: showLegend ? (s.isPrinting ? 'display:none;' : '') : 'display:none;',\n      actionsHide: s.isPrinting ? 'display:none;' : '',\n      printDateShow: s.isPrinting ? 'display:block;' : '',\n      printDateText: s.printDate,\n\n      patientName: s.patientName,\n      onPatientNameChange: e => this.setState({ patientName: e.target.value }),\n      calcDate: s.calcDate,\n      onCalcDateChange: e => this.setState({ calcDate: e.target.value }),\n\n      txButtons,\n      feeRecsDisplay: feeRecs ? fmt(feeRecs) : '',\n      selectedTxLabel: s.selectedType ? (s.selectedType + ' \u2014 $' + feeRecs.toLocaleString()) : '',\n\n      insPaid: s.insPaid,\n      onInsPaidChange: e => this.setState({ insPaid: e.target.value }),\n      rpPaid: s.rpPaid,\n      onRpPaidChange: e => this.setState({ rpPaid: e.target.value }),\n      totalPaidFmt: fmt(totalPaid),\n\n      totalFee: s.totalFee,\n      onTotalFeeChange: e => this.setState({ totalFee: e.target.value }),\n      step3RecsFmt: fmt(feeRecs),\n      remainingFeeFmt: fmt(remainingFee),\n      remainingNoteText,\n      remainingNoteStyle: remainingNoteText ? this.noteStyle('error') : 'display:none;',\n\n      feeAllAJFmt: fmt(feeAllAJ),\n      mosPct: s.mosPct,\n      onMosPctChange: e => this.setState({ mosPct: e.target.value }),\n      mosNoteText: mos.text,\n      mosNoteStyle: mos.text ? this.noteStyle(mos.kind) : 'display:none;',\n      feeDueAJFmt: fmt(feeDueAJ),\n\n      step5RecsFmt: fmt(feeRecs),\n      step5AJFmt: fmt(feeDueAJ),\n      totalFeeDueTxFmt: fmt(totalFeeDueTx),\n\n      finalPaidFmt: fmt(totalPaid),\n      finalFeeDueFmt: fmt(totalFeeDueTx),\n      balanceAmountText, balanceColor, balanceLabelText, balanceLabelColor, balanceLabelBg,\n      formulaText: fmt(totalPaid) + ' \u2212 ' + fmt(totalFeeDueTx) + ' = ' + fmt(balance),\n\n      handlePrint: () => window.print(),\n      handleClear: () => this.clearAll(),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
