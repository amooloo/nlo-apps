*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --bg:#f3f5f9;--surface:#fff;--sunken:#f7f9fc;
  --line:#e3e8ef;--line-2:#d3dbe6;
  --ink:#16253b;--ink-2:#46566e;--ink-3:#74849b;--ink-4:#a3afc0;
  --accent:#2459d6;--accent-ink:#1b46ad;--accent-soft:#edf2fd;--accent-line:#c7d6f6;
  --teal:#0b7f8a;--teal-ink:#096670;--teal-soft:#e6f4f5;--teal-line:#b9dfe2;
  --violet:#6a3fd0;--violet-soft:#f1ecfd;--violet-line:#dacffa;
  --ok:#16825a;--ok-soft:#e7f5ee;--ok-line:#b7e0cb;
  --warn:#a8610b;--warn-soft:#fdf3e2;--warn-line:#f1d5a4;
  --danger:#c53535;--danger-soft:#fdecec;--danger-line:#f3c3c3;
  --r-lg:18px;--r:12px;--r-sm:9px;
  --sh-1:0 1px 2px rgba(22,37,59,.05),0 1px 1px rgba(22,37,59,.03);
  --sh-2:0 8px 28px rgba(22,37,59,.12),0 2px 6px rgba(22,37,59,.07);
}
html{-webkit-text-size-adjust:100%;}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;}
@media print{
  body{background:#f8fafc;}
  body > #root > *:not(.print-only){display:none!important;}
  .print-only{display:block!important;}
  @page{margin:12mm 10mm;}
}
.print-only{display:none;}
/* The printed form keeps the original page's text settings, whatever the on-screen design uses. */
.print-only{font-size:16px;line-height:normal;color:initial;letter-spacing:normal;-webkit-font-smoothing:auto;font-variant-numeric:normal;}

/* ── sign-in gate ─────────────────────────────────────────────── */
.ip-gate{display:flex;position:fixed;inset:0;z-index:9999;background:#16253b;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:var(--font);padding:24px;text-align:center;}
.ip-gate h1{font-size:28px;font-weight:700;color:#f4f7fb;letter-spacing:-.01em;}
.ip-gate p{font-size:15px;color:#9fb0c7;margin-bottom:14px;}
.ip-gate button{padding:13px 30px;font:600 16px var(--font);border:0;border-radius:12px;background:#3d7bf0;color:#fff;cursor:pointer;}
.ip-gate button:hover{background:#4d87f4;}
.ip-gate #authErr{color:#ff9d9d;font-size:13px;max-width:340px;min-height:18px;margin-top:6px;}

/* ── app shell ────────────────────────────────────────────────── */
.ip-app{font-family:var(--font);color:var(--ink);min-height:100vh;}
.ip-app button,.ip-app input,.ip-app select,.ip-app textarea{font-family:inherit;color:inherit;touch-action:manipulation;}
.ip-app button{cursor:pointer;}
.ip-app :focus-visible,.ip-dialog :focus-visible,.ip-overlay :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.ip-shell{width:100%;max-width:940px;margin:0 auto;padding:56px 16px 36px;}
/* One wide column on anything tablet-sized and up. Only the title row steps around the fixed
   "NLO Apps" pill (top-left); everything below it uses the full width so the diagram can be big. */
@media (min-width:700px){
  .ip-shell{width:min(1240px,calc(100vw - 32px));max-width:none;padding:26px 0 44px;}
  .ip-top{padding-left:max(0px,calc(124px - (100vw - min(1240px,100vw - 32px)) / 2));}
}

/* header */
.ip-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap;}
.ip-title{font-size:24px;font-weight:700;letter-spacing:-.015em;line-height:1.15;display:flex;align-items:baseline;gap:9px;}
.ip-title small{font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:0;}
.ip-sub{font-size:13px;color:var(--ink-3);margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.ip-actions{display:flex;gap:8px;align-items:center;}

/* buttons */
.ip-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 18px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:14px;font-weight:600;line-height:1;transition:background .12s,border-color .12s,box-shadow .12s,transform .06s;white-space:nowrap;}
.ip-btn:hover{background:var(--sunken);border-color:#c3cddb;}
.ip-btn:active{transform:translateY(1px);}
.ip-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.ip-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(36,89,214,.35);}
.ip-btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink);}
.ip-btn.ok{background:var(--ok);border-color:var(--ok);color:#fff;}
.ip-btn.ok:hover{background:#12704e;border-color:#12704e;}
.ip-btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;}
.ip-btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2);}
.ip-btn.quiet:hover{background:#e9eef5;}
.ip-btn.soft{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink);}
.ip-btn.soft:hover{background:#e2eafb;}
.ip-btn.violet{background:var(--violet-soft);border-color:var(--violet-line);color:var(--violet);}
.ip-btn.violet:hover{background:#e9e1fb;}
.ip-btn.violet-solid{background:var(--violet);border-color:var(--violet);color:#fff;}
.ip-btn.violet-solid:hover{background:#5a33b3;border-color:#5a33b3;}
.ip-btn.sm{min-height:34px;padding:0 13px;font-size:13px;border-radius:10px;}
.ip-btn.block{width:100%;}
.ip-btn.icon{width:42px;padding:0;}
.ip-btn svg{flex:none;}

/* menu */
.ip-menu-wrap{position:relative;}
.ip-menu-scrim{position:fixed;inset:0;z-index:998;}
.ip-menu{position:absolute;right:0;top:48px;z-index:999;min-width:214px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-2);padding:6px;}
.ip-menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;border:0;background:transparent;border-radius:9px;font-size:14px;font-weight:500;color:var(--ink);}
.ip-menu button:hover{background:var(--sunken);}
.ip-menu svg{color:var(--ink-3);}

/* patient strip */
.ip-strip{display:flex;align-items:center;gap:18px 22px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:11px 16px;margin-bottom:14px;box-shadow:var(--sh-1);}
.ip-who{display:flex;align-items:center;gap:12px;min-width:0;}
.ip-avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13.5px;letter-spacing:.02em;flex:none;}
.ip-who b{display:block;font-size:15px;font-weight:700;line-height:1.15;}
.ip-who span{display:block;font-size:12.5px;color:var(--ink-3);line-height:1.2;margin-top:2px;}
.ip-field{display:flex;flex-direction:column;gap:3px;}
.ip-field label{font-size:12px;font-weight:500;color:var(--ink-3);}
.ip-input,.ip-select{height:36px;padding:0 10px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);font-size:14px;font-weight:500;min-width:0;}
.ip-input:focus,.ip-select:focus,.ip-text:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(36,89,214,.16);}
.ip-input:disabled,.ip-select:disabled{background:var(--sunken);color:var(--ink-3);}
.ip-select{padding-right:6px;cursor:pointer;}
.ip-status{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:13px;color:var(--ink-3);font-weight:500;flex-wrap:wrap;}
.ip-status .ip-sv{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.ip-dot{width:8px;height:8px;border-radius:50%;background:var(--ink-4);flex:none;}
.ip-dot.ok{background:#25a56e;}.ip-dot.bad{background:var(--danger);}.ip-dot.busy{background:var(--accent);animation:ip-pulse 1s ease-in-out infinite;}
@keyframes ip-pulse{50%{opacity:.35;}}
.ip-empty-strip{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r-lg);padding:14px 18px;margin-bottom:14px;color:var(--ink-2);}
.ip-empty-strip b{color:var(--ink);font-weight:600;}
.ip-banner{display:flex;align-items:center;gap:10px;background:var(--warn-soft);border:1px solid var(--warn-line);color:#7a4607;border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:13.5px;font-weight:500;}
.ip-banner svg{flex:none;}

/* tabs */
.ip-tabs{display:inline-flex;gap:2px;background:#e8edf4;padding:4px;border-radius:14px;margin-bottom:14px;max-width:100%;overflow-x:auto;}
.ip-tab{border:0;background:transparent;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;color:var(--ink-3);display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:background .12s,color .12s,box-shadow .12s;}
.ip-tab:hover{color:var(--ink-2);}
.ip-tab.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(22,37,59,.14);}
.ip-badge svg{flex:none;}
.ip-badge{font-size:11.5px;font-weight:700;border-radius:20px;padding:2px 9px;background:var(--teal-soft);color:var(--teal-ink);line-height:1.3;display:inline-flex;align-items:center;gap:8px;}
.ip-badge .bt{display:inline-flex;align-items:center;gap:3px;}
.ip-badge .bt + .sp{padding-left:8px;border-left:1px solid rgba(11,127,138,.28);}

/* amount palette */
.ip-palette{position:sticky;top:52px;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:8px 10px 8px 16px;margin-bottom:16px;box-shadow:var(--sh-2);}
.ip-palette.compact{position:sticky;top:0;box-shadow:var(--sh-1);padding:6px 8px 6px 12px;}
.ip-pal-label{font-size:13px;font-weight:600;color:var(--ink-2);margin-right:2px;}
.ip-amts{display:flex;gap:6px;flex-wrap:wrap;}
.ip-amt,.ip-tool{min-width:50px;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-size:16px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background .1s,border-color .1s,color .1s,box-shadow .1s;font-variant-numeric:tabular-nums;}
.ip-palette.compact .ip-amt,.ip-palette.compact .ip-tool{height:38px;min-width:44px;padding:0 11px;font-size:14px;}
.ip-amt:hover,.ip-tool:hover{border-color:#b7c4d8;background:var(--sunken);}
.ip-amt.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 6px rgba(36,89,214,.35);}
.ip-palette.sp .ip-amt.active{background:var(--teal);border-color:var(--teal);box-shadow:0 2px 6px rgba(11,127,138,.35);}
.ip-pal-sep{width:1px;height:26px;background:var(--line);margin:0 2px;}
.ip-tool{font-size:14px;font-weight:600;color:var(--ink-2);}
.ip-tool.active.erase{background:var(--danger-soft);border-color:var(--danger);color:var(--danger);}
.ip-tool.active.missing{background:#e9edf3;border-color:#5b6b82;color:var(--ink);}
.ip-tool.active.type{background:var(--violet-soft);border-color:var(--violet);color:var(--violet);}
.ip-pal-hint{flex:1 1 220px;min-width:0;font-size:13px;color:var(--ink-3);padding-left:6px;}
@media (max-width:760px){.ip-pal-label{display:none;}.ip-pal-hint{flex-basis:100%;padding-left:2px;}}
@media (max-width:560px){.ip-pal-sep{display:none;}}

/* arch panels */
.ip-arches{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-bottom:16px;}
@media (min-width:1000px){.ip-arches{grid-template-columns:repeat(2,minmax(0,1fr));}}
.ip-arch{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px;box-shadow:var(--sh-1);min-width:0;}
.ip-fit{position:relative;width:100%;}
.ip-stage{position:absolute;left:0;top:0;transform-origin:0 0;}
.ip-svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;font-family:var(--font);}
.ip-tooth path{fill:#fff;stroke:#a7b4c6;stroke-width:1.4;stroke-linejoin:round;transition:fill .12s,stroke .12s;}
.ip-tooth text{font-size:13px;font-weight:600;fill:#6b7b92;text-anchor:middle;dominant-baseline:central;pointer-events:none;user-select:none;stroke:#fff;stroke-width:3px;stroke-linejoin:round;paint-order:stroke;}
.ip-tooth.missing path{fill:#f4f6f9;stroke:#b9c3d1;stroke-dasharray:4 3.5;}
.ip-tooth.missing text{font-size:19px;font-weight:500;fill:#97a4b7;stroke:#f4f6f9;}
.ip-tooth:focus,.ip-tooth:focus-visible{outline:none;}
.ip-tooth.pick{pointer-events:all;cursor:pointer;}
.ip-tooth.pick path{stroke:#5b6b82;stroke-dasharray:3.5 3;}
.ip-tooth.pick:hover path{fill:#eef1f6;}
.ip-tooth.pick:focus-visible path{stroke:var(--accent);stroke-width:2.2;}
.ip-stem{stroke:#d3dbe6;stroke-width:1.5;stroke-linecap:round;}
.ip-stem.on{stroke:var(--accent);}
.ip-sp .ip-stem.on{stroke:var(--teal);}
.ip-stem.off{opacity:.35;stroke-dasharray:2 4;}
.ip-quad{font-size:13px;font-weight:700;fill:#8d9bb0;text-anchor:middle;letter-spacing:.04em;}
.ip-sum-lab{font-size:13.5px;font-weight:600;fill:var(--ink-3);text-anchor:middle;}
.ip-sum-num{font-size:40px;font-weight:700;fill:var(--ink);text-anchor:middle;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.ip-sum-num.zero{fill:#c3cdda;}
.ip-sum-num tspan{font-size:16px;font-weight:600;fill:var(--ink-3);letter-spacing:0;}
.ip-sum-sub{font-size:13px;font-weight:600;fill:var(--violet);text-anchor:middle;}
.ip-sum-sub.muted{fill:var(--ink-3);}
.ip-chip{position:absolute;width:38px;height:38px;border-radius:50%;border:1.5px solid #cdd5e1;background:#fff;color:var(--ink);text-align:center;font-size:14px;font-weight:700;padding:0;appearance:textfield;-moz-appearance:textfield;font-variant-numeric:tabular-nums;transition:border-color .1s,background .1s,box-shadow .1s,transform .06s;cursor:text;}
.ip-chip::-webkit-outer-spin-button,.ip-chip::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.ip-chip::placeholder{color:#b6c1d0;font-weight:500;}
.ip-chip.tap{cursor:pointer;}
.ip-chip:hover:not(:disabled):not([readonly]){border-color:var(--accent);}
.ip-chip.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 5px rgba(36,89,214,.28);}
.ip-sp .ip-chip:hover:not(:disabled):not([readonly]){border-color:var(--teal);}
.ip-sp .ip-chip.on{background:var(--teal);border-color:var(--teal);box-shadow:0 2px 5px rgba(11,127,138,.28);}
.ip-chip:focus{outline:none;box-shadow:0 0 0 3px rgba(36,89,214,.28);}
.ip-sp .ip-chip:focus{box-shadow:0 0 0 3px rgba(11,127,138,.28);}
.ip-chip[readonly]{cursor:default;}
.ip-chip:disabled{opacity:.28;cursor:default;box-shadow:none;}
.ip-arch.picking .ip-chip{opacity:.5;}
.ip-prev{position:absolute;width:30px;height:18px;border-radius:9px;background:var(--violet-soft);border:1px solid var(--violet-line);color:var(--violet);font-size:11px;font-weight:700;display:grid;place-items:center;pointer-events:none;font-variant-numeric:tabular-nums;}
.ip-bt{position:absolute;width:26px;height:26px;border:0;border-radius:8px;background:transparent;display:grid;place-items:center;padding:0;color:#b9c4d3;transition:color .1s,background .1s;}
.ip-bt svg{display:block;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round;transition:fill .1s;}
.ip-bt:hover:not(:disabled){color:#5b6b82;background:#eef1f6;}
.ip-bt.on{color:#111827;}
.ip-bt.on svg{fill:currentColor;}
.ip-bt:disabled{cursor:default;opacity:.35;}
.ip-bt.on:disabled{opacity:.85;}
.ip-bt:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

/* cards, stats, lists */
.ip-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--sh-1);margin-bottom:16px;}
.ip-card h3{font-size:15px;font-weight:700;margin-bottom:2px;}
.ip-hint{font-size:13px;color:var(--ink-3);}
.ip-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.ip-gauge{display:inline-flex;align-items:center;gap:9px;padding:8px 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer;user-select:none;}
.ip-gauge input{width:17px;height:17px;accent-color:var(--ok);cursor:pointer;}
.ip-gauge.on{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok);}
.ip-gauge.ro{cursor:default;opacity:.7;}
.ip-gauge.ro input{cursor:default;}
.ip-legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-3);}
.ip-legend i{display:inline-block;vertical-align:-3px;margin-right:6px;}
.ip-lg-chip{width:16px;height:16px;border-radius:50%;background:var(--accent);}
.ip-lg-pill{width:22px;height:13px;border-radius:7px;background:var(--violet-soft);border:1px solid var(--violet-line);vertical-align:-2px!important;}
.ip-metabar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
.ip-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;}
.ip-stats.four{grid-template-columns:repeat(4,minmax(0,1fr));}
.ip-stat{padding:2px 18px;border-left:1px solid var(--line);}
.ip-stat:first-child{border-left:0;padding-left:0;}
.ip-stat .lab{font-size:13px;font-weight:500;color:var(--ink-3);}
.ip-stat .val{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums;}
.ip-stat .val small{font-size:14px;font-weight:600;color:var(--ink-3);margin-left:3px;letter-spacing:0;}
.ip-stat.hero .val{color:var(--accent);}
.ip-stat.sp .val{color:var(--teal);}
.ip-stat.cum .val{color:var(--violet);}
.ip-stats-title{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.ip-stats-title.cum{color:var(--violet);margin-top:16px;padding-top:14px;border-top:1px solid var(--line);}
.ip-cum-foot{margin-top:14px;display:flex;justify-content:flex-end;}
@media (max-width:560px){.ip-stat{padding:2px 10px;}.ip-stat .val{font-size:24px;}.ip-stats.four{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:14px;}.ip-stats.four .ip-stat:nth-child(3){border-left:0;padding-left:0;}}
.ip-quick{display:flex;gap:10px;align-items:center;}
.ip-quick .ip-text{flex:1;min-width:0;}
.ip-text{width:100%;border:1px solid var(--line-2);border-radius:11px;background:var(--surface);padding:0 14px;height:42px;font-size:14px;}
textarea.ip-text{height:auto;padding:11px 14px;line-height:1.5;resize:vertical;}
.ip-text::placeholder{color:var(--ink-4);}
.ip-text[readonly]{background:var(--sunken);color:var(--ink-2);cursor:default;}
.ip-msg{margin-top:8px;font-size:13px;font-weight:600;}
.ip-msg.ok{color:var(--ok);}.ip-msg.err{color:var(--danger);}
.ip-lists{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-bottom:16px;}
@media (min-width:760px){.ip-lists{grid-template-columns:repeat(2,minmax(0,1fr));}}
.ip-lists .ip-card{margin-bottom:0;}
.ip-list-h{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline;}
.ip-list-h span{color:var(--ink-3);font-weight:500;}
.ip-li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eef1f6;font-size:14px;}
.ip-li:last-of-type{border-bottom:0;}
.ip-li b{font-weight:700;font-variant-numeric:tabular-nums;}
.ip-li.upper b{color:var(--accent);}.ip-li.lower b{color:var(--accent);}.ip-li.sp b{color:var(--teal);}
.ip-li .bt{display:inline-flex;align-items:center;gap:8px;}
.ip-tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;margin-top:2px;border-top:1px solid var(--line);font-weight:600;color:var(--ink-2);}
.ip-tot b{font-size:18px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
.ip-none{font-size:13.5px;color:var(--ink-4);padding:6px 0;}
.ip-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 18px;box-shadow:var(--sh-1);}
.ip-foot .msg{font-size:13.5px;color:var(--ink-2);}
.ip-foot .msg.err{color:var(--danger);font-weight:600;}
.ip-foot .where{margin-left:auto;font-size:13px;color:var(--ink-3);}

/* chart note */
.ip-seg{display:inline-flex;gap:2px;background:#e8edf4;padding:3px;border-radius:12px;}
.ip-seg button{border:0;background:transparent;border-radius:9px;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--ink-3);}
.ip-seg button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(22,37,59,.14);}
.ip-checks{display:flex;align-items:center;gap:20px;flex-wrap:wrap;font-size:14px;color:var(--ink-2);margin:14px 0 12px;}
.ip-checks label{display:inline-flex;align-items:center;gap:8px;cursor:pointer;}
.ip-checks label.dis{opacity:.45;cursor:default;}
.ip-checks input{width:17px;height:17px;accent-color:var(--accent);cursor:inherit;}
.ip-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.65;}
.ip-edited{font-size:13px;color:var(--warn);font-weight:600;}

/* modals */
.ip-overlay{position:fixed;inset:0;background:rgba(16,28,46,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;font-family:var(--font);color:var(--ink);}
.ip-overlay button,.ip-overlay input,.ip-overlay select{font-family:inherit;color:inherit;touch-action:manipulation;}
.ip-overlay button{cursor:pointer;}
.ip-dialog{background:var(--surface);border-radius:22px;width:100%;max-width:500px;max-height:92vh;overflow:auto;padding:28px;box-shadow:0 24px 70px rgba(10,20,40,.35);}
.ip-dialog.mid{max-width:600px;}
.ip-dialog.wide{max-width:1120px;padding:24px;}
.ip-dlg-h{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px;}
.ip-dlg-s{font-size:14px;color:var(--ink-3);margin-bottom:18px;}
.ip-dlg-gap{height:14px;}
.ip-recents{margin-bottom:18px;}
.ip-recents .lab{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:8px;}
.ip-recent-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.ip-recent{padding:11px 13px;border-radius:12px;border:1px solid var(--accent-line);background:var(--accent-soft);font-size:14px;font-weight:700;color:var(--accent-ink);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ip-recent:hover{background:#e2eafb;}
.ip-recent span{font-weight:500;color:var(--ink-3);margin-left:7px;}
.ip-opts{display:flex;flex-direction:column;gap:10px;}
.ip-opt{display:flex;align-items:center;gap:14px;text-align:left;padding:16px 18px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);transition:border-color .12s,background .12s,box-shadow .12s;}
.ip-opt:hover{border-color:var(--accent);box-shadow:0 0 0 3px rgba(36,89,214,.1);}
.ip-opt .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none;}
.ip-opt.new .ico{background:var(--ok-soft);color:var(--ok);}
.ip-opt.new:hover{border-color:var(--ok);box-shadow:0 0 0 3px rgba(22,130,90,.12);}
.ip-opt b{display:block;font-size:15.5px;font-weight:700;}
.ip-opt span.d{display:block;font-size:13.5px;color:var(--ink-3);margin-top:2px;}
.ip-dlg-foot{display:flex;flex-direction:column;gap:8px;margin-top:18px;}
.ip-search{display:flex;gap:8px;margin-bottom:10px;}

/* ── patient photos (27 Oct 2026: the same pictures as NLO Cases, the same editor) ───────────── */
.pav{--s:32px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:inline-flex;align-items:flex-end;justify-content:center;overflow:hidden;background:var(--accent-soft);color:var(--accent-line);vertical-align:middle;}
.pav svg{width:80%;height:80%;fill:currentColor;}
.pav img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .15s,transform .15s;}
.pav.on{background:var(--sunken);}
.pav.s28{--s:28px;}.pav.s32{--s:32px;}.pav.s36{--s:36px;}.pav.s44{--s:44px;}.pav.s64{--s:64px;}.pav.s66{--s:66px;}.pav.s96{--s:96px;}
.pav.none{opacity:.75;}
/* the eye: blurred until hovered (the editor always shows the picture), and "Jane D." names */
body.phHide .pav.on img{filter:blur(7px) saturate(.5);transform:scale(1.35);}
body.phHide .pav.on:hover img,body.phHide #phWrap .pav.on img{filter:none;transform:none;}
body.phHide .pnm:not(:hover) .pnF{display:none;}
body.phHide .pnm:not(:hover)::after{content:attr(data-s);}
.phTgl[aria-pressed="true"]{color:var(--danger);background:var(--danger-soft);border-color:var(--danger-line);}
/* the patient strip: the picture is a button (change or add the photo); a picture dropped on it is taken */
.ip-pbtn{position:relative;flex:none;border:0;background:none;padding:0;border-radius:50%;cursor:pointer;display:inline-flex;}
.ip-pbtn .ip-pcam{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:50%;background:#fff;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--sh-1);border:1px solid var(--line-2);}
.ip-pbtn:hover .pav,.ip-pbtn:focus-visible .pav{box-shadow:0 0 0 3px var(--accent-line);}
.ip-pbtn.over .pav,.phSlot.over .pav{box-shadow:0 0 0 3px var(--accent);}
.ip-pbtn:disabled{cursor:default;}
.ip-pbtn:disabled .ip-pcam{display:none;}
/* the New patient form's photo slot */
.ip-np-row{display:flex;gap:16px;align-items:flex-start;}
.ip-np-row .ip-form{flex:1;min-width:0;}
.phSlot{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;padding:4px;border-radius:12px;border:0;background:none;cursor:pointer;margin-top:18px;}
.phSlot:hover .pav{box-shadow:0 0 0 3px var(--accent-line);}
.phSlotL{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--accent);white-space:nowrap;}
.phSlot.set .phSlotL{color:var(--ink-3);}
/* the editor */
#phWrap{position:fixed;inset:0;z-index:11500;background:rgba(16,28,46,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;font-family:var(--font);color:var(--ink);font-size:14px;line-height:1.45;}
#phWrap button,#phWrap input{font-family:inherit;}
#phWrap.over .phBox{box-shadow:0 0 0 3px var(--accent),0 24px 70px rgba(10,20,40,.35);}
#phWrap .small{font-size:13px;}#phWrap .muted{color:var(--ink-3);}
.phBox{background:var(--surface);border-radius:22px;box-shadow:0 24px 70px rgba(10,20,40,.35);width:min(420px,100%);max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column;}
.phHd{display:flex;align-items:flex-start;gap:10px;padding:18px 16px 4px 22px;}
.phHd h3{font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-.01em;}
.phName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.phPick,.phCrop{padding:10px 22px 2px;}
.phDrop{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;border:2px dashed var(--line-2);border-radius:14px;padding:20px 16px;cursor:pointer;color:var(--ink);}
.phDrop:hover,#phWrap.over .phDrop{border-color:var(--accent);background:var(--accent-soft);}
.phDrop b{font-size:14px;}
.phBtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px;}
.ip-btn.danger{color:var(--danger);}
.phStage{position:relative;width:min(260px,calc(100vw - 84px));aspect-ratio:1/1;margin:2px auto 0;border-radius:12px;overflow:hidden;touch-action:none;cursor:grab;background:var(--sunken);}

.phRing{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 999px rgba(17,32,58,.45),inset 0 0 0 2px rgba(255,255,255,.9);pointer-events:none;}

.phZoom input{flex:1;max-width:170px;accent-color:var(--ink);}

.phErr:not(:empty){padding-top:10px;}
.phFt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:14px 22px 18px;}
/* lists: the picture before the name */
.ip-result{justify-content:flex-start;}
.ip-result .ip-rtxt{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:center;gap:10px;}

.ip-recent .ip-rtxt{min-width:0;overflow:hidden;text-overflow:ellipsis;}
.ip-who-hd{display:flex;align-items:center;gap:12px;margin-bottom:14px;}

/* the shared rules (Dr. A's "publish the rules" card); build.py fills it in */
const IPR_RULES = "rules_version = '2';\n// NLO Cases \u2014 Firestore security rules.\n// Case bodies are encrypted in the browser; these rules decide WHO may read or\n// write the ciphertext, keep the history log append-only, and stop anyone who\n// is not an active member (or a removed member) from touching anything.\nservice cloud.firestore {\n  match /databases/{db}/documents {\n    function authed() { return request.auth != null; }\n    function hasSetup() { return exists(/databases/$(db)/documents/meta/setup); }\n    function isOwner() { return authed() && hasSetup() && get(/databases/$(db)/documents/meta/setup).data.owner == request.auth.uid; }\n    function myDoc() { return /databases/$(db)/documents/members/$(request.auth.uid); }\n    function isMember() { return authed() && exists(myDoc()) && get(myDoc()).data.active == true; }\n    function mySid() { return get(myDoc()).data.staffId; }\n    function curV() { return get(/databases/$(db)/documents/meta/keys).data.current; }\n    // true only inside the one-time office setup batch, and only for the practice owner's\n    // verified email address (stops anyone else claiming an empty office)\n    function bootstrapping() {\n      return authed() && !hasSetup()\n        && request.auth.token.email == '__OWNER_EMAIL__' && request.auth.token.email_verified == true\n        && getAfter(/databases/$(db)/documents/meta/setup).data.owner == request.auth.uid;\n    }\n    // a public key must look like a P-256 JWK (the owner's client also tolerates bad ones)\n    function okPub(d) {\n      return !('pub' in d) || (d.pub is map && d.pub.keys().hasOnly(['kty', 'crv', 'x', 'y'])\n        && d.pub.kty == 'EC' && d.pub.crv == 'P-256' && d.pub.x is string && d.pub.y is string\n        && d.pub.x.size() == 43 && d.pub.y.size() == 43);\n    }\n    // the front-desk email for cases not shipped in time (8 Oct 2026): on or off, the one address it may go to, which mailbox's\n    // script sends it and that script's public key (the note is sealed to it), and whether it names the patient\n    function okNotify(d) {\n      return !('notify' in d) || (d.notify is map && d.notify.keys().hasOnly(['on', 'to', 'box', 'pub', 'names'])\n        && d.notify.on is bool && d.notify.names is bool\n        && d.notify.to is string && d.notify.to.size() <= 120 && d.notify.to.matches('^[^@ ]+@[^@ ]+[.][^@ ]+$')\n        && d.notify.box is string && d.notify.box.matches('^(b[0-9a-f]{32})?$') && okPub(d.notify));\n    }\n\n    match /meta/setup {\n      allow get: if isMember();\n      allow create: if bootstrapping()\n        && request.resource.data.keys().hasOnly(['owner', 'at'])\n        && request.resource.data.owner == request.auth.uid\n        && request.resource.data.at == request.time\n        && getAfter(myDoc()).data.role == 'owner';\n      allow update, delete: if false;\n    }\n    match /meta/keys {\n      allow get: if isMember();\n      allow create: if bootstrapping() && request.resource.data.keys().hasOnly(['current']) && request.resource.data.current == 1;\n      allow update: if isOwner() && request.resource.data.keys().hasOnly(['current'])\n        && request.resource.data.current == resource.data.current + 1;\n      allow delete: if false;\n    }\n    match /meta/settings {\n      allow get: if isMember();\n      allow create: if bootstrapping() || isOwner();\n      allow update: if isOwner();\n      allow delete: if false;\n    }\n    match /meta/recovery {\n      allow get: if isOwner();\n      allow create: if bootstrapping() || isOwner();\n      allow update: if isOwner();\n      allow delete: if false;\n    }\n    // username -> sign-in address. Readable one at a time (needed before sign-in), never listable.\n    match /logins/{name} {\n      allow get: if true;\n      allow list: if false;\n      allow create, update: if isOwner() && request.resource.data.keys().hasOnly(['email']) && request.resource.data.email is string;\n      allow delete: if isOwner();\n    }\n    match /members/{uid} {\n      allow get: if authed() && (request.auth.uid == uid || isOwner());\n      allow list: if isOwner();\n      allow create: if (isOwner() && request.resource.data.role == 'staff')\n        || (bootstrapping() && uid == request.auth.uid && request.resource.data.role == 'owner' && request.resource.data.active == true);\n      // the owner manages everyone (and can never demote themself); a person may only\n      // update their own key material, and only while still active\n      allow update: if (isOwner() && (uid != request.auth.uid || (request.resource.data.role == 'owner' && request.resource.data.active == true)))\n        || (authed() && request.auth.uid == uid && resource.data.active == true\n            && (!request.resource.data.diff(resource.data).affectedKeys().hasAny(['pub']) || okPub(request.resource.data))\n            && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['pub', 'priv', 'privPrev', 'ring', 'ringV', 'boot', 'mustSetup', 'lastLogin']));\n      allow delete: if false;\n    }\n    match /roster/{sid} {\n      // (NLO Time Clock: the office's time-clock computer shows each person's name and photo; its alert script names them;\n      // an approved laptop reads only the people it's for)\n      allow read: if isMember() || isTcDevice();\n      allow get: if lapHas(sid);\n      allow create, update: if isOwner() || bootstrapping();\n      allow delete: if false;\n    }\n    // Every write to a case must come with a history entry, at the fixed id \"<case>_<rev>\",\n    // holding the previous encrypted copy. History can't be edited or deleted, so any\n    // overwrite \u2014 buggy, careless or malicious \u2014 can be undone from it.\n    function histAfter(id, rev) { return existsAfter(/databases/$(db)/documents/log/$(id + '_' + string(rev))); }\n    // The patient index (4 Oct 2026): pn / pc are keyed hashes (HMAC with a key derived from the office key) of the\n    // patient's name and chart #, so an app can fetch one patient's earlier cases instead of every completed case.\n    // Without the office key they say nothing about who the patient is.\n    function okIdx(d) {\n      return (!('pn' in d) || (d.pn is string && d.pn.size() == 22)) && (!('pc' in d) || (d.pc is string && d.pc.size() == 22));\n    }\n    match /cases/{id} {\n      function okCase() {\n        let d = request.resource.data;\n        return d.keys().hasOnly(['v', 'iv', 'ct', 'status', 'rev', 'by', 'sid', 'createdAt', 'updatedAt', 'closedAt', 'pn', 'pc'])\n          && d.v == curV() && d.iv is string && d.ct is string && d.ct.size() < 600000\n          && d.rev is int && d.by == request.auth.uid && d.sid == mySid()\n          && d.updatedAt == request.time && okIdx(d)\n          && ((d.status == 'open' && d.closedAt == null) || (d.status == 'done' && d.closedAt is timestamp));\n      }\n      allow read: if isMember();\n      allow create: if isMember() && okCase() && request.resource.data.rev == 1\n        && request.resource.data.createdAt == request.time && histAfter(id, 1);\n      allow update: if isMember() && okCase() && request.resource.data.rev == resource.data.rev + 1\n        && request.resource.data.createdAt == resource.data.createdAt && histAfter(id, request.resource.data.rev);\n      // the index alone (the owner's app indexing the office, or catching up on a case an older copy of the app saved):\n      // nothing about the case itself changes, so no new version\n      allow update: if isMember() && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['pn', 'pc'])\n        && okIdx(request.resource.data);\n      allow delete: if isOwner() && histAfter(id, resource.data.rev + 1);\n    }\n    match /log/{lid} {\n      function caseBefore() { return /databases/$(db)/documents/cases/$(request.resource.data.caseId); }\n      function okHist() {\n        let d = request.resource.data;\n        return (exists(caseBefore()) && d.rev == get(caseBefore()).data.rev + 1\n                 && d.prev == {'v': get(caseBefore()).data.v, 'iv': get(caseBefore()).data.iv, 'ct': get(caseBefore()).data.ct})\n          || (!exists(caseBefore()) && d.rev == 1 && d.prev == null);\n      }\n      function okAfter() {\n        let d = request.resource.data;\n        return (existsAfter(caseBefore()) && getAfter(caseBefore()).data.rev == d.rev)\n          || (!existsAfter(caseBefore()) && exists(caseBefore()) && isOwner());\n      }\n      // del: marks the entry of a deleted case (so Deleted cases reads only those, not every recent entry)\n      allow read: if isMember();\n      allow create: if isMember()\n        && request.resource.data.keys().hasOnly(['caseId', 'rev', 'uid', 'sid', 'at', 'v', 'iv', 'ct', 'prev', 'del'])\n        && request.resource.data.uid == request.auth.uid && request.resource.data.sid == mySid()\n        && request.resource.data.at == request.time && request.resource.data.caseId is string\n        && request.resource.data.rev is int && lid == request.resource.data.caseId + '_' + string(request.resource.data.rev)\n        && request.resource.data.v is int && request.resource.data.ct is string && request.resource.data.ct.size() < 20000\n        && (!('del' in request.resource.data) || (request.resource.data.del == true && !existsAfter(caseBefore())))\n        && okHist() && okAfter();\n      allow update, delete: if false;\n    }\n    // which set of these rules is live: the app reads this (it needn't exist); older rules refuse it\n    match /meta/rules_20261004 {\n      allow get: if isMember();\n    }\n    match /meta/rules_20261008 {\n      allow get: if isMember();\n    }\n    match /meta/rules_20261012 {\n      allow get: if isMember();\n    }\n    match /meta/rules_20261019 {\n      allow get: if isMember();\n    }\n\n    // ---------- the Tray Maker's queue (19 Oct 2026) ----------\n    // The Tray Maker on the lab PC (the models for retainers, whitening trays and mouthguards) shows the cases waiting\n    // for their models. It never has the office key, so the app writes it a small sealed copy of each such case -\n    // sealed to the Tray Maker's own public key, which it publishes here under its login (the lab PC's robot login,\n    // the same one the lab bridge uses). It can read the queue and its own key entry, and nothing else; when the\n    // models are sent it adds a sealed note to the inbox like the lab bridge does, and the app takes the case out.\n    match /labqkeys/{uid} {\n      function okLabKey() {\n        let d = request.resource.data;\n        return d.keys().hasOnly(['pub', 'kid', 'name', 'ver', 'at']) && 'pub' in d && okPub(d)\n          && d.kid is string && d.kid.size() <= 40 && d.name is string && d.name.size() <= 120\n          && (!('ver' in d) || (d.ver is string && d.ver.size() <= 20)) && d.at == request.time;\n      }\n      allow get, list: if isMember() || isBot();\n      allow create, update: if isBot() && uid == request.auth.uid && okLabKey();\n      allow delete: if isOwner();\n    }\n    match /labq/{id} {\n      function okLabQ() {\n        let d = request.resource.data;\n        return d.keys().hasOnly(['kid', 'epk', 'iv', 'ct', 'at'])\n          && d.kid is string && d.kid.size() <= 40\n          && d.epk is map && d.epk.keys().hasOnly(['kty', 'crv', 'x', 'y'])\n          && d.iv is string && d.iv.size() <= 24 && d.ct is string && d.ct.size() <= 20000\n          && d.at == request.time;\n      }\n      allow get, list: if isMember() || isBot();\n      allow create, update: if isMember() && okLabQ();\n      allow delete: if isMember() || isBot();\n    }\n\n    // ---------- read marks on Messages (12 Oct 2026) ----------\n    // Which notes and stickers a person has read (and marked unread again), so a message read on one computer or phone is\n    // read on all of them. One document per person, at their staff id, sealed in the browser with the office key like a\n    // case: only they can read or write it, and only while their login is active. Never listed; removed with the person.\n    match /msgSeen/{sid} {\n      function okSeen() {\n        let d = request.resource.data;\n        return d.keys().hasOnly(['v', 'iv', 'ct', 'at']) && d.v == curV()\n          && d.iv is string && d.iv.size() <= 24 && d.ct is string && d.ct.size() < 400000 && d.at == request.time;\n      }\n      allow get: if isMember() && sid == mySid();\n      allow create, update: if isMember() && sid == mySid() && okSeen();\n      // the owner removes it with the person (they can't read it: it only goes, so a username given to someone new starts clean)\n      allow delete: if isOwner();\n      allow list: if false;\n    }\n\n    // ---------- patient photos ----------\n    // One small picture per case \u2014 and, since the IPR Tracker joined this database (Amir, 27 Oct 2026: \"the IPR tracker and\n    // case tracker should be fully sharing the same data \u2026 their photo, exactly how we have it in case tracker\"), one per\n    // IPR Tracker patient record, at photos/{that record's id} \u2014 sealed in the browser with the office key like the record\n    // itself. It changes only together with a save of its record (so the record's history shows who added or changed it),\n    // or with a brand-new record; the owner re-seals pictures unchanged after a key change. Record ids are random, so a\n    // picture is a case's or an IPR patient's, never both.\n    function caseDoc(id) { return /databases/$(db)/documents/cases/$(id); }\n    function caseSavedNow(id) { return exists(caseDoc(id)) && existsAfter(caseDoc(id)) && getAfter(caseDoc(id)).data.rev == get(caseDoc(id)).data.rev + 1; }\n    function iprPtSavedNow(id) { return exists(iprPtDoc(id)) && existsAfter(iprPtDoc(id)) && getAfter(iprPtDoc(id)).data.rev == get(iprPtDoc(id)).data.rev + 1; }\n    // the picture's record is saved in this same write: made now, or its revision moved on (a case, else an IPR Tracker patient)\n    function photoRecordSaved(id) {\n      return (existsAfter(caseDoc(id)) && (!exists(caseDoc(id)) || caseSavedNow(id)))\n        || (!exists(caseDoc(id)) && !existsAfter(caseDoc(id)) && existsAfter(iprPtDoc(id)) && (!exists(iprPtDoc(id)) || iprPtSavedNow(id)));\n    }\n    match /photos/{id} {\n      function okPhoto() {\n        let d = request.resource.data;\n        return d.keys().hasOnly(['v', 'iv', 'ct', 'pv', 'at', 'by']) && d.v == curV()\n          && d.iv is string && d.iv.size() <= 24 && d.ct is string && d.ct.size() <= 90000\n          && d.pv is string && d.pv.size() > 0 && d.pv.size() <= 20\n          && d.by == request.auth.uid && d.at == request.time;\n      }\n      allow get: if isMember();\n      allow list: if isOwner();\n      allow create: if isMember() && okPhoto() && photoRecordSaved(id);\n      allow update: if isMember() && okPhoto()\n        && (photoRecordSaved(id) || (isOwner() && request.resource.data.pv == resource.data.pv && (existsAfter(caseDoc(id)) || existsAfter(iprPtDoc(id)))));\n      // taken off together with a save of its record, with the record itself, or when it has no record at all\n      allow delete: if isMember() && (\n        (exists(caseDoc(id)) && (!existsAfter(caseDoc(id)) || caseSavedNow(id)))\n        || (!exists(caseDoc(id)) && exists(iprPtDoc(id)) && (!existsAfter(iprPtDoc(id)) || iprPtSavedNow(id)))\n        || (!exists(caseDoc(id)) && !exists(iprPtDoc(id))));\n    }\n\n    // ---------- lab-email updates ----------\n    // A small Google Apps Script in the office's Gmail accounts forwards lab emails, sealed to the office\n    // inbox key so only the app can open them. Its own login (made by the owner) can add sealed items to the\n    // inbox and note when it last checked the mail. It can't read or change anything else.\n    function isBot() { return authed() && exists(/databases/$(db)/documents/mailbots/$(request.auth.uid)); }\n    match /mailbots/{uid} {\n      allow get: if authed() && (request.auth.uid == uid || isOwner());\n      allow list: if isOwner();\n      allow create: if isOwner() && request.resource.data.keys().hasOnly(['email', 'at'])\n        && request.resource.data.email is string && request.resource.data.at == request.time;\n      allow delete: if isOwner();\n      allow update: if false;\n    }\n    // the inbox public key the robot seals to (and which senders to forward)\n    match /meta/inbox {\n      allow get: if isMember() || isBot();\n      allow create, update: if isOwner() && request.resource.data.keys().hasOnly(['pub', 'kid', 'senders', 'at', 'notify'])\n        && 'pub' in request.resource.data && okPub(request.resource.data)\n        && request.resource.data.kid is string && request.resource.data.kid.size() <= 40\n        && request.resource.data.senders is list && request.resource.data.senders.size() <= 40\n        && okNotify(request.resource.data);\n      allow delete: if false;\n    }\n    // its private half, sealed with the office key\n    match /meta/inboxKey {\n      allow get: if isMember();\n      allow create, update: if isOwner();\n      allow delete: if false;\n    }\n    // the robot's login, sealed with the office key, so the owner can show the script again\n    match /meta/mailbot {\n      allow get, create, update, delete: if isOwner();\n    }\n    match /inbox/{id} {\n      allow create: if isBot() && id.matches('^m[0-9a-f]{40}$')\n        && request.resource.data.keys().hasOnly(['kid', 'epk', 'iv', 'ct', 'at'])\n        && request.resource.data.kid is string && request.resource.data.kid.size() <= 40\n        && request.resource.data.epk is map && request.resource.data.epk.keys().hasOnly(['kty', 'crv', 'x', 'y'])\n        && request.resource.data.iv is string && request.resource.data.iv.size() <= 24\n        && request.resource.data.ct is string && request.resource.data.ct.size() <= 400000\n        && request.resource.data.at == request.time;\n      allow get, list: if isMember();\n      // staff mark which updates in an email are dealt with (and which open app is handling it), and remove it once all are\n      // (a claim is checked only when it changes \u2014 marking updates done keeps the earlier claim as it was)\n      allow update: if isMember() && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['done', 'claim'])\n        && (!('done' in request.resource.data) || (request.resource.data.done is list && request.resource.data.done.size() <= 200))\n        && (!request.resource.data.diff(resource.data).affectedKeys().hasAny(['claim'])\n            || (request.resource.data.claim is map && request.resource.data.claim.keys().hasOnly(['by', 'at'])\n                && request.resource.data.claim.by is string && request.resource.data.claim.by.size() <= 20 && request.resource.data.claim.at == request.time));\n      allow delete: if isMember();\n    }\n    // when each mailbox's script last checked the mail (no patient data)\n    match /mailbeat/{id} {\n      allow get, list: if isMember();\n      // (pub: the key a newer script opens front-desk notes with \u2014 its private half stays in that Gmail account)\n      allow create, update: if isBot() && id.matches('^b[0-9a-f]{32}$')\n        && request.resource.data.keys().hasOnly(['box', 'at', 'seen', 'sent', 'err', 'ver', 'pub']) && okPub(request.resource.data)\n        && request.resource.data.box is string && request.resource.data.box.size() <= 120\n        && request.resource.data.at == request.time\n        && request.resource.data.seen is int && request.resource.data.sent is int\n        && request.resource.data.err is string && request.resource.data.err.size() <= 300\n        && request.resource.data.ver is string && request.resource.data.ver.size() <= 20;\n      allow delete: if isOwner();\n    }\n\n    // ---------- a note for the front desk (Amir, 8 Oct 2026: \"when the case gets delayed (not shipped by the expected time)\n    // please also send a email to Questions@thenextlevelorthodontics.com to let the front desk know\") ----------\n    // An open app adds a note here in the same save that marks the case as emailed, sealed to one mailbox script's own key\n    // (its private half never leaves that Gmail account). That script opens it, emails meta/inbox's front-desk address \u2014 the\n    // only address it sends these to \u2014 and removes it. Nobody else can read it.\n    match /outbox/{id} {\n      allow create: if isMember() && id.matches('^o[0-9a-f]{32}$')\n        && request.resource.data.keys().hasOnly(['box', 'epk', 'iv', 'ct', 'at'])\n        && request.resource.data.box is string && request.resource.data.box.matches('^b[0-9a-f]{32}$')\n        && request.resource.data.epk is map && request.resource.data.epk.keys().hasOnly(['kty', 'crv', 'x', 'y'])\n        && request.resource.data.iv is string && request.resource.data.iv.size() <= 24\n        && request.resource.data.ct is string && request.resource.data.ct.size() <= 20000\n        && request.resource.data.at == request.time;\n      allow get, list: if isBot();\n      allow delete: if isBot() || isOwner();\n      allow update: if false;\n    }\n\n    // ---------- NLO Leads (same office, same logins, same key ring) ----------\n    // Leads follow the same pattern as cases: sealed in the browser, every write comes with an\n    // append-only history entry (\"leadLog/<lead>_<rev>\") holding the copy it replaced.\n    function leadHistAfter(id, rev) { return existsAfter(/databases/$(db)/documents/leadLog/$(id + '_' + string(rev))); }\n    match /leads/{id} {\n      function okLead() {\n        let d = request.resource.data;\n        return d.keys().hasOnly(['v', 'iv', 'ct', 'status', 'rev', 'by', 'sid', 'createdAt', 'updatedAt', 'closedAt'])\n          && d.v == curV() && d.iv is string && d.ct is string && d.ct.size() < 300000\n          && d.rev is int && d.by == request.auth.uid && d.sid == mySid()\n          && d.updatedAt == request.time\n          && ((d.status == 'open' && d.closedAt == null) || (d.status == 'done' && d.closedAt is timestamp));\n      }\n      allow read: if isMember();\n      allow create: if isMember() && okLead() && request.resource.data.rev == 1\n        && request.resource.data.createdAt == request.time && leadHistAfter(id, 1);\n      allow update: if isMember() && okLead() && request.resource.data.rev == resource.data.rev + 1\n        && request.resource.data.createdAt == resource.data.createdAt && leadHistAfter(id, request.resource.data.rev);\n      allow delete: if isOwner() && leadHistAfter(id, resource.data.rev + 1);\n    }\n    match /leadLog/{lid} {\n      function leadBefore() { return /databases/$(db)/documents/leads/$(request.resource.data.leadId); }\n      function okLeadHist() {\n        let d = request.resource.data;\n        return (exists(leadBefore()) && d.rev == get(leadBefore()).data.rev + 1\n                 && d.prev == {'v': get(leadBefore()).data.v, 'iv': get(leadBefore()).data.iv, 'ct': get(leadBefore()).data.ct})\n          || (!exists(leadBefore()) && d.rev == 1 && d.prev == null);\n      }\n      function okLeadAfter() {\n        let d = request.resource.data;\n        return (existsAfter(leadBefore()) && getAfter(leadBefore()).data.rev == d.rev)\n          || (!existsAfter(leadBefore()) && exists(leadBefore()) && isOwner());\n      }\n      allow read: if isMember();\n      allow create: if isMember()\n        && request.resource.data.keys().hasOnly(['leadId', 'rev', 'uid', 'sid', 'at', 'v', 'iv', 'ct', 'prev'])\n        && request.resource.data.uid == request.auth.uid && request.resource.data.sid == mySid()\n        && request.resource.data.at == request.time && request.resource.data.leadId is string\n        && request.resource.data.rev is int && lid == request.resource.data.leadId + '_' + string(request.resource.data.rev)\n        && request.resource.data.v is int && request.resource.data.ct is string && request.resource.data.ct.size() < 20000\n        && okLeadHist() && okLeadAfter();\n      allow update, delete: if false;\n    }\n    // Website requests. Only the receiving service writes these son's PIN (the form takes a moment: up to 10 minutes;\n      // the PIN isn't used up)\n      allow create: if ((request.resource.data.src == 'kiosk' && isKiosk()) || (request.resource.data.src == 'laptop' && lapHas(request.resource.data.sid))) && okReq()\n        && kioskAsk(request.resource.data.sid) && reqCounted(request.resource.data.sid);\n      // signed in with their own login, for themselves\n      allow create: if isMember() && okReq() && request.resource.data.src == 'me' && request.resource.data.sid == mySid()\n        && reqCounted(request.resource.data.sid);\n      // a manager answers it, once (their own only Dr. A answers): approved (with the corrections for each punch asked for,\n      // in the same save) or declined, with an optional note\n      allow update: if isTcMgr() && (resource.data.sid != mySid() || isOwner()) && resource.data.st == 'open'\n        && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['st', 'rby', 'rbsid', 'rat', 'rwhy', 'fx'])\n        && request.resource.data.st in ['ok', 'no'] && request.resource.data.rby == request.auth.uid\n        && request.resource.data.rbsid == mySid() && request.resource.data.rat == request.time\n        && request.resource.data.rwhy is string && request.resource.data.rwhy.size() <= 300 && request.resource.data.fx is list\n        && ((request.resource.data.st == 'no' && request.resource.data.fx.size() == 0)\n         || (request.resource.data.st == 'ok' && request.resource.data.fx.size() == resource.data.ps.size()\n             && (resource.data.ps.size() < 1 || okFxOf(request.resource.data.fx[0], resource.data.sid))\n             && (resource.data.ps.size() < 2 || okFxOf(request.resource.data.fx[1], resource.data.sid))));\n      // the person takes it back while it waits\n      allow update: if resource.data.st == 'open' && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['st', 'rat'])\n        && request.resource.data.st == 'x' && request.resource.data.rat == requ  // a teammate who works from home uses): each its own login, made on that laptop and approved by Dr. A with the code it\n    // shows, for the people he picked \u2014 a time clock that also works away from the office. He renames one, changes who\n    // uses it, or takes it back (a lost laptop, someone leaving).\n    match /tcLaptops/{uid} {\n      function okLap(d) {\n        return d.name is string && d.name.size() > 0 && d.name.size() <= 40 && d.sids is list && d.sids.size() > 0 && d.sids.size() <= 4\n          && d.sids[0] is string && d.sids[0].size() <= 40 && (d.sids.size() < 2 || (d.sids[1] is string && d.sids[1].size() <= 40))\n          && (d.sids.size() < 3 || (d.sids[2] is string && d.sids[2].size() <= 40)) && (d.sids.size() < 4 || (d.sids[3] is string && d.sids[3].size() <= 40));\n      }\n      allow get: if isTcMgr() || (authed() && request.auth.uid == uid);\n      allow list: if isTcMgr() || isTcBot();\n      // (only a laptop asking for it in the last 30 minutes: Dr. A types the code it shows)\n      allow create: if isOwner() && request.resource.data.keys().hasOnly(['name', 'sids', 'at', 'by']) && okLap(request.resource.data)\n        && request.resource.data.at == request.time && request.resource.data.by == request.auth.uid\n        && request.time < get(/databases/$(db)/documents/tcLapReq/$(uid)).data.at + duration.value(30, 'm');\n      allow update: if (isOwner() && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['name', 'sids']) && okLap(request.resource.data))\n        || (authed() && request.auth.uid == uid && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['seen'])\n            && request.resource.data.seen == request.time);\n      allow delete: if isOwner();\n    }\n    // a laptop asking to be approved: its own new login, made on that laptop, and a 6-digit code it shows, so Dr. A approves\n    // the right one on his own phone or computer (his password never goes on the laptop). Anyone can make a login,
