t() && request.resource.data.keys().hasOnly(['net', 'office', 'org', 'city', 'pid', 'relay', 'at'])\n        && okNet(request.resource.data.net) && request.resource.data.office is bool\n        && request.resource.data.org is string && request.resource.data.org.size() <= 100\n        && request.resource.data.city is string && request.resource.data.city.size() <= 60\n        && request.resource.data.pid is string && request.resource.data.pid.matches('^p[0-9a-f]{24}$') && request.resource.data.relay is bool\n        && request.resource.data.at == request.time\n        && (exists(/databases/$(db)/documents/members/$(uid)) || exists(/databases/$(db)/documents/tcKiosks/$(uid)) || exists(/databases/$(db)/documents/tcLaptops/$(uid)));\n      allow delete: if isOwner();\n    }\n    // the office's networks: Dr. A saves the one he's on right now (\"This is the office\" \u2014 never an address many people\n    // share, like iCloud Private Relay or a VPN); he can rename or remove one\n    match /tcOffice/{net} {\n      function okOffice(d) {\n        return okNet(net) && d.keys().hasOnly(['name', 'org', 'city', 'by', 'at'])\n          && d.name is string && d.name.size() > 0 && d.name.size() <= 40\n          && d.org is string && d.org.size() <= 100 && d.city is string && d.city.size() <= 60\n          && d.by == request.auth.uid && d.at == request.time;\n      }\n      allow get, list: if isOwner() || isNetBot();\n      allow create: if isOwner() && okOffice(request.resource.data) && seenNet(request.auth.uid, 5)\n        && get(seenDoc(request.auth.uid)).data.net == net && get(seenDoc(request.auth.uid)).data.relay == false;\n      allow update: if isOwner() && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['name'])\n        && request.resource.data.name is string && request.resource.data.name.size() > 0 && request.resource.data.name.size() <= 40;\n      allow delete: if isOwner();\n    }\n    // which set of these rules is live (the page reads this; older rules refuse it)\n    match /meta/rules_tc_1 {\n      allow get: if isMember() || isTcDevice();\n    }\n    match /meta/rules_tc_2 {\n      allow get: if isMember() || isTcDevice() || isLaptop() || isNetBot();\n    }\n    // (Paychex's IDs, meta/tcPx: the page offers them once these rules are live)\n    match /meta/rules_tc_3 {\n      allow get: if isMember() || isTcDevice() || isLaptop() || isNetBot();\n    }\n    // (paid holidays, meta/tcHol: the Payroll page offers them once these rules are live)\n    match /meta/rules_tc_4 {\n      allow get: if isMember() || isTcDevice() || isLaptop() || isNetBot();\n    }\n\n    // =====================================================================\n    // NLO Inventory (16 Oct 2026; Amir: \"make this app similar to case tracker to use the same logins and logout after 10\n    // mins same rules\"): supplies, the shared cart, orders and receiving, vendors, the activity log and the supply budget,\n    // moved here from Inventory's own Realtime Database (nlo-inventory). Same logins, roster and idle lock as NLO Cases.\n    // Nothing here is patient data, so nothing is sealed.\n    // - Every write says who made it and when (upBy = the member's staff id, up = the database's time) and moves the\n    //   change counter (invState/rev) in the same save: the alert script watches that one number.\n    // - The steps people take carry the name of whoever saved them: the activity log is one record per person per month\n    //   (invLog/m<YYYY-MM>~<staff id>), each person adding only to their own, entries only ever added; an order's trail only\n    //   grows by the step being saved, in the saver's name; expenses bought outside an order are records of their own\n    //   (invExpenses) in the name of whoever added them, taken off only by them or Dr. A. (Dr. A's own\n    //   saves aren't held to this: the one-time move brings the old records over as the old app stamped them.)\n    // - Supplies and vendors are hidden with a flag, never deleted; orders are never deleted. Once an order is received,\n    //   everyone else only adds its paperwork (invoice numbers and amounts, prices from the packing slip, the slip photo).\n    // - Only Dr. A changes settings (budget amounts, vendors, storage locations, archiving and deleting supplies, voiding and\n    //   reopening orders, the alert switches and the AI keys). Amir, 16 Oct 2026: \"for assistants, the budget vendor and\n    //   setting are not needed \u2026 they will just need to look up inventory, add items to the cart and if I approve them, they\n    //   can place order\" \u2014 and only he approves.\n    // - His OKs on cart lines (invState/cart.ok) are his alone: anyone else may only take one off (with its line). That an order\n    //   someone else saves came only from OK'd lines is the page's to check: the cart is one shared record.\n    // - The alert script (Dr. A's Apps Script) has its own login (invBots): it reads Inventory (and the AI keys, which Staff\n    //   Meeting and Month-End read from the old database), sends and clears the alerts, and copies the supply numbers to the\n    //   old database, where Staff Meeting and AISA read them.\n    // =====================================================================\n    function invRevDoc() { return /databases/$(db)/documents/invState/rev; }\n    function isInvAdmin() { return isOwner(); }\n    function isInvBot() { return authed() && exists(/databases/$(db)/documents/invBots/$(request.auth.uid)); }\n    function invReader() { return isMember() || isInvBot(); }\n    // the change counter went up by one in this same save\n    function invBumped() { return getAfter(invRevDoc()).data.n == (exists(invRevDoc()) ? get(invRevDoc()).data.n : 0) + 1; }\n    function invOk(d) { return isMember() && d.up == request.time && d.upBy == mySid() && invBumped(); }\n    function invChanged(keys) { return request.resource.data.diff(resource.data).affectedKeys().hasAny(keys); }\n    function invWas(k) { return resource.data.get(k, null); }\n    match /invItems/{id} {\n      allow read: if invReader();\n      allow create: if invOk(request.resource.data) && request.resource.data.id == id && request.resource.data.size() <= 120\n        && (isInvAdmin() || (request.resource.data.get('deleted', false) != true && request.resource.data.get('archived', false) != true));\n      allow update: if invOk(request.resource.data) && request.resource.data.id == id && request.resource.data.size() <= 120\n        && (isInvAdmin() || !invChanged(['deleted', 'archived', 'deletedBy', 'deletedAt', 'archivedBy', 'archivedAt']));\n      allow delete: if false;\n    }\n    match /invOrders/{id} {\n      function okSt(s) { return s == 'open' || s == 'backordered' || s == 'received'; }\n      function okMove(a, b) { return a == b || ((a == 'open' || a == 'backordered') && b == 'received') || (a == 'open' && b == 'backordered') || (a == 'backordered' && b == 'open'); }\n      // the trail (n, was o) only grows by the step being saved, and that step is the saver's (the oldest drops off at 40)\n      function trailOk(n, o) {\n        return n == o || (n is list && n.size() == (o.size() < 40 ? o.size() + 1 : 40) && n[n.size() - 1] is map\n          && n[n.size() - 1].get('byId', '') == mySid() && (o.size() == 0 || n[0:n.size() - 1] == o[o.size() - (n.size() - 1):o.size()]));\n      }\n      // what everyone else may still change on a received order: its paperwork\n      function paperworkOnly() {\n        return request.resource.data.diff(resource.data).affectedKeys().hasOnly(['items', 'invoiceNumber', 'invoiceDate', 'invoiceSubtotal', 'invoiceTaxes',\n          'invoiceShipping', 'slipPhoto', 'trail', 'up', 'upBy']);\n      }\n      // a receipt is the saver's: their id on it, and their \"received\" step on the trail\n      function receiptOk(d) { return d.get('receivedById', '') == mySid() && d.get('trail', []).size() > 0 && d.trail[d.trail.size() - 1].get('t', '') == 'received'; }\n      allow read: if invReader();\n      // a new order carries one step, the saver's (placed, scanned, or the backorder of an earlier one)\n      allow create: if invOk(request.resource.data) && request.resource.data.id == id && request.resource.data.size() <= 120\n        && (isInvAdmin() || okSt(request.resource.data.get('status', '')))\n        && (isOwner() || (request.resource.data.get('trail', []).size() == 1 && trailOk(request.resource.data.trail, [])\n          && (request.resource.data.get('orderedById', mySid()) == mySid() || 'backorderOf' in request.resource.data)\n          && (request.resource.data.get('status', '') != 'received' || request.resource.data.get('receivedById', mySid()) == mySid())));\n      allow update: if invOk(request.resource.data) && request.resource.data.id == id && request.resource.data.size() <= 120\n        && (isInvAdmin() || (okMove(invWas('status'), request.resource.data.get('status', ''))\n          && (invWas('status') != 'received' || paperworkOnly())))\n        && (isOwner() || (trailOk(request.resource.data.get('trail', []), resource.data.get('trail', []))\n          && (!invChanged(['receivedById']) || request.resource.data.get('receivedById', mySid()) == mySid())\n          && (invWas('status') == 'received' || request.resource.data.get('status', '') != 'received' || receiptOk(request.resource.data))\n          && (invWas('status') != 'received' || !invChanged(['items']) || request.resource.data.get('trail', []) != resource.data.get('trail', []))));\n      allow delete: if false;\n    }\n    match /invVendors/{id} {\n      // anyone may add a vendor (one typed on a supply joins the list: a new v-\u2026 record with just its name) and fill in an\n      // account number or address a packing slip shows when there wasn't one; everything else (website, phone, order email,\n      // rep\u2026) is Dr. A's\n      function blank(k) { return !(k in resource.data) || resource.data[k] == null || resource.data[k] == ''; }\n      allow read: if invReader();\n      allow create: if invOk(request.resource.data) && request.resource.data.id == id && request.resource.data.size() <= 60\n        && (isInvAdmin() || (request.resource.data.keys().hasOnly(['id', 'name', 'acct', 'address', 'up', 'upBy'])\n          && (id.matches('^v-.+$') || !('name' in request.resource.data))));\n      allow update: if invOk(request.resource.data) && request.resource.data.id == id && request.resource.data.size() <= 60\n        && (isInvAdmin() || (request.resource.data.diff(resource.data).affectedKeys().hasOnly(['acct', 'address', 'up', 'upBy'])\n          && (!invChanged(['acct']) || blank('acct')) && (!invChanged(['address']) || blank('address'))));\n      allow delete: if false;\n    }\n    match /invLog/{d} {\n      // one record per person per month, m<YYYY-MM>~<staff id> (the moved entries under the id the old app stamped them with)\n      function okLog(x) { return x.keys().hasOnly(['e', 'mon', 'who', 'up', 'upBy']) && x.e is map && x.e.size() <= 1500\n        && x.mon is string && x.mon.matches('^[0-9]{4}-[0-9]{2}$') && x.who is string && d == 'm' + x.mon + '~' + x.who; }\n      allow read: if invReader();\n      allow create: if invOk(request.resource.data) && okLog(request.resource.data) && (request.resource.data.who == mySid() || isOwner());\n      allow update: if invOk(request.resource.data) && okLog(request.resource.data) && (resource.data.who == mySid() || isOwner())\n        && request.resource.data.e.diff(resource.data.e).changedKeys().size() == 0\n        && request.resource.data.e.diff(resource.data.e).removedKeys().size() == 0;\n      allow delete: if false;\n    }\n    // expenses bought outside an order (a card at a store), in the name of whoever added them\n    match /invExpenses/{id} {\n      function okEx(x) { return x.keys().hasOnly(['id', 'date', 'amount', 'category', 'vendor', 'note', 'description', 'by', 'byId', 'addedAt', 'up', 'upBy'])\n        && x.id == id && x.amount is number && x.amount >= 0 && x.amount <= 100000 && x.date is string && x.date.size() <= 40\n        && x.get('category', '') is string && x.get('category', '').size() <= 60 && x.get('vendor', '') is string && x.get('vendor', '').size() <= 200\n        && x.get('note', '') is string && x.get('note', '').size() <= 500 && x.get('by', '') is string && x.get('by', '').size() <= 80; }\n      allow read: if invReader();\n      allow create: if invOk(request.resource.data) && (isOwner() || (okEx(request.resource.data) && request.resource.data.get('byId', '') == mySid()));\n      allow delete: if isMember() && invBumped() && (isInvAdmin() || resource.data.get('byId', '') == mySid()\n        || resource.data.get('byId', '') == get(/databases/$(db)/documents/roster/$(mySid())).data.get('rid', '-'));\n      allow update: if false;\n    }\n    match /invState/rev {\n      function okRev(d) { return d.keys().hasOnly(['n', 'up', 'upBy']) && d.n is int && d.up == request.time && d.upBy == mySid(); }\n      allow get: if invReader();\n      allow create: if isMember() && okRev(request.resource.data) && request.resource.data.n == 1;\n      allow update: if isMember() && okRev(request.resource.data) && request.resource.data.n == resource.data.n + 1;\n      allow delete: if false;\n    }\n    match /invState/cart {\n      // ok: Dr. A's OK on each line he approved ({line id: {by, byId, at, n, it}}): only he adds or changes one; anyone else's\n      // save keeps them as they are, or takes some off (a line ordered or taken out)\n      function okOks() {\n        let n = request.resource.data.get('ok', {});\n        let o = resource == null ? {} : resource.data.get('ok', {});\n        return n is map && n.size() <= 400 && (isOwner() || (n.diff(o).addedKeys().size() == 0 && n.diff(o).changedKeys().size() == 0));\n      }\n      allow get: if invReader();\n      allow create, update: if invOk(request.resource.data) && request.resource.data.keys().hasOnly(['lines', 'ok', 'up', 'upBy'])\n        && request.resource.data.lines is list && request.resource.data.lines.size() <= 400 && okOks();\n      allow delete: if false;\n    }\n    match /invState/bracket {\n      allow get: if invReader();\n      allow create, update: if invOk(request.resource.data) && request.resource.data.keys().hasOnly(['v', 'up', 'upBy']);\n      allow delete: if false;\n    }\n    match /invState/prices {\n      allow get: if invReader();\n      allow create, update: if invOk(request.resource.data) && request.resource.data.keys().hasOnly(['p', 'up', 'upBy']) && request.resource.data.p is map;\n      allow delete: if false;\n    }\n    match /invState/budget {\n      // the budget amounts, Dr. A's (the expenses are records of their own: invExpenses)\n      function okBud(d) { return d.keys().hasOnly(['monthly', 'categories', 'history', 'changedBy', 'changedAt', 'up', 'upBy']); }\n      allow get: if invReader();\n      allow create, update: if invOk(request.resource.data) && okBud(request.resource.data) && isInvAdmin();\n      allow delete: if false;\n    }\n    match /invState/settings {\n      // (invAdmins: the list of people who changed settings before 16 Oct; nothing reads it now)\n      function okSet(d) { return d.keys().hasOnly(['locations', 'invAdmins', 'alertsOn', 'pushOn', 'geminiProxyUrl', 'invPrefs', 'up', 'upBy'])\n        && (!('invAdmins' in d) || (d.invAdmins is list && d.invAdmins.size() <= 30))\n        && (!('pushOn' in d) || d.pushOn is bool); }\n      allow get: if invReader();\n      allow create, update: if invOk(request.resource.data) && okSet(request.resource.data) && isOwner();\n      allow delete: if false;\n    }\n    // Dr. A's phone push (the free ntfy app) when someone adds to the cart: Inventory keeps the topic between him and the alert\n    // script, which sends the pushes (settings.pushOn tells the pages to leave the cart adds for it) \u2014 if he uses the Time\n    // Clock's topic, the Time Clock's managers know it too; test: when he asked for a test push\n    match /invState/push {\n      function okPush(d) { return d.keys().hasOnly(['topic', 'test', 'up', 'upBy']) && d.topic is string && d.topic.matches('^[A-Za-z0-9_-]{0,64}$')\n        && (!('test' in d) || d.test is int); }\n      allow get: if isOwner() || isInvBot();\n      allow create, update: if invOk(request.resource.data) && isOwner() && okPush(request.resource.data);\n      allow delete: if false;\n    }\n    // the AI keys for reading packing slips (and product photos): everyone signed in uses them, only Dr. A sets them; the\n    // alert script copies them to the old database, where Staff Meeting and Month-End read them\n    match /invState/ai {\n      allow get: if isMember() || isInvBot();\n      allow create, update: if invOk(request.resource.data) && isOwner() && request.resource.data.keys().hasOnly(['gemini', 'openai', 'up', 'upBy']);\n      allow delete: if false;\n    }\n    // the cart, order and receiving emails to Dr. A: written as they happen, sent and cleared by the alert script\n    match /invAlerts/{id} {\n      function okAlert(x) { return x.keys().hasOnly(['t', 'at', 'id', 'vendor', 'by', 'lines', 'total', 'note', 'ordered', 'how', 'noCount', 'inCart', 'up', 'upBy'])\n        && x.get('t', '') in ['cart', 'ordered', 'reopened', 'received']\n        && x.get('by', '') is string && x.get('by', '').size() <= 80 && x.get('vendor', '') is string && x.get('vendor', '').size() <= 120\n        && x.get('note', '') is string && x.get('note', '').size() <= 300 && x.get('id', '') is string && x.get('id', '').size() <= 80\n        && x.get('ordered', '') is string && x.get('ordered', '').size() <= 40 && x.get('how', '') is string && x.get('how', '').size() <= 40\n        && x.get('lines', []) is list && x.get('lines', []).size() <= 60; }\n      allow create: if invOk(request.resource.data) && okAlert(request.resource.data);\n      allow read, delete: if isOwner() || isInvBot();\n      allow update: if false;\n    }\n    // supply photos and packing-slip photos (base64 in b, its type in m): read when they're shown\n    match /invPics/{id} {\n      allow get: if isMember();\n      allow create: if invOk(request.resource.data) && request.resource.data.keys().hasOnly(['m', 'b', 'kind', 'up', 'upBy'])\n        && request.resource.data.m in ['image/jpeg', 'image/png', 'image/webp'] && request.resource.data.b is string\n        && request.resource.data.b.size() <= 1000000 && request.resource.data.get('kind', '') is string;\n      allow delete: if isInvAdmin();\n      allow update: if false;\n    }\n    // the one-time move from the old database: done once, by Dr. A (until then the page offers him the move)\n    match /invMeta/moved {\n      allow get: if invReader();\n      allow create: if invOk(request.resource.data) && isOwner();\n      allow update, delete: if false;\n    }\n    // the alert script's own login (made by Dr. A in Inventory \u2192 Settings \u2192 Email alerts), and when it last checked\n    match /invBots/{uid} {\n      allow get: if isOwner() || (authed() && request.auth.uid == uid);\n      allow list: if isOwner();\n      allow create: if isOwner() && request.resource.data.keys().hasOnly(['email', 'at'])\n        && request.resource.data.email is string && request.resource.data.at == request.time;\n      allow delete: if isOwner();\n      allow update: if false;\n    }\n    match /invBeat/{uid} {\n      allow get, list: if isOwner();\n      allow create, update: if isInvBot() && request.auth.uid == uid\n        && request.resource.data.keys().hasOnly(['at', 'ver', 'err', 'sent', 'copied']) && request.resource.data.at == request.time;\n      allow delete: if isOwner();\n    }\n    // Mari's List (17 Oct 2026; Amir, once the Mari's List member prices were saved: \"okay all of that needs to be in the\n    // inventory app some how\"): the office's member prices (from the price files on the Mari's List member portal), each\n    // vendor's deal, code and how to order, and which prices are the same as the office's supplies. Mari's List's prices stay\n    // in the office: everyone signed in reads them; only Dr. A loads a set (its parts p<set>_<n> first, then info, which\n    // points the pages at them, and the links) and links a price to a supply (match). The pages read info to know whether\n    // these rules are live (older rules refuse it). Nothing here moves the change counter: the alert script doesn't use them.\n    match /invMl/{id} {\n      function okMl(d) {\n        return d.up == request.time && d.upBy == mySid() && (\n          (id == 'info' && d.keys().hasOnly(['ver', 'at', 'src', 'vendors', 'parts', 'rows', 'loadedAt', 'loadedBy', 'up', 'upBy'])\n            && d.ver is string && d.ver.matches('^[0-9a-z]{4,16}$') && d.vendors is list && d.vendors.size() <= 400\n            && d.parts is int && d.parts >= 0 && d.parts <= 60 && d.rows is int && d.rows >= 0)\n          || (id == 'match' && d.keys().hasOnly(['m', 'up', 'upBy']) && d.m is map && d.m.size() <= 3000)\n          || (id.matches('^p[0-9a-z]{4,16}_[0-9]{1,2}$') && d.keys().hasOnly(['t', 'up', 'upBy']) && d.t is string && d.t.size() <= 1000000));\n      }\n      allow read: if isMember();\n      allow create, update: if isOwner() && okMl(request.resource.data);\n      allow delete: if isOwner() && id.matches('^p[0-9a-z]{4,16}_[0-9]{1,2}$');\n    }\n    // which set of these rules is live (the page reads this; older rules refuse it)\n    match /meta/rules_inv_1 {\n      allow get: if invReader();\n    }\n\n    // ---------- NLO IPR Tracker (same office, same logins, same key ring; 23 Oct 2026) ----------\n    // Amir, 23 Oct 2026: \"can we just use the full name of the patients instead of having like initials\" \u2192 the IPR Tracker moved\n    // here from its own Realtime Database (nothing sealed there, and outside Google's BAA). A patient and each of their visits\n    // are sealed in the browser with the office key, like cases; every save comes with a history entry holding the copy it\n    // replaced (iprPtLog / iprVisLog, append-only), as leads do. Plain fields: the key version, the revision, who saved and\n    // when, a visit's patient record (a random id) and pc \u2014 the keyed hash of the chart # that NLO Cases' patient index uses \u2014\n    // so NLO Cases finds a patient's IPR visits, and the IPR Tracker a patient's cases, without opening every record.\n    // A patient's photo (27 Oct 2026) sits in photos/{record id}, under the patient-photo rules above, changed only with a\n    // save of the record (its sealed copy names the picture's version, as a case's does).\n    function iprPtDoc(id) { return /databases/$(db)/documents/iprPts/$(id); }\n    function iprSealed(d, max) {\n      return d.v == curV() && d.iv is string && d.ct is string && d.ct.size() < max && d.rev is int\n        && d.by == request.auth.uid && d.sid == mySid() && d.updatedAt == request.time;\n    }\n    match /iprPts/{id} {\n      function okPt() {\n        let d = request.resource.data;\n        return d.keys().hasOnly(['v', 'iv', 'ct', 'rev', 'by', 'sid', 'createdAt', 'updatedAt', 'pc']) && iprSealed(d, 20000)\n          && (!('pc' in d) || (d.pc is string && d.pc.size() == 22));\n      }\n      allow read: if isMember();\n      allow create: if isMember() && okPt() && request.resource.data.rev == 1 && request.resource.data.createdAt == request.time\n        && existsAfter(/databases/$(db)/documents/iprPtLog/$(id + '_1'));\n      allow update: if isMember() && okPt() && request.resource.data.rev == resource.data.rev + 1\n        && request.resource.data.createdAt == resource.data.createdAt\n        && existsAfter(/databases/$(db)/documents/iprPtLog/$(id + '_' + string(request.resource.data.rev)));\n      allow delete: if isOwner() && existsAfter(/databases/$(db)/documents/iprPtLog/$(id + '_' + string(resource.data.rev + 1)));\n    }\n    match /iprVis/{id} {\n      function okVis() {\n        let d = request.resource.data;\n        return d.keys().hasOnly(['p', 'v', 'iv', 'ct', 'rev', 'by', 'sid', 'createdAt', 'updatedAt']) && iprSealed(d, 200000)\n          && d.p is string && d.p.size() <= 64 && existsAfter(iprPtDoc(d.p));\n      }\n      allow read: if isMember();\n      allow create: if isMember() && okVis() && request.resource.data.rev == 1 && request.resource.data.createdAt == request.time\n        && existsAfter(/databases/$(db)/documents/iprVisLog/$(id + '_1'));\n      allow update: if isMember() && okVis() && request.resource.data.p == resource.data.p\n        && request.resource.data.rev == resource.data.rev + 1 && request.resource.data.createdAt == resource.data.createdAt\n        && existsAfter(/databases/$(db)/documents/iprVisLog/$(id + '_' + string(request.resource.data.rev)));\n      allow delete: if isOwner() && existsAfter(/databases/$(db)/documents/iprVisLog/$(id + '_' + string(resource.data.rev + 1)));\n    }\n    match /iprPtLog/{lid} {\n      function ptBefore() { return iprPtDoc(request.resource.data.ptId); }\n      function okPtHist() {\n        let d = request.resource.data;\n        return (exists(ptBefore()) && d.rev == get(ptBefore()).data.rev + 1\n                 && d.prev == {'v': get(ptBefore()).data.v, 'iv': get(ptBefore()).data.iv, 'ct': get(ptBefore()).data.ct})\n          || (!exists(ptBefore()) && d.rev == 1 && d.prev == null);\n      }\n      function okPtAfter() {\n        let d = request.resource.data;\n        return (existsAfter(ptBefore()) && getAfter(ptBefore()).data.rev == d.rev)\n          || (!existsAfter(ptBefore()) && exists(ptBefore()) && isOwner());\n      }\n      allow read: if isMember();\n      allow create: if isMember()\n        && request.resource.data.keys().hasOnly(['ptId', 'rev', 'uid', 'sid', 'at', 'v', 'iv', 'ct', 'prev'])\n        && request.resource.data.uid == request.auth.uid && request.resource.data.sid == mySid()\n        && request.resource.data.at == request.time && request.resource.data.ptId is string\n        && request.resource.data.rev is int && lid == request.resource.data.ptId + '_' + string(request.resource.data.rev)\n        && request.resource.data.v is int && request.resource.data.ct is string && request.resource.data.ct.size() < 20000\n        && okPtHist() && okPtAfter();\n      allow update, delete: if false;\n    }\n    match /iprVisLog/{lid} {\n      function visBefore() { return /databases/$(db)/documents/iprVis/$(request.resource.data.visId); }\n      function okVisHist() {\n        let d = request.resource.data;\n        return (exists(visBefore()) && d.rev == get(visBefore()).data.rev + 1\n                 && d.prev == {'v': get(visBefore()).data.v, 'iv': get(visBefore()).data.iv, 'ct': get(visBefore()).data.ct})\n          || (!exists(visBefore()) && d.rev == 1 && d.prev == null);\n      }\n      function okVisAfter() {\n        let d = request.resource.data;\n        return (existsAfter(visBefore()) && getAfter(visBefore()).data.rev == d.rev)\n          || (!existsAfter(visBefore()) && exists(visBefore()) && isOwner());\n      }\n      allow read: if isMember();\n      allow create: if isMember()\n        && request.resource.data.keys().hasOnly(['visId', 'rev', 'uid', 'sid', 'at', 'v', 'iv', 'ct', 'prev'])\n        && request.resource.data.uid == request.auth.uid && request.resource.data.sid == mySid()\n        && request.resource.data.at == request.time && request.resource.data.visId is string\n        && request.resource.data.rev is int && lid == request.resource.data.visId + '_' + string(request.resource.data.rev)\n        && request.resource.data.v is int && request.resource.data.ct is string && request.resource.data.ct.size() < 20000\n        && okVisHist() && okVisAfter();\n      allow update, delete: if false;\n    }\n    // the one-time move from the old database (moved), and the old copy taken out afterwards (oldRemoved): by Dr. A, once\n    // each, counts only\n    match /iprMeta/{id} {\n      allow get: if isMember();\n      allow create: if isOwner() && id in ['moved', 'oldRemoved']\n        && request.re const APP_NAME = 'NLO IPR Tracker';

const $ = (s, r) => (r || document).querySelector(s);

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function normCode(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/(.{4})(?=.)/g, '$1-'); }
/* a short random id (a photo's version id, as NLO Cases makes them) */

/* ---------- patients: chart #s and names ---------- */
/* a chart # the way the IPR Tracker and NLO Cases' IPR link have always compared them: letters and digits only ("123-4567" = "1234567") */
const iprNorm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
/* NLO Cases' own (core.js there): spaces out, lower case — what its patient index keys a case's chart # by */
const normChart = s => String(s || '').replace(/\s+/g, '').toLowerCase();
const normName = s => String(s || '').trim().replace(/\s+/g, ' ').toLowerCase();
/* a name as it's shown: spaces tidied */
const cleanName = s => String(s || '').replace(/\s+/g, ' ').trim().slice(0, 80);
function nameInitials(name) { const p = cleanName(name).replace(/[^\p{L}\s'-]/gu, '').split(/\s+/).filter(Boolean); if (!p.length) return ''; return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); }
/* does this name fit the initials an older record kept? The first letters match, and the last one is the start of a later part of
   the name: "JMD" fits "Jane Doe", "MSJ" fits "Mary Smith-Jones"; a name typed where the initials went ("JANE DOE") is compared
   by its own initials */
function fitsInitials(name, ini) {
  const parts = cleanName(name).replace(/[^\p{L}\s'-]/gu, '').split(/[\s-]+/).filter(Boolean).map(t => t[0].normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase());

  b = b.replace(/[^A-Za-z]/g, '').toUpperCase();

/* ---------- crypto (the same as NLO Cases) ---------- */
const TE = new TextEncoder(), TD = new TextDecoder();

  async newPair() { return crypto.subtle.generateKey(Crypto.EC, true, ['deriveBits']); },
  async pubJwk(pair) { const j = await crypto.subtle.exportKey('jwk', pair.publicKey); return { kty: j.kty, crv: j.crv, x: j.x, y: j.y }; },
  async privBytes(pair) { return new Uint8Array(await crypto.subtle.exportKey('pkcs8', pair.privateKey)); },
  async importPriv(bytes) { return crypto.subtle.importKey('pkcs8', bytes, Crypto.EC, false, ['deriveBits']); },
  async boxKey(bits, info) {
    const hk = await crypto.subtle.importKey('raw', bits, 'HKDF', false, ['deriveKey']);

  },
  async sealTo(pub, bytes, info) {
    const pk = await crypto.subtle.importKey('jwk', { kty: pub.kty, crv: pub.crv, x: pub.x, y: pub.y, ext: true }, Crypto.EC, false, []);
    const eph = await Crypto.newPair();

    const k = await Crypto.boxKey(bits, info); const box = await Crypto.seal(k, bytes, info);

  },
  async openFrom(priv, box, info) {
    const e = box.epk;
    const epk = await crypto.subtle.importKey('jwk', { kty: e.kty, crv: e.crv, x: e.x, y: e.y, ext: true }, Crypto.EC, false, []);
    const bits = await crypto.subtle.deriveBits({ name: 'ECDH', public: epk }, priv, 256);

  async ringKeys(ring) {

/* the same JSON whatever order an object's keys came in (the old database hands them back sorted, the app writes them in

function canonJSON(v) {

const FB = {

    FB.cfg = FB.emu ? { apiKey: 'demo-key', authDomain: 'localhost', projectId: 'demo-nlo-cases', appId: 'demo' } : FB_CONFIG;
    if (!FB.available() || !FB.configured()) return false;
    FB.app = firebase.apps.find(a => a && a.name === '[DEFAULT]') || firebase.initializeApp(FB.cfg);
    FB.auth = FB.app.auth(); FB.db = FB.app.firestore();
    if (FB.emu) { FB.auth.useEmulator('http://127.0.0.1:9099', { disableWarnings: true }); FB.db.useEmulator('127.0.0.1', 8080); }

  async ready() {

    try { await FB.auth.setPersistence(firebase.auth.Auth.Persistence.NONE); } catch (e) { }
  },
  busy(n) { FB.pending += n; if (FB.onSync) FB.onSync(); },
  async track(p) { FB.busy(1); try { return await p; } finally { FB.busy(-1); } },

  /* ---------- sign in (the same logins as NLO Cases) ---------- */
  async emailFor(login) {
    const s = String(login || '').trim();
    if (s.includes('@')) return s.toLowerCase();
    const un = slug(s); if (!un) throw errCode('no-user');
    const snap = await FB.db.doc('logins/' + un).get();
    if (!snap.exists) throw errCode('no-user');
    return snap.data().email;
  },
  async signIn(login, pw) {
    const email = await FB.emailFor(login);
    const cred = await FB.auth.signInWithEmailAndPassword(email, pw);
    FB.uid = cred.user.uid;
    const ms = await FB.db.doc('members/' + FB.uid).get();
    if (!ms.exists) { await FB.signOut(); throw errCode('not-member'); }
    const m = ms.data();
    if (!m.active) { await FB.signOut(); throw errCode('inactive'); }
    FB.me = Object.assign({ uid: FB.uid, email: cred.user.email || email }, m);
    if (m.mustSetup) {
      if (m.priv) { // chose a password already but didn't finish: try it
        try { await FB.unlockWith(pw, m); await FB.db.doc('members/' + FB.uid).update({ mustSetup: false, boot: FB.del(), lastLogin: FB.ts() }); return { state: 'ok' }; } catch (e) { }
      }
      return { state: 'first' };
    }
    try { await FB.unlockWith(pw, m); }
    catch (e) { return { state: m.role === 'owner' ? 'recover' : 'broken' }; }
    FB.db.doc('members/' + FB.uid).update({ lastLogin: FB.ts() }).catch(() => { });
    return { state: 'ok' };
  },
  async unlockWith(pw, m) {
    let bytes;
    try { bytes = await Crypto.pwOpen(pw, m.priv, 'priv:' + FB.uid); }
    catch (e) { if (!m.privPrev) throw e; bytes = await Crypto.pwOpen(pw, m.privPrev, 'priv:' + FB.uid); }
    FB.priv = await Crypto.importPriv(bytes);
    await FB.loadRing(m);
  },
  async loadRing(m) {
    const ring = Crypto.ringFrom(await Crypto.openFrom(FB.priv, m.ring, 'ring:' + FB.uid));
    FB.ring = ring; FB.keys = await Crypto.ringKeys(ring); FB.ringV = m.ringV || 0;
    const k = await FB.db.doc('meta/keys').get();
    FB.curV = k.exists ? k.data().current : 1;
  },
  /* the office key may have just been changed (Dr. A, in NLO Cases): take the newest from this login's copy of the ring */
  async refreshKeys() {
    const s = await FB.db.doc('members/' + FB.uid).get(), m = s.exists ? s.data() : null;
    if (!m || !m.active || !m.ring) return false;
    await FB.loadRing(m); return true;
  },
  /* first sign-in with a temporary password: choose a real one (it's the NLO Cases password too) */
  async firstSetup(tempPw, newPw) {
    const m = FB.me, uid = FB.uid;
    let ring;
    try { ring = Crypto.ringFrom(await Crypto.pwOpen(tempPw, m.boot, 'boot:' + uid)); }
    catch (e) { throw errCode('boot-failed'); }
    const cur = (await FB.db.doc('meta/keys').get()).data().current;
    if (!ring[cur]) throw errCode('boot-stale');
    const pair = await Crypto.newPair(), pub = await Crypto.pubJwk(pair), pbytes = await Crypto.privBytes(pair);
    const priv = await Crypto.pwSeal(newPw, pbytes, 'priv:' + uid);
    const ringBox = await Crypto.sealTo(pub, Crypto.ringBytes(ring), 'ring:' + uid);
    await FB.db.doc('members/' + uid).update({ pub, priv, ring: ringBox, ringV: cur });
    await FB.auth.currentUser.updatePassword(newPw);
    await FB.db.doc('members/' + uid).update({ mustSetup: false, boot: FB.del(), lastLogin: FB.ts() });
    FB.priv = await Crypto.importPriv(pbytes); FB.ring = ring; FB.keys = await Crypto.ringKeys(ring); FB.curV = cur; FB.ringV = cur;
    FB.me = Object.assign({}, FB.me, { mustSetup: false, pub });
  },
  /* the owner forgot the password → reset by email → the recovery code opens the key ring */
  async recover(pw, code) {
    const uid = FB.uid;
    const r = (await FB.db.doc('meta/recovery').get()).data();
    let ring;
    try {
      const rpriv = await Crypto.importPriv(await Crypto.pwOpen(normCode(code), r.priv, 'recovery-priv'));
      ring = Crypto.ringFrom(await Crypto.openFrom(rpriv, r.ring, 'ring:recovery'));
    } catch (e) { throw errCode('bad-code'); }
    const pair = await Crypto.newPair(), pub = await Crypto.pubJwk(pair), pbytes = await Crypto.privBytes(pair);
    const priv = await Crypto.pwSeal(pw, pbytes, 'priv:' + uid);
    const ringBox = await Crypto.sealTo(pub, Crypto.ringBytes(ring), 'ring:' + uid);
    const v = Math.max.apply(null, Object.keys(ring).map(Number));
    await FB.db.doc('members/' + uid).update({ pub, priv, privPrev: FB.del(), ring: ringBox, ringV: v, lastLogin: FB.ts() });
    FB.priv = await Crypto.importPriv(pbytes); FB.ring = ring; FB.keys = await Crypto.ringKeys(ring); FB.ringV = v;
    FB.curV = (await FB.db.doc('meta/keys').get()).data().current;
  },
  async sendReset(email) { await FB.auth.sendPasswordResetEmail(email); },
  async signOut() {
    FB.stop(); IP.reset();
    FB.priv = FB.ring = FB.keys = FB.me = FB.uid = FB.idxKey = FB.idxKeyRing = null; FB.curV = FB.ringV = 0; FB.queues = {};
    try { await FB.auth.signOut(); } catch (e) { }
  },
  stop() { FB.unsubs.forEach(u => { try { u(); } catch (e) { } }); FB.unsubs = []; },

  /* ---------- before the app opens: are this version's rules live, and have the records moved? ---------- */
  async open() {
    try { await FB.db.doc('meta/rules_ipr_1').get(); } catch (e) { if (FB.isPerm(e)) return { st: 'rules' }; throw e; }
    const mv = await FB.db.doc('iprMeta/moved').get();
    if (!mv.exists) return { st: FB.isOwner() ? 'move' : 'notyet' };
    const rm = await FB.db.doc('iprMeta/oldRemoved').get();
    const info = s => { const d = s.data() || {}; return { at: FB.tsMs(d.at) || 0, by: d.by || '', pts: d.pts || 0, vis: d.vis || 0, named: d.named || 0 }; };
    return { st: 'ready', moved: info(mv), removed: rm.exists ? info(rm) : null };
  },

  /* ---------- live: this login, the office key, the idle lock, the roster, and every patient ---------- */
  start(h) {
    FB.stop();
    const uid = FB.uid;
    FB.unsubs.push(FB.db.doc('members/' + uid).onSnapshot(async s => {
      if (!s.exists || s.data().active !== true) return h.revoked();
      const m = s.data();
      if (m.ringV && m.ringV !== FB.ringV && m.ring) { try { await FB.loadRing(m); } catch (e) { h.error(e); } }
    }, e => h.revoked(e)));
    FB.unsubs.push(FB.db.doc('meta/keys').onSnapshot(s => { if (s.exists) FB.curV = s.data().current; }, () => { }));
    FB.unsubs.push(FB.db.doc('meta/settings').onSnapshot(s => h.settings(s.exists ? s.data() : {}), () => { }));
    FB.unsubs.push(FB.db.collection('roster').onSnapshot(s => h.roster(s.docs.map(d => Object.assign({ sid: d.id }, d.data()))), () => h.roster(null)));
    // (opening is async: each snapshot's changes are applied in the order they came, never an older one over a newer one)
    let chain = Promise.resolve();
    FB.unsubs.push(FB.db.collection('iprPts').onSnapshot(snap => {
      const changes = snap.docChanges().map(ch => ({ type: ch.type, id: ch.doc.id, d: ch.doc.data() }));
      chain = chain.then(async () => {
        if (FB.uid !== uid) return;
        const up = [], gone = [];
        for (const ch of changes) { if (ch.type === 'removed') gone.push(ch.id); else up.push(await FB.openPt(ch.id, ch.d)); }
        if (FB.uid !== uid) return;
        IP.apply(up, gone); h.patients();
      }).catch(e => console.warn(e));
    }, e => { IP.fail(e); h.error(e); }));
  },

  /* ---------- opening records ---------- */
  async openBox(d, aad) { const key = FB.keys && FB.keys[d.v]; if (!key) throw errCode('no-key', 'Missing key version ' + d.v); return Crypto.openJSON(key, d, aad); },
  /* a patient as the app has always seen one: patient_id is the chart #, name the full name ('' until someone adds it), ini the
     initials an older record kept */
  ptRow(id, body, d) {
    return { id, patient_id: String(body.chart || ''), name: cleanName(body.name), ini: String(body.ini || ''), created_at: body.at || '', rev: d.rev, by: d.sid || '', updatedAt: FB.tsMs(d.updatedAt),
      photo: typeof body.photo === 'string' ? body.photo : '', photoAt: Number(body.photoAt) || 0 };
  },
  /* what a record's sealed copy is bound to: its own id — and a visit also to its patient's record (p), so a sealed visit can't be
     passed off as another patient's (the rules keep p from changing) */
  aad(kind, id, p) { return kind === 'pt' ? 'iprpt:' + id : 'iprvis:' + id + ':' + p; },
  async openPt(id, d) {
    try { return FB.ptRow(id, await FB.openBox(d, FB.aad('pt', id)), d); }
    catch (e) { return { id, locked: true, patient_id: '', name: '', ini: '', created_at: '', rev: d.rev }; }
  },
  visRow(id, body, d) { return Object.assign({}, body, { id, patient_uuid: d.p, rev: d.rev, by: d.sid || '', updatedAt: FB.tsMs(d.updatedAt) }); },
  async visitsOf(pid) {
    const snap = await FB.db.collection('iprVis').where('p', '==', pid).get(), out = [];
    for (const doc of snap.docs) { const d = doc.data(); try { out.push(FB.visRow(doc.id, await FB.openBox(d, FB.aad('vis', doc.id, d.p)), d)); } catch (e) { } }
    return out;
  },
  /* (fields the page keeps on a row, never saved inside the sealed copy) */
  cleanVis(o) { const b = Object.assign({}, o); ['id', 'patient_uuid', 'rev', 'by', 'updatedAt', 'locked'].forEach(k => delete b[k]); return JSON.parse(JSON.stringify(b)); },

  /* ---------- the patient index (NLO Cases' — backend.js there): a keyed hash of the chart #, made with a key derived from
     the office key's first version, so it stays the same through key changes. Without the office key it reveals nothing. ---------- */
  async idxKeyGet() {
    if (!FB.idxKey || FB.idxKeyRing !== FB.ring) {
      const v = Math.min.apply(null, Object.keys(FB.ring).map(Number));
      const base = await crypto.subtle.importKey('raw', unb64(FB.ring[v]), 'HKDF', false, ['deriveKey']);
      FB.idxKey = await crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(32), info: TE.encode('patient-index') }, base, { name: 'HMAC', hash: 'SHA-256', length: 256 }, false, ['sign']);
      FB.idxKeyRing = FB.ring;
    }
    return FB.idxKey;
  },
  async idxHash(k) {
    const sig = new Uint8Array(await crypto.subtle.sign('HMAC', await FB.idxKeyGet(), TE.encode(k)));
    return b64(sig.subarray(0, 16)).replace(/=+$/, '').replace(/\+/g, '-').replace(/\//g, '_'); // 22 characters
  },
  /* an IPR patient's pc: its chart # with letters and digits only, so NLO Cases finds it however either app wrote the dashes */
  async iprPc(chart) { const c = iprNorm(chart); return c ? FB.idxHash('c:' + c) : null; },
  /* the index keys NLO Cases may have filed this chart # under (it keeps dashes): as typed, without dashes, and — for a chart #
     of digits only — with a dash anywhere in it ("156541" → "15-6541") */
  chartForms(chart) {
    const a = iprNorm(chart), n = normChart(chart), out = new Set([a, n].filter(Boolean));
    if (/^\d{3,12}$/.test(a)) for (let i = 1; i < a.length; i++) out.add(a.slice(0, i) + '-' + a.slice(i));
    return Array.from(out);
  },
  /* the names NLO Cases has for these chart #s: Map(iprNorm(chart) → [{ name, at }], newest first) — from the cases whose own
     chart # is the same one (letters and digits); a case removed as a duplicate doesn't count */
  async caseNames(charts, progress) {
    const out = new Map();
    (await FB.caseInfo(charts, progress)).forEach((list, a) => { const l = list.filter(c => c.name).map(c => ({ name: c.name, at: c.at })); if (l.length) out.set(a, l); });
    return out;
  },
  /* NLO Cases' cases for these chart #s, newest first: Map(iprNorm(chart) → [{ id, name, at, open, photo, photoAt }]) — the name
     the case has, and its patient photo's version id (photos/{case id}) with when it was taken (27 Oct 2026) */
  async caseInfo(charts, progress) {
    const want = new Map(); // index key → iprNorm(chart)
    for (const ch of charts) { const a = iprNorm(ch); if (!a) continue; for (const f of FB.chartForms(ch)) want.set(await FB.idxHash('c:' + f), a); }
    const keys = Array.from(want.keys()), docs = new Map(), out = new Map(), wanted = new Set(want.values());
    for (let i = 0; i < keys.length; i += 30) {
      const s = await FB.db.collection('cases').where('pc', 'in', keys.slice(i, i + 30)).get();
      s.docs.forEach(d => docs.set(d.id, d));
      if (progress) progress(Math.min(i + 30, keys.length), keys.length);
    }
    for (const doc of docs.values()) {
      const x = doc.data(); let body; try { body = await FB.openBox(x, 'case:' + doc.id); } catch (e) { continue; }
      if (!body || body.dup) continue;
      const a = iprNorm(body.chart); if (!a || !wanted.has(a)) continue;
      if (!out.has(a)) out.set(a, []);
      out.get(a).push({ id: doc.id, name: cleanName(body.patient), at: FB.tsMs(x.updatedAt) || 0, open: x.status !== 'done',
        photo: typeof body.photo === 'string' ? body.photo : '', photoAt: Number(body.photoAt) || 0 });
    }
    out.forEach(list => list.sort((p, q) => q.at - p.at));
    return out;
  },
  /* the newest photo NLO Cases has for a chart #: { id (the case), pv, at } or null */
  async casePhotoOf(chart) {
    const list = (await FB.caseInfo([chart])).get(iprNorm(chart)) || [];
    const c = list.filter(x => x.photo).sort((p, q) => (q.photoAt - p.photoAt) || (q.at - p.at))[0];
    return c ? { id: c.id, pv: c.photo, at: c.photoAt || c.at } : null;
  },
  /* the one name NLO Cases has for a chart # ('' when it has none, or two different ones) */
  oneName(list) {
    const names = new Map(); (list || []).forEach(x => { const k = normName(x.name); if (!names.has(k)) names.set(k, x.name); });
    return names.size === 1 ? Array.from(names.values())[0] : '';
  },

  /* ---------- saving ---------- */
  /* history entry at the fixed id "<record>_<rev>"; prev = the sealed copy this write replaces */
  async logOps(w, kind, id, rev, prev, action) {
    const lid = id + '_' + rev, coll = kind === 'pt' ? 'iprPtLog' : 'iprVisLog';
    const box = await Crypto.sealJSON(FB.keys[FB.curV], action, (kind === 'pt' ? 'iprptlog:' : 'iprvislog:') + lid);
    const o = kind === 'pt' ? { ptId: id } : { visId: id };
    w.set(FB.db.doc(coll + '/' + lid), Object.assign(o, { rev, uid: FB.uid, sid: FB.me.staffId, at: FB.ts(), v: FB.curV, iv: box.iv, ct: box.ct, prev: prev || null }));
  },
  newId(kind) { return FB.db.collection(kind === 'pt' ? 'iprPts' : 'iprVis').doc().id; },
  /* a new patient or visit (with its first history entry) under `id`; a visit needs its patient (`p`) saved already, or in the
     same batch (`with`: another record to create alongside, e.g. a new patient with its first visit). `photo` (bytes): a new
     patient's picture, in the same batch under the version id its record names */
  async create(kind, id, body, opts, retried) {
    opts = opts || {};
    const b = FB.db.batch();
    const add = async (k, rid, bd, p, photo) => {
      if (k === 'pt' && photo) { bd = Object.assign({}, bd, { photo: uid8(), photoAt: Number(opts.photoAt) || Date.now() }); b.set(FB.db.doc('photos/' + rid), await FB.photoBox(rid, photo, bd.photo)); }
      const v = FB.curV, box = await Crypto.sealJSON(FB.keys[v], bd, FB.aad(k, rid, p));
      const doc = { v, iv: box.iv, ct: box.ct, rev: 1, by: FB.uid, sid: FB.me.staffId, createdAt: FB.ts(), updatedAt: FB.ts() };
      if (k === 'pt') { const pc = await FB.iprPc(bd.chart); if (pc) doc.pc = pc; } else doc.p = p;
      b.set(FB.db.doc((k === 'pt' ? 'iprPts/' : 'iprVis/') + rid), doc);
      await FB.logOps(b, k, rid, 1, null, opts.action || { a: 'create' });
      return bd;
    };
    if (opts.with) await add(opts.with.kind, opts.with.id, opts.with.body, opts.with.p, opts.with.photo);
    body = await add(kind, id, body, opts.p, opts.photo);
    try { await FB.track(b.commit()); }
    catch (e) {
      // refused: the office key may have changed a moment ago (take the newest, try once more) — or this record exists already
      if (retried || !FB.isPerm(e) || !(await FB.refreshKeys())) throw e;
      return FB.create(kind, id, body, opts, true);
    }
    return opts.photo ? body : id;
  },
  /* one person's saves to the same record run one after another, never racing each other */
  queued(k, fn) {
    const p = (FB.queues[k] || Promise.resolve()).then(fn, fn);
    FB.queues[k] = p.catch(() => { });
    return p;
  },
  /* fn(body, doc) edits the latest sealed copy in place (return false: nothing to save). Resolves to { body, rev, d } (or { body,
     skipped }). ops(tx, body), if given, adds other writes that must land together with this save (the patient's photo) */
  mutate(kind, id, fn, action, ops) { return FB.queued(kind + '/' + id, () => FB._mutate(kind, id, fn, action, 0, ops)); },
  async _mutate(kind, id, fn, action, tries, ops) {
    const ref = FB.db.doc((kind === 'pt' ? 'iprPts/' : 'iprVis/') + id);
    let out = null;
    try {
      await FB.track(FB.db.runTransaction(async tx => {
        const s = await tx.get(ref); if (!s.exists) throw errCode('gone', 'That record isn’t there any more.');
        const d = s.data(), aad = FB.aad(kind, id, d.p), body = await FB.openBox(d, aad);
        if (fn(body, d) === false) { out = { body, rev: d.rev, skipped: true, d }; return; }
        const v = FB.curV, box = await Crypto.sealJSON(FB.keys[v], body, aad);
        const upd = { v, iv: box.iv, ct: box.ct, rev: d.rev + 1, by: FB.uid, sid: FB.me.staffId, updatedAt: FB.ts() };
        if (kind === 'pt') { const pc = await FB.iprPc(body.chart); upd.pc = pc || FB.del(); }
        tx.update(ref, upd);
        await FB.logOps(tx, kind, id, d.rev + 1, { v: d.v, iv: d.iv, ct: d.ct }, action || { a: 'save' });
        if (ops) await ops(tx, body);
        out = { body, rev: d.rev + 1, d: Object.assign({}, d, { rev: d.rev + 1, sid: FB.me.staffId, updatedAt: Date.now() }) };
      }));
    } catch (e) {
      if (tries < 2 && FB.isPerm(e) && await FB.refreshKeys().catch(() => false)) {
        await new Promise(r => setTimeout(r, 150 + Math.random() * 350));
        return FB._mutate(kind, id, fn, action, tries + 1, ops);
      }
      throw e;
    }
    return out;
  },

  /* ---------- patient photos (27 Oct 2026, Amir: "the IPR tracker and case tracker should be fully sharing the same data … their
     photo, exactly how we have it in case tracker"): NLO Cases' photos collection — a case's at photos/{case id}, this app's at
     photos/{patient record id} — each sealed with the office key (as NLO Cases seals them: AAD 'photo:' + id), changed only
     together with a save of its record. Either app reads both. ---------- */
  async photoBox(id, bytes, pv) {
    const v = FB.curV; const box = await Crypto.seal(FB.keys[v], bytes, 'photo:' + id);
    return { v, iv: box.iv, ct: box.ct, pv, at: FB.ts(), by: FB.uid };
  },
  /* { pv, bytes, at } or null — a case's photo, or an IPR patient's */
  async getPhoto(id) {
    const s = await FB.db.doc('photos/' + id).get(); if (!s.exists) return null;
    const x = s.data(); if (!FB.keys[x.v]) throw errCode('no-key', 'Missing key version ' + x.v);
    return { pv: x.pv, bytes: await Crypto.open(FB.keys[x.v], x, 'photo:' + id), at: FB.tsMs(x.at) || 0 };
  },

  /* ---------- the move, and Dr. A's "Remove the old copy" (move.js) ---------- */
  /* every record here, opened: { pts: Map(id → { body, d }), vis: Map(id → { body, d }) } */
  async everything() {
    const [ps, vs] = await Promise.all([FB.db.collection('iprPts').get(), FB.db.collection('iprVis').get()]);
    const pts = new Map(), vis = new Map(), bad = [];
    for (const doc of ps.docs) { const d = doc.data(); try { pts.set(doc.id, { body: await FB.openBox(d, FB.aad('pt', doc.id)), d }); } catch (e) { bad.push(doc.id); } }
    for (const doc of vs.docs) { const d = doc.data(); try { vis.set(doc.id, { body: await FB.openBox(d, FB.aad('vis', doc.id, d.p)), d }); } catch (e) { bad.push(doc.id); } }
    return { pts, vis, bad };
  },
  /* what each save to a record was (its history), oldest first: [{ rev, a, sid, at }] */
  async historyOf(kind, id) {
    const coll = kind === 'pt' ? 'iprPtLog' : 'iprVisLog', f = kind === 'pt' ? 'ptId' : 'visId', pre = kind === 'pt' ? 'iprptlog:' : 'iprvislog:';
    const s = await FB.db.collection(coll).where(f, '==', id).get(), out = [];
    for (const doc of s.docs) { const x = doc.data(); let a = null; try { a = await FB.openBox(x, pre + doc.id); } catch (e) { } out.push({ rev: x.rev, a: a && a.a, sid: x.sid, at: FB.tsMs(x.at) }); }
    return out.sort((p, q) => p.rev - q.rev);
  },
  /* writes: [{ kind, id, body, p?, mode: 'create' | 'update', action }] — a few at a time, each record in a batch of its own with
     its history entry (well inside the rules' lookup limits); patients before visits */
  async moveWrite(writes, progress) {
    let done = 0; const failed = [];
    const one = async w => {
      try {
        if (w.mode === 'create') await FB.create(w.kind, w.id, w.body, { p: w.p, action: w.action });
        else await FB.mutate(w.kind, w.id, b => {
          const photo = w.kind === 'pt' && b.photo ? { photo: b.photo, photoAt: b.photoAt } : null; // (a photo added here stays: the old copy never had one)
          Object.keys(b).forEach(k => delete b[k]); Object.assign(b, JSON.parse(JSON.stringify(w.body))); if (photo) Object.assign(b, photo);
        }, w.action);
      } catch (e) { failed.push({ w, e }); }
      done++; if (progress) progress(done, writes.length);
    };
    for (const kind of ['pt', 'vis']) {
      const list = writes.filter(w => w.kind === kind);
      for (let i = 0; i < list.length; i += 8) await Promise.all(list.slice(i, i + 8).map(one));
    }
    return failed;
  },
  async markMoved(kind, counts) {
    await FB.track(FB.db.doc('iprMeta/' + kind).set({ at: FB.ts(), by: FB.me.staffId, pts: counts.pts | 0, vis: counts.vis | 0, named: counts.named | 0 }));
  },

  /* ---------- this tab's draft (what's on screen), sealed for this login only: kept across the lock and a reload ---------- */
  async sealDraft(obj) { const v = FB.curV, box = await Crypto.sealJSON(FB.keys[v], obj, 'iprdraft:' + FB.uid); return JSON.stringify({ v, iv: box.iv, ct: box.ct }); },
  async openDraft(s) { const d = JSON.parse(s); return FB.openBox(d, 'iprdraft:' + FB.uid); }
};

/* ---------- the records the app works with, opened, in memory while signed in ----------
   Every patient (live from iprPts); a patient's visits when they're opened. Gone at the lock. */
const IP = {
  pts: new Map(), ready: false, waiters: [], err: null, vis: new Map(), made: new Set(),
  reset() { IP.pts = new Map(); IP.vis = new Map(); IP.made = new Set(); IP.ready = false; IP.err = null; const w = IP.waiters; IP.waiters = []; w.forEach(([, rej]) => rej(errCode('locked'))); },
  apply(up, gone) {
    up.forEach(r => IP.pts.set(r.id, r)); gone.forEach(id => IP.pts.delete(id));
    if (!IP.ready) { IP.ready = true; const w = IP.waiters; IP.waiters = []; w.forEach(([res]) => res()); }
  },
  fail(e) { IP.err = e; const w = IP.waiters; IP.waiters = []; w.forEach(([, rej]) => rej(e)); },
  whenReady() { if (IP.ready) return Promise.resolve(); if (IP.err) return Promise.reject(IP.err); return new Promise((res, rej) => IP.waiters.push([res, rej])); },
  async patients() { await IP.whenReady(); return Array.from(IP.pts.values()).filter(p => !p.locked); },
  patient(id) { return IP.pts.get(id) || null; },
  async visits(pid) {
    const rows = await FB.visitsOf(pid);
    IP.vis.set(pid, new Map(rows.map(r => [r.id, r])));
    return rows.map(r => Object.assign({}, r));
  },
  /* the patients with this chart # (letters and digits compared) */
  async byChart(chart) { const a = iprNorm(chart); if (!a) return []; return (await IP.patients()).filter(p => iprNorm(p.patient_id) === a); },
  /* fields: { chart, name, ini?, photo? (bytes), photoAt? } */
  async createPatient(fields) {
    const id = FB.newId('pt'); let body = { chart: String(fields.chart || '').trim(), name: cleanName(fields.name), at: new Date().toISOString() };
    if (fields.ini) body.ini = String(fields.ini);
    const r = await FB.create('pt', id, body, fields.photo ? { photo: fields.photo, photoAt: fields.photoAt } : null);
    if (fields.photo && r && r.photo) body = r;
    const row = FB.ptRow(id, body, { rev: 1, sid: FB.me.staffId, updatedAt: Date.now() });
    if (!IP.pts.has(id)) IP.pts.set(id, row);
    return row;
  },
  /* the patient's photo: set (bytes) or remove (null), together with a save of the record (its history says so). `at`: when the
     picture was taken into the records (a picture brought over from NLO Cases keeps its own time). Resolves to the row. */
  async setPhoto(id, bytes, how, at) {
    const pv = bytes ? uid8() : '', when = bytes ? (Number(at) || Date.now()) : 0;
    const r = await FB.mutate('pt', id, b => { if (!bytes && !b.photo) return false; if (bytes) { b.photo = pv; b.photoAt = when; } else { delete b.photo; delete b.photoAt; } return true; },
      { a: 'photo', how: how || (bytes ? 'add' : 'remove') },
      async tx => { const ref = FB.db.doc('photos/' + id); if (bytes) tx.set(ref, await FB.photoBox(id, bytes, pv)); else tx.delete(ref); });
    const row = FB.ptRow(id, r.body, r.d); IP.pts.set(id, row); return row;
  },
  /* patch: { chart?, name? } */
  async savePatient(id, patch, action) {
    const r = await FB.mutate('pt', id, b => {
      let ch = false;
      if (patch.chart != null && String(patch.chart).trim() !== b.chart) { b.chart = String(patch.chart).trim(); ch = true; }
      if (patch.name != null && cleanName(patch.name) !== cleanName(b.name)) { b.name = cleanName(patch.name); ch = true; }
      return ch;
    }, action || { a: 'save' });
    const row = FB.ptRow(id, r.body, r.d); IP.pts.set(id, row); return row;
  },
  /* the visit on screen, saved under the id it was given when it started (app.js): made by its first save, updated by every save
     after — so a save that runs twice (an autosave and Save, the lock's last save, a save after signing in again) can only ever
     update that one visit, never make a second copy. Fields replace the ones of the same name; the rest stays as it is. Saves to
     one visit run one after another. Resolves to the visit's row (made: true when this save made it). */
  async putVisit(id, pid, fields) {
    if (!id || !pid) throw errCode('no-visit', 'No visit to save.');
    const patch = FB.cleanVis(fields), known = () => IP.made.has(id) || (IP.vis.has(pid) && IP.vis.get(pid).has(id));
    const update = () => FB._mutate('vis', id, (b, d) => {
      if (d.p !== pid) throw errCode('wrong-patient', 'This visit belongs to another patient’s record.');
      const before = canonJSON(b); Object.assign(b, patch); return canonJSON(b) !== before;
    }, null, 0);
    const r = await FB.queued('vis/' + id, async () => {
      if (known()) return update();
      const body = FB.cleanVis(Object.assign({}, fields, { created_at: new Date().toISOString() }));
      try { await FB.create('vis', id, body, { p: pid }); }
      catch (e) {
        // refused: is it there already (saved by this tab before the lock, its answer lost on the way)? Then it's updated instead
        const s = await FB.db.doc('iprVis/' + id).get().catch(() => null);
        if (!s || !s.exists) throw e;
        return update();
      }
      return { body, rev: 1, made: true, d: { p: pid, rev: 1, sid: FB.me.staffId, updatedAt: Date.now() } };
    });
    IP.made.add(id);
    const row = Object.assign(FB.visRow(id, r.body, r.d), { made: !!r.made });
    if (IP.vis.has(pid)) IP.vis.get(pid).set(id, row);
    return Object.assign({}, row);
  }
};

function errText(e) {
  const c = (e && (e.code || e.message)) || '';
  if (/no-user/.test(c)) return 'No login with that username.';
  if (/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return 'Username or password is incorrect.';
  if (/inactive/.test(c)) return 'This login has been turned off. Ask Dr. A.';
  if (/not-member/.test(c)) return 'That account isn’t part of the office.';
  if (/too-many-requests/.test(c)) return 'Too many attempts. Wait a minute and try again.';
  if (/network|unavailable/.test(c)) return (e && e.message && !/^Firebase/.test(e.message) && e.code === 'unavailable') ? e.message : 'Can’t reach the server. Check the internet connection.';
  if (/weak-password/.test(c)) return 'Password needs at least 8 characters.';
  if (/boot-failed/.test(c)) return 'That temporary password didn’t work. Ask Dr. A to reissue your login.';
  if (/boot-stale/.test(c)) return 'This invite expired after a security update. Ask Dr. A to reissue your login.';
  if (/bad-code/.test(c)) return 'That recovery code didn’t work. Check it and try again.';
  if (/popup-blocked/i.test(c)) return 'The browser blocked the sign-in window. Allow pop-ups for this page and try again.';
  if (/popup-closed|cancelled-popup/i.test(c)) return 'The sign-in window was closed before it finished.';
  if (/permission/.test(c)) return (e && e.message && !/^(Missing or insufficient|PERMISSION_DENIED|Firebase)/i.test(e.message) && e.code === 'permission-denied') ? e.message : 'Not allowed. Your access may have changed.';
  if (/requires-recent-login/.test(c)) return 'Please sign in again, then retry.';
  return (e && e.message) ? String(e.message).replace(/^Firebase:\s*/, '') : 'Something went wrong.';
}
function busyBtn(btn, on, label) { if (!btn) return; if (on) { btn.dataset.l = btn.textContent; btn.textContent = label || 'Working…'; btn.disabled = true; } else { btn.textContent = btn.dataset.l || btn.textContent; btn.disabled = false; } }

/* ---------- start-up ---------- */
function boot() {
  const qs = new URLSearchParams(location.search);

  S.emu = local && qs.has('emu');
  // a link from NLO Cases (#chart=<chart #>): read once, kept in this tab's memory until the app opens, and taken out of the
  // address right away (older links carried &ini= too — not needed any more)
  try {
    const h = new URLSearchParams(String(location.hash || '').replace(/^#/, ''));
    const chart = String(h.get('chart') || '').trim().slice(0, 40);
    if (chart) S.deep = { chart };
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  } catch (e) { }
  // IPR Tracker 3 kept the patient on screen (chart #, initials and the amounts) readable in this tab, and the recent patients'
  // chart #s and initials on this computer: gone (the draft is sealed now, the recent list keeps record ids only)
  try { Object.keys(sessionStorage).filter(k => /^ipr_/.test(k)).forEach(k => sessionStorage.removeItem(k)); } catch (e) { }
  try { localStorage.removeItem('ipr_recent'); } catch (e) { }
  try { S.lastLogin = localStorage.getItem('nloIpr.lastLogin') || localStorage.getItem('nloCases.lastLogin') || ''; } catch (e) { }
  let lockMsg = ''; try { lockMsg = sessionStorage.getItem(LOCKMSG_KEY) || ''; sessionStorage.removeItem(LOCKMSG_KEY); } catch (e) { }
  document.addEventListener('click', onClick);
  ['pointerdown', 'keydown', 'wheel', 'touchstart', 'input'].forEach(ev => document.addEventListener(ev, () => { S.lastAct = Date.now(); }, { passive: true, capture: true }));
  B = FB;
  if (!FB.init(S.emu)) { lockScreen('unconfigured'); return; }
  FB.ready().then(() => lockScreen('login', lockMsg ? { ok: lockMsg } : {}));
}

function bindLockForms() {

/* ---------- in and out ---------- */
async function enterApp() {
  S.inApp = true; S.gate = 'opening'; S.loadErr = ''; S.lastAct = Date.now();
  $('#lockWrap').classList.add('hidden');
  renderGate();
  clearInterval(S.idleTimer);
  S.idleTimer = setInterval(() => {
    if (!S.inApp) return;
    // a save still on its way (or the move) holds the lock off two more minutes at most: with no internet a save can wait for
    // good, and a computer at the chair mustn't stay signed in that long
    const mins = idleMinutes(), waiting = (B && B.pending > 0) || MV.busy;
    if (Date.now() - S.lastAct > mins * 60000 + (waiting ? IDLE_GRACE_MS : 0))
      lockOut('Locked after ' + mins + ' minutes without activity.' + (B && B.pending > 0 ? ' A change was still waiting for the internet, so it may not have been saved.' : ''));
  }, 15000);
  // the idle lock's minutes (NLO Cases → Team & security), before the app opens too
  B.db.doc('meta/settings').get().then(s => { if (s.exists) S.settings = Object.assign({ idleMin: 10 }, s.data()); }).catch(() => { });
  let r;
  try { r = await B.open(); } catch (e) { r = { st: 'error' }; S.loadErr = errText(e); }
  if (!S.inApp) return;
  S.moved = r.moved || null; S.removed = r.removed || null;
  if (r.st === 'ready') startApp(); else { S.gate = r.st; renderGate(); }
}
ACT.retryOpen = async () => {
  S.gate = 'opening'; renderGate(); let r;
  try { r = await B.open(); } catch (e) { r = { st: 'error' }; S.loadErr = errText(e); }
  if (!S.inApp) return;
  S.moved = r.moved || null; S.removed = r.removed || null;
  if (r.st === 'ready') startApp(); else { S.gate = r.st; renderGate(); }

/* the records may be opened: the live listeners, then the app with this tab's draft (if it's this person's) */
async function startApp() {
  S.gate = 'ready';
  $('#gateWrap').classList.add('hidden');
  B.start({
    settings(s) { S.settings = Object.assign({ idleMin: 10 }, s || {}); },
    roster(list) { if (typeof iprRosterApply === 'function') iprRosterApply(list || []); },
    patients() { IP_SUBS.forEach(f => { try { f(); } catch (e) { } }); },
    revoked() { lockOut('Your access was turned off.'); },
    error(e) { if (B.isPerm(e)) lockOut('Your access changed. Sign in again.'); else console.warn(e); }
  });
  let draft = null;
  try { const s = sessionStorage.getItem(DRAFT_KEY); if (s) draft = await B.openDraft(s); } catch (e) { draft = null; }
  if (!draft) { try { sessionStorage.removeItem(DRAFT_KEY); } catch (e) { } }
  if (!S.inApp) return;

}
/* the app hears about patients changing (another computer saved one) */
const IP_SUBS = new Set();
/* locked: the page starts over, so nothing is left in this tab's memory (the sealed draft stays for the same person) */
async function lockOut(msg) {
  if (!S.inApp || S.locking) return;
  S.locking = true; clearInterval(S.idleTimer);

/* =====================================================================
   The move (once, Dr. A), and afterwards "Remove the old copy".
   The IPR Tracker's records sat in the nlo-inventory Realtime Database
   (nlo/ipr/patients, nlo/ipr/visits/<patient>/<visit>), unencrypted,
   with initials only. Dr. A connects to it with Google (his account or
   the office one), the page reads everything and shows what it found,
   with the full name NLO Cases has for each chart #. "Move it now" reads
   it all again, seals every patient and visit here under the same ids,
   opens every one again to check it matches, and only then marks the
   records moved (iprMeta/moved) — and leaves a mark in the old database
   (nlo/ipr/moved) that sends the old IPR Tracker's page here.
   Running it again (a move that stopped half way) saves the same records
   under the same ids, so nothing doubles.
   Then (the done card) Dr. A locks the old copy to his own Google account
   (../tools/rtdb-rules-ipr-lock.py, in Cloud Shell: an IPR Tracker 3 page
   left open on some computer can't keep saving there) and removes it:
   that reads the old database again, brings over anything saved there
   since the move, checks, and deletes nlo/ipr's patients and visits —
   only if the old copy is still exactly what it read (its ETag), so a
   save there in the meantime is never lost (the mark stays).
   ===================================================================== */
const MV = { step: 'start', who: '', plan: null, done: 0, total: 0, err: '', res: null, checked: false, busy: false };
const LOCK_CMD = 'curl -sO https://amooloo.github.io/nlo-apps/tools/rtdb-rules-ipr-lock.py && python3 rtdb-rules-ipr-lock.py';

/* ---------- the old database (read, and at the very end emptied) ----------
   Its own Google sign-in, kept only while this page is open (never on the computer): closed after the move; a lock or a
   reload ends it. */
const OLD = {
  auth: null,
  init() {
    if (OLD.auth) return true;
    if (typeof firebase === 'undefined' || !firebase.auth) return false;
    const cfg = S.emu ? { apiKey: 'demo-key', authDomain: 'localhost', projectId: 'demo-nlo-cases', appId: 'demo' } : OLD_FB;
    const app = firebase.apps.find(a => a && a.name === 'iprMove') || firebase.initializeApp(cfg, 'iprMove');
    OLD.auth = app.auth();
    if (S.emu) OLD.auth.useEmulator('http://127.0.0.1:9099', { disableWarnings: true });
    OLD.auth.setPersistence(firebase.auth.Auth.Persistence.NONE).catch(() => { });
    return true;
  },
  async user() { if (!OLD.init()) return null; return OLD.auth.currentUser || null; },
  /* straight from the click (a sign-in window may only open from one) */
  connect() {
    if (!OLD.init()) return Promise.reject(errCode('unavailable', 'Not available in this browser.'));
    if (S.emu) return OLD.auth.signInAnonymously();
    const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' });
    return OLD.auth.signInWithPopup(p);
  },
  async disconnect() { if (OLD.auth) await OLD.auth.signOut(); },
  /* the old database's REST API, with this sign-in. o: { body, etag: true (ask for the data's ETag), ifMatch: <ETag> (write only
     if the data there is still exactly that) } → { status, data, etag }; a refused ifMatch (412: changed since) is an answer */
  async req(method, path, o) {
    o = o || {};
    const u = await OLD.user(); if (!u) throw errCode('no-old', 'Not connected to the old IPR Tracker.');
    const tok = await u.getIdToken();
    const url = (S.emu ? 'http://127.0.0.1:9000/' : OLD_FB.databaseURL + '/') + path + '.json?' + (S.emu ? 'ns=demo-nlo-cases&' : '') + 'auth=' + encodeURIComponent(tok);
    const headers = {};
    if (o.body !== undefined) headers['Content-Type'] = 'application/json';
    if (o.etag) headers['X-Firebase-ETag'] = 'true';
    if (o.ifMatch) headers['if-match'] = o.ifMatch;
    let r;
    try { r = await fetch(url, { method, cache: 'no-store', credentials: 'omit', headers, body: o.body === undefined ? undefined : JSON.stringify(o.body) }); }
    catch (e) { throw errCode('unavailable', 'Couldn’t reach the old IPR Tracker. Check the internet connection.'); }
    if (r.status === 401 || r.status === 403) throw errCode('permission-denied', 'This Google account (' + (u.email || 'not Dr. A’s') + ') can’t ' + (method === 'GET' ? 'read' : 'change') + ' the old IPR Tracker. Connect with Dr. A’s Google account.');
    if (r.status === 412 && o.ifMatch) return { status: 412, data: null, etag: r.headers.get('ETag') || '' };
    if (!r.ok) throw errCode('unavailable', 'The old IPR Tracker answered ' + r.status + '.');
    return { status: r.status, data: await r.json(), etag: r.headers.get('ETag') || '' };
  },
  async call(method, path, body) { return (await OLD.req(method, path, { body })).data; },
  read(path) { return OLD.call('GET', path); }
};
/* everything under nlo/ipr, read at once, with its ETag (the old database's fingerprint of that data) */
function asObj(v) {
  if (Array.isArray(v)) { const o = {}; v.forEach((x, i) => { if (x != null) o[String(i)] = x; }); return o; }
  return v && typeof v === 'object' ? v : {};
}
async function readOld() {
  const r = await OLD.req('GET', 'nlo/ipr', { etag: true }), all = asObj(r.data), other = {};
  Object.keys(all).forEach(k => { if (k !== 'patients' && k !== 'visits' && k !== 'moved') other[k] = all[k]; });
  return { patients: asObj(all.patients), visits: asObj(all.visits), moved: all.moved || null, other, etag: r.etag };
}

/* ---------- working out the move (nothing is saved here): the old records → the sealed records ----------
   → { pts: [{ id, body }], vis: [{ id, p, body }], orphans: [{ pk, vk }], counts, notes, first, last }.
   have (Remove the old copy): the records here — a visit whose patient is here already (taken out of the old copy before, the
   visit saved there after by an old page left open) comes over to that patient. */
const okId = id => typeof id === 'string' && id.length > 0 && id.length <= 64 && /^[A-Za-z0-9_.:-]+$/.test(id) && !/^__.*__$/.test(id);
/* the id a record keeps here: its old one — or, for one with characters this database can't take (only a hand edit makes
   one), the same new one every time */
async function idFor(k) { return okId(k) ? k : 'm' + (await Crypto.sha256hex('ipr-old-id:' + k)).slice(0, 31); }
/* a fingerprint of an old record exactly as it was read (any order of keys): kept, sealed, with the record here, so "Remove
   the old copy" can tell a record that changed in the old database after the move */
async function oldHash(row) { return (await Crypto.sha256hex(canonJSON(row))).slice(0, 32); }
async function planMove(old, names, have) {
  const pts = [], vis = [], orphans = [], notes = [], skipped = { renamed: 0, junk: 0 };
  const counts = { pts: 0, vis: 0, named: 0, unnamed: 0, mismatch: 0, twoNames: 0, orphans: 0 };
  const group = new Map();   // the key the old app filed a patient's visits under → that patient's id here
  const seenVis = new Set();
  let first = '', last = '';
  for (const k of Object.keys(old.patients)) {
    const r = old.patients[k];
    if (!r || typeof r !== 'object') { skipped.junk++; continue; }
    const id = await idFor(k); if (id !== k) skipped.renamed++;
    const chart = String(r.patient_id == null ? '' : r.patient_id).trim();
    // the old app kept the initials in "name" (or the chart # again when none were typed)
    let ini = String(r.name == null ? '' : r.name).trim(); if (ini === chart) ini = '';
    const body = { chart, name: '', at: String(r.created_at || ''), oh: await oldHash(r) };
    if (ini) body.ini = ini;
    const list = names.get(iprNorm(chart)) || [], one = FB.oneName(list);
    if (one && fitsInitials(one, ini)) { body.name = one; counts.named++; }
    else { counts.unnamed++; if (one) counts.mismatch++; else if (list.length) counts.twoNames++; }
    pts.push({ id, body }); counts.pts++;
    // (IPR Tracker 3 filed a patient's visits under the record's own id field — the same as its key, for every record it made)
    group.set(k, id);
    if (typeof r.id === 'string' && r.id && r.id !== k && !old.patients[r.id] && !group.has(r.id)) group.set(r.id, id);
  }
  for (const pk of Object.keys(old.visits)) {
    const grp = old.visits[pk]; if (!grp || typeof grp !== 'object') { skipped.junk++; continue; }
    let p = group.get(pk) || null;
    if (!p && have) { const m = await idFor(pk); p = have.pts.has(pk) ? pk : have.pts.has(m) ? m : null; }
    for (const vk of Object.keys(grp)) {
      const r = grp[vk];
      if (!r || typeof r !== 'object') { skipped.junk++; continue; }
      if (!p) { orphans.push({ pk, vk }); counts.orphans++; continue; }
      // (the same visit key under two patients — only a hand edit makes that — or here already under another patient: a stable id
      // of its own, so neither is lost)
      let id = await idFor(vk);
      if (seenVis.has(id) || (have && have.vis && have.vis.has(id) && have.vis.get(id).d.p !== p)) id = await idFor(pk + '/' + vk);
      seenVis.add(id); if (id !== vk) skipped.renamed++;
      const body = FB.cleanVis(r); delete body.patient_uuid; delete body.id;
      body.oh = await oldHash(r);
      vis.push({ id, p, body }); counts.vis++;
      const d = String(r.date || ''); if (d) { if (!first || d < first) first = d; if (!last || d > last) last = d; }
    }
  }
  if (counts.mismatch) notes.push(plural(counts.mismatch, 'patient') + ': the name NLO Cases has for the chart # doesn’t fit the initials here, so it isn’t used; the initials stay until someone adds the full name.');
  if (counts.twoNames) notes.push(plural(counts.twoNames, 'patient') + ': NLO Cases has two different names for the chart #, so neither is used.');
  if (counts.orphans) notes.push(plural(counts.orphans, 'visit') + (counts.orphans === 1 ? ' belongs' : ' belong') + ' to no patient (the old app never showed ' + (counts.orphans === 1 ? 'it' : 'them') + '), so ' + (counts.orphans === 1 ? 'it isn’t' : 'they aren’t') + ' moved.');
  if (skipped.renamed) notes.push(plural(skipped.renamed, 'record') + ' get a new record id here (the old one has characters this database can’t take).');
  if (skipped.junk) notes.push(plural(skipped.junk, 'empty entry', 'empty entries') + ' in the old database aren’t moved.');
  return { pts, vis, orphans, counts, notes, first, last };
}
function planSum(P) { return JSON.stringify([P.counts, P.first, P.last, P.notes.length, P.pts.map(p => p.id + p.body.oh), P.vis.map(v => v.id + v.p + v.body.oh), P.orphans.map(o => o.pk + '/' + o.vk)]); }
/* the names NLO Cases has for every chart # in the old records */
async function namesFor(old) {
  const charts = Array.from(new Set(Object.values(old.patients).filter(r => r && typeof r === 'object').map(r => String(r.patient_id == null ? '' : r.patient_id).trim()).filter(Boolean)));
  return FB.caseNames(charts);
}

ACT.mvConnect = async () => {

  if (!await confirmBox('Move the IPR Tracker now?', 'Make sure nobody is charting in the old IPR Tracker. It takes a minute or two; keep this page open.', 'Move it now')) return;
  MV.err = ''; MV.step = 'rereading'; MV.busy = true; renderGate();
  try {
    // read it all again: anything different from what the card showed, and the card shows the new numbers instead
    const old = await readOld(), P = await planMove(old, await namesFor(old), null);
    if (planSum(P) !== planSum(MV.plan)) {
      MV.plan = P; MV.step = 'ready'; MV.busy = false;
      MV.err = 'The old IPR Tracker changed since you read it. The numbers above are new: look them over and press Move it now again.';
      renderGate(); return;
    }
    MV.plan = P;
    await doMove(P);
    // the old page sends everyone here from now on (a mark only: nothing about anyone)
    MV.markErr = '';
    await OLD.call('PUT', 'nlo/ipr/moved', { at: Date.now(), to: 'IPR_Tracker.html' }).catch(e => { console.warn('moved mark', e); MV.markErr = errText(e); });
    OLD.disconnect().catch(() => { }); MV.who = '';
    MV.step = 'done';

  MV.busy = false; renderGate();
};

  P.vis.forEach(x => { const h = have.vis.get(x.id); if (!h) writes.push({ kind: 'vis', id: x.id, p: x.p, body: x.body, mode: 'create', action }); else if (canonJSON(h.body) !== canonJSON(x.body)) writes.push({ kind: 'vis', id: x.id, p: x.p, body: x.body, mode: 'update', action }); });

/* the old copy now, against what's here: the writes that bring over what changed there since the move */
async function rmPlan() {

  const writes = []; let conflicts = 0;
  const sameOld = (h, x) => h && h.body.oh && h.body.oh === x.body.oh;
  for (const x of P.pts) {
    const h = have.pts.get(x.id);
    if (!h) { writes.push({ kind: 'pt', id: x.id, body: Object.assign({}, x.body), mode: 'create', action: { a: 'old-copy' } }); continue; }
    if (sameOld(h, x)) continue;
    // a patient changed in the old database (the old page never changes one — only a hand edit could): this one's chart # and
    // name stay; the fingerprint is the old record's now, and its initials come along if this one has none
    const nb = Object.assign({}, h.body, { oh: x.body.oh }); if (x.body.ini && !nb.ini) nb.ini = x.body.ini;
    writes.push({ kind: 'pt', id: x.id, body: nb, mode: 'update', rev: h.d.rev, action: { a: 'old-copy' } });
  }
  for (const x of P.vis) {
    const h = have.vis.get(x.id);
    if (!h) { writes.push({ kind: 'vis', id: x.id, p: x.p, body: x.body, mode: 'create', action: { a: 'old-copy' } }); continue; }
    if (sameOld(h, x)) continue;

/* one write bringing a record over; each checks the record here is still the one planned against (rev) */
async function rmWrite(w) {
