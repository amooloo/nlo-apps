*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --bg:#f3f5f9;--surface:#fff;--sunken:#f7f9fc;
  --line:#e3e8ef;--line-2:#d3dbe6;
  --ink:#16253b;--ink-2:#46566e;--ink-3:#74849b;--ink-4:#a3afc0;
  --accent:#2459d6;--accent-ink:#1b46ad;--accent-soft:#edf2fd;--accent-line:#c7d6f6;
  --teal:#0b7f8a;--teal-ink:#096670;--teal-soft:#e6f4f5;--teal-line:#b9dfe2;
  --violet:#6a3fd0;--violet-soft:#f1ecfd;--violet-line:#dacffa;
  --ok:#16825a;--ok-soft:#e7f5ee;--ok-line:#b7e0cb;
  --warn:#a8610b;--warn-soft:#fdf3e2;--warn-line:#f1d5a4;
  --danger:#c53535;--danger-soft:#fdecec;--danger-line:#f3c3c3;
  --r-lg:18px;--r:12px;--r-sm:9px;
  --sh-1:0 1px 2px rgba(22,37,59,.05),0 1px 1px rgba(22,37,59,.03);
  --sh-2:0 8px 28px rgba(22,37,59,.12),0 2px 6px rgba(22,37,59,.07);
}
html{-webkit-text-size-adjust:100%;}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;}
@media print{
  body{background:#f8fafc;}
  body > #root > *:not(.print-only){display:none!important;}
  .print-only{display:block!important;}
  @page{margin:12mm 10mm;}
}
.print-only{display:none;}
/* The printed form keeps the original page's text settings, whatever the on-screen design uses. */
.print-only{font-size:16px;line-height:normal;color:initial;letter-spacing:normal;-webkit-font-smoothing:auto;font-variant-numeric:normal;}

/* ── sign-in gate ─────────────────────────────────────────────── */
.ip-gate{display:flex;position:fixed;inset:0;z-index:9999;background:#16253b;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:var(--font);padding:24px;text-align:center;}
.ip-gate h1{font-size:28px;font-weight:700;color:#f4f7fb;letter-spacing:-.01em;}
.ip-gate p{font-size:15px;color:#9fb0c7;margin-bottom:14px;}
.ip-gate button{padding:13px 30px;font:600 16px var(--font);border:0;border-radius:12px;background:#3d7bf0;color:#fff;cursor:pointer;}
.ip-gate button:hover{background:#4d87f4;}
.ip-gate #authErr{color:#ff9d9d;font-size:13px;max-width:340px;min-height:18px;margin-top:6px;}

/* ── app shell ────────────────────────────────────────────────── */
.ip-app{font-family:var(--font);color:var(--ink);min-height:100vh;}
.ip-app button,.ip-app input,.ip-app select,.ip-app textarea{font-family:inherit;color:inherit;touch-action:manipulation;}
.ip-app button{cursor:pointer;}
.ip-app :focus-visible,.ip-dialog :focus-visible,.ip-overlay :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.ip-shell{width:100%;max-width:940px;margin:0 auto;padding:56px 16px 36px;}
/* One wide column on anything tablet-sized and up. Only the title row steps around the fixed
   "NLO Apps" pill (top-left); everything below it uses the full width so the diagram can be big. */
@media (min-width:700px){
  .ip-shell{width:min(1240px,calc(100vw - 32px));max-width:none;padding:26px 0 44px;}
  .ip-top{padding-left:max(0px,calc(124px - (100vw - min(1240px,100vw - 32px)) / 2));}
}

/* header */
.ip-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap;}
.ip-title{font-size:24px;font-weight:700;letter-spacing:-.015em;line-height:1.15;display:flex;align-items:baseline;gap:9px;}
.ip-title small{font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:0;}
.ip-sub{font-size:13px;color:var(--ink-3);margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.ip-actions{display:flex;gap:8px;align-items:center;}

/* buttons */
.ip-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 18px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:14px;font-weight:600;line-height:1;transition:background .12s,border-color .12s,box-shadow .12s,transform .06s;white-space:nowrap;}
.ip-btn:hover{background:var(--sunken);border-color:#c3cddb;}
.ip-btn:active{transform:translateY(1px);}
.ip-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.ip-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(36,89,214,.35);}
.ip-btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink);}
.ip-btn.ok{background:var(--ok);border-color:var(--ok);color:#fff;}
.ip-btn.ok:hover{background:#12704e;border-color:#12704e;}
.ip-btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;}
.ip-btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2);}
.ip-btn.quiet:hover{background:#e9eef5;}
.ip-btn.soft{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink);}
.ip-btn.soft:hover{background:#e2eafb;}
.ip-btn.violet{background:var(--violet-soft);border-color:var(--violet-line);color:var(--violet);}
.ip-btn.violet:hover{background:#e9e1fb;}
.ip-btn.violet-solid{background:var(--violet);border-color:var(--violet);color:#fff;}
.ip-btn.violet-solid:hover{background:#5a33b3;border-color:#5a33b3;}
.ip-btn.sm{min-height:34px;padding:0 13px;font-size:13px;border-radius:10px;}
.ip-btn.block{width:100%;}
.ip-btn.icon{width:42px;padding:0;}
.ip-btn svg{flex:none;}

/* menu */
.ip-menu-wrap{position:relative;}
.ip-menu-scrim{position:fixed;inset:0;z-index:998;}
.ip-menu{position:absolute;right:0;top:48px;z-index:999;min-width:214px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-2);padding:6px;}
.ip-menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;border:0;background:transparent;border-radius:9px;font-size:14px;font-weight:500;color:var(--ink);}
.ip-menu button:hover{background:var(--sunken);}
.ip-menu svg{color:var(--ink-3);}

/* patient strip */
.ip-strip{display:flex;align-items:center;gap:18px 22px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:11px 16px;margin-bottom:14px;box-shadow:var(--sh-1);}
.ip-who{display:flex;align-items:center;gap:12px;min-width:0;}
.ip-avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13.5px;letter-spacing:.02em;flex:none;}
.ip-who b{display:block;font-size:15px;font-weight:700;line-height:1.15;}
.ip-who span{display:block;font-size:12.5px;color:var(--ink-3);line-height:1.2;margin-top:2px;}
.ip-field{display:flex;flex-direction:column;gap:3px;}
.ip-field label{font-size:12px;font-weight:500;color:var(--ink-3);}
.ip-input,.ip-select{height:36px;padding:0 10px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);font-size:14px;font-weight:500;min-width:0;}
.ip-input:focus,.ip-select:focus,.ip-text:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(36,89,214,.16);}
.ip-input:disabled,.ip-select:disabled{background:var(--sunken);color:var(--ink-3);}
.ip-select{padding-right:6px;cursor:pointer;}
.ip-status{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:13px;color:var(--ink-3);font-weight:500;flex-wrap:wrap;}
.ip-status .ip-sv{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.ip-dot{width:8px;height:8px;border-radius:50%;background:var(--ink-4);flex:none;}
.ip-dot.ok{background:#25a56e;}.ip-dot.bad{background:var(--danger);}.ip-dot.busy{background:var(--accent);animation:ip-pulse 1s ease-in-out infinite;}
@keyframes ip-pulse{50%{opacity:.35;}}
.ip-empty-strip{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r-lg);padding:14px 18px;margin-bottom:14px;color:var(--ink-2);}
.ip-empty-strip b{color:var(--ink);font-weight:600;}
.ip-banner{display:flex;align-items:center;gap:10px;background:var(--warn-soft);border:1px solid var(--warn-line);color:#7a4607;border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:13.5px;font-weight:500;}
.ip-banner svg{flex:none;}

/* tabs */
.ip-tabs{display:inline-flex;gap:2px;background:#e8edf4;padding:4px;border-radius:14px;margin-bottom:14px;max-width:100%;overflow-x:auto;}
.ip-tab{border:0;background:transparent;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;color:var(--ink-3);display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:background .12s,color .12s,box-shadow .12s;}
.ip-tab:hover{color:var(--ink-2);}
.ip-tab.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(22,37,59,.14);}
.ip-badge svg{flex:none;}
.ip-badge{font-size:11.5px;font-weight:700;border-radius:20px;padding:2px 9px;background:var(--teal-soft);color:var(--teal-ink);line-height:1.3;display:inline-flex;align-items:center;gap:8px;}
.ip-badge .bt{display:inline-flex;align-items:center;gap:3px;}
.ip-badge .bt + .sp{padding-left:8px;border-left:1px solid rgba(11,127,138,.28);}

/* amount palette */
.ip-palette{position:sticky;top:52px;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:8px 10px 8px 16px;margin-bottom:16px;box-shadow:var(--sh-2);}
.ip-palette.compact{position:sticky;top:0;box-shadow:var(--sh-1);padding:6px 8px 6px 12px;}
.ip-pal-label{font-size:13px;font-weight:600;color:var(--ink-2);margin-right:2px;}
.ip-amts{display:flex;gap:6px;flex-wrap:wrap;}
.ip-amt,.ip-tool{min-width:50px;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-size:16px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background .1s,border-color .1s,color .1s,box-shadow .1s;font-variant-numeric:tabular-nums;}
.ip-palette.compact .ip-amt,.ip-palette.compact .ip-tool{height:38px;min-width:44px;padding:0 11px;font-size:14px;}
.ip-amt:hover,.ip-tool:hover{border-color:#b7c4d8;background:var(--sunken);}
.ip-amt.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 6px rgba(36,89,214,.35);}
.ip-palette.sp .ip-amt.active{background:var(--teal);border-color:var(--teal);box-shadow:0 2px 6px rgba(11,127,138,.35);}
.ip-pal-sep{width:1px;height:26px;background:var(--line);margin:0 2px;}
.ip-tool{font-size:14px;font-weight:600;color:var(--ink-2);}
.ip-tool.active.erase{background:var(--danger-soft);border-color:var(--danger);color:var(--danger);}
.ip-tool.active.missing{background:#e9edf3;border-color:#5b6b82;color:var(--ink);}
.ip-tool.active.type{background:var(--violet-soft);border-color:var(--violet);color:var(--violet);}
.ip-pal-hint{flex:1 1 220px;min-width:0;font-size:13px;color:var(--ink-3);padding-left:6px;}
@media (max-width:760px){.ip-pal-label{display:none;}.ip-pal-hint{flex-basis:100%;padding-left:2px;}}
@media (max-width:560px){.ip-pal-sep{display:none;}}

/* arch panels */
.ip-arches{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-bottom:16px;}
@media (min-width:1000px){.ip-arches{grid-template-columns:repeat(2,minmax(0,1fr));}}
.ip-arch{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px;box-shadow:var(--sh-1);min-width:0;}
.ip-fit{position:relative;width:100%;}
.ip-stage{position:absolute;left:0;top:0;transform-origin:0 0;}
.ip-svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;font-family:var(--font);}
.ip-tooth path{fill:#fff;stroke:#a7b4c6;stroke-width:1.4;stroke-linejoin:round;transition:fill .12s,stroke .12s;}
.ip-tooth text{font-size:13px;font-weight:600;fill:#6b7b92;text-anchor:middle;dominant-baseline:central;pointer-events:none;user-select:none;}
.ip-tooth.missing path{fill:#f4f6f9;stroke:#b9c3d1;stroke-dasharray:4 3.5;}
.ip-tooth.missing text{font-size:19px;font-weight:500;fill:#97a4b7;}
.ip-tooth:focus,.ip-tooth:focus-visible{outline:none;}
.ip-tooth.pick{pointer-events:all;cursor:pointer;}
.ip-tooth.pick path{stroke:#5b6b82;stroke-dasharray:3.5 3;}
.ip-tooth.pick:hover path{fill:#eef1f6;}
.ip-tooth.pick:focus-visible path{stroke:var(--accent);stroke-width:2.2;}
.ip-stem{stroke:#d3dbe6;stroke-width:1.5;stroke-linecap:round;}
.ip-stem.on{stroke:var(--accent);}
.ip-sp .ip-stem.on{stroke:var(--teal);}
.ip-stem.off{opacity:.35;stroke-dasharray:2 4;}
.ip-quad{font-size:13px;font-weight:700;fill:#8d9bb0;text-anchor:middle;letter-spacing:.04em;}
.ip-sum-lab{font-size:13.5px;font-weight:600;fill:var(--ink-3);text-anchor:middle;}
.ip-sum-num{font-size:40px;font-weight:700;fill:var(--ink);text-anchor:middle;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.ip-sum-num.zero{fill:#c3cdda;}
.ip-sum-num tspan{font-size:16px;font-weight:600;fill:var(--ink-3);letter-spacing:0;}
.ip-sum-sub{font-size:13px;font-weight:600;fill:var(--violet);text-anchor:middle;}
.ip-sum-sub.muted{fill:var(--ink-3);}
.ip-chip{position:absolute;width:38px;height:38px;border-radius:50%;border:1.5px solid #cdd5e1;background:#fff;color:var(--ink);text-align:center;font-size:14px;font-weight:700;padding:0;appearance:textfield;-moz-appearance:textfield;font-variant-numeric:tabular-nums;transition:border-color .1s,background .1s,box-shadow .1s,transform .06s;cursor:text;}
.ip-chip::-webkit-outer-spin-button,.ip-chip::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.ip-chip::placeholder{color:#b6c1d0;font-weight:500;}
.ip-chip.tap{cursor:pointer;}
.ip-chip:hover:not(:disabled):not([readonly]){border-color:var(--accent);}
.ip-chip.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 5px rgba(36,89,214,.28);}
.ip-sp .ip-chip:hover:not(:disabled):not([readonly]){border-color:var(--teal);}
.ip-sp .ip-chip.on{background:var(--teal);border-color:var(--teal);box-shadow:0 2px 5px rgba(11,127,138,.28);}
.ip-chip:focus{outline:none;box-shadow:0 0 0 3px rgba(36,89,214,.28);}
.ip-sp .ip-chip:focus{box-shadow:0 0 0 3px rgba(11,127,138,.28);}
.ip-chip[readonly]{cursor:default;}
.ip-chip:disabled{opacity:.28;cursor:default;box-shadow:none;}
.ip-arch.picking .ip-chip{opacity:.5;}
.ip-prev{position:absolute;width:30px;height:18px;border-radius:9px;background:var(--violet-soft);border:1px solid var(--violet-line);color:var(--violet);font-size:11px;font-weight:700;display:grid;place-items:center;pointer-events:none;font-variant-numeric:tabular-nums;}
.ip-bt{position:absolute;width:26px;height:26px;border:0;border-radius:8px;background:transparent;display:grid;place-items:center;padding:0;color:#b9c4d3;transition:color .1s,background .1s;}
.ip-bt svg{display:block;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round;transition:fill .1s;}
.ip-bt:hover:not(:disabled){color:#5b6b82;background:#eef1f6;}
.ip-bt.on{color:#111827;}
.ip-bt.on svg{fill:currentColor;}
.ip-bt:disabled{cursor:default;opacity:.35;}
.ip-bt.on:disabled{opacity:.85;}
.ip-bt:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

/* cards, stats, lists */
.ip-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--sh-1);margin-bottom:16px;}
.ip-card h3{font-size:15px;font-weight:700;margin-bottom:2px;}
.ip-hint{font-size:13px;color:var(--ink-3);}
.ip-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.ip-gauge{display:inline-flex;align-items:center;gap:9px;padding:8px 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer;user-select:none;}
.ip-gauge input{width:17px;height:17px;accent-color:var(--ok);cursor:pointer;}
.ip-gauge.on{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok);}
.ip-gauge.ro{cursor:default;opacity:.7;}
.ip-gauge.ro input{cursor:default;}
.ip-legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-3);}
.ip-legend i{display:inline-block;vertical-align:-3px;margin-right:6px;}
.ip-lg-chip{width:16px;height:16px;border-radius:50%;background:var(--accent);}
.ip-lg-pill{width:22px;height:13px;border-radius:7px;background:var(--violet-soft);border:1px solid var(--violet-line);vertical-align:-2px!important;}
.ip-metabar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
.ip-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;}
.ip-stats.four{grid-template-columns:repeat(4,minmax(0,1fr));}
.ip-stat{padding:2px 18px;border-left:1px solid var(--line);}
.ip-stat:first-child{border-left:0;padding-left:0;}
.ip-stat .lab{font-size:13px;font-weight:500;color:var(--ink-3);}
.ip-stat .val{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums;}
.ip-stat .val small{font-size:14px;font-weight:600;color:var(--ink-3);margin-left:3px;letter-spacing:0;}
.ip-stat.hero .val{color:var(--accent);}
.ip-stat.sp .val{color:var(--teal);}
.ip-stat.cum .val{color:var(--violet);}
.ip-stats-title{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.ip-stats-title.cum{color:var(--violet);margin-top:16px;padding-top:14px;border-top:1px solid var(--line);}
.ip-cum-foot{margin-top:14px;display:flex;justify-content:flex-end;}
@media (max-width:560px){.ip-stat{padding:2px 10px;}.ip-stat .val{font-size:24px;}.ip-stats.four{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:14px;}.ip-stats.four .ip-stat:nth-child(3){border-left:0;padding-left:0;}}
.ip-quick{display:flex;gap:10px;align-items:center;}
.ip-quick .ip-text{flex:1;min-width:0;}
.ip-text{width:100%;border:1px solid var(--line-2);border-radius:11px;background:var(--surface);padding:0 14px;height:42px;font-size:14px;}
textarea.ip-text{height:auto;padding:11px 14px;line-height:1.5;resize:vertical;}
.ip-text::placeholder{color:var(--ink-4);}
.ip-text[readonly]{background:var(--sunken);color:var(--ink-2);cursor:default;}
.ip-msg{margin-top:8px;font-size:13px;font-weight:600;}
.ip-msg.ok{color:var(--ok);}.ip-msg.err{color:var(--danger);}
.ip-lists{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-bottom:16px;}
@media (min-width:760px){.ip-lists{grid-template-columns:repeat(2,minmax(0,1fr));}}
.ip-lists .ip-card{margin-bottom:0;}
.ip-list-h{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline;}
.ip-list-h span{color:var(--ink-3);font-weight:500;}
.ip-li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eef1f6;font-size:14px;}
.ip-li:last-of-type{border-bottom:0;}
.ip-li b{font-weight:700;font-variant-numeric:tabular-nums;}
.ip-li.upper b{color:var(--accent);}.ip-li.lower b{color:var(--accent);}.ip-li.sp b{color:var(--teal);}
.ip-li .bt{display:inline-flex;align-items:center;gap:8px;}
.ip-tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;margin-top:2px;border-top:1px solid var(--line);font-weight:600;color:var(--ink-2);}
.ip-tot b{font-size:18px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
.ip-none{font-size:13.5px;color:var(--ink-4);padding:6px 0;}
.ip-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 18px;box-shadow:var(--sh-1);}
.ip-foot .msg{font-size:13.5px;color:var(--ink-2);}
.ip-foot .msg.err{color:var(--danger);font-weight:600;}
.ip-foot .where{margin-left:auto;font-size:13px;color:var(--ink-3);}

/* chart note */
.ip-seg{display:inline-flex;gap:2px;background:#e8edf4;padding:3px;border-radius:12px;}
.ip-seg button{border:0;background:transparent;border-radius:9px;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--ink-3);}
.ip-seg button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(22,37,59,.14);}
.ip-checks{display:flex;align-items:center;gap:20px;flex-wrap:wrap;font-size:14px;color:var(--ink-2);margin:14px 0 12px;}
.ip-checks label{display:inline-flex;align-items:center;gap:8px;cursor:pointer;}
.ip-checks label.dis{opacity:.45;cursor:default;}
.ip-checks input{width:17px;height:17px;accent-color:var(--accent);cursor:inherit;}
.ip-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.65;}
.ip-edited{font-size:13px;color:var(--warn);font-weight:600;}

/* modals */
.ip-overlay{position:fixed;inset:0;background:rgba(16,28,46,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;font-family:var(--font);color:var(--ink);}
.ip-overlay button,.ip-overlay input,.ip-overlay select{font-family:inherit;color:inherit;touch-action:manipulation;}
.ip-overlay button{cursor:pointer;}
.ip-dialog{background:var(--surface);border-radius:22px;width:100%;max-width:500px;max-height:92vh;overflow:auto;padding:28px;box-shadow:0 24px 70px rgba(10,20,40,.35);}
.ip-dialog.mid{max-width:600px;}
.ip-dialog.wide{max-width:1120px;padding:24px;}
.ip-dlg-h{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px;}
.ip-dlg-s{font-size:14px;color:var(--ink-3);margin-bottom:18px;}
.ip-dlg-gap{height:14px;}
.ip-recents{margin-bottom:18px;}
.ip-recents .lab{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:8px;}
.ip-recent-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.ip-recent{padding:11px 13px;border-radius:12px;border:1px solid var(--accent-line);background:var(--accent-soft);font-size:14px;font-weight:700;color:var(--accent-ink);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ip-recent:hover{background:#e2eafb;}
.ip-recent span{font-weight:500;color:var(--ink-3);margin-left:7px;}
.ip-opts{display:flex;flex-direction:column;gap:10px;}
.ip-opt{display:flex;align-items:center;gap:14px;text-align:left;padding:16px 18px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);transition:border-color .12s,background .12s,box-shadow .12s;}
.ip-opt:hover{border-color:var(--accent);box-shadow:0 0 0 3px rgba(36,89,214,.1);}
.ip-opt .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none;}
.ip-opt.new .ico{background:var(--ok-soft);color:var(--ok);}
.ip-opt.new:hover{border-color:var(--ok);box-shadow:0 0 0 3px rgba(22,130,90,.12);}
.ip-opt b{display:block;font-size:15.5px;font-weight:700;}
.ip-opt span.d{display:block;font-size:13.5px;color:var(--ink-3);margin-top:2px;}
.ip-dlg-foot{display:flex;flex-direction:column;gap:8px;margin-top:18px;}
.ip-search{display:flex;gap:8px;margin-bottom:10px;}
.ip-results{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto;margin:12px 0 4px;}
.ip-result{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14px;text-align:left;}
.ip-result:hover{border-color:var(--accent);background:var(--accent-soft);}
.ip-result b{font-weight:700;}.ip-result span{color:var(--ink-3);font-size:13px;}
.ip-sumgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;background:var(--violet-soft);border:1px solid var(--violet-line);border-radius:14px;padding:12px 14px;margin-bottom:16px;}
.ip-sumgrid .lab{font-size:12px;font-weight:500;color:var(--violet);}
.ip-sumgrid .val{font-size:18px;font-weight:700;color:#3f2390;margin-top:1px;font-variant-numeric:tabular-nums;}
@media (max-width:520px){.ip-sumgrid{grid-template-columns:repeat(2,minmax(0,1fr));}}
.ip-visit{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14px;}
.ip-visit:hover{border-color:var(--accent);background:var(--accent-soft);}
.ip-visit .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:3px;}
.ip-visit .top b{font-weight:700;}
.ip-visit .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-3);}
.ip-tag{font-size:12px;font-weight:600;color:var(--violet);background:var(--violet-soft);padding:2px 9px;border-radius:20px;}
.ip-sec-h{font-size:13px;font-weight:600;color:var(--ink-2);margin:16px 0 8px;}
.ip-label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px;}
.ip-form{display:flex;flex-direction:column;gap:14px;}
.ip-form .ip-input,.ip-form .ip-select{width:100%;height:44px;font-size:15px;}
.ip-split{display:flex;gap:10px;}.ip-split>*{flex:1;}
.ip-q{font-size:16px;font-weight:700;margin:6px 0 12px;}
.ip-presc-arches{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-bottom:18px;}
@media (min-width:980px){.ip-presc-arches{grid-template-columns:repeat(2,minmax(0,1fr));}}
.ip-presc-arches .ip-arch{box-shadow:none;}
.ip-empty{font-size:14px;color:var(--ink-3);text-align:center;padding:22px 10px;}
.ip-cum-modal{max-width:680px;padding:26px 28px;}
.ip-cum-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;}
.ip-cum-legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:var(--sunken);border-radius:12px;padding:10px 14px;margin-bottom:18px;font-size:13px;color:var(--ink-2);font-weight:500;}
.ip-cum-legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px;}
.ip-cum-legend small{font-size:12px;color:var(--ink-3);margin-left:auto;}
.ip-cum-arch{margin-bottom:20px;}
.ip-cum-arch .h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-size:14px;font-weight:700;}
.ip-cum-arch .h span{font-size:13.5px;color:var(--ink-2);font-weight:600;}
.ip-cum-scroll{overflow-x:auto;padding-bottom:4px;}
.ip-cum-foot2{display:flex;gap:22px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2);}
.ip-cum-foot2 b{color:var(--ink);}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>

// ─── Data layer: same sbGet/sbPost/sbPatch/sbDelete API, backed by Firebase ───
// Supabase-style query strings (eq., ilike., or=(), order=, limit=) are parsed
// and evaluated client-side. Data lives at nlo/ipr/patients/{id} and
// nlo/ipr/visits/{patient_uuid}/{visit_id}.
function fbSanitize(obj) {
  // Firebase rejects undefined; JSON round-trip strips them (and functions)
  return JSON.parse(JSON.stringify(obj === undefined ? null : obj));
}
function fbParseCond(field, spec) {
  // spec like "eq.15-6541" or "ilike.*jg*"
  const dot = spec.indexOf(".");

}
function fbIlikeRegex(pat) {
  const esc = pat.replace(/[.+?^${}()|[\]\\]/g, "\\$&").replace(/\*/g, ".*");
  return new RegExp("^" + esc + "$", "i");
}
function fbMatch(row, c) {
  const v = row[c.field] === undefined || row[c.field] === null ? "" : String(row[c.field]);
  if (c.op === "eq") return v === c.val;
  if (c.op === "ilike") return fbIlikeRegex(c.val).test(v);
  return false;
}

  const keys = orderSpec.split(",").map(s => {
    const parts = s.split(".");
    return { field: parts[0], desc: parts[1] === "desc" };
  });
  return rows.slice().sort((a, b) => {
    for (const k of keys) {
      const av = a[k.field] === undefined || a[k.field] === null ? "" : String(a[k.field]);
      const bv = b[k.field] === undefined || b[k.field] === null ? "" : String(b[k.field]);
      if (av < bv) return k.desc ? 1 : -1;
      if (av > bv) return k.desc ? -1 : 1;
    }
    return 0;

}
async function sbGet(path) {
  const q = path.split("?");
  const table = q[0];
  const params = new URLSearchParams(q[1] || "");
  if (table === "patients") {
    const snap = await fbDB.ref(IPR_ROOT + "/patients").once("value");
    let rows = Object.values(snap.val() || {});
    for (const [k, v] of params.entries()) {
      if (k === "select" || k === "order" || k === "limit") continue;
      if (k === "or") {
        const conds = v.replace(/^\(/, "").replace(/\)$/, "").split(",").map(s => {
          const dot = s.indexOf(".");
          return fbParseCond(s.slice(0, dot), s.slice(dot + 1));
        });
        rows = rows.filter(r => conds.some(c => fbMatch(r, c)));
      } else {
        const c = fbParseCond(k, v);
        rows = rows.filter(r => fbMatch(r, c));
      }
    }
    return fbLimit(fbOrder(rows, params.get("order")), params.get("limit"));
  }
  if (table === "visits") {
    const puSpec = params.get("patient_uuid") || "";
    const pu = puSpec.replace(/^eq\./, "");
    if (!pu) return [];
    const snap = await fbDB.ref(IPR_ROOT + "/visits/" + pu).once("value");
    const rows = Object.values(snap.val() || {});
    return fbLimit(fbOrder(rows, params.get("order") || "date.desc"), params.get("limit"));
  }

}
async function sbPost(table, body) {
  const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + "-" + Math.random().toString(36).slice(2));
  const row = fbSanitize({ ...body, id: id, created_at: new Date().toISOString() });
  if (table === "patients") {
    await fbDB.ref(IPR_ROOT + "/patients/" + id).set(row);
    return [row];
  }
  if (table === "visits") {
    if (!row.patient_uuid) throw new Error("Visit missing patient_uuid");
    await fbDB.ref(IPR_ROOT + "/visits/" + row.patient_uuid + "/" + id).set(row);
    return [row];
  }
  throw new Error("Unknown table: " + table);
}
async function sbPatch(path, body) {
  const q = path.split("?");
  const table = q[0];
  const params = new URLSearchParams(q[1] || "");
  const id = (params.get("id") || "").replace(/^eq\./, "");
  if (!id) throw new Error("PATCH needs id=eq.<id>");
  if (table === "visits") {
    let pu = body && body.patient_uuid;
    if (!pu) {
      // locate the visit by scanning (rare fallback)
      const snap = await fbDB.ref(IPR_ROOT + "/visits").once("value");
      const all = snap.val() || {};
      for (const k of Object.keys(all)) {
        if (all[k] && all[k][id]) { pu = k; break; }
      }
      if (!pu) throw new Error("Visit not found: " + id);
    }
    const upd = fbSanitize({ ...body, id: id });
    await fbDB.ref(IPR_ROOT + "/visits/" + pu + "/" + id).update(upd);
    return [upd];
  }
  if (table === "patients") {
    const upd = fbSanitize({ ...body, id: id });
    await fbDB.ref(IPR_ROOT + "/patients/" + id).update(upd);
    return [upd];
  }
  throw new Error("Unknown table: " + table);
}
async function sbDelete(path) {
  const q = path.split("?");
  const table = q[0];
  const params = new URLSearchParams(q[1] || "");
  const id = (params.get("id") || "").replace(/^eq\./, "");
  if (!id) throw new Error("DELETE needs id=eq.<id>");
  if (table === "patients") {
    // cascade: remove the patient and all their visits
    await fbDB.ref(IPR_ROOT + "/visits/" + id).remove();
    await fbDB.ref(IPR_ROOT + "/patients/" + id).remove();
    return;
  }
  if (table === "visits") {
    const snap = await fbDB.ref(IPR_ROOT + "/visits").once("value");
    const all = snap.val() || {};
    for (const k of Object.keys(all)) {
      if (all[k] && all[k][id]) {
        await fbDB.ref(IPR_ROOT + "/visits/" + k + "/" + id).remove();
        return;
      }
    }
    return;
  }
  throw new Error("Unknown table: " + table);
}

/* Chairside assistant list comes from the shared staff roster (nlo/cadence/roster, written only by Staff Hub; this app only reads it).
   STAFF_NAMES_FALLBACK is used when the roster is missing, empty or unreadable. Bri removed: she has left the practice. */
const STAFF_NAMES_FALLBACK = ["Angie", "Kaylee", "Sarah", "Dr. A", "Gwen"];
function nloRosterToday(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function nloRosterActive(p){return !!p && p.active!==false && !(p.end && p.end<=nloRosterToday());}
function iprNamesFromRoster(people) {
  try {
    const list = people && typeof people === "object" ? Object.values(people).filter(p => p && typeof p === "object") : [];
    const chair = list.filter(p => p.chairside === true && nloRosterActive(p));
    if (!chair.length) return STAFF_NAMES_FALLBACK;
    const key = x => String(x || "").trim().toLowerCase();
    const out = [];
    const add = n => { n = String(n || "").trim(); if (n && !out.some(x => key(x) === key(n))) out.push(n); };
    chair.forEach(p => add(p.nick || p.first || p.name));
    /* a fallback name with no roster record at all is left as it is today */
    STAFF_NAMES_FALLBACK.forEach(n => { if (!list.some(p => key(p.nick) === key(n) || key(p.first) === key(n))) add(n); });
    /* alphabetical by nickname, the doctor last */
    const dr = n => /^dr\b/i.test(n) ? 1 : 0;
    return out.sort((a, b) => dr(a) - dr(b) || a.localeCompare(b));
  } catch (e) { return STAFF_NAMES_FALLBACK; }
}
let iprStaffNamesCur = STAFF_NAMES_FALLBACK;
const iprRosterSubs = new Set();
let iprRosterRef = null, iprRosterCb = null;
function iprStaffNamesNow() { return iprStaffNamesCur; }
function iprRosterSubscribe(f) { iprRosterSubs.add(f); return () => { iprRosterSubs.delete(f); }; }
/* small round photos for the assistant picker, keyed by the name shown in the list (nick, first name or full name).
   Photos come from Staff Hub through the roster; someone who has left shows in grayscale. No photo = nothing extra is drawn. */
let iprPhotosCur = {}, iprPhotosSig = "";
function iprPhotosNow() { return iprPhotosCur; }
function iprPhotosFromRoster(people) {
  const m = {};
  try {
    Object.values(people && typeof people === "object" ? people : {}).forEach(p => {
      if (!p || typeof p !== "object" || typeof p.photo !== "string" || p.photo.indexOf("data:image/jpeg;base64,") !== 0 || p.photo.length >= 30000) return;
      const o = { photo: p.photo, gone: !nloRosterActive(p) };
      [p.nick, p.first, p.name].forEach(n => { n = String(n || "").trim().toLowerCase(); if (n && !m[n]) m[n] = o; });
    });
  } catch (e) {}

}
function iprRosterApply(people) {
  const ph = iprPhotosFromRoster(people);
  const sig = Object.keys(ph).sort().map(k => k + (ph[k].gone ? "g" : "a") + ph[k].photo.length + ph[k].photo.slice(-24)).join("|");
  const photosChanged = sig !== iprPhotosSig;
  if (photosChanged) { iprPhotosCur = ph; iprPhotosSig = sig; }
  const next = iprNamesFromRoster(people);
  const namesChanged = next.join("\n") !== iprStaffNamesCur.join("\n");
  if (!namesChanged && !photosChanged) return;
  if (namesChanged) iprStaffNamesCur = next;
  iprRosterSubs.forEach(f => f());
}
function iprRosterStart() {
  if (iprRosterRef) return;
  try {
    const r = fbDB.ref("nlo/cadence/roster/people");
    iprRosterRef = r;
    iprRosterCb = snap => iprRosterApply(snap && snap.val());
    r.on("value", iprRosterCb, () => { if (iprRosterRef === r) iprRosterRef = null; iprRosterApply(null); });
  } catch (e) { iprRosterRef = null; iprRosterApply(null); }
}

  try { if (iprRosterRef) iprRosterRef.off("value", iprRosterCb); } catch (e) {}

}

// Scales its content (drawn at a fixed native size w×h) to the width it is given, never beyond `max`.
// A zero-height sentinel is what we observe, so resizing our own height can't re-trigger the observer.
function FitBox({ w, h, max, children }) {
  const meas = React.useRef(null);
  const [fit, setFit] = React.useState({ s: 1, ox: 0 });
  React.useLayoutEffect(() => {
    const node = meas.current;
    if (!node) return;
    const measure = () => {
      const cw = node.clientWidth;
      if (!cw) return;
      const s = Math.min(max || 1, cw / w);
      const ox = Math.max(0, (cw - w * s) / 2);
      setFit(prev => (Math.abs(prev.s - s) < 0.002 && Math.abs(prev.ox - ox) < 0.5) ? prev : { s, ox });
    };
    measure();
    if (typeof ResizeObserver === "undefined") {
      window.addEventListener("resize", measure);
      return () => window.removeEventListener("resize", measure);
    }
    const ro = new ResizeObserver(measure);
    ro.observe(node);
    return () => ro.disconnect();
  }, [w, h, max]);
  return el("div", { className: "ip-fit", style: { height: Math.ceil(h * fit.s) } },
    el("div", { ref: meas, style: { position: "absolute", left: 0, right: 0, top: 0, height: 0, visibility: "hidden", pointerEvents: "none" } }),
    el("div", { className: "ip-stage", style: { width: w, height: h, transform: `translate(${fit.ox}px,0) scale(${fit.s})` } }, children));
}

// ─── Recent patients (localStorage) ───────────────────────────────────────────

// ─── Natural language IPR parser (Palmer notation) ───────────────────────────
// Notation: a-b means Right side tooth a → Left side tooth b (across midline)
//   "U3-3" or "upper 3-3" = UR3→UL3 (canine to canine, 5 contacts incl. midline)
//   "UR4-2" = UR4→UR2 (quadrant-specific, stays on right side, 2 contacts)
//   "0.3 lower 3-3" = LR3→LL3 (lower canine to canine)
function parseIPRCommand(text, upperContacts, lowerContacts) {
  const t = text.toLowerCase().trim();
  const UP_T = ["UR7","UR6","UR5","UR4","UR3","UR2","UR1","UL1","UL2","UL3","UL4","UL5","UL6","UL7"];
  const LO_T = ["LR7","LR6","LR5","LR4","LR3","LR2","LR1","LL1","LL2","LL3","LL4","LL5","LL6","LL7"];

  // Extract amount (first decimal/integer)
  const amountMatch = t.match(/(\d*\.?\d+)/);
  if (!amountMatch) return { error: "No amount found — try: 0.3 upper 3-3" };
  const amount = parseFloat(amountMatch[1]);
  if (isNaN(amount) || amount < 0 || amount > 0.8) return { error: "Amount must be 0–0.8 mm" };

  // 1) Quadrant-specific: ur4-2, ul3-5, lr5-3, ll2-4
  const quadMatch = t.match(/\b(ur|ul|lr|ll)\s*(\d+)\s*[-–]\s*(\d+)/);
  // 2) Arch + range: upper 3-3, u3-3, lower 5-4, l3-3
  const archMatch = !quadMatch && t.match(/\b(upper|lower|up|low|u|l)\s*(\d+)\s*[-–]\s*(\d+)/);
  // 3) Plain range at end: just "3-3"
  const plainMatch = !quadMatch && !archMatch && t.match(/(\d+)\s*[-–]\s*(\d+)\s*$/);
  // 4) Single tooth
  const singleMatch = !quadMatch && !archMatch && !plainMatch && t.match(/(\d+)\s*$/);

  // Determine arches
  let wantsUpper = /\b(upper|up)\b/.test(t);
  let wantsLower = /\b(lower|low)\b/.test(t);
  if (quadMatch) {
    wantsUpper = quadMatch[1].startsWith("u");
    wantsLower = quadMatch[1].startsWith("l");
  } else if (archMatch) {
    if (archMatch[1].startsWith("u")) wantsUpper = true;
    if (archMatch[1].startsWith("l")) wantsLower = true;
  }
  const applyUpper = wantsUpper || (!wantsUpper && !wantsLower);
  const applyLower = wantsLower || (!wantsUpper && !wantsLower);

  // Position-based range: right-a → left-b across the midline
  function archRange(teeth, contacts, a, b) {
    const rPfx = teeth[0].replace(/\d+/, "");
    const lPfx = teeth[teeth.length - 1].replace(/\d+/, "");
    const fromIdx = teeth.indexOf(rPfx + a);
    const toIdx = teeth.indexOf(lPfx + b);
    if (fromIdx < 0 || toIdx < 0 || fromIdx >= toIdx) return [];
    return Object.keys(contacts).slice(fromIdx, toIdx);
  }

  // Quadrant range: stays on one side (e.g. UR4-2 = UR4|UR3, UR3|UR2)
  function quadRange(contacts, quad, a, b) {
    const pfx = quad.toUpperCase();
    const lo = Math.min(a, b), hi = Math.max(a, b);
    return Object.keys(contacts).filter(k => {
      const parts = k.split("|");
      if (!parts.every(p => p.startsWith(pfx))) return false;
      const nums = k.match(/\d+/g).map(Number);
      return nums.every(n => n >= lo && n <= hi);
    });
  }

  const upperChanges = {}, lowerChanges = {};
  let affected = 0;

  if (quadMatch) {
    const quad = quadMatch[1], a = parseInt(quadMatch[2]), b = parseInt(quadMatch[3]);
    const isUp = quad.startsWith("u");
    const contacts = isUp ? upperContacts : lowerContacts;
    const changes = isUp ? upperChanges : lowerChanges;
    const ks = quadRange(contacts, quad, a, b);
    ks.forEach(k => { changes[k] = String(amount); });
    affected += ks.length;
  } else if (archMatch || plainMatch) {
    const m = archMatch || plainMatch;
    const a = parseInt(archMatch ? m[2] : m[1]);
    const b = parseInt(archMatch ? m[3] : m[2]);
    if (applyUpper) {
      const ks = archRange(UP_T, upperContacts, a, b);
      ks.forEach(k => { upperChanges[k] = String(amount); });
      affected += ks.length;
    }
    if (applyLower) {
      const ks = archRange(LO_T, lowerContacts, a, b);
      ks.forEach(k => { lowerChanges[k] = String(amount); });
      affected += ks.length;
    }
  } else if (singleMatch) {
    const n = parseInt(singleMatch[1]);
    function adjContacts(contacts) {
      return Object.keys(contacts).filter(k => k.match(/\d+/g).map(Number).includes(n));
    }
    if (applyUpper) {
      const ks = adjContacts(upperContacts);
      ks.forEach(k => { upperChanges[k] = String(amount); });
      affected += ks.length;
    }
    if (applyLower) {
      const ks = adjContacts(lowerContacts);
      ks.forEach(k => { lowerChanges[k] = String(amount); });
      affected += ks.length;
    }
  } else {
    // No range — apply to all contacts on specified arch(es)
    if (applyUpper) {
      Object.keys(upperContacts).forEach(k => { upperChanges[k] = String(amount); });
      affected += Object.keys(upperContacts).length;
    }
    if (applyLower) {
      Object.keys(lowerContacts).forEach(k => { lowerChanges[k] = String(amount); });
      affected += Object.keys(lowerContacts).length;
    }
  }

  if (affected === 0) return { error: "No matching contacts found — check tooth numbers (1–7)" };
  const archLabel = applyUpper && applyLower ? "upper & lower" : applyUpper ? "upper" : "lower";
  return {
    upperChanges,
    lowerChanges,
    message: `Set ${amount} mm at ${affected} contact${affected > 1 ? "s" : ""} (${archLabel})`
  };
}

// ─── Helpers for IPR colour thresholds (module-level so no closure issues) ────
function iprIsAnterior(key) {
  const nums = key.match(/\d+/g).map(Number);
  return Math.max(...nums) <= 3;
}
function iprBarColor(key, val) {
  if (!val || val <= 0) return "#e2e8f0";
  if (iprIsAnterior(key)) {
    if (val <= 0.5) return "#22c55e";
    if (val <= 0.8) return "#f97316";
    return "#ef4444";
  } else {
    if (val <= 0.8) return "#22c55e";
    if (val <= 1.0) return "#f97316";
    return "#ef4444";
  }
}
function iprContactLabel(key) {
  return key.split("|").map(t => t.replace(/[A-Z]/g, "")).join("-");
}

// ─── Cumulative IPR chart (modal) ─────────────────────────────────────────────
// Bars per contact across all visits, coloured against the safe-limit thresholds
// (anterior 0.5 / 0.8 mm, posterior 0.8 / 1.0 mm — see iprBarColor).
const CUM_LEVEL = { "#22c55e": "#2f9e6e", "#f97316": "#e08a1e", "#ef4444": "#d64545" };
function CumulativeChart({ cumUpper, cumLower, visitCount, onClose }) {
  const allVals = [...Object.values(cumUpper), ...Object.values(cumLower)].map(v => parseFloat(v) || 0);
  const maxVal = Math.max(...allVals, 0.5);

  const SVG_W = Object.keys(cumUpper).length * (BAR_W + GAP) - GAP + PAD * 2;

    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);
  const scale = v => v / maxVal * (CHART_H - TOP);
  const renderArch = (contacts, label) => {
    const keys = Object.keys(contacts);
    const total = sumContacts(contacts);
    const bars = keys.map((key, i) => {
      const val = parseFloat(contacts[key]) || 0;

    : `${ckLabel(k, dash)} ${mm1(v)}mm`).join(", ");
}
function joinAnd(arr) {
  if (arr.length <= 1) return arr.join("");
  if (arr.length === 2) return arr.join(" and ");
  return arr.slice(0, -1).join(", ") + ", and " + arr[arr.length - 1];
}
function buildChartNote(o) {
  const uIPR = noteRowsOf(o.upper), lIPR = noteRowsOf(o.lower);
  const uSp = noteRowsOf(o.upperSpaces), lSp = noteRowsOf(o.lowerSpaces);
  const uBT = noteBTsOf(o.upperBT), lBT = noteBTsOf(o.lowerBT);
  const uIPRt = sumContacts(o.upper), lIPRt = sumContacts(o.lower);
  const uSpt = sumContacts(o.upperSpaces), lSpt = sumContacts(o.lowerSpaces);
  const hasIPR = uIPR.length > 0 || lIPR.length > 0;
  const hasSp = uSp.length > 0 || lSp.length > 0;
  const hasBT = uBT.length > 0 || lBT.length > 0;
  // Cumulative only means something once there is more than one visit on file.
  const showCum = !!(o.incCum && o.cumUpper && o.visitCount > 1);
  const cUt = o.cumUpper ? sumContacts(o.cumUpper) : 0;
  const cLt = o.cumLower ? sumContacts(o.cumLower) : 0;

  if (o.format === "narrative") {
    const parts = [];
    if (o.incIPR) {
      if (hasIPR) {
        const seg = [];
        if (uIPR.length) seg.push(`upper ${listRows(uIPR)} (${mm1(uIPRt)}mm)`);
        if (lIPR.length) seg.push(`lower ${listRows(lIPR)} (${mm1(lIPRt)}mm)`);
        parts.push(`IPR completed this visit: ${seg.join("; ")}; total ${mm1(uIPRt + lIPRt)}mm.`);
      } else {
        parts.push("No IPR performed this visit.");
      }
    }
    if (hasSp) {
      const seg = [];
      if (uSp.length) seg.push(`upper ${listRows(uSp)} (${mm1(uSpt)}mm)`);
      if (lSp.length) seg.push(`lower ${listRows(lSp)} (${mm1(lSpt)}mm)`);
      parts.push(`Residual spacing: ${seg.join("; ")}; total ${mm1(uSpt + lSpt)}mm.`);
    } else {
      parts.push("No residual spacing noted.");
    }
    parts.push(hasBT
      ? `Black triangle${uBT.length + lBT.length > 1 ? "s" : ""} present at ${joinAnd(uBT.concat(lBT).map(k => ckLabel(k)))}.`
      : "No black triangles noted.");
    if (showCum) parts.push(`Cumulative IPR to date (${o.visitCount} visits): upper ${mm1(cUt)}mm, lower ${mm1(cLt)}mm, total ${mm1(cUt + cLt)}mm.`);
    return parts.join(" ");
  }

  if (o.format === "lines") {
    const blocks = [];
    if (o.incIPR) {
      const s = ["IPR THIS VISIT"];
      if (hasIPR) {
        if (uIPR.length) s.push(`Upper: ${listRows(uIPR)} (${mm1(uIPRt)}mm)`);
        if (lIPR.length) s.push(`Lower: ${listRows(lIPR)} (${mm1(lIPRt)}mm)`);
        s.push(`Total: ${mm1(uIPRt + lIPRt)}mm`);
      } else s.push("None this visit");
      blocks.push(s.join("\n"));
    }
    const sp = ["SPACING"];
    if (hasSp) {
      if (uSp.length) sp.push(`Upper: ${listRows(uSp)} (${mm1(uSpt)}mm)`);
      if (lSp.length) sp.push(`Lower: ${listRows(lSp)} (${mm1(lSpt)}mm)`);
      sp.push(`Total: ${mm1(uSpt + lSpt)}mm`);
    } else sp.push("None noted");
    blocks.push(sp.join("\n"));
    const bt = ["BLACK TRIANGLES"];
    if (hasBT) {
      if (uBT.length) bt.push(`Upper: ${uBT.map(k => ckLabel(k)).join(", ")}`);
      if (lBT.length) bt.push(`Lower: ${lBT.map(k => ckLabel(k)).join(", ")}`);
      bt.push(`Total: ${uBT.length + lBT.length}`);
    } else bt.push("None noted");
    blocks.push(bt.join("\n"));
    if (showCum) blocks.push(`CUMULATIVE IPR (${o.visitCount} visits)\nUpper: ${mm1(cUt)}mm   Lower: ${mm1(cLt)}mm   Total: ${mm1(cUt + cLt)}mm`);
    return blocks.join("\n\n");
  }

  // compact
  const c = [];
  if (o.incIPR) {
    if (hasIPR) {
      const seg = [];
      if (uIPR.length) seg.push(`U: ${listRows(uIPR, "-", true)}`);
      if (lIPR.length) seg.push(`L: ${listRows(lIPR, "-", true)}`);
      c.push(`IPR ${seg.join(" | ")} | Tot ${mm1(uIPRt + lIPRt)}mm`);
    } else c.push("IPR: none");
  }
  if (hasSp) {
    const seg = [];
    if (uSp.length) seg.push(`U: ${listRows(uSp, "-", true)}`);
    if (lSp.length) seg.push(`L: ${listRows(lSp, "-", true)}`);
    c.push(`Sp ${seg.join(" | ")} | Tot ${mm1(uSpt + lSpt)}mm`);
  } else c.push("Sp: none");
  c.push(hasBT ? `BT: ${uBT.concat(lBT).map(k => ckLabel(k, "-")).join(", ")}` : "BT: none");
  if (showCum) c.push(`Cum IPR ${o.visitCount}v: U ${mm1(cUt)} / L ${mm1(cLt)} / T ${mm1(cUt + cLt)}mm`);
  return c.join("\n");
}
// UI preference (not patient data) — localStorage so it survives across sessions
function prefLoad(key, fallback) {

    const v = localStorage.getItem(key);
    return v === null ? fallback : JSON.parse(v);
  } catch (e) { return fallback; }
}
function prefSave(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}

  const toggleMissing = tooth => {

        const isU = tooth[0] === "U";
        const arr = isU ? UPPER : LOWER;
        const i = arr.indexOf(tooth);
        const ck = Object.keys(initContacts(arr));
        const affected = [ck[i - 1], ck[i]].filter(Boolean);
        const clearVals = obj => { const o = { ...obj }; affected.forEach(k => { if (k in o) o[k] = ""; }); return o; };
        const clearBools = obj => { const o = { ...obj }; affected.forEach(k => { if (k in o) o[k] = false; }); return o; };
        if (isU) { setUpper(clearVals); setUpperSpaces(clearVals); setUpperBT(clearBools); setPrescribedUpper(clearVals); }
        else { setLower(clearVals); setLowerSpaces(clearVals); setLowerBT(clearBools); setPrescribedLower(clearVals); }

    (async () => {

      const hit = res.filter(r => norm(r.patient_id) === norm(chart));

  // Patient search
  const handleSearch = async () => {

      const qNoDash = q.replace(/-/g, "");

  const handleSaveToRecord = async (opts = {}) => {
