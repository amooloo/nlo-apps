<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank Deposit Slip</title>
<style>
  :root{
    --ground:#eceef2;
    --surface:#ffffff;
    --surface-2:#f7f8fa;
    --ink:#111722;
    --ink-2:#4b5563;
    --muted:#8b93a1;
    --line:#e3e6ec;
    --line-2:#eef0f4;
    --accent:#14396f;
    --accent-hi:#0d2a57;
    --accent-soft:#e9eff9;
    --danger:#c8102e;
    --ok:#15803d;
    --ok-soft:#e8f5ee;
    --warn:#a34a05;
    --warn-soft:#fdf1e3;
    --radius:10px;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ground:#0d1015;
      --surface:#171b22;
      --surface-2:#1e232c;
      --ink:#e7eaf0;
      --ink-2:#b3bac6;
      --muted:#7d8695;
      --line:#272d38;
      --line-2:#20252e;
      --accent:#4d82d8;
      --accent-hi:#5f91e4;
      --accent-soft:#182437;
      --danger:#e2566d;
      --ok:#54c98c;
      --ok-soft:#14291f;
      --warn:#d99a4e;
      --warn-soft:#2a2115;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--ground);color:var(--ink);
    font-size:15px;line-height:1.45;padding:24px 16px 32px;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .wrap{max-width:520px;margin:0 auto}
  .card{
    background:var(--surface);border:1px solid var(--line);
    border-radius:14px;box-shadow:var(--shadow);overflow:hidden;
  }

  header{
    padding:18px 20px 16px;border-bottom:1px solid var(--line);
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  }
  header h1{font-size:19px;font-weight:650;letter-spacing:-.01em}
  header .bank{font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
  header .bank::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--danger);display:inline-block}

  .body{padding:18px 20px 12px}

  .sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 8px}
  .body > .sec:not(:first-child){margin-top:28px}
  .sec h2{font-size:11px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .sec .tally{font-size:14px;font-weight:600;color:var(--ink)}
  .sec .tally.zero{color:var(--muted);font-weight:500}
  .pill{
    display:inline-block;margin-left:6px;padding:1px 6px;border-radius:20px;
    background:var(--surface-2);border:1px solid var(--line);
    font-size:10.5px;font-weight:600;color:var(--ink-2);letter-spacing:0;vertical-align:1px;
  }

  .ledger{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .row{
    display:grid;grid-template-columns:52px 72px 1fr;align-items:center;gap:12px;
    padding:5px 12px;border-bottom:1px solid var(--line-2);
  }
  .row:last-child{border-bottom:none}
  .row.coin{background:var(--surface-2);border-top:1px solid var(--line)}
  .row .denom{
    font-size:13.5px;font-weight:600;color:var(--muted);
    text-align:right;letter-spacing:-.01em;transition:color .15s;
  }
  .row.filled .denom{color:var(--ink)}

  input[type=number]{
    width:100%;font:inherit;font-size:14px;font-variant-numeric:tabular-nums;
    padding:6px 8px;text-align:center;color:var(--ink);background:var(--surface);
    border:1px solid var(--line);border-radius:7px;
    transition:border-color .15s, box-shadow .15s, background .15s;
    -moz-appearance:textfield;
  }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]::placeholder{color:var(--muted);opacity:.65}
  input[type=number]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .row:not(.filled) input{background:var(--surface-2);border-color:var(--line-2)}
  .row:not(.filled) input:focus{background:var(--surface);border-color:var(--accent)}
  .row.coin:not(.filled) input{background:var(--surface)}

  .row .ext{text-align:right;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
  .row .ext.none{color:var(--muted);font-weight:400;opacity:.5}

  .addbar{display:flex;gap:8px;margin-bottom:10px}
  .addbar input{flex:1;text-align:left;padding:9px 12px;font-size:15px}
  .btn{
    appearance:none;font:inherit;cursor:pointer;border:1px solid transparent;border-radius:8px;
    font-weight:600;font-size:14px;
    transition:background .15s,border-color .15s,color .15s,transform .08s;
  }
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--accent);color:#fff;padding:9px 18px}
  .btn-primary:hover{background:var(--accent-hi)}
  .btn-ghost{background:var(--surface);color:var(--ink-2);border-color:var(--line);padding:9px 14px}
  .btn-ghost:hover{background:var(--surface-2);color:var(--ink)}

  .checks{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .chk{
    display:grid;grid-template-columns:26px 1fr auto 28px;align-items:center;gap:10px;
    padding:8px 10px 8px 12px;border-bottom:1px solid var(--line-2);
  }
  .chk:last-child{border-bottom:none}
  .chk .i{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .chk .amt{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;text-align:right}
  .chk .from{
    appearance:none;border:none;background:none;font:inherit;font-size:13.5px;color:var(--ink-2);
    text-align:left;cursor:pointer;padding:2px 0;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .chk .from.none{color:var(--muted);opacity:.6}

  .btn-cam{display:inline-flex;align-items:center;justify-content:center;padding:9px 12px}
  .btn-cam svg{width:19px;height:19px}

  /* ---------- scan sheet ---------- */
  .scan{
    position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;
    background:rgba(10,14,20,.45);padding:12px;
  }
  .scan.open{display:flex}
  @media (min-width:600px){.scan{align-items:center}}
  .sheet{
    width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);
    border-radius:16px;box-shadow:var(--shadow);padding:16px;max-height:92vh;overflow:auto;
  }
  .sheet .sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .sheet h3{font-size:16px;font-weight:650}
  .sheet .close{
    appearance:none;border:none;background:none;cursor:pointer;color:var(--muted);
    font-size:22px;line-height:1;padding:2px 6px;border-radius:6px;
  }
  .sheet img{
    display:block;width:100%;max-height:170px;object-fit:contain;border-radius:8px;
    background:var(--surface-2);border:1px solid var(--line);
  }
  .scan-status{font-size:13px;color:var(--ink-2);margin:10px 0 4px;min-height:19px}
  .scan-status.warn{color:var(--warn)}
  .bar{height:4px;border-radius:4px;background:var(--line-2);overflow:hidden;margin-bottom:6px}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .field{display:block;margin-top:10px}
  .field span{display:block;font-size:11px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .field input{
    width:100%;font:inherit;font-size:16px;padding:9px 12px;text-align:left;color:var(--ink);
    background:var(--surface);border:1px solid var(--line);border-radius:8px;
  }
  .field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .field input.verify{border-color:var(--warn);background:var(--warn-soft)}
  .sheet .actions{margin-top:14px}
  .sheet .privacy{font-size:11px;color:var(--muted);margin-top:10px;text-align:center}
  .chk .x{
    appearance:none;border:none;background:none;cursor:pointer;color:var(--muted);
    font-size:17px;line-height:1;padding:3px 6px;border-radius:6px;
    transition:color .15s,background .15s;
  }
  .chk .x:hover{color:var(--danger);background:var(--surface-2)}

  .empty{
    padding:16px 12px;text-align:center;color:var(--muted);font-size:13px;
    border:1px dashed var(--line);border-radius:var(--radius);
  }

  .ds{display:flex;gap:8px;align-items:center}
  .ds input{flex:1;text-align:left;padding:9px 12px;font-size:15px}
  .ds .verdict{
    flex:0 0 auto;min-width:118px;text-align:right;
    font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;
    padding:8px 11px;border-radius:8px;border:1px solid var(--line);
    color:var(--muted);background:var(--surface-2);
  }
  .ds .verdict.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
  .ds .verdict.off{color:var(--warn);background:var(--warn-soft);border-color:transparent}
  .hint{font-size:11.5px;color:var(--muted);margin-top:7px}

  .total{
    position:sticky;bottom:0;z-index:5;margin:24px -20px 0;padding:12px 20px 14px;
    background:var(--surface);border-top:1px solid var(--line);
  }
  .total .line{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
  .total .label{font-size:11px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .total .amt{font-size:26px;font-weight:680;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
  .total .amt.zero{color:var(--muted);font-weight:500}
  .actions{display:flex;gap:8px}
  .actions .btn-primary{flex:1}

  .toast{
    margin-top:10px;padding:9px 12px;border-radius:8px;font-size:13px;text-align:center;
    background:var(--accent-soft);color:var(--accent);border:1px solid var(--line);
  }

  /* ---------- print ---------- */
  #slip{display:none}
  @media print{
    body{background:#fff;color:#000;padding:0}
    .wrap,.scan{display:none!important}
    #slip{
      display:block!important;padding:.45in;max-width:7.5in;
      font-family:-apple-system,"Segoe UI",Arial,sans-serif;color:#000;
    }
    #slip h2{font-size:17px;font-weight:700;padding-bottom:6px;border-bottom:2px solid #000}
    #slip .meta{display:flex;justify-content:space-between;font-size:11px;margin:6px 0 16px}
    #slip h3{
      font-size:10px;text-transform:uppercase;letter-spacing:.08em;
      margin:16px 0 5px;padding-bottom:3px;border-bottom:1px solid #888;
    }
    #slip table{width:100%;border-collapse:collapse;font-size:11.5px}
    #slip th{
      text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.06em;
      padding:4px 6px;border-bottom:1px solid #000;
    }
    #slip td{padding:4px 6px;border-bottom:1px solid #e0e0e0}
    #slip .r{text-align:right;font-variant-numeric:tabular-nums}
    #slip tr.sub td{font-weight:700;border-top:1px solid #000;border-bottom:none}
    #slip .grand{
      margin-top:16px;padding:9px 12px;border:2px solid #000;
      display:flex;justify-content:space-between;font-size:15px;font-weight:700;
    }
    #slip .recon{margin-top:10px;font-size:11px}
    #slip .recon div{display:flex;justify-content:space-between;padding:2px 12px}
    #slip .sig{display:flex;gap:34px;margin-top:44px;font-size:9.5px}
    #slip .sig div{flex:1;border-top:1px solid #000;padding-top:4px}
  }
</style>
<style id="nlo-aisa-room">
/* Ask AISA (nlo-aisa.js) sits in the bottom-right corner: on narrow screens the pinned total leaves it that corner, so the total and Print stay clear. */
@media screen and (max-width:680px){html.nlo-aisa-on .total{padding-right:var(--nlo-aisa-space)}}
</style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <header>
      <h1>Deposit Slip</h1>
      <span class="bank">Bank of America</span>
    </header>

    <div class="body">
      <div class="sec">
        <h2>Cash</h2>
        <span class="tally zero num" id="cashTally">$0.00</span>
      </div>

      <div class="ledger" id="ledger">
        <div class="row" data-den="100"><span class="denom">$100</span><input type="number" id="bill100" min="0" step="1" placeholder="0" inputmode="numeric"><span class="ext none num">—</span></div>
        <div class="row" data-den="50"><span class="denom">$50</span><input type="number" id="bill50" min="0" step="1" placeholder="0" inputmode="numeric"><span class="ext none num">—</span></div>
        <div class="row" data-den="20"><span class="denom">$20</span><input type="number" id="bill20" min="0" step="1" placeholder="0" inputmode="numeric"><span class="ext none num">—</span></div>
        <div class="row" data-den="10"><span class="denom">$10</span><input type="number" id="bill10" min="0" step="1" placeholder="0" inputmode="numeric"><span class="ext none num">—</span></div>
        <div class="row" data-den="5"><span class="denom">$5</span><input type="number" id="bill5" min="0" step="1" placeholder="0" inputmode="numeric"><span class="ext none num">—</span></div>
        <div class="row" data-den="1"><span class="denom">$1</span><input type="number" id="bill1" min="0" step="1" placeholder="0" inputmode="numeric"><span class="ext none num">—</span></div>
        <div class="row coin" data-den="coin"><span class="denom">Coin</span><input type="number" id="coins" min="0" step="0.01" placeholder="0.00" inputmode="decimal"><span class="ext none num">—</span></div>
      </div>

      <div class="sec">
        <h2>Checks<span class="pill" id="chkCount">0</span></h2>
        <span class="tally zero num" id="chkTally">$0.00</span>
      </div>

      <div class="addbar">
        <input type="number" id="checkInput" step="0.01" min="0" placeholder="Check amount" inputmode="decimal">
        <button class="btn btn-ghost btn-cam" onclick="startScan()" title="Scan a check with the camera" aria-label="Scan check">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7.5 6.5H4a1 1 0 0 0-1 1V19a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V7.5a1 1 0 0 0-1-1h-3.5z"/><circle cx="12" cy="13" r="3.5"/></svg>
        </button>
        <button class="btn btn-primary" onclick="addCheck()">Add</button>
      </div>
      <input type="file" id="camInput" accept="image/*" capture="environment" hidden>

      <div id="checkList"></div>

      <div class="sec">
        <h2>Day sheet</h2>
      </div>
      <div class="ds">
        <input type="number" id="daySheet" step="0.01" min="0" placeholder="Collected per day sheet" inputmode="decimal">
        <span class="verdict num" id="verdict">—</span>
      </div>
      <div class="hint">Optional — checks your count against what the software says you collected.</div>

      <div class="total">
        <div class="line">
          <span class="label">Total deposit</span>
          <span class="amt zero num" id="grand">$0.00</span>
        </div>
        <div class="actions">
          <button class="btn btn-ghost" onclick="clearAll()">Clear</button>
          <button class="btn btn-primary" onclick="printSlip()">Print deposit slip</button>
        </div>
        <div id="toast"></div>
      </div>
    </div>
  </div>
</div>

<div class="scan" id="scan" role="dialog" aria-modal="true" aria-labelledby="scanTitle">
  <div class="sheet">
    <div class="sh-head"><h3 id="scanTitle">Scanned check</h3><button class="close" onclick="closeScan()" aria-label="Close">&times;</button></div>
    <img id="scanImg" alt="Check photo">
    <div class="scan-status" id="scanStatus"></div>
    <div class="bar"><i id="scanBar"></i></div>
    <label class="field"><span>Amount</span><input type="number" id="scanAmt" step="0.01" min="0" inputmode="decimal" placeholder="0.00"></label>
    <label class="field"><span>From</span><input type="text" id="scanFrom" autocomplete="off" placeholder="e.g. Delta Dental"></label>
    <div class="actions">
      <button class="btn btn-ghost" onclick="retakeScan()">Retake</button>
      <button class="btn btn-ghost" onclick="acceptScan(true)">Add + next</button>
      <button class="btn btn-primary" onclick="acceptScan(false)">Add</button>
    </div>
    <div class="privacy">Read on this device. The photo isn't uploaded or saved.</div>
  </div>
</div>

<div id="slip"></div>

<script>
(function(){
  "use strict";

  var DENOMS = [100,50,20,10,5,1];
  var checks = [];
  var $ = function(id){ return document.getElementById(id); };

  function money(n){
    n = Number(n) || 0;
    return '$' + n.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function countOf(den){
    var v = parseInt($('bill'+den).value, 10);
    return (isNaN(v) || v < 0) ? 0 : v;
  }
  function coinOf(){
    var v = parseFloat($('coins').value);
    return (isNaN(v) || v < 0) ? 0 : v;
  }
  function cashTotal(){
    var t = 0;
    DENOMS.forEach(function(d){ t += countOf(d) * d; });
    return Math.round((t + coinOf()) * 100) / 100;
  }
  function checksTotal(){
    return Math.round(checks.reduce(function(s,c){ return s + c.amt; }, 0) * 100) / 100;
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(ch){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
    });
  }
  function daySheet(){
    var raw = $('daySheet').value;
    if(raw === '') return null;
    var v = parseFloat(raw);
    return (isNaN(v) || v < 0) ? null : v;
  }
  function variance(){
    var ds = daySheet();
    if(ds === null) return null;
    return Math.round((cashTotal() + checksTotal() - ds) * 100) / 100;
  }

  function paint(){
    Array.prototype.forEach.call(document.querySelectorAll('#ledger .row'), function(row){
      var den = row.getAttribute('data-den');
      var val = den === 'coin' ? coinOf() : countOf(den) * Number(den);
      var ext = row.querySelector('.ext');
      row.classList.toggle('filled', val > 0);
      ext.classList.toggle('none', val === 0);
      ext.textContent = val > 0 ? money(val) : '—';
    });

    var c = cashTotal(), k = checksTotal(), g = Math.round((c + k) * 100) / 100;
    var ct = $('cashTally'), kt = $('chkTally'), gr = $('grand');
    ct.textContent = money(c); ct.classList.toggle('zero', c === 0);
    kt.textContent = money(k); kt.classList.toggle('zero', k === 0);
    gr.textContent = money(g); gr.classList.toggle('zero', g === 0);
    $('chkCount').textContent = checks.length;

    var v = variance(), el = $('verdict');
    el.classList.remove('ok','off');
    if(v === null){ el.textContent = '—'; }
    else if(v === 0){ el.textContent = 'Balanced'; el.classList.add('ok'); }
    else {
      el.textContent = (v > 0 ? 'Over ' : 'Short ') + money(Math.abs(v));
      el.classList.add('off');
    }
  }

  function renderChecks(){
    var el = $('checkList');
    if(!checks.length){ el.innerHTML = '<div class="empty">No checks entered</div>'; return; }
    var html = '<div class="checks">';
    checks.forEach(function(c, i){
      html += '<div class="chk"><span class="i num">' + (i+1) + '</span>' +
              '<button class="from' + (c.from ? '' : ' none') + '" data-e="' + i + '" title="Tap to edit who it\'s from">' +
                (c.from ? esc(c.from) : 'From?') + '</button>' +
              '<span class="amt num">' + money(c.amt) + '</span>' +
              '<button class="x" title="Remove" data-i="' + i + '">&times;</button></div>';
    });
    el.innerHTML = html + '</div>';
  }

  function pushCheck(amt, from){
    checks.push({ amt: Math.round(amt * 100) / 100, from: (from || '').trim() });
    renderChecks(); paint();
  }

  window.addCheck = function(){
    var input = $('checkInput');
    var amt = parseFloat(input.value);
    if(isNaN(amt) || amt <= 0){ input.focus(); return; }
    input.value = '';
    pushCheck(amt, '');
    input.focus();
  };

  window.clearAll = function(){
    DENOMS.forEach(function(d){ $('bill'+d).value = ''; });
    $('coins').value = '';
    $('checkInput').value = '';
    $('daySheet').value = '';
    checks = [];
    renderChecks(); paint();
    $('toast').innerHTML = '';
    $('bill100').focus();
  };

  function toast(msg){
    $('toast').innerHTML = '<div class="toast">' + msg + '</div>';
    setTimeout(function(){ $('toast').innerHTML = ''; }, 3000);
  }

  window.printSlip = function(){
    var c = cashTotal(), k = checksTotal(), g = Math.round((c + k) * 100) / 100;
    if(g === 0){ toast('Enter cash or checks first'); return; }

    var bills = [];
    DENOMS.forEach(function(d){
      if(countOf(d) > 0) bills.push({denom:d, count:countOf(d), value:countOf(d)*d});
    });

    var billRows = bills.length
      ? bills.map(function(b){
          return '<tr><td>$' + b.denom + ' bills</td><td class="r">' + b.count +
                 '</td><td class="r">' + money(b.value) + '</td></tr>';
        }).join('')
      : '<tr><td colspan="3" style="color:#777">No bills</td></tr>';
    var coinRow = coinOf() > 0
      ? '<tr><td>Coin</td><td class="r">&mdash;</td><td class="r">' + money(coinOf()) + '</td></tr>' : '';
    var checkRows = checks.length
      ? checks.map(function(x,i){
          return '<tr><td>Check ' + (i+1) + '</td><td>' + esc(x.from || '—') + '</td><td class="r">' + money(x.amt) + '</td></tr>';
        }).join('')
      : '<tr><td colspan="3" style="color:#777">No checks</td></tr>';

    /* By-payer subtotals, only when at least one check has a payer */
    var byPayer = '';
    if(checks.some(function(x){ return x.from; })){
      var groups = {}, order = [];
      checks.forEach(function(x){
        var key = x.from || 'Not specified';
        if(!groups[key]){ groups[key] = {n:0, t:0}; order.push(key); }
        groups[key].n++; groups[key].t += x.amt;
      });
      order.sort(function(a,b){ return groups[b].t - groups[a].t; });
      byPayer = '<h3>Checks by payer</h3>' +
        '<table><thead><tr><th>From</th><th class="r">Checks</th><th class="r">Amount</th></tr></thead><tbody>' +
        order.map(function(k){
          return '<tr><td>' + esc(k) + '</td><td class="r">' + groups[k].n + '</td><td class="r">' +
                 money(Math.round(groups[k].t * 100) / 100) + '</td></tr>';
        }).join('') + '</tbody></table>';
    }

    var ds = daySheet(), v = variance();
    var recon = ds === null ? '' :
      '<div class="recon">' +
        '<div><span>Day sheet collected</span><span>' + money(ds) + '</span></div>' +
        '<div><span>Variance</span><span>' +
          (v === 0 ? 'Balanced' : (v > 0 ? 'Over ' : 'Short ') + money(Math.abs(v))) +
        '</span></div>' +
      '</div>';

    $('slip').innerHTML =
      '<h2>Deposit Slip</h2>' +
      '<div class="meta"><span>Bank of America</span><span>' +
        new Date().toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}) +
      '</span></div>' +
      '<h3>Cash by denomination</h3>' +
      '<table><thead><tr><th>Denomination</th><th class="r">Count</th><th class="r">Amount</th></tr></thead>' +
      '<tbody>' + billRows + coinRow +
      '<tr class="sub"><td>Cash subtotal</td><td></td><td class="r">' + money(c) + '</td></tr>' +
      '</tbody></table>' +
      '<h3>Checks (' + checks.length + ')</h3>' +
      '<table><thead><tr><th>Item</th><th>From</th><th class="r">Amount</th></tr></thead><tbody>' + checkRows +
      '<tr class="sub"><td>Checks subtotal</td><td></td><td class="r">' + money(k) + '</td></tr>' +
      '</tbody></table>' + byPayer +
      '<div class="grand"><span>TOTAL DEPOSIT</span><span>' + money(g) + '</span></div>' +
      recon +
      '<div class="sig"><div>Prepared by</div><div>Verified by</div><div>Bank receipt #</div></div>';

    window.print();
  };

  /* wiring: Enter walks down the denominations, then coin, then the check field */
  var chain = DENOMS.map(function(d){ return 'bill'+d; }).concat(['coins','checkInput']);
  chain.forEach(function(id, i){
    var el = $(id);
    el.addEventListener('input', paint);
    el.addEventListener('keydown', function(e){
      if(e.key !== 'Enter') return;
      e.preventDefault();
      if(id === 'checkInput'){ window.addCheck(); return; }
      $(chain[i+1]).focus();
      $(chain[i+1]).select();
    });
  });
  $('daySheet').addEventListener('input', paint);

  $('checkList').addEventListener('click', function(e){
    var f = e.target.closest('.from');
    if(f){
      var c = checks[Number(f.getAttribute('data-e'))];
      var v = window.prompt('Who is this check from?', c.from || '');
      if(v !== null){ c.from = v.trim(); renderChecks(); }
      return;
    }
    var b = e.target.closest('.x');
    if(!b) return;
    checks.splice(Number(b.getAttribute('data-i')), 1);
    renderChecks(); paint();
  });

  /* ================= Check scanning (on-device OCR) =================
     Tesseract.js runs in the browser (WebAssembly). Only the library and
     its English language file are downloaded; the photo itself never
     leaves the device and is discarded when the sheet closes. We keep
     only two things from the check: the amount and the payer name. */

  var TESS_SRC = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
  var workerP = null, scanUrl = null, scanSeq = 0;

  var PAYERS = [
    [/delta\s*dent/i,'Delta Dental'],
    [/met\s*life/i,'MetLife'],
    [/cigna/i,'Cigna'],
    [/aetna/i,'Aetna'],
    [/guardian/i,'Guardian'],
    [/united\s*concordia/i,'United Concordia'],
    [/united\s*health\s*care|\buhc\b/i,'UnitedHealthcare'],
    [/humana/i,'Humana'],
    [/florida\s*blue/i,'Florida Blue'],
    [/blue\s*cross|\bbcbs\b|blue\s*shield/i,'Blue Cross Blue Shield'],
    [/anthem/i,'Anthem'],
    [/ameritas/i,'Ameritas'],
    [/principal\s*(life|financial)/i,'Principal'],
    [/sun\s*life/i,'Sun Life'],
    [/lincoln\s*(financial|national)/i,'Lincoln Financial'],
    [/\bgeha\b/i,'GEHA'],
    [/careington/i,'Careington'],
    [/denta\s*quest/i,'DentaQuest'],
    [/\bmcna\b/i,'MCNA Dental'],
    [/liberty\s*dental/i,'Liberty Dental'],
    [/assurant/i,'Assurant'],
    [/\bunum\b/i,'Unum'],
    [/physicians\s*mutual/i,'Physicians Mutual'],
    [/renaissance/i,'Renaissance Dental'],
    [/spirit\s*dental/i,'Spirit Dental'],
    [/dominion\s*(dental|national)/i,'Dominion Dental'],
    [/envolve/i,'Envolve Dental'],
    [/tricare/i,'TRICARE'],
    [/mutual\s*of\s*omaha/i,'Mutual of Omaha'],
    [/\bbeam\s*(dental|benefit)/i,'Beam Dental'],
    [/colonial\s*life/i,'Colonial Life'],
    [/\baflac\b/i,'Aflac'],
    [/standard\s*insurance/i,'The Standard'],
    /* payment agents some insurers pay through; listed last so a named insurer wins */
    [/echo\s*health/i,'ECHO Health'],
    [/\bzelis\b/i,'Zelis'],
    [/\bvpay\b/i,'VPay'],
    [/change\s*healthcare/i,'Change Healthcare'],
    [/instamed/i,'InstaMed']
  ];
  var NOT_PAYER = /next\s*level|akhavan|orthodont|\bpay\b|order\s*of|\bdate\b|\bvoid\b|dollars|\bmemo\b|check\s*(no|number|#)|amount|\bbank\b|\bn\.?\s?a\.?$|chase|wells\s*fargo|fifth\s*third|truist|citibank|pnc|u\.?s\.?\s*bank|jpmorgan|days|non.?negotiable|\bnw\b|gainesville|\bfl\b\s*\d|\d{5}/i;

  function findAmount(text){
    var t = text
      .replace(/\bS(?=[*\d])/g, '$')                    /* "S412.00" -> "$412.00" */
      .replace(/(\d)[oO](?=\d|\.)/g, '$10')             /* O misread as 0 inside numbers */
      .replace(/(\d),(\d{2})(?!\d)/g, '$1.$2')           /* "412,00" -> "412.00" */
      .replace(/([$*]\s*)(\d{1,3})[ .](\d{3}\.\d{2})(?!\d)/g, '$1$2,$3'); /* "***1 250.50" -> "***1,250.50" */
    var re = /([$*][$*\s]*)?(\d{1,3}(?:,\d{3})+|\d{1,6})\.(\d{2})(?![\d.\/])/g;
    var best = {}, m;
    while((m = re.exec(t))){
      var prev = t.charAt(m.index - 1);
      if(/[\d.\/]/.test(prev)) continue;               /* part of a date or longer number */
      var val = parseFloat(m[2].replace(/,/g,'') + '.' + m[3]);
      if(!(val > 0) || val > 250000) continue;
      var lineStart = t.lastIndexOf('\n', m.index) + 1;
      var line = t.slice(lineStart, t.indexOf('\n', m.index) === -1 ? t.length : t.indexOf('\n', m.index));
      var score = 0;
      if(m[1] && m[1].indexOf('$') > -1) score += 3;
      if(m[1] && m[1].indexOf('*') > -1) score += 4;    /* check-protector stars = printed check amount */
      if(/amount|pay\s*exactly|check\s*amt|net\s*pay|total/i.test(line)) score += 2;
      var key = val.toFixed(2);
      best[key] = (best[key] || 0) + score + 1;        /* repeats (face + stub) add weight */
    }
    var keys = Object.keys(best);
    if(!keys.length) return null;
    keys.sort(function(a,b){ return (best[b] - best[a]) || (parseFloat(b) - parseFloat(a)); });
    return { value: parseFloat(keys[0]), sure: best[keys[0]] >= 4 };
  }

  function findPayer(text){
    for(var i = 0; i < PAYERS.length; i++){
      if(PAYERS[i][1] && PAYERS[i][0].test(text)) return { name: PAYERS[i][1], sure: true };
    }
    /* Fallback: first name-like line above the "Pay to the order of" line */
    var lines = text.split('\n').map(function(s){
      /* drop "CHECK NO. …", "DATE …" etc. that print on the same line as the payer */
      return s.replace(/\s+(check|chk|date|void|no\.|#).*$/i, '').trim();
    });
    var stop = lines.length;
    for(var j = 0; j < lines.length; j++){ if(/order\s*of|^pay\b/i.test(lines[j])){ stop = j; break; } }
    for(var k = 0; k < stop; k++){
      if(((lines[k].match(/\d/g) || []).length) >= 3) continue;      /* address / numbers line */
      var s = lines[k].replace(/[^A-Za-z&.,' -]/g,' ').replace(/\s+/g,' ').trim();
      var letters = (s.match(/[A-Za-z]/g) || []).length;
      if(letters >= 5 && letters / s.length > .7 && !NOT_PAYER.test(s)){
        var nice = s.toLowerCase().replace(/\b[a-z]/g, function(ch){ return ch.toUpperCase(); })
                    .replace(/\b(Inc|Llc|Co|Corp)\b\.?/g, function(w){ return w.toUpperCase().replace('.',''); });
        return { name: nice.slice(0, 40), sure: false };
      }
    }
    return { name: '', sure: false };
  }

  function loadTesseract(){
    if(workerP) return workerP;
    workerP = new Promise(function(resolve, reject){
      if(window.Tesseract) return resolve();
      var s = document.createElement('script');
      s.src = TESS_SRC; s.onload = resolve;
      s.onerror = function(){ reject(new Error('Could not load the check reader. Check the internet connection.')); };
      document.head.appendChild(s);
    }).then(function(){
      return window.Tesseract.createWorker('eng', 1, {
        logger: function(m){
          if(m.status === 'recognizing text') setBar(m.progress);
          else if(/loading|initializ/.test(m.status)) setStatus('Getting the check reader ready (first time only)…');
        }
      });
    });
    workerP.catch(function(){ workerP = null; });
    return workerP;
  }

  function setStatus(msg, warn){
    var el = $('scanStatus'); el.textContent = msg; el.classList.toggle('warn', !!warn);
  }
  function setBar(p){ $('scanBar').style.width = Math.round((p || 0) * 100) + '%'; }

  /* Downscale + grayscale; optional 90° rotation for sideways shots */
  function prepCanvas(img, rot){
    var w = img.naturalWidth, h = img.naturalHeight;
    var scale = Math.min(1, 2000 / Math.max(w, h));
    w = Math.round(w * scale); h = Math.round(h * scale);
    var c = document.createElement('canvas');
    var side = rot % 180 !== 0;
    c.width = side ? h : w; c.height = side ? w : h;
    var x = c.getContext('2d');
    x.translate(c.width / 2, c.height / 2);
    x.rotate(rot * Math.PI / 180);
    x.drawImage(img, -w / 2, -h / 2, w, h);
    var d = x.getImageData(0, 0, c.width, c.height), p = d.data;
    for(var i = 0; i < p.length; i += 4){
      var g = p[i] * .299 + p[i+1] * .587 + p[i+2] * .114;
      g = Math.max(0, Math.min(255, (g - 128) * 1.35 + 128));   /* a little more contrast */
      p[i] = p[i+1] = p[i+2] = g;
    }
    x.putImageData(d, 0, 0);
    return c;
  }

  function readCheck(img, seq){
    var portrait = img.naturalHeight > img.naturalWidth * 1.15;
    var tries = portrait ? [0, 90, 270] : [0, 180];
    var bestRes = null;
    return loadTesseract().then(function(worker){
      var run = function(i){
        if(i >= tries.length || seq !== scanSeq) return bestRes;
        setStatus(i === 0 ? 'Reading check…' : 'Trying another angle…'); setBar(0);
        return worker.recognize(prepCanvas(img, tries[i])).then(function(r){
          var text = r.data.text || '';
          var res = { amt: findAmount(text), payer: findPayer(text), conf: r.data.confidence || 0 };
          var good = function(z){ return (z.amt ? 2 : 0) + (z.payer.sure ? 2 : z.payer.name ? 1 : 0) + z.conf / 100; };
          if(!bestRes || good(res) > good(bestRes)) bestRes = res;
          if(res.amt && res.payer.sure && res.conf > 55) return bestRes;   /* good enough, stop early */
          return run(i + 1);
        });
      };
      return run(0);
    });
  }

  function openSheet(){
    $('scan').classList.add('open');
    $('scanAmt').value = ''; $('scanFrom').value = '';
    $('scanAmt').classList.remove('verify'); $('scanFrom').classList.remove('verify');
    setBar(0);
  }

  window.startScan = function(){ $('camInput').value = ''; $('camInput').click(); };
  window.retakeScan = function(){ window.startScan(); };

  window.closeScan = function(){
    scanSeq++;                                   /* cancel any read in progress */
    $('scan').classList.remove('open');
    $('scanImg').removeAttribute('src');
    if(scanUrl){ URL.revokeObjectURL(scanUrl); scanUrl = null; }
    $('camInput').value = '';
  };

  window.acceptScan = function(next){
    var amt = parseFloat($('scanAmt').value);
    if(isNaN(amt) || amt <= 0){ $('scanAmt').focus(); $('scanAmt').classList.add('verify'); return; }
    var from = $('scanFrom').value.trim();
    pushCheck(amt, from);
    window.closeScan();
    toast('Added ' + money(amt) + (from ? ' from ' + esc(from) : ''));
    if(next) window.startScan();
  };

  $('camInput').addEventListener('change', function(){
    var file = this.files && this.files[0];
    if(!file) return;
    var seq = ++scanSeq;
    if(scanUrl) URL.revokeObjectURL(scanUrl);
    scanUrl = URL.createObjectURL(file);
    openSheet();
    var img = $('scanImg');
    img.onload = function(){
      readCheck(img, seq).then(function(r){
        if(seq !== scanSeq || !r) return;
        setBar(1);
        if(r.amt) $('scanAmt').value = r.amt.value.toFixed(2);
        $('scanFrom').value = r.payer.name;
        $('scanAmt').classList.toggle('verify', !r.amt || !r.amt.sure);
        $('scanFrom').classList.toggle('verify', !r.payer.sure);
        if(!r.amt && !r.payer.name) setStatus("Couldn't read this one. Retake closer, flat and well lit, or type it in.", true);
        else if(!r.amt || !r.amt.sure || !r.payer.sure) setStatus('Check the highlighted field before adding.', true);
        else setStatus('Read it. Confirm and add.');
        if(!r.amt) $('scanAmt').focus();
      }).catch(function(err){
        if(seq !== scanSeq) return;
        setStatus(err && err.message ? err.message : 'Something went wrong reading the check. Type it in instead.', true);
      });
    };
    img.onerror = function(){ setStatus("That photo couldn't be opened. Try again.", true); };
    img.src = scanUrl;
  });

  $('scanAmt').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); $('scanFrom').focus(); }
  });
  $('scanFrom').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); window.acceptScan(false); }
  });
  $('scanAmt').addEventListener('input', function(){ this.classList.remove('verify'); });
  $('scanFrom').addEventListener('input', function(){ this.classList.remove('verify'); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && $('scan').classList.contains('open')) window.closeScan();
  });

  /* exposed for testing the parsers */
  window.__depositParse = { findAmount: findAmount, findPayer: findPayer };

  renderChecks();
  paint();
  $('bill100').focus();
})();
</script>
<script src="nlo-home.js" defer></script>
<script src="nlo-aisa.js" defer></script>
</body>
</html>
