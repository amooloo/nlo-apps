<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-//M5C+jQDJB44XmtpQ9z7mIBqJoTjvbXXek8BFBZrG0=' https://www.gstatic.com/firebasejs/10.12.2/ https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://www.google.com/images/cleardot.gif; connect-src 'self' https://*.googleapis.com https://*.workers.dev https://nlo-inventory-default-rtdb.firebaseio.com http://127.0.0.1:8080 http://127.0.0.1:9099; frame-src https://nlo-cases.firebaseapp.com; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="theme-color" content="#1B2F4C">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NLO Time Clock</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* NLO brand palette — same values as Staff Hub / Onboarding */
  --navy-900:#11203A; --navy:#1B2F4C; --navy-700:#294169; --navy-600:#385686; --navy-500:#5471A0; --navy-100:#E8ECF2;
  --blue-800:#122874; --blue-700:#16318C; --blue:#1D3EA9; --blue-500:#2E52C9; --blue-200:#BCC8EE; --blue-100:#E5EAF8;
  --coral-700:#D8412E; --coral-600:#EE4F3A; --coral:#FA624D; --coral-200:#FFC8BF; --coral-100:#FFE7E1;
  --mint-700:#1F9E7E; --mint-600:#34C49E; --mint:#64F4C9; --mint-200:#C0FBEC; --mint-100:#E2FBF4;
  --amber-700:#C2820A; --amber-600:#E29A14; --amber:#F6AF24; --amber-200:#FCE2A6; --amber-100:#FEF2D7;
  --grey-50:#F7F8F9; --grey-100:#ECEEF0; --grey-200:#DCE0E4; --grey-300:#C3C9D0; --grey-400:#969FAB; --grey-500:#6B7685; --grey-600:#4C5868; --grey-700:#33404F;
  --off:#F2F3F4; --card:#FFFFFF;
  --fd:'Oswald',system-ui,sans-serif;
  --fb:'Montserrat',system-ui,-apple-system,sans-serif;
  --sh-xs:0 1px 2px rgba(17,32,58,.07); --sh-sm:0 2px 6px rgba(17,32,58,.08);
  --sh-md:0 8px 24px rgba(17,32,58,.10); --sh-lg:0 18px 48px rgba(17,32,58,.15); --sh-xl:0 32px 70px rgba(17,32,58,.22);
  --r-sm:8px; --r:14px; --r-lg:22px;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--fb);background:var(--off);color:var(--grey-700);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--grey-700)}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue-500);outline-offset:2px;border-radius:4px}
svg.i{flex:none;display:inline-block;vertical-align:-3px}
.hidden{display:none !important}
.muted{color:var(--grey-500)}
.small{font-size:12.5px}

/* ---------- Demo banner ---------- */
#demoBar{position:fixed;left:0;right:0;bottom:0;z-index:2000;background:var(--amber);color:var(--navy-900);text-align:center;font-family:var(--fd);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px;padding:7px 12px calc(7px + env(safe-area-inset-bottom,0px))}
#demoBar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:center}
#demoBar .dbWhere{display:inline-flex;gap:4px;align-items:center;letter-spacing:.04em}
#demoBar .dbWhere button{font:inherit;text-transform:none;letter-spacing:0;font-size:12px;border:1px solid rgba(27,47,76,.45);background:transparent;color:inherit;border-radius:999px;padding:3px 10px;cursor:pointer}
#demoBar .dbWhere button[aria-pressed="true"]{background:var(--navy-900);color:#fff;border-color:var(--navy-900)}

/* ---------- Lock ---------- */
#lockWrap{position:fixed;inset:0;background:linear-gradient(158deg,var(--navy-900) 0%,var(--navy) 62%,#20395C 100%);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;overflow:hidden auto}
#lockWrap::before{content:"";position:absolute;width:680px;height:680px;border-radius:50%;border:88px solid rgba(255,255,255,.03);top:-300px;right:-220px;pointer-events:none}
#lockWrap::after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;border:70px solid rgba(100,244,201,.045);bottom:-260px;left:-180px;pointer-events:none}
.lockCol{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;width:100%;max-width:440px;margin:auto;padding:24px 0}
.lockBrand{display:flex;flex-direction:column;align-items:center;gap:14px}
.lockBrand img{width:160px;height:auto;display:block}
.appTag{font-family:var(--fd);font-weight:500;font-size:13px;letter-spacing:.34em;text-transform:uppercase;color:var(--mint);text-indent:.34em}
.lockCard{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-xl);width:100%;padding:32px 34px 28px}
.lockCard h1{font-family:var(--fd);font-weight:600;font-size:22px;letter-spacing:.03em;text-transform:uppercase;color:var(--navy)}
.lockCard .lsub{font-size:12.5px;color:var(--grey-500);margin-top:3px}
.lockCard p.desc{color:var(--grey-500);font-size:13.5px;margin:12px 0 18px}
.lockErr{background:var(--coral-100);color:var(--coral-700);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:500;margin-bottom:14px}
.lockOk{background:var(--mint-100);color:var(--mint-700);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:500;margin-bottom:14px}
.lockFoot{margin-top:16px;font-size:12px;color:var(--grey-400);text-align:center}
.lockFoot a,.linkBtn{color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.lockMeta{display:flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:.06em;color:#9DB0CC;text-transform:uppercase;font-family:var(--fd);font-weight:500}
.ackBox{display:flex;gap:10px;align-items:flex-start;background:var(--amber-100);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--amber-700);margin-bottom:16px;line-height:1.5}
.ackBox input{margin-top:2px;accent-color:var(--amber-600)}
.codeBox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;letter-spacing:.08em;background:var(--grey-50);border:1.5px dashed var(--grey-300);border-radius:12px;padding:16px;text-align:center;color:var(--navy);word-break:break-all;margin:6px 0 14px;user-select:all}

/* ---------- Fields ---------- */
.field{margin-bottom:14px}
.field label,.flabel{display:block;font-family:var(--fd);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey-500);margin-bottom:6px}
.field input,.field select,.field textarea,.inp{width:100%;padding:10px 13px;border:1.5px solid var(--grey-200);border-radius:10px;background:#fff;outline:none;transition:border-color .14s var(--ease),box-shadow .14s var(--ease);min-height:42px}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-100)}
.field input:disabled,.field select:disabled,.inp:disabled{background:var(--grey-100);border-color:var(--grey-100);color:var(--grey-600);cursor:not-allowed;opacity:1}
.field textarea{resize:vertical;min-height:70px;line-height:1.45}
.field .hint{font-size:11.5px;color:var(--grey-500);margin-top:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 14px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:9px 20px;border-radius:999px;font-family:var(--fd);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;line-height:1.1;white-space:nowrap;transition:background .14s var(--ease),transform .14s var(--ease),box-shadow .14s var(--ease)}
.btn:active{transform:scale(.985)}
.btn-pri{background:var(--navy);color:#fff;box-shadow:var(--sh-xs)}
.btn-pri:hover{background:var(--navy-900);box-shadow:var(--sh-md)}
.btn-act{background:var(--blue);color:#fff}
.btn-act:hover{background:var(--blue-700)}
.btn-sec{background:#fff;border:1.5px solid var(--grey-300);color:var(--navy)}
.btn-sec:hover{background:var(--grey-100)}
.btn-danger{background:var(--coral-600);color:#fff}
.btn-danger:hover{background:var(--coral-700)}
.btn-mint{background:var(--mint);color:var(--navy-900)}
.btn-mint:hover{background:var(--mint-600)}
.btn-ghost{color:var(--grey-600);padding:6px 12px;min-height:34px;border-radius:999px;font-family:var(--fb);font-weight:600;font-size:12.5px;letter-spacing:0;text-transform:none}
.btn-ghost:hover{background:var(--grey-100);color:var(--navy)}
.btn-sm{min-height:34px;padding:6px 14px;font-size:12px}
.btn-block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none !important;box-shadow:none !important}
.iconBtn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--grey-600)}
.iconBtn:hover{background:var(--grey-100);color:var(--navy)}

/* ---------- Shell ---------- */
#app{display:flex;min-height:100vh}
#side{width:232px;flex:none;background:var(--navy);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sideTop{padding:28px 22px 20px;border-bottom:1px solid rgba(255,255,255,.07)}
.sideTop img{width:126px;height:auto;display:block}
.sideTop .appTag{margin-top:12px;font-size:11px;letter-spacing:.3em;text-indent:0;text-align:left}
.nav{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.navLbl{font-family:var(--fd);font-weight:500;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#7E92B5;padding:14px 12px 6px}
.navBtn{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:10px;color:#C9D4E5;font-weight:600;font-size:13.5px;text-align:left}
.navBtn:hover{background:rgba(255,255,255,.06);color:#fff}
.navBtn.on{background:rgba(100,244,201,.12);color:var(--mint)}
.navBtn .cnt{margin-left:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.12);color:#fff;border-radius:99px;padding:1px 8px}
.navBtn .cnt.red{background:var(--coral-600)} .navBtn .cnt.amber{background:var(--amber);color:var(--navy-900)}
.sideFoot{margin-top:auto;padding:16px 20px 22px;border-top:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;gap:10px}
.whoBox{display:flex;align-items:center;gap:10px;font-size:12.5px;color:#DCE4EE}
.whoBox b{display:block;color:#fff;font-size:13px}
.sideLock{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:9px 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,.22);color:#DCE4EE;font-family:var(--fd);font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
.sideLock:hover{background:rgba(255,255,255,.09);color:#fff}
.syncLine{display:flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--fd);font-weight:500;color:#9DB0CC}
.dot{width:8px;height:8px;border-radius:50%;background:var(--grey-400);flex:none}
.dot.ok{background:var(--mint)} .dot.busy{background:var(--amber)} .dot.bad{background:var(--coral)}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
.topBar{display:flex;align-items:center;gap:14px;padding:18px 28px 14px;position:sticky;top:0;z-index:20;background:var(--off)}
.topBar h2{font-family:var(--fd);font-weight:600;font-size:24px;letter-spacing:.02em;text-transform:uppercase;color:var(--navy);white-space:nowrap}
.searchBox{flex:1;max-width:380px;margin-left:auto;position:relative}
.searchBox input{width:100%;padding:10px 14px 10px 38px;border-radius:999px;border:1.5px solid var(--grey-200);background:#fff;outline:none;min-height:42px}
.searchBox input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-100)}
.searchBox svg{position:absolute;left:13px;top:12px;color:var(--grey-400)}
#view{padding:4px 28px 60px;flex:1}
.mobBar{display:none}

/* ---------- Cards / tiles ---------- */
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh-xs);border:1px solid var(--grey-100)}
.cardHd{display:flex;align-items:center;gap:10px;padding:16px 20px 12px}
.cardHd h3{font-family:var(--fd);font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--navy)}
.cardHd .sub{font-size:12px;color:var(--grey-500)}
.cardBd{padding:4px 20px 18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile{background:#fff;border-radius:var(--r);border:1px solid var(--grey-100);box-shadow:var(--sh-xs);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:92px;transition:box-shadow .14s var(--ease),transform .14s var(--ease)}
.tile:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
.tile .n{font-family:var(--fd);font-weight:600;font-size:30px;line-height:1.1;color:var(--navy)}
.tile .l{font-size:12.5px;font-weight:600;color:var(--grey-600)}
.tile.red .n{color:var(--coral-700)} .tile.amber .n{color:var(--amber-700)} .tile.blue .n{color:var(--blue)} .tile.mint .n{color:var(--mint-700)}
.twoCol{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}

/* ---------- Due groups ---------- */
.dueGrp{margin-bottom:6px}
.dueGrp h4{font-family:var(--fd);font-weight:500;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey-500);padding:12px 0 6px;border-bottom:1px solid var(--grey-100)}
.dueGrp h4.red{color:var(--coral-700)}
.row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid var(--grey-100);cursor:pointer;border-radius:8px;width:100%;text-align:left}
.row:hover{background:var(--grey-50)}
.row .pt{font-weight:700;color:var(--navy);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:12px;color:var(--grey-500);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.empty{padding:28px 10px;text-align:center;color:var(--grey-500);font-size:13px}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap;background:var(--grey-100);color:var(--grey-600)}
.badge.t-aligner{background:var(--blue-100);color:var(--blue-700)}
.badge.t-lab{background:var(--mint-100);color:var(--mint-700)}
.badge.t-appl{background:var(--navy-100);color:var(--navy-700)}
.badge.t-ret{background:var(--amber-100);color:var(--amber-700)}
.badge.t-retx{background:var(--coral-100);color:var(--coral-700)}
.badge.t-misc{background:var(--grey-100);color:var(--grey-600)}
.due{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap;background:var(--grey-100);color:var(--grey-600)}
.due.over{background:var(--coral-100);color:var(--coral-700)}
.due.soon{background:var(--amber-100);color:var(--amber-700)}
.due.none{background:transparent;color:var(--grey-400);font-weight:600}
.av{width:28px;height:28px;border-radius:50%;background:var(--navy-600);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none;letter-spacing:.02em}
.av.none{background:var(--grey-200);color:var(--grey-500)}
.av.lg{width:36px;height:36px;font-size:13px;display:inline-flex;border-radius:50%;margin:0;vertical-align:middle}

/* ---------- Board ---------- */
.boardTabs,.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1.5px solid var(--grey-200);border-radius:99px;padding:6px 14px;font-size:12.5px;font-weight:600;color:var(--grey-600);background:#fff;min-height:36px}
.chip:hover{border-color:var(--navy-500);color:var(--navy)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .c{opacity:.7;margin-left:4px}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;scroll-snap-type:x proximity}
.col{flex:1 0 225px;max-width:320px;background:var(--grey-100);border-radius:var(--r);padding:10px;scroll-snap-align:start;max-height:calc(100vh - 230px);display:flex;flex-direction:column}
.colHd{display:flex;align-items:center;gap:8px;padding:4px 6px 10px}
.colHd h4{font-family:var(--fd);font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.colHd .c{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--grey-500)}
.colBd{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:40px;padding:2px}
.kc{position:relative;background:#fff;border-radius:11px;box-shadow:var(--sh-xs);border:1px solid var(--grey-200);padding:10px 11px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;width:100%}
.kc:hover{box-shadow:var(--sh-md);border-color:var(--grey-300)}
.kc .pt{font-weight:700;color:var(--navy);font-size:13.5px;line-height:1.3;padding-right:36px}
.kc .dt{font-size:12px;color:var(--grey-500);line-height:1.35}
.kc .ft{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kc .adv{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--blue);background:var(--blue-100)}
.kc .adv:hover{background:var(--blue);color:#fff}

/* ---------- Table ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select{padding:8px 12px;border:1.5px solid var(--grey-200);border-radius:999px;background:#fff;font-weight:600;font-size:12.5px;min-height:38px;color:var(--grey-700)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-family:var(--fd);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--grey-500);padding:11px 14px;border-bottom:1px solid var(--grey-100);white-space:nowrap}
.tbl th button{font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--grey-100);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.click{cursor:pointer}
.cleanup{margin-bottom:18px;border:1.5px solid var(--amber-200)}
.cleanup .oldPick select{margin-left:6px;padding:5px 8px;border-radius:8px;border:1.5px solid var(--grey-200);font:inherit;font-size:12.5px}
.cleanup .oldNo{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.oldList{max-height:320px;overflow:auto;border:1px solid var(--grey-100);border-radius:10px}
.oldRow{display:grid;grid-template-columns:22px minmax(0,1.2fr) minmax(0,1.6fr) auto;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--grey-100);cursor:pointer}
.oldRow:last-child{border-bottom:none}
.oldRow:hover{background:var(--grey-50)}
.oldRow input{width:17px;height:17px;accent-color:var(--navy)}
.oldRow .pt{font-weight:700;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oldRow .muted{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oldD{color:var(--coral-700);font-weight:600}
.oldAct{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.oldAct b{font-size:13px;color:var(--navy);margin-right:4px}
.tbl tr.click:hover td{background:var(--grey-50)}
.tbl .pt{font-weight:700;color:var(--navy)}
.tblWrap{overflow-x:auto}

/* ---------- Drawer ---------- */
#scrim{position:fixed;inset:0;background:rgba(17,32,58,.35);z-index:900}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;z-index:901;box-shadow:var(--sh-xl);display:flex;flex-direction:column}
.dHd{padding:20px 22px 14px;border-bottom:1px solid var(--grey-100);display:flex;gap:12px;align-items:flex-start}
.dHd h3{font-family:var(--fd);font-weight:600;font-size:21px;letter-spacing:.02em;color:var(--navy);line-height:1.2}
.dHd .sub{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}

'use strict';
/* =====================================================================
   NLO Time Clock — clocking in and out, overtime heads-ups and the
   office's boundaries, on the NLO Cases platform (same Firebase
   project, same logins, same staff list).
   - At the office: the time-clock computer (its own login, set up by
     Dr. A on that computer). Tap your photo, type your PIN, punch.
     With the office lock on, also on their own phone or computer, but
     only on the office's internet (the office check, a small
     Cloudflare Worker, tells the database where a login is).
   - From home: only on a laptop Dr. A approved, for the people he
     picked (with their PIN): clock in and out, marked Home.
   - Every punch takes the server's time and is never changed: a
     correction is a new record (who, when, why), so the original
     always shows.
   - Alerts (email and phone push) come from a small Google Apps Script
     with its own login (Time Clock → Alerts).
   ===================================================================== */

/* ---------- Firebase project (the same one as NLO Cases and Time Off) ---------- */
const FB_CONFIG = {
  apiKey: "AIzaSyAoPSh6DaKTeg-NplM-UaPoxlFdTo0u4go",
  authDomain: "nlo-cases.firebaseapp.com",
  projectId: "nlo-cases",
  appId: "1:1050188201609:web:df7890b26686b41a395058"
};
/* Synthetic login addresses (no mail is ever sent to them): staff usernames, the time-clock computers, the alert script */
const STAFF_DOMAIN = 'staff.thenextlevelorthodontics.com';
const APP_NAME = 'NLO Time Clock';
const APP_URL = 'https://amooloo.github.io/nlo-apps/nlo-timeclock.html';
const SCRIPT_FILE = 'nlo-timeclock-alerts.gs';
const CHECK_FILE = 'nlo-timeclock-check.js'; // the office check (a Cloudflare Worker), published beside the page

/* ---------- small utils ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function hexId(n) { return Array.from(crypto.getRandomValues(new Uint8Array(n)), b => b.toString(16).padStart(2, '0')).join(''); }
function errCode(code, msg) { const e = new Error(msg || code); e.code = code; return e; }
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
function slug(s) { return String(s || '').toLowerCase().normalize('NFKD').replace(/[^\w.\-]+/g, '').replace(/_/g, '').slice(0, 30); }
function firstName(n) { return String(n || '').trim().replace(/^dr(\.\s*|\s+)/i, '').split(/\s+/)[0] || ''; }
function initials(name) {
  const p = String(name || '').replace(/\([^)]*\)/g, ' ').replace(/^dr\.?\s+/i, '').trim().split(/\s+/).filter(Boolean);
  if (!p.length) return '?';
  return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
}
const TE = new TextEncoder();
async function sha256hex(s) { return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', TE.encode(s))), b => b.toString(16).padStart(2, '0')).join(''); }
/* a PIN's hash, as the rules compare it (nobody can read the stored one) */
function pinHash(sid, pin) { return sha256hex('nlo-tc-pin|' + sid + '|' + pin); }
function okPin(pin) { return /^\d{4}$/.test(String(pin || '')); }
/* PINs nobody should use: one digit four times, or a straight run */

/* =====================================================================
   Firebase backend (the NLO Cases project). Two separate sign-ins on
   the page, neither of them the one NLO Cases or Time Off use on the
   same computer:
   - 'tc': a person, signed in with their NLO login (managers; anyone
     checking their own week, or clocking in on their own phone or
     computer at the office once Dr. A turns the office lock on);
   - 'tcKiosk': this computer as a time clock, with the login Dr. A made
     for it on it (kept there until he removes it): the office's
     time-clock computer, or a laptop he approved for working from home.
   The office lock asks the office check (a Cloudflare Worker) where a
   login is right before a punch; the rules then take one "at the
   office" punch, under the punch number the check gave, for 2 minutes.
   Nothing here is sealed: the clock holds times, never patient data.
   The rules decide who reads and writes what (../nlo-cases-src/firestore.rules).

const FB = {
  emu: false, cfg: null,
  app: null, auth: null, db: null,     // a person
  kapp: null, kauth: null, kdb: null,  // this computer as a time clock
  me: null, mgr: false, kiosk: null, unsubs: [], skew: 0, onSync: null, pending: 0, noIndex: false,

  // approved laptop), sids (a laptop: the people it's for) }

  tsMs(t) { return t && t.toMillis ? t.toMillis() : (typeof t === 'number' ? t : 0); },
  isPerm(e) { return /permission/i.test((e && (e.code || e.message)) || ''); },

  noteServer(ms, sentAt) { if (ms > 0) { const mid = sentAt + (Date.now() - sentAt) / 2; FB.skew = Math.round(ms - mid); } },

  /* ---------- who's here: both saved sign-ins, read once at load ---------- */

  async restore() {

  /* ---------- a person (same logins as NLO Cases) ---------- */

    FB.kiosk = { uid: user.uid, name: d.name || 'Laptop', kind: 'laptop', sids: Array.isArray(d.sids) ? d.sids.filter(x => typeof x === 'string').slice(0, 4) : [] };
    return FB.kiosk;
  },
  /* Dr. A, on the computer that becomes the time clock: its own login (kept on this computer only) */
  async kioskEnroll(name) {
    if (!FB.isOwner()) throw errCode('permission');
    const email = 'tc-clock-' + hexId(6) + '@' + STAFF_DOMAIN;
    await FB.kauth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    const cred = await FB.track(FB.kauth.createUserWithEmailAndPassword(email, randomPassword()));
    try { await FB.track(FB.db.doc('tcKiosks/' + cred.user.uid).set({ name, at: FB.ts(), by: FB.me.uid })); }
    catch (e) { try { await cred.user.delete(); } catch (x) { } throw e; }
    FB.kiosk = { uid: cred.user.uid, name, kind: 'clock', sids: [] };
    return FB.kiosk;
  },
  /* ---------- a laptop someone works from home on (Amir, 9 Oct 2026), approved by Dr. A from his own phone or computer:
     on the laptop, its own new login asks with a 6-digit code it shows; Dr. A types the code to approve it (his password
     never goes on the laptop) ---------- */
  async lapAsk(dev) {
    const email = 'tc-laptop-' + hexId(6) + '@' + STAFF_DOMAIN, code = String(100000 + randInt(900000));
    await FB.kauth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    const cred = await FB.track(FB.kauth.createUserWithEmailAndPassword(email, randomPassword()));
    try { await FB.track(FB.kdb.doc('tcLapReq/' + cred.user.uid).set({ code, dev: String(dev || '').slice(0, 80), at: FB.ts() })); }
    catch (e) { try { await cred.user.delete(); } catch (x) { } await FB.kauth.signOut().catch(() => { }); throw e; }
    return { uid: cred.user.uid, code, at: FB.now() };
  },
  /* the request this laptop's login made (null: none — turned down, or never asked) */
  async lapAsked(uid, server) {
    const s = await FB.kdb.doc('tcLapReq/' + uid).get(server ? { source: 'server' } : undefined);
    return s.exists ? { uid, code: String(s.data().code || ''), at: FB.tsMs(s.data().at) } : null;
  },
  /* waiting for Dr. A: on('ok', kiosk) once he approves it; on('no') if he turns it down (its request is gone, and no
     approval) */
  lapWait(uid, on) {
    const offs = [];
    let done = false;
    const finish = (what, k) => { if (done) return; done = true; offs.forEach(u => { try { u(); } catch (e) { } }); on(what, k); };
    const check = async () => {
      try { const k = await FB.kioskResume({ uid }); if (k) { finish('ok', k); return; } } catch (e) { }
      try { if (!(await FB.lapAsked(uid))) finish('no'); } catch (e) { }
    };
    offs.push(FB.kdb.doc('tcLaptops/' + uid).onSnapshot(s => { if (s.exists) check(); }, () => { }));
    offs.push(FB.kdb.doc('tcLapReq/' + uid).onSnapshot(s => { if (!s.exists) check(); }, () => { }));
    return () => { done = true; offs.forEach(u => { try { u(); } catch (e) { } }); };
  },
  /* changed their mind on the laptop: its login goes (its request can't be approved without it working, and Dr. A's page
     stops showing it after 30 minutes and clears it after a day) */
  async lapCancel() {
    const u = FB.kauth.currentUser; if (!u) return;
    try { await u.delete(); } catch (e) { }
    await FB.kauth.signOut().catch(() => { });
  },
  /* Dr. A approves it (its name, who uses it) or turns it down */
  async lapApprove(uid, name, sids) {
    if (!FB.isOwner()) throw errCode('permission');
    const b = FB.db.batch();
    b.set(FB.db.doc('tcLaptops/' + uid), { name, sids, at: FB.ts(), by: FB.me.uid });
    b.delete(FB.db.doc('tcLapReq/' + uid));
    await FB.track(b.commit());
  },
  async lapDecline(uid) { await FB.track(FB.db.doc('tcLapReq/' + uid).delete()); },
  /* an approved laptop's own record, from the server (null: Dr. A took it back) */
  async lapSelfNow() { const s = await FB.kdb.doc('tcLaptops/' + FB.kiosk.uid).get({ source: 'server' }); return s.exists ? s.data() : null; },
  async kioskForget() { FB.stop(); FB.kiosk = null; try { await FB.kauth.signOut(); } catch (e) { } },
  async kioskSeen() { if (FB.kiosk) await FB.kdb.doc((FB.kiosk.kind === 'laptop' ? 'tcLaptops/' : 'tcKiosks/') + FB.kiosk.uid).update({ seen: FB.ts() }); },

  /* ---------- the database's rules know the time clock and the office lock (Dr. A publishes them) ---------- */
  async rulesOk(asKiosk) {
    try { await (asKiosk ? FB.kdb : FB.db).doc('meta/rules_tc_2').get(); return true; }
    catch (e) { if (FB.isPerm(e)) return false; throw e; }
  },

  /* ---------- the office lock: where this login is right now ----------
     The office check (url: a workers.dev address) looks at the address the request comes from and writes down, under
     its own login, which network this login is on, with a new one-time punch number (pid) only this page is told; the
     rules then take one "at the office" punch, under that number, for 2 minutes (a newer check replaces it).
     → { office, net, org, city, relay (an address many people share: Private Relay, a VPN), pid, bot (which login the
     office check runs with) }. Throws when it can't tell (no answer in 8 s, or an error). */
  async netCheck(url, asDevice, ms) {
    if (!url) throw errCode('no-check', 'The office check isn’t set up yet.');
    const u = (asDevice ? FB.kauth : FB.auth).currentUser;
    if (!u) throw errCode('not-signed-in', 'Not signed in.');
    const token = await u.getIdToken();
    // (plain text, so the browser sends it at once instead of asking the Worker first)
    let r;
    try { r = await withTimeout(fetch(url + '/check', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: token, cache: 'no-store', credentials: 'omit' }), ms || 8000); }
    catch (e) { throw errCode('net-check', e && e.code === 'timeout' ? 'The office check didn’t answer in time.' : 'Couldn’t reach the office check.'); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j || !j.ok) throw errCode('net-check', 'The office check answered: ' + ((j && (j.detail || j.error)) || r.status) + '.');
    const pid = /^p[0-9a-f]{24}$/.test(String(j.pid || '')) ? j.pid : '';
    return { office: j.office === true && !!pid, net: String(j.net || ''), org: String(j.org || ''), city: String(j.city || ''), relay: j.relay === true, pid, bot: String(j.bot || '') };
  },
  async isSetUp(asKiosk) { return (await (asKiosk ? FB.kdb : FB.db).doc('meta/tc').get()).exists; },

  /* ---------- live data ----------
     o.role: 'kiosk' | 'laptop' | 'mgr' | 'staff'; o.from: punches from this moment on (ms); on(kind, list) */
  watch(o, on) {
    FB.stop();
    const kiosk = o.role === 'kiosk' || o.role === 'laptop', db = kiosk ? FB.kdb : FB.db, sid = o.sid || '';
    const fromTs = firebase.firestore.Timestamp.fromMillis(o.from);
    const fixTs = firebase.firestore.Timestamp.fromMillis(o.from - TCE.HOUR);
    const add = u => FB.unsubs.push(u);
    const docs = s => s.docs.map(d => Object.assign({ id: d.id }, d.data({ serverTimestamps: 'estimate' })));
    const err = kind => e => on('error', { kind, e });
    const list = (q, kind) => add(q.onSnapshot(s => on(kind, docs(s)), err(kind)));
    const one = (path, kind) => add(db.doc(path).onSnapshot(s => on(kind, s.exists ? Object.assign({ id: s.id }, s.data({ serverTimestamps: 'estimate' })) : null), err(kind)));
    one('meta/tc', 'set');
    // an approved laptop reads only the people it's for, one by one (each person's lists put together for the page), and
    // its own record (Dr. A changes who uses it, or takes it back: 'lapself', null once it's gone)
    if (o.role === 'laptop') {
      const agg = {}, put = (kind, who, vals) => { (agg[kind] = agg[kind] || {})[who] = vals; on(kind, [].concat.apply([], Object.keys(agg[kind]).map(k => agg[kind][k]))); };
      const doc1 = s => (s.exists ? [Object.assign({ id: s.id }, s.data({ serverTimestamps: 'estimate' }))] : []);
      const errOf = who => kind => e => on('error', { kind, e, who });
      // (a "not there" from the copy kept on this computer — offline, say — isn't news: only the server's)
      if (FB.kiosk) add(db.doc('tcLaptops/' + FB.kiosk.uid).onSnapshot(s => { if (!s.exists && s.metadata.fromCache) return; on('lapself', s.exists ? Object.assign({ id: s.id }, s.data()) : null); }, () => { }));
      (o.sids || []).forEach(who => {
        const er = errOf(who);
        add(db.doc('roster/' + who).onSnapshot(s => put('roster', who, doc1(s)), er('roster')));
        add(db.doc('tcStaff/' + who).onSnapshot(s => put('staff', who, doc1(s)), er('staff')));
        add(db.doc('tcTry/' + who).onSnapshot(s => put('try', who, doc1(s)), er('try')));
        FB.staffPunches(db, who, fromTs, (kind, list) => put(kind, who, list), er);
        ['tcFix:fix', 'tcOT:ot', 'tcReq:req'].forEach(x => { const [c, kind] = x.split(':'); add(db.collection(c).where('sid', '==', who).onSnapshot(s => put(kind, who, docs(s)), er(kind))); });
      });
      if (!(o.sids || []).length) ['roster', 'staff', 'try', 'punch', 'fix', 'ot', 'req'].forEach(k => on(k, []));
      return;
    }
    list(db.collection('roster'), 'roster');
    if (o.role === 'staff') {
      one('tcStaff/' + sid, 'staff1');
      FB.staffPunches(db, sid, fromTs, on, err);
      list(db.collection('tcFix').where('sid', '==', sid), 'fix');
      list(db.collection('tcOT').where('sid', '==', sid), 'ot');
      list(db.collection('tcReq').where('sid', '==', sid), 'req');
      return;
    }
    list(db.collection('tcStaff'), 'staff');
    list(db.collection('tcPunch').where('at', '>=', fromTs), 'punch');
    list(db.collection('tcFix').where('at', '>=', fixTs), 'fix');
    // requests to fix someone's time: the last 31 days (a request can only be for a punch in the last 31 days)
    list(db.collection('tcReq').where('at', '>=', firebase.firestore.Timestamp.fromMillis(Math.min(o.from, FB.now() - 31 * TCE.DAY))), 'req');
    list(db.collection('tcOT'), 'ot');
    list(db.collection('tcTry'), 'try');
    if (o.role === 'mgr') {
      list(db.collection('tcMgrs'), 'mgrs');
      list(db.collection('tcKiosks'), 'kiosks');
      list(db.collection('tcLaptops'), 'laptops');
      // (Dr. A's: nobody else reads the office's networks, or the laptops asking to be approved)
      if (FB.isOwner()) { list(db.collection('tcOffice'), 'offices'); list(db.collection('tcLapReq'), 'lapreqs'); }
      list(db.collection('tcBeat'), 'beat');
      list(db.collection('tcSent').orderBy('at', 'desc').limit(60), 'sent');
      one('meta/tcAlerts', 'alerts');
    }
  },
  /* someone's own punches: with an index (sid + time) only the recent ones are read; without it, all of theirs (it still
     works — Firestore needs an index for "theirs, since a day", which Settings offers to make) */
  staffPunches(db, sid, fromTs, on, err) {
    const docs = s => s.docs.map(d => Object.assign({ id: d.id }, d.data({ serverTimestamps: 'estimate' })));
    const all = () => FB.unsubs.push(db.collection('tcPunch').where('sid', '==', sid).onSnapshot(s => on('punch', docs(s)), err('punch')));
    if (FB.noIndex) { all(); return; }
    let u = null;
    u = db.collection('tcPunch').where('sid', '==', sid).where('at', '>=', fromTs).onSnapshot(s => on('punch', docs(s)), e => {
      if (/failed-precondition|index/i.test((e && (e.code || e.message)) || '')) {
        FB.noIndex = true; FB.indexLink = ((e.message || '').match(/https:\/\/console\.firebase\.google\.com\S+/) || [''])[0];
        try { u(); } catch (x) { }
        all();
      } else err('punch')(e);
    });
    FB.unsubs.push(() => { try { u(); } catch (x) { } });
  },
  stop() { FB.unsubs.forEach(u => { try { u(); } catch (e) { } }); FB.unsubs = []; },
  /* everything in a span (payroll, an older timesheet): one read, not live */
  async loadRange(fromMs, toMs) {
    const db = FB.db, T = firebase.firestore.Timestamp;
    const [p, f, ot] = await FB.track(Promise.all([
      db.collection('tcPunch').where('at', '>=', T.fromMillis(fromMs)).where('at', '<', T.fromMillis(toMs)).get(),
      db.collection('tcFix').where('at', '>=', T.fromMillis(fromMs - TCE.HOUR)).get(),
      db.collection('tcOT').get()
    ]));
    const docs = s => s.docs.map(d => Object.assign({ id: d.id }, d.data()));
    return { punches: docs(p), fixes: docs(f), ot: docs(ot) };
  },

  /* ---------- at the time clock: the PIN, then the punch ----------
     A try is counted before the PIN is checked (5 in 10 minutes for each person), the check only goes through with the
     right PIN, and the punch uses it up in the same save. The hash of the PIN tried goes where nobody can read it
     (tcTryPh), in the same save as its try. */
  async pinTry(sid, pin) {
    const db = FB.kdb, ref = db.doc('tcTry/' + sid), ph = await pinHash(sid, pin), me = FB.kiosk.uid;
    const s = await FB.track(ref.get()), cur = s.exists ? s.data() : null, t0 = cur ? FB.tsMs(cur.t0) : 0, now = FB.now();
    const bad = cur ? (Number(cur.bad) || 0) + 1 : 1;
    const save = d => { const b = db.batch(); b.set(ref, d); b.set(db.doc('tcTryPh/' + sid), { ph, at: FB.ts() }); return b.commit(); };
    const fresh = () => save({ n: 1, t0: FB.ts(), at: FB.ts(), ok: false, k: me, bad, u: '' });
    const next = () => save({ n: cur.n + 1, t0: cur.t0, at: FB.ts(), ok: false, k: me, bad, u: '' });
    const order = !cur ? ['fresh'] : now > t0 + 10 * TCE.MIN ? ['fresh', 'next'] : ['next', 'fresh'];
    let n = 0;
    for (const w of order) {
      if (w === 'next' && !(cur && cur.n < 5)) continue;
      try { await FB.track(w === 'fresh' ? fresh() : next()); n = w === 'fresh' ? 1 : cur.n + 1; break; }
      catch (e) { if (!FB.isPerm(e)) throw e; }
    }
    if (!n) return { ok: false, locked: true, until: t0 + 10 * TCE.MIN };
    try { await FB.track(ref.update({ ok: true })); return { ok: true }; }
    catch (e) {
      if (!FB.isPerm(e)) throw e;
      const start = n === 1 ? now : t0;
      return { ok: false, left: 5 - n, locked: n >= 5, until: start + 10 * TCE.MIN };
    }
  },
  /* the try isn't used (they walked away, or pressed Cancel): nothing left over for anyone else */
  async pinRelease(sid) {
    if (!FB.kiosk) return;
    await FB.kdb.doc('tcTry/' + sid).set(FB.usedTry('')).catch(() => { });
  },
  /* a try used up (u: what used it — the punch's id, 'pin' for a new PIN, '' when let go) */
  usedTry(u) { return { n: 0, t0: FB.ts(), at: FB.ts(), ok: false, k: '', bad: 0, u }; },
  /* the database is there right now (a quick read from the server, not this computer's copy) */
  async ping(ms) { await withTimeout(FB.kdb.doc('meta/rules_tc_2').get({ source: 'server' }).catch(e => { if (!FB.isPerm(e)) throw e; }), ms || 6000); },
  /* net: where the time clock (or laptop) is — 'office', 'off', 'unk' (couldn't check) or '' (not checked); pid: the punch
     number the office check just gave (an "at the office" punch is saved under it) */
  async punch(sid, kind, net, pid) {
    const db = FB.kdb, id = net === 'office' && pid ? pid : 'p' + hexId(12), b = db.batch(), sent = Date.now();
    b.set(db.doc('tcPunch/' + id), { sid, kind, at: FB.ts(), src: FB.kiosk.kind === 'laptop' ? 'laptop' : 'kiosk', by: FB.kiosk.uid, net: net || '' });
    b.set(db.doc('tcTry/' + sid), FB.usedTry(id));
    await FB.track(withTimeout(b.commit(), 15000));
    let at = 0;
    try { at = FB.tsMs((await db.doc('tcPunch/' + id).get()).data().at); FB.noteServer(at, sent); } catch (e) { }
    return { id, at: at || FB.now() };
  },
  async pinChange(sid, pin) {
    const db = FB.kdb, b = db.batch();
    b.set(db.doc('tcPin/' + sid), { h: await pinHash(sid, pin), at: FB.ts() });
    b.update(db.doc('tcStaff/' + sid), { pinAt: FB.ts(), pinBy: 'self', at: FB.ts(), by: FB.kiosk.uid });
    b.set(db.doc('tcTry/' + sid), FB.usedTry('pin'));
    await FB.track(b.commit());
  },

  /* ---------- asking a manager to fix their time (a punch they missed, or a note) ----------
     ps: [{ k: kind, t: ms }] (at most 2; none for a note). At the time clock it needs the person's PIN just before (the
     PIN isn't used up: they can punch next); signed in, it's for themselves. */
  reqDoc(sid, ps, note, src, by) { return { sid, ps: ps.map(p => ({ k: p.k, t: Math.round(p.t) })), note: String(note || '').slice(0, 200), src, by, at: FB.ts(), st: 'open' }; },
  /* a request and its count (at most 10 in 24 hours for each person) in one save */
  async reqSave(db, sid, doc) {
    const id = 'r' + hexId(12), nRef = db.doc('tcReqN/' + sid);
    const s = await FB.track(nRef.get()), cur = s.exists ? s.data() : null;
    const fresh = !cur || FB.now() > FB.tsMs(cur.t0) + TCE.DAY;
    if (!fresh && cur.n >= 10) throw errCode('too-many', 'That’s 10 requests in a day. Tell a manager in person.');
    const b = db.batch();
    b.set(nRef, fresh ? { n: 1, t0: FB.ts(), at: FB.ts() } : { n: cur.n + 1, t0: cur.t0, at: FB.ts() });
    b.set(db.doc('tcReq/' + id), doc);
    await FB.track(withTimeout(b.commit(), 15000));
    return { id };
  },
  async reqSend(sid, ps, note) { return FB.reqSave(FB.kdb, sid, FB.reqDoc(sid, ps, note, FB.kiosk.kind === 'laptop' ? 'laptop' : 'kiosk', FB.kiosk.uid)); },
  async reqSendMine(ps, note) { return FB.reqSave(FB.db, FB.me.staffId, FB.reqDoc(FB.me.staffId, ps, note, 'me', FB.me.uid)); },
  /* the person takes it back (at the time clock right after their PIN, or signed in) */
  async reqTakeBack(id, atKiosk) { await FB.track((atKiosk ? FB.kdb : FB.db).doc('tcReq/' + id).update({ st: 'x', rat: FB.ts() })); },
  /* a manager answers: approved (the punches, as asked or as changed, become corrections in the same save) or declined */
  async reqAnswer(r, ok, ps, why, note) {
    const b = FB.db.batch(), fx = [];
    if (ok) ps.forEach(p => { const id = 'f' + hexId(12); fx.push(id); b.set(FB.db.doc('tcFix/' + id), FB.fixDoc(r.sid, 'add', '', p.k, Math.round(p.t), why)); });
    b.update(FB.db.doc('tcReq/' + r.id), { st: ok ? 'ok' : 'no', rby: FB.me.uid, rbsid: FB.me.staffId, rat: FB.ts(), rwhy: String(note || '').slice(0, 300), fx });
    await FB.track(b.commit());
  },

  /* ---------- on their own phone or computer, at the office (right after the office check said so, under the punch number
     it gave; the rules check) ---------- */
  async punchOwn(kind, pid) {
    if (!pid) throw errCode('not-office', 'The office check didn’t give a punch number.');
    const id = pid, sent = Date.now();
    await FB.track(withTimeout(FB.db.doc('tcPunch/' + id).set({ sid: FB.me.staffId, kind, at: FB.ts(), src: 'own', by: FB.me.uid, net: 'office' }), 15000));
    let at = 0;
    try { at = FB.tsMs((await FB.db.doc('tcPunch/' + id).get()).data().at); FB.noteServer(at, sent); } catch (e) { }
    return { id, at: at || FB.now() };
  },

  /* ---------- managers ---------- */
  /* Dr. A, once: the clock's settings, where alerts go (his own email to start), and everyone on the team on the clock */
  async setupOffice(people) {
    if (!FB.isOwner()) throw errCode('permission');
    const b = FB.db.batch(), d = TCE.DEFAULTS;
    b.set(FB.db.doc('meta/tc'), { wk: d.wk, ot: d.ot, thr: d.thr.slice(), early: d.early, late: d.late, shift: d.shift, brk: d.brk, days: d.days.slice(), pay: '', lock: false, wurl: '', at: FB.ts() });
    b.set(FB.db.doc('meta/tcAlerts'), { emails: okEmail(FB.me.email) ? [FB.me.email] : [], topic: '', route: {}, digest: '', test: null, at: FB.ts() });
    people.forEach(sid => b.set(FB.db.doc('tcStaff/' + sid), { on: true, home: false, hdays: [], early: '', cap: 0, sal: false, pinAt: null, pinBy: '', at: FB.ts(), by: FB.me.uid }));
    await FB.track(b.commit());
  },
  async saveStaff(sid, f, cur) {
    await FB.track(FB.db.doc('tcStaff/' + sid).set({
      on: !!f.on, home: !!f.home, hdays: f.hdays || [], early: f.early || '', cap: f.sal ? 0 : Number(f.cap) || 0, sal: !!f.sal,
      pinAt: cur && cur.pinAt ? cur.pinAt : null, pinBy: cur && ['mgr', 'self'].includes(cur.pinBy) ? cur.pinBy : '', at: FB.ts(), by: FB.me.uid
    }));

  async setPin(sid, pin) {

    b.update(FB.db.doc('tcStaff/' + sid), { pinAt: FB.ts(), pinBy: 'mgr', at: FB.ts(), by: FB.me.uid });

  },
  /* Dr. A makes someone a time clock manager, or stops */
  async setMgr(sid, on) {
    if (!FB.isOwner()) throw errCode('permission');
    const ref = FB.db.doc('tcMgrs/' + sid);
    await FB.track(on ? ref.set({ at: FB.ts(), by: FB.me.uid }) : ref.delete());
  },
  async clearTry(sid) { await FB.track(FB.db.doc('tcTry/' + sid).set(FB.usedTry(''))); },
  fixDoc(sid, op, ref, kind, t, why) { return { sid, op, ref, kind, t, why: String(why).slice(0, 300), by: FB.me.uid, bsid: FB.me.staffId, at: FB.ts() }; },
  async fixAdd(sid, kind, t, why) { await FB.track(FB.db.doc('tcFix/f' + hexId(12)).set(FB.fixDoc(sid, 'add', '', kind, Math.round(t), why))); },
  async fixVoid(sid, ref, why) { await FB.track(FB.db.doc('tcFix/f' + hexId(12)).set(FB.fixDoc(sid, 'void', ref, '', 0, why))); },
  async fixMove(sid, ref, kind, t, why) {
    const b = FB.db.batch();
    b.set(FB.db.doc('tcFix/f' + hexId(12)), FB.fixDoc(sid, 'void', ref, '', 0, why));
    b.set(FB.db.doc('tcFix/f' + hexId(12)), FB.fixDoc(sid, 'add', '', kind, Math.round(t), why));

  async setOT(sid, week, hrs, why) {

const KIND = { in: 'Clocked in', lunch: 'Out to lunch', back: 'Back from lunch', out: 'Clocked out' };

/* the heads-up someone sees for their week (Amir, 9 Oct 2026: a warning that they're getting close to 40 hours, and only
   approved overtime lets them go over). ot: the overtime ones, shown as a pop-up at the time clock and on My time. */
function headsUp(w, set) {
  const out = [], lim = set.ot, H = TCE.HOUR;
  if (w.sal) return out; // salaried: the hours are only kept for the record
  const today = TCE.dayOf(nowMs()), when = t => TCE.timeText(t) + (TCE.dayOf(t) === today ? ' today' : ' ' + TCE.dayText(TCE.dayOf(t)));
  if (w.approved > w.limit) {
    if (w.total > w.approved) out.push({ bad: true, ot: true, h: 'Past the overtime approved', t: 'You’re at ' + TCE.hmDur(w.total) + ' this week; overtime was approved up to ' + TCE.h2(w.approved) + ' h. Going past it needs a manager’s OK — a manager has been told.' });
    else if (w.eta.approved) out.push({ warn: true, ot: true, h: 'Overtime approved up to ' + TCE.h2(w.approved) + ' h', t: 'You’ll reach it at about ' + when(w.eta.approved) + ' if you stay clocked in. Going past it needs a manager’s OK.' });
    else out.push({ t: 'Overtime approved up to ' + TCE.h2(w.approved) + ' h this week.' });
  } else if (w.total >= w.limit) out.push({ bad: true, ot: true, h: 'In overtime without approval', t: 'You’re at ' + TCE.hmDur(w.total) + ' this week (overtime starts at ' + lim + ' h), and your overtime isn’t approved. Only a manager can approve it — a manager has been told.' });
  else {
    const near = set.thr.length ? Math.min.apply(null, set.thr) * H : lim * H - 4 * H;
    if (w.total >= near || w.eta.ot) out.push({ warn: true, ot: true, h: 'Getting close to overtime', t: 'You’re at ' + TCE.hmDur(w.total) + ' this week. Overtime starts at ' + lim + ' h' + (w.eta.ot ? ', about ' + when(w.eta.ot) + ' if you stay clocked in' : '') + '. Only a manager can approve overtime, so clock out ' + (w.eta.ot ? 'by then' : 'before ' + lim + ' h') + ' unless it’s approved.' });
  }
  if (w.cap && w.cap < w.limit) {
    if (w.total >= w.cap) out.push({ warn: true, t: 'Past the ' + TCE.h2(w.cap) + ' h weekly cap set for you.' });
    else if (w.eta.cap && w.cap - w.total <= 2 * H) out.push({ warn: true, t: 'Your weekly cap is ' + TCE.h2(w.cap) + ' h: about ' + TCE.timeText(w.eta.cap) + ' if you stay clocked in.' });
  }
  return out;
}
/* clocking in (or back from lunch) now would be overtime nobody approved: they're asked first, and a manager is told */

/* ---------- the data as it arrives ---------- */
function ingest(kind, data) {
  const map = (list, conv) => { const m = new Map(); (list || []).forEach(x => { const v = conv(x); if (v) m.set(v.key || x.id, v); }); return m; };
  if (kind === 'error') {
    const e = data && data.e;
    // an approved laptop: refused for one of its people — Dr. A may have just changed who uses it, or taken it back
    if (B.isPerm(e) && data.who && isLaptopHere()) { lapRecheck(data.who, e); return; }
    S.loadErr = B.isPerm(e) ? 'perm' : 'net';
    if (S.loadErr === 'perm' && !S.permChecked) { S.permChecked = true; B.rulesOk(S.mode === 'kiosk').then(ok => { S.rulesOk = ok; queueRender(); }).catch(() => { }); }
    queueRender(); return;
  }
  if (kind === 'lapself') { lapSelf(data); return; }
  S.got[kind] = true;
  if (kind === 'set') { S.setRaw = data; S.set = TCE.settingsOf(data); }
  else if (kind === 'roster') {
    S.roster = map(data, x => ({ key: x.id, sid: x.id, name: String(x.name || x.id), role: x.role || 'staff', active: x.active === true, photo: typeof x.photo === 'string' ? x.photo : '' }));
  }
  else if (kind === 'staff') S.staff = map(data, x => Object.assign({ key: x.id }, x));
  else if (kind === 'staff1') { S.staff = new Map(); if (data) S.staff.set(data.id, data); }
  else if (kind === 'punch') {
    S.punches = map(data, x => (x.sid && TCE.KINDS.includes(x.kind) ? { key: x.id, id: x.id, sid: x.sid, kind: x.kind, at: ms(x.at) || nowMs(), src: ['kiosk', 'own', 'laptop', 'home'].includes(x.src) ? x.src : 'kiosk', net: ['office', 'off', 'unk'].includes(x.net) ? x.net : '', by: x.by || '' } : null));
  }
  else if (kind === 'fix') {
    S.fixes = map(data, x => (x.sid && (x.op === 'add' || x.op === 'void') ? { key: x.id, id: x.id, sid: x.sid, op: x.op, ref: x.ref || '', kind: x.kind || '', t: Number(x.t) || 0, why: x.why || '', by: x.by || '', bsid: x.bsid || '', at: ms(x.at) || nowMs() } : null));
  }
  else if (kind === 'ot') S.ot = map(data, x => (x.sid && x.week ? { key: x.sid + '_' + x.week, sid: x.sid, week: x.week, hrs: Number(x.hrs) || 0, why: x.why || '', bsid: x.bsid || '', at: ms(x.at) } : null));
  else if (kind === 'try') S.tries = map(data, x => ({ key: x.id, sid: x.id, n: Number(x.n) || 0, t0: ms(x.t0), at: ms(x.at), ok: x.ok === true }));
  else if (kind === 'kiosks') S.kiosks = (data || []).map(x => ({ uid: x.id, name: x.name || 'Time clock', at: ms(x.at), seen: ms(x.seen) }));
  else if (kind === 'laptops') S.laptops = (data || []).map(x => ({ uid: x.id, name: x.name || 'Laptop', sids: Array.isArray(x.sids) ? x.sids.filter(y => typeof y === 'string') : [], at: ms(x.at), seen: ms(x.seen) }));
  else if (kind === 'offices') S.offices = (data || []).map(x => ({ net: x.id, name: x.name || 'Office', org: x.org || '', city: x.city || '', at: ms(x.at) })).sort((a, b) => a.at - b.at);
  else if (kind === 'lapreqs') S.lapReqs = lapReqsOf(data);
  else if (kind === 'beat') S.beat = (data || []).map(x => ({ uid: x.id, box: x.box || '', ver: x.ver || '', err: x.err || '', sent: Number(x.sent) || 0, at: ms(x.at) }));
  else if (kind === 'sent') S.sent = (data || []).map(x => ({ id: x.id, type: x.type || '', sid: x.sid || '', text: x.text || '', st: x.st || '', ch: Number(x.ch) || 0, at: ms(x.at) }));
  else if (kind === 'alerts') S.alerts = data;
  else if (kind === 'mgrs') S.mgrs = new Set((data || []).map(x => x.id));
  else if (kind === 'req') {
    S.reqs = map(data, x => (x.sid && ['open', 'ok', 'no', 'x'].includes(x.st) ? {
      key: x.id, id: x.id, sid: x.sid, ps: (Array.isArray(x.ps) ? x.ps : []).map(p => ({ k: p && p.k, t: Number(p && p.t) || 0 })).filter(p => TCE.KINDS.includes(p.k) && p.t > 0).slice(0, 2),
      note: String(x.note || '').slice(0, 200), src: x.src === 'kiosk' || x.src === 'laptop' ? x.src : 'me', at: ms(x.at) || nowMs(), st: x.st,
      rbsid: x.rbsid || '', rat: ms(x.rat), rwhy: String(x.rwhy || ''), fx: Array.isArray(x.fx) ? x.fx : []
    } : null));
  }
  if ((kind === 'punch' || kind === 'fix' || kind === 'ot') && S.pay && S.pay.data) S.pay.stale = true; // (payroll reads the period again)
  S.loadErr = '';
  queueRender();
}
/* a locked-out PIN: 5 wrong tries in the last 10 minutes */
function lockedUntil(sid) { const t = S.tries.get(sid); if (!t || t.n < 5 || t.ok) return 0; const u = t.t0 + 10 * TCE.MIN; return u > nowMs() ? u : 0; }

window.addEventListener('pageshow', e => { if (e.persisted && S.mode === 'app') location.reload(); });
async function boot() {

  const qs = new URLSearchParams(location.search);
  const local = location.protocol === 'file:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  S.demo = DEMO_ONLY || qs.has('demo'); S.emu = !DEMO_ONLY && local && qs.has('emu');
  if (DEMO_ONLY) $$('img[src="logo-white.png"]').forEach(i => { i.src = LOGO; });
  document.addEventListener('click', onClick);
  document.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.chg && CHG[t.dataset.chg]) CHG[t.dataset.chg](t, e); });
  document.addEventListener('keydown', onKey);
  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { S.lastAct = Date.now(); }, { passive: true }));
  setInterval(tick, 1000);
  if (S.demo) {
    B = DEMO; B.seedNow(); $('#demoBar').classList.remove('hidden'); document.body.classList.add('demo'); demoBar();
    const meta = $('.lockMeta'); if (meta) meta.textContent = 'Demo · made-up people · nothing is saved';
    if (qs.has('kiosk')) { await B.kioskOpen(); enterKiosk(); return; }
    lockScreen('demo'); return;
  }
  B = FB;
  if (!FB.init(S.emu)) { lockScreen('unconfigured'); return; }
  FB.onSync = renderSync;
  lockScreen('loading');
  window.addEventListener('online', renderSync); window.addEventListener('offline', renderSync);
  let r;
  try { r = await FB.restore(); } catch (e) { lockScreen('login', { err: errText(e) }); return; }
  afterRestore(r);
}
async function afterRestore(r) {
  // this computer is a time clock (or laptop), but its record couldn't be read just now: keep trying, never sign it out
  if (r.kioskErr) { kioskRetry(r.kioskErr); return; }
  if (r.kiosk) { if (r.person) await FB.signOut(); enterKiosk(); return; }
  if (r.lapWait) { lapWaitStart(r.lapWait); return; } // (a laptop asked Dr. A to approve it: still waiting)
  if (r.person) { S.stay = true; enterApp(); return; }
  lockScreen('login', r.kioskGone ? { err: 'This computer isn’t set up as the time clock or an approved laptop any more (Dr. A removed it, or didn’t approve it). Dr. A can set it up again.' } : {});
}
/* a time clock that can't read its own record (no internet, or the database's rules): tries again by itself, sooner at
   first; the screen says why */
let kioskRetryT = 0, kioskRetryN = 0;
function kioskRetry(e) {
  clearTimeout(kioskRetryT);
  const perm = FB.isPerm(e);
  lockScreen('kioskwait', { err: perm ? 'The database refused to read this time clock. If Dr. A just published database rules from another NLO app, he needs to publish them again from Time Clock (signed in as himself).' : 'No answer from the database: check the internet.' });
  kioskRetryT = setTimeout(kioskRetryNow, Math.min(60000, 5000 * (++kioskRetryN)));
}
async function kioskRetryNow() {
  clearTimeout(kioskRetryT);
  if (S.mode !== 'lock') return;
  let r;
  try { r = await FB.restore(); } catch (e) { kioskRetry(e); return; }
  if (!r.kioskErr) kioskRetryN = 0;
  afterRestore(r);
}
ACT.kioskRetryNow = b => { busyBtn(b, true, 'Trying…'); kioskRetryNow(); };
ACT.kioskSignIn = () => { clearTimeout(kioskRetryT); lockScreen('login'); };
/* every second: the time clock's clock; every 30 s: hours that run on while someone is clocked in; idle checks */
function tick() {
  const n = Date.now();
  if (S.mode === 'kiosk') kioskTick(n);
  if (S.mode === 'app') {
    if (S.role === 'mgr' && !S.stay && n - S.lastAct > (S.fromKiosk ? 3 : MGR_IDLE_MIN) * 60000) { lockOut(S.fromKiosk ? '' : 'Signed out after ' + MGR_IDLE_MIN + ' minutes without use.'); return; }
    if (!S.lastRender || n - S.lastRender > 30000) { if (!$('#modalWrap') && !document.activeElement.matches('input,select,textarea')) queueRender(); }
  }
}

function lapWaitStart(r) {

  r.tick = setInterval(() => { if (S.lapAsk !== r) { clearInterval(r.tick); return; } if (expired()) { clearInterval(r.tick); lockScreen('lapwait', { code: r.code, expired: true }); } }, 15000);

    if (S.lapAsk !== r) return;

    await B.lapCancel();
    lockScreen(S.demo ? 'demo' : 'login', { err: 'Dr. A didn’t approve this laptop. Ask him, then try again.' });

      // not taken as "at the office" (a newer check came in between, or the office's network was just removed): the time
      // clock saves it anyway, flagged (it couldn't be checked); a laptop checks once more
      if (!(nc.net === 'office' && B.isPerm(e))) throw e;
      nc = isLaptopHere() ? await kNet() : { net: 'unk', pid: '' };
      if (isLaptopHere()) k.net = nc.net;
      if (awayNo(nc.net)) throw errCode('away', awayMsg);
      r = await B.punch(sid, kind, nc.net, nc.pid);
    }
    const net = nc.net;
    if (!S.punches.has(r.id)) S.punches.set(r.id, { id: r.id, sid, kind, at: r.at, src: isLaptopHere() ? 'laptop' : 'kiosk', net, by: B.kiosk ? B.kiosk.uid : '' }); // (the live copy is on its way)
    Object.assign(k, { busy: false, verified: false, otOk: false, lunchOk: false, screen: 'done', done: { kind, at: r.at, w: weekFor(sid), before, net }, doneAt: Date.now() });
  } catch (e) {
    k.busy = false; k.msgOk = false;
    if (e && e.code === 'away') Object.assign(k, { screen: 'acts', msg: e.message });
    else if (e && e.code === 'timeout') Object.assign(k, { screen: 'acts', msg: 'Not confirmed: the internet is very slow. Don’t punch again. In a minute, look at your name on the time clock: if the punch isn’t there, tell a manager.' });
    else if (B.isPerm(e)) Object.assign(k, { screen: 'pin', pin: '', verified: false, msg: kRefused(k) });
    else { k.screen = 'acts'; k.msg = errText(e); }
  } finally { clearTimeout(slow); }
  if (S.k === k) renderKiosk();
};
/* the database didn't take it: the PIN's 5 minutes ran out — or something just changed (a setting, the network) */
function kRefused(k) { return Date.now() - (k.verifiedAt || 0) > 4.5 * 60000 ? 'That took too long. Type your PIN again.' : 'That punch wasn’t taken: something just changed (a setting, or the network). Type your PIN again, and if it happens again, tell a manager.'; }
/* a laptop that couldn't check the office network: check again */
ACT.kNetAgain = async () => {

};
ACT.kReq = b => {

  const kind = (b && b.dataset.k) || (wp.state === 'out' ? 'in' : 'lunch');
  k.req = { kind, day: (b && b.dataset.day) || TCE.dayOf(nowMs()), t1: '', t2: '', note: '' };

};
ACT.krKind = b => { const f = S.k.req; f.kind = b.dataset.k; if (f.kind !== 'lunch') f.t2 = ''; S.k.msg = ''; renderKiosk(); };
ACT.krDay = b => { S.k.req.day = b.dataset.day; S.k.msg = ''; renderKiosk(); };
ACT.kReqSend = async () => {

async function kNewPinStep() {
  const k = S.k, pin = k.pin;
  if (!k.np1) {
    if (weakPin(pin)) { k.pin = ''; k.msg = 'Pick something harder to guess (not ' + pin + ').'; k.shake = true; renderKiosk(); return; }
    k.np1 = pin; k.pin = ''; k.msg = ''; renderKiosk(); return;
  }
  if (pin !== k.np1) { Object.assign(k, { pin: '', np1: '', msg: 'Those didn’t match. Type a new PIN.', shake: true }); renderKiosk(); return; }
  k.busy = true; renderKiosk();

  } catch (e) {

    if (B.isPerm(e)) Object.assign(k, { screen: 'pin', pin: '', verified: false, np1: '', msg: 'That took too long. Type your current PIN again.' });
    else { k.pin = ''; k.np1 = ''; k.msg = errText(e); }
  }
  if (S.k === k) renderKiosk();
}
function kioskKey(e) {
  if ($('#modalWrap')) return;
  const k = S.k;
  if ((k.screen === 'pin' || k.screen === 'newpin') && /^\d$/.test(e.key)) { e.preventDefault(); kDigit(e.key); }

}

/* =====================================================================
   The screens for people signed in: managers (Now, Timesheets, Payroll,
   People, Alerts, Settings) and anyone's own week (My time — where they
   also clock in on their own phone or computer at the office, once Dr. A
   turns the office lock on).
   Managers are Dr. A and the people he makes time clock managers. Only Dr. A
   changes settings, who's on the clock and where alerts go; nobody
   corrects their own time except Dr. A (the database enforces both).
   ===================================================================== */
const VIEWS = {};
const isMe = sid => !!(B.me && B.me.staffId === sid);
const canFix = sid => S.role === 'mgr' && (!isMe(sid) || B.isOwner());
function chip(t, cls) { return '<span class="stat ' + (cls || 'off') + '">' + esc(t) + '</span>'; }
function stateChip(w) { return w.state === 'in' ? chip('In' + (w.src === 'home' ? ' · home' : ''), 'ok') : w.state === 'lunch' ? chip('Lunch', 'wait') : chip('Out', 'off'); }
const FLAG = { early: ['Early', 'wait'], offday: ['Closed day', 'wait'], home: ['Home', 'info'], homeday: ['Home, other day', 'wait'], offnet: ['Off the office network', 'bad'], nonet: ['Network not checked', 'wait'], late: ['Still in late', 'bad'], long: ['Long shift', 'wait'] };
const ISSUE = { 'missing-out': 'No clock-out', 'no-return': 'Never back from lunch', 'no-in': 'No clock-in', 'lunch-out': 'Out from lunch, no Back', 'double-in': 'Clocked in twice', 'double-out': 'Clocked out twice', 'double-lunch': 'Lunch pressed twice' };
const FIXME = ['missing-out', 'no-return', 'no-in', 'lunch-out']; // the ones that leave time uncounted until a manager adds a punch
/* an open request from the person that covers this missing punch */
function askedFor(sid, x) {
  const kinds = x.type === 'missing-out' ? ['out'] : x.type === 'no-return' ? ['back', 'out'] : x.type === 'lunch-out' ? ['back'] : ['in', 'back'];
  return reqsOf(sid, 'open').find(r => r.ps.some(p => kinds.includes(p.k) && TCE.dayOf(p.t) === x.day)) || null;
}
function weekBar(w, set) {
  if (w.sal) return '<div class="wBar sal" title="' + esc(TCE.hText(w.total) + ' (salaried: kept for the record)') + '"><span style="width:' + Math.min(100, w.total / (w.limit * 1.1) * 100).toFixed(2) + '%"></span></div>';
  const lim = w.limit, max = Math.max(lim * 1.1, w.total, w.approved || 0), pct = x => Math.min(100, x / max * 100);
  const cls = w.total >= lim ? 'bad' : (set.thr.length && w.total >= Math.min.apply(null, set.thr) * TCE.HOUR) ? 'warn' : 'ok';
  const ticks = set.thr.map(t => '<i class="tk" style="left:' + pct(t * TCE.HOUR).toFixed(2) + '%"></i>').join('') + '<i class="tk ot" style="left:' + pct(lim).toFixed(2) + '%"></i>';
  return '<div class="wBar ' + cls + '" title="' + esc(TCE.hText(w.total) + ' of ' + set.ot + ' h') + '"><span style="width:' + pct(w.total).toFixed(2) + '%"></span>' + ticks + '</div>';

function etaText(w) {
  if (w.sal) return 'Salaried';

  if (w.eta.ot) return 'Hits ' + S.set.ot + ' h at ' + whenText(w.eta.ot, nowMs());

}

/* ---------- Now ---------- */
VIEWS.now = () => {

  if (!list.length) return '<div class="card"><div class="cardBd" style="padding-top:18px">Nobody is on the time clock yet. Add people in <button class="linkBtn" data-act="go" data-v="people">People</button>.</div></div>';

  const issues = [];

    w.issues.forEach(x => { if (FIXME.includes(x.type)) issues.push({ sid: r.sid, x }); });
    const lk = lockedUntil(r.sid); if (lk) issues.push({ sid: r.sid, x: { type: 'pin', until: lk } });
  });

    '<div class="tile ' + (issues.length + asks.length ? 'red' : '') + '"><span class="n">' + (issues.length + asks.length) + '</span><span class="l">To fix</span></div></div>';
  const rows = ws.map(({ r, w }) => {
    const d = w.days.find(x => x.iso === today) || { ms: 0, flags: [] };

    return '<button class="nowRow" data-act="openSheet" data-sid="' + esc(r.sid) + '"><span class="nWho">' + avatar(r.sid) + '<b class="pt">' + esc(nameOf(r.sid)) + '</b></span>' +
      '<span class="nState">' + stateChip(w) + (w.since && w.state !== 'out' ? ' <span class="muted small">' + esc(TCE.timeText(w.since)) + '</span>' : '') + '</span>' +
      '<span class="nToday num"><span class="mLbl">Today </span>' + esc(TCE.hText(d.ms)) + '</span>' +
      '<span class="nWeek"><span class="wTot"><b>' + esc(TCE.hText(w.total)) + '</b>' + weekBar(w, S.set) + '</span></span>' +
      '<span class="nEta small">' + esc(etaText(w)) + (w.cap && w.cap < w.limit ? '<span class="muted"> Cap ' + esc(TCE.h2(w.cap)) + ' h</span>' : '') + '</span>' +
      '<span class="nFlags">' + flags + '</span></button>';
  }).join('');
  const issueRows = issues.map(({ sid, x }) => {
    if (x.type === 'pin') return '<div class="issue">' + avatar(sid) + '<div class="grow"><b>' + esc(nameOf(sid)) + '</b>: 5 wrong PINs at the time clock — locked until ' + esc(TCE.timeText(x.until)) + '.</div><button class="btn btn-sec btn-sm" data-act="clearTry" data-sid="' + esc(sid) + '">Clear the lockout</button></div>';
    const txt = x.type === 'missing-out' ? (x.kind === 'back' ? 'came back from lunch at ' : 'clocked in at ') + TCE.timeText(x.t) + ' on ' + TCE.dayText(x.day) + ' and never clocked out (' + (x.kind === 'back' ? 'the afternoon counts' : 'it counts') + ' 0 until the clock-out is added).'
      : x.type === 'no-in' ? (x.kind === 'out' ? 'clocked out at ' : 'went to lunch at ') + TCE.timeText(x.t) + ' on ' + TCE.dayText(x.day) + ' without clocking in (that time counts 0 until the clock-in is added).'
        : x.type === 'lunch-out' ? 'went to lunch at ' + TCE.timeText(x.lunchT) + ' on ' + TCE.dayText(x.day) + ' and clocked out at ' + TCE.timeText(x.t) + ' without coming back from lunch (if they worked the afternoon, add Back from lunch: until then it counts 0).'

  }).join('');
  return alertHealthHTML() + tiles +
    (asks.length ? '<div class="card" style="margin-bottom:18px"><div class="cardHd"><h3>' + ic('edit', 18) + ' Asked to fix</h3><span class="sub">Missed punches and notes from staff. A punch counts once you approve it.</span></div><div class="cardBd">' + asks.map(reqRowHTML).join('') + '</div></div>' : '') +

    '<div class="nowList"><div class="nowHead"><span>Person</span><span>Now</span><span class="num">Today</span><span>This week</span><span>Overtime</span><span>Today’s flags</span></div>' + rows + '</div></div>';
};
/* the alert script: a warning on Now when it hasn't checked in lately */
function alertHealthHTML() {
  if (!S.got.beat) return '';
  const last = S.beat.reduce((m, b) => Math.max(m, b.at), 0), now = nowMs();
