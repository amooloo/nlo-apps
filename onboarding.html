<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2F4C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NLO Training">
<title>NLO Onboarding — Next Level Orthodontics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1B2F4C;--navy-700:#294169;--navy-900:#11203A;--navy-500:#5471A0;--navy-100:#E8ECF2;
  --blue:#1D3EA9;--blue-700:#16318C;--blue-100:#E5EAF8;--blue-200:#BCC8EE;
  --coral:#FA624D;--coral-700:#D8412E;--coral-100:#FFE7E1;
  --mint:#64F4C9;--mint-700:#1F9E7E;--mint-100:#E2FBF4;--mint-200:#C0FBEC;
  --amber:#F6AF24;--amber-700:#B7790A;--amber-100:#FEF2D7;
  --g50:#F7F8F9;--g100:#ECEEF0;--g200:#DCE0E4;--g300:#C3C9D0;--g400:#969FAB;--g500:#6B7685;--g600:#4C5868;--g700:#33404F;
  --off:#F2F3F4;--card:#fff;
  --fb:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fd:'Oswald','Montserrat',system-ui,sans-serif;
  --r:14px;--rs:10px;
  --sh:0 1px 3px rgba(27,47,76,.07),0 4px 16px rgba(27,47,76,.05);
  --sh2:0 6px 24px rgba(27,47,76,.14);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--fb);background:var(--off);color:var(--navy);min-height:100vh;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--blue)}
img{max-width:100%}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;box-shadow:0 2px 12px rgba(17,32,58,.25)}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;min-width:0}
.brand img{height:30px;width:auto;display:block}
.brand-t{font-family:var(--fd);font-size:18px;letter-spacing:.6px;text-transform:uppercase;font-weight:500;white-space:nowrap}
.brand-t small{display:block;font-family:var(--fb);font-size:10px;letter-spacing:1.6px;opacity:.6;font-weight:600;margin-top:-2px}
.top-sp{flex:1}
.who{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border-radius:999px;background:rgba(255,255,255,.1);color:#fff;font-weight:600;font-size:13px;max-width:220px}
.who:hover{background:rgba(255,255,255,.18)}
.who span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;color:#fff;background:var(--blue);letter-spacing:.3px}
.av.lg{width:46px;height:46px;font-size:16px}
.av.xl{width:64px;height:64px;font-size:22px}
.menu{position:absolute;right:12px;top:52px;background:#fff;color:var(--navy);border-radius:12px;box-shadow:var(--sh2);min-width:230px;padding:6px;z-index:60}
.menu button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:8px;font-weight:600;font-size:14px}
.menu button:hover{background:var(--g50)}
.menu .sep{height:1px;background:var(--g100);margin:4px 6px}
.menu .mhd{padding:8px 12px 6px;font-size:12px;color:var(--g500);font-weight:600}
.netbar{background:var(--amber-100);color:var(--amber-700);font-size:13px;font-weight:600;text-align:center;padding:6px 12px}

/* ---------- layout ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 110px}
.narrow{max-width:760px}
.h1{font-family:var(--fd);font-weight:500;font-size:30px;letter-spacing:.3px;line-height:1.15;color:var(--navy)}
.h2{font-family:var(--fd);font-weight:500;font-size:21px;letter-spacing:.3px;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.h2 .cnt{font-family:var(--fb);font-size:12px;font-weight:700;background:var(--g100);color:var(--g600);padding:2px 9px;border-radius:999px}
.sub{color:var(--g500);font-size:14px;margin-top:4px}
.muted{color:var(--g500)}
.tiny{font-size:12px;color:var(--g500)}
.row{display:flex;align-items:center;gap:10px}
.row.fw{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card+.card{margin-top:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--g600);font-weight:600;font-size:14px;padding:6px 8px 6px 2px;margin:-4px 0 8px;border-radius:8px}
.back:hover{color:var(--navy)}
.crumb{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--g500);margin-bottom:4px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px;padding:11px 18px;border-radius:10px;border:1.5px solid transparent;transition:background .15s,transform .05s,border-color .15s;white-space:nowrap;text-decoration:none;line-height:1.2}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn-p{background:var(--blue);color:#fff}
.btn-p:hover{background:var(--blue-700)}
.btn-s{background:#fff;color:var(--navy);border-color:var(--g200)}
.btn-s:hover{border-color:var(--navy-500)}
.btn-g{color:var(--blue);padding:8px 10px}
.btn-g:hover{background:var(--blue-100)}
.btn-ok{background:var(--mint-700);color:#fff}
.btn-ok:hover{background:#17826a}
.btn-d{background:#fff;color:var(--coral-700);border-color:var(--coral-100)}
.btn-d:hover{background:var(--coral-100)}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn-lg{padding:14px 22px;font-size:15px}
.btn-block{width:100%;white-space:normal;text-align:center}
.btn{max-width:100%}
.icon-btn{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--g600)}
.icon-btn:hover{background:var(--g100);color:var(--navy)}

/* ---------- pills & bars ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;letter-spacing:.2px}
.p-ok{background:var(--mint-100);color:var(--mint-700)}
.p-warn{background:var(--amber-100);color:var(--amber-700)}
.p-bad{background:var(--coral-100);color:var(--coral-700)}
.p-info{background:var(--blue-100);color:var(--blue)}
.p-grey{background:var(--g100);color:var(--g600)}
.p-navy{background:var(--navy);color:#fff}
.bar{height:8px;background:var(--g100);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:999px;transition:width .4s}
.bar.ok>i{background:var(--mint-700)}
.bar.thin{height:5px}
.ring{position:relative;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;font-family:var(--fd);font-weight:500}
.tc-navy{--tc:var(--navy);--tcl:var(--navy-100)}
.tc-blue{--tc:var(--blue);--tcl:var(--blue-100)}
.tc-coral{--tc:var(--coral-700);--tcl:var(--coral-100)}
.tc-mint{--tc:var(--mint-700);--tcl:var(--mint-100)}
.tc-gold{--tc:var(--amber-700);--tcl:var(--amber-100)}

/* ---------- sign-in / gate ---------- */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,var(--navy) 0%,var(--navy-900) 100%)}
.gate-card{background:#fff;border-radius:18px;max-width:420px;width:100%;padding:32px 26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.gate-card .logo{background:var(--navy);border-radius:14px;padding:14px;display:inline-block;margin-bottom:18px}
.gate-card .logo img{height:54px;display:block}
.gate-card h1{font-family:var(--fd);font-weight:500;font-size:26px;letter-spacing:.4px;margin-bottom:6px}
.gate-card p{color:var(--g600);font-size:14px;margin-bottom:18px}
.gate-card .err{background:var(--coral-100);color:var(--coral-700);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:14px;text-align:left}
.gate-card .alt{margin-top:18px;padding-top:16px;border-top:1px solid var(--g100);font-size:13px;color:var(--g500);text-align:left}
.spin{width:34px;height:34px;border:3px solid var(--g200);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;margin:10px auto}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- picker ---------- */
.pcard{display:flex;align-items:center;gap:14px;background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:16px;text-align:left;width:100%;border:2px solid transparent;transition:border-color .15s,transform .1s}
.pcard:hover{border-color:var(--blue-200)}
.pcard:active{transform:scale(.99)}
.pcard .nm{font-weight:700;font-size:16px}
.pcard .tt{font-size:13px;color:var(--g500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--g200);border-radius:999px;padding:5px 14px 5px 5px;font-weight:600;font-size:14px}
.chip:hover{border-color:var(--navy-500)}
.chip .av{width:26px;height:26px;font-size:11px}
.owner-card{display:flex;align-items:center;gap:14px;background:var(--navy);color:#fff;border-radius:var(--r);padding:16px 18px;margin-top:18px}
.owner-card .btn-s{border-color:transparent}

/* ---------- PIN ---------- */
.pinbox{text-align:center;padding:4px 4px 8px}
.pin-dots{display:flex;justify-content:center;gap:14px;margin:18px 0 8px}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--navy-500);display:block;transition:background .1s}
.pin-dots i.on{background:var(--navy);border-color:var(--navy)}
.pin-dots.shake{animation:shk .35s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pin-msg{min-height:22px;font-size:13px;font-weight:600;color:var(--coral-700)}
.pin-pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center;margin-top:10px}
.pin-pad button{height:64px;border-radius:50%;background:var(--g50);font-size:24px;font-weight:600;font-family:var(--fd);border:1.5px solid var(--g100)}
.pin-pad button:hover{background:var(--g100)}
.pin-pad button.fn{font-family:var(--fb);font-size:13px;background:none;border-color:transparent;color:var(--g600)}

/* ---------- trainee home ---------- */
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-700) 100%);color:#fff;border-radius:18px;padding:22px 20px;display:flex;gap:18px;align-items:center;box-shadow:var(--sh2);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(100,244,201,.08)}
.hero .h1{color:#fff}
.hero .sub{color:rgba(255,255,255,.72)}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.hero .pill{background:rgba(255,255,255,.14);color:#fff}
.hero .pill.p-ok{background:rgba(100,244,201,.2);color:var(--mint)}
.hero .pill.p-warn{background:rgba(246,175,36,.2);color:#FFD37A}
.hero .pill.p-bad{background:rgba(250,98,77,.22);color:#FFB2A6}
.next-card{margin-top:14px;display:flex;align-items:center;gap:14px;background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;border-left:5px solid var(--mint-700);width:100%;text-align:left}
.next-card:hover{box-shadow:var(--sh2)}
.next-card .lbl{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--mint-700)}
.next-card .t{font-weight:700;font-size:16px;margin-top:2px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:18px -2px 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;background:#fff;border:1.5px solid var(--g200);font-weight:700;font-size:14px;color:var(--g600)}
.tab .pct{font-size:12px;font-weight:700;color:var(--g500)}
.tab.on{border-color:var(--tc,var(--navy));color:var(--tc,var(--navy));background:var(--tcl,#fff)}
.tl{position:relative;margin-top:8px}
.phase{font-size:12px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--g500);margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.phase:after{content:"";flex:1;height:1px;background:var(--g200)}
.mcard{display:flex;gap:14px;align-items:flex-start;background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:15px 16px;width:100%;text-align:left;border:2px solid transparent;margin-bottom:10px;transition:border-color .15s}
.mcard:hover{border-color:var(--blue-200)}
.mcard .ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--tcl,var(--g100));color:var(--tc,var(--navy))}
.mcard.done .ico{background:var(--mint-100);color:var(--mint-700)}
.mcard .t{font-weight:700;font-size:15.5px;line-height:1.3}
.mcard .d{font-size:13px;color:var(--g500);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mcard .mm{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:9px;font-size:12px;color:var(--g500);font-weight:600}
.mcard .bar{margin-top:10px}
.mcard.done{opacity:.86}

/* ---------- module ---------- */
.mhead{display:flex;gap:16px;align-items:flex-start}
.mhead .ico{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--tcl,var(--g100));color:var(--tc,var(--navy))}
.llist{margin-top:14px;background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.litem{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--g100);width:100%;text-align:left}
.litem:first-child{border-top:0}
.litem:hover{background:var(--g50)}
.litem .k{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--g50);color:var(--g600)}
.litem .t{font-weight:600;font-size:15px;line-height:1.35}
.litem .s{font-size:12px;color:var(--g500);margin-top:1px}
.st{width:26px;height:26px;border-radius:50%;border:2px solid var(--g300);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.st.done{background:var(--mint-700);border-color:var(--mint-700)}
.st.ready{background:var(--amber);border-color:var(--amber)}
.st.part{border-color:var(--blue);background:conic-gradient(var(--blue) var(--p,50%),#fff 0)}
.st.fail{border-color:var(--coral)}
details.src{margin-top:16px}
details.src summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--g600);padding:6px 0}
details.src ul{margin:6px 0 0 18px;font-size:13px}
details.src li{margin:3px 0}
.review{background:var(--amber-100);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:13px;color:var(--navy)}
.review b{color:var(--amber-700)}

/* ---------- lesson ---------- */
.lhead{margin-bottom:14px}
.kind{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--blue-100);color:var(--blue)}
.kind.k-quiz{background:#EFE7FB;color:#6D3FA0}
.kind.k-skill{background:var(--amber-100);color:var(--amber-700)}
.kind.k-ack{background:var(--coral-100);color:var(--coral-700)}
.kind.k-task{background:var(--mint-100);color:var(--mint-700)}
.kind.k-sop{background:var(--mint-100);color:var(--mint-700)}
.kind.k-doc,.kind.k-video{background:var(--navy-100);color:var(--navy)}
.lbody{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:22px 20px}
.actbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--g200);padding:10px 16px calc(10px + var(--safe-b))}
.actbar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.actbar .state{flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--g600)}
.actbar .state.ok{color:var(--mint-700)}

/* ---------- markdown ---------- */
.md{font-size:15.5px;line-height:1.65;color:var(--g700)}
.md>*+*{margin-top:12px}
.md>*:first-child{margin-top:0}
.md h2{font-family:var(--fd);font-weight:500;font-size:21px;color:var(--navy);letter-spacing:.2px;margin-top:22px;line-height:1.25}
.md h3{font-size:16px;font-weight:800;color:var(--navy);margin-top:18px}
.md h4{font-size:15px;font-weight:700;color:var(--navy);margin-top:14px}
.md ul,.md ol{padding-left:22px}
.md li{margin:5px 0}
.md li>ul,.md li>ol{margin-top:4px}
.md strong{color:var(--navy);font-weight:700}
.md code{background:var(--g100);padding:1px 6px;border-radius:5px;font-size:.92em}
.md table{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--g200);padding:8px 10px;text-align:left;vertical-align:top}
.md th{background:var(--g50);font-weight:700;color:var(--navy)}
.md .fig{margin:16px 0 4px;text-align:center}
.md .fig a{display:block}
.md .fig img{display:block;max-width:100%;height:auto;margin:0 auto;background:#fff;border:1px solid var(--g200);border-radius:12px;padding:10px}
.md .fig figcaption{font-size:13.5px;line-height:1.45;color:var(--g600);margin-top:8px}
.co{border-radius:12px;padding:12px 14px;border-left:4px solid var(--blue);background:var(--blue-100);color:var(--navy)}
.co-tip{border-color:var(--mint-700);background:var(--mint-100)}
.co-imp{border-color:var(--amber);background:var(--amber-100)}
.co-safe{border-color:var(--coral);background:var(--coral-100)}
.co-ask{border-color:var(--navy);background:var(--navy-100)}
a.soplink{font-weight:700;text-decoration:none;border-bottom:1.5px dotted currentColor;color:var(--mint-700)}

/* ---------- SOP frame ---------- */
.sopwrap{margin-top:16px;border:1.5px solid var(--mint-200);border-radius:var(--r);overflow:hidden;background:#fff}
.sophd{display:flex;align-items:center;gap:10px;background:var(--mint-100);padding:12px 14px}
.sophd .c{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--mint-700)}
.sophd .t{font-weight:700}
.sopframe{display:block;width:100%;border:0;min-height:180px}
.sopload{padding:28px;text-align:center;color:var(--g500);font-size:14px}

/* ---------- quiz ---------- */
.q{padding:16px 0;border-top:1px solid var(--g100)}
.q:first-child{border-top:0;padding-top:4px}
.q .qt{font-weight:700;font-size:15.5px;margin-bottom:10px;display:flex;gap:10px}
.q .qn{font-family:var(--fd);color:var(--g400);font-weight:500;flex-shrink:0}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:11px 13px;border:1.5px solid var(--g200);border-radius:11px;margin-top:8px;font-size:15px;background:#fff;line-height:1.4}
.opt:hover{border-color:var(--blue-200)}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--g300);flex-shrink:0;margin-top:1px}
.opt.sel{border-color:var(--blue);background:var(--blue-100)}
.opt.sel .dot{border:6px solid var(--blue)}
.opt.right{border-color:var(--mint-700);background:var(--mint-100)}
.opt.right .dot{border:6px solid var(--mint-700)}
.opt.wrong{border-color:var(--coral);background:var(--coral-100)}
.opt.wrong .dot{border:6px solid var(--coral)}
.opt[disabled]{cursor:default}
.why{margin-top:8px;font-size:13.5px;padding:9px 12px;border-radius:9px;background:var(--g50);color:var(--g700)}
.score{display:flex;align-items:center;gap:16px;border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
.score.pass{background:var(--mint-100)}
.score.fail{background:var(--coral-100)}
.score .big{font-family:var(--fd);font-size:34px;line-height:1}

/* ---------- skills, tasks, acks ---------- */
.crit{list-style:none;padding:0;margin-top:10px}
.crit li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--g200);font-size:14.5px}
.crit li:first-child{border-top:0}
.crit li .b{width:22px;height:22px;border-radius:6px;border:2px solid var(--g300);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;color:#fff}
.crit li.ck .b{background:var(--mint-700);border-color:var(--mint-700)}
.signed{display:flex;gap:12px;align-items:center;background:var(--mint-100);border-radius:12px;padding:12px 14px;margin-top:14px}
.feedback{background:var(--amber-100);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px}
.steps{list-style:none;padding:0}
.steps li{margin:0}
.steps button{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 4px;border-top:1px solid var(--g100);font-size:15px}
.steps li:first-child button{border-top:0}
.steps .b{width:24px;height:24px;border-radius:7px;border:2px solid var(--g300);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff}
.steps .on .b{background:var(--mint-700);border-color:var(--mint-700)}
.steps .on span.tx{color:var(--g500);text-decoration:line-through}
.ackbox{margin-top:18px;border:1.5px solid var(--coral-100);border-radius:12px;padding:16px;background:#FFF9F7}
.ackbox .stmt{font-weight:700;margin-bottom:12px}
.vid{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:var(--navy-900);margin-top:14px}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* ---------- forms ---------- */
.fld{margin-top:14px}
.fld>label{display:block;font-size:13px;font-weight:700;color:var(--g700);margin-bottom:6px}
.fld .hint{font-size:12px;color:var(--g500);margin-top:4px}
.in,select.in,textarea.in{width:100%;border:1.5px solid var(--g200);border-radius:10px;padding:10px 12px;background:#fff;font-size:15px;outline:none}
.in:focus{border-color:var(--blue)}
textarea.in{min-height:90px;resize:vertical;line-height:1.5}
textarea.in.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;min-height:220px}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;font-weight:600;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--blue)}
.seg{display:inline-flex;background:var(--g100);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:7px 12px;border-radius:8px;font-weight:700;font-size:13px;color:var(--g600)}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* ---------- dashboard ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:16px}
.stat{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;text-align:left;width:100%}
.stat .n{font-family:var(--fd);font-size:30px;line-height:1.1}
.stat .l{font-size:12px;font-weight:700;color:var(--g500);letter-spacing:.3px}
.stat.warn .n{color:var(--amber-700)}
.stat.bad .n{color:var(--coral-700)}
.stat.ok .n{color:var(--mint-700)}
.prow{display:flex;align-items:center;gap:14px;background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;margin-bottom:10px;width:100%;text-align:left;border:2px solid transparent}
.prow:hover{border-color:var(--blue-200)}
.prow .nm{font-weight:700;font-size:15px}
.prow .mt{font-size:12.5px;color:var(--g500);margin-top:2px}
.prow .pb{width:180px;flex-shrink:0}
.prow .pb .bar{margin-top:5px}
.tchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tchip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--tcl);color:var(--tc)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--g500);text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--g200);font-weight:800}
.tbl td{padding:10px;border-bottom:1px solid var(--g100);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tblwrap{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow-x:auto}
.toggle{position:relative;width:42px;height:24px;border-radius:999px;background:var(--g300);transition:background .15s;flex-shrink:0}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--mint-700)}
.toggle.on:after{left:21px}
.toggle[disabled]{opacity:.4;cursor:not-allowed}
.mrow{border-top:1px solid var(--g100)}
.mrow:first-child{border-top:0}
.mrow>button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px}
.mrow>button:hover{background:var(--g50)}
.mrow .lrows{padding:0 14px 12px 50px}
.lrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px dashed var(--g100);font-size:14px}
.lrow:first-child{border-top:0}
.lrow .x{font-size:12px;color:var(--g500)}
.logl{list-style:none;padding:0;font-size:13.5px}
.logl li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--g100)}
.logl li:first-child{border-top:0}
.logl .when{color:var(--g500);width:92px;flex-shrink:0;font-size:12px;padding-top:1px}
.empty{text-align:center;padding:34px 18px;color:var(--g500)}
.empty .ic{width:56px;height:56px;border-radius:16px;background:var(--g100);color:var(--g500);display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px}
.empty b{display:block;color:var(--navy);font-size:16px;margin-bottom:4px}
.qr{background:#fff;padding:14px;border-radius:12px;display:inline-block;border:1.5px solid var(--g200)}
.qr svg{display:block;width:210px;height:210px}
.linkbox{display:flex;gap:8px;margin-top:12px}
.linkbox input{flex:1;font-size:13px}

/* ---------- editor ---------- */
.ed-l{border:1.5px solid var(--g200);border-radius:12px;margin-top:10px;background:#fff}
.ed-l>.hd{display:flex;align-items:center;gap:10px;padding:10px 12px}
.ed-l>.hd .t{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-l>.bd{padding:0 14px 14px;border-top:1px solid var(--g100)}
.ed-q{border:1px solid var(--g200);border-radius:10px;padding:12px;margin-top:10px;background:var(--g50)}
.ed-opt{display:flex;gap:8px;align-items:center;margin-top:6px}
.ed-opt input[type=radio]{width:18px;height:18px;accent-color:var(--mint-700);flex-shrink:0}
.preview{border:1.5px dashed var(--g200);border-radius:12px;padding:14px;margin-top:8px;background:var(--g50)}

/* ---------- modal ---------- */
.ovl{position:fixed;inset:0;background:rgba(17,32,58,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;animation:fi .15s}
@keyframes fi{from{opacity:0}}
.sheet{background:#fff;border-radius:18px;max-width:520px;width:100%;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:up .18s}
.sheet.wide{max-width:760px}
@keyframes up{from{transform:translateY(16px);opacity:.6}}
.sh-h{display:flex;align-items:center;gap:10px;padding:18px 20px 6px}
.sh-h h3{flex:1;font-family:var(--fd);font-weight:500;font-size:22px;letter-spacing:.2px}
.sh-b{padding:8px 20px 18px}
.sh-f{display:flex;gap:10px;justify-content:flex-end;padding:12px 20px 18px;flex-wrap:wrap}
@media (max-width:600px){
  .ovl{align-items:flex-end;padding:0}
  .sheet{border-radius:18px 18px 0 0;max-height:92vh;padding-bottom:var(--safe-b)}
}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;top:66px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:520px}
.toast{background:var(--navy);color:#fff;border-radius:12px;padding:11px 16px;font-size:14px;font-weight:600;box-shadow:var(--sh2);animation:up .2s;pointer-events:auto}
.toast.bad{background:var(--coral-700)}
.toast.ok{background:var(--mint-700)}

/* ---------- AISA ---------- */
.aisa-fab{position:fixed;right:16px;bottom:calc(84px + var(--safe-b));z-index:35;display:flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border-radius:999px;padding:12px 16px 12px 14px;font-weight:700;font-size:14px;box-shadow:var(--sh2)}
.aisa-fab:hover{background:var(--navy-700)}
.aisa-fab.low{bottom:calc(20px + var(--safe-b))}
.aisa{position:fixed;right:16px;bottom:16px;z-index:90;width:400px;max-width:calc(100vw - 32px);height:min(620px,calc(100vh - 90px));background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden}
.aisa.anim{animation:up .18s}
.aisa-h{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;padding:14px 16px}
.aisa-h .t{flex:1;font-weight:700}
.aisa-h .t small{display:block;font-weight:500;font-size:11.5px;opacity:.7}
.aisa-h button{color:#fff}
.aisa-m{flex:1;overflow-y:auto;padding:14px;background:var(--g50);display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;padding:10px 13px;border-radius:14px;font-size:14.5px;line-height:1.5}
.bub.u{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.bub.a{align-self:flex-start;background:#fff;border:1px solid var(--g200);border-bottom-left-radius:4px}
.bub.a.md{font-size:14.5px}
.bub.a.md>*+*{margin-top:8px}
.aisa-f{display:flex;gap:8px;padding:10px;border-top:1px solid var(--g100);background:#fff}
.aisa-f textarea{flex:1;border:1.5px solid var(--g200);border-radius:12px;padding:9px 12px;resize:none;height:44px;max-height:120px;font-size:14.5px;outline:none}
.aisa-f textarea:focus{border-color:var(--blue)}
.aisa-note{font-size:11.5px;color:var(--g500);padding:0 14px 8px;background:#fff}
@media (max-width:600px){
  .aisa{right:0;bottom:0;width:100vw;max-width:100vw;height:88vh;border-radius:18px 18px 0 0}
  .h1{font-size:25px}
  .hero{padding:18px 16px}
  .prow{flex-wrap:wrap}
  .prow .pb{width:100%;padding-left:60px}
  .lbody{padding:18px 16px}
  .wrap{padding-left:12px;padding-right:12px}
  .brand-t small{display:none}
}

/* ---------- print ---------- */
@media print{
  body{background:#fff}
  .top,.actbar,.aisa-fab,.aisa,#toast,.noprint{display:none!important}
  .wrap{padding:0;max-width:none}
  .card,.tblwrap,.llist{box-shadow:none;border:1px solid var(--g200)}
}

<script>
'use strict';
/* =====================================================================
   NLO Onboarding — role-based training for new team members
   Next Level Orthodontics · single-file app, Firebase Realtime Database
   ---------------------------------------------------------------------
   Two ways in:
   1. Office computers: the office Google account (akhavan.ak@gmail.com or

   2. Phones: a personal link (#k=<key>) a manager creates. The phone signs

   Data lives at nlo/onboarding in the nlo-inventory database. Staff come
   from the shared office roster that Staff Hub publishes

   not in this file, because this file is public on GitHub.

const APP_VERSION = '1.0.0';
const FB_CONFIG = { apiKey: "AIzaSyBFCmDgAKkdfZ4Cb81nK0KCKXtONiwMJy4", authDomain: "nlo-inventory.firebaseapp.com", databaseURL: "https://nlo-inventory-default-rtdb.firebaseio.com", projectId: "nlo-inventory", storageBucket: "nlo-inventory.firebasestorage.app", messagingSenderId: "471691286148", appId: "1:471691286148:web:b362a98186f648bd4914d1" };
const ROOT = 'nlo/onboarding';
const ROSTER_PATH = 'nlo/cadence/roster/people';
const OWNER_EMAIL = 'akhavan.ak@gmail.com';
const OWNER_RID = 's_amir';
const STAFF_DOMAIN = 'thenextlevelorthodontics.com';
const SOP_URL = 'nlo-sop-manual.html';
const AISA_URL = 'https://aisa-worker.akhavan-ak.workers.dev';
const QR_LIB = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
const LS_DEVKEY = 'nloOnb.devKey';
const SS_ACTOR = 'nloOnb.actor';
/* set only by the automated test harness, and honored only on a local test server */
const TEST = (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && window.NLO_ONB_TEST) || null;
const LS_PINLOCK = 'nloOnb.pinLock';
const PIN_ITER = 150000;   /* PBKDF2 rounds for staff PINs */
const DEFAULT_SETTINGS = { officeDays: [1, 2, 3, 4], pass: 80, aisa: true, idleMin: 10 };
const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const KIND = {
  read:  { label: 'Read',        icon: 'book' },
  sop:   { label: 'SOP',         icon: 'clipboard' },
  doc:   { label: 'Document',    icon: 'file' },
  video: { label: 'Video',       icon: 'play' },
  quiz:  { label: 'Quiz',        icon: 'help' },
  skill: { label: 'Skill check', icon: 'award' },
  task:  { label: 'Checklist',   icon: 'list' },
  ack:   { label: 'Policy',      icon: 'pen' }
};
const TRACK_COLORS = ['navy', 'blue', 'coral', 'mint', 'gold'];
const TRACK_ICONS = ['star', 'tooth', 'flask', 'phone', 'calendar', 'chat', 'dollar', 'users', 'megaphone', 'shield', 'book', 'clipboard'];
const AV_COLORS = ['#1D3EA9', '#1F9E7E', '#D8412E', '#B7790A', '#294169', '#6D3FA0', '#0D8282', '#C95E00'];

/* ---------------- small helpers ---------------- */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
function esc(s) { return s == null ? '' : String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function clone(x) { return x == null ? x : JSON.parse(JSON.stringify(x)); }
function clean(x) { return JSON.parse(JSON.stringify(x, (k, v) => (v === undefined ? null : v))); }
function arr(x) { if (Array.isArray(x)) return x.filter(v => v != null); if (x && typeof x === 'object') return Object.keys(x).sort((a, b) => (+a) - (+b)).map(k => x[k]).filter(v => v != null); return []; }
function obj(x) { return x && typeof x === 'object' ? x : {}; }
function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
function pct(a, b) { return b ? Math.round(a * 100 / b) : 0; }
function plural(n, w, pl) { return n + ' ' + (n === 1 ? w : (pl || w + 's')); }
function firstName(p) { if (!p) return ''; return p.first || String(p.name || '').split(/\s+/)[0] || ''; }
function initials(name) { const w = String(name || '?').replace(/^Dr\.?\s+/i, '').trim().split(/\s+/).filter(Boolean); return ((w[0] || '?')[0] + (w.length > 1 ? w[w.length - 1][0] : '')).toUpperCase(); }
function avColor(id) { let h = 0; String(id || '').split('').forEach(c => { h = (h * 31 + c.charCodeAt(0)) >>> 0; }); return AV_COLORS[h % AV_COLORS.length]; }
function avatar(p, cls) { const n = p ? (p.name || p.first || '?') : '?'; return `<span class="av ${cls || ''}" style="background:${avColor(p && p.id)}">${esc(initials(n))}</span>`; }
function randId(n) { const a = 'abcdefghjkmnpqrstuvwxyz23456789'; const b = new Uint8Array(n || 8); crypto.getRandomValues(b); return Array.from(b, x => a[x % a.length]).join(''); }
function debounce(fn, ms) { let t; return function () { clearTimeout(t); const a = arguments; t = setTimeout(() => fn.apply(null, a), ms); }; }
function hex(buf) { return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join(''); }
async function sha256(s) { return hex(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s))); }
/* PIN hash: salted PBKDF2-SHA256 (records marked k:'p2'); older records used one salted SHA-256 */
async function pinHash(rec, pin) {
  if (rec && rec.k === 'p2') {
    const enc = new TextEncoder();
    const km = await crypto.subtle.importKey('raw', enc.encode(String(pin)), 'PBKDF2', false, ['deriveBits']);
    return hex(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode(rec.s), iterations: +rec.i || PIN_ITER }, km, 256));

  return sha256((rec ? rec.s : '') + ':' + pin);
}
function okKey(k) { return typeof k === 'string' && /^[A-Za-z0-9_-]{1,120}$/.test(k); }

/* ---------------- dates & office days ---------------- */
function ymd(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parseYmd(s) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || '')); return m ? new Date(+m[1], +m[2] - 1, +m[3], 12) : null; }
function addDays(d, n) { const x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
function today() { return TEST && TEST.today ? TEST.today : ymd(); }
function fmtDate(s, opt) { const d = typeof s === 'string' ? parseYmd(s) : s; if (!d) return ''; return d.toLocaleDateString('en-US', opt || { weekday: 'short', month: 'short', day: 'numeric' }); }
function fmtTs(ts) { if (!ts) return ''; const d = new Date(ts); return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ', ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); }
function ago(ts) {
  if (!ts) return 'never';
  const s = Math.round((Date.now() - ts) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  if (s < 86400 * 7) return Math.floor(s / 86400) + 'd ago';
  return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function officeDays() { const d = arr(S.settings.officeDays).map(Number).filter(n => n >= 0 && n <= 6); return d.length ? d : DEFAULT_SETTINGS.officeDays; }
function isOffice(d) { return officeDays().indexOf(d.getDay()) >= 0; }
function firstOffice(d) { let x = new Date(d.getTime()); for (let i = 0; i < 14 && !isOffice(x); i++) x = addDays(x, 1); return x; }
/* the date of training day n (Day 1 = the first office day on or after the start) */
function dateOfDay(start, n) {
  const s = parseYmd(start); if (!s) return null;
  let d = firstOffice(s), c = 1;
  let guard = 0;
  while (c < n && guard++ < 1000) { d = addDays(d, 1); if (isOffice(d)) c++; }
  return ymd(d);
}
/* which training day today is (0 = hasn't started yet) */
function dayNumber(start, on) {
  const s = parseYmd(start), t = parseYmd(on || today()); if (!s || !t) return 0;
  let d = firstOffice(s); if (t < d) return 0;
  let c = 0, guard = 0;
  while (d <= t && guard++ < 2000) { if (isOffice(d)) c++; d = addDays(d, 1); }
  return c;
}
/* office days from a to b (b later): used for "due in 2 days" */
function officeDaysBetween(a, b) {
  let d = parseYmd(a), e = parseYmd(b); if (!d || !e) return 0;
  let sign = 1; if (e < d) { const t = d; d = e; e = t; sign = -1; }
  let c = 0, guard = 0; while (d < e && guard++ < 2000) { d = addDays(d, 1); if (isOffice(d)) c++; }
  return c * sign;
}

/* ---------------- markdown (safe subset) ---------------- */
const SOP_CODE_RE = /\bSOP-([A-Z]{2,5})-([0-9]{1,4}[A-Z]?|[A-Z]{2,6})\b/g;
function mdInline(s) {
  s = esc(s);

  s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|mailto:[^\s)]+)\)/g, (m, t, u) => `<a href="${u.replace(/"/g, '%22')}" target="_blank" rel="noopener">${t}</a>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[\s(>])\*([^*\s][^*]*?)\*(?=[\s).,;:!?<]|$)/g, '$1<em>$2</em>');
  s = s.replace(SOP_CODE_RE, (m) => `<a href="#" class="soplink" data-act="openSop" data-sop="${esc(m.toLowerCase())}">${m}</a>`);
  s = s.replace(/\u0000(\d+)\u0000/g, (m, i) => '<code>' + codes[+i] + '</code>');
  return s;
}
function calloutKind(t) {
  const m = /^\s*\*\*([^*:]+):?\*\*/.exec(t); const k = m ? m[1].toLowerCase() : '';
  if (/tip/.test(k)) return 'tip';
  if (/safety|danger|warning/.test(k)) return 'safe';
  if (/important|note|remember/.test(k)) return 'imp';
  if (/ask/.test(k)) return 'ask';

}
/* images: a line of its own, ![caption](link). Links: https (Google Drive share links become

const IMG_RE = /^\s*!\[([^\]]*)\]\(\s*([^\s)]+)\s*\)\s*$/;
function imgSrc(u) {
  u = String(u || '').trim(); let m;
  if ((m = /^https:\/\/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{20,})/.exec(u))) return 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1600';
  if (/^https:\/\/[^\s"'<>]+$/.test(u)) return u;
  if (/^[a-z0-9][\w/-]*\.(png|jpe?g|gif|webp|svg)$/i.test(u) && u.indexOf('..') < 0) return u;

}

}
/* AISA answers may show pictures from NLO's own sources only: the app's picture folder and Drive thumbnails */
const TRUSTED_IMG_RE = /^(https:\/\/amooloo\.github\.io\/nlo-apps\/img\/|https:\/\/drive\.google\.com\/thumbnail\?|img\/onboarding\/)/;
function md(src, opt) {
  const trusted = !!(opt && opt.trustedImg);
  let text = String(src || '').replace(/\r\n?/g, '\n');
  if (trusted) text = text.replace(/!\[[^\]\n]*\]\([^)\s]+\)/g, m => '\n' + m + '\n'); /* a picture inside a sentence gets its own line */

  const isList = l => /^\s*([-*+]|\d+[.)])\s+/.test(l);
  const isTableSep = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
  const cells = l => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    let m;
    if (imgs && (m = IMG_RE.exec(line)) && okImg(m[2])) { out.push(figure(m[1], okImg(m[2]))); i++; continue; }
    if ((m = /^(#{1,4})\s+(.*)$/.exec(line))) {
      const lvl = clamp(m[1].length, 2, 4);
      out.push(`<h${lvl}>${mdInline(m[2])}</h${lvl}>`); i++; continue;
    }
    if (/^\s*>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
      const text = buf.join('\n').trim();
      out.push(`<div class="co co-${calloutKind(text)}">${text.split(/\n{2,}/).map(p => mdInline(p.replace(/\n/g, ' '))).join('<br><br>')}</div>`);
      continue;
    }
    if (/^\s*\|/.test(line) && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const head = cells(line); i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(cells(lines[i])); i++; }
      out.push('<table><thead><tr>' + head.map(h => `<th>${mdInline(h)}</th>`).join('') + '</tr></thead><tbody>' +
        rows.map(r => '<tr>' + head.map((_, j) => `<td>${mdInline(r[j] || '')}</td>`).join('') + '</tr>').join('') + '</tbody></table>');
      continue;
    }

      const block = [];
      while (i < lines.length && (isList(lines[i]) || (lines[i].trim() && /^\s{2,}/.test(lines[i]) && block.length))) { block.push(lines[i]); i++; }

function renderList(block) {
  /* items: {indent, ordered, text} ; continuation lines join the previous item */
  const items = [];

    const m = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(l);
    if (m) items.push({ ind: m[1].replace(/\t/g, '  ').length, ord: /\d/.test(m[2]), text: m[3] });
    else if (items.length) items[items.length - 1].text += ' ' + l.trim();

    const ord = items[pos].ord;
    let html = ord ? '<ol>' : '<ul>';

      if (items[pos].ind > level) {
        const sub = build(items[pos].ind);

/* =====================================================================
   SOP EMBED — loads the live SOP manual (same site) and shows one SOP.
   The manual is the source of truth, so edits there show up here.

const SOPS = { loading: null, byId: {}, byCode: {}, css: '', list: [], err: '' };
function loadSops() {
  if (SOPS.loading) return SOPS.loading;
  SOPS.loading = fetch(SOP_URL, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); }).then(t => {
    const doc = new DOMParser().parseFromString(t, 'text/html');
    SOPS.css = $$('style', doc).map(s => s.textContent).join('\n');
    $$('article.sop-card[id]', doc).forEach(a => {
      const title = (($('.sop-title', a) || {}).textContent || '').trim();
      const subt = (($('.sop-subtitle', a) || {}).textContent || '').replace(/\s+/g, ' ').trim();
      const code = (subt.split('·')[0] || '').replace(/^Legacy\s+/i, '').trim();
      const body = $('.sop-body', a);
      $$('script', body || a).forEach(x => x.remove());
      $$('*', body || a).forEach(x => Array.from(x.attributes).forEach(at => { if (/^on/i.test(at.name)) x.removeAttribute(at.name); }));
      redactSecrets(body || a);
      const e ={ id: a.id, title, subt, code, html: body ? body.innerHTML : '' };
      SOPS.byId[a.id] = e; SOPS.list.push(e);
      if (code) SOPS.byCode[code.toLowerCase()] = e;
    });
    return SOPS;
  }).catch(e => { SOPS.err = String(e && e.message || e); SOPS.loading = null; throw e; });
  return SOPS.loading;
}
/* never show a password from the SOP manual inside training */
function redactSecrets(root) {
  if (!root) return;
  const LBL = /pass\s?(?:word|code)/i, MASK = '•••••• (ask your lead)';
  $$('.info-item', root).forEach(it => { const lb = $('.label', it), v = $('.value', it); if (lb && v && LBL.test(lb.textContent)) v.textContent = MASK; });
  $$('tr', root).forEach(tr => { const c = tr.children; if (c.length > 1 && LBL.test(c[0].textContent) && c[0].textContent.trim().length < 30) for (let i = 1; i < c.length; i++) c[i].textContent = MASK; });
  const w = root.ownerDocument.createTreeWalker(root, 4 /* text nodes */);
  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(t => {
    const s = t.nodeValue || '';
    if (/pass\s?(?:word|code)\s*[:=]\s*$/i.test(s)) {
      /* "Password:" ends this text; the value is the next element or text */
      let n = t.nextSibling; while (n && n.nodeType === 3 && !n.nodeValue.trim()) n = n.nextSibling;
      if (n && n.nodeType === 1) n.textContent = MASK; else if (n && n.nodeType === 3) n.nodeValue = n.nodeValue.replace(/^\s*\S+/, ' ' + MASK);
    } else if (/pass\s?(?:word|code)\s*[:=]\s*\S/i.test(s)) t.nodeValue = s.replace(/(pass\s?(?:word|code)\s*[:=]\s*)\S+/gi, '$1' + MASK);
  });
}
function findSop(ref) {
  ref = String(ref || '').toLowerCase().trim();

/* ---------------- PIN pad ---------------- */
const PIN = { rid: null, val: '', first: '', mode: 'enter', purpose: 'login', fails: 0, lockUntil: 0, onOk: null, busy: false };
/* wrong-PIN counts survive a reload (per person, on this computer) */
function pinLockAll() { try { return JSON.parse(localStorage.getItem(LS_PINLOCK) || '{}') || {}; } catch (e) { return {}; } }
function pinLockGet(rid) { const r = pinLockAll()[rid] || {}; return { fails: +r.f || 0, lockUntil: +r.u || 0 }; }
function pinLockSave(rid, fails, lockUntil) {
  try { const a = pinLockAll(); if (!fails && !(lockUntil > Date.now())) delete a[rid]; else a[rid] = { f: fails, u: lockUntil }; localStorage.setItem(LS_PINLOCK, JSON.stringify(a)); } catch (e) { }
}
function openPin(rid, purpose, onOk, title) {
  const lk = pinLockGet(rid);
  Object.assign(PIN, { rid, val: '', first: '', purpose: purpose || 'login', onOk: onOk || null, busy: false, fails: lk.fails, lockUntil: lk.lockUntil, mode: S.pins[rid] && S.pins[rid].h ? 'enter' : 'create' });
  const p = person(rid);
  openModal(esc(title || (isOwner(rid) ? 'Dr. Akhavan' : 'Hi ' + firstName(p))), `<div class="pinbox" id="pinbox">${pinInner()}</div>`, '');
  if (PIN.lockUntil > Date.now()) setTimeout(pinRefresh, PIN.lockUntil - Date.now() + 100);
}
function pinInner() {
  const msg = PIN.mode === 'create' ? 'Create a 4-digit PIN you’ll remember' : PIN.mode === 'confirm' ? 'Enter the same PIN again' : (PIN.purpose === 'signoff' ? 'Trainer: enter your PIN to sign off' : 'Enter your PIN');
  const locked = PIN.lockUntil > Date.now();
  return `<div style="font-weight:700;color:var(--g700)">${esc(msg)}</div>
    <div class="pin-dots" id="pinDots">${[0, 1, 2, 3].map(i => `<i class="${PIN.val.length > i ? 'on' : ''}"></i>`).join('')}</div>
    <div class="pin-msg" id="pinMsg">${locked ? 'Too many tries — wait a moment.' : ''}</div>
    <div class="pin-pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-act="pinKey" data-k="${n}">${n}</button>`).join('')}
      <button class="fn" data-act="pinKey" data-k="c">Clear</button><button data-act="pinKey" data-k="0">0</button><button class="fn" data-act="pinKey" data-k="b">${ic('chevL', 22)}</button></div>
    ${PIN.mode === 'enter' ? `<p class="tiny" style="margin-top:14px">Forgot your PIN? A manager can reset it in People & access.</p>` : `<p class="tiny" style="margin-top:14px">Your PIN keeps your training yours on shared computers. Don’t use your birthday.</p>`}`;
}
function pinRefresh() { const b = $('#pinbox'); if (b) b.innerHTML = pinInner(); }
async function pinPress(k) {
  if (PIN.lockUntil > Date.now() || PIN.busy) return;
  if (k === 'c') PIN.val = ''; else if (k === 'b') PIN.val = PIN.val.slice(0, -1); else if (PIN.val.length < 4) PIN.val += k;
  pinRefresh();
  if (PIN.val.length < 4) return;
  const v = PIN.val;
  if (PIN.mode === 'create') { if (/^(\d)\1{3}$/.test(v) || v === '1234' || v === '0000') { PIN.val = ''; pinRefresh(); $('#pinMsg').textContent = 'Pick something less obvious than ' + v + '.'; return; } PIN.first = v; PIN.val = ''; PIN.mode = 'confirm'; pinRefresh(); return; }
  PIN.busy = true;
  try {
    if (PIN.mode === 'confirm') {
      if (v !== PIN.first) { PIN.val = ''; PIN.first = ''; PIN.mode = 'create'; pinRefresh(); $('#pinMsg').textContent = 'Those didn’t match — start again.'; shakePin(); return; }
      const rec = { s: randId(16), k: 'p2', i: PIN_ITER };
      rec.h = await pinHash(rec, v); rec.at = Date.now();
      const ok = await dbSet(ROOT + '/pins/' + PIN.rid, rec);
      if (!ok) { PIN.val = ''; pinRefresh(); return; }
      S.pins[PIN.rid] = rec;
      pinLockSave(PIN.rid, 0, 0);
      return pinSuccess();
    }
    const rec = S.pins[PIN.rid];
    const h = rec ? await pinHash(rec, v) : '';
    if (rec && h === rec.h) { PIN.fails = 0; pinLockSave(PIN.rid, 0, 0); return pinSuccess(); }
    PIN.fails++; PIN.val = '';
    if (PIN.fails >= 5) { PIN.lockUntil = Date.now() + 60000; PIN.fails = 0; setTimeout(pinRefresh, 60100); }
    pinLockSave(PIN.rid, PIN.fails, PIN.lockUntil);
    pinRefresh(); shakePin();
    $('#pinMsg').textContent = PIN.lockUntil > Date.now() ? 'Too many tries — wait a minute.' : 'That PIN isn’t right.';
  } finally { PIN.busy = false; }

/* =====================================================================
   LESSON
   ===================================================================== */
function lessonCtx(rid, mid, lid) {
  const m = mod(mid); if (!m) return null;
  const ls = lessons(m); const i = ls.findIndex(l => l.id === lid);
  if (i < 0) return null;
  return { m, l: ls[i], i, ls, prev: ls[i - 1] || null, next: ls[i + 1] || null, rid, self: rid === S.actor };
}
function viewLesson(rid, mid, lid) {

  if (c.self && !progOf(rid, m.id, l.id) && ['read', 'sop', 'doc', 'video'].indexOf(l.kind) >= 0) setTimeout(() => saveProg(rid, m.id, l.id, { opened: Date.now() }), 0);
  const k = KIND[l.kind] || { label: l.kind, icon: 'book' };
  let body = '';
  switch (l.kind) {
    case 'read': body = `<div class="md">${md(l.body)}</div>`; break;
    case 'sop': body = (l.body ? `<div class="md">${md(l.body)}</div>` : '') + `<div class="sopwrap"><div class="sophd">${ic('clipboard', 20)}<div class="grow"><div class="c">${esc(String(l.sop || '').toUpperCase())}</div><div class="t">Loading…</div></div></div><div data-sopframe="${esc(l.sop)}"></div></div>`; break;
    case 'doc': body = `<div class="md">${md(l.body)}</div>` + (officeOnlyHere(l) ? officeOnlyNote() : `<a class="btn btn-s btn-lg btn-block" style="margin-top:16px" href="${esc(l.url)}" target="_blank" rel="noopener">${ic('ext', 18)}Open the document</a><p class="tiny" style="margin-top:8px">Opens in Google Drive. If it asks you to sign in or request access, use the office Google account or ask your trainer.</p>`); break;
    case 'video': body = `<div class="md">${md(l.body)}</div>` + (officeOnlyHere(l) ? officeOnlyNote() : `${videoEmbed(l.url)}<a class="btn btn-s btn-sm" style="margin-top:10px" href="${esc(l.url)}" target="_blank" rel="noopener">${ic('ext', 15)}Open in Drive</a>`); break;
    case 'quiz': body = `<div id="quizBox">${quizHtml(c)}</div>`; break;
    case 'skill': body = `<div class="md">${md(l.body)}</div><div id="skillBox">${skillHtml(c)}</div>`; break;
    case 'task': body = (l.body ? `<div class="md" style="margin-bottom:10px">${md(l.body)}</div>` : '') + `<div id="taskBox">${taskHtml(c)}</div>`; break;
    case 'ack': body = `<div class="md">${md(l.body)}</div><div id="ackBox">${ackHtml(c)}</div>`; break;
    default: body = `<div class="md">${md(l.body)}</div>`;

    <button class="back" data-act="openModule" data-rid="${esc(rid)}" data-mid="${esc(m.id)}">${ic('chevL', 16)}${esc(m.title)}</button>
    <div class="lhead"><div class="row" style="gap:8px;margin-bottom:8px"><span class="kind k-${esc(l.kind)}">${ic(k.icon, 13)}${esc(k.label)}</span><span class="tiny">Step ${c.i + 1} of ${c.ls.length}${l.minutes ? ' · ' + l.minutes + ' min' : ''}</span>${!c.self ? `<span class="pill p-info">${esc(pname(rid))}</span>` : ''}</div>
    <div class="h1" style="font-size:26px">${esc(l.title)}</div></div>
    <div class="lbody">${body}</div>
  </div><div class="actbar"><div class="actbar-in" id="lessonDyn">${lessonActions(c)}</div></div>`;
}
function updateLessonDyn() {

/* lessons marked office:true (e.g. recordings of our real Edge system) don't open on phones */
function officeOnlyHere(l) { return !!(l && l.office) && S.mode === 'device'; }
function officeOnlyNote() { return `<div class="card" style="margin-top:14px;border-left:4px solid var(--amber)"><b>${ic('lock', 16)} Office computer only</b><div class="muted" style="margin-top:4px">This one may show patient information, so it only opens on an office computer. Watch it at the office and mark it done there.</div></div>`; }

function lessonActions(c) {
  const { m, l, rid } = c; const st = lessonState(rid, m, l); const done = st === 'done';
  const nextBtn = c.next ? `<button class="btn ${done ? 'btn-p' : 'btn-s'}" data-act="openLesson" data-rid="${esc(rid)}" data-mid="${esc(m.id)}" data-lid="${esc(c.next.id)}">Next ${ic('chevR', 16)}</button>`
    : `<button class="btn ${done ? 'btn-p' : 'btn-s'}" data-act="finishModule" data-rid="${esc(rid)}" data-mid="${esc(m.id)}">${modStats(rid, m).complete ? 'Module done' : 'Back to module'} ${ic('chevR', 16)}</button>`;

/* ---------------- quiz ---------------- */
function qKey(c) { return c.rid + '/' + c.m.id + '/' + c.l.id; }
function quizHtml(c) {
  const { l, rid, m } = c; const qs = arr(l.questions);
  const d = S.drafts[qKey(c)] || (S.drafts[qKey(c)] = { ans: {}, result: null });
  const p = progOf(rid, m.id, l.id); const done = lessonDone(rid, m, l);
  let head = '';
  if (d.result) {
    const r = d.result; const pass = r.pct >= passMark(l);
    head = `<div class="score ${pass ? 'pass' : 'fail'}"><div class="big">${r.pct}%</div><div class="grow"><b>${pass ? 'Passed — nice work!' : 'Not quite — review and try again'}</b><div class="tiny">${r.right} of ${r.total} correct · pass mark ${passMark(l)}%</div></div>${!pass || !done ? `<button class="btn btn-s btn-sm" data-act="quizRetry">Try again</button>` : `<button class="btn btn-s btn-sm" data-act="quizRetry">Retake</button>`}</div>`;
  } else if (done && !Object.keys(d.ans).length && !d.fresh) {
    head = `<div class="score pass"><div class="big">${p.best}%</div><div class="grow"><b>You passed this quiz</b><div class="tiny">Best score ${p.best}% · ${plural(p.tries || 1, 'try', 'tries')}</div></div>${c.self ? `<button class="btn btn-s btn-sm" data-act="quizRetry" data-fresh="1">Retake</button>` : ''}</div>`;
    return head;
  } else if (p && p.tries) {
    head = `<div class="tiny" style="margin-bottom:10px">Previous best: ${p.best}% (${plural(p.tries, 'try', 'tries')}). You need ${passMark(l)}% to pass.</div>`;
  } else {
    head = `<div class="tiny" style="margin-bottom:10px">${qs.length} questions · you need ${passMark(l)}% to pass · retake as often as you like</div>`;
  }
  if (!c.self) return head || `<div class="muted">Quiz — ${qs.length} questions.</div>`;
  const body = qs.map((q, qi) => {
    const sel = d.ans[qi]; const res = d.result;
    const opts = arr(q.options).map((o, oi) => {
      let cls = '';
      if (res) { if (oi === +q.answer) cls = 'right'; else if (oi === sel) cls = 'wrong'; }
      else if (oi === sel) cls = 'sel';
      return `<button class="opt ${cls}" ${res ? 'disabled' : ''} data-act="quizPick" data-q="${qi}" data-o="${oi}"><span class="dot"></span><span>${esc(o)}</span></button>`;
    }).join('');
    const why = res && q.why ? `<div class="why">${sel === +q.answer ? '<b style="color:var(--mint-700)">Correct.</b> ' : '<b style="color:var(--coral-700)">The answer is “' + esc(arr(q.options)[+q.answer]) + '”.</b> '}${esc(q.why)}</div>` : '';
    return `<div class="q"><div class="qt"><span class="qn">${qi + 1}</span><span>${esc(q.q)}</span></div>${opts}${why}</div>`;
  }).join('');
  const answered = Object.keys(d.ans).length;
  const submit = !d.result ? `<button class="btn btn-p btn-block btn-lg" style="margin-top:16px" data-act="quizSubmit" ${answered < qs.length ? 'disabled' : ''}>Submit answers${answered < qs.length ? ` (${answered}/${qs.length})` : ''}</button>` : '';
  return head + body + submit;
}

/* ---------------- skill ---------------- */
function skillHtml(c) {
  const { l, rid, m } = c; const so = signOf(rid, m.id, l.id); const p = progOf(rid, m.id, l.id) || {};
  const crit = arr(l.criteria);
  let html = `<div style="margin-top:18px"><div class="row" style="gap:8px;flex-wrap:wrap">${l.where ? `<span class="pill p-info">${esc(l.where)}</span>` : ''}${l.timed ? `<span class="pill p-warn">${ic('clock', 12)} Time yourself</span>` : ''}</div>
    <h3 style="font-size:15px;font-weight:800;margin-top:12px">What your trainer checks</h3><ul class="crit">${crit.map(x => `<li class="${so ? 'ck' : ''}"><span class="b">${so ? ic('check', 13, ' stroke-width="3"') : ''}</span><span>${esc(x)}</span></li>`).join('')}</ul></div>`;
  const fb = arr(p.feedback).slice(-1)[0];
  if (so) html += `<div class="signed">${ic('award', 26)}<div class="grow"><b>Signed off by ${esc(so.byName || pname(so.by))}</b><div class="tiny">${fmtTs(so.at)}${so.time ? ' · time ' + esc(so.time) : ''}</div>${so.note ? `<div style="margin-top:4px;font-size:14px">“${esc(so.note)}”</div>` : ''}</div></div>`;
  else if (fb) html += `<div class="feedback"><b>Not yet — feedback from ${esc(fb.byName || pname(fb.by))}</b> <span class="tiny">${fmtTs(fb.at)}</span><div style="margin-top:4px">${esc(fb.note || 'Keep practicing and ask again.')}</div></div>`;
  if (!so) {
    const btns = [];
    if (c.self && !p.ready) btns.push(`<button class="btn btn-s" data-act="skillReady">${ic('flag', 16)}I’ve practiced — ready for sign-off</button>`);
    if (c.self && p.ready) btns.push(`<span class="pill p-warn" style="padding:7px 12px">${ic('clock', 13)} Ready since ${esc(fmtTs(p.ready))}</span><button class="btn btn-g btn-sm" data-act="skillUnready">Not ready after all</button>`);
    if (S.mode === 'staff') btns.push(`<button class="btn btn-ok" data-act="signoffStart">${ic('award', 16)}Trainer sign-off</button>`);
    html += `<div class="row fw" style="margin-top:16px;gap:10px">${btns.join('')}</div>`;
    if (S.mode === 'device') html += `<p class="tiny" style="margin-top:10px">Your trainer signs off at the office on an office computer — tap “ready” here so they know.</p>`;
  } else if (S.mode === 'staff' && canTrain() && !c.self) {
    html += `<div style="margin-top:12px"><button class="btn btn-g btn-sm" data-act="signoffUndo">Undo sign-off</button></div>`;
  }
  return html;
}

let _cleanupAt = 0;

  if (!canManage() || !S.roster || Date.now() - _cleanupAt < 60000) return;

function logText(e, rid) {
  const m = mod(e.m); const l = m ? lessons(m).find(x => x.id === e.l) : null;
  const t = (l ? l.title : e.l || '') + (m ? ' (' + m.title + ')' : '');
  const by = e.by && e.by !== rid ? ' — ' + pname(e.by) : '';
  switch (e.t) {
    case 'done': return 'Finished ' + t + by;
    case 'undo': return 'Marked not done: ' + t + by;
    case 'quiz': return (e.pass ? 'Passed ' : 'Took ') + t + ' — ' + e.s + '%';
    case 'ready': return 'Ready for sign-off: ' + t;
    case 'signoff': return 'Signed off: ' + t + by;
    case 'unsign': return 'Sign-off removed: ' + t + by;
    case 'feedback': return 'Not yet: ' + t + by + (e.n ? ' — “' + e.n + '”' : '');
    case 'ack': return 'Acknowledged ' + t;
    case 'task': return 'Completed checklist ' + t;
    case 'assign': return 'Training plan ' + (e.n || 'updated') + by;
    case 'link': return 'Phone link ' + (e.n || 'created') + by;
    default: return (e.t || 'Update') + ' ' + t;
  }
}

/* ---------------- sign-off queue (trainers) ---------------- */
function signoffQueue() {
  const out = [];
  Object.keys(S.people).forEach(rid => {
    const plan = activePlan(rid); if (!plan || !S.catLoaded) return;
    planMods(plan).forEach(m => lessons(m).forEach(l => { if (l.kind === 'skill' && lessonState(rid, m, l) === 'ready') out.push({ rid, m, l, at: (progOf(rid, m.id, l.id) || {}).ready || 0 }); }));
  });
  return out.sort((a, b) => a.at - b.at);
}
function viewSignoffs() {
  const q = signoffQueue();
  const upcoming = [];
  planIds('active').forEach(rid => { const ps = planStats(rid); ps.mods.forEach(x => { if (x.st.complete) return; lessons(x.m).forEach(l => { if (l.kind === 'skill' && lessonState(rid, x.m, l) !== 'done' && lessonState(rid, x.m, l) !== 'ready' && x.m.day <= ps.day + 3) upcoming.push({ rid, m: x.m, l, due: x.due }); }); }); });
  const item = x => `<button class="prow" data-act="openLesson" data-rid="${esc(x.rid)}" data-mid="${esc(x.m.id)}" data-lid="${esc(x.l.id)}">${avatar(person(x.rid))}<div class="grow"><div class="nm">${esc(x.l.title)}</div><div class="mt">${esc(pname(x.rid))} · ${esc(x.m.title)}${x.at ? ' · ready ' + esc(ago(x.at)) : x.due ? ' · target ' + fmtDate(x.due) : ''}</div></div>${ic('chevR', 20)}</button>`;
  return `<div class="wrap narrow"><div class="h1">Sign-offs</div><div class="sub">Hands-on skills trainees say they’re ready for. Watch them do it, check each item, then sign with your PIN.</div>
    <div class="h2">Ready now <span class="cnt">${q.length}</span></div>
    ${q.length ? q.map(item).join('') : `<div class="card empty"><span class="ic">${ic('award', 26)}</span><b>Nothing waiting</b>When a trainee taps “ready for sign-off”, it shows up here.</div>`}

}

async function soCommit(kind) {
  const so = S.ui.so; if (!so) return;
  const by = ($('#soBy') || {}).value; const note = (($('#soNote') || {}).value || '').trim(); const time = (($('#soTime') || {}).value || '').trim();
  if (!by) { toast('Choose the trainer who watched.', 'bad'); return; }
  const allChecked = $$('.soCrit').every(x => x.checked);
  if (kind === 'sign' && !allChecked) { toast('Check every item first — or choose “Not yet” and leave a note.', 'bad'); return; }
  if (kind === 'feedback' && !note) { toast('Add a short note so they know what to practice.', 'bad'); $('#soNote') && $('#soNote').focus(); return; }
  const finish = async () => {
    const base = P(so.rid);
    if (kind === 'sign') {
      const rec = { by, byName: pname(by), at: Date.now(), note: note || null, time: time || null };
      if (!S.people[so.rid]) S.people[so.rid] = { plan: null, progress: {}, signoffs: {}, log: {} };
      (S.people[so.rid].signoffs[so.mid] || (S.people[so.rid].signoffs[so.mid] = {}))[so.lid] = rec;
      await dbSet(base + '/signoffs/' + so.mid + '/' + so.lid, rec);
      await logEvent(so.rid, { t: 'signoff', m: so.mid, l: so.lid, by });
      toast('Signed off ✓', 'ok');
    } else {
      const p = progOf(so.rid, so.mid, so.lid) || {};
      const fb = arr(p.feedback).concat([{ by, byName: pname(by), at: Date.now(), note }]).slice(-5);
      await saveProg(so.rid, so.mid, so.lid, { feedback: fb, ready: null });
      await logEvent(so.rid, { t: 'feedback', m: so.mid, l: so.lid, by, n: note });
      toast('Feedback saved');
    }
    S.ui.so = null; render(false);
  };
  /* the trainer who is signed in to the app doesn't need to re-enter a PIN */
  if (by === S.actor || (by === OWNER_RID && isOwnerSession())) { closeModal(); return finish(); }

}

async function linkCreate(rid, quiet) {

async function linkRevoke(rid) {

}

function edValidate(m) {
  const errs = [];
  if (!m.title.trim()) errs.push('The module needs a title.');
  if (!arr(m.tracks).length) errs.push('Pick at least one track.');
  if (!arr(m.lessons).length) errs.push('Add at least one step.');
  arr(m.lessons).forEach((l, i) => {
    const n = 'Step ' + (i + 1) + ' (' + (l.title || KIND[l.kind].label) + ')';
    if (!String(l.title || '').trim()) errs.push(n + ': needs a title.');
    if (l.kind === 'sop' && !l.sop) errs.push(n + ': choose an SOP.');
    if ((l.kind === 'doc' || l.kind === 'video') && !/^https:\/\//.test(l.url || '')) errs.push(n + ': needs an https:// link.');
    if (l.kind === 'quiz') {
      if (!arr(l.questions).length) errs.push(n + ': add questions.');
      arr(l.questions).forEach((q, qi) => {
        /* drop blank options, and keep the marked answer pointing at the same option */
        const src = Array.isArray(q.options) ? q.options : obj(q.options);
        const raw = Array.from({ length: Math.max(4, Array.isArray(src) ? src.length : Object.keys(src).length) }, (_, oi) => String(src[oi] == null ? '' : src[oi]).trim());
        const keep = raw.map((o, oi) => o ? oi : -1).filter(oi => oi >= 0);
        q.options = keep.map(oi => raw[oi]);
        q.answer = keep.indexOf(+q.answer);
        if (!String(q.q || '').trim()) errs.push(n + ' Q' + (qi + 1) + ': write the question.');
        if (q.options.length < 2) errs.push(n + ' Q' + (qi + 1) + ': needs at least 2 options.');
        if (!(+q.answer >= 0 && +q.answer < q.options.length)) errs.push(n + ' Q' + (qi + 1) + ': mark the correct option.');
      });
    }
    if (l.kind === 'skill' && !arr(l.criteria).length) errs.push(n + ': list what the trainer checks.');
    if (l.kind === 'task' && !arr(l.steps).length) errs.push(n + ': add checklist items.');
  });
  return errs;
}

function parseCatalogFile(d) {
  const out = { tracks: {}, modules: {} };
  const addTrack = t => { if (!t || !t.id || !okKey(t.id)) throw new Error('A track is missing a valid id.'); out.tracks[t.id] = t; };
  const addMod = (m, i) => {
    if (!m || !m.id || !okKey(m.id)) throw new Error('A module is missing a valid id.');
    if (!arr(m.lessons).length) throw new Error('Module ' + m.id + ' has no steps.');
    const x = normModule(clone(m)); if (x.order == null) x.order = (i || 0) * 10;
    arr(x.lessons).forEach(l => { if (!okKey(l.id)) throw new Error('A step in ' + m.id + ' has an invalid id.'); if (!KIND[l.kind]) throw new Error('Unknown step kind “' + l.kind + '” in ' + m.id + '.'); });
    out.modules[m.id] = x;
  };
  if (d && d.format === 'nlo-onboarding-catalog') { Object.values(obj(d.tracks)).forEach(addTrack); Object.values(obj(d.modules)).forEach((m, i) => addMod(m, m.order != null ? m.order / 10 : i)); }
  else if (d && d.track && Array.isArray(d.modules)) { addTrack(d.track); d.modules.forEach(addMod); }
  else if (Array.isArray(d)) { d.forEach(part => { const p = parseCatalogFile(part); Object.assign(out.tracks, p.tracks); Object.assign(out.modules, p.modules); }); }
  else throw new Error('This doesn’t look like an NLO Onboarding curriculum file.');
  Object.values(out.modules).forEach(m => arr(m.tracks).forEach(t => { if (!out.tracks[t] && !S.cat.tracks[t]) throw new Error('Module ' + m.id + ' uses track “' + t + '”, which isn’t in the file.'); }));
  if (!Object.keys(out.modules).length) throw new Error('No modules found.');
  return out;
}
async function importGo() {
  const data = S.ui.imp; if (!data) return;
  const replace = $('#impReplace') && $('#impReplace').checked;
  if (replace && !(await confirmBox('Replace the whole curriculum?', 'Modules not in this file will be removed. Trainee progress is kept.', 'Replace', true))) return;
  const meta = catMeta(); let ok;
  if (replace) ok = await dbSet(ROOT + '/catalog', { tracks: data.tracks, modules: data.modules, meta });
  else {
    const up = {};
    Object.keys(data.tracks).forEach(id => { up[ROOT + '/catalog/tracks/' + id] = data.tracks[id]; });
    Object.keys(data.modules).forEach(id => { up[ROOT + '/catalog/modules/' + id] = data.modules[id]; });
    up[ROOT + '/catalog/meta'] = meta;
    ok = await dbMulti(up);
  }
  if (!ok) return;
  if (replace) S.cat = { tracks: clone(data.tracks), modules: clone(data.modules), meta };
  else { Object.assign(S.cat.tracks, clone(data.tracks)); Object.assign(S.cat.modules, clone(data.modules)); S.cat.meta = meta; }
  Object.keys(S.cat.modules).forEach(k => normModule(S.cat.modules[k]));
  IDB.set('catalog', S.cat); S.ui.imp = null; closeModal();
  toast('Curriculum imported: ' + Object.keys(data.modules).length + ' modules', 'ok');
  go({ v: 'curriculum' }, true);
}

      <div class="aisa-h">${ic('spark', 20)}<div class="t">Ask AISA<small>Answers from the NLO SOP manual</small></div><button class="icon-btn" data-act="aisaClear" title="New conversation">${ic('refresh', 18)}</button><button class="icon-btn" data-act="aisaClose" aria-label="Close">${ic('x', 20)}</button></div>
      <div class="aisa-m" id="aisaMsgs"></div>
      <div class="aisa-note">Never type patient names or details here.</div>
      <div class="aisa-f"><textarea id="aisaIn" placeholder="Type your question…" rows="1"></textarea><button class="btn btn-p" id="aisaSendBtn" data-act="aisaSend" aria-label="Send">${ic('send', 16)}</button></div></div>`;
    AISA.shown = true;
    const ta = $('#aisaIn');
    ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); aisaSend(); } });
    if (!('ontouchstart' in window)) ta.focus();
  }
  $('#aisaMsgs').innerHTML = aisaMsgsHtml();
  $('#aisaSendBtn').disabled = !!AISA.busy;
  const box = $('#aisaMsgs'); box.scrollTop = box.scrollHeight;
}
function aisaContext() {
  const r = S.route || {};
  if (r.v === 'lesson') { const c = lessonCtx(r.rid || S.actor, r.mid, r.lid); if (c) return c.l.title; }
  if (r.v === 'module') { const m = mod(r.mid); if (m) return m.title; }
  return '';
}
async function aisaSend() {
  const ta = $('#aisaIn'); const q = ((ta && ta.value) || '').trim();
  if (!q || AISA.busy) return;
  const ctx = aisaContext();
  const question = (ctx && AISA.msgs.length === 0 ? '(I’m a new team member in onboarding, working on “' + ctx + '”.) ' : '') + q;
  if (ta) ta.value = '';
  AISA.msgs.push({ r: 'u', t: q }); AISA.busy = true; renderAisa();
  const p = person(S.actor);
  const payload = JSON.stringify({ question: question.slice(0, 3600), history: AISA.history.slice(-8), staffName: firstName(p) || '', staffRole: p.title || 'New team member' });
  let answer = '';
  try {
    const r = await fetch(AISA_URL + '/ask-stream', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: payload });
    const ct = r.headers.get('content-type') || '';
    if (r.ok && r.body && ct.indexOf('text/plain') >= 0) {
      const msg = { r: 'a', t: '', streaming: true }; AISA.msgs.push(msg); renderAisa();
      const rd = r.body.getReader(); const dec = new TextDecoder();
      for (;;) { const ch = await rd.read(); if (ch.done) break; msg.t += dec.decode(ch.value, { stream: true }); const last = $$('#aisaMsgs .bub.a').pop(); if (last) { last.innerHTML = md(msg.t, { trustedImg: true }); const b = $('#aisaMsgs'); b.scrollTop = b.scrollHeight; } else renderAisa(); }
      msg.t += dec.decode(); msg.streaming = false; answer = msg.t;
    }
  } catch (e) { answer = ''; }
  if (!answer.trim()) {
    AISA.msgs = AISA.msgs.filter(m => !(m.r === 'a' && m.streaming));
    try {
      const r = await fetch(AISA_URL + '/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: payload });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
      answer = j.answer || '';
      AISA.msgs.push({ r: 'a', t: answer || 'Sorry — I didn’t get an answer. Try asking another way.' });
    } catch (e) { AISA.msgs.push({ r: 'a', t: 'AISA isn’t reachable right now (' + String(e.message || e) + '). Ask your trainer, or try again in a minute.' }); }
  }
  if (answer) { AISA.history.push({ role: 'user', parts: [{ text: question }] }, { role: 'model', parts: [{ text: answer }] }); AISA.history = AISA.history.slice(-10); }
  AISA.busy = false; renderAisa();
}

  /* ---- lessons ---- */
  async markDone() {
    const c = curLesson(); if (!c || !c.self) return;
    const wasComplete = modStats(c.rid, c.m).complete;
    await saveProg(c.rid, c.m.id, c.l.id, { done: Date.now(), by: c.rid });
    logEvent(c.rid, { t: 'done', m: c.m.id, l: c.l.id });
    celebrate(c, wasComplete);
    updateLessonDyn();
  },
  quizPick(el) {
    const c = curLesson(); if (!c || !c.self) return;
    const d = S.drafts[qKey(c)] || (S.drafts[qKey(c)] = { ans: {}, result: null });
    if (d.result) return;
    d.ans[+el.dataset.q] = +el.dataset.o;
    $('#quizBox').innerHTML = quizHtml(c);
  },
  async quizSubmit() {
    const c = curLesson(); if (!c || !c.self) return;
    const d = S.drafts[qKey(c)]; const qs = arr(c.l.questions);
    if (!d || Object.keys(d.ans).length < qs.length) return;
    const right = qs.filter((q, i) => d.ans[i] === +q.answer).length;
    const score = pct(right, qs.length);
    d.result = { right, total: qs.length, pct: score };
    const p = progOf(c.rid, c.m.id, c.l.id) || {};
    const wasComplete = modStats(c.rid, c.m).complete;
    const best = Math.max(score, p.best || 0);
    await saveProg(c.rid, c.m.id, c.l.id, { best, last: score, tries: (p.tries || 0) + 1, at: Date.now(), passedAt: score >= passMark(c.l) && !p.passedAt ? Date.now() : (p.passedAt || null) });
    logEvent(c.rid, { t: 'quiz', m: c.m.id, l: c.l.id, s: score, pass: score >= passMark(c.l) });
    $('#quizBox').innerHTML = quizHtml(c); updateLessonDyn();
    $('#quizBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
    if (score >= passMark(c.l)) celebrate(c, wasComplete);
  },
  quizRetry(el) {
    const c = curLesson(); if (!c) return;
    S.drafts[qKey(c)] = { ans: {}, result: null, fresh: true };
    $('#quizBox').innerHTML = quizHtml(c);
    $('#quizBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
  },
  async skillReady() { const c = curLesson(); if (!c || !c.self) return; await saveProg(c.rid, c.m.id, c.l.id, { ready: Date.now() }); logEvent(c.rid, { t: 'ready', m: c.m.id, l: c.l.id }); toast('Your trainer can see you’re ready'); updateLessonDyn(); },
  async skillUnready() { const c = curLesson(); if (!c || !c.self) return; await saveProg(c.rid, c.m.id, c.l.id, { ready: null }); updateLessonDyn(); },
  signoffStart() { const c = curLesson(); if (c) signoffDialog(c.rid, c.m.id, c.l.id); },
  signoffFor(el) { signoffDialog(el.dataset.rid, el.dataset.mid, el.dataset.lid); },

    if (S.people[c.rid] && S.people[c.rid].signoffs[c.m.id]) delete S.people[c.rid].signoffs[c.m.id][c.l.id];
    await dbSet(P(c.rid) + '/signoffs/' + c.m.id + '/' + c.l.id, null);
    logEvent(c.rid, { t: 'unsign', m: c.m.id, l: c.l.id });
    updateLessonDyn();

  async taskCheck(el) {
    const c = curLesson(); if (!c || !c.self) return;
    const i = +el.dataset.i; const p = progOf(c.rid, c.m.id, c.l.id) || {};

    logEvent(c.rid, { t: 'ack', m: c.m.id, l: c.l.id });
    celebrate(c, wasComplete);
    updateLessonDyn();
  },

function celebrate(c, wasComplete) {
