he office key, so the app writes it a small sealed copy of each such case -\n    // sealed to the Tray Maker's own public key, which it publishes here under its login (the lab PC's robot login,\n    // the same one the lab bridge uses). It can read the queue and its own key entry, and nothing else; when the\n    // models are sent it adds a sealed note to the inbox like the lab bridge does, and the app takes the case out.\n    match /labqkeys/{uid} {\n      function okLabKey() {\n        let d = request.resource.data;\n        return d.keys().hasOnly(['pub', 'kid', 'name', 'ver', 'at']) && 'pub' in d && okPub(d)\n          && d.kid is string && d.kid.size() <= 40 && d.name is string && d.name.size() <= 120\n          && (!('ver' in d) || (d.ver is string && d.ver.size() <= 20)) && d.at == request.time;\n      }\n      allow get, list: if isMember() || isBot();\n      allow create, update: if isBot() && uid == request.auth.uid && okLabKey();\n      allow delete: if isOwner();\n    }\n    match /labq/{id} {\n      function okLabQ() {\n        let d = request.resource.data;\n        return d.keys().hasOnly(['kid', 'epk', 'iv', 'ct', 'at'])\n          && d.kid is string && d.kid.size() <= 40\n          && d.epk is map && d.epk.keys().hasOnly(['kty', 'crv', 'x', 'y'])\n          && d.iv is string && d.iv.size() <= 24 && d.ct is string && d.ct.size() <= 20000\n          && d.at == request.time;\n      }\n      allow get, list: if isMember() || isBot();\n      allow create, update: if isMember() && okLabQ();\n      allow delete: if isMember() || isBot();\n    }\n\n    // ---------- read marks on Messages (12 Oct 2026) ----------\n    // Which notes and stickers a person has read (and marked unread again), so a message read on one computer or phone is\n    // read on all of them. One document per person, at their staff id, sealed in the browser with the office key like a\n    // case: only they can read or write it, and only while their login is active. Never listed; remove ner() && request.resource.data.keys().hasOnly(['email', 'at'])\n        && request.resource.data.email is string && request.resource.data.at == request.time;\n      allow delete: if isOwner();\n      allow update: if false;\n    }\n    // the inbox public key the robot seals to (and which senders to forward)\n    match /meta/inbox {\n      allow get: if isMember() || isBot();\n      allow create, update: if isOwner() && request.resource.data.keys().hasOnly(['pub', 'kid', 'senders', 'at', 'notify'])\n        && 'pub' in request.resource.data && okPub(request.resource.data)\n        && request.resource.data.kid is string && request.resource.data.kid.size() <= 40\n        && request.resource.data.senders is list && request.resource.data.senders.size() <= 40\n        && okNotify(request.resource.data);\n      allow delete: if false;\n    }\n    // its private half, sealed with the office key\n    match /meta/inboxKey {\n      allow get: if isMember();\n      allow create, update: if isOwner();\n      allow delete: if false;\n    }\n    // the robot's login, sealed with the office key, so the owner can show the script again\n    match /meta/mailbot {\n      allow get, create, update, delete: if isOwner();\n    }\n    match /inbox/{id} {\n      allow create: if isBot() && id.matches('^m[0-9a-f]{40}$')\n        && request.resource.data.keys().hasOnly(['kid', 'epk', 'iv', 'ct', 'at'])\n        && request.resource.data.kid is string && request.resource.data.kid.size() <= 40\n        && request.resource.data.epk is map && request.resource.data.epk.keys().hasOnly(['kty', 'crv', 'x', 'y'])\n        && request.resource.data.iv is string && request.resource.data.iv.size() <= 24\n        && request.resource.data.ct is string && request.resource.data.ct.size() <= 400000\n        && request.resource.data.at == request.time;\n      allow get, list: if isMember();\n      // staff mark which updates in an email are dealt with (and which open app is handling it), and remove it once all o missed a punch asks for it (Amir, 9 Oct 2026: staff used to clock out an extra\n    // time just to leave a note); it counts once a manager approves it. A small Google Apps Script (its own login) reads the\n    // clock to send the alerts.\n    // Managers: Dr. A and the people he makes time clock managers (isTcMgr()). Nobody corrects their own time except Dr. A.\n    // the time clock's managers: Dr. A, and the people he picks (People \u2192 Edit). Amir, 9 Oct 2026: \"right now the manager is\n    // me, Dr. Akhavan\" \u2014 approving time off (isHR) doesn't make someone a time clock manager.\n    function isTcMgr() { return isOwner() || (isMember() && exists(/databases/$(db)/documents/tcMgrs/$(mySid()))); }\n    function isKiosk() { return authed() && exists(/databases/$(db)/documents/tcKiosks/$(request.auth.uid)); }\n    function isTcBot() { return authed() && exists(/databases/$(db)/documents/tcBots/$(request.auth.uid)); }\n    function isTcDevice() { return isKiosk() || isTcBot(); }\n    // an approved laptop (its own login, like a time-clock computer), and whether it's for this person (it reads and\n    // punches only for the people Dr. A picked for it)\n    function lapDoc() { return /databases/$(db)/documents/tcLaptops/$(request.auth.uid); }\n    function isLaptop() { return authed() && exists(lapDoc()); }\n    function lapHas(sid) { return sid in get(lapDoc()).data.sids; } // (not a laptop: no record, so refused)\n    // a device that takes this person's PIN: a time-clock computer, or a laptop that's theirs\n    function punchDev(sid) { return isKiosk() || lapHas(sid); }\n    // the office check's login (the Worker), and what it wrote down: the network a login was on a moment ago\n    function isNetBot() { return authed() && exists(/databases/$(db)/documents/tcNetBot/$(request.auth.uid)); }\n    function okNet(s) { return s is string && s.matches('^(v4:[0-9]{1,3}([.][0-9]{1,3}){3}|v6:[0-9a-f]{1,4}(:[0-9a-f]{1,4}){3})$'); }\n    function seenDoc(u) { retu ySid());\n      allow list: if isTcMgr();\n      allow create: if isOwner() && request.resource.data.keys().hasOnly(['at', 'by']) && request.resource.data.at == request.time\n        && request.resource.data.by == request.auth.uid && exists(tcStaffDoc(sid));\n      allow update: if false;\n      allow delete: if isOwner();\n    }\n    // the office's time-clock computers (each its own login, made by Dr. A on that computer)\n    match /tcKiosks/{uid} {\n      allow get: if isTcMgr() || (authed() && request.auth.uid == uid);\n      allow list: if isTcMgr() || isTcBot();\n      allow create: if isOwner() && request.resource.data.keys().hasOnly(['name', 'at', 'by'])\n        && request.resource.data.name is string && request.resource.data.name.size() > 0 && request.resource.data.name.size() <= 40\n        && request.resource.data.at == request.time && request.resource.data.by == request.auth.uid;\n      allow update: if (isOwner() && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['name'])\n            && request.resource.data.name is string && request.resource.data.name.size() > 0 && request.resource.data.name.size() <= 40)\n        || (authed() && request.auth.uid == uid && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['seen'])\n            && request.resource.data.seen == request.time);\n      allow delete: if isOwner();\n    }\n    // the alert script's login (made by Dr. A)\n    match /tcBots/{uid} {\n      allow get: if authed() && (request.auth.uid == uid || isOwner());\n      allow list: if isOwner();\n      allow create: if isOwner() && request.resource.data.keys().hasOnly(['email', 'at'])\n        && request.resource.data.email is string && request.resource.data.email.size() <= 120 && request.resource.data.at == request.time;\n      allow update: if false;\n      allow delete: if isOwner();\n    }\n    // approved laptops (Amir, 9 Oct 2026: the laptop one of his assistants uses to work from home sometimes, and the one\n    // a teammate who works from home uses): each its own login, made on that laptop and approved by Dr. A with the code it\n    // shows, for the people he picked \u2014 a time clock that also works away from the office. He renames one, changes who\n    // uses it, or takes it back (a lost laptop, someone leaving).\n    match /tcLaptops/{uid} {\n      function okLap(d) {\n        return d.name is string && d.name.size() > 0 && d.name.size() <= 40 && d.sids is list && d.sids.size() > 0 && d.sids.size() <= 4\n          && d.sids[0] is string && d.sids[0].size() <= 40 && (d.sids.size() < 2 || (d.sids[1] is string && d.sids[1].size() <= 40))\n          && (d.sids.size() < 3 || (d.sids[2] is string && d.sids[2].size() <= 40)) && (d.sids.size() < 4 || (d.sids[3] is string && d.sids[3].size() <= 40));\n      }\n      allow get: if isTcMgr() || (authed() && request.auth.uid == uid);\n      allow list: if isTcMgr() || isTcBot();\n      // (only a laptop asking for it in the last 30 minutes: Dr. A types the code it shows)\n      allow create: if isOwner() && request.resource.data.keys().hasOnly(['name', 'sids', 'at', 'by']) && okLap(request.resource.data)\n        && request.resource.data.at == request.time && request.resource.data.by == request.auth.uid\n        && request.time < get(/databases/$(db)/documents/tcLapReq/$(uid)).data.at + duration.value(30, 'm');\n      allow update: if (isOwner() && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['name', 'sids']) && okLap(request.resource.data))\n        || (authed() && request.auth.uid == uid && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['seen'])\n            && request.resource.data.seen == request.time);\n      allow delete: if isOwner();\n    }\n    // a laptop asking to be approved: its own new login, made on that laptop, and a 6-digit code it shows, so Dr. A approves\n    // the right one on his own phone or computer (his password never goes on the laptop). Anyone can make a login, t() && request.resource.data.keys().hasOnly(['net', 'office', 'org', 'city', 'pid', 'relay', 'at'])\n        && okNet(request.resource.data.net) && request.resource.data.office is bool\n        && request.resource.data.org is string && request.resource.data.org.size() <= 100\n        && request.resource.data.city is string && request.resource.data.city.size() <= 60\n        && request.resource.data.pid is string && request.resource.data.pid.matches('^p[0-9a-f]{24}$') && request.resource.data.relay is bool\n        && request.resource.data.at == request.time\n        && (exists(/databases/$(db)/documents/members/$(uid)) || exists(/databases/$(db)/documents/tcKiosks/$(uid)) || exists(/databases/$(db)/documents/tcLaptops/$(uid)));\n      allow delete: if isOwner();\n    }\n    // the office's networks: Dr. A saves the one he's on right now (\"This is the office\" \u2014 never an address many people\n    // share, like iCloud Private Relay or a VPN); he can rename or remove one\n    match /tcOffice/{net} {\n      function okOffice(d) {\n        return okNet(net) && d.keys().hasOnly(['name', 'org', 'city', 'by', 'at'])\n          && d.name is string && d.name.size() > 0 && d.name.size() <= 40\n          && d.org is string && d.org.size() <= 100 && d.city is string && d.city.size() <= 60\n          && d.by == request.auth.uid && d.at == request.time;\n      }\n      allow get, list: if isOwner() || isNetBot();\n      allow create: if isOwner() && okOffice(request.resource.data) && seenNet(request.auth.uid, 5)\n        && get(seenDoc(request.auth.uid)).data.net == net && get(seenDoc(request.auth.uid)).data.relay == false;\n      allow update: if isOwner() && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['name'])\n        && request.resource.data.name is string && request.resource.data.name.size() > 0 && request.resource.data.name.size() <= 40;\n      allow delete: if isOwner();\n    }\n    // which set of these rules is live (the page reads this; older rules refuse it)\n    match /meta/rules_tc_1 {\n      allow get: if isMember() || isTcDevice();\n    }\n    match /meta/rules_tc_2 {\n      allow get: if isMember() || isTcDevice() || isLaptop() || isNetBot();\n    }\n    // (Paychex's IDs, meta/tcPx: the page offers them once these rules are live)\n    match /meta/rules_tc_3 {\n      allow get: if isMember() || isTcDevice() || isLaptop() || isNetBot();\n    }\n    // (paid holidays, meta/tcHol: the Payroll page offers them once these rules are live)\n    match /meta/rules_tc_4 {\n      allow get: if isMember() || isTcDevice() || isLaptop() || isNetBot();\n    }\n\n    // =====================================================================\n    // NLO Inventory (16 Oct 2026; Amir: \"make this app similar to case tracker to use the same logins and logout after 10\n    // mins same rules\"): supplies, the shared cart, orders and receiving, vendors, the activity log and the supply budget,\n    // moved here from Inventory's own Realtime Database (nlo-inventory). Same logins, roster and idle lock as NLO Cases.\n    // Nothing here is patient data, so nothing is sealed.\n    // - Every write says who made it and when (upBy = the member's staff id, up = the database's time) and moves the\n    //   change counter (invState/rev) in the same save: the alert script watches that one number.\n    // - The steps people take carry the name of whoever saved them: the activity log is one record per person per month\n    //   (invLog/m<YYYY-MM>~<staff id>), each person adding only to their own, entries only ever added; an order's trail only\n    //   grows by the step being saved, in the saver's name; expenses bought outside an order are records of their own\n    //   (invExpenses) in the name of whoever added them, taken off only by them or Dr. A. (Dr. A's own\n    //   saves aren't held to this: the one-time move brings the old records over as the old app stamped them.)\n    // - Supplies and vendors are hidden with a flag, never eturn resource.data.get(k, null); }\n    match /invItems/{id} {\n      allow read: if invReader();\n      allow create: if invOk(request.resource.data) && request.resource.data.id == id && request.resource.data.size() <= 120\n        && (isInvAdmin() || (request.resource.data.get('deleted', false) != true && request.resource.data.get('archived', false) != true));\n      allow update: if invOk(request.resource.data) && request.resource.data.id == id && request.resource.data.size() <= 120\n        && (isInvAdmin() || !invChanged(['deleted', 'archived', 'deletedBy', 'deletedAt', 'archivedBy', 'archivedAt']));\n      allow delete: if false;\n    }\n    match /invOrders/{id} {\n      function okSt(s) { return s == 'open' || s == 'backordered' || s == 'received'; }\n      function okMove(a, b) { return a == b || ((a == 'open' || a == 'backordered') && b == 'received') || (a == 'open' && b == 'backordered') || (a == 'backordered' && b == 'open'); }\n      // the trail (n, was o) only grows by the step being saved, and that step is the saver's (the oldest drops off at 40)\n      function trailOk(n, o) {\n        return n == o || (n is list && n.size() == (o.size() < 40 ? o.size() + 1 : 40) && n[n.size() - 1] is map\n          && n[n.size() - 1].get('byId', '') == mySid() && (o.size() == 0 || n[0:n.size() - 1] == o[o.size() - (n.size() - 1):o.size()]));\n      }\n      // what everyone else may still change on a received order: its paperwork\n      function paperworkOnly() {\n        return request.resource.data.diff(resource.data).affectedKeys().hasOnly(['items', 'invoiceNumber', 'invoiceDate', 'invoiceSubtotal', 'invoiceTaxes',\n          'invoiceShipping', 'slipPhoto', 'trail', 'up', 'upBy']);\n      }\n      // a receipt is the saver's: their id on it, and their \"received\" step on the trail\n      function receiptOk(d) { return d.get('receivedById', '') == mySid() && d.get('trail', []).size() > 0 && d.trail[d.trail.size() - 1].get('t', '') == 'received'; }\n      allow read: if invReader();\n      // a new order carries one step, the saver's (placed, scanned, or the backorder of an earlier one)\n      allow create: if invOk(request.resource.data) && request.resource.data.id == id && request.resource.data.size() <= 120\n        && (isInvAdmin() || okSt(request.resource.data.get('status', '')))\n        && (isOwner() || (request.resource.data.get('trail', []).size() == 1 && trailOk(request.resource.data.trail, [])\n          && (request.resource.data.get('orderedById', mySid()) == mySid() || 'backorderOf' in request.resource.data)\n          && (request.resource.data.get('status', '') != 'received' || request.resource.data.get('receivedById', mySid()) == mySid())));\n      allow update: if invOk(request.resource.data) && request.resource.data.id == id && request.resource.data.size() <= 120\n        && (isInvAdmin() || (okMove(invWas('status'), request.resource.data.get('status', ''))\n          && (invWas('status') != 'received' || paperworkOnly())))\n        && (isOwner() || (trailOk(request.resource.data.get('trail', []), resource.data.get('trail', []))\n          && (!invChanged(['receivedById']) || request.resource.data.get('receivedById', mySid()) == mySid())\n          && (invWas('status') == 'received' || request.resource.data.get('status', '') != 'received' || receiptOk(request.resource.data))\n          && (invWas('status') != 'received' || !invChanged(['items']) || request.resource.data.get('trail', []) != resource.data.get('trail', []))));\n      allow delete: if false;\n    }\n    match /invVendors/{id} {\n      // anyone may add a vendor (one typed on a supply joins the list: a new v-\u2026 record with just its name) and fill in an\n      // account number or address a packing slip shows when there wasn't one; everything else (website, phone, order email,\n      // rep\u2026) is Dr. A's\n      function blank(k) { return !(k in resource.data) || resource.data[k] == null || resource.data[k] == ''; }\n      allow read: if invReader();\n      allow create: if invOk(request.resource.data) && request.resource.data.id == id && request.resource.data.size() <= 60\n        && (isInvAdmin() || (request.resource.data.keys().hasOnly(['id', 'name', 'acct', 'address', 'up', 'upBy'])\n          && (id.matches('^v-.+$') || !('name' in request.resource.data))));\n      allow update: if invOk(request.resource.data) && request.resource.data.id == id && request.resource.data.size() <= 60\n        && (isInvAdmin() || (request.resource.data.diff(resource.data).affectedKeys().hasOnly(['acct', 'address', 'up', 'upBy'])\n          && (!invChanged(['acct']) || blank('acct')) && (!invChanged(['address']) || blank('address'))));\n      allow delete: if false;\n    }\n    match /invLog/{d} {\n      // one record per person per month, m<YYYY-MM>~<staff id> (the moved entries under the id the old app stamped them with)\n      function okLog(x) { return x.keys().hasOnly(['e', 'mon', 'who', 'up', 'upBy']) && x.e is map && x.e.size() <= 1500\n        && x.mon is string && x.mon.matches('^[0-9]{4}-[0-9]{2}$') && x.who is string && d == 'm' + x.mon + '~' + x.who; }\n      allow read: if invReader();\n      allow create: if invOk(request.resource.data) && okLog(request.resource.data) && (request.resource.data.who == mySid() || isOwner());\n      allow update: if invOk(request.resource.data) && okLog(request.resource.data) && (resource.data.who == mySid() || isOwner())\n        && request.resource.data.e.diff(resource.data.e).changedKeys().size() == 0\n        && request.resource.data.e.diff(resource.data.e).removedKeys().size() == 0;\n      allow delete: if false;\n    }\n    // expenses bought outside an order (a card at a store), in the name of whoever added them\n    match /invExpenses/{id} {\n      function okEx(x) { return x.keys().hasOnly(['id', 'date', 'amount', 'category', 'vendor', 'note', 'description', 'by', 'byId', 'addedAt', 'up', 'upBy'])\n        && x.id == id && x.amount is number && x.amount >= 0 &&   <style id="nlo-phone-fit">
/* ---------- Phone fit (Oct 2026) ----------
   Fits the screen on phones: no clipped columns, no zoom-in when typing, no sideways wiggle. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (max-width:900px){@supports (overflow:clip){html,body{overflow-x:clip}}}
/* iPhones zoom the page in when a box under 16px gets the cursor, and it stays zoomed afterwards */
@media (hover:none) and (pointer:coarse),(max-width:760px){
  input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]),select,textarea,
  .input,.picker__search input,.admin-search input,.auth__code,.edit-item__title{font-size:16px!important}
}
@media (max-width:760px){
  .admin-nav{height:100vh;height:100dvh}
  .admin-main{padding:14px 14px 40px}
  .admin-head{gap:10px 12px;margin-bottom:16px}
  .admin-head__title{font-size:24px}
  .admin-head>div{min-width:0;max-width:100%}
  /* Dashboard: search and "New checklist" share the line and wrap instead of running off the edge */
  .admin-head>div:has(>.admin-search){width:100%;flex-wrap:wrap;gap:8px!important}
  .admin-head>div:has(>.admin-search)>button{padding:11px 18px!important;font-size:14px!important;flex:none}
  .admin-search{min-width:0;flex:1 1 170px}
  .admin-head>button{padding:11px 18px!important;font-size:14px!important}
  /* tables: one card-like row per item instead of squeezed columns */
  .tbl-head:not([style]){display:none!important}
  .tbl-head[style]{display:flex!important;flex-wrap:wrap;gap:6px 16px;padding:10px 14px}
  .tbl-head[style]>span:empty{display:none}
  .tbl-row{display:flex!important;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 14px}
  .tbl-row>*{min-width:0}
  .tbl-row>:first-child{flex:1 1 100%}
  .tbl-row .tbl-cell-strong{font-size:14px}
  .tbl-row .progress{min-width:44px}
  .panel>div:has(>.filter-chip){flex-wrap:wrap}
  /* leaderboards: names get the room, the bar gets shorter */
  .leader-row{gap:10px;padding:10px}
  .leader-row>div:not(.leader-bar){flex:1 1 auto;min-width:0}
  .leader-bar{width:auto;flex:0 1 56px;min-width:28px}
  .leader-row__pct{width:auto;min-width:34px}
  /* checklist editor: everything inside the card */
  .editor-grid{grid-template-columns:minmax(0,1fr)!important}
  .editor-meta,.editor-items{padding:16px 14px}
  .editor-meta>div[style*=grid]{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important}
  .editor-meta>div[style*=grid]>*{min-width:0}
  .editor-meta select,.editor-meta input{min-width:0;max-width:100%}
  .edit-item{flex-wrap:wrap;row-gap:8px;padding:10px}
  .edit-item__title{flex:1 1 calc(100% - 40px);min-width:0}
  .edit-item__x{font-size:18px;padding:4px 8px;margin-left:auto}
  .edit-item__tag{font-size:11px;padding:5px 9px}
  .editor-items>div:first-child{flex-wrap:wrap;gap:6px}
  /* rotations & duties: name on its own line, the two pickers full width under it */
  .admin-main div:has(>div>.list-row__title):has(select){flex-wrap:wrap}
  .admin-main div:has(>div>.list-row__title):has(select)>div:has(>.list-row__title){flex:1 1 100%!important;min-width:0}
  .admin-main div:has(>div>.list-row__title):has(select)>div:has(select){flex:1 1 100%;align-items:stretch!important;min-width:0}
  .admin-main div:has(>div>.list-row__title):has(select)>div:has(select)>div{width:100%}
  .admin-main div:has(>div>.list-row__title):has(select) select{flex:1 1 auto;min-width:0;width:auto!important}
  /* pop-ups stay inside the screen */
  .modal-overlay{padding:12px}
  .modal{max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px)}
}
@media (max-width:380px){
  .stat-row{gap:10px}
  .admin-main{padding-left:12px;padding-right:12px}
}

    <script id="nlo-arlink-addon">
