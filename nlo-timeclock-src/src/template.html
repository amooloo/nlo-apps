<body>
<div id="lockWrap">
  <div class="lockCol">
    <div class="lockBrand"><img src="logo-white.png" alt="Next Level Orthodontics"><div class="appTag">Time Clock</div></div>
    <div class="lockCard" id="lockCard"><div class="lsub" style="text-align:center">Loading…</div></div>
    <div class="lockMeta"><svg class="i" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Every punch takes the server’s time</div>
  </div>
</div>
<div id="kiosk" class="hidden">
  <header class="kHead"><img src="logo-white.png" alt="Next Level Orthodontics"><div class="kClock"><span id="kTime" data-ap=""></span><span id="kDate"></span></div><div class="kSide"><span id="kName"></span><button class="kMgrBtn" data-act="kMgr">Manager</button></div></header>
  <main id="kMain"></main>
</div>
<div id="app" class="hidden">
  <aside id="side"></aside>
  <div id="main">
    <div class="mobBar" id="mobTop"></div>
    <nav class="mobNav" id="mobNav" aria-label="Main"></nav>
    <div id="topSlot"></div>
    <main id="view"></main>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="demoBar" class="hidden">Demo — made-up people, nothing is saved</div>
