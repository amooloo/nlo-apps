<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#1B2F4C" />
<title>NLO Apps — Next Level Orthodontics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
--navy: #1B2F4C;
--blue: #1D3EA9;
--coral: #FA624D;
--mint: #64F4C9;
--gold: #F6AF24;
--page: #F2F3F4;
--tile: 84px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
background: var(--page);
min-height: 100vh;
color: var(--navy);
}

header {
background: var(--navy);
color: white;
padding: 40px 32px 36px;
text-align: center;
}

.logo-row {
display: flex;
align-items: center;
justify-content: center;
margin-bottom: 14px;
}

.logo-row img {
height: 110px;
width: auto;
display: block;
}

header h1 {
font-size: 0.75rem;
font-weight: 600;
letter-spacing: 3px;
text-transform: uppercase;
opacity: 0.55;
margin-top: 0;
}

.main {
max-width: 900px;
margin: 48px auto 0;
padding: 0 20px;
}

/* ---------- Launcher grid ---------- */

.apps-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
gap: 28px 8px;
justify-items: center;
}

.app {
display: flex;
flex-direction: column;
align-items: center;
gap: 11px;
width: 100%;
max-width: 124px;
padding: 6px 4px 4px;
text-decoration: none;
color: var(--navy);
-webkit-tap-highlight-color: transparent;
outline: none;
}

.label {
font-size: 0.8rem;
font-weight: 600;
line-height: 1.25;
text-align: center;
letter-spacing: -0.1px;
}

/* the icon tile */
.tile {
position: relative;
width: var(--tile);
height: var(--tile);
border-radius: 24%;
display: grid;
place-items: center;
color: var(--ink);
background: linear-gradient(155deg, var(--a) 0%, var(--b) 100%);
box-shadow:
  0 1px 2px rgba(27,47,76,0.10),
  0 12px 22px -12px var(--glow),
  inset 0 1px 0 rgba(255,255,255,0.32),
  inset 0 -1px 0 rgba(0,0,0,0.10);
transition: transform 0.18s ease, box-shadow 0.18s ease;
}

/* soft top light */
.tile::before {
content: "";
position: absolute;
inset: 0;
border-radius: inherit;
background: linear-gradient(180deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0) 50%);
pointer-events: none;
}

.tile svg {
position: relative;
width: 62%;
height: 62%;
overflow: visible;
filter: drop-shadow(0 1px 1.2px rgba(0,0,0,0.16));
}

@media (hover: hover) {
.app:hover .tile {
  transform: translateY(-3px);
  box-shadow:
    0 2px 4px rgba(27,47,76,0.10),
    0 18px 26px -12px var(--glow),
    inset 0 1px 0 rgba(255,255,255,0.32),
    inset 0 -1px 0 rgba(0,0,0,0.10);
}
}

.app:active .tile { transform: scale(0.94); transition-duration: 0.08s; }
.app:focus-visible .tile { outline: 3px solid var(--blue); outline-offset: 4px; }

/* Brand color themes: --a light end, --b deep end, --ink for cut-in details, --glow for the shadow */
.t-blue  { --a: #4A7BF7; --b: #1D3EA9; --ink: #1D3EA9; --glow: rgba(29,62,169,0.55); }
.t-coral { --a: #FF9479; --b: #EC4C36; --ink: #D9412C; --glow: rgba(236,76,54,0.55); }
.t-mint  { --a: #4DE2B6; --b: #0D9373; --ink: #0B7C61; --glow: rgba(13,147,115,0.50); }
.t-gold  { --a: #FFC94F; --b: #EA8C00; --ink: #B86E00; --glow: rgba(234,140,0,0.50); }
.t-navy  { --a: #3C5986; --b: #1B2F4C; --ink: #1B2F4C; --glow: rgba(27,47,76,0.50); }
.t-ai    { --a: #2A4573; --b: #101D33; --ink: #101D33; --glow: rgba(29,62,169,0.60); }
.t-ai svg { filter: drop-shadow(0 0 5px rgba(138,168,255,0.35)); }

/* live calendar tile */
.t-cal {
--glow: rgba(27,47,76,0.35);
display: flex;
flex-direction: column;
place-items: stretch;
overflow: hidden;
background: linear-gradient(180deg, #FFFFFF 0%, #EEF1F5 100%);
}
.t-cal::before { display: none; }
.cal-dow {
height: 29%;
display: grid;
place-items: center;
background: linear-gradient(155deg, #FF8C70, #EC4C36);
color: #fff;
font-size: calc(var(--tile) * 0.155);
font-weight: 700;
letter-spacing: 0.3px;
}
.cal-day {
flex: 1;
display: grid;
place-items: center;
color: var(--navy);
font-size: calc(var(--tile) * 0.42);
font-weight: 800;
letter-spacing: -1px;
line-height: 1;
padding-bottom: 3%;
}

/* hover description */
.tip {
position: fixed;
left: -9999px;
top: 0;
z-index: 20;
max-width: 250px;
padding: 9px 12px 10px;
border-radius: 10px;
background: var(--navy);
color: #fff;
font-size: 0.74rem;
font-weight: 500;
line-height: 1.45;
box-shadow: 0 12px 30px -10px rgba(27,47,76,0.55);
pointer-events: none;
opacity: 0;
transform: translateY(4px);
transition: opacity 0.14s ease, transform 0.14s ease;
}
.tip.on { opacity: 1; transform: none; }
.tip strong { display: block; font-size: 0.78rem; font-weight: 700; margin-bottom: 2px; }

/* ---------- Admin group: tools only the office admin needs; collapsed by default ---------- */
.admin-group {
margin-top: 48px;
padding-top: 22px;
border-top: 1px solid rgba(27,47,76,0.1);
}

.admin-group > summary {
list-style: none;
display: flex;
align-items: center;
gap: 10px;
width: fit-content;
margin-left: -12px;
padding: 8px 14px 8px 12px;
border-radius: 10px;
cursor: pointer;
user-select: none;
color: var(--navy);
transition: background 0.2s ease;
}

.admin-group > summary::-webkit-details-marker { display: none; }
.admin-group > summary:hover { background: rgba(27,47,76,0.05); }
.admin-group > summary:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.admin-title {
font-size: 0.85rem;
font-weight: 700;
opacity: 0.7;
}

.admin-count {
font-size: 0.68rem;
font-weight: 600;
padding: 3px 9px;
border-radius: 20px;
background: rgba(27,47,76,0.07);
opacity: 0.8;
}

.admin-lock, .admin-chevron { flex-shrink: 0; stroke: var(--navy); opacity: 0.5; }
.admin-chevron { transition: transform 0.2s ease; }
.admin-group[open] .admin-chevron { transform: rotate(90deg); }
.admin-group .apps-grid { margin-top: 22px; }

footer {
text-align: center;
padding: 48px 20px 36px;
font-size: 0.72rem;
font-weight: 600;
letter-spacing: 0.5px;
color: var(--navy);
opacity: 0.3;
}

@media (max-width: 600px) {
:root { --tile: 62px; }
header { padding: 28px 20px 24px; }
.logo-row img { height: 80px; }
header h1 { font-size: 0.7rem; }
.main { margin-top: 30px; padding: 0 16px; }
.apps-grid { grid-template-columns: repeat(4, 1fr); gap: 22px 4px; }
.app { gap: 8px; padding: 4px 0 2px; }
.label { font-size: 0.7rem; }
.admin-group { margin-top: 36px; }
}

@media (max-width: 340px) {
.apps-grid { grid-template-columns: repeat(3, 1fr); }
}

@media (prefers-reduced-motion: reduce) {
.tile, .tip, .admin-chevron { transition: none; }
.app:hover .tile, .app:active .tile { transform: none; }
}
</style>
</head>

<script>
/* keep the Admin count honest if apps are added or removed */
(function () {
  var g = document.getElementById('adminGroup');
  if (!g) return;
  var n = g.querySelectorAll('.app').length, c = g.querySelector('.admin-count');
  if (c) c.textContent = n + (n === 1 ? ' tool' : ' tools');
})();

/* calendar tile shows today's weekday and date; refreshes when the tab comes back into view */
(function () {
  var dow = document.getElementById('calDow'), day = document.getElementById('calDay');
  if (!dow || !day) return;
  function paint() {
    var d = new Date();
    dow.textContent = d.toLocaleDateString('en-US', { weekday: 'short' });
    day.textContent = d.getDate();
  }
  paint();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) paint(); });
})();

/* hover (or keyboard focus) shows the app's full name and description */
(function () {
  var tip = document.getElementById('tip');
  if (!tip) return;
  var fine = window.matchMedia('(hover: hover) and (pointer: fine)');
  var timer = null, warmUntil = 0;

  function place(a) {
    var r = a.querySelector('.tile').getBoundingClientRect();
    var w = tip.offsetWidth, h = tip.offsetHeight, m = 10;
    var x = Math.min(Math.max(r.left + r.width / 2 - w / 2, m), window.innerWidth - w - m);
    var y = r.top - h - 10;
    if (y < m) y = a.getBoundingClientRect().bottom + 8;
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  }
  function show(a) {
    tip.textContent = '';
    var b = document.createElement('strong');
    b.textContent = a.getAttribute('data-name') || a.textContent.trim();
    var s = document.createElement('span');
    s.textContent = a.getAttribute('data-desc') || '';
    tip.appendChild(b);
    tip.appendChild(s);
    place(a);
    tip.classList.add('on');
  }
  function hide() {
    clearTimeout(timer);
    if (tip.classList.contains('on')) warmUntil = Date.now() + 350;
    tip.classList.remove('on');
  }

  var apps = document.querySelectorAll('.app[data-desc]');
  for (var i = 0; i < apps.length; i++) {
    (function (a) {
      a.addEventListener('mouseenter', function () {
        if (!fine.matches) return;
        clearTimeout(timer);
        timer = setTimeout(function () { show(a); }, Date.now() < warmUntil ? 0 : 400);
      });
      a.addEventListener('mouseleave', hide);
      a.addEventListener('focus', function () { if (a.matches(':focus-visible')) show(a); });
      a.addEventListener('blur', hide);
      a.addEventListener('click', hide);
    })(apps[i]);
  }
  window.addEventListener('scroll', hide, { passive: true });
})();
</script>
