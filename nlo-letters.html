<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-VhVr8Y7/sF+f8nCnm79UHm7E2qCa3U2UGcIjuC1xAmk=' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://www.google.com/images/cleardot.gif; connect-src 'self' https://*.googleapis.com https://aisa-worker.akhavan-ak.workers.dev https://nlo-inventory-default-rtdb.firebaseio.com http://127.0.0.1:8080 http://127.0.0.1:9099; frame-src https://*.firebaseapp.com; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="theme-color" content="#1B2F4C">
<title>NLO Letters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* NLO brand palette — same values as Staff Hub / Onboarding */
  --navy-900:#11203A; --navy:#1B2F4C; --navy-700:#294169; --navy-600:#385686; --navy-500:#5471A0; --navy-100:#E8ECF2;
  --blue-800:#122874; --blue-700:#16318C; --blue:#1D3EA9; --blue-500:#2E52C9; --blue-200:#BCC8EE; --blue-100:#E5EAF8;
  --coral-700:#D8412E; --coral-600:#EE4F3A; --coral:#FA624D; --coral-200:#FFC8BF; --coral-100:#FFE7E1;
  --mint-700:#1F9E7E; --mint-600:#34C49E; --mint:#64F4C9; --mint-200:#C0FBEC; --mint-100:#E2FBF4;
  --amber-700:#C2820A; --amber-600:#E29A14; --amber:#F6AF24; --amber-200:#FCE2A6; --amber-100:#FEF2D7;
  --grey-50:#F7F8F9; --grey-100:#ECEEF0; --grey-200:#DCE0E4; --grey-300:#C3C9D0; --grey-400:#969FAB; --grey-500:#6B7685; --grey-600:#4C5868; --grey-700:#33404F;
  --off:#F2F3F4; --card:#FFFFFF;
  --fd:'Oswald',system-ui,sans-serif;
  --fb:'Montserrat',system-ui,-apple-system,sans-serif;
  --sh-xs:0 1px 2px rgba(17,32,58,.07); --sh-sm:0 2px 6px rgba(17,32,58,.08);
  --sh-md:0 8px 24px rgba(17,32,58,.10); --sh-lg:0 18px 48px rgba(17,32,58,.15); --sh-xl:0 32px 70px rgba(17,32,58,.22);
  --r-sm:8px; --r:14px; --r-lg:22px;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--fb);background:var(--off);color:var(--grey-700);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--grey-700)}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue-500);outline-offset:2px;border-radius:4px}
svg.i{flex:none;display:inline-block;vertical-align:-3px}
.hidden{display:none !important}
.muted{color:var(--grey-500)}
.small{font-size:12.5px}

/* ---------- Demo banner ---------- */
#demoBar{position:fixed;left:0;right:0;bottom:0;z-index:2000;background:var(--amber);color:var(--navy-900);text-align:center;font-family:var(--fd);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px;padding:7px 12px}

/* ---------- Lock ---------- */
#lockWrap{position:fixed;inset:0;background:linear-gradient(158deg,var(--navy-900) 0%,var(--navy) 62%,#20395C 100%);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;overflow:hidden auto}
#lockWrap::before{content:"";position:absolute;width:680px;height:680px;border-radius:50%;border:88px solid rgba(255,255,255,.03);top:-300px;right:-220px;pointer-events:none}
#lockWrap::after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;border:70px solid rgba(100,244,201,.045);bottom:-260px;left:-180px;pointer-events:none}
.lockCol{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;width:100%;max-width:440px;margin:auto;padding:24px 0}
.lockBrand{display:flex;flex-direction:column;align-items:center;gap:14px}
.lockBrand img{width:160px;height:auto;display:block}
.appTag{font-family:var(--fd);font-weight:500;font-size:13px;letter-spacing:.34em;text-transform:uppercase;color:var(--mint);text-indent:.34em}
.lockCard{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-xl);width:100%;padding:32px 34px 28px}
.lockCard h1{font-family:var(--fd);font-weight:600;font-size:22px;letter-spacing:.03em;text-transform:uppercase;color:var(--navy)}
.lockCard .lsub{font-size:12.5px;color:var(--grey-500);margin-top:3px}
.lockCard p.desc{color:var(--grey-500);font-size:13.5px;margin:12px 0 18px}
.lockErr{background:var(--coral-100);color:var(--coral-700);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:500;margin-bottom:14px}
.lockOk{background:var(--mint-100);color:var(--mint-700);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:500;margin-bottom:14px}
.lockFoot{margin-top:16px;font-size:12px;color:var(--grey-400);text-align:center}
.lockFoot a,.linkBtn{color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.lockMeta{display:flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:.06em;color:#9DB0CC;text-transform:uppercase;font-family:var(--fd);font-weight:500}
.ackBox{display:flex;gap:10px;align-items:flex-start;background:var(--amber-100);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--amber-700);margin-bottom:16px;line-height:1.5}
.ackBox input{margin-top:2px;accent-color:var(--amber-600)}
.codeBox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;letter-spacing:.08em;background:var(--grey-50);border:1.5px dashed var(--grey-300);border-radius:12px;padding:16px;text-align:center;color:var(--navy);word-break:break-all;margin:6px 0 14px;user-select:all}

/* ---------- Fields ---------- */
.field{margin-bottom:14px}
.field label,.flabel{display:block;font-family:var(--fd);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey-500);margin-bottom:6px}
.field input,.field select,.field textarea,.inp{width:100%;padding:10px 13px;border:1.5px solid var(--grey-200);border-radius:10px;background:#fff;outline:none;transition:border-color .14s var(--ease),box-shadow .14s var(--ease);min-height:42px}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-100)}
.field textarea{resize:vertical;min-height:70px;line-height:1.45}
.field .hint{font-size:11.5px;color:var(--grey-500);margin-top:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 14px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:9px 20px;border-radius:999px;font-family:var(--fd);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;line-height:1.1;white-space:nowrap;transition:background .14s var(--ease),transform .14s var(--ease),box-shadow .14s var(--ease)}
.btn:active{transform:scale(.985)}
.btn-pri{background:var(--navy);color:#fff;box-shadow:var(--sh-xs)}
.btn-pri:hover{background:var(--navy-900);box-shadow:var(--sh-md)}
.btn-act{background:var(--blue);color:#fff}
.btn-act:hover{background:var(--blue-700)}
.btn-sec{background:#fff;border:1.5px solid var(--grey-300);color:var(--navy)}
.btn-sec:hover{background:var(--grey-100)}
.btn-danger{background:var(--coral-600);color:#fff}
.btn-danger:hover{background:var(--coral-700)}
.btn-mint{background:var(--mint);color:var(--navy-900)}
.btn-mint:hover{background:var(--mint-600)}
.btn-ghost{color:var(--grey-600);padding:6px 12px;min-height:34px;border-radius:999px;font-family:var(--fb);font-weight:600;font-size:12.5px;letter-spacing:0;text-transform:none}
.btn-ghost:hover{background:var(--grey-100);color:var(--navy)}
.btn-sm{min-height:34px;padding:6px 14px;font-size:12px}
.btn-block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none !important;box-shadow:none !important}
.iconBtn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--grey-600)}
.iconBtn:hover{background:var(--grey-100);color:var(--navy)}

/* ---------- Shell ---------- */
#app{display:flex;min-height:100vh}
#side{width:232px;flex:none;background:var(--navy);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sideTop{padding:28px 22px 20px;border-bottom:1px solid rgba(255,255,255,.07)}
.sideTop img{width:126px;height:auto;display:block}
.sideTop .appTag{margin-top:12px;font-size:11px;letter-spacing:.3em;text-indent:0;text-align:left}
.nav{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.navLbl{font-family:var(--fd);font-weight:500;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#7E92B5;padding:14px 12px 6px}
.navBtn{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:10px;color:#C9D4E5;font-weight:600;font-size:13.5px;text-align:left}
.navBtn:hover{background:rgba(255,255,255,.06);color:#fff}
.navBtn.on{background:rgba(100,244,201,.12);color:var(--mint)}
.navBtn .cnt{margin-left:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.12);color:#fff;border-radius:99px;padding:1px 8px}
.navBtn .cnt.red{background:var(--coral-600)}
.sideFoot{margin-top:auto;padding:16px 20px 22px;border-top:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;gap:10px}
.whoBox{display:flex;align-items:center;gap:10px;font-size:12.5px;color:#DCE4EE}
.whoBox b{display:block;color:#fff;font-size:13px}
.sideLock{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:9px 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,.22);color:#DCE4EE;font-family:var(--fd);font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
.sideLock:hover{background:rgba(255,255,255,.09);color:#fff}
.syncLine{display:flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--fd);font-weight:500;color:#9DB0CC}
.dot{width:8px;height:8px;border-radius:50%;background:var(--grey-400);flex:none}
.dot.ok{background:var(--mint)} .dot.busy{background:var(--amber)} .dot.bad{background:var(--coral)}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
.topBar{display:flex;align-items:center;gap:14px;padding:18px 28px 14px;position:sticky;top:0;z-index:20;background:var(--off)}
.topBar h2{font-family:var(--fd);font-weight:600;font-size:24px;letter-spacing:.02em;text-transform:uppercase;color:var(--navy);white-space:nowrap}
.searchBox{flex:1;max-width:380px;margin-left:auto;position:relative}
.searchBox input{width:100%;padding:10px 14px 10px 38px;border-radius:999px;border:1.5px solid var(--grey-200);background:#fff;outline:none;min-height:42px}
.searchBox input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-100)}
.searchBox svg{position:absolute;left:13px;top:12px;color:var(--grey-400)}
#view{padding:4px 28px 60px;flex:1}
.mobBar{display:none}

/* ---------- Cards / tiles ---------- */
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh-xs);border:1px solid var(--grey-100)}
.cardHd{display:flex;align-items:center;gap:10px;padding:16px 20px 12px}
.cardHd h3{font-family:var(--fd);font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--navy)}
.cardHd .sub{font-size:12px;color:var(--grey-500)}
.cardBd{padding:4px 20px 18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile{background:#fff;border-radius:var(--r);border:1px solid var(--grey-100);box-shadow:var(--sh-xs);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:92px;transition:box-shadow .14s var(--ease),transform .14s var(--ease)}
.tile:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
.tile .n{font-family:var(--fd);font-weight:600;font-size:30px;line-height:1.1;color:var(--navy)}
.tile .l{font-size:12.5px;font-weight:600;color:var(--grey-600)}
.tile.red .n{color:var(--coral-700)} .tile.amber .n{color:var(--amber-700)} .tile.blue .n{color:var(--blue)} .tile.mint .n{color:var(--mint-700)}
.twoCol{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}

/* ---------- Due groups ---------- */
.dueGrp{margin-bottom:6px}
.dueGrp h4{font-family:var(--fd);font-weight:500;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey-500);padding:12px 0 6px;border-bottom:1px solid var(--grey-100)}
.dueGrp h4.red{color:var(--coral-700)}
.row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid var(--grey-100);cursor:pointer;border-radius:8px;width:100%;text-align:left}
.row:hover{background:var(--grey-50)}
.row .pt{font-weight:700;color:var(--navy);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:12px;color:var(--grey-500);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.empty{padding:28px 10px;text-align:center;color:var(--grey-500);font-size:13px}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap;background:var(--grey-100);color:var(--grey-600)}
.badge.t-aligner{background:var(--blue-100);color:var(--blue-700)}
.badge.t-lab{background:var(--mint-100);color:var(--mint-700)}
.badge.t-appl{background:var(--navy-100);color:var(--navy-700)}
.badge.t-ret{background:var(--amber-100);color:var(--amber-700)}
.badge.t-retx{background:var(--coral-100);color:var(--coral-700)}
.badge.t-misc{background:var(--grey-100);color:var(--grey-600)}
.due{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap;background:var(--grey-100);color:var(--grey-600)}
.due.over{background:var(--coral-100);color:var(--coral-700)}
.due.soon{background:var(--amber-100);color:var(--amber-700)}
.due.none{background:transparent;color:var(--grey-400);font-weight:600}
.av{width:28px;height:28px;border-radius:50%;background:var(--navy-600);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none;letter-spacing:.02em}
.av.none{background:var(--grey-200);color:var(--grey-500)}
.av.lg{width:36px;height:36px;font-size:13px}

/* ---------- Board ---------- */
.boardTabs,.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1.5px solid var(--grey-200);border-radius:99px;padding:6px 14px;font-size:12.5px;font-weight:600;color:var(--grey-600);background:#fff;min-height:36px}
.chip:hover{border-color:var(--navy-500);color:var(--navy)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .c{opacity:.7;margin-left:4px}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;scroll-snap-type:x proximity}
.col{flex:1 0 225px;max-width:320px;background:var(--grey-100);border-radius:var(--r);padding:10px;scroll-snap-align:start;max-height:calc(100vh - 230px);display:flex;flex-direction:column}
.colHd{display:flex;align-items:center;gap:8px;padding:4px 6px 10px}
.colHd h4{font-family:var(--fd);font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.colHd .c{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--grey-500)}
.colBd{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:40px;padding:2px}
.kc{position:relative;background:#fff;border-radius:11px;box-shadow:var(--sh-xs);border:1px solid var(--grey-200);padding:10px 11px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;width:100%}
.kc:hover{box-shadow:var(--sh-md);border-color:var(--grey-300)}
.kc .pt{font-weight:700;color:var(--navy);font-size:13.5px;line-height:1.3;padding-right:36px}
.kc .dt{font-size:12px;color:var(--grey-500);line-height:1.35}
.kc .ft{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kc .adv{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--blue);background:var(--blue-100)}
.kc .adv:hover{background:var(--blue);color:#fff}

/* ---------- Table ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select{padding:8px 12px;border:1.5px solid var(--grey-200);border-radius:999px;background:#fff;font-weight:600;font-size:12.5px;min-height:38px;color:var(--grey-700)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-family:var(--fd);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--grey-500);padding:11px 14px;border-bottom:1px solid var(--grey-100);white-space:nowrap}
.tbl th button{font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--grey-100);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.click{cursor:pointer}
.cleanup{margin-bottom:18px;border:1.5px solid var(--amber-200)}
.cleanup .oldPick select{margin-left:6px;padding:5px 8px;border-radius:8px;border:1.5px solid var(--grey-200);font:inherit;font-size:12.5px}
.cleanup .oldNo{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.oldList{max-height:320px;overflow:auto;border:1px solid var(--grey-100);border-radius:10px}
.oldRow{display:grid;grid-template-columns:22px minmax(0,1.2fr) minmax(0,1.6fr) auto;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--grey-100);cursor:pointer}
.oldRow:last-child{border-bottom:none}
.oldRow:hover{background:var(--grey-50)}
.oldRow input{width:17px;height:17px;accent-color:var(--navy)}
.oldRow .pt{font-weight:700;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oldRow .muted{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oldD{color:var(--coral-700);font-weight:600}
.oldAct{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.oldAct b{font-size:13px;color:var(--navy);margin-right:4px}
.tbl tr.click:hover td{background:var(--grey-50)}
.tbl .pt{font-weight:700;color:var(--navy)}
.tblWrap{overflow-x:auto}

/* ---------- Drawer ---------- */
#scrim{position:fixed;inset:0;background:rgba(17,32,58,.35);z-index:900}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;z-index:901;box-shadow:var(--sh-xl);display:flex;flex-direction:column}
.dHd{padding:20px 22px 14px;border-bottom:1px solid var(--grey-100);display:flex;gap:12px;align-items:flex-start}
.dHd h3{font-family:var(--fd);font-weight:600;font-size:21px;letter-spacing:.02em;color:var(--navy);line-height:1.2}
.dHd .sub{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.dBd{flex:1;overflow-y:auto;padding:16px 22px 26px}
.dFt{padding:12px 22px;border-top:1px solid var(--grey-100);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sec{margin-top:18px}
.sec h5{font-family:var(--fd);font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey-500);margin-bottom:8px}
.stepper{display:flex;flex-direction:column;gap:6px}
.step{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--grey-200);text-align:left;font-weight:600;font-size:13px;color:var(--grey-600);background:#fff;min-height:40px}
.step:hover{border-color:var(--blue-200);background:var(--blue-100)}

.tooth{flex:none;width:24px;height:34px;border:1.5px solid var(--grey-300);background:#fff;color:var(--grey-600);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:background .1s,border-color .1s}

.tRow.prim .tooth{height:26px;width:22px;font-size:10px;border-style:dashed;color:var(--grey-500)}

.tRow.perm.up,.tRow:first-of-type{align-items:flex-end}
.tooth:hover{border-color:var(--blue);background:var(--blue-100)}
.tooth.on,.tRow.prim .tooth.on{background:var(--coral-600);border-color:var(--coral-700);border-style:solid;color:#fff}
.arch{margin:5px 0;display:flex;align-items:center;gap:8px;font-family:var(--fd);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey-400);padding:0 4px;min-width:440px}

.chartFt{display:flex;gap:12px;align-items:flex-start;margin-top:10px}
.teethSay{flex:1;font-size:12.5px;color:var(--grey-600);line-height:1.45}
.teethSay b{color:var(--navy)}
.seg{display:inline-flex;border:1.5px solid var(--grey-200);border-radius:99px;overflow:hidden;flex:none}
.seg button{padding:5px 11px;font-size:11.5px;font-weight:700;color:var(--grey-500)}
.seg button.on{background:var(--navy);color:#fff}

.sDots{height:24px}
.sDot{justify-self:center;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center}

.helpQ{font-size:17px;font-weight:700;color:var(--navy);line-height:1.35;margin-bottom:12px}

.paper .pEncl{margin-top:1.2em;font-size:10pt}

.paper .pImg{page-break-before:always;break-before:page;margin-top:.5in;text-align:center}

.bar i{display:block;height:100%;background:var(--mint-600);transition:width .2s}

@media (max-width:1180px){ .bWrap{grid-template-columns:minmax(0,1fr)} .paperCol{position:static} .paperScroll{max-height:none} }
@media (max-width:600px){ .paper{padding:.5in .45in;font-size:10.5pt} .paper .pRe{margin-left:30%} .lhGrid{grid-template-columns:1fr} }

/* printing: only the letter, on plain letter paper */
@page{size:letter;margin:.65in .95in .7in}
@media print{
  html,body{background:#fff !important}
  #lockWrap,#side,#topSlot,.mobBar,.mobNav,#toasts,#demoBar,#modalWrap,.formCol,.paperBar,.lead,.ltGrid{display:none !important}
  #app,#main,#view,.bWrap,.paperCol,.paperScroll{display:block !important;padding:0 !important;margin:0 !important;background:none !important;max-height:none !important;overflow:visible !important;position:static !important;min-height:0 !important}
  .paper{box-shadow:none;padding:0;margin:0;max-width:none;min-height:0;width:auto}
  .paper .lh-plain{border:none;color:transparent;height:1.1in}
  .paper .blank{background:none;color:inherit}
}

  /* a URL-safe random secret (43 characters = 256 bits) */
  newSecret() { return b64(rnd(32)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
};

/* ---------- CSV ---------- */
/* Minimal RFC-4180 CSV parser (quoted fields, embedded newlines, "" escapes). */
function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; continue; }
    if (c === '"') q = true; else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  if (!rows.length) return [];
  const head = rows[0].map(h => h.replace(/^﻿/, '').trim());
  return rows.slice(1).filter(r => r.some(x => x.trim())).map(r => Object.fromEntries(head.map((h, i) => [h, r[i] == null ? '' : r[i]])));
}
/* spreadsheet-safe cell: a leading = + - @ (or tab/CR) would be run as a formula by Excel/Sheets */
function csvCell(v) {
  let s = String(v == null ? '' : v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return '"' + s.replace(/"/g, '""') + '"';
}

/* ---------- teeth ---------- */
/* Universal numbers 1–32 (permanent) and letters A–T (primary), as a US dental office writes them.
   Every tooth also has its plain name, and the letter always prints both — a number alone is too easy to misread. */
const TOOTH_KIND = ['third molar', 'second molar', 'first molar', 'second premolar', 'first premolar', 'canine', 'lateral incisor', 'central incisor'];
const PRIMARY_KIND = ['second molar', 'first molar', 'canine', 'lateral incisor', 'central incisor'];
const TEETH = (function () {
  const out = {};
  for (let n = 1; n <= 32; n++) {
    const upper = n <= 16, right = n <= 8 || n >= 25;
    const pos = n <= 8 ? n - 1 : n <= 16 ? 16 - n : n <= 24 ? n - 17 : 32 - n;           // 0 = third molar … 7 = central
    const quad = n <= 8 ? 1 : n <= 16 ? 2 : n <= 24 ? 3 : 4;
    out[String(n)] = { id: String(n), primary: false, upper, right, name: (upper ? 'upper ' : 'lower ') + (right ? 'right ' : 'left ') + TOOTH_KIND[pos], fdi: String(quad * 10 + (8 - pos)) };
  }
  'ABCDEFGHIJKLMNOPQRST'.split('').forEach((L, i) => {
    const upper = i < 10, right = i < 5 || i >= 15;
    const pos = i < 5 ? i : i < 10 ? 9 - i : i < 15 ? i - 10 : 19 - i;                     // 0 = second molar … 4 = central
    const quad = i < 5 ? 5 : i < 10 ? 6 : i < 15 ? 7 : 8;
    out[L] = { id: L, primary: true, upper, right, name: 'primary ' + (upper ? 'upper ' : 'lower ') + (right ? 'right ' : 'left ') + PRIMARY_KIND[pos], fdi: String(quad * 10 + (5 - pos)) };
  });
  return out;
})();
/* the chart's four rows, each left-to-right as you look at the patient (their right is on your left) */
const CHART_ROWS = {
  upper: Array.from({ length: 16 }, (_, i) => String(i + 1)),
  lower: Array.from({ length: 16 }, (_, i) => String(32 - i)),
  upperPrimary: 'ABCDEFGHIJ'.split(''),
  lowerPrimary: 'TSRQPONMLK'.split('')
};
const TOOTH_ORDER = CHART_ROWS.upper.concat(CHART_ROWS.upperPrimary, CHART_ROWS.lowerPrimary.slice().reverse(), CHART_ROWS.lower.slice().reverse());
function toothLabel(id, notation) { const t = TEETH[id]; if (!t) return ''; return '#' + (notation === 'fdi' ? t.fdi : t.id); }
function sortTeeth(ids) { return Array.from(new Set((ids || []).filter(id => TEETH[id]))).sort((a, b) => TOOTH_ORDER.indexOf(a) - TOOTH_ORDER.indexOf(b)); }
/* "#5 (upper right first premolar), #12 (upper left first premolar) and #21 (lower left first premolar)" */
function teethText(ids, notation) {
  return joinList(sortTeeth(ids).map(id => toothLabel(id, notation) + ' (' + TEETH[id].name + ')'));
}
function joinList(a) {
  a = (a || []).filter(Boolean);
  if (a.length < 2) return a[0] || '';
  if (a.length === 2) return a[0] + ' and ' + a[1];
  return a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
}
function capFirst(s) { s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); }

  },
  async loadRing(m) {
    const ring = Crypto.ringFrom(await Crypto.openFrom(FB.priv, m.ring, 'ring:' + FB.uid));
    FB.ring = ring; FB.keys = await Crypto.ringKeys(ring); FB.ringV = m.ringV || 0;
    const k = await FB.db.doc('meta/keys').get();
    FB.curV = k.exists ? k.data().current : 1;
  },
  /* first sign-in with a temporary password: choose a real one */
  async firstSetup(tempPw, newPw) {
    const m = FB.me; const uid = FB.uid;
    let ring;
    try { ring = Crypto.ringFrom(await Crypto.pwOpen(tempPw, m.boot, 'boot:' + uid)); }
    catch (e) { throw errCode('boot-failed'); }
    const cur = (await FB.db.doc('meta/keys').get()).data().current;
    if (!ring[cur]) throw errCode('boot-stale');
    const pair = await Crypto.newPair(); const pub = await Crypto.pubJwk(pair);
    const pbytes = await Crypto.privBytes(pair);
    const priv = await Crypto.pwSeal(newPw, pbytes, 'priv:' + uid);
    const ringBox = await Crypto.sealTo(pub, Crypto.ringBytes(ring), 'ring:' + uid);
    await FB.db.doc('members/' + uid).update({ pub, priv, ring: ringBox, ringV: cur });
    await FB.auth.currentUser.updatePassword(newPw);
    await FB.db.doc('members/' + uid).update({ mustSetup: false, boot: FB.del(), lastLogin: FB.ts() });
    FB.priv = await Crypto.importPriv(pbytes); FB.ring = ring; FB.keys = await Crypto.ringKeys(ring); FB.curV = cur; FB.ringV = cur;
    FB.me = Object.assign({}, FB.me, { mustSetup: false, pub });
  },
  /* owner forgot password → reset by email → recovery code restores the key ring */
  async recover(pw, code) {
    const uid = FB.uid;
    const r = (await FB.db.doc('meta/recovery').get()).data();
    let ring;
    try {
      const rpriv = await Crypto.importPriv(await Crypto.pwOpen(normCode(code), r.priv, 'recovery-priv'));
      ring = Crypto.ringFrom(await Crypto.openFrom(rpriv, r.ring, 'ring:recovery'));
    } catch (e) { throw errCode('bad-code'); }
    const pair = await Crypto.newPair(); const pub = await Crypto.pubJwk(pair); const pbytes = await Crypto.privBytes(pair);
    const priv = await Crypto.pwSeal(pw, pbytes, 'priv:' + uid);
    const ringBox = await Crypto.sealTo(pub, Crypto.ringBytes(ring), 'ring:' + uid);
    const v = Math.max.apply(null, Object.keys(ring).map(Number));
    await FB.db.doc('members/' + uid).update({ pub, priv, privPrev: FB.del(), ring: ringBox, ringV: v, lastLogin: FB.ts() });
    FB.priv = await Crypto.importPriv(pbytes); FB.ring = ring; FB.keys = await Crypto.ringKeys(ring); FB.ringV = v;
    FB.curV = (await FB.db.doc('meta/keys').get()).data().current;
  },
  async sendReset(email) { await FB.auth.sendPasswordResetEmail(email); },
  async changePassword(cur, next) {
    const u = FB.auth.currentUser;
    await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, cur));
    const m = (await FB.db.doc('members/' + FB.uid).get()).data();
    let bytes;
    try { bytes = await Crypto.pwOpen(cur, m.priv, 'priv:' + FB.uid); }
    catch (e) { bytes = await Crypto.pwOpen(cur, m.privPrev, 'priv:' + FB.uid); }
    const priv = await Crypto.pwSeal(next, bytes, 'priv:' + FB.uid);
    // keep the old sealed copy until the login password has really changed
    const privPrev = await Crypto.pwSeal(cur, bytes, 'priv:' + FB.uid);
    await FB.db.doc('members/' + FB.uid).update({ priv, privPrev });
    await u.updatePassword(next);
    await FB.db.doc('members/' + FB.uid).update({ privPrev: FB.del() });
  },
  async signOut() {
    FB.stop();
    FB.priv = FB.ring = FB.keys = FB.me = FB.uid = null; FB.curV = FB.ringV = 0; FB.queues = {};
    try { await FB.auth.signOut(); } catch (e) { }
  },
  stop() { FB.unsubs.forEach(u => { try { u(); } catch (e) { } }); FB.unsubs = []; },

  /* ---------- live data ---------- */
  async openDoc(id, d) {
    const key = FB.keys && FB.keys[d.v];
    if (!key) throw errCode('no-key', 'Missing key version ' + d.v);
    const data = cleanDoc(await Crypto.openJSON(key, d, 'ref:' + id));
    return Object.assign(data, { id, rev: d.rev, v: d.v, updatedAt: FB.tsMs(d.updatedAt), by: d.sid || '' });
  },
  start(h) {
    FB.stop();
    const uid = FB.uid;
    FB.unsubs.push(FB.db.doc('members/' + uid).onSnapshot(async s => {
      if (!s.exists || !s.data().active) return h.revoked();
      const m = s.data();
      if (m.ringV && m.ringV !== FB.ringV && m.ring) { try { await FB.loadRing(m); h.rekeyed(); } catch (e) { h.error(e); } }
    }, e => h.revoked(e)));
    FB.unsubs.push(FB.db.doc('meta/keys').onSnapshot(s => { if (s.exists) FB.curV = s.data().current; }, () => { }));
    FB.unsubs.push(FB.db.doc('meta/settings').onSnapshot(s => h.settings(s.exists ? s.data() : {}), () => { }));
    FB.unsubs.push(FB.db.collection('refDocs').onSnapshot(async snap => {
      const up = [], gone = [];
      for (const ch of snap.docChanges()) {
        if (ch.type === 'removed') { gone.push(ch.doc.id); continue; }
        try { up.push(await FB.openDoc(ch.doc.id, ch.doc.data())); }
        catch (e) { up.push(Object.assign(blankDoc(), { id: ch.doc.id, locked: true, last: '(locked record)' })); }
      }
      h.docs(up, gone);
    }, e => h.docsError(e)));
    FB.unsubs.push(FB.db.doc('refCfg/office').onSnapshot(async s => {
      if (!s.exists) return h.office(null);
      try { const d = s.data(); h.office(await Crypto.openJSON(FB.keys[d.v], d, 'refcfg:office')); } catch (e) { h.office(null); }
    }, () => h.office(null)));
  },

  /* ---------- writes ---------- */
  plain(data) { const o = {}; DOC_FIELDS.forEach(k => { o[k] = data[k] || ''; }); if (data.off) o.off = true; return o; },
  async sealed(id, data) {
    const v = FB.curV; const box = await Crypto.sealJSON(FB.keys[v], FB.plain(cleanDoc(data)), 'ref:' + id);
    return { v, iv: box.iv, ct: box.ct, by: FB.uid, sid: FB.me.staffId, updatedAt: FB.ts() };
  },
  /* add a list of doctors; small batches keep each one well inside the rules' lookup limit, a few batches at a time */
  async addDocs(list, progress) {
    const PER = 5, LANES = 4; let n = 0; const ids = new Array(list.length);
    const chunks = []; for (let i = 0; i < list.length; i += PER) chunks.push(i);
    const lane = async () => {
      while (chunks.length) {
        const i = chunks.shift(); const b = FB.db.batch();
        for (let j = i; j < Math.min(i + PER, list.length); j++) {
          const ref = FB.db.collection('refDocs').doc();
          b.set(ref, Object.assign(await FB.sealed(ref.id, list[j]), { rev: 1, createdAt: FB.ts() }));
          ids[j] = ref.id;
        }
        await b.commit(); n += Math.min(PER, list.length - i); if (progress) progress(n, list.length);
      }
    };
    await FB.track(Promise.all(Array.from({ length: Math.min(LANES, chunks.length) }, lane)));
    return ids;
  },
  async addDoc(data) { return (await FB.addDocs([data]))[0]; },
  /* one person's saves to the same doctor run one after another, never racing each other */
  saveDoc(id, data) {
    const run = () => FB._save(id, data, 0);
    const p = (FB.queues[id] || Promise.resolve()).then(run, run);
    FB.queues[id] = p.catch(() => { });
    return p;
  },
  async _save(id, data, tries) {
    const ref = FB.db.doc('refDocs/' + id);
    try {
      await FB.track(FB.db.runTransaction(async tx => {
        const s = await tx.get(ref); if (!s.exists) throw errCode('gone');
        tx.update(ref, Object.assign(await FB.sealed(id, data), { rev: s.data().rev + 1 }));
      }));
    } catch (e) {
      if (tries < 2 && /permission/i.test(e.code || e.message || '')) {
        // the office key may have just been changed: refresh it and try again
        const m = (await FB.db.doc('members/' + FB.uid).get()).data();
        if (!m || !m.active) throw e;
        await FB.loadRing(m);
        await new Promise(r => setTimeout(r, 150 + Math.random() * 350));
        return FB._save(id, data, tries + 1);
      }
      throw e;
    }
  },
  /* owner only (staff hide a doctor instead) */
  async deleteDoc(id) { await FB.track(FB.db.doc('refDocs/' + id).delete()); },
  async saveOffice(cfg) {
    const v = FB.curV; const box = await Crypto.sealJSON(FB.keys[v], cfg, 'refcfg:office');
    await FB.track(FB.db.doc('refCfg/office').set({ v, iv: box.iv, ct: box.ct, by: FB.uid, updatedAt: FB.ts() }));
  },
  /* after the office key changes: put every record still under an older key under the new one (owner's app does this quietly) */
  async resealOld(progress) {
    const snap = await FB.db.collection('refDocs').where('v', '<', FB.curV).get(); let n = 0;
    for (const d of snap.docs) {
      try { const data = await FB.openDoc(d.id, d.data()); await FB._save(d.id, data, 0); } catch (e) { }
      n++; if (progress) progress(n, snap.size);
    }
    return snap.size;
  }
};

function toast(msg, opt) {

  el.textContent = msg; $('#toasts').appendChild(el); setTimeout(() => el.remove(), opt.ms || 3800);

function errText(e) {
  const c = (e && (e.code || e.message)) || '';
  if (/no-user/.test(c)) return 'No login with that username.';
  if (/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return 'Username or password is incorrect.';
  if (/inactive/.test(c)) return 'This login has been turned off. Ask Dr. A.';
  if (/not-member/.test(c)) return 'That account isn’t part of the office.';
  if (/too-many-requests/.test(c)) return 'Too many attempts. Wait a minute and try again.';
  if (/network|unavailable/.test(c)) return 'Can’t reach the server. Check the internet connection.';
  if (/weak-password/.test(c)) return 'Password needs at least 8 characters.';
  if (/boot-failed/.test(c)) return 'That temporary password didn’t work. Ask Dr. A to reissue your login.';
  if (/boot-stale/.test(c)) return 'This invite expired after a security update. Ask Dr. A to reissue your login.';
  if (/bad-code/.test(c)) return 'That recovery code didn’t work. Check it and try again.';
  if (/permission/.test(c)) return 'Not allowed. Your access may have changed.';
  if (/gone/.test(c)) return 'That doctor is no longer in the directory.';
  if (/requires-recent-login/.test(c)) return 'Please sign in again, then retry.';
  return (e && e.message) ? String(e.message).replace(/^Firebase:\s*/, '') : 'Something went wrong.';
}

  try { S.lastLogin = localStorage.getItem('nloLetters.lastLogin') || localStorage.getItem('nloCases.lastLogin') || ''; } catch (e) { }
  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('input', onInput);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modalWrap')) closeModal(); });
  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { S.lastAct = Date.now(); }, { passive: true }));
  window.addEventListener('afterprint', () => document.body.classList.remove('printing'));
  if (S.demo) { B = DEMO; $('#demoBar').classList.remove('hidden'); document.body.classList.add('demo'); lockScreen('login'); return; }
  B = FB;
  if (!FB.init(S.emu)) { lockScreen('unconfigured'); return; }
  FB.onSync = renderSync;
  FB.ready().then(() => lockScreen('login'));
  window.addEventListener('online', renderSync); window.addEventListener('offline', renderSync);
}

      '<button class="btn btn-pri btn-block" type="submit">Unlock</button></form>' +

  } else if (mode === 'broken') {
    h = '<h1>Login needs a reset</h1><div class="lsub">Your password was changed outside the app.</div><p class="desc">Ask Dr. A to reissue your login from NLO Cases → Team &amp; security.</p>' +

function busyBtn(btn, on, label) { if (!btn) return; if (on) { btn.dataset.l = btn.textContent; btn.textContent = label || 'Working…'; btn.disabled = true; } else { btn.textContent = btn.dataset.l || btn.textContent; btn.disabled = false; } }
function bindLockForms() {
  const lf = $('#loginForm');
  if (lf) lf.onsubmit = async e => {
    e.preventDefault(); const btn = $('#lgBtn'); const user = $('#lgUser').value.trim(); const pw = $('#lgPw').value;
    busyBtn(btn, true, 'Signing in…');
    try {
      const r = await B.signIn(user, pw);
      S.lastLogin = user; try { localStorage.setItem('nloLetters.lastLogin', user); } catch (x) { }
      S.loginPw = pw;
      if (r.state === 'ok') { S.loginPw = ''; enterApp(); } else lockScreen(r.state);
    } catch (x) { busyBtn(btn, false); lockScreen('login', { err: errText(x) }); }
  };
  const ff = $('#firstForm');
  if (ff) ff.onsubmit = async e => {
    e.preventDefault(); const a = $('#fpw1').value, b = $('#fpw2').value;
    if (a.length < 8) return lockScreen('first', { err: 'Use at least 8 characters.' });
    if (a !== b) return lockScreen('first', { err: 'The two passwords don’t match.' });
    if (a === S.loginPw) return lockScreen('first', { err: 'Pick something different from the temporary password.' });
    busyBtn($('#fBtn'), true, 'Saving…');
    try { await B.firstSetup(S.loginPw, a); S.loginPw = ''; enterApp(); } catch (x) { lockScreen('first', { err: errText(x) }); }
  };
  const rf = $('#recForm');
  if (rf) rf.onsubmit = async e => {
    e.preventDefault(); busyBtn($('button[type=submit]', rf), true, 'Unlocking…');
    try { await B.recover(S.loginPw, $('#recCode').value); S.loginPw = ''; toast('Unlocked. Your recovery code still works — keep it safe.'); enterApp(); }
    catch (x) { lockScreen('recover', { err: errText(x) }); }
  };
  const fg = $('#forgotForm');
  if (fg) fg.onsubmit = async e => {
    e.preventDefault();
    try { await B.sendReset($('#fgEmail').value.trim()); lockScreen('forgot', { ok: 'If that email has a login, a reset link is on its way.' }); }
    catch (x) { lockScreen('forgot', { err: errText(x) }); }
  };
}

/* ---------- enter / leave ---------- */
function enterApp() {
  Object.assign(S, { inApp: true, docs: new Map(), docsReady: false, docsErr: '', office: officeCfg(null), view: 'write', docQ: '', q: '', typeF: '', showOff: false, lastAct: Date.now(), imp: null });
  S.draft = blankDraft('', S.office);
  $('#lockWrap').classList.add('hidden'); $('#app').classList.remove('hidden');
  renderShell(); renderView();
  B.start({
    docs(up, gone) {
      up.forEach(d => S.docs.set(d.id, d)); gone.forEach(id => S.docs.delete(id));
      S.docsReady = true; S.docsErr = '';
      if (S.draft.docId && S.docs.has(S.draft.docId)) S.draft.doc = S.docs.get(S.draft.docId);
      if (S.view === 'doctors') renderView(); else if (S.view === 'write' && S.draft.letter) { renderDocPick(); updatePaper(); }
      renderNav();
    },
    docsError(e) {
      S.docsReady = true;
      S.docsErr = /permission/.test((e && e.code) || '') ? 'The office database isn’t ready for the doctor directory yet (Dr. A: publish the updated rules). You can still write a letter by adding the doctor by hand.' : errText(e);
      if (S.view === 'doctors' || (S.view === 'write' && S.draft.letter)) renderView();
    },
    office(saved) {
      const before = S.office; S.office = officeCfg(saved);
      if (!S.draft.letter) { S.draft.letterhead = S.office.letterhead; S.draft.notation = S.office.notation; }
      if (S.view === 'settings' && !$('#setForm:focus-within')) renderView();
      else if (S.view === 'write' && S.draft.letter && JSON.stringify(before) !== JSON.stringify(S.office)) { regenText(); updatePaper(); }
    },
    settings(s) { S.settings = Object.assign({ idleMin: 10 }, s || {}); },
    revoked() { lockOut('Your access was turned off.'); },
    rekeyed() { if (S.inApp && isOwner()) setTimeout(() => B.resealOld().catch(() => { }), 1500); },
    error(e) { if (/permission/.test((e && e.code) || '')) lockOut('Your access changed. Sign in again.'); else toast(errText(e), { bad: true }); }
  });
  clearInterval(S.idleTimer);
  S.idleTimer = setInterval(() => {
    const mins = Number(S.settings.idleMin) || 10;
    if (S.inApp && Date.now() - S.lastAct > mins * 60000) lockOut('Locked after ' + mins + ' minutes without activity.');
  }, 15000);
  if (isOwner()) setTimeout(() => { if (S.inApp) B.resealOld().catch(() => { }); }, 6000);
}
async function lockOut(msg) {
  if (!S.inApp) return;
  S.inApp = false; clearInterval(S.idleTimer); closeModal();
  // the letter in progress (the only place a patient's name ever is) goes with the lock
  Object.assign(S, { docs: new Map(), docsReady: false, draft: blankDraft('', null), imp: null, docQ: '', q: '' });
  $('#view').innerHTML = ''; $('#topSlot').innerHTML = '';
  await B.signOut();
  lockScreen('login', { ok: msg });
}
function isOwner() { return B.isOwner(); }
function liveDocs() { return Array.from(S.docs.values()).filter(d => !d.locked); }

/* marking a spot keeps "How many in all" in step with the chart (it can still be raised by hand for places picked as words) */

/* ---------- modals ---------- */
function openModal(html, onReady) {
  closeModal();
  const w = document.createElement('div'); w.id = 'modalWrap';
  w.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + '</div>';
  document.body.appendChild(w);
  const f = $('input:not([type=hidden]):not([type=file]),select,textarea', w); if (f) f.focus();
  if (onReady) onReady(w);
  return w;
}
function closeModal() { const w = $('#modalWrap'); if (w) w.remove(); }
function confirmBox(title, text, okLabel, danger) {
  return new Promise(res => {
    openModal('<h3>' + esc(title) + '</h3><p class="lsub" style="font-size:13.5px;color:var(--grey-600)">' + esc(text) + '</p><div class="mFt"><button class="btn btn-sec" id="cbNo">Cancel</button><button class="btn ' + (danger ? 'btn-danger' : 'btn-pri') + '" id="cbYes">' + esc(okLabel) + '</button></div>', w => {
      $('#cbNo', w).onclick = () => { closeModal(); res(false); }; $('#cbYes', w).onclick = () => { closeModal(); res(true); }; $('#cbYes', w).focus();
    });
  });
}
async function copyText(s) {
  try { await navigator.clipboard.writeText(s); return true; } catch (e) { }
  try { const t = document.createElement('textarea'); t.value = s; document.body.appendChild(t); t.select(); const ok = document.execCommand('copy'); t.remove(); return ok; } catch (e) { return false; }
}
function draftTouched() { const d = S.draft; return !!(d.first || d.last || d.dob || d.doc || d.teeth.length || d.teeth2.length || d.sites.length || d.edited || d.images.length || Object.keys(d.opt).length); }
/* a picture is shrunk in the browser before it goes on the page: big enough to read, small enough to print quickly */
function readImage(file) {
  return new Promise((res, rej) => {
    const r = new FileReader(); r.onerror = () => rej(new Error('Couldn’t read ' + file.name));
    r.onload = () => { const im = new Image(); im.onerror = () => rej(new Error(file.name + ' isn’t a picture this page can open.'));
      im.onload = () => { const max = 2000, k = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res({ name: file.name, src: c.toDataURL('image/jpeg', 0.9) }); };
      im.src = r.result; };
    r.readAsDataURL(file);
  });
}

/* ---------- actions ---------- */
Object.assign(ACT, {
  nav(t) { S.view = t.dataset.v; S.q = ''; S.qFocus = false; closeModal(); renderView(); window.scrollTo(0, 0); },
  pickLetter(t) { const keep = S.draft; S.draft = Object.assign(blankDraft(t.dataset.id, S.office), { first: keep.first, last: keep.last, dob: keep.dob, rpPhone: keep.rpPhone, docId: keep.docId, doc: keep.doc }); S.docQ = ''; regenText(); renderView(); window.scrollTo(0, 0); },
  async startOver() {
    if (draftTouched() && !(await confirmBox('Start a different letter?', 'What you picked for this letter is cleared. The patient and the doctor stay filled in.', 'Different letter'))) return;
    const k = S.draft; S.draft = Object.assign(blankDraft('', S.office), { first: k.first, last: k.last, dob: k.dob, rpPhone: k.rpPhone, docId: k.docId, doc: k.doc }); renderView(); window.scrollTo(0, 0);
  },
  opt(t) {
    const letter = letterById(S.draft.letter), o = letter.opts.find(x => x.key === t.dataset.k), c = t.dataset.c, d = S.draft;
    if (o.multi) { const a = Array.isArray(d.opt[o.key]) ? d.opt[o.key].slice() : []; const i = a.indexOf(c); if (i < 0) a.push(c); else a.splice(i, 1); d.opt[o.key] = o.choices.map(ch => ch[0]).filter(k => a.includes(k)); }
    else d.opt[o.key] = d.opt[o.key] === c ? '' : c;
    $$('.chip[data-k="' + o.key + '"]').forEach(b => { const on = isPicked(o, b.dataset.c); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    if (letter.sites && o.key === 'site') syncSiteCount();
    regenText(); updatePaper();
  },
  tooth(t) {
    const d = S.draft, set = t.dataset.set, id = t.dataset.id, i = d[set].indexOf(id);
    if (i < 0) d[set].push(id); else d[set].splice(i, 1);
    t.classList.toggle('on', i < 0); t.setAttribute('aria-pressed', i < 0);
    $('#teethSay-' + set).innerHTML = teethSay(set); regenText(); updatePaper();
  },
  site(t) {
    const d = S.draft, id = t.dataset.id, i = d.sites.indexOf(id);
    if (i < 0) d.sites.push(id); else d.sites.splice(i, 1);
    t.classList.toggle('on', i < 0); t.setAttribute('aria-pressed', i < 0);
    $('#sitesSay').innerHTML = sitesSay(); syncSiteCount(); regenText(); updatePaper();
  },
  clearSites() { S.draft.sites = []; $$('.sDot.on').forEach(b => { b.classList.remove('on'); b.setAttribute('aria-pressed', 'false'); }); $('#sitesSay').innerHTML = sitesSay(); syncSiteCount(); regenText(); updatePaper(); },
  exposureHelp() { S.help = []; exposureHelpRender(); },
  helpPick(t) { S.help = (S.help || []).concat(Number(t.dataset.i)); exposureHelpRender(); },
  helpBack() { S.help = (S.help || []).slice(0, -1); exposureHelpRender(); },
  helpUse() {
    const step = exposureStep(S.help || []); if (!step || !step.result) return;
    const d = S.draft, letter = letterById(d.letter), r = step.result;
    d.opt.how = r.how; if (r.side) d.opt.side = r.side;
    if (r.how !== 'closed' && d.opt.chain === 'chain') d.opt.chain = ''; // a chain goes with a closed exposure
    if (r.how === 'closed' && !d.opt.chain) d.opt.chain = 'chain';
    ['how', 'side', 'chain'].forEach(k => { const o = letter.opts.find(x => x.key === k); $$('.chip[data-k="' + k + '"]').forEach(b => { const on = isPicked(o, b.dataset.c); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }); });
    closeModal(); regenText(); updatePaper(); toast('Filled in the type of exposure');
  },
  clearTeeth(t) { const set = t.dataset.set; S.draft[set] = []; $$('#chart-' + set + ' .tooth.on').forEach(b => { b.classList.remove('on'); b.setAttribute('aria-pressed', 'false'); }); $('#teethSay-' + set).innerHTML = teethSay(set); regenText(); updatePaper(); },
  notation(t) {
    S.draft.notation = t.dataset.v;
    ['teeth', 'teeth2', 'sites'].forEach(set => { const c = $('#chart-' + set); if (!c) return; const sec = c.closest('.bSec'); const h4 = sec.querySelector('h4').outerHTML; sec.innerHTML = h4 + (set === 'sites' ? siteChartHTML() : chartHTML(set)); });
    regenText(); updatePaper(); if (S.draft.edited) toast('The numbers in your edited wording were left as you typed them.');
  },
  letterhead(t) { S.draft.letterhead = t.dataset.v; $$('.lhOpt').forEach(b => { const on = b.dataset.v === t.dataset.v; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }); updatePaper(); },
  resetText() { S.draft.edited = false; regenText(); $('#resetText').classList.add('hidden'); updatePaper(); },
  pickDoc(t) { const doc = S.docs.get(t.dataset.id); if (!doc) return; S.draft.docId = doc.id; S.draft.doc = doc; S.docQ = ''; renderDocPick(); updatePaper(); },
  changeDoc() { S.draft.docId = ''; S.draft.doc = null; renderDocPick(); updatePaper(); const q = $('#docQ'); if (q) q.focus(); },
  newDoc() {
    const hand = !!S.docsErr && S.view === 'write';
    const seed = blankDoc(); const letter = letterById(S.draft.letter); if (S.view === 'write' && letter) seed.type = letter.to[0];
    docModal(null, { use: S.view === 'write', hand, doc: seed });
  },
  editDoc(t) { docModal(t.dataset.id); },
  editHandDoc() { docModal(null, { hand: true, doc: S.draft.doc }); },
  async delDoc(t) {
    const d = S.docs.get(t.dataset.id); if (!d) return;
    if (!(await confirmBox('Delete ' + docListName(d) + '?', 'This removes the doctor from the directory for everyone. To keep the record but stop offering it, use “Hide” instead.', 'Delete', true))) return;
    try { await B.deleteDoc(d.id); if (S.draft.docId === d.id) { S.draft.docId = ''; S.draft.doc = null; } toast('Deleted'); renderView(); } catch (e) { toast(errText(e), { bad: true }); }
  },
  importDocs() { importModal(); },
  async runImport() {
    const i = S.imp; if (!i || !i.fresh.length || i.busy) return;
    i.busy = true; impInfo();
    try {
      await B.addDocs(i.fresh, (n, tot) => { const b = $('#impBar'); if (b) b.style.width = Math.round(n / tot * 100) + '%'; });
      toast(i.fresh.length + ' doctors added'); closeModal(); S.imp = null; renderView();
    } catch (e) { i.busy = false; i.err = errText(e) + ' Some doctors may have been added; choose the file again to add the rest.'; impInfo(); }
  },
  exportDocs() {
    const blob = new Blob(['﻿' + docsToCSV(liveDocs())], { type: 'text/csv' }); const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'NLO_doctor_directory_' + todayISO() + '.csv'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  },
  rmImage(t) { S.draft.images.splice(Number(t.dataset.i), 1); $('#imgList').innerHTML = imagesHTML(); updatePaper(); },
  async print() {
    const probs = draftProblems(S.draft);
    if (probs.length && !(await confirmBox('Print it anyway?', probs.join(' '), 'Print anyway'))) return;
    document.body.classList.add('printing');
    const title = document.title; document.title = [letterById(S.draft.letter).label + ' letter', (S.draft.last || '').trim(), (S.draft.first || '').trim()].filter(Boolean).join(' - ');
    const imgs = $$('#paper img'); await Promise.all(imgs.map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
    window.print(); document.title = title;
    setTimeout(() => document.body.classList.remove('printing'), 500);
  },
  closeModal() { closeModal(); },
  lock() { lockOut('Locked. Sign in to continue.'); },
  lockSignOut() { B.signOut().then(() => lockScreen('login')); },
  forgot() { lockScreen('forgot'); },
  toLogin() { lockScreen('login'); },
  copyVal(t) { copyText(t.dataset.v).then(ok => toast(ok ? 'Copied' : 'Couldn’t copy — select it and copy by hand', ok ? {} : { bad: true })); }
});
Object.assign(CHG, {
  typeF(t) { S.typeF = t.value; S.qFocus = false; renderView(); },
  showOff(t) { S.showOff = t.checked; S.qFocus = false; renderView(); }
});
function onClick(e) {
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (t.tagName === 'SELECT' || (t.tagName === 'INPUT' && t.type !== 'button' && t.type !== 'submit')) return;
  if (ACT[t.dataset.act]) ACT[t.dataset.act](t, e);
}
async function onChange(e) {
  const t = e.target;
  if (t.dataset && t.dataset.chg && CHG[t.dataset.chg]) return CHG[t.dataset.chg](t, e);
  if (t.id === 'imgFile') {
    for (const f of Array.from(t.files || []).slice(0, 6 - S.draft.images.length)) { try { S.draft.images.push(await readImage(f)); } catch (x) { toast(x.message, { bad: true }); } }
    t.value = ''; if ($('#imgList')) { $('#imgList').innerHTML = imagesHTML(); updatePaper(); } return;
  }
  if (t.id === 'impFile' && t.files && t.files[0]) {
    try {
      const r = docsFromCSV(await t.files[0].text()); const have = new Set(liveDocs().map(docKey));
      const fresh = r.docs.filter(d => !have.has(docKey(d)));
      S.imp = { fresh, have: r.docs.length - fresh.length, skipped: r.skipped, err: r.docs.length ? '' : 'No doctors were found in that file. It should be the CSV with the columns Type, Last, First, Practice, Address, City/State/Zip, Email, Phone.' };
    } catch (x) { S.imp = { fresh: [], have: 0, skipped: 0, err: 'That file couldn’t be read.' }; }
    impInfo();
  }
}
function onInput(e) {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value; S.qFocus = true; renderView(); return; }
  if (t.id === 'docQ') { S.docQ = t.value; renderDocPick(); return; }
  if (t.id === 'ltText') { S.draft.text = t.value; S.draft.edited = t.value !== letterText(S.draft, S.office); $('#resetText').classList.toggle('hidden', !S.draft.edited); updatePaper(); return; }
  if (t.dataset && t.dataset.d && $('#paper')) { S.draft[t.dataset.d] = t.value; if (t.dataset.d === 'first') regenText(); updatePaper(); }
}
document.addEventListener('submit', async e => {
  if (e.target.id !== 'setForm') return;
  e.preventDefault(); const cfg = {}; $$('[data-k]', e.target).forEach(i => { cfg[i.dataset.k] = i.value.trim(); });
  if (!validEmail(cfg.records)) return toast('“Where reports should be sent” needs to be an email address.', { bad: true });
  const btn = $('button[type=submit]', e.target); busyBtn(btn, true, 'Saving…');
  try { await B.saveOffice(officeCfg(cfg)); toast('Saved'); } catch (x) { toast(errText(x), { bad: true }); }
  busyBtn(btn, false);
});

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
