<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-VW6pK83bI68J5w9QZbOpEAMgNqklxp1lWEJpY2T6R5o=' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://www.google.com/images/cleardot.gif; connect-src 'self' https://*.googleapis.com https://app.asana.com https://*.run.app https://aisa-worker.akhavan-ak.workers.dev https://nlo-inventory-default-rtdb.firebaseio.com http://127.0.0.1:8080 http://127.0.0.1:9099 http://127.0.0.1:8090; frame-src https://*.firebaseapp.com; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="theme-color" content="#1B2F4C">
<title>NLO Leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* NLO brand palette — same values as Staff Hub / Onboarding */
  --navy-900:#11203A; --navy:#1B2F4C; --navy-700:#294169; --navy-600:#385686; --navy-500:#5471A0; --navy-100:#E8ECF2;
  --blue-800:#122874; --blue-700:#16318C; --blue:#1D3EA9; --blue-500:#2E52C9; --blue-200:#BCC8EE; --blue-100:#E5EAF8;
  --coral-700:#D8412E; --coral-600:#EE4F3A; --coral:#FA624D; --coral-200:#FFC8BF; --coral-100:#FFE7E1;
  --mint-700:#1F9E7E; --mint-600:#34C49E; --mint:#64F4C9; --mint-200:#C0FBEC; --mint-100:#E2FBF4;
  --amber-700:#C2820A; --amber-600:#E29A14; --amber:#F6AF24; --amber-200:#FCE2A6; --amber-100:#FEF2D7;
  --grey-50:#F7F8F9; --grey-100:#ECEEF0; --grey-200:#DCE0E4; --grey-300:#C3C9D0; --grey-400:#969FAB; --grey-500:#6B7685; --grey-600:#4C5868; --grey-700:#33404F;
  --off:#F2F3F4; --card:#FFFFFF;
  --fd:'Oswald',system-ui,sans-serif;
  --fb:'Montserrat',system-ui,-apple-system,sans-serif;
  --sh-xs:0 1px 2px rgba(17,32,58,.07); --sh-sm:0 2px 6px rgba(17,32,58,.08);
  --sh-md:0 8px 24px rgba(17,32,58,.10); --sh-lg:0 18px 48px rgba(17,32,58,.15); --sh-xl:0 32px 70px rgba(17,32,58,.22);
  --r-sm:8px; --r:14px; --r-lg:22px;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--fb);background:var(--off);color:var(--grey-700);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--grey-700)}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue-500);outline-offset:2px;border-radius:4px}
svg.i{flex:none;display:inline-block;vertical-align:-3px}
.hidden{display:none !important}
.muted{color:var(--grey-500)}
.small{font-size:12.5px}

/* ---------- Demo banner ---------- */
#demoBar{position:fixed;left:0;right:0;bottom:0;z-index:2000;background:var(--amber);color:var(--navy-900);text-align:center;font-family:var(--fd);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px;padding:7px 12px}

/* ---------- Lock ---------- */
#lockWrap{position:fixed;inset:0;background:linear-gradient(158deg,var(--navy-900) 0%,var(--navy) 62%,#20395C 100%);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;overflow:hidden auto}
#lockWrap::before{content:"";position:absolute;width:680px;height:680px;border-radius:50%;border:88px solid rgba(255,255,255,.03);top:-300px;right:-220px;pointer-events:none}
#lockWrap::after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;border:70px solid rgba(100,244,201,.045);bottom:-260px;left:-180px;pointer-events:none}
.lockCol{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;width:100%;max-width:440px;margin:auto;padding:24px 0}
.lockBrand{display:flex;flex-direction:column;align-items:center;gap:14px}
.lockBrand img{width:160px;height:auto;display:block}
.appTag{font-family:var(--fd);font-weight:500;font-size:13px;letter-spacing:.34em;text-transform:uppercase;color:var(--mint);text-indent:.34em}
.lockCard{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-xl);width:100%;padding:32px 34px 28px}
.lockCard h1{font-family:var(--fd);font-weight:600;font-size:22px;letter-spacing:.03em;text-transform:uppercase;color:var(--navy)}
.lockCard .lsub{font-size:12.5px;color:var(--grey-500);margin-top:3px}
.lockCard p.desc{color:var(--grey-500);font-size:13.5px;margin:12px 0 18px}
.lockErr{background:var(--coral-100);color:var(--coral-700);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:500;margin-bottom:14px}
.lockOk{background:var(--mint-100);color:var(--mint-700);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:500;margin-bottom:14px}
.lockFoot{margin-top:16px;font-size:12px;color:var(--grey-400);text-align:center}
.lockFoot a,.linkBtn{color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.lockMeta{display:flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:.06em;color:#9DB0CC;text-transform:uppercase;font-family:var(--fd);font-weight:500}
.ackBox{display:flex;gap:10px;align-items:flex-start;background:var(--amber-100);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--amber-700);margin-bottom:16px;line-height:1.5}
.ackBox input{margin-top:2px;accent-color:var(--amber-600)}
.codeBox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;letter-spacing:.08em;background:var(--grey-50);border:1.5px dashed var(--grey-300);border-radius:12px;padding:16px;text-align:center;color:var(--navy);word-break:break-all;margin:6px 0 14px;user-select:all}

/* ---------- Fields ---------- */
.field{margin-bottom:14px}
.field label,.flabel{display:block;font-family:var(--fd);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey-500);margin-bottom:6px}
.field input,.field select,.field textarea,.inp{width:100%;padding:10px 13px;border:1.5px solid var(--grey-200);border-radius:10px;background:#fff;outline:none;transition:border-color .14s var(--ease),box-shadow .14s var(--ease);min-height:42px}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-100)}
.field textarea{resize:vertical;min-height:70px;line-height:1.45}
.field .hint{font-size:11.5px;color:var(--grey-500);margin-top:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 14px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:9px 20px;border-radius:999px;font-family:var(--fd);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;line-height:1.1;white-space:nowrap;transition:background .14s var(--ease),transform .14s var(--ease),box-shadow .14s var(--ease)}
.btn:active{transform:scale(.985)}
.btn-pri{background:var(--navy);color:#fff;box-shadow:var(--sh-xs)}
.btn-pri:hover{background:var(--navy-900);box-shadow:var(--sh-md)}
.btn-act{background:var(--blue);color:#fff}
.btn-act:hover{background:var(--blue-700)}
.btn-sec{background:#fff;border:1.5px solid var(--grey-300);color:var(--navy)}
.btn-sec:hover{background:var(--grey-100)}
.btn-danger{background:var(--coral-600);color:#fff}
.btn-danger:hover{background:var(--coral-700)}
.btn-mint{background:var(--mint);color:var(--navy-900)}
.btn-mint:hover{background:var(--mint-600)}
.btn-ghost{color:var(--grey-600);padding:6px 12px;min-height:34px;border-radius:999px;font-family:var(--fb);font-weight:600;font-size:12.5px;letter-spacing:0;text-transform:none}
.btn-ghost:hover{background:var(--grey-100);color:var(--navy)}
.btn-sm{min-height:34px;padding:6px 14px;font-size:12px}
.btn-block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none !important;box-shadow:none !important}
.iconBtn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--grey-600)}
.iconBtn:hover{background:var(--grey-100);color:var(--navy)}

/* ---------- Shell ---------- */
#app{display:flex;min-height:100vh}
#side{width:232px;flex:none;background:var(--navy);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sideTop{padding:28px 22px 20px;border-bottom:1px solid rgba(255,255,255,.07)}
.sideTop img{width:126px;height:auto;display:block}
.sideTop .appTag{margin-top:12px;font-size:11px;letter-spacing:.3em;text-indent:0;text-align:left}
.nav{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.navLbl{font-family:var(--fd);font-weight:500;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#7E92B5;padding:14px 12px 6px}
.navBtn{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:10px;color:#C9D4E5;font-weight:600;font-size:13.5px;text-align:left}
.navBtn:hover{background:rgba(255,255,255,.06);color:#fff}
.navBtn.on{background:rgba(100,244,201,.12);color:var(--mint)}
.navBtn .cnt{margin-left:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.12);color:#fff;border-radius:99px;padding:1px 8px}
.navBtn .cnt.red{background:var(--coral-600)}
.sideFoot{margin-top:auto;padding:16px 20px 22px;border-top:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;gap:10px}
.whoBox{display:flex;align-items:center;gap:10px;font-size:12.5px;color:#DCE4EE}
.whoBox b{display:block;color:#fff;font-size:13px}
.sideLock{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:9px 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,.22);color:#DCE4EE;font-family:var(--fd);font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
.sideLock:hover{background:rgba(255,255,255,.09);color:#fff}
.syncLine{display:flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--fd);font-weight:500;color:#9DB0CC}
.dot{width:8px;height:8px;border-radius:50%;background:var(--grey-400);flex:none}
.dot.ok{background:var(--mint)} .dot.busy{background:var(--amber)} .dot.bad{background:var(--coral)}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
.topBar{display:flex;align-items:center;gap:14px;padding:18px 28px 14px;position:sticky;top:0;z-index:20;background:var(--off)}
.topBar h2{font-family:var(--fd);font-weight:600;font-size:24px;letter-spacing:.02em;text-transform:uppercase;color:var(--navy);white-space:nowrap}
.searchBox{flex:1;max-width:380px;margin-left:auto;position:relative}
.searchBox input{width:100%;padding:10px 14px 10px 38px;border-radius:999px;border:1.5px solid var(--grey-200);background:#fff;outline:none;min-height:42px}
.searchBox input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-100)}
.searchBox svg{position:absolute;left:13px;top:12px;color:var(--grey-400)}
#view{padding:4px 28px 60px;flex:1}
.mobBar{display:none}

/* ---------- Cards / tiles ---------- */
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh-xs);border:1px solid var(--grey-100)}
.cardHd{display:flex;align-items:center;gap:10px;padding:16px 20px 12px}
.cardHd h3{font-family:var(--fd);font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--navy)}
.cardHd .sub{font-size:12px;color:var(--grey-500)}
.cardBd{padding:4px 20px 18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile{background:#fff;border-radius:var(--r);border:1px solid var(--grey-100);box-shadow:var(--sh-xs);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:92px;transition:box-shadow .14s var(--ease),transform .14s var(--ease)}
.tile:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
.tile .n{font-family:var(--fd);font-weight:600;font-size:30px;line-height:1.1;color:var(--navy)}
.tile .l{font-size:12.5px;font-weight:600;color:var(--grey-600)}
.tile.red .n{color:var(--coral-700)} .tile.amber .n{color:var(--amber-700)} .tile.blue .n{color:var(--blue)} .tile.mint .n{color:var(--mint-700)}
.twoCol{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}

/* ---------- Due groups ---------- */
.dueGrp{margin-bottom:6px}
.dueGrp h4{font-family:var(--fd);font-weight:500;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey-500);padding:12px 0 6px;border-bottom:1px solid var(--grey-100)}
.dueGrp h4.red{color:var(--coral-700)}
.row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid var(--grey-100);cursor:pointer;border-radius:8px;width:100%;text-align:left}
.row:hover{background:var(--grey-50)}
.row .pt{font-weight:700;color:var(--navy);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:12px;color:var(--grey-500);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.empty{padding:28px 10px;text-align:center;color:var(--grey-500);font-size:13px}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap;background:var(--grey-100);color:var(--grey-600)}
.badge.t-aligner{background:var(--blue-100);color:var(--blue-700)}
.badge.t-lab{background:var(--mint-100);color:var(--mint-700)}
.badge.t-appl{background:var(--navy-100);color:var(--navy-700)}
.badge.t-ret{background:var(--amber-100);color:var(--amber-700)}
.badge.t-retx{background:var(--coral-100);color:var(--coral-700)}
.badge.t-misc{background:var(--grey-100);color:var(--grey-600)}
.due{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap;background:var(--grey-100);color:var(--grey-600)}
.due.over{background:var(--coral-100);color:var(--coral-700)}
.due.soon{background:var(--amber-100);color:var(--amber-700)}
.due.none{background:transparent;color:var(--grey-400);font-weight:600}
.av{width:28px;height:28px;border-radius:50%;background:var(--navy-600);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none;letter-spacing:.02em}
.av.none{background:var(--grey-200);color:var(--grey-500)}
.av.lg{width:36px;height:36px;font-size:13px}

/* ---------- Board ---------- */
.boardTabs,.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1.5px solid var(--grey-200);border-radius:99px;padding:6px 14px;font-size:12.5px;font-weight:600;color:var(--grey-600);background:#fff;min-height:36px}
.chip:hover{border-color:var(--navy-500);color:var(--navy)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .c{opacity:.7;margin-left:4px}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;scroll-snap-type:x proximity}
.col{flex:1 0 225px;max-width:320px;background:var(--grey-100);border-radius:var(--r);padding:10px;scroll-snap-align:start;max-height:calc(100vh - 230px);display:flex;flex-direction:column}
.colHd{display:flex;align-items:center;gap:8px;padding:4px 6px 10px}
.colHd h4{font-family:var(--fd);font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.colHd .c{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--grey-500)}
.colBd{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:40px;padding:2px}
.kc{position:relative;background:#fff;border-radius:11px;box-shadow:var(--sh-xs);border:1px solid var(--grey-200);padding:10px 11px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;width:100%}
.kc:hover{box-shadow:var(--sh-md);border-color:var(--grey-300)}
.kc .pt{font-weight:700;color:var(--navy);font-size:13.5px;line-height:1.3;padding-right:36px}
.kc .dt{font-size:12px;color:var(--grey-500);line-height:1.35}
.kc .ft{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kc .adv{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--blue);background:var(--blue-100)}
.kc .adv:hover{background:var(--blue);color:#fff}

/* ---------- Table ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select{padding:8px 12px;border:1.5px solid var(--grey-200);border-radius:999px;background:#fff;font-weight:600;font-size:12.5px;min-height:38px;color:var(--grey-700)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-family:var(--fd);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--grey-500);padding:11px 14px;border-bottom:1px solid var(--grey-100);white-space:nowrap}
.tbl th button{font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--grey-100);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.click{cursor:pointer}
.cleanup{margin-bottom:18px;border:1.5px solid var(--amber-200)}
.cleanup .oldPick select{margin-left:6px;padding:5px 8px;border-radius:8px;border:1.5px solid var(--grey-200);font:inherit;font-size:12.5px}
.cleanup .oldNo{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.oldList{max-height:320px;overflow:auto;border:1px solid var(--grey-100);border-radius:10px}
.oldRow{display:grid;grid-template-columns:22px minmax(0,1.2fr) minmax(0,1.6fr) auto;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--grey-100);cursor:pointer}
.oldRow:last-child{border-bottom:none}
.oldRow:hover{background:var(--grey-50)}
.oldRow input{width:17px;height:17px;accent-color:var(--navy)}
.oldRow .pt{font-weight:700;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oldRow .muted{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oldD{color:var(--coral-700);font-weight:600}
.oldAct{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.oldAct b{font-size:13px;color:var(--navy);margin-right:4px}
.tbl tr.click:hover td{background:var(--grey-50)}
.tbl .pt{font-weight:700;color:var(--navy)}
.tblWrap{overflow-x:auto}

/* ---------- Drawer ---------- */
#scrim{position:fixed;inset:0;background:rgba(17,32,58,.35);z-index:900}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;z-index:901;box-shadow:var(--sh-xl);display:flex;flex-direction:column}
.dHd{padding:20px 22px 14px;border-bottom:1px solid var(--grey-100);display:flex;gap:12px;align-items:flex-start}
.dHd h3{font-family:var(--fd);font-weight:600;font-size:21px;letter-spacing:.02em;color:var(--navy);line-height:1.2}
.dHd .sub{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.dBd{flex:1;overflow-y:auto;padding:16px 22px 26px}
.dFt{padding:12px 22px;border-top:1px solid var(--grey-100);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sec{margin-top:18px}
.sec h5{font-family:var(--fd);font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey-500);margin-bottom:8px}
.stepper{display:flex;flex-direction:column;gap:6px}
.step{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--grey-200);text-align:left;font-weight:600;font-size:13px;color:var(--grey-600);background:#fff;min-height:40px}
.step:hover{border-color:var(--blue-200);background:var(--blue-100)}

/* =====================================================================

     name, parent, phone, email, message, extra{}        what they sent
     src{kind,receivedAt,page,raw,asana,test,how}        where it came from
     flag/flagWhy/dupOf                                  needs a look (spam, duplicate, test, check)
     assignee/assigneeName, stage, appt/apptTime, closeWhy, comments[]

const STEP_DEFS = [

  { t: 'call', label: 'Final call + close out' }

/* what a logged attempt can end in */

  vm: { l: 'Left voicemail', s: 'Voicemail' },
  none: { l: 'No answer', s: 'No answer' },
  sent: { l: 'Sent, no reply yet', s: 'Sent' },

const DEFAULT_TPL = {
  text1: 'Hi {first}, this is {me} at {office}. We got your request for an appointment and tried to call. When is a good time to reach you? You can also call or text us at {phone}.',
  subj1: 'Your appointment request – {office}',
  email1: 'Hi {first},\n\nThank you for reaching out to {office}. We received your request for an appointment and tried to call you. What is a good time to reach you? You can also call or text us at {phone} and we will get you scheduled.\n\nThank you,\n{me}\n{office}\n{phone}',
  text2: 'Hi {first}, it is {me} at {office} again. We would still love to get your visit scheduled. Reply here or call or text {phone} whenever it works for you.',
  subj2: 'Still want to schedule? – {office}',
  email2: 'Hi {first},\n\nThis is {me} at {office}. We have been trying to reach you about your appointment request and would love to get you on the schedule. Reply to this email or call or text us at {phone} whenever it works for you.\n\nThank you,\n{me}\n{office}\n{phone}'

const DEFAULT_LEADS_CFG = {

  days: [1, 2, 3, 4],             // office days: Monday–Thursday
  closeHour: 17,                  // requests after this hour count as the next day
  assignee: 'auto',               // '' = nobody, 'auto' = Savannah (as in Asana) when she has a login, or a staff id
  phone: '352-332-7466',
  feedUrl: '',

/* ---------- office days ---------- */
function isOfficeDay(iso, cfg) {
  const [y, m, d] = iso.split('-').map(Number); const wd = new Date(y, m - 1, d).getDay();

/* ---------- contact details ---------- */

const EMAIL_OK = /^[^\s@<>?&=%#/\\:;,"'()[\]]+@[^\s@<>?&=%#/\\:;,"'()[\].]+(\.[^\s@<>?&=%#/\\:;,"'()[\].]+)+$/;

/* "john smith" / "JOHN SMITH" → "John Smith"; names typed with normal capitals are left alone */
function properName(s) {
  s = String(s || '').replace(/\s+/g, ' ').trim();
  if (!s || (/[a-z]/.test(s) && /[A-Z]/.test(s))) return s;

}

/* who to greet in a message: the parent when there is one, else the patient */

function receivedAt(l) { return (l.src && l.src.receivedAt) || l.createdAt || 0; }

}
/* how to reach them on a given attempt: calls need a phone number; the first message is a text, the second an email */
function pickKind(l, i) {
  const def = STEP_DEFS[i], hasP = phoneInfo(l.phone).ok, hasE = validEmail(l.email);
  if (!def || def.t === 'call') return hasP || !hasE ? 'call' : 'email';
  if (i === 1) return hasP ? 'text' : hasE ? 'email' : 'text';
  return hasE ? 'email' : hasP ? 'text' : 'email';
}
function planSteps(day0, cfg) {
  return STEP_DEFS.map((def, i) => { const due = nextOfficeDay(addDays(day0, cfg.offsets[i]), cfg); return { kind: def.t === 'call' ? 'call' : 'text', due, plan: due, doneAt: null, res: '', by: '', note: '', skip: '' }; });
}

function setKinds(l) { l.steps.forEach((s, i) => { if (!s.doneAt && !s.skip && !s.km) s.kind = s.extra ? (phoneInfo(l.phone).ok || !validEmail(l.email) ? 'call' : 'email') : pickKind(l, i); }); }

/* ---------- reading a lead's state ---------- */

/* ---------- changing a lead (each works on a copy the caller will save) ---------- */
/* an attempt was logged late: later steps keep their gaps from the date it really happened (never earlier than planned) */
function reflow(l, i, doneISO, cfg) {
  const base = l.steps[i].plan || l.steps[i].due;
  l.steps.forEach((s, j) => {
    if (j <= i || !isPending(s)) return;
    const gap = Math.max(0, daysBetween(base, s.plan || s.due));

  const first = nextOfficeDay(dateISO, cfg);

  const p0 = l.steps[pend[0]].plan || l.steps[pend[0]].due;

  /* ---------- sign in (same logins as NLO Cases) ---------- */
  async emailFor(login) {

  async signIn(login, pw) {

    }
    try { await FB.unlockWith(pw, m); }
    catch (e) { return { state: m.role === 'owner' ? 'recover' : 'broken' }; }

  async unlockWith(pw, m) {

  /* first sign-in with a temporary password: choose a real one */

  /* owner forgot password → reset by email → recovery code restores the key ring */
  async recover(pw, code) {

    let ring;

      const rpriv = await Crypto.importPriv(await Crypto.pwOpen(normCode(code), r.priv, 'recovery-priv'));

  async changePassword(cur, next) {

  },
  stop() { FB.unsubs.forEach(u => { try { u(); } catch (e) { } }); FB.unsubs = []; },

  /* ---------- live data ---------- */
  async decryptLead(id, d) {
    const key = FB.keys && FB.keys[d.v];
    if (!key) throw errCode('no-key', 'Missing key version ' + d.v);
    const data = await Crypto.openJSON(key, d, 'lead:' + id);
    return Object.assign(data, { id, rev: d.rev, v: d.v, status: d.status, by: d.sid || '', updatedAt: FB.tsMs(d.updatedAt), createdAtSrv: FB.tsMs(d.createdAt), closedAt: FB.tsMs(d.closedAt) });
  },
  start(h) {
    FB.stop();
    const uid = FB.uid;
    FB.unsubs.push(FB.db.doc('members/' + uid).onSnapshot(async s => {
      if (!s.exists || !s.data().active) return h.revoked();
      const m = s.data();
      if (m.ringV && m.ringV !== FB.ringV && m.ring) { try { await FB.loadRing(m); h.rekeyed(); } catch (e) { h.error(e); } }
    }, e => h.revoked(e)));
    FB.unsubs.push(FB.db.doc('meta/keys').onSnapshot(s => { if (s.exists) FB.curV = s.data().current; }, () => { }));
    FB.unsubs.push(FB.db.doc('meta/settings').onSnapshot(s => h.settings(s.exists ? s.data() : {}), () => { }));
    FB.unsubs.push(FB.db.collection('roster').onSnapshot(s => h.roster(s.docs.map(d => Object.assign({ sid: d.id }, d.data()))), e => h.error(e)));
    FB.unsubs.push(FB.db.collection('leads').where('status', '==', 'open').onSnapshot(async snap => {
      const up = [], gone = [];
      for (const ch of snap.docChanges()) {
        if (ch.type === 'removed') { gone.push(ch.doc.id); continue; }
        try { up.push(await FB.decryptLead(ch.doc.id, ch.doc.data())); }
        catch (e) { up.push({ id: ch.doc.id, locked: true, status: 'open', name: '(locked lead)', steps: [], stage: 'new', flag: '', src: {} }); }
      }
      h.leads(up, gone, snap.metadata.fromCache);
    }, e => h.leadsError(e)));
    // website requests waiting to be filed, and the key that opens them (errors are fine before the rules are published)
    FB.unsubs.push(FB.db.collection('leadInbox').onSnapshot(s => {
      FB.inboxDocs = new Map(s.docs.map(d => [d.id, d.data()]));
      h.inbox(s.docs.map(d => ({ id: d.id, at: FB.tsMs(d.data().at) || 0, kid: d.data().kid })).sort((a, b) => a.at - b.at));
    }, () => { FB.inboxDocs = new Map(); h.inbox([]); }));
    FB.unsubs.push(FB.db.doc('meta/intake').onSnapshot(async s => { await FB.loadIntake(s.exists ? s.data() : null); h.intake(FB.intake); }, () => { FB.intake = null; h.intake(null); }));
    // website requests that came by email: the NLO Cases email reader seals every email it forwards into `inbox`
    // (lab emails too — those are NLO Cases' and are never changed here) and lists which senders it forwards in meta/inbox
    FB.unsubs.push(FB.db.collection('inbox').onSnapshot(s => {
      FB.mailDocs = new Map(s.docs.map(d => [d.id, d.data()]));
      h.mail(s.docs.map(d => ({ id: d.id, at: FB.tsMs(d.data().at) || 0 })).sort((a, b) => a.at - b.at));
    }, () => { FB.mailDocs = new Map(); h.mail([]); }));
    FB.unsubs.push(FB.db.doc('meta/inbox').onSnapshot(s => h.mailRoute(s.exists ? { senders: (s.data().senders || []).map(String) } : null), () => h.mailRoute(null)));

      FB.unsubs.push(FB.db.collection('members').onSnapshot(s => h.members(s.docs.map(d => Object.assign({ uid: d.id }, d.data()))), e => h.error(e)));
    }
  },
  async loadClosed(days) {
    const since = firebase.firestore.Timestamp.fromMillis(Date.now() - days * 86400000);
    const snap = await FB.db.collection('leads').where('closedAt', '>=', since).get();
    const out = [];
    for (const d of snap.docs) { try { out.push(await FB.decryptLead(d.id, d.data())); } catch (e) { } }
    return out;
  },
  async loadAll() {
    const snap = await FB.db.collection('leads').get();
    const out = [];

    return out;
  },
  async leadLog(id) {
    const snap = await FB.db.collection('leadLog').where('leadId', '==', id).get();
    const out = [];
    for (const d of snap.docs) {
      const x = d.data(); const key = FB.keys[x.v];

  async activity(days) {
    const since = firebase.firestore.Timestamp.fromMillis(Date.now() - days * 86400000);
    const snap = await FB.db.collection('leadLog').where('at', '>=', since).get();
    const out = [];
    for (const d of snap.docs) {
      const x = d.data(); const key = FB.keys[x.v];

  /* ---------- writes ---------- */
  clean(data) { const o = Object.assign({}, data); ['id', 'rev', 'v', 'status', 'by', 'updatedAt', 'createdAtSrv', 'closedAt', 'locked'].forEach(k => delete o[k]); return o; },
  /* history entry at the fixed id "<lead>_<rev>"; prev = the encrypted copy this write replaces */
  async logOps(batchOrTx, leadId, rev, prev, action) {
    const lid = leadId + '_' + rev; const ref = FB.db.doc('leadLog/' + lid);
    const box = await Crypto.sealJSON(FB.keys[FB.curV], action, 'leadlog:' + lid);
    batchOrTx.set(ref, { leadId, rev, uid: FB.uid, sid: FB.me.staffId, at: FB.ts(), v: FB.curV, iv: box.iv, ct: box.ct, prev: prev || null });
  },
  async createLeads(list, progress) {
    // list: [{data, status:'open'|'done', closedAt:ms, action}]; small batches keep each one well inside the rules' lookup limit
    const PER = 5; let n = 0;
    for (let i = 0; i < list.length; i += PER) {
      const b = FB.db.batch();
      for (const item of list.slice(i, i + PER)) {
        const ref = FB.db.collection('leads').doc();
        const v = FB.curV; const box = await Crypto.sealJSON(FB.keys[v], FB.clean(item.data), 'lead:' + ref.id);
        const done = item.status === 'done';
        b.set(ref, { v, iv: box.iv, ct: box.ct, status: done ? 'done' : 'open', rev: 1, by: FB.uid, sid: FB.me.staffId, createdAt: FB.ts(), updatedAt: FB.ts(), closedAt: done ? firebase.firestore.Timestamp.fromMillis(item.closedAt || Date.now()) : null });
        await FB.logOps(b, ref.id, 1, null, item.action || { a: 'create' });
        item.id = ref.id;
      }
      await FB.track(b.commit()); n += Math.min(PER, list.length - i); if (progress) progress(n, list.length);
    }
    return list.map(x => x.id);
  },
  async createLead(data, action) { const ids = await FB.createLeads([{ data, status: 'open', action }]); return ids[0]; },
  /* fn(data) edits the latest decrypted copy in place; return 'done' / 'open' to change status */
  /* one person's writes to the same lead run one after another, never racing each other */
  queues: {},
  mutateLead(id, fn, action) {
    const run = () => FB._mutate(id, fn, action, 0);
    const p = (FB.queues[id] || Promise.resolve()).then(run, run);
    FB.queues[id] = p.catch(() => { });
    return p;
  },
  async _mutate(id, fn, action, tries) {
    const ref = FB.db.doc('leads/' + id);
    try {
      await FB.track(FB.db.runTransaction(async tx => {
        const s = await tx.get(ref); if (!s.exists) throw errCode('gone');
        const d = s.data(); const data = FB.clean(await FB.decryptLead(id, d));
        const st = fn(data); const status = st === 'done' || st === 'open' ? st : d.status;
        const v = FB.curV; const box = await Crypto.sealJSON(FB.keys[v], data, 'lead:' + id);
        const closedAt = status === 'done' ? (d.status === 'done' && d.closedAt ? d.closedAt : FB.ts()) : null;
        tx.update(ref, { v, iv: box.iv, ct: box.ct, status, rev: d.rev + 1, by: FB.uid, sid: FB.me.staffId, updatedAt: FB.ts(), closedAt });
        await FB.logOps(tx, id, d.rev + 1, { v: d.v, iv: d.iv, ct: d.ct }, action || { a: 'save' });
      }));

        const m = (await FB.db.doc('members/' + FB.uid).get()).data();
        if (!m || !m.active) throw e;
        await FB.loadRing(m);
        await new Promise(r => setTimeout(r, 150 + Math.random() * 350));
        return FB._mutate(id, fn, action, tries + 1);
      }
      throw e;
    }
  },
  /* owner only; the last encrypted copy stays in history, so a delete can be undone */
  async deleteLead(id) {
    const ref = FB.db.doc('leads/' + id);
    await FB.track(FB.db.runTransaction(async tx => {
      const s = await tx.get(ref); if (!s.exists) throw errCode('gone'); const d = s.data();
      await FB.logOps(tx, id, d.rev + 1, { v: d.v, iv: d.iv, ct: d.ct }, { a: 'delete' });
      tx.delete(ref);
    }));
  },
  /* every saved version of one lead, newest first (the copy each write replaced) */
  async leadVersions(id) {
    const snap = await FB.db.collection('leadLog').where('leadId', '==', id).get();
    const out = [];
    for (const d of snap.docs) {
      const x = d.data(); if (!x.prev) continue;
      let who = null; try { who = await Crypto.openJSON(FB.keys[x.v], x, 'leadlog:' + d.id); } catch (e) { }
      let data = null; try { data = await Crypto.openJSON(FB.keys[x.prev.v], x.prev, 'lead:' + id); } catch (e) { }
      out.push({ rev: x.rev - 1, replacedAt: FB.tsMs(x.at), replacedBy: x.sid, replacedHow: who && who.a, data });
    }
    return out.sort((a, b) => b.rev - a.rev);
  },
  async restoreVersion(id, data) {

  },
  /* leads deleted in the last N days, recovered from their history entry */
  async deletedLeads(days) {
    const since = firebase.firestore.Timestamp.fromMillis(Date.now() - days * 86400000);
    const snap = await FB.db.collection('leadLog').where('at', '>=', since).get();
    const out = [];
    for (const d of snap.docs) {
      const x = d.data(); if (!x.prev) continue;
      let act = null; try { act = await Crypto.openJSON(FB.keys[x.v], x, 'leadlog:' + d.id); } catch (e) { continue; }
      if (!act || act.a !== 'delete') continue;
      const still = await FB.db.doc('leads/' + x.leadId).get(); if (still.exists) continue;
      try { out.push({ leadId: x.leadId, at: FB.tsMs(x.at), sid: x.sid, data: await Crypto.openJSON(FB.keys[x.prev.v], x.prev, 'lead:' + x.leadId) }); } catch (e) { }
    }

  },
  async undelete(item) { return FB.createLeads([{ data: item.data, status: item.data.closeWhy ? 'done' : 'open', closedAt: Date.now(), action: { a: 'restore' } }]); },
  /* office settings live in meta/settings (owner only); the leads settings sit under "leads" */
  async saveSettings(patch) { await FB.track(FB.db.doc('meta/settings').set(patch, { merge: true })); },

  /* ---------- website requests ---------- */
  async loadIntake(d) {

    try {
      const bytes = await Crypto.open(FB.keys[d.priv.v], d.priv, 'intake-priv');
      FB.intake = { kid: d.kid, pub: d.pub, key: await Crypto.importPriv(bytes), at: FB.tsMs(d.at), v: d.priv.v };
    } catch (e) { FB.intake = { kid: d.kid, pub: d.pub, key: null, bad: true, at: FB.tsMs(d.at), v: d.priv && d.priv.v }; }
  },
  canIngest() { return !!(FB.intake && FB.intake.key); },
  /* open one waiting request with the intake key */
  async openInbox(id) {

    let payload;
    try { payload = JSON.parse(TD.decode(await Crypto.openFrom(FB.intake.key, { epk: d.epk, iv: d.iv, ct: d.ct }, 'inbox:' + id))); }

  /* file it as a lead (same id as the request) and clear it from the inbox — all or nothing. The copy is opened again first, so a request is never removed unless the lead can be read. */
  async commitIntake(id, data, retried) {

    const b = FB.db.batch();
    b.set(FB.db.doc('leads/' + id), { v, iv: box.iv, ct: box.ct, status: 'open', rev: 1, by: FB.uid, sid: FB.me.staffId, createdAt: FB.ts(), updatedAt: FB.ts(), closedAt: null });
    await FB.logOps(b, id, 1, null, { a: 'create', how: 'website' });

    try { await FB.track(b.commit()); }
    catch (e) {
      // refused: either another computer filed it first, or the office key changed a moment ago (refresh it and try once more)
      if (retried || !/permission/i.test(e.code || e.message || '') || await FB.leadExists(id)) throw e;
      const m = (await FB.db.doc('members/' + FB.uid).get()).data(); if (!m || !m.active) throw e;
      await FB.loadRing(m);
      return FB.commitIntake(id, data, true);
    }
  },
  async leadExists(id) { return (await FB.db.doc('leads/' + id).get()).exists; },
  async dismissInbox(id) { await FB.track(FB.db.doc('leadInbox/' + id).delete()); },

  /* ---------- website requests that came by email ---------- */
  /* the private half of NLO Cases' inbox key, sealed with the office key: opened once (again for a key set up since) */
  async mailKey(kid) {

  /* file it as a new lead under the id made from the email, and take that copy out of the inbox — all or nothing */

    }
  },
  /* this id was filed before (even if the lead was deleted since, its first history entry stays) */
  async leadUsed(id) {
    const [a, b] = await Promise.all([FB.db.doc('leads/' + id).get(), FB.db.doc('leadLog/' + id + '_1').get()]);
    return a.exists || b.exists;
  },
  /* take a website email out of the inbox without a lead: the other inbox's copy, Asana's notice, or one from before this went live */
  async dropMail(id) { await FB.track(FB.db.doc('inbox/' + id).delete()); },
  /* owner: put the website's mailer back on NLO Cases' email-reader list (rules: owner only, same key and fields) */
  async addMailSender(s) { await FB.track(FB.db.doc('meta/inbox').update({ senders: firebase.firestore.FieldValue.arrayUnion(s) })); },
  /* when each inbox's email reader last checked (no patient data) */
  async mailBeats() {
    const s = await FB.db.collection('mailbeat').get();
    return s.docs.map(d => ({ box: d.data().box || '', at: FB.tsMs(d.data().at) || 0, err: d.data().err || '' })).sort((a, b) => a.box.localeCompare(b.box));
  },
  /* owner: create the intake key pair and the secret that goes in the website's webhook address */
  async setupIntake() {
    if (!FB.isOwner()) throw errCode('permission');
    // never replace a working key pair: requests already sealed to it could no longer be opened
    if ((await FB.db.doc('meta/intake').get()).exists) throw errCode('exists', 'The website feed is already set up.');
    const pair = await Crypto.newPair(), pub = await Crypto.pubJwk(pair), pbytes = await Crypto.privBytes(pair);
    const v = FB.curV, key = FB.keys[v], secret = Crypto.newSecret();
    const priv = Object.assign({ v }, await Crypto.seal(key, pbytes, 'intake-priv'));
    const box = Object.assign({ v }, await Crypto.seal(key, TE.encode(secret), 'intake-secret'));
    const b = FB.db.batch();
    b.set(FB.db.doc('meta/intake'), { kid: 'k' + Date.now().toString(36), pub, priv, at: FB.ts() });
    b.set(FB.db.doc('meta/intakeSecret'), { hash: await Crypto.sha256hex(secret), box, on: true, at: FB.ts() });
    await FB.track(b.commit());
    return secret;
  },
  async intakeSecretDoc() { const s = await FB.db.doc('meta/intakeSecret').get(); return s.exists ? s.data() : null; },
  async readSecret() {
    const d = await FB.intakeSecretDoc(); if (!d || !d.box) return null;
    return TD.decode(await Crypto.open(FB.keys[d.box.v], d.box, 'intake-secret'));
  },
  async rotateSecret() {
    const d = await FB.intakeSecretDoc(); const secret = Crypto.newSecret(), v = FB.curV;
    const box = Object.assign({ v }, await Crypto.seal(FB.keys[v], TE.encode(secret), 'intake-secret'));
    await FB.track(FB.db.doc('meta/intakeSecret').set({ hash: await Crypto.sha256hex(secret), box, on: d ? d.on !== false : true, at: FB.ts() }));
    return secret;
  },
  async setFeedOn(on) { await FB.track(FB.db.doc('meta/intakeSecret').update({ on: !!on, at: FB.ts() })); },
  /* when the function last took (or refused) a request — times and a reason word only, nothing about anyone */
  async intakeStats() { const s = await FB.db.doc('meta/intakeStats').get(); if (!s.exists) return null; const d = s.data(); return { okAt: FB.tsMs(d.okAt), badAt: FB.tsMs(d.badAt), badWhy: d.badWhy || '' }; },
  /* a made-up request, sent the way the website form sends one (the answer can't be read from here; the test lead appearing is the proof) */
  async sendTest(url) {
    await fetch(url, { method: 'POST', mode: 'no-cors', cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ test: true, fields: { name: 'Test Request', email: 'test@example.com', phone: '352-555-0199', message: 'Test request sent from NLO Leads settings.' } }) });
  },
  /* after the office key changed: seal everything under the newest key (owner; quietly runs when the owner opens Leads) */
  async resealAll(progress) {
    const out = { leads: 0, failed: 0, intake: false };
    const old = (await FB.db.collection('leads').get()).docs.filter(d => d.data().v < FB.curV);
    let n = 0;
    for (let i = 0; i < old.length; i += 15) {
      await Promise.all(old.slice(i, i + 15).map(d => FB.mutateLead(d.id, () => { }, { a: 'rekey' }).then(() => { out.leads++; }, () => { out.failed++; })));
      n += Math.min(15, old.length - i); if (progress) progress(n, old.length);
    }
    const ik = await FB.db.doc('meta/intake').get();
    if (ik.exists && ik.data().priv.v < FB.curV) {
      const d = ik.data(); const bytes = await Crypto.open(FB.keys[d.priv.v], d.priv, 'intake-priv');
      await FB.db.doc('meta/intake').update({ priv: Object.assign({ v: FB.curV }, await Crypto.seal(FB.keys[FB.curV], bytes, 'intake-priv')) }); out.intake = true;
    }
    const sd = await FB.intakeSecretDoc();
    if (sd && sd.box && sd.box.v < FB.curV) {
      const bytes = await Crypto.open(FB.keys[sd.box.v], sd.box, 'intake-secret');
      await FB.db.doc('meta/intakeSecret').update({ box: Object.assign({ v: FB.curV }, await Crypto.seal(FB.keys[FB.curV], bytes, 'intake-secret')) }); out.intake = true;
    }
    return out;
  },
  /* anything still sealed under an older office key? (a quick check, no decrypting) */
  async oldCount() { return (await FB.db.collection('leads').where('v', '<', FB.curV).get()).size; }
};

/* ---------- toasts ---------- */
function toast(msg, opt) {
  opt = opt || {}; const el = document.createElement('div'); el.className = 'toast' + (opt.bad ? ' bad' : ''); el.setAttribute('role', 'status');
  el.innerHTML = esc(msg) + (opt.action ? ' <button class="linkBtn" style="color:var(--mint);margin-left:10px;pointer-events:auto">' + esc(opt.action) + '</button>' : '');
  if (opt.action) el.querySelector('button').onclick = () => { opt.onAction(); el.remove(); };
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), opt.ms || (opt.action ? 8000 : 3800));
}
function errText(e) {
  const c = (e && (e.code || e.message)) || '';
  if (/no-user/.test(c)) return 'No login with that username.';
  if (/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return 'Username or password is incorrect.';
  if (/inactive/.test(c)) return 'This login has been turned off. Ask Dr. A.';
  if (/not-member/.test(c)) return 'That account isn’t part of the office.';
  if (/too-many-requests/.test(c)) return 'Too many attempts. Wait a minute and try again.';
  if (/network|unavailable/.test(c)) return 'Can’t reach the server. Check the internet connection.';
  if (/weak-password/.test(c)) return 'Password needs at least 8 characters.';
  if (/boot-failed/.test(c)) return 'That temporary password didn’t work. Ask Dr. A to reissue your login.';
  if (/boot-stale/.test(c)) return 'This invite expired after a security update. Ask Dr. A to reissue your login.';
  if (/bad-code/.test(c)) return 'That recovery code didn’t work. Check it and try again.';
  if (/not-pending/.test(c)) return 'That attempt was already logged — maybe by someone else. The lead is up to date now.';
  if (/need-date|bad-date|need-note/.test(c)) return (e && e.message) || 'Pick a day.';
  if (/nothing-to-undo/.test(c)) return 'Nothing to undo.';
  if (/permission/.test(c)) return 'Not allowed. Your access may have changed.';
  if (/gone/.test(c)) return 'That lead no longer exists.';
  if (/no-intake-key/.test(c)) return 'The website feed key can’t be opened on this computer.';
  if (/requires-recent-login/.test(c)) return 'Please sign in again, then retry.';
  return (e && e.message) ? String(e.message).replace(/^Firebase:\s*/, '') : 'Something went wrong.';
}

  const qs = new URLSearchParams(location.search);

  S.demo = qs.has('demo'); S.emu = local && qs.has('emu');
  try { S.lastLogin = localStorage.getItem('nloLeads.lastLogin') || localStorage.getItem('nloCases.lastLogin') || ''; } catch (e) { }

  document.addEventListener('input', onInput);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if ($('#modalWrap')) closeModal(); else if (S.openId) closeDrawer(); }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.kc[data-act], tr.click[data-act]')) { e.preventDefault(); e.target.click(); }
  });
  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { S.lastAct = Date.now(); }, { passive: true }));
  if (S.demo) { B = DEMO; $('#demoBar').classList.remove('hidden'); document.body.classList.add('demo'); lockScreen('login'); return; }

function busyBtn(btn, on, label) { if (!btn) return; if (on) { btn.dataset.l = btn.textContent; btn.textContent = label || 'Working…'; btn.disabled = true; } else { btn.textContent = btn.dataset.l || btn.textContent; btn.disabled = false; } }

/* ---------- enter / leave ---------- */
function enterApp() {
  Object.assign(S, { inApp: true, leads: new Map(), closed: [], closedLoaded: false, hist: null, histLoaded: false, histLoading: null, firstLoad: true, loadErr: '', lastAct: Date.now(),
    inbox: [], inboxBad: {}, inboxTry: {}, inboxWait: {}, intake: null, filedHere: new Set(), seen: new Set(), pend: {}, srv: {}, res: null, view: 'today', openId: null, editing: false, feed: null, showHook: false,
    mail: [], mailSeen: {}, mailRoute: null, beats: null, beatsAt: 0 });
  $('#lockWrap').classList.add('hidden'); $('#app').classList.remove('hidden');
  renderShell(); renderView();
  B.start({
    leads(up, gone) {
      const news = [];
      up.forEach(l => {
        if (S.pend[l.id]) { S.srv[l.id] = l; return; }
        if (!S.firstLoad && !S.seen.has(l.id) && !S.filedHere.has(l.id) && l.src && l.src.kind === 'website' && Date.now() - (l.createdAt || 0) < 180000) news.push(l);
        S.leads.set(l.id, l); S.seen.add(l.id);
      });
      gone.forEach(id => { if (S.pend[id]) { S.srv[id] = 'gone'; return; } S.leads.delete(id); });
      S.firstLoad = false; S.loadErr = ''; queueRender();
      news.forEach(l => toast('New website request: ' + shortName(l), { action: 'Open', onAction: () => openDrawer(l.id) }));
      if (S.openId && (up.some(l => l.id === S.openId) || gone.includes(S.openId))) refreshDrawer(gone.includes(S.openId));
    },
    leadsError(e) { S.firstLoad = false; S.loadErr = /permission/.test((e && e.code) || '') ? 'The office database isn’t ready for leads yet (Dr. A: publish the updated rules).' : errText(e); queueRender(); },
    roster(list) { S.roster = list; queueRender('team'); },
    members(list) { S.members = list; },
    settings(s) { S.settings = Object.assign({ idleMin: 10 }, s || {}); S.cfg = leadCfg(S.settings); queueRender('settings'); },
    inbox(list) { S.inbox = list; Object.keys(S.inboxBad).forEach(id => { if (!list.some(x => x.id === id)) delete S.inboxBad[id]; }); queueRender('inbox'); ingestSoon(); },
    intake(info) { S.intake = info; queueRender('inbox'); ingestSoon(); },
    mail(list) { S.mail = list; Object.keys(S.mailSeen).forEach(id => { if (!list.some(x => x.id === id)) delete S.mailSeen[id]; }); ingestSoon(); },
    mailRoute(info) { S.mailRoute = info; queueRender('inbox'); keepWebSender(); },
    revoked() { lockOut('Your access was turned off.'); },
    rekeyed() { if (S.inApp) setTimeout(resealIfNeeded, 1500); },
    error(e) { if (/permission/.test((e && e.code) || '')) lockOut('Your access changed. Sign in again.'); else toast(errText(e), { bad: true }); }
  });
  clearInterval(S.idleTimer);
  S.idleTimer = setInterval(() => {
    const mins = Number(S.settings.idleMin) || 10;
    if (S.inApp && Date.now() - S.lastAct > mins * 60000) lockOut('Locked after ' + mins + ' minutes without activity.');
    else if (S.inApp) { updateTitle(); if (S.inbox.length || mailTodo().length) ingestSoon(); }
  }, 15000);
  ensureHist();
  if (isOwner()) setTimeout(resealIfNeeded, 5000);
}

function meSid() { return B.me ? B.me.staffId : ''; }

function shortName(l) { const p = leadName(l).split(/\s+/); return p.length > 1 ? p[0] + ' ' + p[p.length - 1][0] + '.' : p[0]; }
function matchesQ(l) {
  if (!S.q) return true; const q = S.q.toLowerCase(), digits = q.replace(/\D/g, '');
  return [l.name, l.parent, l.email, l.message, staffName(l.assignee, l.assigneeName)].some(x => String(x || '').toLowerCase().includes(q)) || (digits.length >= 3 && phoneInfo(l.phone).digits.includes(digits));
}
function bucket(l) { return bucketOf(leadDue(l), todayISO()); }
function byDue(a, b) { const x = leadDue(a) || '9999', y = leadDue(b) || '9999'; return x < y ? -1 : x > y ? 1 : receivedAt(a) - receivedAt(b); }
function counts() {
  const all = openLeads(), me = meSid(), t = todayISO();

  };
}

async function ingestMail(filed) {

function logResult(id, i, res, extra) {
  const note = (($('#nowNote') || {}).value || '').trim(), now = Date.now(), cfg = S.cfg;
  const o = Object.assign({ by: meSid(), note }, extra || {});
  const fn = l => { const r = applyResult(l, i, res, o, cfg, now); return res === 'sched' ? closeLead(l, 'sched') : r === 'done' ? 'done' : undefined; };
  const before = findLead(id); if (!before) return;
  // check first, so a missing date is caught here and not after the change is shown
  try { fn(JSON.parse(JSON.stringify(before))); } catch (e) { toast(errText(e), { bad: true }); if (e && e.code === 'need-note') { const n = $('#nowNote'); if (n) n.focus(); } return; }
  S.ui = {}; const ni = $('#nowNote'); if (ni) ni.value = '';
  change(id, fn, { a: 'log', i, res });
  const l = findLead(id), nx = l && l.status !== 'done' ? curStep(l) : -1;
  const msg = res === 'sched' ? 'Appointment scheduled — lead closed' : l && l.status === 'done' ? RES[res].s + ' — lead closed (' + String(CLOSE_WHY[l.closeWhy] || '').toLowerCase() + ')'
    : 'Logged: ' + RES[res].s + (nx >= 0 ? ' · next: ' + KIND[l.steps[nx].kind].toLowerCase() + ' ' + (dayDiff(l.steps[nx].due) === 0 ? 'today' : fmtDay(l.steps[nx].due)) : '');
  toast(msg, { action: 'Undo', onAction: () => undoLast(id) });
}

}

Object.assign(ACT, {

  const cur = $('#pwCur').value, a = $('#pwN1').value, b = $('#pwN2').value;
  if (a.length < 8) return toast('Use at least 8 characters.', { bad: true });
  if (a !== b) return toast('The two new passwords don’t match.', { bad: true });
  const btn = $('#pwForm button[type=submit]'); busyBtn(btn, true, 'Changing…');
  try { await B.changePassword(cur, a); toast('Password changed'); e.target.reset(); }
  catch (x) { toast(/invalid-credential|wrong-password/.test(x.code || '') ? 'Current password is wrong.' : errText(x), { bad: true }); }
  busyBtn(btn, false);
});

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>

<script src="nlo-aisa.js" defer></script>
</body>
