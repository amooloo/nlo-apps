const ALERT_SCRIPT_URL = 'https://script.google.com/home/projects/1wwUm4vUhGrabEA4LGRFfvk4NxjH7r9_GtozvrQNCYrZ66spTrWSckdNw/edit';
/* synthetic login addresses (no mail is ever sent to them), as NLO Cases issues them */
const STAFF_DOMAIN = 'staff.thenextlevelorthodontics.com';
const INV_RULES = "rules_version = '2';\n// NLO Cases \u2014 Firestore security rules.\n// Case bodies are encrypted in the browser; these rules decide WHO may read or\n// write the ciphertext, keep the history log append-only, and stop anyone who\n// is not an active member (or a removed member) from touching anything.\nservice cloud.firestore {\n  match /databases/{db}/documents {\n    function authed() { return request.auth != null; }\n    function hasSetup() { return exists(/databases/$(db)/documents/meta/setup); }\n    function isOwner() { return authed() && hasSetup() && get(/databases/$(db)/documents/meta/setup).data.owner == request.auth.uid; }\n    function myDoc() { return /databases/$(db)/documents/members/$(request.auth.uid); }\n    function isMember() { return authed() && exists(myDoc()) && get(myDoc()).data.active == true; }\n    function mySid() { return get(myDoc()).data.staffId; }\n    function curV() { return get(/databases/$(db)/documents/meta/keys).data.current; }\n    // true only inside the one-time office setup batch, and only for the practice owner's\n    // verified email address (stops anyone else claiming an empty office)\n    function bootstrapping() {\n      return authed() && !hasSetup()\n        && request.auth.token.email == '__OWNER_EMAIL__' && request.auth.token.email_verified == true\n        && getAfter(/databases/$(db)/documents/meta/setup).data.owner == request.auth.uid;\n    }\n    // a public key must look like a P-256 JWK (the owner's client also tolerates bad ones)\n    function okPub(d) {\n      return !('pub' in d) || (d.pub is map && d.pub.keys().hasOnly(['kty', 'crv', 'x', 'y'])\n        && d.pub.kty == 'EC' && d.pub.crv == 'P-256' && d.pub.x is string && d.pub.y is string\n        && d.pub.x.size() == 43 && d.pub.y.size() == 43);\n    }\n    // the front-desk email for cases not shipped in time (8 Oct 2026): on or off, the one address it may go to, which mailbox's\n    // script sends it and that script's public key (the note is sealed to it), and whether it names the patient\n    function okNotify(d) {\n      return !('notify' in d) || (d.notify is map && d.notify.keys().hasOnly(['on', 'to', 'box', 'pub', 'names'])\n        && d.notify.on is bool && d.notify.names is bool\n        && d.notify.to is string && d.notify.to.size() <= 120 && d.notify.to.matches('^[^@ ]+@[^@ ]+[.][^@ ]+$')\n        && d.notify.box is string && d.notify.box.matches('^(b[0-9a-f]{32})?$') && okPub(d.notify));\n    }\n\n    match /meta/setup {\n      allow get: if isMember();\n      allow create: if bootstrapping()\n        && request.resource.data.keys().hasOnly(['owner', 'at'])\n        && request.resource.data.owner == request.auth.uid\n        && request.resource.data.at == request.time\n        && getAfter(myDoc()).data.role == 'owner';\n      allow update, delete: if false;\n    }\n    match /meta/keys {\n      allow get: if isMember();\n      allow create: if bootstrapping() && request.resource.data.keys().hasOnly(['current']) && request.resource.data.current == 1;\n      allow update: if isOwner() && request.resource.data.keys().hasOnly(['current'])\n        && request.resource.data.current == resource.data.current + 1;\n      allow delete: if false;\n    }\n    match /meta/settings {\n      allow get: if isMember();\n      allow create: if bootstrapping() || isOwner();\n      allow update: if isOwner();\n      allow delete: if false;\n    }\n    match /meta/recovery {\n      allow get: if isOwner();\n      allow create: if bootstrapping() || isOwner();\n      allow update: if isOwner();\n      allow delete: if false;\n    }\n    // username -> sign-in address. Readable one at a time (needed before sign-in), never listable.\n    match /logins/{name} {\n      allow get: if true;\n      allow list: if false;\n      allow create, update: if isOwner() && request.resource.data.keys().hasOnly(['email']) && request.resource.data.email is string;\n      allow delete: if isOwner();\n    }\n    match /members/{uid} {\n      allow get: if authed() && (request.auth.uid == uid || isOwner());\n      allow list: if isOwner();\n      allow create: if (isOwner() && request.resource.data.role == 'staff')\n        || (bootstrapping() && uid == request.auth.uid && request.resource.data.role == 'owner' && request.resource.data.active == true);\n      // the owner manages everyone (and can never demote themself); a person may only\n      // update their own key material, and only while still active\n      allow update: if (isOwner() && (uid != request.auth.uid || (request.resource.data.role == 'owner' && request.resource.data.active == true)))\n        || (authed() && request.auth.uid == uid && resource.data.active == true\n            && (!request.resource.data.diff(resource.data).affectedKeys().hasAny(['pub']) || okPub(request.resource.data))\n            && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['pub', 'priv', 'privPrev', 'ring', 'ringV', 'boot', 'mustSetup', 'lastLogin']));\n      allow delete: if false;\n    }\n    match /roster/{sid} {\n      // (NLO Time Clock: the office's time-clock computer shows each person's name and photo; its alert script names them;\n      // an approved laptop reads only the people it's for)\n      allow read: if isMember() || isTcDevice();\n      allow get: if lapHas(sid);\n      allow create, update: if isOwner() || bootstrapping();\n      allow delete: if false;\n    }\n    // Every write to a case must come with a history entry, at the fixed id \"<case>_<rev>\",\n    // holding the previous encrypted copy. History can't be edited or deleted, so any\n    // overwrite \u2014 buggy, careless or malicious \u2014 can be undone from it.\n    function histAfter(id, rev) { return existsAfter(/databases/$(db)/documents/log/$(id + '_' + string(rev))); }\n    // The patient index (4 Oct 2026): pn / pc are keyed hashes (HMAC with a key derived from the office key) of the\n    // patient's name and chart #, so an app can fetch one patient's earlier cases instead of every completed case.\n    // Without the office key they say nothing about who the patient is.\n    function okIdx(d) {\n      return (!('pn' in d) || (d.pn is string && d.pn.size() == 22)) && (!('pc' in d) || (d.pc is string && d.pc.size() == 22));\n    }\n    match /cases/{id} {\n      function okCase() {\n        let d = request.resource.data;\n        return d.keys().hasOnly(['v', 'iv', 'ct', 'status', 'rev', 'by', 'sid', 'createdAt', 'updatedAt', 'closedAt', 'pn', 'pc'])\n          && d.v == curV() && d.iv is string && d.ct is string && d.ct.size() < 600000\n          && d.rev is int && d.by == request.auth.uid && d.sid == mySid()\n          && d.updatedAt == request.time && okIdx(d)\n          && ((d.status == 'open' && d.closedAt == null) || (d.status == 'done' && d.closedAt is timestamp));\n      }\n      allow read: if isMember();\n      allow create: if isMember() && okCase() && request.resource.data.rev == 1\n        && request.resource.data.createdAt == request.time && histAfter(id, 1);\n      allow update: if isMember() && okCase() && request.resource.data.rev == resource.data.rev + 1\n        && request.resource.data.createdAt == resource.data.createdAt && histAfter(id, request.resource.data.rev);\n      // the index alone (the owner's app indexing the office, or catching up on a case an older copy of the app saved):\n      // nothing about the case itself changes, so no new version\n      allow update: if isMember() && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['pn', 'pc'])\n        && okIdx(request.resource.data);\n      allow delete: if isOwner() && histAfter(id, resource.data.rev + 1);\n    }\n    match /log/{lid} {\n      function caseBefore() { return /databases/$(db)/documents/cases/$(request.resource.data.caseId); }\n      function okHist() {\n        let d = request.resource.data;\n        return (exists(caseBefore()) && d.rev == get(caseBefore()).data.rev + 1\n                 && d.prev == {'v': get(caseBefore()).data.v, 'iv': get(caseBefore()).data.iv, 'ct': get(caseBefore()).data.ct})\n          || (!exists(caseBefore()) && d.rev == 1 && d.prev == null);\n      }\n      function okAfter() {\n        let d = request.resource.data;\n        return (existsAfter(caseBefore()) && getAfter(caseBefore()).data.rev == d.rev)\n          || (!existsAfter(caseBefore()) && exists(caseBefore()) && isOwner());\n      }\n      // del: marks the entry of a deleted case (so Deleted cases reads only those, not every recent entry)\n      allow read: if isMember();\n      allow create: if isMember()\n        && request.resource.data.keys().hasOnly(['caseId', 'rev', 'uid', 'sid', 'at', 'v', 'iv', 'ct', 'prev', 'del'])\n        && request.resource.data.uid == request.auth.uid && request.resource.data.sid == mySid()\n        && request.resource.data.at == request.time && request.resource.data.caseId is string\n        && request.resource.data.rev is int && lid == request.resource.data.caseId + '_' + string(request.resource.data.rev)\n        && request.resource.data.v is int && request.resource.data.ct is string && request.resource.data.ct.size() < 20000\n        && (!('del' in request.resource.data) || (request.resource.data.del == true && !existsAfter(caseBefore())))\n        && okHist() && okAfter();\n      allow update, delete: if false;\n    }\n    // which set of these rules is live: the app reads this (it needn't exist); older rules refuse it\n    match /meta/rules_20261004 {\n      allow get: if isMember();\n    }\n    match /meta/rules_20261008 {\n      allow get: if isMember();\n    }\n    match /meta/rules_20261012 {\n      allow get: if isMember();\n    }\n    match /meta/rules_20261019 {\n      allow get: if isMember();\n    }\n\n    // ---------- the Tray Maker's queue (19 Oct 2026) ----------\n    // The Tray Maker on the lab PC (the models for retainers, whitening trays and mouthguards) shows the cases waiting\n    // for their models. It never has the office key, so the app writes it a small sealed copy of each such case -\n    // sealed to the Tray Maker's own public key, which it publishes here under its login (the lab PC's robot login,\n    // the same one the lab bridge uses). It can read the queue and its own key entry, and nothing else; when the\n    // models are sent it adds a sealed note to the inbox like the lab bridge does, and the app takes the case out.\n    match /labqkeys/{uid} {\n      function okLabKey() {\n        let d = request.resource.data;\n        return d.keys().hasOnly(['pub', 'kid', 'name', 'ver', 'at']) && 'pub' in d && okPub(d)\n          && d.kid is string && d.kid.size() <= 40 && d.name is string && d.name.size() <= 120\n          && (!('ver' in d) || (d.ver is string && d.ver.size() <= 20)) && d.at == request.time;\n      }\n      allow get, list: if isMember() || isBot();\n      allow create, update: if isBot() && uid == request.auth.uid && okLabKey();\n      allow delete: if isOwner();\n    }\n    match /labq/{id} {\n      function okLabQ() {\n        let d = request.resource.data;\n        return d.keys().hasOnly(['kid', 'epk', 'iv', 'ct', 'at'])\n          && d.kid is string && d.kid.size() <= 40\n          && d.epk is map && d.epk.keys().hasOnly(['kty', 'crv', 'x', 'y'])\n          && d.iv is string && d.iv.size() <= 24 && d.ct is string && d.ct.size() <= 20000\n          && d.at == request.time;\n      }\n      allow get, list: if isMember() || isBot();\n      allow create, update: if isMember() && okLabQ();\n      allow delete: if isMember() || isBot();\n    }\n\n    // ---------- read marks on Messages (12 Oct 2026) ----------\n    // Which notes and stickers a person has read (and marked unread again), so a message read on one computer or phone is\n    // read on all of them. One document per person, at their staff id, sealed in the browser with the office key like a\n    // case: only they can read or write it, and only while their login is active. Never listed; removed with the person.\n    match /msgSeen/{sid} {\n      function okSeen() {\n        let d = request.resource.data;\n        return d.keys().hasOnly(['v', 'iv', 'ct', 'at']) && d.v == curV()\n          && d.iv is string && d.iv.size() <= 24 && d.ct is string && d.ct.size() < 400000 && d.at == request.time;\n      }\n      allow get: if isMember() && sid == mySid();\n      allow create, update: if isMember() && sid == mySid() && okSeen();\n      // the owner removes it with the person (they can't read it: it only goes, so a username given to someone new starts clean)\n      allow delete: if isOwner();\n      allow list: if false;\n    }\n\n    // ---------- patient photos ----------\n    // One small picture per case \u2014 and, since the IPR Tracker joined this database (Amir, 27 Oct 2026: \"the IPR tracker and\n    // case tracker should be fully sharing the same data \u2026 their photo, exactly how we have it in case tracker\"), one per\n    // IPR Tracker patient record, at photos/{that record's id} \u2014 sealed in the browser with the office key like the record\n    // itself. It changes only together with a save of its record (so the record's history shows who added or changed it),\n    // or with a brand-new record; the owner re-seals pictures unchanged after a key change. Record ids are random, so a\n    // picture is a case's or an IPR patient's, never both.\n    function caseDoc(id) { return /databases/$(db)/documents/cases/$(id); }\n    function caseSavedNow(id) { return exists(caseDoc(id)) && existsAfter(caseDoc(id)) && getAfter(caseDoc(id)).data.rev == get(caseDoc(id)).data.rev + 1; }\n    function iprPtSavedNow(id) { return exists(iprPtDoc(id)) && existsAfter(iprPtDoc(id)) && getAfter(iprPtDoc(id)).data.rev == get(iprPtDoc(id)).data.rev + 1; }\n    // the picture's record is saved in this same write: made now, or its revision moved on (a case, else an IPR Tracker patient)\n    function photoRecordSaved(id) {\n      return (existsAfter(caseDoc(id)) && (!exists(caseDoc(id)) || caseSavedNow(id)))\n        || (!exists(caseDoc(id)) && !existsAfter(caseDoc(id)) && existsAfter(iprPtDoc(id)) && (!exists(iprPtDoc(id)) || iprPtSavedNow(id)));\n    }\n    match /photos/{id} {\n      function okPhoto() {\n        let d = request.resource.data;\n        return d.keys().hasOnly(['v', 'iv', 'ct', 'pv', 'at', 'by']) && d.v == curV()\n          && d.iv is string && d.iv.size() <= 24 && d.ct is string && d.ct.size() <= 90000\n          && d.pv is string && d.pv.size() > 0 && d.pv.size() <= 20\n          && d.by == request.auth.uid && d.at == request.time;\n      }\n      allow get: if isMember();\n      allow list: if isOwner();\n      allow create: if isMember() && okPhoto() && photoRecordSaved(id);\n      allow update: if isMember() && okPhoto()\n        && (photoRecordSaved(id) || (isOwner() && request.resource.data.pv == resource.data.pv && (existsAfter(caseDoc(id)) || existsAfter(iprPtDoc(id)))));\n      // taken off together with a save of its record, with the record itself, or when it has no record at all\n      allow delete: if isMember() && (\n        (exists(caseDoc(id)) && (!existsAfter(caseDoc(id)) || caseSavedNow(id)))\n        || (!exists(caseDoc(id)) && exists(iprPtDoc(id)) && (!existsAfter(iprPtDoc(id)) || iprPtSavedNow(id)))\n        || (!exists(caseDoc(id)) && !exists(iprPtDoc(id))));\n    }\n\n    // ---------- lab-email updates ----------\n    // A small Google Apps Script in the office's Gmail accounts forwards lab emails, sealed to the office\n    // inbox key so only the app can open them. Its own login (made by the owner) can add sealed items to the\n    // inbox and note when it last checked the mail. It can't read or change anything else.\n    function isBot() { return authed() && exists(/databases/$(db)/documents/mailbots/$(request.auth.uid)); }\n    match /mailbots/{uid} {\n      allow get: if authed() && (request.auth.uid == uid || isOwner());\n      allow list: if isOwner();\n      allow create: if isOwner() && request.resource.data.keys().hasOnly(['email', 'at'])\n        && request.resource.data.email is string && request.resource.data.at == request.time;\n      allow delete: if isOwner();\n      allow update: if false;\n    }\n    // the inbox public key the robot seals to (and which senders to forward)\n    match /meta/inbox {\n      allow get: if isMember() || isBot();\n      allow create, update: if isOwner() && request.resource.data.keys().hasOnly(['pub', 'kid', 'senders', 'at', 'notify'])\n        && 'pub' in request.resource.data && okPub(request.resource.data)\n        && request.resource.data.kid is string && request.resource.data.kid.size() <= 40\n        && request.resource.data.senders is list && request.resource.data.senders.size() <= 40\n        && okNotify(request.resource.data);\n      allow delete: if false;\n    }\n    // its private half, sealed with the office key\n    match /meta/inboxKey {\n      allow get: if isMember();\n      allow create, update: if isOwner();\n      allow delete: if false;\n    }\n    // the robot's login, sealed with the office key, so the owner can show the script again\n    match /meta/mailbot {\n      allow get, create, update, delete: if isOwner();\n    }\n    match /inbox/{id} {\n      allow create: if isBot() && id.matches('^m[0-9a-f]{40}$')\n        && request.resource.data.keys().hasOnly(['kid', 'epk', 'iv', 'ct', 'at'])\n        && request.resource.data.kid is string && request.resource.data.kid.size() <= 40\n        && request.resource.data.epk is map && request.resource.data.epk.keys().hasOnly(['kty', 'crv', 'x', 'y'])\n        && request.resource.data.iv is string && request.resource.data.iv.size() <= 24\n        && request.resource.data.ct is string && request.resource.data.ct.size() <= 400000\n        && request.resource.data.at == request.time;\n      allow get, list: if isMember();\n      // staff mark which updates in an email are dealt with (and which open app is handling it), and remove it once all are\n      // (a claim is checked only when it changes \u2014 marking updates done keeps the earlier claim as it was)\n      allow update: if isMember() && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['done', 'claim'])\n        && (!('done' in request.resource.data) || (request.resource.data.done is list && request.resource.data.done.size() <= 200))\n        && (!request.resource.data.diff(resource.data).affectedKeys().hasAny(['claim'])\n            || (request.resource.data.claim is map && request.resource.data.claim.keys().hasOnly(['by', 'at'])\n                && request.resource.data.claim.by is string && request.resource.data.claim.by.size() <= 20 && request.resource.data.claim.at == request.time));\n      allow delete: if isMember();\n    }\n    // when each mailbox's script last checked the mail (no patient data)\n    match /mailbeat/{id} {\n      allow get, list: if isMember();\n      // (pub: the key a newer script opens front-desk notes with \u2014 its private half stays in that Gmail account)\n      allow create, update: if isBot() && id.matches('^b[0-9a-f]{32}$')\n        && request.resource.data.keys().hasOnly(['box', 'at', 'seen', 'sent', 'err', 'ver', 'pub']) && okPub(request.resource.data)\n        && request.resource.data.box is string && request.resource.data.box.size() <= 120\n        && request.resource.data.at == request.time\n        && request.resource.data.seen is int && request.resource.data.sent is int\n        && request.resource.data.err is string && request.resource.data.err.size() <= 300\n        && request.resource.data.ver is string && request.resource.data.ver.size() <= 20;\n      allow delete: if isOwner();\n    }\n\n    // ---------- a note for the front desk (Amir, 8 Oct 2026: \"when the case gets delayed (not shipped by the expected time)\n    // please also send a email to Questions@thenextlevelorthodontics.com to let the front desk know\") ----------\n    // An open app adds a note here in the same save that marks the case as emailed, sealed to one mailbox script's own key\n    // (its private half never leaves that Gmail account). That script opens it, emails meta/inbox's front-desk address \u2014 the\n    // only address it sends these to \u2014 and removes it. Nobody else can read it.\n    match /outbox/{id} {\n      allow create: if isMember() && id.matches('^o[0-9a-f]{32}$')\n        && request.resource.data.keys().hasOnly(['box', 'epk', 'iv', 'ct', 'at'])\n        && request.resource.data.box is string && request.resource.data.box.matches('^b[0-9a-f]{32}$')\n        && request.resource.data.epk is map && request.resource.data.epk.keys().hasOnly(['kty', 'crv', 'x', 'y'])\n        && request.resource.data.iv is string && request.resource.data.iv.size() <= 24\n        && request.resource.data.ct is string && request.resource.data.ct.size() <= 20000\n        && request.resource.data.at == request.time;\n      allow get, list: if isBot();\n      allow delete: if isBot() || isOwner();\n      allow update: if false;\n    }\n\n    // ---------- NLO Leads (same office, same logins, same key ring) ----------\n    // Leads follow the same pattern as cases: sealed in the browser, every write comes with an\n    // append-only history entry (\"leadLog/<lead>_<rev>\") holding the copy it replaced.\n    function leadHistAfter(id, rev) { return existsAfter(/databases/$(db)/documents/leadLog/$(id + '_' + string(rev))); }\n    match /leads/{id} {\n      function okLead() {\n        let d = request.resource.data;\n        return d.keys().hasOnly(['v', 'iv', 'ct', 'status', 'rev', 'by', 'sid', 'createdAt', 'updatedAt', 'closedAt'])\n          && d.v == curV() && d.iv is string && d.ct is string && d.ct.size() < 300000\n          && d.rev is int && d.by == request.auth.uid && d.sid == mySid()\n          && d.updatedAt == request.time\n          && ((d.status == 'open' && d.closedAt == null) || (d.status == 'done' && d.closedAt is timestamp));\n      }\n      allow read: if isMember()  // a teammate who works from home uses): each its own login, made on that laptop and approved by Dr. A with the code it\n    // shows, for the people he picked \u2014 a time clock that also works away from the office. He renames one, changes who\n    // uses it, or takes it back (a lost laptop, someone leaving).\n    match /tcLaptops/{uid} {\n      function okLap(d) {\n        return d.name is string && d.name.size() > 0 && d.name.size() <= 40 && d.sids is list && d.sids.size() > 0 && d.sids.size() <= 4\n          && d.sids[0] is string && d.sids[0].size() <= 40 && (d.sids.size() < 2 || (d.sids[1] is string && d.sids[1].size() <= 40))\n          && (d.sids.size() < 3 || (d.sids[2] is string && d.sids[2].size() <= 40)) && (d.sids.size() < 4 || (d.sids[3] is string && d.sids[3].size() <= 40));\n      }\n      allow get: if isTcMgr() || (authed() && request.auth.uid == uid);\n      allow list: if isTcMgr() || isTcBot();\n      // (only a laptop asking for it in the last 30 minutes: Dr. A types the code it shows)\n      allow create: if isOwner() && request.resource.data.keys().hasOnly(['name', 'sids', 'at', 'by']) && okLap(request.resource.data)\n        && request.resource.data.at == request.time && request.resource.data.by == request.auth.uid\n        && request.time < get(/databases/$(db)/documents/tcLapReq/$(uid)).data.at + duration.value(30, 'm');\n      allow update: if (isOwner() && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['name', 'sids']) && okLap(request.resource.data))\n        || (authed() && request.auth.uid == uid && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['seen'])\n            && request.resource.data.seen == request.time);\n      allow delete: if isOwner();\n    }\n    // a laptop asking to be approved: its own new login, made on that laptop, and a 6-digit code it shows, so Dr. A approves\n    // the right one on his own phone or computer (his password never goes on the laptop). Anyone can make a login, t() && request.resource.data.keys().hasOnly(['net', 'office', 'org', 'city', 'pid', 'relay', 'at'])\n        && okNet(request.resource.data.net) && request.resource.data.office is bool\n        && request.resource.data.org is string && request.resource.data.org.size() <= 100\n        && request.resource.data.city is string && request.resource.data.city.size() <= 60\n        && request.resource.data.pid is string && request.resource.data.pid.matches('^p[0-9a-f]{24}$') && request.resource.data.relay is bool\n        && request.resource.data.at == request.time\n        && (exists(/databases/$(db)/documents/members/$(uid)) || exists(/databases/$(db)/documents/tcKiosks/$(uid)) || exists(/databases/$(db)/documents/tcLaptops/$(uid)));\n      allow delete: if isOwner();\n    }\n    // the office's networks: Dr. A saves the one he's on right now (\"This is the office\" \u2014 never an address many people\n    // share, like iCloud Private Relay or a VPN); he can rename or remove one\n    match /tcOffice/{net} {\n      function okOffice(d) {\n        return okNet(net) && d.keys().hasOnly(['name', 'org', 'city', 'by', 'at'])\n          && d.name is string && d.name.size() > 0 && d.name.size() <= 40\n          && d.org is string && d.org.size() <= 100 && d.city is string && d.city.size() <= 60\n          && d.by == request.auth.uid && d.at == request.time;\n      }\n      allow get, list: if isOwner() || isNetBot();\n      allow create: if isOwner() && okOffice(request.resource.data) && seenNet(request.auth.uid, 5)\n        && get(seenDoc(request.auth.uid)).data.net == net && get(seenDoc(request.auth.uid)).data.relay == false;\n      allow update: if isOwner() && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['name'])\n        && request.resource.data.name is string && request.resource.data.name.size() > 0 && request.resource.data.name.size() <= 40;\n      allow delete: if isOwner();\n    }\n    // which set of these rules is live (the page reads this; older rules refuse it)\n    match /meta/rules_tc_1 {\n      allow get: if isMember() || isTcDevice();\n    }\n    match /meta/rules_tc_2 {\n      allow get: if isMember() || isTcDevice() || isLaptop() || isNetBot();\n    }\n    // (Paychex's IDs, meta/tcPx: the page offers them once these rules are live)\n    match /meta/rules_tc_3 {\n      allow get: if isMember() || isTcDevice() || isLaptop() || isNetBot();\n    }\n    // (paid holidays, meta/tcHol: the Payroll page offers them once these rules are live)\n    match /meta/rules_tc_4 {\n      allow get: if isMember() || isTcDevice() || isLaptop() || isNetBot();\n    }\n\n    // =====================================================================\n    // NLO Inventory (16 Oct 2026; Amir: \"make this app similar to case tracker to use the same logins and logout after 10\n    // mins same rules\"): supplies, the shared cart, orders and receiving, vendors, the activity log and the supply budget,\n    // moved here from Inventory's own Realtime Database (nlo-inventory). Same logins, roster and idle lock as NLO Cases.\n    // Nothing here is patient data, so nothing is sealed.\n    // - Every write says who made it and when (upBy = the member's staff id, up = the database's time) and moves the\n    //   change counter (invState/rev) in the same save: the alert script watches that one number.\n    // - The steps people take carry the name of whoever saved them: the activity log is one record per person per month\n    //   (invLog/m<YYYY-MM>~<staff id>), each person adding only to their own, entries only ever added; an order's trail only\n    //   grows by the step being saved, in the saver's name; expenses bought outside an order are records of their own\n    //   (invExpenses) in the name of whoever added them, taken off only by them or Dr. A. (Dr. A's own\n    //   saves aren't held to this: the one-time move brings the old records over as the old app stamped them.)\n    // - Supplies and vendors are hidden with a flag, never deleted; orders are never deleted. Once an order is received,\n    //   everyone else only adds its paperwork (invoice numbers and amounts, prices from the packing slip, the slip photo).\n    // - Only Dr. A changes settings (budget amounts, vendors, storage locations, archiving and deleting supplies, voiding and\n    //   reopening orders, the alert switches and the AI keys). Amir, 16 Oct 2026: \"for assistants, the budget vendor and\n    //   setting are not needed \u2026 they will just need to look up inventory, add items to the cart and if I approve them, they\n    //   can place order\" \u2014 and only he approves.\n    // - His OKs on cart lines (invState/cart.ok) are his alone: anyone else may only take one off (with its line). That an order\n    //   someone else saves came only from OK'd lines is the page's to check: the cart is one shared record.\n    // - The alert script (Dr. A's Apps Script) has its own login (invBots): it reads Inventory (and the AI keys, which Staff\n    //   Meeting and Month-End read from the old database), sends and clears the alerts, and copies the supply numbers to the\n    //   old database, where Staff Meeting and AISA read them.\n    // =====================================================================\n    function invRevDoc() { return /databases/$(db)/documents/invState/rev; }\n    function isInvAdmin() { return isOwner(); }\n    function isInvBot() { return authed() && exists(/databases/$(db)/documents/invBots/$(request.auth.uid)); }\n    function invReader() { return isMember() || isInvBot(); }\n    // the change counter went up by one in this same save\n    function invBumped() { return getAfter(invRevDoc()).data.n == (exists(invRevDoc()) ? get(invRevDoc()).data.n : 0) + 1; }\n    function invOk(d) { return isMember() && d.up == request.time && d.upBy == mySid() && invBumped(); }\n    function invChanged(keys) { return request.resource.data.diff(resource.data).affectedKeys().hasAny(keys); }\n    function invWas(k) { return resource.data.get(k, null); }\n    match /invItems/{id} {\n      allow read: if invReader();\n      allow create: if invOk(request.resource.data) && request.resource.data.id == id && request.resource.data.size() <= 120\n        && (isInvAdmin() || (request.resource.data.get('deleted', false) != true && request.resource.data.get('archived', false) != true));\n      allow update: if invOk(request.resource.data) && request.resource.data.id == id && request.resource.data.size() <= 120\n        && (isInvAdmin() || !invChanged(['deleted', 'archived', 'deletedBy', 'deletedAt', 'archivedBy', 'archivedAt']));\n      allow delete: if false;\n    }\n    match /invOrders/{id} {\n      function okSt(s) { return s == 'open' || s == 'backordered' || s == 'received'; }\n      function okMove(a, b) { return a == b || ((a == 'open' || a == 'backordered') && b == 'received') || (a == 'open' && b == 'backordered') || (a == 'backordered' && b == 'open'); }\n      // the trail (n, was o) only grows by the step being saved, and that step is the saver's (the oldest drops off at 40)\n      function trailOk(n, o) {\n        return n == o || (n is list && n.size() == (o.size() < 40 ? o.size() + 1 : 40) && n[n.size() - 1] is map\n          && n[n.size() - 1].get('byId', '') == mySid() && (o.size() == 0 || n[0:n.size() - 1] == o[o.size() - (n.size() - 1):o.size()]));\n      }\n      // what everyone else may still change on a received order: its paperwork\n      function paperworkOnly() {\n        return request.resource.data.diff(resource.data).affectedKeys().hasOnly(['items', 'invoiceNumber', 'invoiceDate', 'invoiceSubtotal', 'invoiceTaxes',\n          'invoiceShipping', 'slipPhoto', 'trail', 'up', 'upBy']);\n      }\n      // a receipt is the saver's: their id on it, and their \"received\" step on the trail\n      function receiptOk(d) { return d.get('receivedById', '') == mySid() && d.get('trail', []).size() > 0 && d.trail[d.trail.size() - 1].get('t', '') == 'received'; }\n      allow read: if invReader();\n      // a new order carries one step, the saver's (placed, scanned, or the backorder of an earlier one)\n      allow create: if invOk(request.resource.data) && request.resource.data.id == id && request.resource.data.size() <= 120\n        && (isInvAdmin() || okSt(request.resource.data.get('status', '')))\n        && (isOwner() || (request.resource.data.get('trail', []).size() == 1 && trailOk(request.resource.data.trail, [])\n          && (request.resource.data.get('orderedById', mySid()) == mySid() || 'backorderOf' in request.resource.data)\n          && (request.resource.data.get('status', '') != 'received' || request.resource.data.get('receivedById', mySid()) == mySid())));\n      allow update: if invOk(request.resource.data) && request.resource.data.id == id && request.resource.data.size() <= 120\n        && (isInvAdmin() || (okMove(invWas('status'), request.resource.data.get('status', ''))\n          && (invWas('status') != 'received' || paperworkOnly())))\n        && (isOwner() || (trailOk(request.resource.data.get('trail', []), resource.data.get('trail', []))\n          && (!invChanged(['receivedById']) || request.resource.data.get('receivedById', mySid()) == mySid())\n          && (invWas('status') == 'received' || request.resource.data.get('status', '') != 'received' || receiptOk(request.resource.data))\n          && (invWas('status') != 'received' || !invChanged(['items']) || request.resource.data.get('trail', []) != resource.data.get('trail', []))));\n      allow delete: if false;\n    }\n    match /invVendors/{id} {\n      // anyone may add a vendor (one typed on a supply joins the list: a new v-\u2026 record with just its name) and fill in an\n      // account number or address a packing slip shows when there wasn't one; everything else (website, phone, order email,\n      // rep\u2026) is Dr. A's\n      function blank(k) { return !(k in resource.data) || resource.data[k] == null || resource.data[k] == ''; }\n      allow read: if invReader();\n      allow create: if invOk(request.resource.data) && request.resource.data.id == id && request.resource.data.size() <= 60\n        && (isInvAdmin() || (request.resource.data.keys().hasOnly(['id', 'name', 'acct', 'address', 'up', 'upBy'])\n          && (id.matches('^v-.+$') || !('name' in request.resource.data))));\n      allow update: if invOk(request.resource.data) && request.resource.data.id == id && request.resource.data.size() <= 60\n        && (isInvAdmin() || (request.resource.data.diff(resource.data).affectedKeys().hasOnly(['acct', 'address', 'up', 'upBy'])\n          && (!invChanged(['acct']) || blank('acct')) && (!invChanged(['address']) || blank('address'))));\n      allow delete: if false;\n    }\n    match /invLog/{d} {\n      // one record per person per month, m<YYYY-MM>~<staff id> (the moved entries under the id the old app stamped them with)\n      function okLog(x) { return x.keys().hasOnly(['e', 'mon', 'who', 'up', 'upBy']) && x.e is map && x.e.size() <= 1500\n        && x.mon is string && x.mon.matches('^[0-9]{4}-[0-9]{2}$') && x.who is string && d == 'm' + x.mon + '~' + x.who; }\n      allow read: if invReader();\n      allow create: if invOk(request.resource.data) && okLog(request.resource.data) && (request.resource.data.who == mySid() || isOwner());\n      allow update: if invOk(request.resource.data) && okLog(request.resource.data) && (resource.data.who == mySid() || isOwner())\n        && request.resource.data.e.diff(resource.data.e).changedKeys().size() == 0\n        && request.resource.data.e.diff(resource.data.e).removedKeys().size() == 0;\n      allow delete: if false;\n    }\n    // expenses bought outside an order (a card at a store), in the name of whoever added them\n    match /invExpenses/{id} {\n      function okEx(x) { return x.keys().hasOnly(['id', 'date', 'amount', 'category', 'vendor', 'note', 'description', 'by', 'byId', 'addedAt', 'up', 'upBy'])\n        && x.id == id && x.amount is number && x.amount >= 0 && x.amount <= 100000 && x.date is string && x.date.size() <= 40\n        && x.get('category', '') is string && x.get('category', '').size() <= 60 && x.get('vendor', '') is string && x.get('vendor', '').size() <= 200\n        && x.get('note', '') is string && x.get('note', '').size() <= 500 && x.get('by', '') is string && x.get('by', '').size() <= 80; }\n      allow read: if invReader();\n      allow create: if invOk(request.resource.data) && (isOwner() || (okEx(request.resource.data) && request.resource.data.get('byId', '') == mySid()));\n      allow delete: if isMember() && invBumped() && (isInvAdmin() || resource.data.get('byId', '') == mySid()\n        || resource.data.get('byId', '') == get(/databases/$(db)/documents/roster/$(mySid())).data.get('rid', '-'));\n      allow update: if false;\n    }\n    match /invState/rev {\n      function okRev(d) { return d.keys().hasOnly(['n', 'up', 'upBy']) && d.n is int && d.up == request.time && d.upBy == mySid(); }\n      allow get: if invReader();\n      allow create: if isMember() && okRev(request.resource.data) && request.resource.data.n == 1;\n      allow update: if isMember() && okRev(request.resource.data) && request.resource.data.n == resource.data.n + 1;\n      allow delete: if false;\n    }\n    match /invState/cart {\n      // ok: Dr. A's OK on each line he approved ({line id: {by, byId, at, n, it}}): only he adds or changes one; anyone else's\n      // save keeps them as they are, or takes some off (a line ordered or taken out)\n      function okOks() {\n        let n = request.resource.data.get('ok', {});\n        let o = resource == null ? {} : resource.data.get('ok', {});\n        return n is map && n.size() <= 400 && (isOwner() || (n.diff(o).addedKeys().size() == 0 && n.diff(o).changedKeys().size() == 0));\n      }\n      allow get: if invReader();\n      allow create, update: if invOk(request.resource.data) && request.resource.data.keys().hasOnly(['lines', 'ok', 'up', 'upBy'])\n        && request.resource.data.lines is list && request.resource.data.lines.size() <= 400 && okOks();\n      allow delete: if false;\n    }\n    match /invState/bracket {\n      allow get: if invReader();\n      allow create, update: if invOk(request.resource.data) && request.resource.data.keys().hasOnly(['v', 'up', 'upBy']);\n      allow delete: if false;\n    }\n    match /invState/prices {\n      allow get: if invReader();\n      allow create, update: if invOk(request.resource.data) && request.resource.data.keys().hasOnly(['p', 'up', 'upBy']) && request.resource.data.p is map;\n      allow delete: if false;\n    }\n    match /invState/budget {\n      // the budget amounts, Dr. A's (the expenses are records of their own: invExpenses)\n      function okBud(d) { return d.keys().hasOnly(['monthly', 'categories', 'history', 'changedBy', 'changedAt', 'up', 'upBy']); }\n      allow get: if invReader();\n      allow create, update: if invOk(request.resource.data) && okBud(request.resource.data) && isInvAdmin();\n      allow delete: if false;\n    }\n    match /invState/settings {\n      // (invAdmins: the list of people who changed settings before 16 Oct; nothing reads it now)\n      function okSet(d) { return d.keys().hasOnly(['locations', 'invAdmins', 'alertsOn', 'pushOn', 'geminiProxyUrl', 'invPrefs', 'up', 'upBy'])\n        && (!('invAdmins' in d) || (d.invAdmins is list && d.invAdmins.size() <= 30))\n        && (!('pushOn' in d) || d.pushOn is bool); }\n      allow get: if invReader();\n      allow create, update: if invOk(request.resource.data) && okSet(request.resource.data) && isOwner();\n      allow delete: if false;\n    }\n    // Dr. A's phone push (the free ntfy app) when someone adds to the cart: Inventory keeps the topic between him and the alert\n    // script, which sends the pushes (settings.pushOn tells the pages to leave the cart adds for it) \u2014 if he uses the Time\n    // Clock's topic, the Time Clock's managers know it too; test: when he asked for a test push\n    match /invState/push {\n      function okPush(d) { return d.keys().hasOnly(['topic', 'test', 'up', 'upBy']) && d.topic is string && d.topic.matches('^[A-Za-z0-9_-]{0,64}$')\n        && (!('test' in d) || d.test is int); }\n      allow get: if isOwner() || isInvBot();\n      allow create, update: if invOk(request.resource.data) && isOwner() && okPush(request.resource.data);\n      allow delete: if false;\n    }\n    // the AI keys for reading packing slips (and product photos): everyone signed in uses them, only Dr. A sets them; the\n    // alert script copies them to the old database, where Staff Meeting and Month-End read them\n    match /invState/ai {\n      allow get: if isMember() || isInvBot();\n      allow create, update: if invOk(request.resource.data) && isOwner() && request.resource.data.keys().hasOnly(['gemini', 'openai', 'up', 'upBy']);\n      allow delete: if false;\n    }\n    // the cart, order and receiving emails to Dr. A: written as they happen, sent and cleared by the alert script\n    match /invAlerts/{id} {\n      function okAlert(x) { return x.keys().hasOnly(['t', 'at', 'id', 'vendor', 'by', 'lines', 'total', 'note', 'ordered', 'how', 'noCount', 'inCart', 'up', 'upBy'])\n        && x.get('t', '') in ['cart', 'ordered', 'reopened', 'received']\n        && x.get('by', '') is string && x.get('by', '').size() <= 80 && x.get('vendor', '') is string && x.get('vendor', '').size() <= 120\n        && x.get('note', '') is string && x.get('note', '').size() <= 300 && x.get('id', '') is string && x.get('id', '').size() <= 80\n        && x.get('ordered', '') is string && x.get('ordered', '').size() <= 40 && x.get('how', '') is string && x.get('how', '').size() <= 40\n        && x.get('lines', []) is list && x.get('lines', []).size() <= 60; }\n      allow create: if invOk(request.resource.data) && okAlert(request.resource.data);\n      allow read, delete: if isOwner() || isInvBot();\n      allow update: if false;\n    }\n    // supply photos and packing-slip photos (base64 in b, its type in m): read when they're shown\n    match /invPics/{id} {\n      allow get: if isMember();\n      allow create: if invOk(request.resource.data) && request.resource.data.keys().hasOnly(['m', 'b', 'kind', 'up', 'upBy'])\n        && request.resource.data.m in ['image/jpeg', 'image/png', 'image/webp'] && request.resource.data.b is string\n        && request.resource.data.b.size() <= 1000000 && request.resource.data.get('kind', '') is string;\n      allow delete: if isInvAdmin();\n      allow update: if false;\n    }\n    // the one-time move from the old database: done once, by Dr. A (until then the page offers him the move)\n    match /invMeta/moved {\n      allow get: if invReader();\n      allow create: if invOk(request.resource.data) && isOwner();\n      allow update, delete: if false;\n    }\n    // the alert script's own login (made by Dr. A in Inventory \u2192 Settings \u2192 Email alerts), and when it last checked\n    match /invBots/{uid} {\n      allow get: if isOwner() || (authed() && request.auth.uid == uid);\n      allow list: if isOwner();\n      allow create: if isOwner() && request.resource.data.keys().hasOnly(['email', 'at'])\n        && request.resource.data.email is string && request.resource.data.at == request.time;\n      allow delete: if isOwner();\n      allow update: if false;\n    }\n    match /invBeat/{uid} {\n      allow get, list: if isOwner();\n      allow create, update: if isInvBot() && request.auth.uid == uid\n        && request.resource.data.keys().hasOnly(['at', 'ver', 'err', 'sent', 'copied']) && request.resource.data.at == request.time;\n      allow delete: if isOwner();\n    }\n    // Mari's List (17 Oct 2026; Amir, once the Mari's List member prices were saved: \"okay all of that needs to be in the\n    // inventory app some how\"): the office's member prices (from the price files on the Mari's List member portal), each\n    // vendor's deal, code and how to order, and which prices are the same as the office's supplies. Mari's List's prices stay\n    // in the office: everyone signed in reads them; only Dr. A loads a set (its parts p<set>_<n> first, then info, which\n    // points the pages at them, and the links) and links a price to a supply (match). The pages read info to know whether\n    // these rules are live (older rules refuse it). Nothing here moves the change counter: the alert script doesn't use them.\n    match /invMl/{id} {\n      function okMl(d) {\n        return d.up == request.time && d.upBy == mySid() && (\n          (id == 'info' && d.keys().hasOnly(['ver', 'at', 'src', 'vendors', 'parts', 'rows', 'loadedAt', 'loadedBy', 'up', 'upBy'])\n            && d.ver is string && d.ver.matches('^[0-9a-z]{4,16}$') && d.vendors is list && d.vendors.size() <= 400\n            && d.parts is int && d.parts >= 0 && d.parts <= 60 && d.rows is int && d.rows >= 0)\n          || (id == 'match' && d.keys().hasOnly(['m', 'up', 'upBy']) && d.m is map && d.m.size() <= 3000)\n          || (id.matches('^p[0-9a-z]{4,16}_[0-9]{1,2}$') && d.keys().hasOnly(['t', 'up', 'upBy']) && d.t is string && d.t.size() <= 1000000));\n      }\n      allow read: if isMember();\n      allow create, update: if isOwner() && okMl(request.resource.data);\n      allow delete: if isOwner() && id.matches('^p[0-9a-z]{4,16}_[0-9]{1,2}$');\n    }\n    // which set of these rules is live (the page reads this; older rules refuse it)\n    match /meta/rules_inv_1 {\n      allow get: if invReader();\n    }\n\n    // ---------- NLO IPR Tracker (same office, same logins, same key ring; 23 Oct 2026) ----------\n    // Amir, 23 Oct 2026: \"can we just use the full name of the patients instead of having like initials\" \u2192 the IPR Tracker moved\n    // here from its own Realtime Database (nothing sealed there, and outside Google's BAA). A patient and each of their visits\n    // are sealed in the browser with the office key, like cases; every save comes with a history entry holding the copy it\n    // replaced (iprPtLog / iprVisLog, append-only), as leads do. Plain fields: the key version, the revision, who saved and\n    // when, a visit's patient record (a random id) and pc \u2014 the keyed hash of the chart # that NLO Cases' patient index uses \u2014\n    // so NLO Cases finds a patient's IPR visits, and the IPR Tracker a patient's cases, without opening every record.\n    // A patient's photo (27 Oct 2026) sits in photos/{record id}, under the patient-photo rules above, changed only with a\n    // save of the record (its sealed copy names the picture's version, as a case's does).\n    function iprPtDoc(id) { return /databases/$(db)/documents/iprPts/$(id); }\n    function iprSealed(d, max) {\n      return d.v == curV() && d.iv is string && d.ct is string && d.ct.size() < max && d.rev is int\n        && d.by == request.auth.uid && d.sid == mySid() && d.updatedAt == request.time;\n    }\n    match /iprPts/{id} {\n      function okPt() {\n        let d = request.resource.data;\n        return d.keys().hasOnly(['v', 'iv', 'ct', 'rev', 'by', 'sid', 'createdAt', 'updatedAt', 'pc']) && iprSealed(d, 20000)\n          && (!('pc' in d) || (d.pc is string && d.pc.size() == 22));\n      }\n      allow read: if isMember();\n      allow create: if isMember() && okPt() && request.resource.data.rev == 1 && request.resource.data.createdAt == request.time\n        && existsAfter(/databases/$(db)/documents/iprPtLog/$(id + '_1'));\n      allow update: if isMember() && okPt() && request.resource.data.rev == resource.data.rev + 1\n        && request.resource.data.createdAt == resource.data.createdAt\n        && existsAfter(/databases/$(db)/documents/iprPtLog/$(id + '_' + string(request.resource.data.rev)));\n      allow delete: if isOwner() && existsAfter(/databases/$(db)/documents/iprPtLog/$(id + '_' + string(resource.data.rev + 1)));\n    }\n    match /iprVis/{id} {\n      function okVis() {\n        let d = request.resource.data;\n        return d.keys().hasOnly(['p', 'v', 'iv', 'ct', 'rev', source.data.keys().hasOnly(['at', 'by', 'pts', 'vis', 'named'])\n        && request.resource.data.at == request.time && request.resource.data.by == mySid()\n        && request.resource.data.pts is int && request.resource.data.vis is int && request.resource.data.get('named', 0) is int;\n      allow update, delete: if false;\n    }\n    // which set of these rules is live (the IPR Tracker and NLO Cases read this; older rules refuse it)\n    match /meta/rules_ipr_1 {\n      allow get: if isMember();\n    }\n    // =====================================================================\n    // CADANCe (cadence.html, 24 Oct 2026; Amir said yes to moving Cadence onto the NLO Cases system, the day after its\n    // sign-in became the NLO Cases login): the office's recurring checklists, each day's lists and their ticks, the\n    // out-of-office board and Cadence's activity log, moved here once from Cadence's own copy in the nlo-inventory Realtime\n    // Database (nlo/cadence/state). Same logins, roster and idle lock as NLO Cases. Nothing here is patient data, so nothing\n    // is sealed.\n    // - How Cadence is set up (cadState/config: checklists, roles, areas, staff, duties and rotations, settings) and the\n    //   copies it keeps of Staff Hub's roster, the office calendar's closed days and NLO Time Off's feed key (cadMirror) are\n    //   changed only by Dr. A. Everyone signed in reads all of Cadence.\n    // - Each day's lists (cadInst, one record per list) are made, ticked and certified by whoever is signed in; every save\n    //   says who and when (upBy = their staff id, up = the database's time). A list keeps its checklist and day, and once\n    //   certified it keeps that it was (certifiedAt): such a list is taken off only by Dr. A (one never certified may go:\n    //   someone out that day, a checklist archived).\n    // - Which day it is (cadState/day, with the quarter) and the out-of-office board (cadState/timeoff) are kept up by\n    //   everyone's screens;    match /cadInst/{id} {\n      function okInst(d) {\n        return cadOk(d) && d.get('id', '') == id && d.size() <= 40 && d.get('date', '') is string && d.get('date', '').size() <= 20\n          && d.get('checklistId', '') is string && d.get('items', {}) is map && d.get('items', {}).size() <= 400\n          && d.get('status', 'pending') in ['pending', 'in-progress', 'certified', 'in-review', 'failed']\n          && cadStr(d.get('assigneeId', null), 100) && cadStr(d.get('certifiedBy', null), 100) && cadStr(d.get('certifiedAt', null), 40);\n      }\n      function wasCertified(d) { return d.get('certifiedAt', null) != null || cadDone(d); }\n      allow read: if isMember();\n      allow create: if okInst(request.resource.data);\n      allow update: if okInst(request.resource.data)\n        && request.resource.data.get('checklistId', '') == resource.data.get('checklistId', '')\n        && request.resource.data.get('date', '') == resource.data.get('date', '')\n        && (resource.data.get('certifiedAt', null) == null || request.resource.data.get('certifiedAt', null) != null || isOwner());\n      allow delete: if isOwner() || (isMember() && (resource == null || !wasCertified(resource.data)));\n    }\n    match /cadAudit/{id} {\n      allow read: if isMember();\n      allow create: if isMember() && request.resource.data.get('id', '') == id\n        && request.resource.data.ts == request.time && request.resource.data.by == mySid()\n        && request.resource.data.keys().hasOnly(['id', 'tone', 'actor', 'message', 'detail', 'at', 't0', 'ts', 'by'])\n        && request.resource.data.get('message', '') is string && request.resource.data.get('message', '').size() <= 4000\n        && cadStr(request.resource.data.get('tone', null), 40) && cadStr(request.resource.data.get('actor', null), 200)\n        && cadStr(request.resource.data.get('detail', null), 2000) && cadStr(request.resource.data.get('at', null), 60)\n        && request.resource.data.get('t0', 0) is number && request.resource.data.get('t0', 0) <= request.time.toMillis() + 86400000;\n      allow update, delete: if false;\n    }\n    match /cadMirror/{id} {\n      allow read: if isMember();\n      allow create, update: if cadOk(request.resource.data) && isOwner() && id in ['roster', 'closures', 'tofeed'];\n      allow delete: if false;\n    }\n    match /cadMeta/moved {\n      allow get: if true;\n      allow create, update: if isOwner() && request.resource.data.keys().hasOnly(['on', 'pause', 'at'])\n        && request.resource.data.get('on', null) is bool && request.resource.data.get('pause', false) is bool\n        && request.resource.data.get('at', null) == request.time;\n      allow delete: if false;\n    }\n    match /cadMeta/info {\n      allow get: if isMember();\n      allow create, update: if cadOk(request.resource.data) && isOwner();\n      allow delete: if false;\n    }\n    // which set of these rules is live (Cadence reads these; older rules refuse them): 1 = Cadence's block (24 Oct 2026, the\n    // move), 2 = a log entry dated by a device's clock may run up to a day ahead (24 Oct 2026, the same afternoon)\n    match /meta/rules_cad_1 {\n      allow get: if isMember();\n    }\n    match /meta/rules_cad_2 {\n      allow get: if isMember();\n    }\n\n    // =====================================================================\n    // ---------- the Staff Meeting Hub + Month-End Numbers (same office, same logins; 30 Oct 2026) ----------\n    // Amir, 30 Oct 2026: \"make the login for staff hub the same as case tracker\" (he meant the Staff Meeting Hub) \u2192 \"Full move\n    // only\" (no Google step at all). Everything that lived under nlo/staffMeeting in the old database (nlo-inventory):\n    //   inbox \u2192 mtgInbox, actionItems \u2192 mtgActions, decisions \u2192 mtgDecisions, kpiDefs \u2192 mtgKpiDefs, meetings \u2192 mtgMeetings\n    //   (a meeting's transcript and pasted notes \u2192 mtgTexts, the same id), config / currentMeetingId / roster \u2192 mtgState/ atch /mtgMeetings/{id} {\n      allow read: if mtgMember();\n      allow create, update: if mtgOk(request.resource.data) && mtgId(id);\n      allow delete: if mtgMember();\n    }\n    match /mtgTexts/{id} {\n      allow read: if mtgMember();\n      allow create, update: if mtgOk(request.resource.data) && mtgId(id);\n      allow delete: if mtgMember();\n    }\n    match /mtgState/{id} {\n      allow read: if mtgMember();\n      allow create, update: if mtgOk(request.resource.data) && (id in ['config', 'current', 'roster'] || (id == 'aisa' && isOwner()));\n      allow delete: if isOwner() && id == 'aisa';\n    }\n    match /meMonths/{ym} {\n      allow read: if mtgMember();\n      allow create, update: if mtgOk(request.resource.data) && ym.matches('^[0-9]{4}-[0-9]{2}$');\n      allow delete: if mtgMember();\n    }\n    match /meState/{id} {\n      allow read: if mtgMember();\n      allow create, update: if mtgOk(request.resource.data) && id in ['years', 'config'];\n      allow delete: if false;\n    }\n    match /mtgMeta/moved {\n      allow get: if true;\n      // on: which database; pause: Dr. A is moving it back (screens wait); at: when\n      allow create, update: if isOwner() && request.resource.data.keys().hasOnly(['on', 'pause', 'at'])\n        && request.resource.data.get('on', null) is bool && request.resource.data.get('pause', false) is bool\n        && request.resource.data.get('at', null) == request.time;\n      allow delete: if false;\n    }\n    match /mtgMeta/info {\n      allow get: if mtgMember();\n      allow create, update: if mtgOk(request.resource.data) && isOwner();\n      allow delete: if false;\n    }\n    // which set of these rules is live (the Staff Meeting Hub and Month-End read this; older rules refuse it)\n    match /meta/rules_mtg_1 {\n      allow get: if isMember();\n    }\n  }\n}\n"; // the build puts the office's whole Firestore rules file here (Dr. A's "publish the rules" card)

function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }

/* Firebase refuses a whole write when any field is undefined; a JSON round trip drops them */

/* ---------- dates ----------
   Dates the app writes:
   - day-only fields (an order's dateOrdered, an expense's date): 'YYYY-MM-DD' on this computer's calendar
   - moments (dateReceived, addedAt, log dates, stamps): ISO strings
   Bare 'YYYY-MM-DD' strings are read at local noon, so they never slip to the day before. */
function isoOf(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

function parseDateLocal(d) {
  if (typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d)) return new Date(d + 'T12:00:00');
  return new Date(d);
}
function validDate(d) { return d instanceof Date && !isNaN(d.getTime()); }
function msOf(d) { if (!d) return 0; if (typeof d === 'number') return d; const x = parseDateLocal(d); return validDate(x) ? x.getTime() : 0; }
function addDays(iso, n) { const [y, m, d] = iso.split('-').map(Number); const dt = new Date(y, m - 1, d); dt.setDate(dt.getDate() + n); return isoOf(dt); }
function daysBetween(a, b) { const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = b.split('-').map(Number); return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 86400000); }
function dayOf(v) { const ms = msOf(v); return ms ? isoOf(new Date(ms)) : ''; }
/* "Oct 13" (adds the year when it isn't this year) */
function fmtDate(v) {
  const ms = msOf(v); if (!ms) return '';
  const d = new Date(ms), o = { month: 'short', day: 'numeric' };
  if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString('en-US', o);
}
/* "Tue, Oct 13" */
function fmtDay(v) { const ms = msOf(v); if (!ms) return ''; const d = new Date(ms); const o = { weekday: 'short', month: 'short', day: 'numeric' }; if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric'; return d.toLocaleDateString('en-US', o); }
function fmtClock(v) { const ms = msOf(v); return ms ? new Date(ms).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : ''; }
/* the stamp people read on a cart line or an order step: "Today 9:41 AM", "Yesterday 3:05 PM", "Tue, Oct 13 · 9:41 AM" */
function fmtWhen(v) {
  const ms = msOf(v); if (!ms) return '';
  const day = isoOf(new Date(ms)), t = todayISO();
  if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) return day === t ? 'Today' : day === addDays(t, -1) ? 'Yesterday' : fmtDay(v);
  if (day === t) return 'Today ' + fmtClock(ms);
  if (day === addDays(t, -1)) return 'Yesterday ' + fmtClock(ms);
  return fmtDay(ms) + ' · ' + fmtClock(ms);
}
/* "just now", "12 min ago", "3 h ago", "2 days ago", then the date */
function fmtAgo(v) {
  const ms = msOf(v); if (!ms) return '';
  const s = Math.max(0, (Date.now() - ms) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + ' min ago';
  if (s < 86400) return Math.floor(s / 3600) + ' h ago';
  const days = daysBetween(dayOf(ms), todayISO());
  if (days === 1) return 'yesterday';
  if (days < 7) return days + ' days ago';

}
function daysAgo(v) { const ms = msOf(v); return ms ? daysBetween(dayOf(ms), todayISO()) : null; }
function monthKey(v) { const ms = msOf(v); if (!ms) return ''; const d = new Date(ms); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function monthLabel(key, long) { const [y, m] = key.split('-').map(Number); return new Date(y, m - 1, 15).toLocaleDateString('en-US', long ? { month: 'long', year: 'numeric' } : { month: 'short' }); }
function monthStart(key) { const [y, m] = key.split('-').map(Number); return new Date(y, m - 1, 1, 0, 0, 0, 0); }
function monthEnd(key) { const [y, m] = key.split('-').map(Number); return new Date(y, m, 0, 23, 59, 59, 999); }

/* ---------- search ----------
   Wire sizes match however they're typed: ".016×.022", ".016x.022", "016 x 022" and "16x22" all become "16x22"; ".016" and "016" become "16". */
function normSearch(s) {
  return String(s || '').toLowerCase()
    .replace(/×/g, 'x')
    .replace(/\.?0*(\d{2})\s*x\s*\.?0*(\d{2})/g, '$1x$2')
    .replace(/\.0+(\d{2})\b/g, '$1')
    .replace(/\b0+(\d{2})\b/g, '$1');
}
function matchesAll(text, q) { const t = normSearch(text); return normSearch(q).split(/\s+/).filter(Boolean).every(w => t.includes(w)); }

const UNIT_PLURALS = { box: 'boxes', case: 'cases', pack: 'packs', pkg: 'pkgs', bag: 'bags', bottle: 'bottles', roll: 'rolls', set: 'sets', tube: 'tubes', jug: 'jugs', kit: 'kits', each: 'each', ea: 'ea', carton: 'cartons', canister: 'canisters', container: 'containers', syringe: 'syringes', pouch: 'pouches', sleeve: 'sleeves', sheet: 'sheets', bracket: 'brackets', wire: 'wires', strip: 'strips', disc: 'discs', cartridge: 'cartridges', tip: 'tips', unit: 'units', gallon: 'gallons', bundle: 'bundles', pair: 'pairs', spool: 'spools', vial: 'vials', can: 'cans', cup: 'cups', jar: 'jars', pad: 'pads', piece: 'pieces', pc: 'pcs', dozen: 'dozen' };

function dataUrlToBlob(d) {
  const m = String(d).match(/^data:([^;,]+)(;base64)?,/); const body = String(d).slice(String(d).indexOf(',') + 1);
  const bin = m && m[2] ? atob(body) : decodeURIComponent(body); const u = new Uint8Array(bin.length);

}

const CAT_MIGRATION = {

const CAT_BY_ID = Object.fromEntries(CATEGORIES.map(c => [c.id, c]));

/* ---------- order lines ---------- */
/* what one order line cost: its stamped lineTotal (qty × price − discount), else price × qty for older orders */
function orderItemCost(oi) {
  if (oi.lineTotal != null && isFinite(oi.lineTotal)) return Number(oi.lineTotal);
  return (Number(oi.price) || 0) * (Number(oi.slipQty) || Number(oi.qty) || 0);
}
function orderSubtotal(o) { return (o && Array.isArray(o.items) ? o.items : listOf(o && o.items)).reduce((s, oi) => s + (oi ? orderItemCost(oi) : 0), 0); }
/* what the order came to, with its discount, tax and shipping when they were entered */
function orderTotal(o) {
  if (!o) return 0;
  const ship = num(o.invoiceShipping != null ? o.invoiceShipping : o.shipping), tax = num(o.invoiceTaxes), disc = num(o.discount);
  return round2(orderSubtotal(o) - disc + tax + ship) || 0;
}
/* the category of an order line that isn't tied to a supply (quick-order brackets and elastomerics) */
function lineCat(oi) {
  if (oi && oi.cat) return oi.cat;
  const sku = (oi && oi.sku) || '';
  if (/^AO-BRACKET/.test(sku)) return 'brackets-tubes';
  if (/^(854|000)-/.test(String(sku))) return 'elastics';
  return 'misc';
}
/* a price from the shared quick-order price memory (nlo/elastoPrices) */
function getElastoPrice(map, sku) {
  if (!map || !sku) return null;
  const v = map[fbKey(sku)];
  if (v && typeof v.price === 'number') return v.price;
  if (typeof v === 'number') return v;
  return null;
}

/* ---------- receipts ---------- */
/* Recorded-only: the dollars stamped on the entry when it was received. No stamp counts as $0 — never price × quantity. */
function receiveEntryAmount(entry) {
  if (entry && entry.amount != null && isFinite(entry.amount)) return Number(entry.amount);
  return 0;
}

/* ---------- the activity log (nlo/log) ----------
   Kept newest first. Receipts, shipping and tax (what the budget is built from) outrank everything else when it's trimmed. */
const LOG_CAP = 450;
const LOG_MONEY_KEEP = 300;
function logTime(e) { const t = e && e.date ? Date.parse(e.date) : NaN; return isNaN(t) ? 0 : t; }
function sortLogNewestFirst(list) {
  return (Array.isArray(list) ? list : []).filter(Boolean).slice().sort((a, b) => {
    const d = logTime(b) - logTime(a); if (d) return d;
    const ia = String(a.id || ''), ib = String(b.id || ''); return ia < ib ? 1 : ia > ib ? -1 : 0;
  });
}
function isMoneyEntry(e) { return !!e && (e.type === 'receive' || e.type === 'shipping' || e.type === 'tax'); }
/* which entries to keep (newest first): never drops more than ~40% in one go */
function pruneLog(list) {
  const sorted = sortLogNewestFirst(list);
  const cap = Math.max(LOG_CAP, Math.ceil(sorted.length * 0.6));
  if (sorted.length <= cap) return sorted;
  const keep = new Array(sorted.length); let money = 0, i;
  for (i = 0; i < sorted.length && money < LOG_MONEY_KEEP; i++) if (isMoneyEntry(sorted[i])) { keep[i] = true; money++; }
  let room = cap - money;
  for (i = 0; i < sorted.length && room > 0; i++) if (!keep[i]) { keep[i] = true; room--; }
  return sorted.filter((e, k) => keep[k]);
}

/* ---------- spend ---------- */
function budgetCat(cat) { return catOf(cat && cat !== 'all' ? cat : 'misc'); }
function spendIndex(items, orders) {
  const itemById = {}, orderById = {};
  (items || []).forEach(i => { if (i && i.id != null) itemById[i.id] = i; });
  (orders || []).forEach(o => { if (o && o.id != null) orderById[o.id] = o; });
  return { itemById, orderById };
}
function entryCat(entry, idx) {
  const it = idx.itemById[entry.itemId];
  if (it) return budgetCat(it.cat);
  const id = String(entry.itemId || '');
  if (/^elasto-/.test(id)) return 'elastics';
  if (/^bracket-/.test(id)) return 'brackets-tubes';
  const o = entry.orderId ? idx.orderById[entry.orderId] : null;
  const oi = o && Array.isArray(o.items) ? o.items.find(x => x && x.itemId === entry.itemId) : null;
  return budgetCat(oi ? lineCat(oi) : 'misc');
}
/* everything spent between two Dates: { auto: {cat: $}, manual: {cat: $}, shipping, tax, total } */
function spendBetween(start, end, log, orders, expenses, idx) {
  const auto = {}, manual = {}; let shipping = 0, tax = 0, total = 0;
  const inRange = d => d instanceof Date && !isNaN(d.getTime()) && d >= start && d <= end;
  function add(bucket, cat, amt) { if (!amt || !isFinite(amt) || cat === 'lab-3d') return; bucket[cat] = (bucket[cat] || 0) + amt; total += amt; }
  (log || []).forEach(e => {
    if (!e || !inRange(new Date(e.date))) return;
    if (e.type === 'receive') add(auto, entryCat(e, idx), receiveEntryAmount(e));
    else if (e.type === 'shipping') { const sh = Number(e.amount) || 0; shipping += sh; total += sh; }
    else if (e.type === 'tax') { const tx = Number(e.amount) || 0; tax += tx; total += tx; }
  });
  /* order lines not tied to any supply never reach the log — counted here */
  (orders || []).forEach(o => {
    if (!o || o.status !== 'received' || !o.dateReceived || !inRange(new Date(o.dateReceived))) return;
    listOf(o.items).forEach(oi => { if (!oi || oi.itemId) return; const amt = orderItemCost(oi); if (amt > 0) add(auto, budgetCat(lineCat(oi)), amt); });
  });
  (expenses || []).forEach(x => { if (!x || !inRange(parseDateLocal(x.date))) return; add(manual, budgetCat(x.category), parseFloat(x.amount) || 0); });
  return { auto, manual, shipping, tax, total };
}
function monthSpend(key, D) { return spendBetween(monthStart(key), monthEnd(key), D.log, D.orders, D.expenses ? listOf(D.expenses) : (D.budget && listOf(D.budget.expenses)) || [], spendIndex(D.items, D.orders)); }
/* the oldest month the log still fully covers (older months may be missing receipts that were trimmed) */
function logCoversFrom(log) {
  const money = (log || []).filter(isMoneyEntry);
  if (money.length < LOG_MONEY_KEEP - 10) return '';
  const oldest = money.reduce((m, e) => Math.min(m, logTime(e) || Infinity), Infinity);
  return isFinite(oldest) ? shiftMonth(monthKey(oldest), 1) : '';
}

/* =====================================================================
   Units — what a supply is counted in, and what it's bought in.
   - item.unit is what's counted on the shelf and what item.qty is in (box).
     Every price in item.sources[] is per that unit, as it always was.
   - item.buyUnit + item.perBuy say it's bought bigger: gloves are counted
     in boxes and bought by the case of 10 (buyUnit 'case', perBuy 10).
   - The cart and orders work in what's bought (2 cases at the case price);
     receiving 2 cases adds 20 boxes. A line says so itself: line.unit is
     the unit it was ordered in and line.per how many counted units each
     holds (missing on older lines = 1).
   - baseUnitName / orderUnitName / baseUnitsPerOrderUnit (pieces in a box)
     are shown for price-per-piece only and never change a quantity.
   ===================================================================== */
function countUnit(item) { return String((item && item.unit) || 'ea').trim() || 'ea'; }
function perBuy(item) { const n = Number(item && item.perBuy); return item && item.buyUnit && n > 1 ? n : 1; }
function buyUnit(item) { return perBuy(item) > 1 ? String(item.buyUnit).trim() : countUnit(item); }
function buysBigger(item) { return perBuy(item) > 1; }
/* "Case of 10 boxes" */
function buyLabel(item) { return buysBigger(item) ? cap1(buyUnit(item)) + ' of ' + qtyUnit(perBuy(item), countUnit(item)) : cap1(countUnit(item)); }
function cap1(s) { s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); }

/* every vendor that sells it, first = the usual one. A source is { vendor, sku, price (per counted unit), src (product or shop URL) };
   the oldest items carry one flat source (item.src / item.sku / item.price) instead. */
function allSources(item) {
  if (!item) return [];
  if (item.sources) { const arr = listOf(item.sources).filter(Boolean); if (arr.length) return arr; }
  if (item.src || item.price != null || item.sku) return [{ vendor: vendorFromSrc(item.src), sku: item.sku || '', price: item.price != null ? item.price : null, src: item.src || null }];
  return [];
}
function primarySource(item) { return allSources(item)[0] || null; }
function sourceFor(item, vendor) {
  const all = allSources(item); if (!vendor) return all[0] || null;
  return all.find(s => s.vendor === vendor) || all.find(s => vendorNamesSimilar(s.vendor, vendor)) || all[0] || null;
}
/* price per counted unit (box) from a source */
function countPrice(src) { const p = parseFloat(src && src.price); return isFinite(p) && p > 0 ? p : null; }
/* price per bought unit (case) */
function buyPriceOf(item, src) { const p = countPrice(src || primarySource(item)); return p == null ? null : round2(p * perBuy(item)); }
/* the cheapest vendor's price per counted unit, for "cheaper at …" hints */
function cheapestSource(item) { return allSources(item).filter(s => countPrice(s) != null).sort((a, b) => countPrice(a) - countPrice(b))[0] || null; }

/* a cart or order line: how many counted units it adds to stock */
function linePer(line) { const n = Number(line && line.per); return n > 1 ? n : 1; }
function lineStockDelta(line, qty) { return (qty == null ? Number(line && line.qty) || 0 : Number(qty) || 0) * linePer(line); }
/* "2 cases" / "2 cases (20 boxes)" */
function lineQtyLabel(line, withCount) {
  const q = Number(line && line.qty) || 0, u = (line && line.unit) || 'ea';
  let s = qtyUnit(q, u);
  if (withCount && linePer(line) > 1) s += ' (' + qtyUnit(q * linePer(line), line.countUnit || 'ea') + ')';
  return s;
}
/* price per piece, for display only ("$0.09 a glove") */
function perPieceLabel(item, countUnitPrice) {
  const n = Number(item && item.baseUnitsPerOrderUnit), base = item && item.baseUnitName;
  if (!(n > 1) || !base || countUnitPrice == null) return '';
  const unitIsOrder = !item.orderUnitName || String(item.orderUnitName).toLowerCase() === countUnit(item).toLowerCase();
  if (!unitIsOrder) return '';
  const each = countUnitPrice / n;
  return (each < 0.1 ? '$' + each.toFixed(3) : money(each)) + ' per ' + String(base).toLowerCase();
}

/* ---------- vendors (ported from Inventory 3.0.1) ---------- */
function vendorFromSrc(src) {
  if (!src) return null; src = String(src);
  if (src.includes('americanortho')) return 'American Orthodontics';
  if (src.includes('sunsurgical')) return 'SunSurgical';
  if (src.includes('patterson')) return 'Patterson Dental';
  if (src.includes('reliance')) return 'Reliance Orthodontics';
  if (src.includes('ormco')) return 'Ormco';
  if (src.includes('henryschein')) return 'Henry Schein';
  if (src.includes('komet')) return 'Komet USA';
  if (src.includes('zendura')) return 'ZenduraDental';
  if (src.includes('amazon')) return 'Amazon Business';
  return null;
}
/* Vendor-name similarity that understands abbreviations: "AO" matches "American Orthodontics", "HSD" matches "Henry Schein Dental",
   plus containment and a shared real word ("schein"). */
const VENDOR_STOP_WORDS = { the: 1, inc: 1, llc: 1, co: 1, corp: 1, company: 1, usa: 1, dental: 1, ortho: 1, orthodontic: 1, orthodontics: 1, supply: 1, supplies: 1, products: 1, lab: 1, labs: 1 };
function vendorNamesSimilar(a, b) {
  const an = String(a || '').toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
  const bn = String(b || '').toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
  if (!an || !bn) return false;
  if (an === bn || an.indexOf(bn) !== -1 || bn.indexOf(an) !== -1) return true;
  if (an.replace(/ /g, '') === bn.replace(/ /g, '')) return true;

/* =====================================================================
   Firebase: the NLO Cases project (Firestore). Sign-in is NLO Cases'
   (same people, same passwords); nothing is sealed — Inventory holds no
   patient data. The rules (../nlo-cases-src/firestore.rules, "NLO
   Inventory") decide who reads and changes what.
   - one record a supply, an order, a vendor, an expense bought outside
     an order (invItems, invOrders, invVendors, invExpenses); the shared
     cart, the budget amounts, the quick-order prices, the bracket order
     and the settings each one record (invState/…); the activity log one
     record per person per month (invLog/m<YYYY-MM>~<staff id>; the moved
     entries under ~old), entries only ever added
   - every save carries who (upBy, the staff id) and when (up, the
     database's time) and moves the change counter (invState/rev) the
     alert script watches — all in the same save. The rules check the
     names on the steps too: a log entry is whoever's record it's in, an
     order's newest trail step and an expense are the saver's
   - stock counts and the cart change in transactions (two computers at
     once both count); receiving and reopening claim the order first
   - photos are records of their own (invPics), read when shown
   The demo (demo.js) answers the same calls on made-up data.
   ===================================================================== */
const PIC_MAX = 990000;   // a photo's base64 (the rules allow 1,000,000)
const LOG_MONTHS = 36;    // months of the activity log kept open on the page
const FB = {
  emu: false, cfg: null, app: null, auth: null, db: null,
  me: null, unsubs: [], pending: 0, onSync: null, h: null, alertsOn: false, pushOn: false, picCache: new Map(),

  ts() { return firebase.firestore.FieldValue.serverTimestamp(); },
  inc(n) { return firebase.firestore.FieldValue.increment(n); },
  del() { return firebase.firestore.FieldValue.delete(); },
  tsMs(t) { return t && t.toMillis ? t.toMillis() : (typeof t === 'number' ? t : 0); },
  isOwner() { return !!(FB.me && FB.me.role === 'owner'); },
  isPerm(e) { return /permission/i.test((e && (e.code || e.message)) || ''); },
  isNet(e) { return /unavailable|network|offline|timeout|deadline/i.test((e && (e.code || e.message)) || ''); },
  available() { return typeof firebase !== 'undefined' && !!firebase.initializeApp && !!firebase.firestore; },
  configured() { return FB.emu || FB_CONFIG.apiKey.indexOf('__') !== 0; },
  init(emu) {
    FB.emu = !!emu;
    FB.cfg = FB.emu ? { apiKey: 'demo-key', authDomain: 'localhost', projectId: 'demo-nlo-cases', appId: 'demo' } : FB_CONFIG;
    if (!FB.available() || !FB.configured()) return false;
    // its own named app: NLO Cases' and Time Off's sign-ins on this computer are never touched
    try { FB.app = firebase.app('inv'); } catch (e) { FB.app = firebase.initializeApp(FB.cfg, 'inv'); }
    FB.auth = FB.app.auth(); FB.db = FB.app.firestore();
    if (FB.emu) { FB.auth.useEmulator('http://127.0.0.1:9099', { disableWarnings: true }); FB.db.useEmulator('127.0.0.1', 8080); }
    return true;
  },
  /* never a session across reloads (as NLO Cases): a reload, or the lock, means signing in again */
  async ready() { try { await FB.auth.setPersistence(firebase.auth.Auth.Persistence.NONE); } catch (e) { } },
  busy(n) { FB.pending += n; if (FB.onSync) FB.onSync(); },
  track(p) { FB.busy(1); return Promise.resolve(p).finally(() => FB.busy(-1)); },

  /* ---------- signing in (same logins as NLO Cases) ---------- */
  async emailFor(login) {
    const s = String(login || '').trim();
    if (s.includes('@')) return s.toLowerCase();
    const un = slug(s); if (!un) throw errCode('no-user');
    const snap = await FB.db.doc('logins/' + un).get();
    if (!snap.exists) throw errCode('no-user');
    return snap.data().email;
  },
  async signIn(login, pw) {
    const email = await FB.emailFor(login);
    const cred = await FB.auth.signInWithEmailAndPassword(email, pw);
    return FB.loadMe(cred.user);
  },
  async loadMe(user) {
    const ms = await FB.db.doc('members/' + user.uid).get();
    if (!ms.exists) { await FB.signOut(); throw errCode('not-member'); }
    const m = ms.data();
    if (m.active !== true) { await FB.signOut(); throw errCode('inactive'); }
    if (m.mustSetup) { await FB.signOut(); throw errCode('first-login'); }
    FB.me = { uid: user.uid, staffId: String(m.staffId || ''), role: m.role === 'owner' ? 'owner' : 'staff', name: String(m.name || ''), email: String(user.email || '') };
    FB.db.doc('members/' + user.uid).update({ lastLogin: FB.ts() }).catch(() => { });
    return FB.me;
  },
  async signOut() { FB.stop(); FB.me = null; FB.alertsOn = false; FB.pushOn = false; FB.picCache = new Map(); FB.mlCache = null; FB.mlUnsubs = null; try { await FB.auth.signOut(); } catch (e) { } },
  sendReset(email) { return FB.auth.sendPasswordResetEmail(String(email || '').trim()); },

  /* ---------- opening: 'rules' (the database's rules don't know Inventory yet) | 'move' (Dr. A: nothing moved over yet) |
     'notyet' (staff: not moved over yet) | 'ready' ---------- */
  async open() {
    try { await FB.db.doc('meta/rules_inv_1').get(); } catch (e) { if (FB.isPerm(e)) return { st: 'rules' }; throw e; }
    const mv = await FB.db.doc('invMeta/moved').get();
    if (!mv.exists) return { st: FB.isOwner() ? 'move' : 'notyet' };
    const d = mv.data() || {};
    return { st: 'ready', moved: { at: FB.tsMs(d.up) || Number(d.at) || 0, by: d.by || '', counts: d.counts || {} } };

  /* ---------- Mari's List (marislist.js): the office's member prices — everyone signed in reads them, Dr. A loads them ----------

    const u1 = FB.db.doc('invMl/info').onSnapshot(s => { h.data('mlOff', false); h.data('mlInfo', s.exists ? FB.plain(s) : null); }, off);
    const u2 = FB.db.doc('invMl/match').onSnapshot(s => h.data('mlMatch', s.exists ? (FB.plain(s).m || {}) : {}), off);

  mlRows(info) {
