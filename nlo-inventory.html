  stop() { FB.unsubs.forEach(u => { try { u(); } catch (e) { } }); FB.unsubs = []; },

  /* ---------- writing ---------- */
  st() { return { up: FB.ts(), upBy: FB.me.staffId }; },
  /* the change counter, in the same save (a batch or a transaction) */
  bump(w) { w.set(FB.db.doc('invState/rev'), Object.assign({ n: FB.inc(1) }, FB.st()), { merge: true }); },
  save(build) { const b = FB.db.batch(); build(b); FB.bump(b); return FB.track(b.commit()); },
  /* fn(t) reads, then writes and returns what it wants back; returning FB.SKIP (or anything with skip: true) writes nothing */
  SKIP: { skip: true },
  /* (a transaction needs the database itself: with no internet it says so at once, and a very slow one is reported, not waited
     out — the error's .late is the transaction itself, for a step that has to finish its work if it goes through after all) */
  txn(fn) {
    if (typeof navigator !== 'undefined' && navigator.onLine === false) return Promise.reject(errCode('unavailable', 'Can’t reach the database. Check the internet connection.'));
    const run = FB.db.runTransaction(async t => { const r = await fn(t); if (!(r && r.skip === true)) FB.bump(t); return r; });
    run.catch(() => { });
    let timer;
    const slow = new Promise((res, rej) => { timer = setTimeout(() => { const e = errCode('timeout'); e.late = run; rej(e); }, FB.TXN_MS); });
    return FB.track(Promise.race([run, slow]).finally(() => clearTimeout(timer)));

  TXN_MS: 30000,
  /* what the database takes: no undefined, no NaN, no nulls kept (as the old database dropped them), no list inside a list */
  clean(v) {
    if (v === undefined) return null;
    const tidy = x => {
      if (x == null) return null;
      if (Array.isArray(x)) return x.filter(y => y != null).map(y => Array.isArray(y) ? Object.assign({}, y.map(tidy)) : tidy(y));
      if (typeof x === 'object') { const o = {}; Object.keys(x).forEach(k => { const c = tidy(x[k]); if (c != null) o[k] = c; }); return o; }
      if (typeof x === 'number' && !isFinite(x)) return null;
      return x;
    };
    return tidy(JSON.parse(JSON.stringify(v)));
  },
  /* a patch, the old database's way: each top-level field replaced as a whole, a null one removed, nothing else touched */
  patchOf(patch) { const o = {}; Object.keys(patch || {}).forEach(k => { const v = patch[k] === undefined ? null : FB.clean(patch[k]); o[k] = v == null ? FB.del() : v; }); return o; },
  setPatch(w, ref, patch, extra) {
    const data = Object.assign(FB.patchOf(patch), extra || {}, FB.st());

  },
  itemRef(id) { return FB.db.doc('invItems/' + id); },
  orderRef(id) { return FB.db.doc('invOrders/' + id); },
  vendorRef(id) { return FB.db.doc('invVendors/' + id); },
  logRef(mon, who) { return FB.db.doc('invLog/m' + mon + '~' + who); },
  logMonth(e) { const k = monthKey(e && e.date); return /^\d{4}-\d{2}$/.test(k) ? k : monthKey(Date.now()); },

  /* add (or take away) stock without overwriting what another computer just did */
  addStock(itemId, delta) {
    return FB.txn(async t => {
      const ref = FB.itemRef(itemId), s = await t.get(ref);
      if (!s.exists) throw errCode('not-found', 'That supply is gone.');
      const qty = Math.max(0, Math.round(((Number(s.data().qty) || 0) + delta) * 1000) / 1000);
      t.update(ref, Object.assign({ qty }, FB.st()));
      return qty;
    });
  },
  /* several supplies' stock in one step (receiving or reopening an order): [[itemId, delta], …]; a supply that's gone is skipped */
  addStockMany(pairs) {
    const sum = {}; (pairs || []).forEach(([id, d]) => { if (id && Number(d)) sum[id] = (sum[id] || 0) + Number(d); });
    const ids = Object.keys(sum); if (!ids.length) return Promise.resolve({});
    return FB.txn(async t => {
      const snaps = await Promise.all(ids.map(id => t.get(FB.itemRef(id)))), out = {};
      snaps.forEach((s, k) => {
        if (!s.exists) { console.warn('stock: supply gone', ids[k]); return; }
        out[ids[k]] = Math.max(0, Math.round(((Number(s.data().qty) || 0) + sum[ids[k]]) * 1000) / 1000);
        t.update(FB.itemRef(ids[k]), Object.assign({ qty: out[ids[k]] }, FB.st()));
      });
      return Object.keys(out).length ? out : FB.SKIP;
    });
  },
  /* several supplies' details in one save: [[itemId, patch], …] */
  patchItems(list) {
    list = (list || []).filter(x => x && x[0]); if (!list.length) return Promise.resolve();
    return FB.save(b => list.forEach(([id, patch]) => FB.setPatch(b, FB.itemRef(id), patch)));
  },
  setStock(itemId, qty) { return FB.save(b => b.update(FB.itemRef(itemId), Object.assign({ qty }, FB.st()))); },
  patchItem(id, patch) { return FB.save(b => FB.setPatch(b, FB.itemRef(id), patch)); },
  putItem(item) { return FB.save(b => b.set(FB.itemRef(item.id), Object.assign(FB.clean(item), FB.st()))); },
  patchOrder(id, patch) { return FB.save(b => FB.setPatch(b, FB.orderRef(id), patch)); },
  putOrder(o) { return FB.save(b => b.set(FB.orderRef(o.id), Object.assign(FB.clean(o), FB.st()))); },
  /* an order's status, in one step: fn(current) gives the new one, or undefined to leave it (then this fails 'aborted');
     patchFn(the order as it is now) gives what else changes with it (a receipt, a reopen), in the same step */
  claimOrder(id, fn, patchFn) {
    return FB.txn(async t => {
      const ref = FB.orderRef(id), s = await t.get(ref), cur = s.exists ? s.data() : null;
      const next = cur ? fn(cur.status) : undefined;
      if (next === undefined) throw errCode('aborted', 'That change didn’t go through. Try again.');
      t.update(ref, Object.assign(patchFn ? FB.patchOf(patchFn(Object.assign({}, cur))) : {}, { status: next }, FB.st()));
      return next;
    });
  },
  /* an order changed in one step from what the database has now: fn(the order now) → the patch (a step on its trail made
     from the trail as it is), or undefined when it no longer applies (then this fails 'aborted') */
  orderStep(id, fn) {
    return FB.txn(async t => {
      const ref = FB.orderRef(id), s = await t.get(ref);
      if (!s.exists) throw errCode('not-found', 'That order is gone.');
      const p = fn(Object.assign({}, s.data()));
      if (p === undefined) throw errCode('aborted', 'That order just changed on another computer. Look at it again.');
      t.update(ref, Object.assign(FB.patchOf(p), FB.st()));
      return p;
    });
  },
  /* a receipt or a reopen, all in one step — it all happens, or none of it:
     claim(the order now) → the order's patch, status included, or undefined when it can't (fails 'aborted'); claimId marks
     the order as this step's, so if its reply is lost and the step is tried again, it finds itself done ({ skip, mine });
     o.stock { itemId: delta } (a supply that's gone is skipped), o.items(itemId, the supply now) → more for that supply,
     o.log entries for the signed-in person's log record, o.orders new orders (a backorder) */
  book(id, claimId, claim, o) {
    o = o || {};
    return FB.txn(async t => {
      const ref = FB.orderRef(id), s = await t.get(ref), cur = s.exists ? s.data() : null;
      if (cur && claimId && cur.claim === claimId) return { skip: true, mine: true };
      const p = cur ? claim(Object.assign({}, cur)) : undefined;
      if (p === undefined) throw errCode('aborted', 'That change didn’t go through. Try again.');
      const ids = Object.keys(o.stock || {}).filter(k => k && Number(o.stock[k]));
      const snaps = await Promise.all(ids.map(k => t.get(FB.itemRef(k))));
      t.update(ref, Object.assign(FB.patchOf(p), claimId ? { claim: claimId } : {}, FB.st()));
      snaps.forEach((sn, k) => {
        if (!sn.exists) { console.warn('stock: supply gone', ids[k]); return; }
        const it = sn.data(), qty = Math.max(0, Math.round(((Number(it.qty) || 0) + Number(o.stock[ids[k]])) * 1000) / 1000);
        const more = o.items ? o.items(ids[k], Object.assign({}, it)) : null;
        t.update(FB.itemRef(ids[k]), Object.assign(FB.patchOf(more || {}), { qty }, FB.st()));
      });
      const who = FB.me.staffId, months = {};
      (o.log || []).filter(Boolean).forEach(e => { const m = FB.logMonth(e); (months[m] = months[m] || {})[e.id] = FB.clean(Object.assign({}, e, { byId: who })); });
      Object.keys(months).forEach(m => t.set(FB.logRef(m, who), Object.assign({ e: months[m], mon: m, who }, FB.st()), { merge: true }));
      (o.orders || []).forEach(n => t.set(FB.orderRef(n.id), Object.assign(FB.clean(n), FB.st())));
      return { done: true };
    });
  },
  putVendor(v) { return FB.save(b => b.set(FB.vendorRef(v.id), Object.assign(FB.clean(v), FB.st()))); },
  /* a built-in vendor has no record until something about it is saved: this makes one */
  patchVendor(id, patch) { return FB.save(b => FB.setPatch(b, FB.vendorRef(id), patch, { id })); },
  /* the cart is one list everyone shares: every change is made to the latest copy. fn(lines, ok, also) gets the lines and
     Dr. A's OKs (by line id) and returns the lines; only he adds to or changes ok (the rules hold everyone else to that), and an
     OK whose line is gone (ordered, taken out) comes off with it. also.orders: orders saved in the same step (placing one) */
  cart(fn) {
    return FB.txn(async t => {
      const ref = FB.db.doc('invState/cart'), s = await t.get(ref), d = s.exists ? s.data() : {};
      const ok = Object.assign({}, d.ok && typeof d.ok === 'object' ? d.ok : {}), also = {};
      const next = fn(listOf(d.lines).map(x => withLineId(Object.assign({}, x))), ok, also);
      if (next === undefined) return FB.SKIP;
      const list = listOf(next), live = new Set(list.map(c => c && c.lineId).filter(Boolean));
      Object.keys(ok).forEach(k => { if (!live.has(k)) delete ok[k]; });
      t.set(ref, Object.assign({ lines: FB.clean(list) || [], ok: FB.clean(ok) || {} }, FB.st()));
      (also.orders || []).forEach(o => t.set(FB.orderRef(o.id), Object.assign(FB.clean(o), FB.st())));
      return next;
    });
  },

  /* a photo: a record of its own (read when it's shown); the item or order keeps "pic:<id>" */

  /* ---------- Dr. A: the alert script's own login (a new one each time; the one before keeps working until the new copy runs) ---------- */
  async makeBot() {
    if (!FB.isOwner()) throw errCode('permission');
    const email = 'inv-alerts-' + hexId(6) + '@' + STAFF_DOMAIN, password = randomPassword();
    const tmp = firebase.initializeApp(FB.cfg, 'invBot' + hexId(4));
    let uid;
    try {
      if (FB.emu) tmp.auth().useEmulator('http://127.0.0.1:9099', { disableWarnings: true });
      await tmp.auth().setPersistence(firebase.auth.Auth.Persistence.NONE);
      uid = (await FB.track(tmp.auth().createUserWithEmailAndPassword(email, password))).user.uid;
      await tmp.auth().signOut();
    } finally { tmp.delete().catch(() => { }); }

/* =====================================================================
   Who's signed in.
   Each person signs in with their own NLO Cases login (same username and
   password as NLO Cases, Time Off and the Time Clock; Amir, 16 Oct 2026:
   "use the same logins and logout after 10 mins same rules"). The page
   locks after the office's idle minutes (NLO Cases → Team & security,
   10 by default), and every cart, order, receiving and stock step is
   stamped with the person signed in and the time.
   Names and photos come from NLO Cases' roster. Records from before the
   move carry Staff Hub's ids (s_sarah…): a roster entry linked to Staff
   Hub (rid) answers to both.
   Only Dr. A sees everything and OKs the cart (Amir, 16 Oct 2026: "for
   assistants, the budget vendor and setting are not needed. keep at
   simple as possible. they will just need to look up inventory, add
   items to the cart and if I approve them, they can place order").
   Everyone else gets the simple view (isAdmin() is Dr. A).
   ===================================================================== */
/* "Pat L.", "Dr. A" — how a name shows on a stamp (the old app's short names looked the same) */
function shortName(name) {
  const n = String(name || '').replace(/\([^)]*\)/g, ' ').replace(/\s+/g, ' ').trim(); if (!n) return '';
  const p = n.split(' ');
  if (/^dr\.?$/i.test(p[0])) return p.length > 1 ? 'Dr. ' + p[p.length - 1][0].toUpperCase() : 'Dr.';
  return p.length > 1 ? p[0] + ' ' + p[p.length - 1][0].toUpperCase() + '.' : p[0];
}
/* NLO Cases' roster → { id (staff id), rid (Staff Hub id), name, short, title, photo, role, active }, current people first, Dr. A first */
function rosterPeople(list) {
  return listOf(list).filter(r => r && r.sid && r.name).map(r => ({
    id: String(r.sid), rid: typeof r.rid === 'string' && r.rid !== '-' ? r.rid : '', name: String(r.name), short: r.role === 'owner' ? 'Dr. A' : shortName(r.name),
    title: r.role === 'owner' ? 'Orthodontist / Owner' : '', role: r.role === 'owner' ? 'owner' : 'staff', active: r.active === true,
    photo: typeof r.photo === 'string' && /^data:image\/(jpeg|png|webp);base64,/.test(r.photo) ? r.photo : ''
  })).sort((a, b) => (b.active - a.active) || (a.role === 'owner' ? -1 : b.role === 'owner' ? 1 : a.name.localeCompare(b.name)));
}
const activePeople = () => (S.people || []).filter(p => p.active);
/* the person behind an id on a record: today's staff id, or a Staff Hub id on records from before the move */
function personById(id) { if (!id) return null; return (S.people || []).find(p => p.id === id) || (S.people || []).find(p => p.rid && p.rid === id) || null; }
/* the name shown on a stamp: the person behind its id as NLO Cases knows them today (the database checks the ids on the log,
   orders and expenses), else the name stamped (an old record, or someone no longer on the team) */
function stampName(by, byId) { const p = byId && personById(byId); return p ? p.short : String(by || ''); }
/* the person behind a stamped name on an old record (a short name such as "Pat L.") */
function personByName(name) {
  const n = String(name || '').trim().toLowerCase(); if (!n) return null;
  return (S.people || []).find(p => p.short.toLowerCase() === n || p.name.toLowerCase() === n) ||
    (S.people || []).find(p => firstName(p.name).toLowerCase() === firstName(n).toLowerCase() && n.split(/\s+/).length === 1) || null;
}
function avatarHTML(name, cls, id) {
  const p = (id && personById(id)) || personByName(name);
  const label = (p && p.name) || name || '';
  if (p && p.photo) return '<span class="av ' + (cls || '') + '" title="' + esc(label) + '"><img data-src="' + esc(p.photo) + '" alt=""></span>';
  return '<span class="av ' + (cls || '') + '" style="background:' + avColor(label) + '" title="' + esc(label) + '">' + esc(initials(label)) + '</span>';
}
function avColor(n) { const C = ['#385686', '#1D3EA9', '#1F9E7E', '#C2820A', '#D8412E', '#7A5AC8', '#1A8FB0', '#B4304E']; let h = 0; String(n || '').split('').forEach(c => { h = (h * 31 + c.charCodeAt(0)) >>> 0; }); return C[h % C.length]; }

/* ---------- the person signed in ---------- */
function whoNow() {
  const me = B && B.me; if (!me) return null;
  const p = personById(me.staffId);
  const name = (p && p.name) || me.name || 'Someone';
  return { id: me.staffId, short: me.role === 'owner' ? 'Dr. A' : shortName(name), name, owner: me.role === 'owner' };
}
/* the name an email or a text to a vendor is signed with: Dr. A as the doctor — his roster name with "Dr." in front, his full
   name rather than his first (Amir, 17 Oct 2026: "I see my name is -Amir in the emails", asking for "Dr." and his full name,
   his last name, or "even Dr. A"); everyone else by first name */
function signName(w) {
  if (!w) return '';
  if (!w.owner) return firstName(w.name);
  const n = String(w.name || '').trim().replace(/^dr\.?\s+/i, '');
  return n.split(/\s+/).length > 1 ? 'Dr. ' + n : 'Dr. A';
}
/* a record stamped by the person signed in (old records carry Staff Hub's id for them) */
function isMine(id) { const w = whoNow(), p = id && personById(id); return !!(w && p && p.id === w.id); }

function stamp() { const w = whoNow(); return { by: w ? w.short : 'Office', byId: w ? w.id : '', at: nowISO() }; }

function withWho(fn) { const w = whoNow(); if (!w) return toast('Sign in first.', { bad: true }); return fn(w); }
function isOwnerAccount() { return !!(B && B.isOwner && B.isOwner()); }

function isAdmin() { return isOwnerAccount(); }
function adminNames() { return 'Dr. A'; }

function toast(msg, opt) {

  el.innerHTML = esc(msg) + (opt.action ? ' <button class="linkBtn" style="color:var(--mint);margin-left:10px;pointer-events:auto">' + esc(opt.action) + '</button>' : '');
  if (opt.action) el.querySelector('button').onclick = () => { opt.onAction(); el.remove(); };

function errText(e) {
  const c = String((e && (e.code || e.message)) || '');
  if (/no-user/.test(c)) return 'No login with that username.';
  if (/invalid-credential|wrong-password|user-not-found|invalid-login|invalid-email/.test(c)) return 'Username or password is incorrect.';
  if (/inactive/.test(c)) return 'This login has been turned off. Ask Dr. A.';
  if (/not-member/.test(c)) return 'That account isn’t part of the office.';
  if (/first-login/.test(c)) return 'Finish setting up your login in NLO Cases first (sign in there with your temporary password and choose your own), then come back.';
  if (/too-many-requests/.test(c)) return 'Too many attempts. Wait a minute and try again.';
  if (/PERMISSION_DENIED|permission/i.test(c)) return 'The database said no. This login may not be allowed to change that.';
  if (/network|unavailable|offline/i.test(c)) return 'Can’t reach the database. Check the internet connection.';
  if (/popup-closed|cancelled-popup/i.test(c)) return 'The sign-in window closed before it finished.';
  if (/popup-blocked/i.test(c)) return 'The browser blocked the sign-in window. Allow pop-ups for this page and try again.';
  if (/^timeout$/.test(c)) return 'Not confirmed: the internet is very slow. Check in a minute whether it went through before trying again.';
  if (/^aborted$|failed-precondition/.test(c)) return (e && e.message && !/^\w+$/.test(e.message)) ? e.message : 'Someone changed that at the same moment. Try again.';
  return (e && e.message) ? String(e.message).replace(/^Firebase:\s*/, '') : 'Something went wrong.';
}

    const mins = idleMinutes(), waiting = (B && B.pending > 0) || S.busy;
    if (Date.now() - S.lastAct > mins * 60000 + (waiting ? IDLE_GRACE_MS : 0))

/* ---------- the old database (read only) ----------
   Its own Google sign-in, kept only while this page is open (never on the computer): it's closed after the move, and a lock
   or a reload ends it. (NLO Cases' "Connect to the office roster" sign-in on this computer is a different one, untouched.) */
const OLD = {
  auth: null,
  init() {
    if (OLD.auth) return true;
    if (typeof firebase === 'undefined' || !firebase.auth) return false;
    const cfg = S.emu ? { apiKey: 'demo-key', authDomain: 'localhost', projectId: 'demo-nlo-cases', appId: 'demo' } : OLD_FB;
    const app = firebase.apps.find(a => a && a.name === 'invMove') || firebase.initializeApp(cfg, 'invMove');
    OLD.auth = app.auth();
    if (S.emu) OLD.auth.useEmulator('http://127.0.0.1:9099', { disableWarnings: true });
    OLD.auth.setPersistence(firebase.auth.Auth.Persistence.NONE).catch(() => { });
    return true;
  },
  async user() { if (!OLD.init()) return null; return OLD.auth.currentUser || null; },
  /* straight from the click (a sign-in window may only open from one) */
  connect() {
    if (!OLD.init()) return Promise.reject(errCode('unavailable', 'Not available in this browser.'));
    if (S.emu) return OLD.auth.signInAnonymously();
    const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' });
    return OLD.auth.signInWithPopup(p);
  },
  async disconnect() { if (OLD.auth) await OLD.auth.signOut(); },
  async read(path) {
    const u = await OLD.user(); if (!u) throw errCode('no-old', 'Not connected to the old Inventory.');
    const tok = await u.getIdToken();
    const url = (S.emu ? 'http://127.0.0.1:9000/' : OLD_FB.databaseURL + '/') + path + '.json?' + (S.emu ? 'ns=demo-nlo-cases&' : '') + 'auth=' + encodeURIComponent(tok);
    let r;
    try { r = await fetch(url, { cache: 'no-store', credentials: 'omit' }); } catch (e) { throw errCode('unavailable', 'Couldn’t reach the old Inventory. Check the internet connection.'); }
    if (r.status === 401 || r.status === 403) throw errCode('permission-denied', 'This Google account (' + (u.email || 'not Dr. A’s or the office’s') + ') can’t read the old Inventory. Connect with Dr. A’s or the office account.');
    if (!r.ok) throw errCode('unavailable', 'The old Inventory answered ' + r.status + '.');
    return r.json();
  }
};
/* what's read: [path under nlo/, needed] — a part that can't be read stops the move only when it's needed. settings/invFrozen
   is the mark left when the old Inventory was made read-only (the go-live steps) */
const OLD_PARTS = [['items', 1], ['orders', 1], ['vendors', 1], ['log', 1], ['cart', 1], ['budget', 1], ['bracketOrder', 0], ['elastoPrices', 0],
  ['settings/locations', 0], ['settings/alertsOn', 0], ['settings/geminiProxyUrl', 0], ['settings/invPrefs', 0], ['settings/geminiKey', 0], ['settings/openaiKey', 0],
  ['settings/invFrozen', 0]];
async function readOld() {
  const old = {}, missing = [];
  for (const [part, needed] of OLD_PARTS) {
    try { old[part] = await OLD.read('nlo/' + part); }
    catch (e) { if (needed || e.code === 'no-old') throw e; old[part] = null; if (part !== 'settings/invFrozen') missing.push(part); }
  }
  return { old, missing };
}

   The steps people take — each one stamped with who and when — and the
   records they write. The money rules are the old app's (3.0.1):
   - a receipt books its dollars on a "receive" log entry tied to the

     and reopening it writes exact negative entries that cancel it

     (the last line takes the rounding)

   - free / points / sample receipts book a real $0

  S.D.log.forEach(l => {
    if (!l || l.orderId !== order.id) return;
    if (l.type === 'receive') { const r = rec[l.itemId] || (rec[l.itemId] = { amt: 0, delta: 0, has: false }); if (l.amount != null && isFinite(l.amount)) { r.amt += Number(l.amount); r.has = true; } r.delta += Number(l.delta) || 0; names[l.itemId] = l.itemName; }
    else if (l.type === 'shipping') ship += Number(l.amount) || 0; else if (l.type === 'tax') tax += Number(l.amount) || 0;
  });
  return { rec, names, ship: round2(ship), tax: round2(tax) };
}
async function reopenOrder(orderId) {
  const order = orderById(orderId); if (!order) return; const s = stamp();
  if (order.status !== 'received') throw new Error('That order isn’t received, so there’s nothing to undo.');
  const P = planReopen(order), log = [], stock = {};
  Object.keys(P.rec).forEach(itemId => {
    const r = P.rec[itemId], delta = r.delta > 0 ? r.delta : 0, amt = round2(r.amt);
    if (!delta && !(r.has && amt)) return;
    const it = itemById(itemId);
    log.push(logEntry({ itemId, itemName: (it && it.name) || P.names[itemId] || itemId, delta: -delta, note: 'Order reopened (receive undone): ' + (order.vendor || ''), type: 'receive', amount: r.has && amt ? -amt : null, orderId }, s));
    if (it && delta) stock[itemId] = -delta;
  });
  if (P.ship > 0) log.push(logEntry({ type: 'shipping', amount: -P.ship, note: 'Order reopened (shipping undone): ' + (order.vendor || ''), orderId }, s));
  if (P.tax > 0) log.push(logEntry({ type: 'tax', amount: -P.tax, note: 'Order reopened (tax undone): ' + (order.vendor || ''), orderId }, s));
  /* all in one step — open again, its stock back out, its dollars reversed: two computers reopening at once can't take it
     out twice, and it never ends up half done */
  const done = () => { B.alert([alertOrderEvent('reopened', Object.assign({}, order, { status: 'open' }))]); };
  try { await B.book(orderId, 'k' + uid(), cur => cur.status === 'received' ? { status: 'open', dateReceived: null, countUpdated: false, trail: trailAdd(cur.trail, 'reopened', s) } : undefined, { stock, log }); }
  catch (e) {
    if (e && e.code === 'aborted') throw new Error('That order was just reopened on another computer.');
    if (e && e.code === 'timeout' && e.late) e.late.then(x => { if (x) { done(); toast('The ' + (order.vendor || '') + ' order was reopened after all: its stock and dollars are taken back.', { ms: 8000 }); } }, () => { });
    throw e;
  }
  done();
}
/* shipping and tax for an order that already came in (the paper invoice arrives later), once per order */
async function addCostEntries(orderId, vendor, ship, tax) {
  const s = stamp(), e = [], sh = parseFloat(ship), tx = parseFloat(tax);
  if (isFinite(sh) && sh > 0 && moneyBooked(orderId, 'shipping') <= 0) e.push(logEntry({ type: 'shipping', amount: round2(sh), note: 'Shipping: ' + (vendor || ''), orderId: orderId || null }, s));
  if (isFinite(tx) && tx > 0 && moneyBooked(orderId, 'tax') <= 0) e.push(logEntry({ type: 'tax', amount: round2(tx), note: 'Sales tax: ' + (vendor || ''), orderId: orderId || null }, s));
  if (e.length) await B.addLog(e);
}

/* ---------- stock ---------- */
/* type: use | adjust | count (count = set exactly to setTo) */
async function stockStep(item, delta, type, note, setTo, extra) {
  const s = stamp(); type = type || 'adjust';
  if (type === 'count') {
    const live = Number((itemById(item.id) || item).qty) || 0; setTo = Math.max(0, Number(setTo) || 0); delta = setTo - live;
    await B.setStock(item.id, setTo);
  } else await B.addStock(item.id, Number(delta) || 0);
  await B.patchItem(item.id, { chk: s.at, chkBy: s.by });
  await B.addLog([logEntry(Object.assign({ itemId: item.id, itemName: item.name, delta: round2(delta), note: note || null, type }, extra || {}), s)]);
}

  const s = stamp(); item = Object.assign({}, item);
  if (isNew) { item.id = item.id || 'custom-' + uid(); item.createdBy = s.by; item.createdAt = s.at; if (item.qty == null) item.qty = 0; if (item.min == null) item.min = 0; await B.putItem(item); }
  else { const patch = Object.assign({}, item, { updatedBy: s.by, updatedAt: s.at }); delete patch.id; await B.patchItem(item.id, patch); }
  ensureVendors(allSources(item).map(x => x.vendor));

}

function ensureVendors(names) {

  names.map(n => String(n || '').trim()).filter(Boolean).forEach(n => { if (have.has(n.toLowerCase())) return; have.add(n.toLowerCase());

}

/* =====================================================================
   Scan a packing slip (or invoice) — photos or PDFs.
   1. Pages: take photos (several pages) or pick files; digital PDFs are
      read from their text, which is faster and exact.
   2. The AI (Gemini, through the office's key or service) reads the
      lines and suggests which supply each one is. Only a unique exact SKU
      is trusted; every other match must be confirmed (one tap).
   3. Review: fix what it read — the supply, what came (2 cases × 10 =
      20 boxes), the price on the slip, discounts, tax and shipping.
   4. It's then filed in one of three ways:
      - against an OPEN order (found by order #, shared lines, or the only
        open order from that vendor; or picked by hand): received the same
        way as the Receive button — stock, dollars, a backorder for what
        didn't come, the price per box remembered — stamped with who did
        it. Lines that weren't on the order are added to it.
      - against an order ALREADY RECEIVED in the last 120 days (the paper
        invoice came later): prices, invoice #, tax and shipping only —
        never stock again.
      - no order: it's logged as a received order of its own.
   Spending follows the slip's own line totals. Shipping and tax are

   with its known faults fixed (the slip photo is kept, "No — add stock"
   stays chosen, the vendor can be corrected, receipts carry their order).
   ===================================================================== */
const SLIP_SYSTEM_PROMPT = "You extract data from dental/orthodontic supply invoices and packing slips. You may be given page IMAGES, extracted PDF TEXT, or both — treat them as the same single document. Return ONLY valid JSON, no markdown — a single object with exactly two keys: \"document\" and \"items\". The \"document\" object describes the whole invoice/slip; use null for anything not present. Its fields are: invoiceNumber (the invoice number as printed), invoiceDate (a short date string like 'Mar 2026'), orderNumber (the purchase order, sales order, or web order number), accountId (the customer/account number that identifies the BUYER on this vendor's system — labels like 'Account #', 'Account No', 'Customer #', 'Customer ID', 'Ship-to #'), vendorName (the supplier that issued this document), vendorAddress (the vendor's mailing address on one line). Do NOT confuse accountId (identifies the buyer) with invoiceNumber or orderNumber. The \"items\" array contains one object per line item with these EXACT field names: name (product name as printed), sku (part/catalog number), vendor (the SUPPLIER that issued this document — the same company as the document's vendorName — NOT the manufacturer or brand. Distributor slips such as Patterson and Henry Schein print a short manufacturer code beside each line, often truncated to about six letters, e.g. 'CETYLI' for Cetylite, 'PLASDE' for Plasdent, 'BUTLER' for Sunstar Butler. NEVER put such a code here: repeat the document's supplier for every line instead), price (unit price as number), qty (quantity as integer — the number of units shipped; use the SHIPPED column when shipped and ordered differ), slipUnit (the unit of measure on the slip, e.g. 'case', 'box', 'pack', 'ea', 'bag'), packQty (if the slip says something like '2 cases of 10 boxes', packQty is 10 — the number of smaller units per shipping unit; otherwise null), date (invoice date as short string like 'Mar 2026'), matchItemId (string or null — see below), matchConfidence ('high' or 'low'). MATCHING: You are given the practice's inventory list; each inventory line ends with an ID in the form [... ID: xyz]. For each invoice line, set matchItemId to the ID of the inventory item that IS this product, or null if none clearly is. The same product is often worded differently on the slip than in the inventory (abbreviations, word order, plural, size written as .019 vs 019, brand vs generic name) — match on product identity: brand, product type, size/spec, color/shade. Prefer SKU equality when SKUs are present. If several inventory items are plausible variants (different sizes, shades, colors, packaging) and the line does not clearly specify which one, set matchItemId to null instead of guessing. Set matchConfidence to 'high' only when the SKU matches or the identity is unmistakable. Copy the ID EXACTLY as printed after 'ID:' — never invent IDs. IMPORTANT: Use EXACTLY these field names: name, sku, vendor, price, qty, slipUnit, packQty, date, matchItemId, matchConfidence. PAY ATTENTION TO UNITS: distinguish between cases, boxes, packs, and individual items. If the slip says '2 CS' that means 2 cases, not 2 boxes. The inventory list shows how each item is tracked (Unit field). If the slip unit differs from the tracked unit, still report the slip values and packQty so the user can convert. Extract every line item you can read; skip pure charge lines like shipping, tax, fuel surcharge, or discounts (report those nowhere). If given multiple pages, they are pages of the SAME document — merge their line items into a single array and do not duplicate a line continued across pages. If the input is NOT an invoice or packing slip, return {\"document\":{},\"items\":[]}.";

    const [id, v] = k.split('|'), it = itemById(id); if (!it || it.archived || it.deleted) return;

/* ---------- the prices: read when a screen needs them, then kept for the visit ----------
   A row is [vendor id, item #, description, unit, member price, retail price, section, note, file]; its key (for links to
   supplies) is made from the vendor, the item # (or the description) and the unit, so it stays the same when a newer set of
   the same price lists is loaded. */
function mlHash(s) { let h = 5381; s = String(s || ''); for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }

/* ---------- searching: every word, however it's spelled (sm = small, ss = stainless, o-ties = elastomeric ligatures …) ---------- */
const ML_SYN = {
  small: ['sm', 'sml'], sm: ['small'], medium: ['med', 'md'], med: ['medium'], md: ['medium'], large: ['lg', 'lrg'], lg: ['large'],
  xlarge: ['xl', 'x-large'], xl: ['x-large', 'xlarge', 'extra large'], xsmall: ['xs', 'x-small'], xs: ['x-small', 'xsmall', 'extra small'],
  niti: ['nickel titanium', 'ni-ti', 'nitinol', 'nt3'], stainless: ['ss', 's/s'], ss: ['stainless'], tma: ['beta ti', 'beta-ti', 'beta titanium'],
  'o-tie': ['o tie', 'otie', 'o-ring', 'o ring', 'elastomeric ligature', 'elastic ligature', 'ligature tie', 'alastik', 'module'],
  otie: ['o-tie', 'o tie', 'o-ring', 'elastomeric ligature', 'ligature tie'], ligature: ['lig'], chain: ['e-chain', 'power chain'],
  glove: ['gloves'], nitrile: ['nitril'], mask: ['masks', 'face mask'], pouch: ['pouches', 'sterilization pouch', 'steri pouch'],
  bur: ['burs', 'carbide'], elastic: ['elastics', 'rubber band', 'intraoral'], cutter: ['cutters', 'nipper'], plier: ['pliers'],
  bracket: ['brackets', 'brkt'], tube: ['tubes', 'buccal tube'], band: ['bands'], wire: ['wires', 'archwire'], archwire: ['arch wire', 'wire'],
  retainer: ['retainers'], aligner: ['aligners'], etch: ['etchant', 'phosphoric'], adhesive: ['paste', 'bonding'], cheek: ['cheek retractor'],
  retractor: ['retractors'], mirror: ['mirrors'], brush: ['brushes', 'toothbrush'], floss: ['flosser', 'threader'], wax: ['relief wax', 'ortho wax']
};
/* a short word (sm, lg, ss, 16) matches only as a word of its own ("ss" isn't in "glass", ".016" isn't ".016 x .022") */
function mlTest(a) {
  if (a.length > 3) return t => t.includes(a);
  const re = new RegExp('(^|[^a-z0-9])' + a.replace(/[.*+?^${}()|[\]\\\/]/g, '\\$&') + '($|[^a-z0-9])');
  return t => re.test(t);
}
function mlWords(q) {
  return normSearch(q).split(/\s+/).filter(Boolean).map(w => {
    if (w.length > 4 && /(x|ch|sh)es$/.test(w)) w = w.slice(0, -2);
    else if (w.length > 3 && /s$/.test(w) && !/ss$/.test(w)) w = w.slice(0, -1);
    const alts = Array.from(new Set([w].concat(ML_SYN[w] || []).map(normSearch)));
    return { w, alts, tests: alts.map(mlTest) };
  });
}
/* opt: v (one vendor), loose (most of the words, best first: "Find it on Mari's List" from a supply), sort */
function mlSearch(q, opt) {
  opt = opt || {};
  const rows = S.ml.rows || [], words = mlWords(q), out = [];
  if (!words.length) { const all = opt.v ? rows.filter(r => r.v === opt.v) : []; return opt.sort === 'price' ? all.slice().sort((a, b) => (a.p == null ? Infinity : a.p) - (b.p == null ? Infinity : b.p)) : all; }
  const need = opt.loose ? Math.max(1, Math.ceil(words.length * 0.6)) : words.length;
  for (const r of rows) {
    if (opt.v && r.v !== opt.v) continue;
    let hit = 0, inD = 0;
    for (const w of words) {
      if (w.tests.some(f => f(r.t))) { hit++; if (w.tests.some(f => f(r.dt))) inD++; }
      else if (!opt.loose) break;
    }
    if (hit >= need) out.push({ r, hit, inD });
  }
  const price = x => x.r.p == null ? Infinity : x.r.p;
  if (opt.sort === 'price') out.sort((a, b) => price(a) - price(b));
  else if (opt.sort === 'vendor') out.sort((a, b) => a.r.mv.name.localeCompare(b.r.mv.name) || price(a) - price(b));
  else out.sort((a, b) => (b.hit - a.hit) || (b.inD - a.inD) || (a.r.d.length - b.r.d.length) || price(a) - price(b));
  return out.map(x => x.r);

/* how many pieces one unit holds, when the unit (or the description) says so plainly: "Pack of 10", "10/pk", "Box of 200", "10EA" */
function mlCount(r) {
  const one = s => {
    s = String(s || '');
    const m = s.match(/\b(?:pack|pk|pkg|box|bx|bag|bg|case|cs|carton|ctn|kit|jar|bottle|btl|tub|roll|sleeve|bundle|set)\s+of\s+(\d[\d,]*)\b/i)
      || s.match(/\b(\d[\d,]*)\s*\/\s*(?:pack|pk|pkg|box|bx|bag|bg|case|cs|carton|ctn|kit|jar|btl|bottle|roll|sleeve|set|tub|bundle)\b/i)
      || s.match(/\b(\d[\d,]*)\s*[- ]?(?:pack|pk|ct|count|pcs|pieces)\b/i)
      || s.match(/\b(\d[\d,]*)\s*ea\b/i);

    return n >= 2 && n <= 100000 ? n : 0;
  };

}
function mlEach(p) { return p < 0.1 ? '$' + p.toFixed(3) : money(p); }
/* the member price, with the retail one and the piece price when the file says enough */
function mlPriceHTML(r, big) {

  const off = r.r && r.r > r.p ? Math.round((1 - r.p / r.r) * 100) : 0, n = mlCount(r);

    (r.r ? '<small>retail ' + money(r.r) + (off ? ' · ' + off + '% off' : '') + '</small>' : '') + (n ? '<small>≈ ' + mlEach(r.p / n) + ' each</small>' : '');
}

/* ---------- the office's supplies: what's linked to Mari's List, and what it saves ----------
   A link: { k: row key, x: how many of the supply's counted units one Mari's List unit is, and what the row said (v, n, d, u, p, r)
   when it was linked — so a drawer shows it without reading every price } */
function mlLinks(itemId) { return listOf((S.ml.match || {})[itemId]).filter(m => m && m.k); }
/* the linked row now (the newest prices once they're read), else as it was linked */
function mlLinkRow(m) { const r = mlRowByKey(m.k); return r ? { k: r.k, v: r.v, n: r.n, d: r.d, u: r.u, p: r.p, r: r.r } : m; }
/* units of a supply received in the last 365 days (what a year of it is, for the savings) */
function mlYearUnits(itemId) {
  let n = 0;
  S.D.orders.forEach(o => { if (o.status !== 'received' || daysAgo(o.dateReceived || o.dateOrdered) > 365) return; o.items.forEach(l => { if (l.itemId === itemId) n += lineStockDelta(l); }); });

}

  const per = row.p / x, diff = cp == null ? null : cp - per, pct = cp ? diff / cp : null, units = mlYearUnits(it.id);

function mlBest(it) {

function mlCheaper() {

    .sort((a, b) => ((b.c.year || 0) - (a.c.year || 0)) || (b.c.pct - a.c.pct));
}

/* =====================================================================
   AO Partner Dollars — American Orthodontics' points (Amir, 17 Oct 2026: "can you see if you can somehow incoporate their
   point system in our invenvory?" … "this whole point sysstem is confusing as hell" … "you should APPROXIMATE our points going
   forward … if you have the price of each items which you do").
   How AO's points work (read from AO Direct, Oct 2026): brackets and tubes earn Partner Dollars (about 36% of AO's list
   price, which is about 45% of the office's own price — $1.28 on a $2.84 Mini Master bracket); everything else AO sells
   (wires, elastics, ties, buttons, supplies) can be paid with them dollar for dollar and earns nothing, and the office's
   account pays with them by default. They expire.
   - The balance AO Direct last showed is kept on the AO vendor's record: pts = { bal, exp, at, by }. Dr. A updates it from
     AO Direct → Partner detail (or Claude does, from his Chrome).
   - Each AO supply can say what it does, as AO Direct gave it: aoPts = { earn: dollars per counted unit } or { pay: true }
     (or { none: true }), with the day it was read. Without it: brackets and tubes earn about 45% of what's paid (AO Direct's
     figures for the office's price, Oct 2026), anything else is paid with points. Quick order brackets keep what one earns
     beside their price in the shared price memory (earn).
   - From that balance on, the page counts: every AO order received in Inventory and placed after the balance was read adds
     what its brackets and tubes earn, and takes off what its other lines cost (no more than there is). Orders that never
     pass through Inventory (the rep's, unless they're received here) and AO's kit-assembly charges aren't seen — so it's
     "about", and it says when the balance was last checked.
   - A supply's real cost after points: what's paid minus what it earns.
   Only Dr. A sees any of it.
   ===================================================================== */
const PTS_VENDOR = 'ao';
const PTS_EARN_GUESS = 0.45;
const PTS_STALE_DAYS = 45;
function isAoName(n) { return !!n && vendorNamesSimilar(n, 'American Orthodontics'); }
function aoSource(it) { return allSources(it).find(s => s && isAoName(s.vendor)) || null; }
function looksHardware(name, cat) { return cat === 'brackets-tubes' || /\b(BKTS?|BRACKETS?|TUBES?)\b/i.test(String(name || '')); }
/* the balance AO Direct last showed (null until there is one) */
function ptsAnchor() {
  const v = S.D.vendors.find(x => x && x.id === PTS_VENDOR), p = v && v.pts;
  return p && typeof p === 'object' && isFinite(Number(p.bal)) && Number(p.bal) >= 0 && msOf(p.at) ? p : null;
}
/* what an AO supply does with points: { earn: dollars per counted unit, guess } | { pay: true, guess } | null */
function ptsRule(it) {
  const src = it && aoSource(it); if (!src) return null;
  const r = it.aoPts && typeof it.aoPts === 'object' ? it.aoPts : null;
  if (r && Number(r.earn) > 0) return { earn: Number(r.earn) };
  if (r && r.pay) return { pay: true };
  if (r && r.none) return null;
  if (looksHardware(it.name, it.cat)) { const cp = countPrice(src); return cp ? { earn: round2(cp * PTS_EARN_GUESS), guess: true } : null; }
  return { pay: true, guess: true };
}
/* Quick order brackets (a set, or single teeth, of one system): the shared price memory keeps what one earns (earn), as
   AO Direct gives it, beside its price */
function ptsQuickEntry(l) {
  if (!l || !/^AO-BRACKET-(SET|IND)$/.test(l.sku || '')) return null;
  const v = (S.D.elastoPrices || {})[fbKey(l.sku + '|' + String(l.name || '').replace(/\s*\(single teeth\)$/, ''))];
  return v && typeof v === 'object' ? v : null;
}
/* one line of an AO order: what it earned and what points could pay for */
function ptsLine(l) {
  const it = l && l.itemId ? itemById(l.itemId) : null, r = it && it.aoPts && typeof it.aoPts === 'object' ? it.aoPts : null;
  const cost = Math.max(0, orderItemCost(l) || 0), q = it ? null : ptsQuickEntry(l);
  if (q && Number(q.earn) > 0) return { earn: (Number(l.slipQty) || Number(l.qty) || 0) * Number(q.earn), pay: 0 };
  if (r && Number(r.earn) > 0) return { earn: lineStockDelta(l) * Number(r.earn), pay: 0 };
  if (r && r.pay) return { earn: 0, pay: cost };
  if (r && r.none) return { earn: 0, pay: 0 };
  if (looksHardware(it ? it.name : l.name, it ? it.cat : lineCat(l))) return { earn: cost * PTS_EARN_GUESS, pay: 0 };

function ptsWhen(o) { return msOf(o.orderedAt || o.dateOrdered || o.dateReceived); }
/* the AO orders counted since the balance was read: received here, placed after it */
function ptsOrders(a) {
  const t0 = msOf(a.at);

/* the estimate now: { bal, was, at, exp, by, earned, used, orders } (null until a balance is in) */
function ptsNow() {

  ords.forEach(o => {

function dataUrlToBase64(dataUrl) {
  return dataUrl.replace(/^data:image\/[a-z]+;base64,/, "");
}

// Helper: ensure image is JPEG/PNG data URL
async function ensureJpeg(imageDataUrl) {
  if (imageDataUrl && !imageDataUrl.startsWith("data:image/jpeg") && !imageDataUrl.startsWith("data:image/png")) {
    return new Promise(function(resolve) {
      var img = new Image();
      img.onload = function() {
        var cvs = document.createElement("canvas");
        cvs.width = img.naturalWidth; cvs.height = img.naturalHeight;
        cvs.getContext("2d").drawImage(img, 0, 0);
        resolve(cvs.toDataURL("image/jpeg", 0.9));
      };
      img.onerror = function() { resolve(imageDataUrl); };
      img.src = imageDataUrl;
    });
  }
  return imageDataUrl;
}

// Helper: extract MIME type from data URL
function dataUrlMime(dataUrl) {
  var m = dataUrl.match(/^data:(image\/[a-z]+);/);
  return m ? m[1] : "image/jpeg";
}

// Downscale an image data URL so its longest side is <= maxDim, re-encoding as
// JPEG. Invoices/packing slips stay perfectly readable to Gemini at ~1800px,
// while the upload shrinks 5-20x — the single biggest fix for AI scans that
// "spin forever" and time out on office Wi-Fi (full-res phone photos are
// 3-8 MB each once base64-encoded).
function downscaleDataUrl(dataUrl, maxDim, quality) {
  maxDim = maxDim || 1800; quality = quality || 0.82;
  return new Promise(function(resolve) {
    try {
      if (!dataUrl || typeof dataUrl !== "string" || !dataUrl.startsWith("data:image/")) return resolve(dataUrl);
      var img = new Image();
      img.onload = function() {
        var w = img.naturalWidth, h = img.naturalHeight;
        if (!w || !h) return resolve(dataUrl);
        var scale = Math.min(1, maxDim / Math.max(w, h));
        // Already small AND already a modest JPEG — leave it untouched.
        if (scale >= 1 && dataUrl.startsWith("data:image/jpeg") && dataUrl.length < 900000) return resolve(dataUrl);
        var cvs = document.createElement("canvas");
        cvs.width = Math.max(1, Math.round(w * scale));
        cvs.height = Math.max(1, Math.round(h * scale));
        cvs.getContext("2d").drawImage(img, 0, 0, cvs.width, cvs.height);
        resolve(cvs.toDataURL("image/jpeg", quality));
      };
      img.onerror = function() { resolve(dataUrl); };
      img.src = dataUrl;
    } catch (e) { resolve(dataUrl); }
  });
}

// Pull ALL text out of a Gemini response — answers can span multiple parts,
// and reading only parts[0] occasionally returned "" for a good response.
function geminiResponseText(data) {
  var parts = (data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
  return parts.map(function(p) { return (p && typeof p.text === "string") ? p.text : ""; }).join("");

// Robustly pull a JSON object/array out of a model reply (strips markdown
// fences, then falls back to grabbing the outermost {...} or [...] block).
function extractJsonBlock(text) {
  var clean = String(text || "").replace(/```json\s*/gi, "").replace(/```\s*/g, "").trim();
  try { return JSON.parse(clean); } catch (e) {}
  var m = clean.match(/\{[\s\S]*\}|\[[\s\S]*\]/);
  if (m) { try { return JSON.parse(m[0]); } catch (e2) {} }
  return null;
}

function withTimeout(ms) {
  var ctrl = new AbortController();
  var timer = setTimeout(function() { ctrl.abort(); }, ms);
  return { signal: ctrl.signal, done: function() { clearTimeout(timer); } };
}

function mapGeminiError(respStatus, errMsg) {
  var msg = errMsg || ("Gemini API error " + respStatus);
  if (respStatus === 400 && msg.includes("API_KEY")) return "Invalid Gemini API key. Please check your key.";
  if (msg.includes("API_KEY_HTTP_REFERRER_BLOCKED")) return "Gemini API key is restricted by HTTP referrer. If you run this as a local file, allow your local origin (or remove restriction) in Google AI Studio.";
  if (msg.includes("PERMISSION_DENIED")) return "Gemini key does not have permission for this model/project. Check API key and project settings.";
  if (respStatus === 429) return "Gemini rate limit reached. Wait a moment and try again.";
  return msg;
}

function isLikelyOpenAIKey(key) {
  return /^sk[-_]/i.test((key || "").trim());
}

function resolveOpenAIKey(sharedOpenAIKey, localOpenAIKey) {
  var shared = (sharedOpenAIKey || "").trim();
  var local = (localOpenAIKey || "").trim();
  if (isLikelyOpenAIKey(shared)) return shared;
  if (isLikelyOpenAIKey(local)) return local;
  return "";

// Calls Gemini with automatic retries and model fallback.
// Reliability rules learned from real office use:
//  - A single attempt with a hard 30s timeout wasn't enough: transient
//    failures (timeout / 429 rate limit / 5xx / network blip) now retry with a
//    short backoff instead of dumping the user to manual entry.
//  - Gemini 2.5's "thinking" adds a LOT of latency to plain extraction jobs,
//    so we request thinkingBudget 0 — and strip that config automatically for
//    models/proxies that reject it.
//  - On timeout we fall through to progressively FASTER models rather than
//    giving up (the retired 1.5 models were replaced with live ones).
// opts: { timeoutMs, totalBudgetMs, onStatus(msg) } — all optional.
async function callGeminiGenerateContent(payload, apiKey, proxyUrl, opts) {
  opts = opts || {};
  var timeoutMs = opts.timeoutMs || 45000;
  var onStatus = (typeof opts.onStatus === "function") ? opts.onStatus : function() {};
  var deadline = Date.now() + (opts.totalBudgetMs || 115000);
  function timeLeft() { return deadline - Date.now(); }
  function sleep(ms) { return new Promise(function(res) { setTimeout(res, ms); }); }
  function stripThinking(pl) {
    if (!pl || !pl.generationConfig || !pl.generationConfig.thinkingConfig) return pl;
    var gc = Object.assign({}, pl.generationConfig); delete gc.thinkingConfig;
    return Object.assign({}, pl, { generationConfig: gc });
  }
  async function postOnce(url, body, ms) {
    var t = withTimeout(ms);
    try {
      var resp = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, signal: t.signal, body: JSON.stringify(body) });
      var data = {};
      try { data = await resp.json(); } catch (je) {}
      return { ok: resp.ok, status: resp.status, data: data };
    } finally { t.done(); }
  }

  var proxy = (proxyUrl || "").trim();
  if (proxy) {
    var pPayload = payload;
    var lastProxyErr = null;
    for (var attempt = 0; attempt < 3; attempt++) {
      if (timeLeft() < 5000) break;
      try {
        if (attempt > 0) { onStatus("Connection hiccup — retrying (attempt " + (attempt + 1) + " of 3)..."); }
        var r = await postOnce(proxy, pPayload, Math.min(timeoutMs, Math.max(8000, timeLeft())));
        if (r.ok) return r.data;
        var pMsg = (r.data && r.data.error && r.data.error.message) || ("Proxy API error " + r.status);
        // Proxy's model rejected thinkingConfig — strip it and retry immediately (doesn't count as an attempt).
        if (r.status === 400 && /thinking/i.test(pMsg) && pPayload.generationConfig && pPayload.generationConfig.thinkingConfig) {
          pPayload = stripThinking(pPayload); attempt--; continue;
        }
        if (r.status === 429 || r.status >= 500) {
          lastProxyErr = new Error(mapGeminiError(r.status, pMsg));
          await sleep(r.status === 429 ? 2500 : 1200);
          continue;
        }
        throw new Error(mapGeminiError(r.status, pMsg));
      } catch (e) {
        if (e && e.name === "AbortError") { lastProxyErr = new Error("Gemini proxy kept timing out even after retries. Try again, or process fewer pages at once."); continue; }
        if (e instanceof TypeError) { lastProxyErr = new Error("Network/CORS error calling Gemini proxy URL."); await sleep(1000); continue; }
        throw e;
      }
    }
    throw lastProxyErr || new Error("Gemini proxy request failed after retries. Check your connection and try again.");
  }

  if (!apiKey) throw new Error("No Gemini API key configured");
  // Primary model first, then progressively faster fallbacks. (gemini-1.5-*
  // are retired and 404 on new keys — they only wasted the fallback slots.)
  var models = ["gemini-2.5-flash", "gemini-2.5-flash-lite", "gemini-2.0-flash"];
  var lastErr = null;
  for (var i = 0; i < models.length; i++) {
    var model = models[i];
    if (timeLeft() < 5000) break;
    // Only 2.5-series models accept thinkingConfig — strip it for others.
    var body = /2\.5/.test(model) ? payload : stripThinking(payload);
    for (var att = 0; att < 2; att++) {
      if (timeLeft() < 5000) break;
      try {
        if (i > 0 || att > 0) { onStatus("Retrying with " + model.replace("gemini-", "Gemini ") + "..."); }
        var res = await postOnce(
          "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent?key=" + encodeURIComponent(apiKey),
          body, Math.min(timeoutMs, Math.max(8000, timeLeft())));
        if (res.ok) return res.data;
        var errMsg = (res.data && res.data.error && res.data.error.message) || ("API error " + res.status);
        if (res.status === 400 && /thinking/i.test(errMsg) && body.generationConfig && body.generationConfig.thinkingConfig) {
          body = stripThinking(body); att--; continue; // strip and retry same model, free attempt
        }
        if (res.status === 404 || /not found|not supported|unknown model/i.test(errMsg)) {
          lastErr = new Error("Model unavailable: " + model);
          break; // next model
        }
        if (res.status === 429) { lastErr = new Error(mapGeminiError(429, errMsg)); await sleep(2500); continue; }
        if (res.status >= 500) { lastErr = new Error(mapGeminiError(res.status, errMsg)); await sleep(1200); continue; }
        throw new Error(mapGeminiError(res.status, errMsg));
      } catch (e) {
        if (e && e.name === "AbortError") {
          // Timed out — don't burn the remaining budget on the same model; move
          // straight to the next (faster) one.
          lastErr = new Error("Gemini kept timing out even after retries. Try again in a moment, or process fewer pages at once.");
          break;
        }
        if (e instanceof TypeError) {
          lastErr = new Error("Network/CORS error calling Gemini. If you opened this HTML directly, run it from a local server (for example: `python3 -m http.server`) and retry.");
          await sleep(1000); continue;
        }
        throw e;
      }
    }
  }
  throw lastErr || new Error("No compatible Gemini model was available for this key.");
}

// ─────────────────────────────────────────────────────────────────────────────
// Invoice-line ↔ inventory matching engine
//
// The old matcher had two failure modes staff hit constantly:
//   1) "matched nothing" — SKUs had to be EXACTLY equal (vendors print
//      860-142-00 for a stored 860142), and name matching required a big word
//      overlap, so punctuation, plurals, and abbreviations (".019", "SS",
//      "NiTi", "lig ties") killed obvious matches.
//   2) "matched the wrong thing" — a single generic shared word ("wire",
//      "plus") could drag a line onto an unrelated item.
// New strategy: normalize aggressively (synonyms, plurals, sizes, punctuation),
// then accept a match only on a normalized SKU hit, a RARE distinctive word
// (one that appears in ≤2 inventory items — near-unique is near-proof), a
// strong overlap score, or 2+ distinctive shared words. Every candidate list
// is also surfaced to the UI as tap-to-pick suggestions, so even a miss is a
// one-tap fix instead of a manual search.
// ─────────────────────────────────────────────────────────────────────────────

// Words that must never, on their own, drive a match.
var GENERIC_MATCH_WORDS = { plus: 1, white: 1, black: 1, clear: 1, blue: 1, green: 1, red: 1,
  pink: 1, yellow: 1, purple: 1, violet: 1, small: 1, large: 1, medium: 1, mini: 1,
  kit: 1, set: 1, pack: 1, box: 1, case: 1, bag: 1, refill: 1, with: 1, and: 1, the: 1,
  for: 1, size: 1, new: 1, pro: 1, exam: 1, value: 1, regular: 1, standard: 1,
  assorted: 1, asst: 1, dental: 1, ortho: 1, orthodontic: 1, orthodontics: 1,
  count: 1, per: 1, each: 1, single: 1, disposable: 1, sample: 1, unit: 1 };

// Fold common ortho-supply synonyms/abbreviations to one canonical token so
// slip wording and inventory wording line up ("Elastic Ligature Ties" ↔
// "Elastomeric Ligatures").
var MATCH_SYNONYM_RULES = [
  [/stainless\s*steel/g, " ss "],
  [/nickel[\s-]*titanium|\bniti\b|\bni-ti\b/g, " niti "],
  [/elastomerics?|elastics?/g, " elast "],
  [/ligatures?|\bligs?\b/g, " lig "],
  [/brackets?|\bbrkts?\b/g, " bracket "],
  [/arch\s*wires?|archwires?/g, " archwire "],
  [/\bmaxillary\b|\bmax\b|\bupper\b/g, " upper "],
  [/\bmandibular\b|\bmand\b|\blower\b/g, " lower "],
  [/\bgloves?\b/g, " glove "],
  [/\bo-?rings?\b/g, " oring "],
  [/power\s*chains?|powerchains?/g, " powerchain "]
];

// Normalize a product name into comparable tokens.
function matchTokens(name) {
  var s = String(name || "").toLowerCase();
  s = s.replace(/\.(\d)/g, "$1");                    // .019 → 019 (decimal sizes)
  s = s.replace(/(\d)\s*["”]/g, "$1 ");              // 019" → 019
  s = s.replace(/(\d)\s*[x×*]\s*(?=[\d.])/g, "$1x"); // 019 x 025 → 019x025
  MATCH_SYNONYM_RULES.forEach(function(rule) { s = s.replace(rule[0], rule[1]); });
  s = s.replace(/[^a-z0-9]+/g, " ");
  var out = [];
  s.split(/\s+/).forEach(function(t) {
    if (t.length < 2) return;
    t = t.replace(/\d+/g, function(d) { return String(parseInt(d, 10)); }); // 019x025 → 19x25, 007 → 7
    if (t.length > 3 && /s$/.test(t) && !/ss$/.test(t)) t = t.slice(0, -1); // naive singular
    if (t.length >= 2 && out.indexOf(t) === -1) out.push(t);
  });
  return out;
}

// Normalize a SKU/part number for comparison: case, spaces, dashes, dots,
// leading zeros all ignored.
function normSku(sku) {
  return String(sku || "").toLowerCase().replace(/[^a-z0-9]/g, "").replace(/^0+(?=\d)/, "");
}

// Do two normalized SKUs refer to the same part? Exact, or one contains the
// other (vendors append suffixes like -EA/-BX and packaging codes).
function skusAlike(a, b) {
  if (!a || !b || a.length < 3 || b.length < 3) return false;
  if (a === b) return true;
  return (b.length >= 5 && a.indexOf(b) !== -1) || (a.length >= 5 && b.indexOf(a) !== -1);
}

// Precompute per-item tokens + how many items contain each token (rarity).
function buildInventoryMatchIndex(items) {
  var freq = {}, toks = {};
  (items || []).forEach(function(it) {
    var t = matchTokens(it.name);
    toks[it.id] = t;
    t.forEach(function(w) { freq[w] = (freq[w] || 0) + 1; });
  });
  return { freq: freq, toks: toks };
}

// Score every inventory item against a slip-line name. Returns candidates
// sorted best-first: { id, score, dcount, rare, accepted }.
function scoreNameMatch(aiName, items, idx) {
  var aiToks = matchTokens(aiName);
  if (!aiToks.length) return [];
  var aiCompact = aiToks.join("");
  var out = [];
  (items || []).forEach(function(it) {
    var itToks = (idx && idx.toks && idx.toks[it.id]) || matchTokens(it.name);
    if (!itToks.length) return;
    var shared = itToks.filter(function(t) { return aiToks.indexOf(t) !== -1; });
    var distinct = shared.filter(function(t) { return !GENERIC_MATCH_WORDS[t]; });
    // Compact containment rescues spacing differences ("OrthoPrime" ↔ "Ortho Prime")
    var itCompact = itToks.join("");
    var compactHit = (itCompact.length >= 6 && aiCompact.indexOf(itCompact) !== -1) ||
                     (aiCompact.length >= 6 && itCompact.indexOf(aiCompact) !== -1);
    if (!distinct.length && !compactHit) return;
    var fwd = shared.length / itToks.length;
    var rev = shared.length / aiToks.length;
    var score = Math.max(fwd, rev);
    if (compactHit) score = Math.max(score, 0.9);
    // A shared distinctive word that appears in ≤2 inventory items is
    // near-unique — strong evidence even when the overall overlap is small.
    var rare = distinct.some(function(t) { return idx && idx.freq && (idx.freq[t] || 0) <= 2 && t.length >= 3; });
    var accepted = compactHit || score >= 0.5 || distinct.length >= 2 || (rare && score >= 0.15);
    out.push({ id: it.id, score: score, dcount: distinct.length, rare: rare, accepted: accepted });
  });
  out.sort(function(a, b) { return (b.score - a.score) || (b.dcount - a.dcount); });
  return out;
}

// Find inventory items whose SKU (main or any source SKU) matches the slip SKU.
function skuMatchItems(items, rawSku) {
  var q = normSku(rawSku);
  if (!q || q.length < 3) return { list: [], exact: false };
  var exact = [], partial = [];
  (items || []).forEach(function(it) {
    var skus = [];
    if (it.sku) skus.push(it.sku);
    listOf(it.sources).forEach(function(s) { if (s && s.sku) skus.push(s.sku); });
    var hitExact = false, hitPart = false;
    skus.forEach(function(s) {
      var n = normSku(s);
      if (!n || n.length < 3) return;
      if (n === q) hitExact = true;
      else if (skusAlike(n, q)) hitPart = true;
    });
    if (hitExact) exact.push(it);
    else if (hitPart) partial.push(it);
  });
  return exact.length ? { list: exact, exact: true } : { list: partial, exact: false };
}

// Full per-line matching pipeline: SKU → AI-proposed ID → fuzzy name.
// Returns { itemId, matchType ("sku" trusted | "fuzzy" needs review | "" none),
// suggestions: [itemId,...] } — suggestions power the tap-to-pick chips.
function matchRowToItem(row, items, idx) {
  // 1. SKU — a unique exact hit is the only auto-trusted match.
  if (row.sku) {
    var sm = skuMatchItems(items, row.sku);
    if (sm.list.length === 1 && sm.exact) {
      return { itemId: sm.list[0].id, matchType: "sku", suggestions: [] };
    }
    if (sm.list.length > 0) {
      // Ambiguous or partial SKU hit — solid lead, but a human confirms it.
      return { itemId: sm.list[0].id, matchType: "fuzzy", suggestions: sm.list.slice(0, 3).map(function(it) { return it.id; }) };
    }
  }

  var scored = scoreNameMatch(row.name, items, idx);

// Loose overlap between two token lists (used to align slip lines with order lines).
function tokenListsOverlap(aToks, bToks) {

// "American Orthodontics", "HSD" matches "Henry Schein Dental", plus the old
// containment/shared-word logic. Returns true/false.

// slips were logged as brand-new "received" orders while the real open order
// sat there forever. An order number printed on the slip that matches one

    if (oi.itemId && ids[oi.itemId]) { itemHits++; return; }
    var os = normSku(oi.sku);
    if (os && skus.some(function(s) { return skusAlike(s, os); })) { itemHits++; return; }
    var ot = matchTokens(oi.name || "");
    if (ot.length && nameToks.some(function(nt) { return tokenListsOverlap(ot, nt); })) itemHits++;

  score += itemHits * 3;
  // vendorHit is exported so the received-order (price-update) matcher can hold
  // itself to a stricter bar than the open-order matcher.
  return { score: score, itemHits: itemHits, numHit: numHit, vendorHit: vendorHit };
}

ACT.edSave = t => {
  edKeep(); const E = S.ui.ed, F = E.f;
  const name = F.name.trim(); if (!name) { toast('The supply needs a name.', { bad: true }); const n = $('#edName'); if (n) n.focus(); return; }
  const unit = (F.unit || 'unit').trim().toLowerCase(), big = F.big && Math.round(num(F.perBuy)) > 1, per = big ? Math.round(num(F.perBuy)) : 1;
  if (F.big && !big) return toast('How many ' + unitWord(unit, 2) + ' are in one ' + (F.buyUnit || 'case') + '?', { bad: true });
  const buyU = big ? (F.buyUnit || 'case').trim().toLowerCase() : null;
  if (big && buyU === unit) return toast('The bigger package needs its own name (like “case”).', { bad: true });
  const minRaw = String(F.min).trim(), min = minRaw === '' ? 0 : Math.max(0, Math.round(num(minRaw)));
  const old = E.id ? itemById(E.id) : null, oldSrcs = old ? allSources(old) : [];
  const sources = E.sources.filter(s => String(s.vendor).trim() || String(s.sku).trim() || num(s.price) > 0).map(s => {
    const p = num(s.price), prev = oldSrcs.find(o => o && o.vendor && o.vendor === s.vendor.trim());
    const out = { vendor: s.vendor.trim() || null, sku: s.sku.trim(), price: p > 0 ? Math.round(p / per * 10000) / 10000 : null, src: s.src.trim(), lastDate: s.lastDate || (prev && prev.lastDate) || '' };
    if (out.src && !/^https?:\/\//i.test(out.src)) out.src = 'https://' + out.src;
    return out;
  });
  if (sources.some(s => !s.vendor)) return toast('Each SKU or price needs a vendor (or clear that row).', { bad: true });
  const pieces = num(F.pieces);
  const rec = {
    name, cat: F.cat || 'misc', group: F.group.trim() || null, manufacturer: F.manufacturer.trim() || null, sku: F.sku.trim(), tags: tagsOf(F.tags).length ? tagsOf(F.tags) : null,
    location: F.location || null, note: F.note.trim() || null, exp: F.exp || '', min,
    unit, orderUnitName: cap1(unit), buyUnit: buyU, perBuy: big ? per : null,
    baseUnitName: pieces > 1 ? (F.piece || 'Unit') : null, baseUnitsPerOrderUnit: pieces > 1 ? pieces : 1, baseUnitQty: null,
    sources, vendorOrderPrice: sources[0] && sources[0].price != null ? round2(sources[0].price) : null
  };
  withWho(async () => {
    busyBtn(t, true, 'Saving…');
    try {
      const id = E.id || 'custom-' + uid();
      /* a new photo goes to Cloud Storage first; the record keeps its address */
      if (E.photo.changed) {
        if (E.photo.thumb) {
          const a = await B.uploadPhoto(id, dataUrlToBlob(E.photo.thumb), 'thumb');
          const b = E.photo.full && E.photo.full !== E.photo.thumb ? await B.uploadPhoto(id, dataUrlToBlob(E.photo.full), 'full') : a;
          rec.img = a.url; rec.imgFull = b.url;
        } else { rec.img = E.photo.img || null; rec.imgFull = E.photo.imgFull || null; }
        /* the new photo (or none) is the one shown: an older photo's address or a built-in one would come first otherwise */
        rec.imgUrl = null; rec.imgFullUrl = null; rec.imgKey = null;
      } else if (!E.id) { rec.img = E.photo.img || null; rec.imgFull = E.photo.imgFull || null; }
      if (E.id) await saveItem(Object.assign({ id }, rec), false);
      else {
        const q = num(F.qty);
        const item = await saveItem(Object.assign(rec, { id, qty: q > 0 ? q : 0, chk: q > 0 ? nowISO() : null, tag: null }), true);
        if (q > 0) await B.addLog([logEntry({ itemId: item.id, itemName: item.name, delta: q, note: 'Starting count', type: 'count' }, stamp())]);
      }
      S.ui.ed = null; closeModal(true);
      toast(E.id ? 'Saved.' : 'Added ' + plainText(name, 40) + '.');
      openDrawer('item', id);
    } catch (e) { busyBtn(t, false); toast(errText(e), { bad: true }); }
  }, E.id ? 'Who’s changing this supply?' : 'Who’s adding this supply?');
};

/* ---------- stock steps: count, add by hand, used some ---------- */
ACT.stockOpen = t => { const it = itemById(t.dataset.id); if (!it) return; if (S.ui.ed) { S.ui.ed = null; closeModal(true); } openStock(it, t.dataset.mode || 'count'); };
ACT.countIt = t => { const it = itemById(t.dataset.id); if (it) openStock(it, 'count'); };
function openStock(it, mode) {
  S.ui.stk = { id: it.id, mode };
  const u = countUnit(it), q = Number(it.qty) || 0;
  const tabs = [['count', 'Count'], ['add', 'Add'], ['use', 'Used']];
  openModal('<h3>' + esc(it.name) + '</h3><div class="lsub"><b>' + esc(qtyUnit(q, u)) + '</b> on hand' + (it.chk ? ' · last counted ' + esc(fmtWhen(it.chk)) + (it.chkBy ? ' by ' + esc(it.chkBy) : '') : '') + '</div>' +
    '<div class="seg" style="margin-bottom:14px">' + tabs.map(([k, l]) => '<button data-act="stkMode" data-m="' + k + '" aria-pressed="' + (mode === k) + '">' + l + '</button>').join('') + '</div>' +
    '<div class="hint" id="stkHelp" style="margin:-4px 0 10px">' + stkHelp(it, mode) + '</div>' +
    '<div class="gap8" style="margin-bottom:6px;flex-wrap:wrap"><div class="qty lg"><button data-act="stkStep" data-n="-1" aria-label="Less">−</button><input id="stkQty" type="number" inputmode="decimal" min="0" step="any" value="' + (mode === 'count' ? esc(qtyFmt(q)) : '1') + '" data-enter="#stkGo" data-inp="stkInp" aria-label="How many"><span class="u">' + esc(unitWord(u, 2)) + '</span><button data-act="stkStep" data-n="1" aria-label="More">+</button></div><span class="small" id="stkDiff" style="font-weight:600"></span></div>' +
    (perBuy(it) > 1 ? '<div class="hint" style="margin-bottom:10px">In ' + esc(unitWord(u, 2)) + ', not ' + esc(unitWord(buyUnit(it), 2)) + ' (a ' + esc(buyUnit(it)) + ' is ' + perBuy(it) + ').</div>' : '') +
    '<div class="grid2">' + field('Note (optional)', '<input id="stkNote" placeholder="' + (mode === 'add' ? 'e.g. samples from the rep' : mode === 'use' ? 'e.g. used in the lab' : 'e.g. found a box in the lab') + '">') +
    field('Expires (optional)', '<input id="stkExp" type="date" value="' + esc(/^\d{4}-\d{2}-\d{2}$/.test(it.exp || '') ? it.exp : '') + '">') + '</div>' +
    '<div id="stkCostRow"' + (mode === 'add' ? '' : ' style="display:none"') + '>' + field('Paid (optional)', '<input id="stkCost" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00">', 'Counts toward this month’s supply spending. Leave it empty for free samples.') + '</div>' +
    '<div class="mFt"><button class="btn btn-sec" data-act="closeModal">Cancel</button><button class="btn btn-pri" id="stkGo" data-act="stkGo">' + stkLabel(mode) + '</button></div>', { cls: 'mid', focus: '#stkQty' });
  INP.stkInp();
}
function stkHelp(it, m) { const u = unitWord(countUnit(it), 2); return m === 'count' ? 'How many ' + esc(u) + ' are on the shelf right now?' : m === 'add' ? 'Came in without an order (a sample, a store run)? Add it here. Orders are received under Orders.' : 'How many ' + esc(u) + ' were used or thrown out?'; }
function stkLabel(m) { return m === 'count' ? 'Save the count' : m === 'add' ? 'Add to stock' : 'Take off stock'; }
ACT.stkMode = t => {
  const it = itemById(S.ui.stk.id), m = t.dataset.m; if (!it) return; S.ui.stk.mode = m;
  $$('[data-act="stkMode"]').forEach(b => b.setAttribute('aria-pressed', String(b === t)));
  $('#stkHelp').innerHTML = stkHelp(it, m); $('#stkGo').textContent = stkLabel(m); $('#stkCostRow').style.display = m === 'add' ? '' : 'none';
  $('#stkQty').value = m === 'count' ? qtyFmt(Number(it.qty) || 0) : '1';
  const n = $('#stkNote'); if (n) n.placeholder = m === 'add' ? 'e.g. samples from the rep' : m === 'use' ? 'e.g. used in the lab' : 'e.g. found a box in the lab';
  INP.stkInp();
};
ACT.stkStep = t => { const i = $('#stkQty'); i.value = Math.max(0, (num(i.value) || 0) + Number(t.dataset.n)); INP.stkInp(); };
INP.stkInp = () => {
  const it = itemById(S.ui.stk.id), el = $('#stkDiff'); if (!it || !el) return;
  const n = num(val('stkQty')), q = Number(it.qty) || 0, m = S.ui.stk.mode;
  if (m === 'count') { const d = round2(n - q); el.textContent = val('stkQty') === '' || !d ? '' : (d > 0 ? '+' : '−') + qtyUnit(Math.abs(d), countUnit(it)) + ' from what the app had'; el.style.color = d > 0 ? 'var(--mint-700)' : 'var(--amber-700)'; }
  else { el.textContent = n > 0 ? '→ ' + qtyUnit(Math.max(0, round2(m === 'add' ? q + n : q - n)), countUnit(it)) + ' on hand' : ''; el.style.color = 'var(--grey-500)'; }
};
ACT.stkGo = t => {
  const it = itemById(S.ui.stk.id), m = S.ui.stk.mode, n = num(val('stkQty'), -1); if (!it) return closeModal(true);
  if (m === 'count' ? n < 0 || val('stkQty') === '' : !(n > 0)) return toast(m === 'count' ? 'Type the count.' : 'How many?', { bad: true });
  const note = val('stkNote').trim(), exp = val('stkExp'), cost = num(val('stkCost'));
  withWho(async () => {
    busyBtn(t, true, 'Saving…');
    const ok = await act(async () => {
      if (m === 'count') await stockStep(it, 0, 'count', note || 'Counted', n);
      else if (m === 'use') { const live = Number((itemById(it.id) || it).qty) || 0; await stockStep(it, -Math.min(n, live), 'use', note || null); }
      else await stockStep(it, n, 'receive', note || 'Added by hand', null, cost > 0 ? { amount: round2(cost), amountReason: 'paid' } : null);
      const was = /^\d{4}-\d{2}-\d{2}$/.test(it.exp || '') ? it.exp : '';
      if (exp !== was && (exp || was)) await B.patchItem(it.id, { exp: exp || '' });
    }, m === 'count' ? 'Saved: ' + qtyUnit(n, countUnit(it)) + '.' : m === 'add' ? 'Added ' + qtyUnit(n, countUnit(it)) + '.' : 'Took ' + qtyUnit(n, countUnit(it)) + ' off.');
    if (ok) closeModal(true); else busyBtn(t, false);
  }, m === 'count' ? 'Who counted?' : m === 'add' ? 'Who’s adding it?' : 'Who used it?');
};

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
<script src="nlo-home.js" defer></script>
<script src="nlo-aisa.js" defer></script>
