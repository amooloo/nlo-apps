<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-xiF0oOiRNlXvEg/ry1vEmso/pLJYJZdpblhXXx289Ks=' https://www.gstatic.com/firebasejs/10.12.2/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://www.google.com/images/cleardot.gif; connect-src 'self' https://*.googleapis.com https://aisa-worker.akhavan-ak.workers.dev http://127.0.0.1:8080 http://127.0.0.1:9099; frame-src https://nlo-cases.firebaseapp.com; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="theme-color" content="#1B2F4C">
<title>NLO A/R</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* NLO brand palette — same values as Staff Hub / Onboarding */
  --navy-900:#11203A; --navy:#1B2F4C; --navy-700:#294169; --navy-600:#385686; --navy-500:#5471A0; --navy-100:#E8ECF2;
  --blue-800:#122874; --blue-700:#16318C; --blue:#1D3EA9; --blue-500:#2E52C9; --blue-200:#BCC8EE; --blue-100:#E5EAF8;
  --coral-700:#D8412E; --coral-600:#EE4F3A; --coral:#FA624D; --coral-200:#FFC8BF; --coral-100:#FFE7E1;
  --mint-700:#1F9E7E; --mint-600:#34C49E; --mint:#64F4C9; --mint-200:#C0FBEC; --mint-100:#E2FBF4;
  --amber-700:#C2820A; --amber-600:#E29A14; --amber:#F6AF24; --amber-200:#FCE2A6; --amber-100:#FEF2D7;
  --grey-50:#F7F8F9; --grey-100:#ECEEF0; --grey-200:#DCE0E4; --grey-300:#C3C9D0; --grey-400:#969FAB; --grey-500:#6B7685; --grey-600:#4C5868; --grey-700:#33404F;
  --off:#F2F3F4; --card:#FFFFFF;
  --fd:'Oswald',system-ui,sans-serif;
  --fb:'Montserrat',system-ui,-apple-system,sans-serif;
  --sh-xs:0 1px 2px rgba(17,32,58,.07); --sh-sm:0 2px 6px rgba(17,32,58,.08);
  --sh-md:0 8px 24px rgba(17,32,58,.10); --sh-lg:0 18px 48px rgba(17,32,58,.15); --sh-xl:0 32px 70px rgba(17,32,58,.22);
  --r-sm:8px; --r:14px; --r-lg:22px;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--fb);background:var(--off);color:var(--grey-700);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--grey-700)}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue-500);outline-offset:2px;border-radius:4px}
svg.i{flex:none;display:inline-block;vertical-align:-3px}
.hidden{display:none !important}
.muted{color:var(--grey-500)}
.small{font-size:12.5px}

/* ---------- Demo banner ---------- */
#demoBar{position:fixed;left:0;right:0;bottom:0;z-index:2000;background:var(--amber);color:var(--navy-900);text-align:center;font-family:var(--fd);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px;padding:7px 12px}

/* ---------- Lock ---------- */
#lockWrap{position:fixed;inset:0;background:linear-gradient(158deg,var(--navy-900) 0%,var(--navy) 62%,#20395C 100%);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;overflow:hidden auto}
#lockWrap::before{content:"";position:absolute;width:680px;height:680px;border-radius:50%;border:88px solid rgba(255,255,255,.03);top:-300px;right:-220px;pointer-events:none}
#lockWrap::after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;border:70px solid rgba(100,244,201,.045);bottom:-260px;left:-180px;pointer-events:none}
.lockCol{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;width:100%;max-width:440px;margin:auto;padding:24px 0}
.lockBrand{display:flex;flex-direction:column;align-items:center;gap:14px}
.lockBrand img{width:160px;height:auto;display:block}
.appTag{font-family:var(--fd);font-weight:500;font-size:13px;letter-spacing:.34em;text-transform:uppercase;color:var(--mint);text-indent:.34em}
.lockCard{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-xl);width:100%;padding:32px 34px 28px}
.lockCard h1{font-family:var(--fd);font-weight:600;font-size:22px;letter-spacing:.03em;text-transform:uppercase;color:var(--navy)}
.lockCard .lsub{font-size:12.5px;color:var(--grey-500);margin-top:3px}
.lockCard p.desc{color:var(--grey-500);font-size:13.5px;margin:12px 0 18px}
.lockErr{background:var(--coral-100);color:var(--coral-700);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:500;margin-bottom:14px}
.lockOk{background:var(--mint-100);color:var(--mint-700);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:500;margin-bottom:14px}
.lockFoot{margin-top:16px;font-size:12px;color:var(--grey-400);text-align:center}
.lockFoot a,.linkBtn{color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.lockMeta{display:flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:.06em;color:#9DB0CC;text-transform:uppercase;font-family:var(--fd);font-weight:500}
.ackBox{display:flex;gap:10px;align-items:flex-start;background:var(--amber-100);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--amber-700);margin-bottom:16px;line-height:1.5}
.ackBox input{margin-top:2px;accent-color:var(--amber-600)}
.codeBox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;letter-spacing:.08em;background:var(--grey-50);border:1.5px dashed var(--grey-300);border-radius:12px;padding:16px;text-align:center;color:var(--navy);word-break:break-all;margin:6px 0 14px;user-select:all}

/* ---------- Fields ---------- */
.field{margin-bottom:14px}
.field label,.flabel{display:block;font-family:var(--fd);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey-500);margin-bottom:6px}
.field input,.field select,.field textarea,.inp{width:100%;padding:10px 13px;border:1.5px solid var(--grey-200);border-radius:10px;background:#fff;outline:none;transition:border-color .14s var(--ease),box-shadow .14s var(--ease);min-height:42px}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-100)}
.field textarea{resize:vertical;min-height:70px;line-height:1.45}
.field .hint{font-size:11.5px;color:var(--grey-500);margin-top:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 14px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:9px 20px;border-radius:999px;font-family:var(--fd);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;line-height:1.1;white-space:nowrap;transition:background .14s var(--ease),transform .14s var(--ease),box-shadow .14s var(--ease)}
.btn:active{transform:scale(.985)}
.btn-pri{background:var(--navy);color:#fff;box-shadow:var(--sh-xs)}
.btn-pri:hover{background:var(--navy-900);box-shadow:var(--sh-md)}
.btn-act{background:var(--blue);color:#fff}
.btn-act:hover{background:var(--blue-700)}
.btn-sec{background:#fff;border:1.5px solid var(--grey-300);color:var(--navy)}
.btn-sec:hover{background:var(--grey-100)}
.btn-danger{background:var(--coral-600);color:#fff}
.btn-danger:hover{background:var(--coral-700)}
.btn-mint{background:var(--mint);color:var(--navy-900)}
.btn-mint:hover{background:var(--mint-600)}
.btn-ghost{color:var(--grey-600);padding:6px 12px;min-height:34px;border-radius:999px;font-family:var(--fb);font-weight:600;font-size:12.5px;letter-spacing:0;text-transform:none}
.btn-ghost:hover{background:var(--grey-100);color:var(--navy)}
.btn-sm{min-height:34px;padding:6px 14px;font-size:12px}
.btn-block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none !important;box-shadow:none !important}
.iconBtn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--grey-600)}
.iconBtn:hover{background:var(--grey-100);color:var(--navy)}

/* ---------- Shell ---------- */
#app{display:flex;min-height:100vh}
#side{width:232px;flex:none;background:var(--navy);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sideTop{padding:28px 22px 20px;border-bottom:1px solid rgba(255,255,255,.07)}
.sideTop img{width:126px;height:auto;display:block}
.sideTop .appTag{margin-top:12px;font-size:11px;letter-spacing:.3em;text-indent:0;text-align:left}
.nav{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.navLbl{font-family:var(--fd);font-weight:500;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#7E92B5;padding:14px 12px 6px}
.navBtn{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:10px;color:#C9D4E5;font-weight:600;font-size:13.5px;text-align:left}
.navBtn:hover{background:rgba(255,255,255,.06);color:#fff}
.navBtn.on{background:rgba(100,244,201,.12);color:var(--mint)}
.navBtn .cnt{margin-left:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.12);color:#fff;border-radius:99px;padding:1px 8px}
.navBtn .cnt.red{background:var(--coral-600)} .navBtn .cnt.amber{background:var(--amber);color:var(--navy-900)}
.sideFoot{margin-top:auto;padding:16px 20px 22px;border-top:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;gap:10px}
.whoBox{display:flex;align-items:center;gap:10px;font-size:12.5px;color:#DCE4EE}
.whoBox b{display:block;color:#fff;font-size:13px}
.sideLock{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:9px 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,.22);color:#DCE4EE;font-family:var(--fd);font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
.sideLock:hover{background:rgba(255,255,255,.09);color:#fff}
.syncLine{display:flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--fd);font-weight:500;color:#9DB0CC}
.dot{width:8px;height:8px;border-radius:50%;background:var(--grey-400);flex:none}
.dot.ok{background:var(--mint)} .dot.busy{background:var(--amber)} .dot.bad{background:var(--coral)}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
.topBar{display:flex;align-items:center;gap:14px;padding:18px 28px 14px;position:sticky;top:0;z-index:20;background:var(--off)}
.topBar h2{font-family:var(--fd);font-weight:600;font-size:24px;letter-spacing:.02em;text-transform:uppercase;color:var(--navy);white-space:nowrap}
.searchBox{flex:1;max-width:380px;margin-left:auto;position:relative}
.searchBox input{width:100%;padding:10px 14px 10px 38px;border-radius:999px;border:1.5px solid var(--grey-200);background:#fff;outline:none;min-height:42px}
.searchBox input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-100)}
.searchBox svg{position:absolute;left:13px;top:12px;color:var(--grey-400)}
#view{padding:4px 28px 60px;flex:1}
.mobBar{display:none}

/* ---------- Cards / tiles ---------- */
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh-xs);border:1px solid var(--grey-100)}
.cardHd{display:flex;align-items:center;gap:10px;padding:16px 20px 12px}
.cardHd h3{font-family:var(--fd);font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--navy)}
.cardHd .sub{font-size:12px;color:var(--grey-500)}
.cardBd{padding:4px 20px 18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile{background:#fff;border-radius:var(--r);border:1px solid var(--grey-100);box-shadow:var(--sh-xs);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:92px;transition:box-shadow .14s var(--ease),transform .14s var(--ease)}
.tile:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
.tile .n{font-family:var(--fd);font-weight:600;font-size:30px;line-height:1.1;color:var(--navy)}
.tile .l{font-size:12.5px;font-weight:600;color:var(--grey-600)}
.tile.red .n{color:var(--coral-700)} .tile.amber .n{color:var(--amber-700)} .tile.blue .n{color:var(--blue)} .tile.mint .n{color:var(--mint-700)}
.twoCol{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}

/* ---------- Due groups ---------- */
.dueGrp{margin-bottom:6px}
.dueGrp h4{font-family:var(--fd);font-weight:500;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey-500);padding:12px 0 6px;border-bottom:1px solid var(--grey-100)}
.dueGrp h4.red{color:var(--coral-700)}
.row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid var(--grey-100);cursor:pointer;border-radius:8px;width:100%;text-align:left}
.row:hover{background:var(--grey-50)}
.row .pt{font-weight:700;color:var(--navy);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:12px;color:var(--grey-500);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.empty{padding:28px 10px;text-align:center;color:var(--grey-500);font-size:13px}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap;background:var(--grey-100);color:var(--grey-600)}
.badge.t-aligner{background:var(--blue-100);color:var(--blue-700)}
.badge.t-lab{background:var(--mint-100);color:var(--mint-700)}
.badge.t-appl{background:var(--navy-100);color:var(--navy-700)}
.badge.t-ret{background:var(--amber-100);color:var(--amber-700)}
.badge.t-retx{background:var(--coral-100);color:var(--coral-700)}
.badge.t-misc{background:var(--grey-100);color:var(--grey-600)}
.due{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap;background:var(--grey-100);color:var(--grey-600)}
.due.over{background:var(--coral-100);color:var(--coral-700)}
.due.soon{background:var(--amber-100);color:var(--amber-700)}
.due.none{background:transparent;color:var(--grey-400);font-weight:600}
.av{width:28px;height:28px;border-radius:50%;background:var(--navy-600);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none;letter-spacing:.02em}
.av.none{background:var(--grey-200);color:var(--grey-500)}
.av.lg{width:36px;height:36px;font-size:13px;display:inline-flex;border-radius:50%;margin:0;vertical-align:middle}

/* ---------- Board ---------- */
.boardTabs,.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1.5px solid var(--grey-200);border-radius:99px;padding:6px 14px;font-size:12.5px;font-weight:600;color:var(--grey-600);background:#fff;min-height:36px}
.chip:hover{border-color:var(--navy-500);color:var(--navy)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .c{opacity:.7;margin-left:4px}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;scroll-snap-type:x proximity}
.col{flex:1 0 225px;max-width:320px;background:var(--grey-100);border-radius:var(--r);padding:10px;scroll-snap-align:start;max-height:calc(100vh - 230px);display:flex;flex-direction:column}
.colHd{display:flex;align-items:center;gap:8px;padding:4px 6px 10px}
.colHd h4{font-family:var(--fd);font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.colHd .c{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--grey-500)}
.colBd{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:40px;padding:2px}
.kc{position:relative;background:#fff;border-radius:11px;box-shadow:var(--sh-xs);border:1px solid var(--grey-200);padding:10px 11px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;width:100%}
.kc:hover{box-shadow:var(--sh-md);border-color:var(--grey-300)}
.kc .pt{font-weight:700;color:var(--navy);font-size:13.5px;line-height:1.3;padding-right:36px}
.kc .dt{font-size:12px;color:var(--grey-500);line-height:1.35}
.kc .ft{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kc .adv{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--blue);background:var(--blue-100)}
.kc .adv:hover{background:var(--blue);color:#fff}

/* ---------- Table ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select{padding:8px 12px;border:1.5px solid var(--grey-200);border-radius:999px;background:#fff;font-weight:600;font-size:12.5px;min-height:38px;color:var(--grey-700)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-family:var(--fd);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--grey-500);padding:11px 14px;border-bottom:1px solid var(--grey-100);white-space:nowrap}
.tbl th button{font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--grey-100);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.click{cursor:pointer}
.cleanup{margin-bottom:18px;border:1.5px solid var(--amber-200)}
.cleanup .oldPick select{margin-left:6px;padding:5px 8px;border-radius:8px;border:1.5px solid var(--grey-200);font:inherit;font-size:12.5px}
.cleanup .oldNo{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.oldList{max-height:320px;overflow:auto;border:1px solid var(--grey-100);border-radius:10px}
.oldRow{display:grid;grid-template-columns:22px minmax(0,1.2fr) minmax(0,1.6fr) auto;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--grey-100);cursor:pointer}
.oldRow:last-child{border-bottom:none}
.oldRow:hover{background:var(--grey-50)}
.oldRow input{width:17px;height:17px;accent-color:var(--navy)}
.oldRow .pt{font-weight:700;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oldRow .muted{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oldD{color:var(--coral-700);font-weight:600}
.oldAct{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.oldAct b{font-size:13px;color:var(--navy);margin-right:4px}
.tbl tr.click:hover td{background:var(--grey-50)}
.tbl .pt{font-weight:700;color:var(--navy)}
.tblWrap{overflow-x:auto}

/* ---------- Drawer ---------- */
#scrim{position:fixed;inset:0;background:rgba(17,32,58,.35);z-index:900}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;z-index:901;box-shadow:var(--sh-xl);display:flex;flex-direction:column}
.dHd{padding:20px 22px 14px;border-bottom:1px solid var(--grey-100);display:flex;gap:12px;align-items:flex-start}
.dHd h3{font-family:var(--fd);font-weight:600;font-size:21px;letter-spacing:.02em;color:var(--navy);line-height:1.2}
.dHd .sub{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.dBd{flex:1;overflow-y:auto;padding:16px 22px 26px}
.dFt{padding:12px 22px;border-top:1px solid var(--grey-100);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sec{margin-top:18px}
.sec h5{font-family:var(--fd);font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey-500);margin-bottom:8px}
.stepper{display:flex;flex-direction:column;gap:6px}
.step{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--grey-200);text-align:left;font-weight:600;font-size:13px;color:var(--grey-600);background:#fff;min-height:40px}
.step:hover{border-color:var(--blue-200);background:var(--blue-100)}

/* the goals (handbook §19): one gauge per goal — the rate, a bar with the goal marked, and how many accounts to go */

.goal .gTop{display:flex;align-items:baseline;gap:10px;justify-content:space-between}

.goal .gMid{display:flex;align-items:center;gap:12px;margin:4px 0 2px}

.goal.ok .gBar i{background:var(--mint-600)} .goal.near .gBar i{background:var(--amber)} .goal.far .gBar i{background:var(--coral-600)}

/* ---------- the new-user tour (tour.js, 5 Oct 2026 — as in NLO Cases): a ring around what a step points at (dimming the rest;
   clicks go through to the page) and the step's card; on a phone the card is a sheet at the bottom ---------- */
#tourRing{position:fixed;z-index:3000;pointer-events:none;border-radius:12px;box-shadow:0 0 0 3px var(--mint),0 0 0 9999px rgba(17,32,58,.42)}

#tourCard .tcDo{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--amber-100);color:var(--navy-900);font-weight:700;font-size:13.5px;margin-bottom:10px}
#tourCard.ok .tcDo{background:var(--mint-100);color:var(--mint-700)}
#tourCard .tcBtns{display:flex;align-items:center;gap:8px}
.tourOffer{margin-bottom:18px;border:1.5px solid var(--mint-200);background:var(--mint-100)}
.tourOffer .cardBd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px}

/* =====================================================================

/* ---------- Firebase project (same project as NLO Cases) ---------- */

/* ---------- small utils ---------- */
const $ = (s, r) => (r || document).querySelector(s);

function isoOf(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

function fmtDate(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-').map(Number); const dt = new Date(y, m - 1, d); const opts = { month: 'short', day: 'numeric' }; if (y !== new Date().getFullYear()) opts.year = 'numeric'; return dt.toLocaleDateString('en-US', opts); }

function fmtDay(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); }

function officeHolidays(y) {
  const nth = (m, wd, n) => { const d = new Date(y, m, 1); d.setDate(1 + (wd - d.getDay() + 7) % 7 + (n - 1) * 7); return d; };

  let d = iso;
  for (let i = 0; i < 30; i++) {
    const [y, m, dd] = d.split('-').map(Number), wd = new Date(y, m - 1, dd).getDay();

  async openJSON(key, box, aad) { return JSON.parse(TD.decode(await Crypto.open(key, box, aad))); },
  /* a whole report: JSON → gzip → AES-GCM */

  async openBig(key, box, aad) { return JSON.parse(TD.decode(await gunzip(await Crypto.open(key, box, aad)))); },

  },
  async sealTo(pub, bytes, info) {

   "Days" column (the most days past due of any unpaid charge on the

/* =====================================================================

/* =====================================================================

  /* owner: my copy can't be opened (new password via the recovery code) → open the recovery copy with the code */
  async arRestore(code) {
    const [r, e] = await Promise.all([FB.db.doc('meta/recovery').get(), FB.db.doc('meta/arEscrow').get()]);
    if (!e.exists) throw errCode('no-escrow');
    let ring;
    try {
      const rpriv = await Crypto.importPriv(await Crypto.pwOpen(recoveryCodeNorm(code), r.data().priv, 'recovery-priv'));
      ring = Crypto.ringFrom(await Crypto.openFrom(rpriv, e.data().ring, 'arring:recovery'));
    } catch (x) { throw errCode('bad-code'); }
    const v = Math.max.apply(null, Object.keys(ring).map(Number));
    await FB.track(FB.db.doc('arAccess/' + FB.uid).set(await FB.grantDoc(FB.uid, FB.me.pub, FB.me.staffId, ring, v)));
    const k = await FB.db.doc('meta/arKeys').get();
    FB.ar = { ring, keys: await Crypto.ringKeys(ring), curV: k.exists ? k.data().current : v, ringV: v, idx: await Crypto.idxKey(ring) };
  },
  /* owner: everyone with A/R, the office team, and whether the recovery copy is current */
  async arPeople() {
    const [gs, ms, esc, rec] = await Promise.all([FB.db.collection('arAccess').get(), FB.db.collection('members').get(), FB.db.doc('meta/arEscrow').get(), FB.db.doc('meta/recovery').get()]);
    return {
      grants: gs.docs.map(d => Object.assign({ uid: d.id }, d.data())),
      members: ms.docs.map(d => Object.assign({ uid: d.id }, d.data())),
      hasRecovery: rec.exists && !!(rec.data().pub),
      escrowOk: esc.exists && rec.exists && esc.data().recX === (rec.data().pub || {}).x && esc.data().ringV === FB.ar.curV
    };
  },
  async writeTeam(grantsAfter) {
    const sids = Array.from(new Set(grantsAfter.map(g => g.sid).filter(Boolean)));
    await FB.db.doc('meta/arTeam').set({ sids, at: FB.ts() });
  },
  /* owner: give someone A/R (they need to have signed in once, so they have a key pair) */
  /* One change to who holds the A/R key at a time — across tabs and Dr. A's devices. Two key changes at once could leave
     things sealed with a key nobody was given, so each takes a short lock (a document only Dr. A can write; one left behind
     by a closed tab is ignored after 10 minutes), starts from the current key, and lets go before re-sealing. */
  async withKeyLock(fn) {
    const ref = FB.db.doc('meta/arKeyLock'), me = FB.uid + ':' + uid8();
    await FB.track(FB.db.runTransaction(async tx => {
      const s = await tx.get(ref);
      if (s.exists) { const at = FB.tsMs(s.data().at); if (at && Date.now() - at < 10 * 60000) throw errCode('busy', 'A/R’s key is being changed on another screen. Try again in a minute.'); }
      tx.set(ref, { by: me, at: FB.ts() });
    }));
    FB.rotating = true;
    try { await FB.arReload(); return await fn(); }
    finally {
      FB.rotating = false;
      try { const s = await ref.get(); if (s.exists && s.data().by === me) await ref.delete(); } catch (e) { }
    }
  },
  /* owner: give someone A/R (they need to have signed in once, so they have a key pair) */
  async arGrant(m) {
    if (!m.pub || !m.active) throw errCode('no-pub', (m.name || 'They') + ' needs to sign in once (and choose a password) first.');
    await FB.withKeyLock(async () => {
      await FB.track(FB.db.doc('arAccess/' + m.uid).set(await FB.grantDoc(m.uid, m.pub, m.staffId, FB.ar.ring, FB.ar.curV)));
      const p = await FB.arPeople(); await FB.writeTeam(p.grants);
    });
  },
  /* owner: take A/R away — their copy is deleted (the database refuses them at once), then a new A/R key is made and
     everything is sealed again under it, so nothing they could have kept opens anything saved from now on */
  async arRevoke(uid, progress) {
    await FB.withKeyLock(async () => { await FB.track(FB.db.doc('arAccess/' + uid).delete()); await FB.newKey(); });
    return FB.arReseal(progress);
  },
  async arRotate(progress) {
    await FB.withKeyLock(() => FB.newKey());
    return FB.arReseal(progress);
  },
  /* (inside the lock) a new key version for everyone still allowed, then the recovery copy and the team, then the switch */
  async newKey() {
    const newV = FB.ar.curV + 1, ring2 = Object.assign({}, FB.ar.ring, { [newV]: Crypto.newRingKey() });
    const p = await FB.arPeople(), mem = new Map(p.members.map(m => [m.uid, m])), writes = [], keep = [];
    for (const g of p.grants) {
      const m = mem.get(g.uid);
      if (!m || !m.active || !m.pub) { writes.push(b => b.delete(FB.db.doc('arAccess/' + g.uid))); continue; }
      const gd = await FB.grantDoc(g.uid, m.pub, m.staffId, ring2, newV);
      writes.push(b => b.set(FB.db.doc('arAccess/' + g.uid), gd)); keep.push(m.staffId);
    }
    // a few per batch: each one's rule looks the person up, and one batch may only look up so many documents
    for (let i = 0; i < writes.length; i += 5) { const b = FB.db.batch(); writes.slice(i, i + 5).forEach(w => w(b)); await FB.track(b.commit()); }
    const b2 = FB.db.batch(), esc = await FB.escrowDoc(ring2, newV);
    if (esc) b2.set(FB.db.doc('meta/arEscrow'), esc);
    b2.set(FB.db.doc('meta/arTeam'), { sids: Array.from(new Set(keep)), at: FB.ts() });
    await FB.track(b2.commit());
    // only now does anything get sealed with the new key (everyone who keeps A/R already has it)
    await FB.track(FB.db.doc('meta/arKeys').update({ current: newV }));
    FB.ar = { ring: ring2, keys: await Crypto.ringKeys(ring2), curV: newV, ringV: newV, idx: FB.ar.idx };
  },
  /* owner: seal everything still under an older A/R key with the newest one */
  async arReseal(progress) {
    if (FB.resealing) return { reports: 0, items: 0, failed: 0 };
    FB.resealing = true;
    try { return await FB._reseal(progress); } finally { FB.resealing = false; }
  },
  async _reseal(progress) {
    const v = FB.ar.curV, key = FB.ar.keys[v];
    const reps = (await FB.db.collection('arReports').get()).docs.filter(d => d.data().v < v);
    const items = (await FB.db.collection('arItems').get()).docs.filter(d => d.data().v < v);
    const total = reps.length + items.length; let n = 0, failed = 0;
    for (const d of reps) {
      try {
        const x = d.data(), dataRef = FB.db.doc('arReportData/' + d.id), big = (await dataRef.get()).data();
        const rep = await Crypto.openBig(FB.ar.keys[big.v], big, 'arrep:' + d.id), sum = await Crypto.openJSON(FB.ar.keys[x.v], x.sum, 'arsum:' + d.id);
        const b = FB.db.batch(), box = await Crypto.sealBig(key, rep, 'arrep:' + d.id), sbox = await Crypto.sealJSON(key, sum, 'arsum:' + d.id);
        b.set(dataRef, { v, iv: box.iv, ct: box.ct });
        b.update(d.ref, { v, sum: sbox });
        await FB.track(b.commit());
      } catch (e) { failed++; }
      if (progress) progress(++n, total);
    }
    for (let i = 0; i < items.length; i += 10) {
      await Promise.all(items.slice(i, i + 10).map(d => FB.mutateItem(d.id, () => { }, { a: 'rekey' }).catch(() => { failed++; })));
      n += Math.min(10, items.length - i); if (progress) progress(n, total);
    }
    return { reports: reps.length, items: items.length, failed };
  },
  /* owner, after someone's login was reissued (a new key pair, a new sign-in id): move their A/R to the new one */
  async arFixGrants() {
    const out = { removed: [], relogin: [], resealed: [] }; let removed = false;
    await FB.withKeyLock(async () => {
      const p = await FB.arPeople(), mem = new Map(p.members.map(m => [m.uid, m]));
      for (const g of p.grants) {
        const m = mem.get(g.uid);
        if (m && m.active) {
          // same login, but its copy is for an older key pair or an older key: seal it again
          if (m.pub && g.uid !== FB.uid && (g.pubX !== m.pub.x || (g.ringV || 0) < FB.ar.curV)) { await FB.track(FB.db.doc('arAccess/' + g.uid).set(await FB.grantDoc(g.uid, m.pub, m.staffId, FB.ar.ring, FB.ar.curV))); out.resealed.push(m.name); }
          continue;
        }
        // the login was turned off (removed, or reissued as a new login): its copy goes and a new key is made.
        // A new login with the same username may be the same person or someone new, so Dr. A turns A/R on again himself.
        await FB.track(FB.db.doc('arAccess/' + g.uid).delete()); removed = true;
        const now = p.members.find(x => x.active && x.staffId === g.sid && x.uid !== g.uid);
        (now ? out.relogin : out.removed).push((now && now.name) || (m && m.name) || g.sid);
      }
      if (!p.escrowOk && p.hasRecovery) { const esc = await FB.escrowDoc(FB.ar.ring, FB.ar.curV); if (esc) await FB.track(FB.db.doc('meta/arEscrow').set(esc)); }
      if (removed) await FB.newKey();
    });
    if (removed) await FB.arReseal();
    return out;
  },

  /* =====================================================================
     Live data
     ===================================================================== */
  start(h) {
    FB.stop();
    const uid = FB.uid;
    FB.unsubs.push(FB.db.doc('members/' + uid).onSnapshot(s => { if (!s.exists || !s.data().active) h.revoked(); }, e => h.revoked(e)));
    // my copy of the A/R key: taken away (revoked), or sealed again under a new key (re-load it)
    FB.unsubs.push(FB.db.doc('arAccess/' + uid).onSnapshot(async s => {
      if (!s.exists) { if (!FB.isOwner()) h.revoked('ar'); return; }
      const g = s.data();
      if (FB.ar && g.ringV && g.ringV !== FB.ar.ringV) { try { await FB.arLoad(g); h.rekeyed(); } catch (e) { h.error(e); } }
    }, e => { if (!FB.isOwner()) h.revoked('ar'); }));
    FB.unsubs.push(FB.db.doc('meta/arKeys').onSnapshot(s => {
      if (!s.exists || !FB.ar) return; const cur = s.data().current;
      if (FB.ar.keys[cur]) FB.ar.curV = cur; else FB.arReload().catch(() => { });
    }, () => { }));
    FB.unsubs.push(FB.db.doc('meta/settings').onSnapshot(s => h.settings(s.exists ? s.data() : {}), () => { }));
    FB.unsubs.push(FB.db.doc('meta/arTeam').onSnapshot(s => h.team(s.exists ? (s.data().sids || []) : []), () => h.team([])));
    FB.unsubs.push(FB.db.collection('roster').onSnapshot(s => h.roster(s.docs.map(d => Object.assign({ sid: d.id }, d.data()))), e => h.error(e)));
    FB.unsubs.push(FB.db.collection('arReports').onSnapshot(async snap => {
      const list = [];
      for (const d of snap.docs) list.push(await FB.repMeta(d.id, d.data()));
      h.reports(list.sort((a, b) => (b.asOf > a.asOf ? 1 : b.asOf < a.asOf ? -1 : (b.at || 0) - (a.at || 0))));
    }, e => h.loadError(e)));
    FB.unsubs.push(FB.db.collection('arItems').where('status', '==', 'open').onSnapshot(async snap => {
      const up = [], gone = [], left = [];
      for (const ch of snap.docChanges()) {
        if (ch.type === 'removed') { left.push(ch.doc.id); continue; }
        try { up.push(await FB.decryptItem(ch.doc.id, ch.doc.data())); }
        catch (e) { up.push({ id: ch.doc.id, locked: true, state: 'open', log: [] }); }
      }
      // an account that left the open list was resolved: fetch it as it is now, so it shows as resolved
      for (const id of left) { let it = null; try { it = await FB.getItem(id); } catch (e) { } if (it) up.push(it); else gone.push(id); }
      h.items(up, gone, snap.metadata.fromCache);
    }, e => h.loadError(e)));
  },
  async repMeta(id, x) {
    let sum = null; try { sum = await Crypto.openJSON(FB.ar.keys[x.v], x.sum, 'arsum:' + id); } catch (e) { }
    return { id, asOf: x.asOf, n: x.n, at: FB.tsMs(x.at), by: x.uid, sid: x.sid, v: x.v, sum, locked: !sum };
  },
  /* one saved report, opened */
  async loadReport(id) {
    const s = await FB.db.doc('arReportData/' + id).get(); if (!s.exists) throw errCode('gone');
    const x = s.data(); const key = FB.ar.keys[x.v]; if (!key) throw errCode('no-key');
    return Crypto.openBig(key, x, 'arrep:' + id);
  },
  /* save an imported report: the sealed report and its sealed totals, together */
  async saveReport(rep, totals) {
    try { return await FB._saveReport(rep, totals); }
    catch (e) { if (!(FB.isPerm(e) || e.code === 'no-key')) throw e; await FB.arReload(); return FB._saveReport(rep, totals); }
  },
  async _saveReport(rep, totals) {
    const ref = FB.db.collection('arReports').doc(), id = ref.id, v = FB.ar.curV, key = FB.ar.keys[v];
    if (!key) throw errCode('no-key');
    const box = await Crypto.sealBig(key, rep, 'arrep:' + id), sbox = await Crypto.sealJSON(key, totals, 'arsum:' + id);
    if (box.ct.length > 950000) throw errCode('too-big', 'This report is too large to save in one piece. In Edge, tick “Exclude Zero Dollar Balances” and run it again.');
    await Crypto.openBig(key, box, 'arrep:' + id); // never store what can't be opened
    const b = FB.db.batch();
    b.set(FB.db.doc('arReportData/' + id), { v, iv: box.iv, ct: box.ct });
    b.set(ref, { v, sum: sbox, asOf: rep.asOf, n: rep.rows.length, uid: FB.uid, sid: FB.me.staffId, at: FB.ts() });
    await FB.track(b.commit());
    return id;
  },
  async deleteReport(id) {
    const b = FB.db.batch(); b.delete(FB.db.doc('arReports/' + id)); b.delete(FB.db.doc('arReportData/' + id));
    await FB.track(b.commit());
  },

  /* =====================================================================
     Worked accounts: sealed; every save keeps the copy it replaced
     ===================================================================== */
  async itemId(key) { return 'a' + b64url(await Crypto.hmac(FB.ar.idx, key)).slice(0, 22); },
  async decryptItem(id, d) {
    const key = FB.ar && FB.ar.keys[d.v]; if (!key) throw errCode('no-key');
    const data = await Crypto.openJSON(key, d, 'aritem:' + id);
    return Object.assign(data, { id, rev: d.rev, v: d.v, status: d.status, by: d.sid || '', updatedAt: FB.tsMs(d.updatedAt), createdAtSrv: FB.tsMs(d.createdAt) });
  },
  async getItem(id) { const s = await FB.db.doc('arItems/' + id).get(); return s.exists ? FB.decryptItem(id, s.data()) : null; },
  async loadDone(days) {
    const since = firebase.firestore.Timestamp.fromMillis(Date.now() - days * 86400000);
    const snap = await FB.db.collection('arItems').where('updatedAt', '>=', since).get(), out = [];
    for (const d of snap.docs) { if (d.data().status !== 'done') continue; try { out.push(await FB.decryptItem(d.id, d.data())); } catch (e) { } }
    return out;
  },
  clean(data) { const o = Object.assign({}, data); ['id', 'rev', 'v', 'status', 'by', 'updatedAt', 'createdAtSrv', 'locked'].forEach(k => delete o[k]); return o; },
  async logOps(bt, itemId, rev, prev, action) {
    const lid = itemId + '_' + rev, v = FB.ar.curV;
    const box = await Crypto.sealJSON(FB.ar.keys[v], action, 'arlog:' + lid);
    bt.set(FB.db.doc('arLog/' + lid), { itemId, rev, uid: FB.uid, sid: FB.me.staffId, at: FB.ts(), v, iv: box.iv, ct: box.ct, prev: prev || null });
  },
  queues: {},
  /* create the account's record if it isn't there yet, then apply fn — one person's writes to one account run in order */
  mutateItem(id, fn, action, base) {
    const run = () => FB._mutate(id, fn, action, base, 0);
    const p = (FB.queues[id] || Promise.resolve()).then(run, run);
    FB.queues[id] = p.catch(() => { });
    return p;
  },
  async _mutate(id, fn, action, base, tries) {
    const ref = FB.db.doc('arItems/' + id);
    try {
      await FB.track(FB.db.runTransaction(async tx => {
        const s = await tx.get(ref), v = FB.ar.curV; if (!FB.ar.keys[v]) throw errCode('no-key');
        if (!s.exists) {
          if (!base) throw errCode('gone');
          const data = FB.clean(JSON.parse(JSON.stringify(base))); fn(data);
          const box = await Crypto.sealJSON(FB.ar.keys[v], data, 'aritem:' + id);
          tx.set(ref, { v, iv: box.iv, ct: box.ct, status: data.state === 'done' ? 'done' : 'open', rev: 1, by: FB.uid, sid: FB.me.staffId, createdAt: FB.ts(), updatedAt: FB.ts() });
          await FB.logOps(tx, id, 1, null, action || { a: 'create' });
          return;
        }
        const d = s.data(), data = FB.clean(await FB.decryptItem(id, d)); fn(data);
        const box = await Crypto.sealJSON(FB.ar.keys[v], data, 'aritem:' + id);
        tx.update(ref, { v, iv: box.iv, ct: box.ct, status: data.state === 'done' ? 'done' : 'open', rev: d.rev + 1, by: FB.uid, sid: FB.me.staffId, updatedAt: FB.ts() });
        await FB.logOps(tx, id, d.rev + 1, { v: d.v, iv: d.iv, ct: d.ct }, action || { a: 'save' });
      }));
    } catch (e) {
      if (tries < 2 && (FB.isPerm(e) || e.code === 'no-key')) {
        // the A/R key may have just been changed: fetch my copy again and retry
        const g = await FB.db.doc('arAccess/' + FB.uid).get(); if (!g.exists) throw e;
        await FB.arLoad(g.data());
        await new Promise(r => setTimeout(r, 150 + Math.random() * 350));
        return FB._mutate(id, fn, action, base, tries + 1);
      }
      throw e;
    }
  },
  async itemLog(id) {
    const snap = await FB.db.collection('arLog').where('itemId', '==', id).get(), out = [];
    for (const d of snap.docs) { const x = d.data(); try { out.push(Object.assign(await Crypto.openJSON(FB.ar.keys[x.v], x, 'arlog:' + d.id), { at: FB.tsMs(x.at), sid: x.sid, rev: x.rev })); } catch (e) { } }
    return out.sort((a, b) => (a.rev || 0) - (b.rev || 0));
  },
  /* every saved version of one account's record, newest first (the copy each save replaced) */
  async itemVersions(id) {
    const snap = await FB.db.collection('arLog').where('itemId', '==', id).get(), out = [];
    for (const d of snap.docs) {
      const x = d.data(); if (!x.prev) continue;
      let who = null; try { who = await Crypto.openJSON(FB.ar.keys[x.v], x, 'arlog:' + d.id); } catch (e) { }
      let data = null; try { data = await Crypto.openJSON(FB.ar.keys[x.prev.v], x.prev, 'aritem:' + id); } catch (e) { }
      out.push({ rev: x.rev - 1, replacedAt: FB.tsMs(x.at), replacedBy: x.sid, replacedHow: who && who.a, data });
    }
    return out.sort((a, b) => b.rev - a.rev);
  },
  async restoreVersion(id, data) { const keep = FB.clean(data); return FB.mutateItem(id, d => { Object.keys(d).forEach(k => delete d[k]); Object.assign(d, keep); }, { a: 'restore' }); },
  /* recent activity (owner): who did what, last N days */
  async activity(days) {
    const since = firebase.firestore.Timestamp.fromMillis(Date.now() - days * 86400000);
    const snap = await FB.db.collection('arLog').where('at', '>=', since).get(), out = [];
    for (const d of snap.docs) { const x = d.data(); try { out.push(Object.assign(await Crypto.openJSON(FB.ar.keys[x.v], x, 'arlog:' + d.id), { at: FB.tsMs(x.at), sid: x.sid, itemId: x.itemId })); } catch (e) { } }
    return out.sort((a, b) => (b.at || 0) - (a.at || 0));
  },
  async saveSettings(patch) { await FB.track(FB.db.doc('meta/settings').set(patch, { merge: true })); }
};

/* =====================================================================
   Demo backend: made-up accounts, everything in memory, nothing saved.
   Opened with ?demo. Every name and number here is invented (555-01xx
   numbers don't belong to anyone); the amounts follow the same patterns
   as an Edge A/R Aging report so every list has something in it.
   ===================================================================== */
const DEMO = {
  uid: null, me: null, h: null, pending: 0, ar: { curV: 1 }, practice: '',
  reports: [], items: new Map(), logs: [], versions: {}, roster: [], members: [], grants: [], settings: { idleMin: 30 },
  isOwner() { return !!(DEMO.me && DEMO.me.role === 'owner'); },
  isPerm() { return false; },
  copy(x) { return JSON.parse(JSON.stringify(x)); },
  wait(ms) { return new Promise(r => setTimeout(r, ms)); },
  clean(d) { const o = Object.assign({}, d); ['id', 'rev', 'v', 'status', 'by', 'updatedAt', 'createdAtSrv', 'locked'].forEach(k => delete o[k]); return o; },

  /* ---------- sign in (always the owner, so every screen can be seen) ---------- */
  async signIn() {
    // practice mode for the new-user tour (tour.js, ?demo&tour=staff): signed in as an ordinary staff member, so it looks like their screens
    DEMO.me = DEMO.practice === 'staff' ? { uid: 'u-practice', staffId: 'practice', name: 'Practice User', role: 'staff', active: true, username: 'practice' }
      : { uid: 'u-amir', staffId: 'amir', name: 'Dr. Akhavan', role: 'owner', active: true, email: 'owner@example.com' };
    DEMO.uid = DEMO.me.uid;
    if (!DEMO.reports.length) await DEMO.seed();
    return { state: 'ok' };
  },
  async signOut() { DEMO.h = null; },
  stop() { },
  async firstSetup() { }, async recover() { }, async sendReset() { }, async changePassword() { await DEMO.wait(300); },

  /* ---------- the A/R key ---------- */
  async arOpen() { return 'ok'; },
  async arSetup() { }, async arRestore() { },
  async arPeople() { await DEMO.wait(150); return { grants: DEMO.grants.map(DEMO.copy), members: DEMO.members.map(DEMO.copy), escrowOk: true, hasRecovery: true }; },
  teamSids() { return Array.from(new Set(DEMO.grants.map(g => g.sid))); },
  async arGrant(m) {
    if (!m.pub || !m.active) throw errCode('no-pub', (m.name || 'They') + ' needs to sign in once (and choose a password) first.');
    await DEMO.wait(400);
    DEMO.grants = DEMO.grants.filter(g => g.uid !== m.uid).concat([{ uid: m.uid, sid: m.staffId, pubX: m.pub.x, ringV: DEMO.ar.curV }]);
    if (DEMO.h) DEMO.h.team(DEMO.teamSids());
  },
  async arRevoke(uid, progress) {
    await DEMO.wait(200);
    DEMO.grants = DEMO.grants.filter(g => g.uid !== uid);
    if (DEMO.h) DEMO.h.team(DEMO.teamSids());
    return DEMO.arRotate(progress);
  },
  async arRotate(progress) {
    const tot = DEMO.reports.length + DEMO.items.size;
    for (let n = 1; n <= tot; n++) { await DEMO.wait(30); if (progress) progress(n, tot); }
    DEMO.ar.curV++; DEMO.grants.forEach(g => { g.ringV = DEMO.ar.curV; });
    return { reports: DEMO.reports.length, items: DEMO.items.size, failed: 0 };
  },

/* ---------- toasts ---------- */
/* opt: { bad, ms, action + onAction (one button), actions: [{ t, fn }] (more buttons, before it) } */
function toast(msg, opt) {
  opt = opt || {}; const el = document.createElement('div'); el.className = 'toast' + (opt.bad ? ' bad' : ''); el.setAttribute('role', 'status');
  const acts = (opt.actions || []).filter(x => x && x.t).concat(opt.action ? [{ t: opt.action, fn: opt.onAction }] : []);
  el.innerHTML = esc(msg) + acts.map(x => ' <button class="linkBtn" style="color:var(--mint);margin-left:10px;pointer-events:auto">' + esc(x.t) + '</button>').join('');
  $$('button', el).forEach((b, i) => { b.onclick = () => { el.remove(); acts[i].fn(); }; });
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), opt.ms || (acts.length ? 8000 : 3800));
}
function errText(e) {
  const c = (e && (e.code || e.message)) || '';
  if (/no-user/.test(c)) return 'No login with that username.';
  if (/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return 'Username or password is incorrect.';
  if (/inactive/.test(c)) return 'This login has been turned off. Ask Dr. A.';
  if (/not-member/.test(c)) return 'That account isn’t part of the office.';
  if (/too-many-requests/.test(c)) return 'Too many attempts. Wait a minute and try again.';
  if (/network|unavailable/.test(c)) return 'Can’t reach the server. Check the internet connection.';
  if (/weak-password/.test(c)) return 'Password needs at least 8 characters.';
  if (/boot-failed/.test(c)) return 'That temporary password didn’t work. Ask Dr. A to reissue your login.';
  if (/boot-stale/.test(c)) return 'This invite expired after a security update. Ask Dr. A to reissue your login.';
  if (/bad-code/.test(c)) return 'That recovery code didn’t work. Check it and try again.';
  if (/no-escrow/.test(c)) return 'There’s no recovery copy of the A/R key to restore from.';
  if (/need-date|need-note|bad-date|no-pub|too-big|not-ar|bad-file|pdf|step-done/.test(c)) return (e && e.message) || 'Check that and try again.';
  if (/nothing-to-undo/.test(c)) return 'Nothing to undo.';
  if (/permission/.test(c)) return 'Not allowed. Your access may have changed.';
  if (/gone/.test(c)) return 'That no longer exists.';
  if (/requires-recent-login/.test(c)) return 'Please sign in again, then retry.';
  return (e && e.message) ? String(e.message).replace(/^Firebase:\s*/, '') : 'Something went wrong.';
}

/* ---------- the collections ladder (handbook §14), worked out once per change for every patient account past due ---------- */
function ladAll() {
  const t = todayISO();

/* ---------- shared: filters, sorting, one table for every list ---------- */
function applyFilters(list) {
  const f = S.f, me = meSid();
  return list.filter(a => {
    if (!matchesQ(a)) return false;
    if (f.src && a.src !== f.src) return false;
    if (f.work) { const w = workState(a.key); if (f.work === 'open' ? w === 'done' : w !== f.work) return false; }
    if (f.who) { const it = itemFor(a.key); const who = it && it.state === 'open' ? it.assignee : ''; if (f.who === '_me' ? who !== me : f.who === '_none' ? !!who : who !== f.who) return false; }
    if (f.car && S.view === 'ins') { const c = carrierFor(a.key); if (f.car === '_none' ? !!c : !c || c.id !== f.car) return false; }
    return true;
  });
}
function sortBy(list, def) {
  const k = S.sort.k || def.k, dir = S.sort.k ? S.sort.dir : def.dir;
  const val = a => k === 'name' ? String(a.patient).toLowerCase() : k === 'follow' ? ((itemFor(a.key) || {}).follow || '9999') : k === 'recv' ? (a.recv || '') : (a[k] == null ? -Infinity : a[k]);
  return list.slice().sort((x, y) => { const p = val(x), q = val(y); return (p < q ? -1 : p > q ? 1 : 0) * dir || y.pd - x.pd || y.credit - x.credit; });
}

function goalBox(k, label, what) {
  if (!k) return '';

/* the two rates, report by report, with the goals as dashed lines */
function goalTrendHTML() {

  const byDay = new Map(); pts.forEach(r => byDay.set(r.asOf, r)); const P = Array.from(byDay.values()).slice(-26);
  if (P.length < 2) return '<div class="small muted">The week-by-week line shows up once there are two full reports.</div>';
  const pr = r => (from30 ? r.sum.kp.ptPd30 : r.sum.kp.ptPd) / r.sum.kp.ptOf, ir = r => (r.sum.kp.insOf ? r.sum.kp.insLate / r.sum.kp.insOf : null);
  const gp = S.cfg.goalPt / 100, gi = S.cfg.goalIns / 100;
  /* the top of the chart: a round number, with room for the goal line in the middle */
  const top = Math.max(gp * 2, gi * 2, ...P.map(r => Math.max(pr(r), ir(r) || 0))) * 1.08 || 0.1;
  const step = top <= 0.1 ? 0.02 : top <= 0.2 ? 0.05 : top <= 0.5 ? 0.1 : 0.25, max = Math.min(1, Math.ceil(top / step - 1e-9) * step);
  const narrow = innerWidth < 640, W = narrow ? 360 : 560, H = narrow ? 170 : 190, L = 40, R = 10, T = 10, Bm = 24;
  const x = i => L + (W - L - R) * (i / (P.length - 1)), y = v => T + (H - T - Bm) * (1 - v / max);
  const pc = v => (v * 100).toFixed(1).replace(/\.0$/, '') + '%';
  const line = (f, color) => { const d = P.map((r, i) => [i, f(r)]).filter(([, v]) => v != null).map(([i, v], j) => (j ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' '); return d ? '<path class="tl" stroke="' + color + '" d="' + d + '"/>' : ''; };
  const goals = gi === gp ? [gp] : [gp, gi];
  const goal = g => '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(g).toFixed(1) + '" y2="' + y(g).toFixed(1) + '" stroke="var(--mint-700)" stroke-width="1.5" stroke-dasharray="5 4"/>' +
    '<text class="gt" x="' + (L - 6) + '" y="' + (y(g) + 4).toFixed(1) + '" text-anchor="end">' + pc(g) + '</text>';
  /* 0 and the top as grid lines; a label only where a goal's label isn't sitting */
  const clear = v => goals.every(g => Math.abs(y(g) - y(v)) > 13);
  const ticks = [0, max].map(v => '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '" stroke="var(--grey-100)"/>' +
    (clear(v) ? '<text x="' + (L - 6) + '" y="' + (y(v) + 4).toFixed(1) + '" text-anchor="end">' + pc(v) + '</text>' : '')).join('');
  const lbl = P.map((r, i) => (i === 0 || i === P.length - 1 || P.length <= (narrow ? 5 : 8)) ? '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="' + (i === 0 ? 'start' : i === P.length - 1 ? 'end' : 'middle') + '">' + esc(fmtDate(r.asOf)) + '</text>' : '').join('');
  return '<div class="trend gTrend"><div class="small" style="margin-bottom:4px"><span class="lg" style="background:var(--navy)"></span>Patient <span class="lg" style="background:var(--blue-500)"></span>Insurance <span class="lg dash"></span>Goal' + (goals.length > 1 ? 's' : '') + '</div>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Patient and insurance accounts past due, as a percent, over the last ' + P.length + ' reports, with the goals">' + ticks + goals.map(goal).join('') +
    line(pr, 'var(--navy)') + line(ir, 'var(--blue-500)') + lbl + '</svg></div>';
}

function readCfg() {
  const num = id => Number((($('#' + id) || {}).value || '').trim());
  return { inst: round2(num('cfgInst')), writeOff: num('cfgWo'), tiers: [num('cfgT0'), num('cfgT1'), num('cfgT2')], dueDay: num('cfgDue'),
    goalPt: Math.round(num('cfgGoalPt') * 10) / 10, goalIns: Math.round(num('cfgGoalIns') * 10) / 10, kpiFrom: num('cfgKpiFrom') === 31 ? 31 : 1 };
}
function cfgProblem(c) {
  if (!(c.inst > 0 && c.inst <= 5000)) return 'The instalment needs to be more than $0.';
  if (!c.tiers.every(t => Number.isInteger(t) && t > 0 && t <= 3650)) return 'The day cutoffs need to be whole numbers of days.';
  if (!(c.tiers[0] < c.tiers[1] && c.tiers[1] < c.tiers[2])) return 'Each day cutoff needs to be more than the one before it.';
  if (!(c.writeOff >= 1 && c.writeOff <= 100000)) return 'The write-off amount needs to be at least $1.';
  if (![1, 2, 3, 4].includes(c.dueDay)) return 'Pick the day the report is due (Monday to Thursday).';
  if (!(c.goalPt > 0 && c.goalPt <= 100 && c.goalIns > 0 && c.goalIns <= 100)) return 'The goals need to be between 0.1% and 100%.';
  return '';
}

    { id: 'rep', at: () => tVis('#nav-reports', '#mnav-reports'), t: 'This week’s report', b: 'Once a week, by ' + DUE_DAYS[S.cfg.dueDay - 1] + ': Edge → Reporting → Financial → Accounts Receivable Aging → Export → Excel, then drop the file here (the steps are on the page). It’s read on this computer and saved sealed. If it’s late, Today shows a red banner until it’s in.',
      act: 'Tap Reports.', done: () => S.view === 'reports' },
    { id: 'sum', at: () => tVis('#nav-sum', '#mnav-sum'), t: 'Summary', b: 'The whole picture: the goals, what moved since last week and who did what, a weekly brief from AISA, totals, aging, the ladder today, insurance with nothing paid, credits — and the Month-End numbers, ready to copy.',

  );

}
/* `from`: picking up after Lock (tourPause) — the same step, the same practice account */
function tourStart(kind, from) {
  tourEnd(false, true);
  Object.assign(TOUR, { on: true, kind, i: 0, steps: tourSteps(kind), key: from ? from.key : '', name: from ? from.name : '', step: from ? from.step : '', signKey: from ? from.signKey : '', signName: from ? from.signName : '',
    okAt: 0, hold: false, shown: -1, backAt: from ? from.at : '', paused: null, ringEl: null });
  const ring = document.createElement('div'); ring.id = 'tourRing'; ring.hidden = true; document.body.appendChild(ring);
  const card = document.createElement('div'); card.id = 'tourCard'; card.setAttribute('role', 'dialog'); card.setAttribute('aria-label', 'Tour'); document.body.appendChild(card);
  card.addEventListener('click', e => {
    const b = e.target.closest('[data-tour]'); if (!b) return; e.stopPropagation();
    const a = b.dataset.tour;
    if (a === 'next') tourNext(); else if (a === 'back') tourGo(Math.max(0, TOUR.i - 1), true); else if (a === 'end') tourEnd(false);
  });
  TOUR.onMove = () => tourPlace();
  window.addEventListener('resize', TOUR.onMove); window.addEventListener('scroll', TOUR.onMove, true);
  TOUR.timer = setInterval(tourTick, 200);
  tourGo(from ? Math.min(from.i, TOUR.steps.length - 1) : 0);
}
/* practice mode: Lock pauses the tour, and signing back in (the practice password is filled in) picks it up at the same step —
   so "Try it: tap Lock" is safe. Returns the lock screen's message. */
function tourPause(msg) {
  const st = TOUR.steps[TOUR.i];
  TOUR.paused = { i: TOUR.i, key: TOUR.key, name: TOUR.name, step: TOUR.step, signKey: TOUR.signKey, signName: TOUR.signName, at: st ? st.id : '' }; tourEnd(false, true);
  return S.tour ? 'Locked. Your password opens it again — here it’s filled in, so tap Sign in and the tour carries on.' : msg;
}
function tourEnd(finished, quiet) {
  if (!TOUR.on && !$('#tourCard')) return;
  TOUR.on = false; clearInterval(TOUR.timer);
  if (TOUR.onMove) { window.removeEventListener('resize', TOUR.onMove); window.removeEventListener('scroll', TOUR.onMove, true); }
  ['#tourRing', '#tourCard'].forEach(s => { const el = $(s); if (el) el.remove(); });
  if (finished) { try { localStorage.setItem('nloAR.tourDone', String(Date.now())); } catch (e) { } }
  if (!quiet) toast(finished ? 'Tour done — close this tab to go back to NLO A/R' : 'Tour ended — restart it from My account', { ms: 6000 });
}
/* Next / Skip: on to the next step — past any that need something that isn't open (skipping "Tap the account" skips the panel's
   steps), and past "Close it" when nothing is open */
function tourNext() {
  const pass = s => (s.need && !s.need.ok()) || (s.skip && s.skip());
  let j = TOUR.i + 1; while (j < TOUR.steps.length - 1 && pass(TOUR.steps[j])) j++;
  tourGo(j);
}
/* go to step i; `manual` (Back): an action step that's already done waits for Next instead of moving on by itself */
function tourGo(i, manual) {
  if (!TOUR.on) return;
  if (i >= TOUR.steps.length) { tourEnd(true); return; }
  TOUR.i = i; TOUR.okAt = 0; const st = TOUR.steps[i];
  if (st.enter) st.enter();
  TOUR.hold = !!(manual && st.done && st.done());
  tourCard(); tourTick();
  // bring what it points at into view once (inside the account panel too)
  setTimeout(() => {
    if (TOUR.i !== i || !TOUR.on) return; const el = st.at && st.at();
    if (el && el.getClientRects().length) { const r = el.getBoundingClientRect(); if (r.top < 60 || r.bottom > innerHeight - 160) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    tourPlace();
  }, 120);
}
function tourCard() {
  const card = $('#tourCard'); if (!card) return; const st = TOUR.steps[TOUR.i], n = TOUR.steps.length, act = tVal(st.act);
  const ok = !!TOUR.okAt || TOUR.hold, last = TOUR.i === n - 1;
  card.classList.toggle('ok', ok); card.classList.toggle('act', !!act);
  card.innerHTML = '<div class="tcTop"><span class="tcN">' + (TOUR.i + 1) + ' of ' + n + '</span><span class="tcBar"><i style="width:' + Math.round((TOUR.i + 1) / n * 100) + '%"></i></span>' +
    (last ? '' : '<button type="button" class="tcEnd" data-tour="end">End tour</button>') + '</div>' +
    '<h4>' + esc(tVal(st.t)) + '</h4><p>' + esc(tVal(st.b)) + '</p>' +
    (act ? '<div class="tcDo">' + (ok ? ic('done', 16) + '<span>' + (TOUR.hold ? 'Done already — tap Next' : 'Nice!') + '</span>' : ic('next', 16) + '<span>' + esc(act) + '</span>') + '</div>' : '') +
    '<div class="tcBtns">' + (TOUR.i ? '<button type="button" class="btn btn-ghost btn-sm" data-tour="back">Back</button>' : '') + '<span style="flex:1"></span>' +
    (act && !ok ? '<button type="button" class="btn btn-ghost btn-sm" data-tour="next">Skip</button>' : '<button type="button" class="btn btn-teal btn-sm" data-tour="next">' + (last ? 'Finish' : TOUR.i ? 'Next' : 'Start') + '</button>') + '</div>';
  // info steps: the keyboard can carry on from the card; action steps leave the focus with the page
  if (!act && TOUR.shown !== TOUR.i) { const b = card.querySelector('[data-tour=next]'); if (b) b.focus({ preventScroll: true }); }
  TOUR.shown = TOUR.i;
}
function tourTick() {
  if (!TOUR.on) return; const st = TOUR.steps[TOUR.i]; if (!st) return;
  if (TOUR.hold && st.done && !st.done()) { TOUR.hold = false; tourCard(); }
  if (st.done && !TOUR.okAt && !TOUR.hold && st.done()) { TOUR.okAt = Date.now(); tourCard(); }
  if (TOUR.okAt) { if (Date.now() - TOUR.okAt > 700) { tourGo(TOUR.i + 1); return; } tourPlace(); return; }
  // the trainee wandered off (closed the account, left the list): back to the step that gets there again
  if (st.need && !st.need.ok()) { const j = TOUR.steps.findIndex(s => s.id === st.need.go); if (j >= 0 && j < TOUR.i) { tourGo(j); return; } }
  tourPlace();
}
/* the ring around what the step points at (it dims the rest; clicks go through to the page), and the card beside it */
function tourPlace() {
  const ring = $('#tourRing'), card = $('#tourCard'); if (!ring || !card) return;
  const st = TOUR.steps[TOUR.i], el = st && st.at ? st.at() : null;
  const r = el && el.getClientRects().length ? el.getBoundingClientRect() : null, vis = !!r && r.width > 0 && r.height > 0 && r.bottom > 0 && r.top < innerHeight;
  if (vis) {
    // the same thing as last time (the page scrolling, a tick): stay right on it; something new: glide over to it
    ring.classList.toggle('glide', !(TOUR.ringEl === el && !ring.hidden)); TOUR.ringEl = el;
    const p = 6; Object.assign(ring.style, { left: (r.left - p) + 'px', top: (r.top - p) + 'px', width: (r.width + p * 2) + 'px', height: (r.height + p * 2) + 'px' }); ring.hidden = false;
  } else { ring.hidden = true; TOUR.ringEl = null; }
  const vw = document.documentElement.clientWidth, vh = innerHeight, phone = vw < 640;
  card.classList.toggle('sheet', phone);
  if (phone) { card.style.left = ''; card.style.top = ''; return; }
  const cw = card.offsetWidth, ch = card.offsetHeight, m = 14, foot = 44;
  let x, y;
  if (vis) {
    if (r.bottom + 14 + ch < vh - foot) { y = r.bottom + 14; x = r.left; }
    else if (r.top - 14 - ch > m) { y = r.top - 14 - ch; x = r.left; }
    else if (r.right + 14 + cw < vw - m) { x = r.right + 14; y = r.top; }
    else { x = r.left - 14 - cw; y = r.top; }
  } else { x = vw - cw - 28; y = vh - ch - foot - 16; }
  x = Math.max(m, Math.min(x, vw - cw - m)); y = Math.max(m, Math.min(y, vh - ch - foot));
  card.style.left = Math.round(x) + 'px'; card.style.top = Math.round(y) + 'px';
}
/* ---------- where the tour is offered ---------- */
/* the practice copy of this page, opened in its own tab: as staff, or as Dr. A (who also signs a letter and sees Settings) */
function tourUrl() { return location.pathname + '?demo&tour=' + (isOwner() ? 'owner' : 'staff'); }
function tourOpen() {
  if (S.tour) { tourStart(S.tour); return; } // already in practice: start over here
  tourOffered(); window.open(tourUrl(), '_blank', 'noopener');
  if ($('#tourOffer')) renderView();
}
function tourOffered() { try { localStorage.setItem('nloAR.tourOffer.' + meSid(), String(Date.now())); } catch (e) { } }
/* once per person on each computer, at the top of Today (not in the demo or practice itself) */
function tourOfferHTML() {
  if (S.demo || TOUR.on || S.arState !== 'ok') return '';
  try { if (localStorage.getItem('nloAR.tourOffer.' + meSid())) return ''; } catch (e) { return ''; }
  return '<div class="card tourOffer" id="tourOffer"><div class="cardBd"><span class="toIc">' + ic('tour', 22) + '</span><div class="toTx"><b>New to NLO A/R?</b> Take the 5-minute hands-on tour. ' +
    'It opens a practice copy with made-up accounts in its own tab, so nothing real changes.</div>' +
    '<button type="button" class="btn btn-teal btn-sm" data-act="tourOpen">Start the tour</button><button type="button" class="btn btn-ghost btn-sm" data-act="tourLater">Not now</button></div></div>';
}
/* My account: the tour any time (for anyone A/R is open to) */
function tourAccountHTML() {
  if (S.arState !== 'ok') return '';
  return '<div class="card" style="max-width:520px;margin-top:18px"><div class="cardHd"><h3>Tour &amp; practice</h3></div><div class="cardBd"><p class="small" style="margin-bottom:10px">' +
    (S.tour ? 'You’re in practice mode. Start the tour over from the beginning here.' : 'A 5-minute hands-on tour of NLO A/R, in a practice copy with made-up accounts (its own tab) — nothing real changes.') +
    '</p><button type="button" class="btn btn-sec btn-sm" data-act="tourOpen">' + ic('tour', 15) + (S.tour ? 'Start over' : 'Take the tour') + '</button></div></div>';
}
Object.assign(ACT, {
  tourOpen() { tourOpen(); },
  tourLater() { tourOffered(); renderView(); toast('You can take the tour any time from My account'); }
});
/* the demo and practice keep their own settings (the remembered username, the tour's "done"…): this page shares its web
   address — and so its browser storage — with the real app. It reads the real ones as a starting point, but what changes
   in the demo stays in the demo (stored under "nloDemo."). Installed before anything reads storage. */
function demoSandbox() {
  const P = 'nloDemo.', GONE = '\u0000gone', SP = Storage.prototype, get = SP.getItem, set = SP.setItem;
  SP.getItem = function (k) { const v = get.call(this, P + k); return v === GONE ? null : v !== null ? v : get.call(this, k); };
  SP.setItem = function (k, v) { return set.call(this, P + k, v); };
  SP.removeItem = function (k) { return set.call(this, P + k, GONE); };
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
