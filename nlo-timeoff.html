<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-HihQsT+/PmMEvceL++zLtlmfMBixzXBBRJlVT1KtAnQ=' https://www.gstatic.com/firebasejs/10.12.2/ https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://www.google.com/images/cleardot.gif; connect-src 'self' https://*.googleapis.com https://nlo-inventory-default-rtdb.firebaseio.com http://127.0.0.1:8080 http://127.0.0.1:9099 http://127.0.0.1:9000; frame-src https://nlo-cases.firebaseapp.com https://nlo-inventory.firebaseapp.com; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="theme-color" content="#1B2F4C">
<title>NLO Time Off</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* NLO brand palette — same values as Staff Hub / Onboarding */
  --navy-900:#11203A; --navy:#1B2F4C; --navy-700:#294169; --navy-600:#385686; --navy-500:#5471A0; --navy-100:#E8ECF2;
  --blue-800:#122874; --blue-700:#16318C; --blue:#1D3EA9; --blue-500:#2E52C9; --blue-200:#BCC8EE; --blue-100:#E5EAF8;
  --coral-700:#D8412E; --coral-600:#EE4F3A; --coral:#FA624D; --coral-200:#FFC8BF; --coral-100:#FFE7E1;
  --mint-700:#1F9E7E; --mint-600:#34C49E; --mint:#64F4C9; --mint-200:#C0FBEC; --mint-100:#E2FBF4;
  --amber-700:#C2820A; --amber-600:#E29A14; --amber:#F6AF24; --amber-200:#FCE2A6; --amber-100:#FEF2D7;
  --grey-50:#F7F8F9; --grey-100:#ECEEF0; --grey-200:#DCE0E4; --grey-300:#C3C9D0; --grey-400:#969FAB; --grey-500:#6B7685; --grey-600:#4C5868; --grey-700:#33404F;
  --off:#F2F3F4; --card:#FFFFFF;
  --fd:'Oswald',system-ui,sans-serif;
  --fb:'Montserrat',system-ui,-apple-system,sans-serif;
  --sh-xs:0 1px 2px rgba(17,32,58,.07); --sh-sm:0 2px 6px rgba(17,32,58,.08);
  --sh-md:0 8px 24px rgba(17,32,58,.10); --sh-lg:0 18px 48px rgba(17,32,58,.15); --sh-xl:0 32px 70px rgba(17,32,58,.22);
  --r-sm:8px; --r:14px; --r-lg:22px;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--fb);background:var(--off);color:var(--grey-700);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--grey-700)}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue-500);outline-offset:2px;border-radius:4px}
svg.i{flex:none;display:inline-block;vertical-align:-3px}
.hidden{display:none !important}
.muted{color:var(--grey-500)}
.small{font-size:12.5px}

/* ---------- Demo banner ---------- */
#demoBar{position:fixed;left:0;right:0;bottom:0;z-index:2000;background:var(--amber);color:var(--navy-900);text-align:center;font-family:var(--fd);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px;padding:7px 12px}

/* ---------- Lock ---------- */
#lockWrap{position:fixed;inset:0;background:linear-gradient(158deg,var(--navy-900) 0%,var(--navy) 62%,#20395C 100%);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;overflow:hidden auto}
#lockWrap::before{content:"";position:absolute;width:680px;height:680px;border-radius:50%;border:88px solid rgba(255,255,255,.03);top:-300px;right:-220px;pointer-events:none}
#lockWrap::after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;border:70px solid rgba(100,244,201,.045);bottom:-260px;left:-180px;pointer-events:none}
.lockCol{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;width:100%;max-width:440px;margin:auto;padding:24px 0}
.lockBrand{display:flex;flex-direction:column;align-items:center;gap:14px}
.lockBrand img{width:160px;height:auto;display:block}
.appTag{font-family:var(--fd);font-weight:500;font-size:13px;letter-spacing:.34em;text-transform:uppercase;color:var(--mint);text-indent:.34em}
.lockCard{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-xl);width:100%;padding:32px 34px 28px}
.lockCard h1{font-family:var(--fd);font-weight:600;font-size:22px;letter-spacing:.03em;text-transform:uppercase;color:var(--navy)}
.lockCard .lsub{font-size:12.5px;color:var(--grey-500);margin-top:3px}
.lockCard p.desc{color:var(--grey-500);font-size:13.5px;margin:12px 0 18px}
.lockErr{background:var(--coral-100);color:var(--coral-700);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:500;margin-bottom:14px}
.lockOk{background:var(--mint-100);color:var(--mint-700);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:500;margin-bottom:14px}
.lockFoot{margin-top:16px;font-size:12px;color:var(--grey-400);text-align:center}
.lockFoot a,.linkBtn{color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.lockMeta{display:flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:.06em;color:#9DB0CC;text-transform:uppercase;font-family:var(--fd);font-weight:500}
.ackBox{display:flex;gap:10px;align-items:flex-start;background:var(--amber-100);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--amber-700);margin-bottom:16px;line-height:1.5}
.ackBox input{margin-top:2px;accent-color:var(--amber-600)}
.codeBox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;letter-spacing:.08em;background:var(--grey-50);border:1.5px dashed var(--grey-300);border-radius:12px;padding:16px;text-align:center;color:var(--navy);word-break:break-all;margin:6px 0 14px;user-select:all}

/* ---------- Fields ---------- */
.field{margin-bottom:14px}
.field label,.flabel{display:block;font-family:var(--fd);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey-500);margin-bottom:6px}
.field input,.field select,.field textarea,.inp{width:100%;padding:10px 13px;border:1.5px solid var(--grey-200);border-radius:10px;background:#fff;outline:none;transition:border-color .14s var(--ease),box-shadow .14s var(--ease);min-height:42px}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-100)}
.field input:disabled,.field select:disabled,.inp:disabled{background:var(--grey-100);border-color:var(--grey-100);color:var(--grey-600);cursor:not-allowed;opacity:1}
.field textarea{resize:vertical;min-height:70px;line-height:1.45}
.field .hint{font-size:11.5px;color:var(--grey-500);margin-top:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 14px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:9px 20px;border-radius:999px;font-family:var(--fd);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;line-height:1.1;white-space:nowrap;transition:background .14s var(--ease),transform .14s var(--ease),box-shadow .14s var(--ease)}
.btn:active{transform:scale(.985)}
.btn-pri{background:var(--navy);color:#fff;box-shadow:var(--sh-xs)}
.btn-pri:hover{background:var(--navy-900);box-shadow:var(--sh-md)}
.btn-act{background:var(--blue);color:#fff}
.btn-act:hover{background:var(--blue-700)}
.btn-sec{background:#fff;border:1.5px solid var(--grey-300);color:var(--navy)}
.btn-sec:hover{background:var(--grey-100)}
.btn-danger{background:var(--coral-600);color:#fff}
.btn-danger:hover{background:var(--coral-700)}
.btn-mint{background:var(--mint);color:var(--navy-900)}
.btn-mint:hover{background:var(--mint-600)}
.btn-ghost{color:var(--grey-600);padding:6px 12px;min-height:34px;border-radius:999px;font-family:var(--fb);font-weight:600;font-size:12.5px;letter-spacing:0;text-transform:none}
.btn-ghost:hover{background:var(--grey-100);color:var(--navy)}
.btn-sm{min-height:34px;padding:6px 14px;font-size:12px}
.btn-block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none !important;box-shadow:none !important}
.iconBtn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--grey-600)}
.iconBtn:hover{background:var(--grey-100);color:var(--navy)}

/* ---------- Shell ---------- */
#app{display:flex;min-height:100vh}
#side{width:232px;flex:none;background:var(--navy);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sideTop{padding:28px 22px 20px;border-bottom:1px solid rgba(255,255,255,.07)}
.sideTop img{width:126px;height:auto;display:block}
.sideTop .appTag{margin-top:12px;font-size:11px;letter-spacing:.3em;text-indent:0;text-align:left}
.nav{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.navLbl{font-family:var(--fd);font-weight:500;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#7E92B5;padding:14px 12px 6px}
.navBtn{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:10px;color:#C9D4E5;font-weight:600;font-size:13.5px;text-align:left}
.navBtn:hover{background:rgba(255,255,255,.06);color:#fff}
.navBtn.on{background:rgba(100,244,201,.12);color:var(--mint)}
.navBtn .cnt{margin-left:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.12);color:#fff;border-radius:99px;padding:1px 8px}
.navBtn .cnt.red{background:var(--coral-600)} .navBtn .cnt.amber{background:var(--amber);color:var(--navy-900)}
.sideFoot{margin-top:auto;padding:16px 20px 22px;border-top:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;gap:10px}
.whoBox{display:flex;align-items:center;gap:10px;font-size:12.5px;color:#DCE4EE}
.whoBox b{display:block;color:#fff;font-size:13px}
.sideLock{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:9px 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,.22);color:#DCE4EE;font-family:var(--fd);font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
.sideLock:hover{background:rgba(255,255,255,.09);color:#fff}
.syncLine{display:flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--fd);font-weight:500;color:#9DB0CC}
.dot{width:8px;height:8px;border-radius:50%;background:var(--grey-400);flex:none}
.dot.ok{background:var(--mint)} .dot.busy{background:var(--amber)} .dot.bad{background:var(--coral)}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
.topBar{display:flex;align-items:center;gap:14px;padding:18px 28px 14px;position:sticky;top:0;z-index:20;background:var(--off)}
.topBar h2{font-family:var(--fd);font-weight:600;font-size:24px;letter-spacing:.02em;text-transform:uppercase;color:var(--navy);white-space:nowrap}
.searchBox{flex:1;max-width:380px;margin-left:auto;position:relative}
.searchBox input{width:100%;padding:10px 14px 10px 38px;border-radius:999px;border:1.5px solid var(--grey-200);background:#fff;outline:none;min-height:42px}
.searchBox input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-100)}
.searchBox svg{position:absolute;left:13px;top:12px;color:var(--grey-400)}
#view{padding:4px 28px 60px;flex:1}
.mobBar{display:none}

/* ---------- Cards / tiles ---------- */
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh-xs);border:1px solid var(--grey-100)}
.cardHd{display:flex;align-items:center;gap:10px;padding:16px 20px 12px}
.cardHd h3{font-family:var(--fd);font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--navy)}
.cardHd .sub{font-size:12px;color:var(--grey-500)}
.cardBd{padding:4px 20px 18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile{background:#fff;border-radius:var(--r);border:1px solid var(--grey-100);box-shadow:var(--sh-xs);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:92px;transition:box-shadow .14s var(--ease),transform .14s var(--ease)}
.tile:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
.tile .n{font-family:var(--fd);font-weight:600;font-size:30px;line-height:1.1;color:var(--navy)}
.tile .l{font-size:12.5px;font-weight:600;color:var(--grey-600)}
.tile.red .n{color:var(--coral-700)} .tile.amber .n{color:var(--amber-700)} .tile.blue .n{color:var(--blue)} .tile.mint .n{color:var(--mint-700)}
.twoCol{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}

/* ---------- Due groups ---------- */
.dueGrp{margin-bottom:6px}
.dueGrp h4{font-family:var(--fd);font-weight:500;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey-500);padding:12px 0 6px;border-bottom:1px solid var(--grey-100)}
.dueGrp h4.red{color:var(--coral-700)}
.row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid var(--grey-100);cursor:pointer;border-radius:8px;width:100%;text-align:left}
.row:hover{background:var(--grey-50)}
.row .pt{font-weight:700;color:var(--navy);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:12px;color:var(--grey-500);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.empty{padding:28px 10px;text-align:center;color:var(--grey-500);font-size:13px}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap;background:var(--grey-100);color:var(--grey-600)}
.badge.t-aligner{background:var(--blue-100);color:var(--blue-700)}
.badge.t-lab{background:var(--mint-100);color:var(--mint-700)}
.badge.t-appl{background:var(--navy-100);color:var(--navy-700)}
.badge.t-ret{background:var(--amber-100);color:var(--amber-700)}
.badge.t-retx{background:var(--coral-100);color:var(--coral-700)}
.badge.t-misc{background:var(--grey-100);color:var(--grey-600)}
.due{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap;background:var(--grey-100);color:var(--grey-600)}
.due.over{background:var(--coral-100);color:var(--coral-700)}
.due.soon{background:var(--amber-100);color:var(--amber-700)}
.due.none{background:transparent;color:var(--grey-400);font-weight:600}
.av{width:28px;height:28px;border-radius:50%;background:var(--navy-600);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none;letter-spacing:.02em}
.av.none{background:var(--grey-200);color:var(--grey-500)}
.av.lg{width:36px;height:36px;font-size:13px;display:inline-flex;border-radius:50%;margin:0;vertical-align:middle}

/* ---------- Board ---------- */
.boardTabs,.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1.5px solid var(--grey-200);border-radius:99px;padding:6px 14px;font-size:12.5px;font-weight:600;color:var(--grey-600);background:#fff;min-height:36px}
.chip:hover{border-color:var(--navy-500);color:var(--navy)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .c{opacity:.7;margin-left:4px}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;scroll-snap-type:x proximity}
.col{flex:1 0 225px;max-width:320px;background:var(--grey-100);border-radius:var(--r);padding:10px;scroll-snap-align:start;max-height:calc(100vh - 230px);display:flex;flex-direction:column}
.colHd{display:flex;align-items:center;gap:8px;padding:4px 6px 10px}
.colHd h4{font-family:var(--fd);font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.colHd .c{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--grey-500)}
.colBd{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:40px;padding:2px}
.kc{position:relative;background:#fff;border-radius:11px;box-shadow:var(--sh-xs);border:1px solid var(--grey-200);padding:10px 11px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;width:100%}
.kc:hover{box-shadow:var(--sh-md);border-color:var(--grey-300)}
.kc .pt{font-weight:700;color:var(--navy);font-size:13.5px;line-height:1.3;padding-right:36px}
.kc .dt{font-size:12px;color:var(--grey-500);line-height:1.35}
.kc .ft{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kc .adv{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--blue);background:var(--blue-100)}
.kc .adv:hover{background:var(--blue);color:#fff}

/* ---------- Table ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select{padding:8px 12px;border:1.5px solid var(--grey-200);border-radius:999px;background:#fff;font-weight:600;font-size:12.5px;min-height:38px;color:var(--grey-700)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-family:var(--fd);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--grey-500);padding:11px 14px;border-bottom:1px solid var(--grey-100);white-space:nowrap}
.tbl th button{font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--grey-100);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.click{cursor:pointer}
.cleanup{margin-bottom:18px;border:1.5px solid var(--amber-200)}
.cleanup .oldPick select{margin-left:6px;padding:5px 8px;border-radius:8px;border:1.5px solid var(--grey-200);font:inherit;font-size:12.5px}
.cleanup .oldNo{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.oldList{max-height:320px;overflow:auto;border:1px solid var(--grey-100);border-radius:10px}
.oldRow{display:grid;grid-template-columns:22px minmax(0,1.2fr) minmax(0,1.6fr) auto;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--grey-100);cursor:pointer}
.oldRow:last-child{border-bottom:none}
.oldRow:hover{background:var(--grey-50)}
.oldRow input{width:17px;height:17px;accent-color:var(--navy)}
.oldRow .pt{font-weight:700;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oldRow .muted{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oldD{color:var(--coral-700);font-weight:600}
.oldAct{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.oldAct b{font-size:13px;color:var(--navy);margin-right:4px}
.tbl tr.click:hover td{background:var(--grey-50)}
.tbl .pt{font-weight:700;color:var(--navy)}
.tblWrap{overflow-x:auto}

/* ---------- Drawer ---------- */
#scrim{position:fixed;inset:0;background:rgba(17,32,58,.35);z-index:900}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;z-index:901;box-shadow:var(--sh-xl);display:flex;flex-direction:column}
.dHd{padding:20px 22px 14px;border-bottom:1px solid var(--grey-100);display:flex;gap:12px;align-items:flex-start}
.dHd h3{font-family:var(--fd);font-weight:600;font-size:21px;letter-spacing:.02em;color:var(--navy);line-height:1.2}
.dHd .sub{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.dBd{flex:1;overflow-y:auto;padding:16px 22px 26px}
.dFt{padding:12px 22px;border-top:1px solid var(--grey-100);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sec{margin-top:18px}
.sec h5{font-family:var(--fd);font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey-500);margin-bottom:8px}
.stepper{display:flex;flex-direction:column;gap:6px}
.step{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--grey-200);text-align:left;font-weight:600;font-size:13px;color:var(--grey-600);background:#fff;min-height:40px}
.step:hover{border-color:var(--blue-200);background:var(--blue-100)}

.kv .v{font-weight:600;color:var(--navy);overflow-wrap:anywhere}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--grey-50);border-radius:10px;padding:10px 12px;font-size:13px}
.cmt{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--grey-100)}

.hist{font-size:12.5px;color:var(--grey-600);padding:5px 0;display:flex;gap:8px}

.notice{background:var(--amber-100);color:var(--amber-700);border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:600;margin-bottom:12px}
.notice.info{background:var(--blue-100);color:var(--blue-700)}
.notice.bad{background:var(--coral-100);color:var(--coral-700)}

/* ---------- Modal ---------- */
#modalWrap{position:fixed;inset:0;background:rgba(17,32,58,.45);z-index:950;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-xl);width:100%;max-width:640px;padding:24px 26px 22px}
.modal h3{font-family:var(--fd);font-weight:600;font-size:20px;letter-spacing:.03em;text-transform:uppercase;color:var(--navy);margin-bottom:4px}
.modal .lsub{font-size:12.5px;color:var(--grey-500);margin-bottom:16px}
.mFt{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}

/* ---------- Toast ---------- */
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:3000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--navy-900);color:#fff;border-radius:12px;padding:11px 18px;font-size:13px;font-weight:600;box-shadow:var(--sh-lg);max-width:min(520px,92vw)}
.toast.bad{background:var(--coral-700)}

/* ---------- Admin ---------- */
.adminGrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.stat{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px}
.stat.ok{background:var(--mint-100);color:var(--mint-700)}
.stat.wait{background:var(--amber-100);color:var(--amber-700)}
.stat.off{background:var(--grey-100);color:var(--grey-500)}
.prog{height:8px;border-radius:99px;background:var(--grey-100);overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;background:var(--blue);width:0;transition:width .2s var(--ease)}

/* ---------- Responsive ---------- */
/* minmax(0,…) and min-width:0 keep long one-line rows from widening the page on phones */
.twoCol>*,.adminGrid>*{min-width:0}
@media (max-width:1100px){ .twoCol,.adminGrid{grid-template-columns:minmax(0,1fr)} }
@media (max-width:860px){
  #app{flex-direction:column}
  #side{display:none}

  .mobNav{display:flex;gap:4px;overflow-x:auto;background:var(--navy);padding:0 10px 10px;position:sticky;top:46px;z-index:29}
  .mobNav .navBtn{width:auto;white-space:nowrap;padding:8px 12px;font-size:12.5px}
  .topBar{padding:12px 16px 10px;flex-wrap:wrap;position:static}

  .searchBox{order:3;max-width:none;flex-basis:100%;margin-left:0}

  .tbl .hideM{display:none}

  .lockCard{padding:26px 22px 22px}
}
@media (min-width:861px){ .mobNav{display:none} }
@media print{ #side,.topBar,.mobBar,.mobNav{display:none} }

body.demo #drawer{bottom:31px} body.demo #side{padding-bottom:31px} body.demo #view{padding-bottom:90px}
.nameCell{display:flex;align-items:center;gap:9px}

/* ---------- shared bits from NLO Cases ---------- */
.btn-teal{background:var(--mint);color:var(--navy-900);box-shadow:var(--sh-xs)}
.btn-teal:hover{background:var(--mint-600);box-shadow:var(--sh-md)}
.pickRow{display:flex;flex-wrap:wrap;gap:7px}
.pick{border:1.5px solid var(--grey-200);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--grey-700);background:#fff;min-height:38px;text-align:left;line-height:1.25}

.sprog{display:flex;align-items:center;gap:3px;width:100%;max-width:200px;margin:3px 0 5px}

@media (max-width:860px){ #modalWrap{padding:0} .modal.wide{border-radius:0;min-height:100vh} .tileGrid{grid-template-columns:repeat(2,1fr)} }

/* ---------- shared with NLO Leads / A/R ---------- */
.sideLink{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:#C9D4E5;text-decoration:none;padding:2px 2px}
.sideLink:hover{color:#fff}
.btnRow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.inRow{display:flex;gap:8px;align-items:center}
.inRow input{flex:1;min-width:0}
.subH{font-family:var(--fd);font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);margin:14px 0 8px}
.kvRow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--grey-100);font-size:13px}
.kvRow:last-of-type{border-bottom:none}
.kvRow b{color:var(--navy)}
span.ok{color:var(--mint-700);font-weight:600} span.bad{color:var(--coral-700);font-weight:600}
.seg{display:inline-flex;border:1.5px solid var(--grey-200);border-radius:99px;overflow:hidden;background:#fff}

details.raw,details.help{margin-top:10px}

/* settings */
.feedSt{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--grey-700);margin-bottom:2px}
.feedSt b{color:var(--navy)}
ol.steps{padding-left:20px;line-height:1.6;margin:6px 0 12px}
ol.steps li{margin-bottom:6px}
.cmd{display:flex;align-items:center;gap:8px;margin:6px 0;padding:8px 10px;border-radius:10px;background:var(--navy-900);color:#E8ECF2}

/* ---------- Phone fit (Oct 2026) ----------
   iPhones zoom the page in when a box under 16px gets the cursor (and it stays zoomed); the lead list now fits the
   screen instead of cutting off the "Next" column. */

}

}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

.listHd>span{flex:1;min-width:0}
/* importing */
.dropZone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--grey-300);border-radius:var(--r);padding:30px 18px;text-align:center;background:var(--grey-50);cursor:pointer;color:var(--grey-600);transition:border-color .14s var(--ease),background .14s var(--ease)}
.dropZone:hover,.dropZone:focus-visible{border-color:var(--navy-500);background:#fff}
.dropZone.over{border-color:var(--blue);background:var(--blue-100);color:var(--blue-700)}
.dropZone b{color:var(--navy);font-size:15px}
.pasteBox{margin-top:12px;border:1.5px solid var(--grey-200);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--grey-500);background:#fff;cursor:text;min-height:46px}
.pasteBox:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-100)}
.fileRow{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--grey-100)}
.fileRow:last-child{border-bottom:none}
.fileRow .fi{width:34px;height:34px;border-radius:10px;background:var(--navy-100);color:var(--navy);display:inline-flex;align-items:center;justify-content:center;flex:none}
.fileRow .fb{flex:1;min-width:0}
.fileRow .fb b{color:var(--navy);overflow-wrap:anywhere}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.chk.ok{color:var(--mint-700)} .chk.bad{color:var(--coral-700)} .chk.unk{color:var(--grey-500)}
.cov{display:inline-flex;gap:5px;flex-wrap:wrap}
.cov span{font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px;background:var(--mint-100);color:var(--mint-700)}
.cov span.no{background:var(--grey-100);color:var(--grey-500);text-decoration:line-through}
.prevGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.prevGrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.prevGrid div{background:var(--grey-50);border-radius:12px;padding:10px 12px;min-width:0}
.prevGrid .n{font-family:var(--fd);font-weight:600;font-size:20px;color:var(--navy);line-height:1.15}
.prevGrid .l{font-size:11.5px;font-weight:600;color:var(--grey-500)}
ol.steps b{color:var(--navy)}
.accessRow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--grey-100)}
.accessRow:last-child{border-bottom:none}
.accessRow .grow{flex:1;min-width:0}
.accessRow .grow b{color:var(--navy)}
.sw{position:relative;width:42px;height:24px;border-radius:99px;background:var(--grey-300);flex:none;transition:background .14s var(--ease)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:var(--sh-xs);transition:left .14s var(--ease)}
.sw[aria-checked="true"]{background:var(--mint-600)}

.rulesBox textarea{width:100%;min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;border:1.5px solid var(--grey-200);border-radius:10px;padding:10px}
.helpList{margin:12px 0 4px 18px;display:flex;flex-direction:column;gap:6px;color:var(--grey-700)}
.helpList b{color:var(--navy)}

/* =====================================================================
   NLO Time Off
   ===================================================================== */
.grow{flex:1;min-width:0}
.nowrap{white-space:nowrap}
.coral,b.coral{color:var(--coral-700)}
.stat.bad{background:var(--coral-100);color:var(--coral-700)}
.opt{font-family:var(--fb);text-transform:none;letter-spacing:0;font-weight:500;color:var(--grey-400)}
.card.flat{box-shadow:none;border:none}
.card.flat .cardHd,.card.flat .cardBd{padding-left:0;padding-right:0}
.mOnly{display:none}

/* a callout at the top of Home (requests waiting) */
.callout{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border-radius:var(--r);padding:12px 16px;margin-bottom:16px;font-size:13.5px;box-shadow:var(--sh-xs)}
.callout span{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}

.callout.amber b{color:var(--navy)}
.callout:hover{box-shadow:var(--sh-md)}

/* balances */
.balGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}
.balGrid.sm{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:6px}
.balGrid.sm .balCard.yr{grid-column:1/-1}
.balCard.wide{grid-column:1/-1}
.balCard{border-top:4px solid var(--grey-300)}
.balCard .cardBd{padding:14px 18px 16px}

.balCard.sick{border-top-color:var(--blue-500)}
.balCard.yr{border-top-color:var(--navy)}
.balTop{display:flex;align-items:center;gap:8px;font-family:var(--fd);font-weight:500;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey-600)}
.balCard.vac .balTop .i{color:var(--mint-700)} .balCard.sick .balTop .i{color:var(--blue)}
.balTop .tierPill{margin-left:auto}
.balN{font-family:var(--fd);font-weight:600;font-size:34px;line-height:1.1;color:var(--navy);margin-top:6px;font-variant-numeric:tabular-nums}
.balN small{font-size:15px;font-weight:500;color:var(--grey-500)}
.balD{font-size:12.5px;font-weight:600;color:var(--grey-600)}
.balSub{font-size:12.5px;color:var(--grey-700);margin-top:6px}
.balSub.muted{color:var(--grey-500);margin-top:3px}
.balEmpty{display:flex;gap:12px;align-items:flex-start;color:var(--grey-600)}
.balEmpty b{color:var(--navy)}
.balGrid.sm .balN{font-size:26px}
.tierPill{display:inline-flex;align-items:center;font-family:var(--fb);font-size:11px;font-weight:700;letter-spacing:.02em;text-transform:none;border-radius:99px;padding:2px 9px;background:var(--grey-100);color:var(--grey-600);white-space:nowrap}
/* tiers by years of service: Bronze, Silver, Gold, Platinum, Double Platinum */
.tierPill.t1{background:#F5E6D8;color:#8A5326}
.tierPill.t2{background:#E9EDF1;color:#4E5A66;box-shadow:inset 0 0 0 1px #D3DAE1}
.tierPill.t3{background:#FBEFC6;color:#7A5B00;box-shadow:inset 0 0 0 1px #EFD98A}
.tierPill.t4{background:#E3EEF3;color:#2F5E72;box-shadow:inset 0 0 0 1px #C3D9E3}
.tierPill.t5{background:linear-gradient(135deg,#DDE9EF,#F6FAFC 45%,#C9DCE6);color:#1D3F50;box-shadow:inset 0 0 0 1px #A9C6D4,0 0 0 2px #fff,0 0 0 3px #A9C6D4;margin-inline:3px} /* Double Platinum: a double ring */
.tierPill.t6{background:var(--navy);color:#fff}

/* requests on a list */
.reqRow{display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid var(--grey-100);border-radius:8px;cursor:pointer}
.reqRow:last-child{border-bottom:none}
.reqRow:hover{background:var(--grey-50)}
.reqRow .nameCell{min-width:110px}
.rrMain{flex:1;min-width:0}
.rrDates{font-weight:700;color:var(--navy)}
.badge.ty-vac{background:var(--mint-100);color:var(--mint-700)}
.badge.ty-sick{background:var(--blue-100);color:var(--blue-700)}
.badge.ty-personal{background:var(--navy-100);color:var(--navy-700)}
.badge.ty-medical{background:var(--amber-100);color:var(--amber-700)}
.badge.ty-family{background:var(--coral-100);color:var(--coral-700)}
.badge.ty-bereave{background:var(--grey-200);color:var(--grey-700)}

.badge.unp{background:var(--coral-100);color:var(--coral-700)}
.cntPill{display:inline-block;min-width:20px;text-align:center;font-size:11px;font-weight:700;border-radius:99px;padding:0 6px;background:var(--amber);color:var(--navy-900);margin-left:4px}

/* who's out: this week, next week */
.wkDay{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:7px 0;border-bottom:1px solid var(--grey-100);font-size:13px}
.wkDay:last-child{border-bottom:none}
.wkD{width:96px;flex:none;font-weight:600;color:var(--grey-600);font-size:12.5px}
.wkDay.today .wkD{color:var(--blue-700)}
.wkDay.closed{color:var(--grey-500)}
.outChip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px 2px 2px;background:var(--mint-100);color:var(--navy);font-size:12.5px;font-weight:600;white-space:nowrap;max-width:100%}

.outChip[role=button]{cursor:pointer}
.outChip[role=button]:hover{box-shadow:0 0 0 2px var(--mint-200)}
.outChip.asked{background:#fff;border:1.5px dashed var(--amber);padding:1px 9px 1px 1px}
.outChip.demoChip{padding:1px 9px}

/* the month calendar */
.calBar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.calBar h3{font-family:var(--fd);font-weight:600;font-size:18px;letter-spacing:.04em;text-transform:uppercase;color:var(--navy);min-width:170px;text-align:center}
.cal{background:#fff;border-radius:var(--r);border:1px solid var(--grey-100);box-shadow:var(--sh-xs);overflow:hidden}
.calHead,.calGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1.6fr)) repeat(3,minmax(0,.6fr))}
.calHead div{font-family:var(--fd);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey-500);padding:9px 10px;border-bottom:1px solid var(--grey-100)}
.calHead div.off{color:var(--grey-300)}
.calDay{min-height:92px;padding:6px 7px 8px;border-right:1px solid var(--grey-100);border-bottom:1px solid var(--grey-100);display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}

.calDay.other{background:var(--grey-50)}

.cdW{display:none}
.clTag{font-size:11px;font-weight:600;color:var(--grey-500)}
.calDay .outChip{font-size:11.5px}

/* the request form */
.formGrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.formGrid>div:last-child{position:sticky;top:76px}
.typeGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.typeTile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;border:1.5px solid var(--grey-200);border-radius:12px;padding:10px 12px;text-align:left;background:#fff;min-height:74px}
.typeTile span{font-weight:700;color:var(--navy);font-size:13.5px}
.typeTile small{font-size:11.5px;color:var(--grey-500)}
.typeTile .i{color:var(--grey-500)}
.typeTile:hover{border-color:var(--navy-500)}
.typeTile[aria-pressed="true"]{border-color:var(--navy);background:var(--navy-100);box-shadow:0 0 0 2px var(--navy-100)}
.typeTile.ty-vac[aria-pressed="true"] .i{color:var(--mint-700)} .typeTile.ty-sick[aria-pressed="true"] .i{color:var(--blue)} .typeTile.ty-family[aria-pressed="true"] .i{color:var(--coral-600)} .typeTile.ty-medical[aria-pressed="true"] .i{color:var(--amber-700)}
.seg.wrap{display:flex;flex-wrap:wrap;border:none;border-radius:0;overflow:visible;background:none;gap:6px}
.seg.wrap button{border:1.5px solid var(--grey-200);border-radius:99px;background:#fff}
.seg.wrap button[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:#fff}
.sumCard .cardBd{padding-top:0}
.sumBig{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.sumBig b{font-family:var(--fd);font-weight:600;font-size:30px;color:var(--navy);line-height:1.1}
.sumBig span{font-size:13px;font-weight:600;color:var(--grey-600)}
.dayList{display:flex;flex-wrap:wrap;gap:5px}
.dayPill{font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--grey-100);color:var(--grey-700);white-space:nowrap}
.checks{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.chkLine{display:flex;gap:8px;align-items:flex-start;border-radius:10px;padding:8px 11px;font-size:12.5px;font-weight:600;line-height:1.4}
.chkLine .i{margin-top:1px}
.chkLine.bad{background:var(--coral-100);color:var(--coral-700)}
.chkLine.warn{background:var(--amber-100);color:var(--amber-700)}
.chkLine.info{background:var(--blue-100);color:var(--blue-700)}
label.chk{margin:4px 0 2px;font-size:13px;color:var(--navy);cursor:pointer}
label.chk input{width:17px;height:17px;accent-color:var(--navy)}

/* approvals */
.apCard{margin-bottom:14px}
.apHd{display:flex;align-items:center;gap:12px;padding:14px 18px 8px;flex-wrap:wrap}
.apHd .grow b{font-size:15px;color:var(--navy)}
.apWhen{text-align:right}
.apWhen b{font-family:var(--fd);font-weight:600;font-size:17px;color:var(--navy);letter-spacing:.02em}
.apBd{padding:0 18px 6px;display:flex;flex-direction:column;gap:6px}
.apNote{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--grey-50);border-radius:10px;padding:8px 11px;color:var(--grey-700)}
.apFt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 18px 14px;border-top:1px solid var(--grey-100);margin-top:6px}
.decide{display:flex;flex-direction:column}
.decide .kvRow{padding:5px 0}

/* the statement */
.tbl.stmt td,.tbl.stmt th{padding:8px 10px}
.tbl.stmt tr.fut td{color:var(--grey-400)}
.tbl.stmt tr.fut td .linkBtn{color:var(--grey-500)}
.plus{color:var(--mint-700);font-weight:700}
.minus{color:var(--coral-700);font-weight:700}
.tbl.stmt tr.fut .plus,.tbl.stmt tr.fut .minus{color:inherit;font-weight:600}
.stmtFix{display:block;font-size:11.5px;color:var(--grey-500)}
.helpTxt p{margin:8px 0}
.helpTxt b{color:var(--navy)}

/* settings */
.polGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 14px}
.tierEd{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr)) auto;gap:6px 10px;align-items:center;margin:4px 0 12px}
.tierEd .h{font-family:var(--fd);font-weight:500;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey-500)}
.tierEd input{min-height:36px;padding:6px 10px}
.tierEd .iconBtn{width:34px;height:34px}
.routeEd{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:6px 12px;align-items:center;margin:4px 0 12px;font-size:13px}
.routeEd select{min-height:36px;padding:5px 10px}
.leRow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--grey-100);font-size:13px;flex-wrap:wrap}
.leRow:last-child{border-bottom:none}
.leRow .grow b{color:var(--navy)}
.leRow .iconBtn{width:34px;height:34px}
.addRow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:8px;align-items:end;margin-top:12px}
.addRow .field{margin-bottom:0}
.kinds{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.kinds label{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border:1.5px solid var(--grey-200);border-radius:99px;padding:4px 11px;cursor:pointer}
.kinds input{accent-color:var(--navy)}
.keyBox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--grey-50);border:1px solid var(--grey-200);border-radius:10px;padding:8px 10px;overflow-wrap:anywhere;user-select:all;margin:6px 0}

/* moving from the old app */
.imPerson{border:1px solid var(--grey-100);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;background:#fff}
.imPerson.skip{opacity:.6}
.imHd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.imHd .grow b{color:var(--navy);font-size:14px}
.imHd select{max-width:240px;min-height:36px;padding:5px 10px}
.imNums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.imNum{border:1.5px solid var(--grey-200);border-radius:12px;padding:8px 11px;text-align:left;background:#fff;display:flex;flex-direction:column;gap:2px;min-width:0}
.imNum .k{font-family:var(--fd);font-weight:500;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey-500)}
.imNum .v{font-weight:700;color:var(--navy);font-size:13.5px;font-variant-numeric:tabular-nums}
.imNum[aria-pressed="true"],.imNum.on{border-color:var(--navy);background:var(--navy-100);box-shadow:0 0 0 2px var(--navy-100)}
.imNum .two{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.imNum input{min-height:32px;padding:4px 8px;width:100%;border:1.5px solid var(--grey-200);border-radius:8px;font-size:13px}
.imWhy{font-size:12.5px;color:var(--grey-700);display:flex;flex-direction:column;gap:3px;margin-top:4px}
.imWhy .d{display:flex;gap:10px;align-items:baseline}
.imWhy .d b{min-width:70px;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.imFlag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 9px;background:var(--amber-100);color:var(--amber-700);white-space:nowrap}
.imFlag.ok{background:var(--mint-100);color:var(--mint-700)}
.imFlag.bad{background:var(--coral-100);color:var(--coral-700)}
.shWait{border:1px solid var(--blue-100);background:#F6FAFD;border-radius:12px;padding:10px 14px 6px;margin:0 0 14px}
.shWait .accessRow{padding:8px 0}
.btnCol{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.imSh{display:flex;align-items:flex-start;gap:6px;margin-top:8px;color:var(--blue-700)}
.imSh .i{flex:none;margin-top:1px}
.imSh.muted{color:var(--grey-500)}
.imSh.warn{color:var(--amber-700)}

@media (max-width:1100px){ .formGrid{grid-template-columns:minmax(0,1fr)} .formGrid>div:last-child{position:static} }
@media (max-width:860px){
  .mOnly{display:block}
  .balGrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .balGrid .balCard.yr{grid-column:1/-1}
  .calHead,.calGrid{grid-template-columns:minmax(0,1fr)}
  .calHead{display:none}
  .calDay.off,.calDay.other{display:none}
  .calDay{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:none;padding:8px 10px}
  .calDay:not(.has):not(.closed):not(.today){display:none}
  .cdW{display:inline;font-weight:600;color:var(--grey-500);margin-left:6px}
  .cd{min-width:84px}
  .calDay.today .cd{min-width:0}
  .polGrid{grid-template-columns:1fr 1fr}
  .addRow{grid-template-columns:1fr 1fr}
  .imNums{grid-template-columns:minmax(0,1fr)}
  .apWhen{text-align:left;flex-basis:100%}
  .reqRow{flex-wrap:wrap}
}
@media (max-width:520px){
  .balGrid{grid-template-columns:minmax(0,1fr)}
  .balN{font-size:28px}
  .wkD{width:100%}
  .tierEd{grid-template-columns:repeat(3,minmax(0,1fr)) auto}
  .tierEd .n{display:none}
  .routeEd{grid-template-columns:minmax(0,1fr) 130px}
  .addRow{grid-template-columns:minmax(0,1fr)}
}

/* ---------- from A/R: status pills, tick lists ---------- */
.sug{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--grey-100);color:var(--grey-600)}
.sug.red{background:var(--coral-100);color:var(--coral-700)}
.sug.amber{background:var(--amber-100);color:var(--amber-700)}
.sug.navy{background:var(--navy-100);color:var(--navy-700)}
.sug.mint{background:var(--mint-100);color:var(--mint-700)}
.sug.blue{background:var(--blue-100);color:var(--blue-700)}
.chkList{display:flex;flex-direction:column;gap:2px}
.chkList label{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:9px;font-size:13px;cursor:pointer}
.chkList label:hover{background:var(--grey-50)}
.chkList input{width:17px;height:17px;margin-top:1px;accent-color:var(--mint-700);flex:none}
.chkList label.on{color:var(--grey-500)}
/* scrubs: the color swatches on the form, and each pair's block */
.swatch{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:7px;vertical-align:-1px;box-shadow:inset 0 0 0 1px rgba(17,32,58,.18)}
.sw-navy{background:#1F2B4A}.sw-gray{background:#8A9199}.sw-teal{background:#178A8C}.sw-black{background:#16181B}
.skItem{border-top:1px solid var(--grey-100);padding-top:10px;margin-top:4px}
.skItem:first-child{border-top:0;padding-top:0;margin-top:0}
.field .chkList label{display:flex;align-items:center;text-transform:none;letter-spacing:0;font-family:var(--fb);font-size:13.5px;font-weight:600;color:var(--grey-700);margin:0;padding:8px 8px}
.seg [aria-pressed="true"] .swatch{box-shadow:0 0 0 2px #fff}

<script>
'use strict';
/* =====================================================================
   NLO Time Off — time-off requests, approvals, vacation and sick
   balances, and staff benefits, in one place.
   - Same logins as NLO Cases, NLO Leads and NLO A/R (same Firebase
     project, same usernames and passwords).
   - Requests are sealed in the browser before they're saved: one copy
     for the person who asked (sealed to their own key) and one for the
     people who approve (sealed to the HR key). The database only ever
     holds ciphertext plus who it belongs to and its status.
   - Balances aren't stored numbers a script overwrites: they're worked
     out from the policy, the person's hire date and their approved time
     off (policy.js), the same way on every screen.
   ===================================================================== */

/* ---------- Firebase project (same project as NLO Cases) ---------- */
const FB_CONFIG = {
  apiKey: "AIzaSyAoPSh6DaKTeg-NplM-UaPoxlFdTo0u4go",
  authDomain: "nlo-cases.firebaseapp.com",
  projectId: "nlo-cases",
  appId: "1:1050188201609:web:df7890b26686b41a395058"
};
/* Synthetic login addresses for staff usernames (no mail is ever sent to them). */
const STAFF_DOMAIN = 'staff.thenextlevelorthodontics.com';
const KDF_ITER = 600000;
const OFFICE_NAME = 'Next Level Orthodontics';
const APP_NAME = 'NLO Time Off';

/* ---------- small utils ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function uid8() { return Array.from(crypto.getRandomValues(new Uint8Array(6)), b => b.toString(16).padStart(2, '0')).join(''); }
function hexId(n) { return Array.from(crypto.getRandomValues(new Uint8Array(n)), b => b.toString(16).padStart(2, '0')).join(''); }
function todayISO() { return isoOf(new Date()); }
function isoOf(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parseISO(iso) { const [y, m, d] = String(iso).split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(iso, n) { const dt = parseISO(iso); dt.setDate(dt.getDate() + n); return isoOf(dt); }
function addMonths(iso, n) {
  const [y, m, d] = iso.split('-').map(Number), last = new Date(y, m - 1 + n + 1, 0).getDate();
  return isoOf(new Date(y, m - 1 + n, Math.min(d, last)));
}
function isISO(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && isoOf(parseISO(s)) === s; }
/* whole days from a to b (both YYYY-MM-DD); UTC maths so daylight-saving changes never skew it */
function daysBetween(a, b) { const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = b.split('-').map(Number); return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 86400000); }
function dayDiff(iso) { if (!iso) return null; return daysBetween(todayISO(), iso); }
function weekday(iso) { return parseISO(iso).getDay(); }
function lastOfMonth(iso) { const [y, m] = iso.split('-').map(Number); return isoOf(new Date(y, m, 0)); }
function isLastOfMonth(iso) { return lastOfMonth(iso) === iso; }
/* the office's time zone: a request's first day starts at midnight in Gainesville, whatever clock the device is on */
const OFFICE_TZ = 'America/New_York';
const TZ_FMT = new Intl.DateTimeFormat('en-US', { timeZone: OFFICE_TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', hourCycle: 'h23' });
function tzParts(ms) { const o = {}; TZ_FMT.formatToParts(new Date(ms)).forEach(x => { o[x.type] = x.value; }); return o; }
/* midnight at the office on a day, in ms (the rules let someone cancel approved time off only before it starts) */
function dayStartMs(iso) {
  const [y, m, d] = iso.split('-').map(Number), t = Date.UTC(y, m - 1, d, 5); // midnight in winter (UTC−5)
  return t - Number(tzParts(t).hour) * 3600000;                           // an hour earlier in summer (UTC−4)
}
/* the office's date at a moment */
function isoOfMs(ms) {
  if (typeof ms !== 'number' || !(ms > 946684800000 && ms < 4102444800000)) return ''; // 2000 to 2100, or it isn't a day here
  const o = tzParts(ms); return o.year + '-' + o.month + '-' + o.day;
}
function fmtDate(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-').map(Number); const dt = new Date(y, m - 1, d); const opts = { month: 'short', day: 'numeric' }; if (y !== new Date().getFullYear()) opts.year = 'numeric'; return dt.toLocaleDateString('en-US', opts); }
function fmtDateLong(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }); }
function fmtDay(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); }
function fmtDayY(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-').map(Number); const o = { weekday: 'short', month: 'short', day: 'numeric' }; if (y !== new Date().getFullYear()) o.year = 'numeric'; return new Date(y, m - 1, d).toLocaleDateString('en-US', o); }
function fmtMonth(iso) { const [y, m] = iso.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' }); }
function fmtWhen(ms) { if (!ms) return ''; const d = new Date(ms); return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ', ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); }
function fmtAgo(ms) {
  const m = Math.round((Date.now() - ms) / 60000);
  if (m < 2) return 'just now'; if (m < 60) return m + ' min ago'; const h = Math.round(m / 60); if (h < 24) return h + ' h ago';
  const d = Math.round(h / 24); return d === 1 ? 'yesterday' : d + ' days ago';
}
/* a range of days, short: "Oct 26 – 29", "Oct 30 – Nov 2", "Mon, Oct 26" */
function fmtRange(a, b) {
  if (!b || a === b) return fmtDay(a);
  const [y1, m1] = a.split('-').map(Number), [y2, m2] = b.split('-').map(Number), cy = new Date().getFullYear();
  if (y1 === y2 && m1 === m2) return parseISO(a).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' – ' + Number(b.slice(8)) + (y1 !== cy ? ', ' + y1 : '');
  return fmtDate(a) + ' – ' + fmtDate(b);
}
function round2(n) { return Math.round((Number(n) || 0) * 100) / 100; }
/* hours on screen: 34, 4.25, 2.83 (at most two decimals, none when whole) */
function hrs(n) { const r = round2(n); return (Object.is(r, -0) ? 0 : r).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
function initials(name) { const p = String(name || '').replace(/\([^)]*\)/g, ' ').replace(/^dr\.?\s+/i, '').trim().split(/\s+/).filter(Boolean); if (!p.length) return '?'; return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); }
function slug(s) { return String(s || '').toLowerCase().normalize('NFKD').replace(/[^\w.\-]+/g, '').replace(/_/g, '').slice(0, 30); }
function firstName(n) { return String(n || '').replace(/^dr\.?\s+/i, '').split(/\s+/)[0] || ''; }
function errCode(code, msg) { const e = new Error(msg || code); e.code = code; return e; }
/* a request's sealed content makes sense (anything else is treated like one that can't be opened) */
function okContent(c) {
  return !!c && typeof c === 'object' && isISO(c.start) && isISO(c.end) && c.end >= c.start && daysBetween(c.start, c.end) <= 366
    && typeof c.type === 'string' && c.type.length <= 20 && (c.part == null || typeof c.part === 'string')
    && ['note', 'cover'].every(k => c[k] == null || (typeof c[k] === 'string' && c[k].length <= 5000))
    && (c.events == null || Array.isArray(c.events));
}
function money(n) { return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }); }

/* ---------- crypto (the same sealing as NLO Cases, Leads and A/R) ---------- */
const TE = new TextEncoder(), TD = new TextDecoder();
function b64(buf) {
  const u = buf instanceof Uint8Array ? buf : new Uint8Array(buf), CH = 0x8000;
  let s = ''; for (let i = 0; i < u.length; i += CH) s += String.fromCharCode.apply(null, u.subarray(i, i + CH));
  return btoa(s);

function preview(person, reqs, r, pol, closed, today) {
  const t = today || todayISO(), mine = Object.assign({}, r, { id: r.id || '__new', status: 'approved' });
  const all = (reqs || []).filter(x => x.id !== mine.id).concat([mine]);
  const end = isISO(mine.end) && mine.end > t ? mine.end : t;
  const L = ledger(person, all, pol, closed, end), st = L.byReq[mine.id] || { days: 0, hours: 0, vac: 0, sick: 0, free: 0, unpaid: 0, before: 0 };
  return Object.assign({ bucket: bucketOf(mine, pol), after: { vac: L.vac, sick: L.sick }, end }, st);
}

/* ---------- warnings and blocks on a request ---------- */
/* the handbook asks for 3 months' notice for more than 2 days in a row of planned time off */
function noticeShort(r, pol, closed, today) {
  const t = TYPE[r.type]; if (!t || !t.plan || !pol.noticeMonths) return null;
  const n = reqDays(r, closed, pol).length; if (n <= pol.noticeDays) return null;
  const need = addMonths(today || todayISO(), pol.noticeMonths); if (r.start >= need) return null;
  return { days: n, months: pol.noticeMonths, by: need };
}
/* blackout periods (Dr. A's list): every January, Thanksgiving week, or set dates; each for some kinds of time off */
const BLACKOUTS = [
  { id: 'jan', label: 'January', kind: 'month', month: 1, types: ['vac', 'personal', 'other'] },
  { id: 'thx', label: 'Thanksgiving week', kind: 'thanksgiving', types: ['vac', 'personal', 'other'] }

function blackoutsOf(settings) {
  const b = settings && settings.to && Array.isArray(settings.to.blackouts) ? settings.to.blackouts : BLACKOUTS;
  return b.filter(x => x && typeof x.id === 'string' && ['month', 'thanksgiving', 'dates'].includes(x.kind) && Array.isArray(x.types));
}

  if (b.kind === 'thanksgiving') { const t = thanksgiving(y); return [addDays(t, -3), addDays(t, 3)]; }
  if (b.kind === 'dates' && isISO(b.from) && isISO(b.to)) return [b.from, b.to];
  return null;
}

  for (const b of list || []) {

    const years = b.kind === 'dates' ? [0] : Array.from(new Set([Number(r.start.slice(0, 4)), Number(r.end.slice(0, 4))]));
    for (const y of years) { const rg = blackoutRange(b, y); if (rg && r.start <= rg[1] && r.end >= rg[0]) out.push({ b, from: rg[0], to: rg[1] }); }
  }

  if (b.kind === 'thanksgiving') return 'Thanksgiving week, Monday to Sunday, every year';

/* the office days two requests share */
function sharedDays(a, b, closed, pol) {
  if (!isISO(a.start) || !isISO(b.start) || a.end < b.start || b.end < a.start) return [];
  const lo = a.start > b.start ? a.start : b.start, hi = a.end < b.end ? a.end : b.end, out = [];
  for (let d = lo, g = 0; d <= hi && g < 400; d = addDays(d, 1), g++) if (isOfficeDay(d, closed)) out.push(d);

/* checks a request before it's sent or approved → { blocks: [...], warns: [...] } (each { k, msg }) */

  if (!TYPE[r.type]) blocks.push({ k: 'type', msg: 'Pick what kind of time off it is.' });
  if (!isISO(r.start) || !isISO(r.end)) blocks.push({ k: 'dates', msg: 'Pick the first and last day.' });
  else if (r.end < r.start) blocks.push({ k: 'dates', msg: 'The last day is before the first day.' });
  else if (daysBetween(r.start, r.end) > 120) blocks.push({ k: 'dates', msg: 'That’s more than four months — split it into shorter requests.' });
  if (blocks.length) return { blocks, warns, days: [] };
  const days = reqDays(r, closed, pol);
  if (!days.length) blocks.push({ k: 'closed', msg: 'The office is closed every day in that range (it’s open Monday to Thursday).' });
  for (const h of blackoutHits(r, blackouts)) blocks.push({ k: 'blackout', msg: h.b.label + ' is a blackout period for ' + typeLabel(r.type).toLowerCase() + ' (' + fmtDate(h.from) + ' – ' + fmtDate(h.to) + ').', b: h.b });
  // sick leave is only ever after the fact: today or days already past, never ahead of time (Dr. A, 9 Oct 2026) — the
  // one kind that can't be planned; a planned appointment is a medical appointment
  if (r.type === 'sick' && r.end > (today || todayISO())) blocks.push({ k: 'sickAhead', msg: 'Sick leave is only for today or days already past — it can’t be asked for ahead of time. For a planned appointment, choose Medical appointment.' });
  if (r.start < (today || todayISO()) && TYPE[r.type] && TYPE[r.type].plan) warns.push({ k: 'past', msg: 'It starts in the past.' });
  const n = noticeShort(r, pol, closed, today);
  if (n) warns.push({ k: 'notice', msg: 'The handbook asks for ' + n.months + ' months’ notice for more than ' + pol.noticeDays + ' days in a row (' + n.days + ' office days here).' });
  if (r.type === 'bereave') {
    if (days.length > pol.bereaveDays) warns.push({ k: 'bereave', msg: 'Bereavement is up to ' + pol.bereaveDays + ' days; this is ' + days.length + '.' });
    if (person && person.type === 'PT' && r.paid) warns.push({ k: 'bereave', msg: 'For part-time staff bereavement is unpaid.' });
  }
  if (person && r.paid && ['vac', 'sick'].includes(bucketOf(r, pol))) {
    const pv = preview(person, reqs || [], r, pol, closed, today);
    if (pv.unpaid > 0) warns.push({ k: 'short', msg: hrs(pv.unpaid) + ' of the ' + hrs(pv.hours) + ' hours would be unpaid — there isn’t enough ' + (pv.bucket === 'sick' ? 'sick leave' : 'vacation') + ' by then.', unpaid: pv.unpaid });
  }

}

/* ---------- scrubs: a yearly allowance (Dr. A, 9 Oct 2026) — asked for by Dec 15 with a reason, approved like time off, and
   the order emailed to community@; what's not asked for doesn't carry over ---------- */
const SCRUBS = { perYear: 2, byDay: 15, to: 'community@thenextlevelorthodontics.com' };

/* whether scrubs can still be asked for this year (closed after Dec 15 until Jan 1) */

function scrubItemText(it) { return [scrubLabel(SCRUB_COLORS, it.color), scrubLabel(SCRUB_PIECES, it.piece).toLowerCase(), it.size, it.petite ? 'petite' : ''].filter(Boolean).join(' · '); }

/* ---------- payroll: what each person's approved time off comes to in a pay period ---------- */
function payPeriod(L, from, to) {
  const o = { vac: 0, sick: 0, free: 0, unpaid: 0, days: new Set() };
  for (const e of L.entries) {
    if (e.date < from || e.date > to) continue;
    if (e.k === 'take') { o[e.b] = round2(o[e.b] + e.paid); o.unpaid = round2(o.unpaid + e.unpaid); o.days.add(e.date); }
    else if (e.k === 'free') { o.free = round2(o.free + e.h); o.days.add(e.date); }
    else if (e.k === 'unpaid') { o.unpaid = round2(o.unpaid + e.h); o.days.add(e.date); }
  }
  o.days = o.days.size; return o;
}

/* =====================================================================

   source for all staff related things. it should be what's feeding all
   the other apps"). Staff Hub shares a basic team list in the
   nlo-inventory database (nlo/cadence/roster): for each person the name
   they go by, title, whether they're still on staff and their last day,
   their start date and full- or part-time. Time Off takes each person's
   start date (vacation tiers count from it), full-/part-time and last
   day from it; NLO Cases' team, which Time Off shows, takes the name.

   HR record's terms. Reading it, and putting it in the records, is in
   staffhub.js.
   ===================================================================== */
const SH_OWNER_ID = 's_amir'; // Staff Hub's entry for Dr. A (no time off of his own here)
const SH_NONE = '-';          // a team entry's roster id when Dr. A has said they aren't on Staff Hub (never matched by name)

/* a name on Staff Hub's roster, only when it's sure: a first and last name, matching someone's whole name, else their first name (or
   the one they go by) and last name — one person, or one still on staff among several. A single name ("Sarah") never matches. */
function shByName(name, people, today) {
  const n = shNorm(name), parts = n.split(' ').filter(Boolean); if (parts.length < 2) return null;
  const f = parts[0], l = parts[parts.length - 1], t = today || todayISO();
  const one = hit => { if (hit.length === 1) return hit[0]; const cur = hit.filter(p => !shGone(p, t)); return cur.length === 1 ? cur[0] : null; };
  const whole = people.filter(p => shNorm(p.name) === n); if (whole.length) return one(whole);
  return one(people.filter(p => p.last && shNorm(p.last) === l && [p.first, p.nick].some(x => x && shNorm(x) === f)));
}
/* the Staff Hub person an NLO Cases team entry is: by the roster id saved when it was linked (or set by Dr. A), else — a current
   login — by name */
function shFind(r, people, today) {
  if (!r || r.role === 'owner') return null;
  const p = r.rid ? (r.rid === SH_NONE ? null : people.find(x => x.id === r.rid) || null) : r.active ? shByName(r.name, people, today) : null;
  return p && p.id !== SH_OWNER_ID ? p : null;
}
/* NLO Cases' team (Time Off's people) on Staff Hub's roster → Map(sid → person). A saved link wins over a match by name; a person
   two current logins point to the same way is left out (that needs a look, not a guess); a removed login is linked only by its
   saved id, and only to someone no current login is. */

  const byId = [], byName = [], old = [];

  const count = list => { const m = new Map(); list.forEach(([, p]) => m.set(p.id, (m.get(p.id) || 0) + 1)); return m; };
  const ni = count(byId), nn = count(byName), no = count(old), out = new Map();

  old.forEach(([sid, p]) => { if (!ni.has(p.id) && !nn.has(p.id) && no.get(p.id) === 1) out.set(sid, p); });
  return out;
}
/* for Team and Settings: who's on Staff Hub without a login here, current logins Staff Hub doesn't have (not counting the ones Dr. A

  (roster || []).forEach(r => { const p = shFind(r, people, t); if (p) used.add(p.id); });

    missing: cur.filter(r => r.rid !== SH_NONE && !shFind(r, people, t)).sort(byName),
    twice: Array.from(twice.values()),
    free: people.filter(p => p.id !== SH_OWNER_ID && !curIds.has(p.id)).sort((a, b) => shGone(a, t) - shGone(b, t) || byName(a, b))

  /* =====================================================================

  async _saveReq(id, fn, opts, tries) {

      await FB.track(FB.db.runTransaction(async tx => {
        const hrPub = FB.hrPub, hrV = FB.hrV; // read together: the copy is always sealed to the version it says

          if (opts.fresh) throw errCode('exists', 'This request is already here.');
          const d = s.data(); if (opts.rev && d.rev !== opts.rev) throw errCode('changed', 'This request was just changed — look at it again.');

        // login's key changed in place, when there's no copy for them until the login is reissued)
        let mine = FB.trustedPub(content.sid);
        if (!mine && content.sid !== FB.me.staffId && !FB.people.has(content.sid)) { const pp = await tx.get(FB.doc('toPeople/' + content.sid)); if (pp.exists) mine = FB.trusted(pp.data()); }

/* ---------- events ---------- */
async function copyText(s) {
  try { await navigator.clipboard.writeText(s); return true; } catch (e) { }
  try { const ta = document.createElement('textarea'); ta.value = s; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok; } catch (e) { return false; }
}
async function act(fn, okMsg) { try { await fn(); if (okMsg) toast(okMsg); return true; } catch (e) { toast(errText(e), { bad: true }); return false; } }
Object.assign(ACT, {
  async nav(t) {
    const v = t.dataset.v; if (!v) return;
    if (S.view === 'new' && v !== 'new' && formDirty() && !(await confirmBox('Leave without sending this request?', 'What you’ve filled in so far will be lost.', 'Leave', true))) return;
    if (v === 'new' && (S.view !== 'new' || t.dataset.fresh)) S.form = null;
    S.view = v; if (t.dataset.tab) S.tab[v] = t.dataset.tab;
    closeDrawer(); renderNav(); renderView(); window.scrollTo(0, 0);
  },
  tab(t) { S.tab[S.view] = t.dataset.t; renderView(); },
  closeDrawer() { closeDrawer(); },
  closeModal() { closeModal(); },
  async lock() {
    if (B.pending && !(await confirmBox('Lock now?', 'A change is still being saved (is the internet connected?). Locking now may lose it.', 'Lock anyway', true))) return;
    lockOut('Locked. Sign in to continue.');
  },
  lockSignOut() { S.loginPw = ''; B.signOut().then(() => lockScreen('login')); },
  forgot() { lockScreen('forgot'); },
  toLogin() { lockScreen('login'); },
  demoAs(t) { S.as = t.dataset.as || ''; DEMO.as = S.as; $$('[data-act=demoAs]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.as === S.as))); },
  copyVal(t) { copyText(t.dataset.v).then(ok => toast(ok ? 'Copied' : 'Couldn’t copy — select it and copy by hand', ok ? {} : { bad: true })); },
  async retryOpen() { S.st = 'opening'; renderView(); let st; try { st = await B.toOpen(); } catch (e) { st = 'error'; S.loadErr = errText(e); } S.st = st; renderShell(); if (st === 'hr' || st === 'staff') startLive(); else renderView(); },
  async setupTO(t) { busyBtn(t, true, 'Setting up…'); try { await B.toSetup(); S.st = 'hr'; toast('Time Off is set up — choose who approves, then move everyone’s records over'); S.view = 'settings'; startLive(); setTimeout(upkeep, 1500); } catch (e) { busyBtn(t, false); toast(errText(e), { bad: true }); } },
  copyRules() { copyText(rulesText()).then(ok => toast(ok ? 'Rules copied — paste them in the Firebase console and press Publish' : 'Couldn’t copy — open “See the rules” and copy by hand', ok ? { ms: 6000 } : { bad: true })); }
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'hrRestoreForm') return; e.preventDefault();
  const btn = $('button[type=submit]', e.target); busyBtn(btn, true, 'Restoring…');
  try { await B.hrRestore($('#hrCode').value); toast('HR key restored'); S.st = 'hr'; renderShell(); startLive(); } catch (x) { busyBtn(btn, false); toast(errText(x), { bad: true }); }
});
function onClick(e) {
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (t.tagName === 'SELECT' || (t.tagName === 'INPUT' && t.type !== 'button' && t.type !== 'submit' && t.type !== 'checkbox' && t.type !== 'radio')) return;
  const a = t.dataset.act;
  if (ACT[a]) ACT[a](t, e);
}
function onChange(e) { const t = e.target; if (t.dataset && t.dataset.chg && CHG[t.dataset.chg]) CHG[t.dataset.chg](t, e); }
function onInput(e) { const t = e.target; if (t.dataset && t.dataset.inp && CHG[t.dataset.inp]) CHG[t.dataset.inp](t, e); }

/* =====================================================================
   The screens: Home, Request time off, My time off (requests and the
   statement), Who's out, My benefits — and, for the people who approve,
   Approvals and Team. The request and person panels (drawers) too.

/* ---------- Home ---------- */
function viewHome() {
  const me = meSid(), mine = personOf(me), t = todayISO();
  let h = '';
  if (isHR()) {
    const w = waitingForMe();
    if (w.length) h += '<button class="callout amber" data-act="nav" data-v="appr">' + ic('check', 20) + '<span><b>' + plural(w.length, 'request') + ' waiting for you</b>' +
      esc(w.slice(0, 3).map(r => shortName(r.sid) + ' (' + fmtRange(r.start, r.end) + ')').join(', ') + (w.length > 3 ? ' and ' + (w.length - 3) + ' more' : '')) + '</span>' + ic('next') + '</button>';
    const pw = perksWaitingForMe();
    if (pw.length) h += '<button class="callout amber" data-act="nav" data-v="appr">' + ic('check', 20) + '<span><b>' + plural(pw.length, 'scrubs request') + ' waiting for you</b>' +
      esc(pw.slice(0, 3).map(x => shortName(x.sid) + ' (' + plural(x.pairs, 'pair') + ')').join(', ') + (pw.length > 3 ? ' and ' + (pw.length - 3) + ' more' : '')) + '</span>' + ic('next') + '</button>';
  }
  h += '<div class="balGrid">' + balCards(me, mine) + '</div>';
  const my = reqsOf(me), wait = my.filter(r => r.status === 'pending').sort(byStart), soon = my.filter(r => r.status === 'approved' && r.end >= t).sort(byStart);
  h += '<div class="twoCol"><div>';
  h += '<div class="card"><div class="cardHd"><h3>My requests</h3><span style="flex:1"></span><button class="btn btn-ghost" data-act="nav" data-v="mine">See all</button></div><div class="cardBd">';
  if (!S.gotReqs && S.firstLoad) h += '<div class="empty">Loading…</div>';
  else if (!wait.length && !soon.length) h += '<div class="empty">Nothing waiting or coming up.<br><button class="btn btn-teal btn-sm" style="margin-top:12px" data-act="nav" data-v="new">' + ic('plus', 15) + 'Request time off</button></div>';
  else h += (wait.length ? '<div class="subH">Waiting for approval</div>' + wait.map(reqRow).join('') : '') + (soon.length ? '<div class="subH">Coming up</div>' + soon.map(reqRow).join('') : '');
  h += '</div></div>';
  h += '</div><div>' + weekCard() + closuresSoonCard() + '</div></div>';
  return h;
}
function byStart(a, b) { return a.start < b.start ? -1 : a.start > b.start ? 1 : 0; }
/* the two balance cards (and how many days off this year) */
function balCards(sid, p) {
  if (!p) {
    return '<div class="card balCard wide"><div class="cardBd"><div class="balEmpty">' + ic('info', 20) + '<div><b>' + (sid === meSid() ? 'Your balances aren’t set up yet' : 'No HR record yet') + '</b><div class="small muted">' +
      (S.mine === undefined && sid === meSid() ? 'Loading…' : sid === meSid() && isOwner() ? 'No HR record for you — add one in Team if you want to track your own balances.' : 'Dr. A adds the hire date and balances (Team → the person). Until then requests still go through; their hours are worked out once it’s added.') + '</div></div></div></div></div>';
  }
  const L = ledgerOf(sid), t = todayISO(), na = nextAccrual(p, S.pol, t), tier = tierAt(S.pol, p.hire, t), pt = p.type === 'PT' && !S.pol.ptAccrues;
  const pend = reqsOf(sid).filter(r => r.status === 'pending');
  let after = null;
  if (pend.length) {
    // what the waiting requests would take: the balance on their last day with them approved, against the same day without them
    const all = reqsOf(sid).map(r => r.status === 'pending' ? Object.assign({}, r, { status: 'approved' }) : r), last = pend.reduce((m, r) => r.end > m ? r.end : m, t);
    const L2 = ledger(p, all, S.pol, S.closed, last), L3 = ledger(p, reqsOf(sid), S.pol, S.closed, last);
    after = { vac: L2.vac, sick: L2.sick, by: last, was: { vac: L3.vac, sick: L3.sick } };
  }
  const card = (b, label, icon) => {
    const n = L ? L[b] : 0, earn = b === 'vac' ? (pt ? 0 : tier.perMonth) : (pt ? 0 : S.pol.sickPerMonth);
    return '<div class="card balCard ' + b + '"><div class="cardBd"><div class="balTop">' + ic(icon, 18) + '<span>' + label + '</span>' + (b === 'vac' && !pt && p.hire ? '<span class="tierPill t' + tier.n + '" title="' + esc(tier.years + ' full years of service') + '">' + tierName(tier.n) + '</span>' : '') + '</div>' +
      '<div class="balN">' + hrs(n) + '<small> h</small></div><div class="balD">' + (daysTxt(n) || '0 days') + '</div>' +
      '<div class="balSub">' + (pt ? 'Part-time: no paid ' + (b === 'vac' ? 'vacation' : 'sick leave') + ' (handbook)' : na ? '+' + hrs(b === 'vac' ? na.vac : na.sick) + ' h on ' + esc(fmtDate(na.date)) + (na.date > t && orientEnd(p, S.pol) > t ? ' (after orientation)' : '') : 'Not earning now') + '</div>' +
      (after && after[b] !== after.was[b] ? '<div class="balSub muted">' + (sid === meSid() ? 'If your waiting requests are approved: ' : 'If the waiting requests are approved: ') + hrs(after[b]) + ' h on ' + esc(fmtDate(after.by)) + ' (instead of ' + hrs(after.was[b]) + ')</div>' : '') +
      (!pt && earn ? '<div class="balSub muted">Earns ' + hrs(earn) + ' h a month · ' + hrs(round2(earn * 12)) + ' h a year</div>' : '') + '</div></div>';

function payrollRows(from, to) {
  if (!isISO(from) || !isISO(to) || to < from) return [];

    const p = personOf(r.sid), rs = reqsOf(r.sid).filter(x => x.status === 'approved' && x.end >= from && x.start <= to);
    if (!rs.length) return null;
    if (p) {
      const L = ledgerOf(r.sid, to), o = Object.assign({ name: staffName(r.sid), pre: 0 }, payPeriod(L, from, to));
      // days on or before the opening balance, or taken off by the old app, aren't in the ledger: count them as asked
      const asOf = p.open && isISO(p.open.asOf) ? p.open.asOf : '', settled = new Set(p.settled || []);
      const dset = new Set(L.entries.filter(e => e.date >= from && e.date <= to && (e.k === 'take' || e.k === 'free' || e.k === 'unpaid')).map(e => e.date));
      rs.forEach(x => reqDays(x, S.closed, S.pol).filter(d => d.date >= from && d.date <= to && ((asOf && d.date <= asOf) || settled.has(x.id))).forEach(d => {
        const b = bucketOf(x, S.pol), k = b === 'none' ? 'free' : b; o[k] = round2(o[k] + d.h); o.pre = round2(o.pre + d.h); dset.add(d.date);
      }));

    }
    // no HR record: what was asked, by kind of balance
    const o = { name: staffName(r.sid) + ' (no HR record)', vac: 0, sick: 0, free: 0, unpaid: 0, days: 0 };
    rs.forEach(x => reqDays(x, S.closed, S.pol).filter(d => d.date >= from && d.date <= to).forEach(d => { const b = bucketOf(x, S.pol); o[b === 'none' ? 'free' : b] = round2((o[b === 'none' ? 'free' : b] || 0) + d.h); o.days++; }));
    return o;

}

/* =====================================================================
   Staff Hub (Dr. A). Time Off follows Staff Hub's office roster: each
   person's start date, full-/part-time and last day go into their HR
   record — but a value that differs from the record's (or a new hire's
   record) waits for Dr. A to bring it in, with what it does to the
   balance (Settings → Staff Hub): no balance changes without his OK,
   and the roster can be changed by any office Google account. A change
   of full-/part-time counts from the day it's brought in. What only
   marks a record as Staff Hub's goes in by itself, and so do names, into
   NLO Cases' team, as NLO Cases does. Team lists who's on Staff Hub
   without a login, and links a login Staff Hub has under another name.
   Read with the Google sign-in NLO Cases uses for the roster
   (backend.js); nothing is written to Staff Hub. The plain parts — who
   is who, what Staff Hub says — are in roster.js.
   ===================================================================== */
const SH = { user: undefined, data: null, err: '', at: 0, loading: null, checking: null, syncing: false, run: null, syncedAt: 0, pending: [], told: '', last: null };
function shAvailable() { return !!(B && B.shUser) && isOwner() && isHR(); }
async function shCheckUser() {
  if (!SH.checking) SH.checking = (async () => { try { SH.user = await B.shUser(); } catch (e) { SH.user = null; } return SH.user; })();
  try { return await SH.checking; } finally { SH.checking = null; }
}
function shErrText(e) {
  const c = String((e && (e.code || e.message)) || '');

/* =====================================================================
   Moving from the old Time-Off app (Dr. A, once, at the switch-over).
   The old Google Sheet, downloaded as an Excel file (or its tabs as CSV
   files), is read on this computer. Each person's hire date, balances
   and requests come over; the Password and Passcode columns are never
   read. Nothing in the old Sheet changes.

   Before anything is saved, each person's balance is checked against
   the handbook (the old 6 AM script counted Fridays, holidays and partial
   days as full days, moved people up a tier at 1 and 3 years instead of
   2 and 5, and gave part-time staff paid time off), and Dr. A picks the
   numbers each person starts from: the old app's (the default — no
   balance changes without his say), the handbook's, or his own.
   ===================================================================== */

/* ---------- reading the tabs ---------- */
function tabOf(tabs, name) { const k = Array.from(tabs.keys()).find(n => String(n).trim().toLowerCase() === name.toLowerCase()); return k == null ? null : tabs.get(k); }
function normHead(v) { return String(v == null ? '' : v).toLowerCase().replace(/[^a-z]/g, ''); }
/* column numbers by heading; a heading with "pass" in it (Password, Passcode) is never mapped, so it's never read */
function headMap(row, spec) {
  const m = {};
  (row || []).forEach((v, c) => { const n = normHead(v); if (!n || /pass/.test(n)) return; const hit = spec.find(([k, re]) => m[k] == null && re.test(n)); if (hit) m[hit[0]] = c; });
  return m;
}
