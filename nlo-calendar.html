<title>NLO Office Calendar</title>

<style>
:root{
  --navy-800:#1B2F4C; --navy-900:#11203A; --navy-700:#294169; --navy-border:#385686;
  --off-white:#F2F3F4; --white:#FFFFFF;
  --blue-600:#1D3EA9; --blue-700:#16318C; --blue-500:#2E52C9; --blue-100:#E5EAF8;
  --coral-500:#FA624D; --coral-700:#D8412E; --coral-200:#FFC8BF; --coral-100:#FFE7E1;
  --mint-500:#64F4C9; --mint-700:#1F9E7E; --mint-200:#C0FBEC; --mint-100:#E2FBF4;
  --amber-600:#E29A14; --amber-700:#C2820A; --amber-100:#FEF2D7;
  --grey-50:#F7F8F9; --grey-100:#ECEEF0; --grey-200:#DCE0E4; --grey-300:#C3C9D0;
  --grey-400:#969FAB; --grey-500:#6B7685; --grey-600:#4C5868; --grey-700:#33404F;
  --muted-on-navy:#A7B2C2;
  --font-display:'Oswald',system-ui,sans-serif;
  --font-body:'Montserrat',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
html,body{margin:0;padding:0;background:var(--off-white);}
*{box-sizing:border-box;}
body{font-family:var(--font-body);color:var(--grey-700);}
@keyframes nloFadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
input,select,textarea,button{font-family:var(--font-body);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue-500);outline-offset:1px;}
.disp{font-family:var(--font-display);text-transform:uppercase;}
.fadeup{animation:nloFadeUp .25s ease;}
.fadeup-fast{animation:nloFadeUp .2s ease;}
.hov-cell:hover{box-shadow:0 4px 14px rgba(27,47,76,.14);}
.hov-grey:hover{background:var(--grey-100);}
.hov-navy7:hover{background:var(--navy-700);}
.hov-coral7:hover{background:var(--coral-700) !important;}
.hov-blue7:hover{background:var(--blue-700) !important;}
.hov-navy9:hover{background:var(--navy-900) !important;}
.hov-coral1:hover{background:var(--coral-100);}
.hov-amber7:hover{background:var(--amber-700) !important;}
.hov-staffpill:hover{background:var(--navy-700);color:#F2F3F4 !important;}
button{cursor:pointer;}
.pill-btn{border:none;border-radius:999px;font-family:var(--font-display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;}
.task-box{border-radius:6px;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none;font-weight:700;line-height:1;cursor:pointer;}
.task-box:focus-visible,.pill-btn:focus-visible{outline:2px solid var(--blue-500);outline-offset:2px;}
:root{--violet-500:#7C5CD6;}
.av-ini::before{content:attr(data-ini);}
@media (max-width:700px){
  .month-cell{min-height:74px !important;}
  .detail-panel{width:100vw !important;}
}
</style>
</head>

<div id="app"></div>
<div id="authGate" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--navy-900);padding:24px;">
  <div style="max-width:380px;width:100%;background:#fff;border-radius:16px;padding:34px 30px;box-shadow:0 18px 50px rgba(0,0,0,.35);text-align:center;">
    <div class="disp" style="font-size:22px;font-weight:700;color:var(--navy-800);letter-spacing:.04em;">NLO Office Calendar</div>
    <p style="color:var(--grey-500);font-size:14px;line-height:1.5;margin:10px 0 22px;">Sign in with your Next Level Orthodontics account to continue.</p>
    <button id="signInBtn" class="pill-btn" style="background:var(--blue-600);color:#fff;padding:12px 22px;font-size:14px;width:100%;letter-spacing:.06em;">Sign in with Google</button>
    <div id="authErr" style="color:var(--coral-700);font-size:13px;margin-top:14px;min-height:16px;"></div>
  </div>
</div>

/* Vacation tiers — NLO employee handbook (policy manual):
   Tier 1 after orientation (2.83 hrs/mo, cap 34), Tier 2 after 2 full years
   (5.67 hrs/mo, cap 68), Tier 3 after 5 full years (8.5 hrs/mo, cap 102). */
function tierFor(years){
  if(years>=5) return {n:3,rate:8.5,cap:102};
  if(years>=2) return {n:2,rate:5.67,cap:68};
  return {n:1,rate:2.83,cap:34};
}
function fullYearsSince(dateStr,asOf){
  const h=parseD(dateStr), a=parseD(asOf);
  let y=a.getFullYear()-h.getFullYear();
  const anniv=new Date(a.getFullYear(),h.getMonth(),h.getDate());
  if(a<anniv) y--;
  return Math.max(0,y);
}

/* ================= DATE HELPERS ================= */
function fmt(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseD(s){ const p=s.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
function addDays(s,n){ const d=parseD(s); d.setDate(d.getDate()+n); return fmt(d); }
function todayStr(){ return fmt(new Date()); }
function weekStart(s){ const d=parseD(s); const off=d.getDay(); return addDays(s,-off); } // weeks start Sunday
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const SMON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function isClosedDay(s){ const g=parseD(s).getDay(); return g===5||g===6||g===0; }
function prettyDate(s){ const d=parseD(s); return SMON[d.getMonth()]+" "+d.getDate(); }
function prettyRange(a,b){
  if(!b||b===a) return prettyDate(a);
  const da=parseD(a),db=parseD(b);
  if(da.getMonth()===db.getMonth()&&da.getFullYear()===db.getFullYear()) return SMON[da.getMonth()]+" "+da.getDate()+"–"+db.getDate();
  return prettyDate(a)+" – "+prettyDate(b);
}
function fmtTime(t){
  if(!t) return "";
  const p=t.split(":").map(Number);
  const h12=((p[0]+11)%12)+1, ampm=p[0]>=12?"PM":"AM";
  return h12+(p[1]?":"+String(p[1]).padStart(2,"0"):"")+" "+ampm;
}
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ================= FIXED HOLIDAYS (fallback — mirrors backend/handbook) ================= */
function nthWeekday(y,m,wd,n){ const first=new Date(y,m,1); const off=(wd-first.getDay()+7)%7; return new Date(y,m,1+off+(n-1)*7); }
function lastWeekday(y,m,wd){ const last=new Date(y,m+1,0); const off=(last.getDay()-wd+7)%7; return new Date(y,m,last.getDate()-off); }
function fixedHolidaysForYear(y){
  const out={};
  out[fmt(new Date(y,0,1))]="New Year's Day";
  out[fmt(lastWeekday(y,4,1))]="Memorial Day";
  out[fmt(new Date(y,6,4))]="Independence Day";
  out[fmt(nthWeekday(y,8,1,1))]="Labor Day";
  const thx=nthWeekday(y,10,4,4);
  const before=new Date(thx); before.setDate(thx.getDate()-1);
  const after=new Date(thx); after.setDate(thx.getDate()+1);
  out[fmt(before)]="Day Before Thanksgiving";
  out[fmt(thx)]="Thanksgiving Day";
  out[fmt(after)]="Day After Thanksgiving";
  out[fmt(new Date(y,11,25))]="Christmas Day";
  return out;
}
function holidayMap(){
  const map={};
  if(S.sync.holidays && S.sync.holidays.length){
    S.sync.holidays.forEach(h=>{ if(h&&h.date) map[String(h.date).slice(0,10)]={label:h.label||"Day Off",source:h.source||"custom"}; });
  } else {
    const y=new Date().getFullYear();
    [y-1,y,y+1].forEach(yy=>{ const f=fixedHolidaysForYear(yy); Object.keys(f).forEach(k=>{ map[k]={label:f[k],source:"fixed"}; }); });
  }
  /* office-specific closures managed in Settings (e.g. First Day of School, Winter Holidays) */
  const cl=(S.data&&S.data.settings&&S.data.settings.closures)||{};
  Object.keys(cl).forEach(d=>{ map[d]={label:cl[d]||"Office closed",source:"office"}; });
  return map;
}

/* ================= TIME-OFF SYNC ================= */
/* S.sync.at = when the Time-Off app last answered (null until it first does); S.sync.err = the last try failed.
   A failed try keeps the last good list, says so in the Who's-out bar, and tries again 2 minutes later. */
let syncRetry=null;
async function syncTimeOff(){
  if(S.sync.busy) return;
  S.sync.busy=true;
  if(S.sync.err) bgRender();
  const ctl=typeof AbortController==="function"?new AbortController():null;
  const timer=ctl?setTimeout(()=>ctl.abort(),30000):null;
  try{
    const sep=TIMEOFF_API.includes("?")?"&":"?";
    const opts={method:"GET",redirect:"follow"};
    if(ctl) opts.signal=ctl.signal;
    const res=await fetch(TIMEOFF_API+sep+"action=getchecklistsync",opts);
    if(!res.ok) throw new Error("HTTP "+res.status);
    const j=await res.json();
    if(j.ok===false) throw new Error(j.error||"Sync error");
    S.sync={ timeOff:(j.timeOff||[]), holidays:(j.holidays||[]), at:new Date(), err:null, busy:false };
  }catch(e){
    S.sync.err=(e&&e.name==="AbortError")?"no answer after 30 seconds":((e&&e.message)||String(e));
    S.sync.busy=false;
    if(!syncRetry) syncRetry=setTimeout(()=>{ syncRetry=null; syncTimeOff(); },2*60*1000);
  }
  if(timer) clearTimeout(timer);
  bgRender();
}
setInterval(syncTimeOff, SYNC_INTERVAL_MIN*60*1000);
/* back on the tab (phones pause timers in the background): refresh if the last answer is over 5 minutes old */
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"&&calBooted&&(!S.sync.at||Date.now()-S.sync.at.getTime()>5*60*1000)) syncTimeOff();
});
/* "ok" · "loading" (no answer yet) · "failed" (never answered) · "stale" (answered before, last try failed) */
function syncState(){ return S.sync.at?(S.sync.err?"stale":"ok"):(S.sync.err?"failed":"loading"); }

/* ================= SHARED STAFF ROSTER (Staff Hub) =================
   Read-only view of nlo/cadence/roster/people (only Staff Hub writes it). Each calendar staff
   record is matched to a roster person by id, else full name, else first name / nick against the
   "First (Role)" label. People the roster marks as left drop out of birthdays, anniversaries and
   the PTO staff picker (Settings still lists them, marked "Left"). Active roster people missing
   from the calendar list are added at render time only, never written to nlo/calendar/staff.
   No roster (missing, empty or unreadable) = the calendar's own list, exactly as before. */
const ROSTER_PEOPLE = "nlo/cadence/roster/people";
let calRoster = null;
/* staff dates Staff Hub shares for this calendar (see STAFF HUB DATES) and when it last shared the roster */
const ROSTER_DATES = "nlo/cadence/roster/dates";
const ROSTER_AT = "nlo/cadence/roster/updatedAt";
let calDates = null, calRosterAt = null;
function nloRosterToday(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function nloRosterActive(p){return !!p && p.active!==false && !(p.end && p.end<=nloRosterToday());}
const ROSTER_ROLE_SHORT = { "orthodontic assistant":"OA", "treatment coordinator":"TC", "appointment coordinator":"AC", "marketing coordinator":"Marketing", "clinical lead":"Clinical Lead",
  "scheduling coordinator":"SC", "office coordinator":"OC", "office manager":"OM", "financial coordinator":"FC", "front desk / scheduling":"Front Desk",
  "clinical & marketing coordinator":"Marketing", "clinical and marketing coordinator":"Marketing", "lab technician":"Lab" };
function rosterLabel(p){
  const nm=String(p.nick||p.first||p.name||"").trim(), t=String(p.title||"").trim().toLowerCase();
  const r=Object.prototype.hasOwnProperty.call(ROSTER_ROLE_SHORT,t)?ROSTER_ROLE_SHORT[t]:"";
  return r?nm+" ("+r+")":nm;
}
function nloRosterPhoto(p){return p&&typeof p.photo==="string"&&p.photo.indexOf("data:image/jpeg;base64,")===0&&p.photo.length<30000?p.photo:null;}
function calAvatar(st,sz){
  const nm=String(st&&st.name||"?").replace(/\s*\(.*$/,"").trim(), ini=(nm.split(/\s+/).map(w=>w[0]||"").slice(0,2).join("")||"?").toUpperCase();
  const g=st&&st.left?"filter:grayscale(1);":"";
  return `<span aria-hidden="true" style="width:${sz}px;height:${sz}px;border-radius:50%;background:#294169;color:#fff;font-size:${Math.round(sz*.38)}px;font-weight:700;line-height:1;display:inline-flex;align-items:center;justify-content:center;flex:none;overflow:hidden;${g}">${st&&st.photo?`<img src="${st.photo}" alt="" style="width:100%;height:100%;object-fit:cover;display:block;">`:`<span class="av-ini" data-ini="${esc(ini)}"></span>`}</span>`;
}
/* The calendar's staff list, following Staff Hub: anyone matched to a roster person shows Staff Hub's name
   ("goes by" + role) and photo, and is marked left once Staff Hub ends them. Birthdays (and hire dates when
   Staff Hub has none) stay the calendar's own. Memoised until the calendar's list, the roster or the dates change. */
let calStaffMemo=null, calStaffKey=[null,null,null];
function calStaff(){
  const raw=(S.data&&S.data.staff)||{}, ppl=calRoster;
  if(calStaffMemo&&calStaffKey[0]===raw&&calStaffKey[1]===ppl&&calStaffKey[2]===calDates) return calStaffMemo;
  const ids=ppl?Object.keys(ppl).filter(k=>ppl[k]&&typeof ppl[k]==="object"):[];
  let out=raw;
  if(ids.length){
    const norm=x=>String(x==null?"":x).trim().toLowerCase();
    const only=test=>{ const c=ids.filter(test); return c.length===1?c[0]:null; };
    const hubStart=pid=>{ const d=calDates&&calDates[pid]; return d&&typeof d.start==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(d.start)?d.start:null; };
    const claimed={};
    out={};
    Object.keys(raw).forEach(id=>{
      const st=raw[id];
      if(!st||typeof st!=="object"){ out[id]=st; return; }
      const full=norm(st.name), label=norm(String(st.name==null?"":st.name).split(" (")[0]);
      let pid=ids.indexOf(id)>=0?id:null;
      if(!pid&&full) pid=only(k=>{ const n=norm(ppl[k].name); return !!n&&(n===full||n===label); });
      if(!pid&&label) pid=only(k=>norm(ppl[k].nick)===label||norm(ppl[k].first)===label);
      if(!pid){ out[id]=st; return; }
      claimed[pid]=true;
      const p=ppl[pid], ph=nloRosterPhoto(p);
      const o=Object.assign({},st,{ name:rosterLabel(p)||st.name, savedName:st.name, rid:pid });
      if(ph) o.photo=ph; else delete o.photo;
      if(!o.hireDate&&hubStart(pid)){ o.hireDate=hubStart(pid); o.hireFromHub=true; }
      if(!nloRosterActive(p)){ o.active=false; o.left=true; }
      out[id]=o;
    });
    ids.forEach(pid=>{
      if(claimed[pid]||raw[pid]||!/^[\w-]+$/.test(pid)||!nloRosterActive(ppl[pid])) return;
      const p=ppl[pid], o={ name:rosterLabel(p)||pid, active:true, roster:true, rid:pid };
      if(nloRosterPhoto(p)) o.photo=nloRosterPhoto(p);
      if(hubStart(pid)){ o.hireDate=hubStart(pid); o.hireFromHub=true; }
      out[pid]=o;
    });
  }
  calStaffMemo=out; calStaffKey=[raw,ppl,calDates];
  return out;
}
/* the person (name, photo, left) for a roster id: their calendar record if they have one, else the roster entry */
function personByRid(rid){
  const staffL=calStaff();
  for(const k in staffL){ if(staffL[k]&&staffL[k].rid===rid) return staffL[k]; }
  const p=calRoster&&calRoster[rid];
  return p?{ name:rosterLabel(p)||p.name||"", photo:nloRosterPhoto(p), left:!nloRosterActive(p), rid:rid }:null;
}
/* the person behind a Time-Off app name. That app can hold legal names ("Maria Jordan" for Wila), so match the
   roster on full name, then first + last, then a last name only one person has, then a lone first name;
   else the calendar's own list by name. No match = the Time-Off name as it is, without a face. */
let ptoWhoMemo={}, ptoWhoKey=null;
function ptoPerson(name){
  const staffL=calStaff();
  if(ptoWhoKey!==staffL){ ptoWhoMemo={}; ptoWhoKey=staffL; }
  const key=String(name==null?"":name);
  if(Object.prototype.hasOwnProperty.call(ptoWhoMemo,key)) return ptoWhoMemo[key];
  const norm=x=>String(x==null?"":x).toLowerCase().replace(/\s*\(.*$/,"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();
  const n=norm(key), w=n?n.split(" "):[], first=w[0]||"", last=w.length>1?w[w.length-1]:"";
  let res=null;
  if(n){
    const ppl=calRoster||{}, ids=Object.keys(ppl).filter(k=>ppl[k]&&typeof ppl[k]==="object");
    const one=f=>{ const c=ids.filter(f); return c.length===1?c[0]:null; };
    const rid=one(k=>norm(ppl[k].name)===n)
      ||(last?one(k=>norm(ppl[k].first)===first&&norm(ppl[k].last)===last):null)
      ||(last?one(k=>norm(ppl[k].last)===last):null)
      ||(!last?one(k=>norm(ppl[k].first)===first||norm(ppl[k].nick)===first):null);
    if(rid) res=personByRid(rid);
    else {
      const c=Object.keys(staffL).filter(k=>{ const st=staffL[k]; if(!st||typeof st!=="object") return false; const m=norm(st.name); return m===n||(!last&&m.split(" ")[0]===first); });
      if(c.length===1) res=staffL[c[0]];
    }
  }
  ptoWhoMemo[key]=res;
  return res;
}
/* the face for an entry: PTO, birthdays, anniversaries and Staff Hub dates belong to a person */
function entryPerson(e){
  if(!e) return null;
  if(e.who) return e.who;
  if(e.type==="hr") return personByRid(e.staffId);
  if(e.staffId&&(e.type==="pto"||e.type==="bday"||e.type==="anniv")){ const st=calStaff()[e.staffId]; return st&&typeof st==="object"?st:{ name:e.staffName||"" }; }
  return null;
}
function whoFace(e,sz){ const p=entryPerson(e); return p?calAvatar(p,sz):""; }

/* ================= STAFF HUB DATES =================
   Shared by Staff Hub (Settings → Office roster → "Show staff dates on the office calendar", on by default):
   each person's start date, next review date and certification expiry dates, plus last days from the roster.
   Read-only here; they're changed in Staff Hub. Someone who has left keeps only their last day.
   Review dates can be limited to admin mode (Settings → Staff Hub dates). */
function hrReviewsAdminOnly(){ return !!(S.data&&S.data.settings&&S.data.settings.hrReviewsAdminOnly); }
function hrCerts(d){ return Array.isArray(d.certs)?d.certs:(d.certs&&typeof d.certs==="object"?Object.values(d.certs):[]); }
function hrEntriesFor(ds){
  const out=[], ppl=calRoster;
  if(!ppl) return out;
  const dates=calDates||{};
  const showReviews=S.admin||!hrReviewsAdminOnly();
  Object.keys(ppl).forEach(id=>{
    const p=ppl[id];
    if(!p||typeof p!=="object") return;
    const nm=(/^dr\.?\s/i.test(String(p.nick||""))?String(p.nick):String(p.first||p.nick||p.name||"")).trim()||"Staff";   /* "Dr. A" for the owner */
    const add=(kind,title,sub,n)=>out.push({ id:"hr_"+kind+"_"+id+"_"+ds+(n==null?"":"_"+n), type:"hr", kind:kind, title:title, hrSub:sub,
      staffId:id, staffName:p.name||nm, startDate:ds, endDate:ds, time:null, notes:"", recurrence:null, synced:true });
    if(p.end===ds) add("last",nm+"'s last day","Last day at NLO");
    if(!nloRosterActive(p)) return;
    const d=dates[id];
    if(!d||typeof d!=="object") return;
    if(d.start===ds) add("start",nm+"'s first day","First day at NLO");
    if(showReviews&&d.review===ds) add("review",nm+" — review","Performance review");
    hrCerts(d).forEach((c,i)=>{ if(c&&c.expires===ds&&c.name) add("cert",nm+" — "+c.name+" expires","Certification expires — renew before this date",i); });
  });
  return out;
}
function hrSettingsHtml(){

  Object.keys(calDates||{}).forEach(id=>{ const d=calDates[id], p=calRoster&&calRoster[id]; if(!d||typeof d!=="object"||!p||!nloRosterActive(p)) return; if(d.review) reviews++; certs+=hrCerts(d).length; });
  let status;

  return `<div class="disp" style="font-weight:600;letter-spacing:.12em;font-size:14px;color:var(--blue-600);margin-bottom:10px;">Staff Hub dates</div>
    <div style="font-size:14px;color:var(--grey-600);margin-bottom:4px;">Start dates, review dates and certification expiry dates from Staff Hub, and last days from the office roster, show as ◆ entries. Change them in Staff Hub.</div>
    <div style="font-size:12.5px;color:var(--grey-400);margin-bottom:10px;">${esc(status)}</div>
    <label style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--navy-800);cursor:pointer;margin-bottom:24px;">
      <input type="checkbox" data-chg="hr-reviews-admin" ${hrReviewsAdminOnly()?"checked":""} style="width:18px;height:18px;accent-color:#1D3EA9;"> Show review dates only in admin mode
    </label>`;
}

/* ================= ENTRY QUERIES ================= */
function occursOn(e,ds){
  if(e.recurrence){
    if(ds<e.startDate) return false;
    if(e.until&&ds>e.until) return false;   /* "Repeat until" ends the series */
    const d=parseD(ds), b=parseD(e.startDate);
    if(e.recurrence==="weekly") return d.getDay()===b.getDay();
    if(e.recurrence==="biweekly"){ const days=Math.round((d-b)/86400000); return d.getDay()===b.getDay() && days%14===0; }
    /* monthly / quarterly / yearly: same date; one set on the 29th-31st lands on the last day of shorter months */
    const lastDay=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    if(d.getDate()!==Math.min(b.getDate(),lastDay)) return false;
    if(e.recurrence==="monthly") return true;
    const mdiff=(d.getFullYear()-b.getFullYear())*12+(d.getMonth()-b.getMonth());
    if(e.recurrence==="quarterly") return mdiff%3===0;
    if(e.recurrence==="yearly") return d.getMonth()===b.getMonth();
    return false;
  }
  const end=e.endDate||e.startDate;
  return ds>=e.startDate && ds<=end;
}

function entriesFor(ds,ignoreFilters){
  const data=S.data; if(!data) return [];
  const out=[];
  /* holiday (from Time-Off backend / handbook) */
  const hol=holidayMap()[ds];
  if(hol) out.push({ id:"hol_"+ds, type:"holiday", title:hol.label, startDate:ds, endDate:ds, time:null,
                     notes: hol.source==="fixed" ? "Office closed — paid holiday (policy manual)" : "Office closed",
                     recurrence:null, synced:true });
  /* birthdays + work anniversaries (derived from the staff list — nothing stored) */
  const staffL=calStaff();
  Object.keys(staffL).forEach(sid=>{
    const st=staffL[sid];
    if(!st||!st.active) return;
    const mmdd=ds.slice(5), yr=parseD(ds).getFullYear();
    if(st.birthday && st.birthday.slice(5)===mmdd && yr>parseD(st.birthday).getFullYear()){
      out.push({ id:"bd_"+sid+"_"+yr, type:"bday", title:firstName(st.name)+"'s birthday", staffId:sid, staffName:st.name,
                 startDate:ds, endDate:ds, time:null, notes:"", recurrence:null, synced:true });
    }
    if(st.hireDate && st.hireDate.slice(5)===mmdd){
      const n=yr-parseD(st.hireDate).getFullYear();
      if(n>=1){
        const t=tierFor(n);
        let title=firstName(st.name)+" — "+n+" year"+(n>1?"s":"");
        let notes="Vacation Tier "+t.n+" ("+t.rate+" hrs/mo, cap "+t.cap+" hrs/yr)";
        if(n===2) notes="Moves up to Tier 2 today — 5.67 hrs/mo, cap 68 hrs/yr 🎊";
        if(n===5) notes="Moves up to Tier 3 today — 8.5 hrs/mo, cap 102 hrs/yr 🎊";
        out.push({ id:"an_"+sid+"_"+yr, type:"anniv", title:title, staffId:sid, staffName:st.name,
                   startDate:ds, endDate:ds, time:null, notes:notes, recurrence:null, synced:true });
      }
    }
  });
  /* dates shared from Staff Hub */
  if(ignoreFilters||S.filters.hr!==false) hrEntriesFor(ds).forEach(e=>out.push(e));
  /* manual calendar entries */
  Object.keys(data.events).forEach(id=>{
    const e=data.events[id];
    if(!ignoreFilters && S.filters[e.type]===false) return;
    if(e.type==="pto" && officeClosed(ds)) return; // office is closed — PTO doesn't apply
    if(occursOn(e,ds)){
      const o=Object.assign({id},e);
      /* PTO shows the person's current (Staff Hub) name; the name saved with the entry only if they're no longer listed */
      if(o.type==="pto"&&o.staffId&&staffL[o.staffId]&&staffL[o.staffId].name) o.staffName=staffL[o.staffId].name;
      out.push(o);
    }
  });
  /* approved time off synced from the Time-Off Request app */
  if((ignoreFilters || S.filters.pto) && !officeClosed(ds)){
      S.sync.timeOff.forEach((r,i)=>{
        const start=String(r.start||"").slice(0,10), end=String(r.end||r.start||"").slice(0,10);
        if(!start) return;
        if(ds>=start && ds<=(end||start)){
          const who=ptoPerson(r.employeeName);   /* the Staff Hub person behind the Time-Off app's name, if any */
          out.push({ id:"to_"+(r.id||i), type:"pto", title:r.requestType||r.reason||"PTO",
                     staffId:null, staffName:who?who.name:(r.employeeName||"PTO"), who:who,
                     startDate:start, endDate:end||start, time:null,
                     unpaid:String(r.paidType||"").toLowerCase().indexOf("unpaid")>=0,
                     notes:(r.paidType?String(r.paidType):"")+(r.hours?(" · "+r.hours+" hrs"):""),
                     recurrence:null, synced:true });
        }
    });
  }
  const order={holiday:0,pto:1,bday:2,anniv:3,hr:3.5,event:4,task:5};
  out.sort((a,b)=>(order[a.type]-order[b.type])||String(a.time||"").localeCompare(String(b.time||""))||String(a.title).localeCompare(b.title));
  return out;
}

function typeColors(t){
  if(t==="pto")     return {bg:"#FFE7E1",fg:"#C13A28",edge:"#FA624D",glyph:"●",label:"PTO"};
  if(t==="bday")    return {bg:"#E2FBF4",fg:"#137a61",edge:"#64F4C9",glyph:"🎂",label:"Birthday"};
  if(t==="anniv")   return {bg:"#E5EAF8",fg:"#16318C",edge:"#2E52C9",glyph:"🎉",label:"Anniversary"};
  if(t==="task")    return {bg:"#FEF2D7",fg:"#996709",edge:"#E29A14",glyph:"▲",label:"Task"};
  if(t==="holiday") return {bg:"#1B2F4C",fg:"#FFFFFF",edge:"#1B2F4C",glyph:"★",label:"Holiday"};
  if(t==="hr")      return {bg:"#F0EAFB",fg:"#5B3A9E",edge:"#7C5CD6",glyph:"◆",label:"Staff Hub"};
  return {bg:"#E5EAF8",fg:"#16318C",edge:"#1D3EA9",glyph:"■",label:"Event"};
}
function entryLabel(e){ return e.type==="pto"?((e.staffName||"PTO")+(e.unpaid?" — unpaid":"")):e.title; }
const HR_LABEL={review:"Review",cert:"Cert",start:"First day",last:"Last day"};
function entryTypeLabel(e){ return e.type==="pto"?(e.unpaid?"Unpaid":"PTO"):(e.type==="hr"?(HR_LABEL[e.kind]||"Staff Hub"):typeColors(e.type).label); }
function entrySub(e){
  if(e.type==="pto"){
    const parts=["Out "+prettyRange(e.startDate,e.endDate)];
    if(e.title&&e.title!=="PTO") parts.push(e.title);
    parts.push(e.unpaid?"Unpaid (no PTO used)":"Paid");
    if(e.synced) parts.push("Time-Off app");
    return parts.join(" · ");
  }
  if(e.type==="hr") return e.hrSub+" · from Staff Hub";
  if(e.type==="holiday") return "Office closed";
  if(e.type==="bday") return "Happy birthday! 🎂🎈";
  if(e.type==="anniv") return "Work anniversary";
  const parts=[e.time?fmtTime(e.time):"All day"];
  if(e.recurrence){
    let r="repeats "+(e.recurrence==="biweekly"?"every 2 weeks":e.recurrence);
    if(e.until){ const u=parseD(e.until); r+=" until "+prettyDate(e.until)+(u.getFullYear()!==new Date().getFullYear()?", "+u.getFullYear():""); }
    parts.push(r);
  }
  return parts.join(" · ");
}
function isBlackout(ds){ const s=S.data&&S.data.settings; return !!(s&&s.blackoutDates&&s.blackoutDates[ds]); }
/* office is closed Fri/Sat/Sun and on holidays — PTO is meaningless on those days */
function officeClosed(ds){ return isClosedDay(ds) || !!holidayMap()[ds]; }
function nextOpenDay(ds){ let d=ds,i=0; while(officeClosed(d)&&i<14){ d=addDays(d,1); i++; } return d; }
function adminDayOf(ds){ return (S.data&&S.data.adminDays&&S.data.adminDays[ds])||null; } // 'admin' | 'meeting' | null
/* Tasks can be checked off by anyone (no admin PIN). A one-off task keeps done/doneAt;
   a repeating task keeps doneDates/<YYYY-MM-DD> for each date it was done. */
function isDone(e,ds){ return !!e&&e.type==="task"&&(e.recurrence?!!(e.doneDates&&e.doneDates[ds]):!!e.done); }
function toggleDone(id,ds){
  const e=S.data&&S.data.events&&S.data.events[id];
  if(!e||e.type!=="task"||!/^\d{4}-\d{2}-\d{2}$/.test(ds||"")) return;
  if(e.recurrence){
    if(e.doneDates&&e.doneDates[ds]) fbRemove("events/"+id+"/doneDates/"+ds);
    else fbSet("events/"+id+"/doneDates/"+ds,Date.now());
  } else {
    db.ref(CAL_ROOT+"/events/"+id).update(e.done?{done:null,doneAt:null}:{done:true,doneAt:Date.now()}).catch(fbErr);
  }
}
function taskBox(e,ds,sz){
  const done=isDone(e,ds), c=typeColors("task"), s=sz||22;
  return `<button data-act="task-done" data-id="${esc(e.id)}" data-date="${ds}" class="task-box" aria-pressed="${done}" aria-label="${done?"Mark not done":"Mark done"}" title="${done?"Done · click to undo":"Mark done"}" style="width:${s}px;height:${s}px;border:2px solid ${c.edge};background:${done?c.edge:"#FFFFFF"};color:#FFFFFF;font-size:${Math.round(s*.6)}px;">${done?"✓":""}</button>`;
}
const DONE_STYLE="text-decoration:line-through;opacity:.6;";
function fmtStamp(ms){ const d=new Date(ms); return isNaN(d)?"":SMON[d.getMonth()]+" "+d.getDate()+", "+d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}); }

function blankForm(ds){

  return {id:null,type:"event",title:"",staffId:"",startDate:d,endDate:d,allDay:true,time:"09:00",notes:"",recurrence:"",until:"",unpaid:false};

function readFormDom(){
  const f=S.form; if(!f) return;
  const g=id=>document.getElementById(id);
  if(g("f-title")) f.title=g("f-title").value;
  if(g("f-staff")) f.staffId=g("f-staff").value;
  if(g("f-start")) f.startDate=g("f-start").value||f.startDate;
  if(g("f-end")) f.endDate=g("f-end").value||f.endDate;
  if(g("f-until")) f.until=g("f-until").value;
  if(g("f-time")) f.time=g("f-time").value||f.time;
  if(g("f-rec")) f.recurrence=g("f-rec").value;
  if(g("f-notes")) f.notes=g("f-notes").value;
  if(g("f-allday")) f.allDay=g("f-allday").checked;
  if(g("f-unpaid")) f.unpaid=g("f-unpaid").checked;
}
function saveEntry(force){
  readFormDom();
  const f=S.form, data=S.data;
  if(f.type==="pto"&&!f.staffId){ S.formError="Pick a staff member for PTO."; S.blackoutWarn=false; return render(); }
  if(f.type!=="pto"&&!f.title.trim()){ S.formError="Give this entry a title."; S.blackoutWarn=false; return render(); }
  if(!f.startDate){ S.formError="Start date is required."; S.blackoutWarn=false; return render(); }
  /* events and tasks can repeat: each repeat is one day, and "Repeat until" (optional) ends the series */
  const rep=f.type!=="pto"&&f.recurrence?f.recurrence:null;
  const until=rep&&f.until?f.until:null;
  if(until&&until<f.startDate){ S.formError="“Repeat until” is before the first date."; S.blackoutWarn=false; return render(); }
  let end=f.endDate||f.startDate;
  if(end<f.startDate||rep) end=f.startDate;
  if(f.type==="pto"&&!force){
    let ds=f.startDate,hit=false;
    while(ds<=end){ if(isBlackout(ds)){hit=true;break;} ds=addDays(ds,1); }
    if(hit){ S.blackoutWarn=true; S.formError=""; return render(); }
  }
  const staff=f.staffId?calStaff()[f.staffId]:null;
  const rec={
    type:f.type,
    title:f.type==="pto"?(f.title.trim()||"PTO"):f.title.trim(),
    staffId:f.type==="pto"?f.staffId:null,
    staffName:f.type==="pto"&&staff?staff.name:null,
    startDate:f.startDate, endDate:end,
    time:f.type==="event"&&!f.allDay?f.time:null,
    notes:f.notes.trim(),
    recurrence:rep,
    until:until,
    unpaid:f.type==="pto"&&!!f.unpaid,
    createdAt:Date.now()
  };
  const id=f.id||("e"+Date.now()+Math.floor(Math.random()*999));
  const old=f.id?data.events[f.id]:null;
  if(old){
    if(old.createdAt) rec.createdAt=old.createdAt;
    /* editing a task keeps its check-offs */
    if(f.type==="task"){
      if(old.done){ rec.done=true; rec.doneAt=old.doneAt||null; }
      if(old.doneDates) rec.doneDates=old.doneDates;
    }
  }
  fbSet("events/"+id,rec);
  S.entryOpen=false; S.form=null; S.blackoutWarn=false; S.formError="";
  render();
}
function deleteEntry(id){
  const e=S.data&&S.data.events&&S.data.events[id];
  const msg=e&&e.recurrence
    ?"Delete this repeating "+(e.type==="task"?"task":"event")+"?\n\nEvery date in the series goes, past ones too. To stop it from a certain date instead, edit it and set “Repeat until”."
    :"Delete this entry?";
  if(!window.confirm(msg)) return;
  fbRemove("events/"+id);
  S.entryOpen=false; S.form=null;
  render();
}
function setAdminDay(ds,val){
  if(val) fbSet("adminDays/"+ds,val);
  else fbRemove("adminDays/"+ds);
}
function cycleAdminDay(ds){
  const cur=adminDayOf(ds);
  setAdminDay(ds, cur===null?"admin":(cur==="admin"?"meeting":null));
}

/* Columns Sun→Sat. The office is open Mon–Thu, so Fri, Sat and Sun get half a column each. */
const COLS="minmax(0,.5fr) repeat(4,minmax(0,1fr)) repeat(2,minmax(0,.5fr))";
/* the week view shows full entry cards, so closed days keep a little more room there */
const WEEK_COLS="minmax(0,.65fr) repeat(4,minmax(0,1fr)) repeat(2,minmax(0,.65fr))";
/* fade a view or the day panel in when it opens, not again on every refresh or check-off */
let animView=true, animDetail=true, lastViewKey="", lastDetailKey=null;

/* Redraw after a change from outside this screen (another computer saved, the staff roster or the Time-Off
   list updated) without losing what someone is typing: open-form fields, the focused box and its cursor. */
function bgRender(){
  const app=document.getElementById("app");
  if(!app) return;
  if(S.entryOpen&&S.form) readFormDom();
  const keep={};
  app.querySelectorAll("input[id],textarea[id],select[id]").forEach(el=>{ keep[el.id]=el.type==="checkbox"?{c:el.checked}:{v:el.value}; });
  const a=document.activeElement;
  let foc=null;
  if(a&&a.id&&app.contains(a)){ foc={id:a.id}; try{ foc.s=a.selectionStart; foc.e=a.selectionEnd; }catch(_){} }
  render();
  Object.keys(keep).forEach(id=>{
    const el=document.getElementById(id);
    if(!el||!app.contains(el)) return;
    if("c" in keep[id]) el.checked=keep[id].c;
    else if(el.value!==keep[id].v) el.value=keep[id].v;
  });
  if(foc){
    const el=document.getElementById(foc.id);
    if(el&&app.contains(el)&&document.activeElement!==el){
      el.focus({preventScroll:true});
      if(typeof foc.s==="number"){ try{ el.setSelectionRange(foc.s,foc.e); }catch(_){} }
    }
  }
}

function render(){

  if(!S.data){ app.innerHTML=`<div style="padding:60px;text-align:center;color:var(--grey-500);font-size:16px;">Loading calendar…</div>`; return; }
  const today=todayStr();
  if(!S.cursor) S.cursor=today;
  const cursor=S.cursor, cd=parseD(cursor), view=S.view, data=S.data;
  const phone=PHONE.matches;
  const vk=view+"|"+cursor+"|"+(phone?"p":"d");
  animView=vk!==lastViewKey; lastViewKey=vk;
  animDetail=!!S.detailDate&&S.detailDate!==lastDetailKey; lastDetailKey=S.detailDate;

  /* period label */
  let periodLabel=MONTHS[cd.getMonth()]+" "+cd.getFullYear();
  if(view==="week"){ const ws=weekStart(cursor),we=addDays(ws,6); periodLabel=prettyRange(ws,we)+", "+parseD(ws).getFullYear(); }

  /* who's out — next two OPEN office days (Fri/Sat/Sun + holidays skipped) */
  const d1=nextOpenDay(today);

    if(ds===today) return "Today";
    if(ds===addDays(today,1)) return "Tomorrow";

  const lbl1=dayLbl(d1), lbl2=dayLbl(d2);
  const outOnce=list=>list.filter((e,i,a)=>a.findIndex(x=>(x.staffName||"PTO")===(e.staffName||"PTO"))===i);
  const outTodayE=outOnce(entriesFor(d1,true).filter(e=>e.type==="pto"));
  const outTomorrowE=outOnce(entriesFor(d2,true).filter(e=>e.type==="pto"));
  const outToday=outTodayE.map(e=>e.staffName||"PTO"), outTomorrow=outTomorrowE.map(e=>e.staffName||"PTO");

  /* keep the scroll position of an open panel or form across redraws */
  const sc={};
  app.querySelectorAll("[data-keep-scroll]").forEach(el=>{ sc[el.getAttribute("data-keep-scroll")]=el.scrollTop; });

  app.querySelectorAll("[data-keep-scroll]").forEach(el=>{ const v=sc[el.getAttribute("data-keep-scroll")]; if(v) el.scrollTop=v; });
  const pin=document.getElementById("pin-input");

function renderMonth(today,cd){
  const phone=PHONE.matches, gap=phone?4:8;
  let h=`<div class="${animView?"fadeup":""}" style="padding:${phone?"2px 10px 24px":"8px 24px 28px"};">
    <div style="display:grid;grid-template-columns:${COLS};gap:0 ${gap}px;padding:0 0 6px;">`;
  ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach((n,i)=>{
    const shut=i===0||i>4;
    h+=`<div class="disp" style="min-width:0;font-weight:600;letter-spacing:${phone?".04em":".12em"};font-size:${phone?"11px":"13px"};color:${shut?"#969FAB":"#4C5868"};text-align:${phone?"center":"left"};padding:${phone?"2px 0":"4px 10px"};white-space:nowrap;overflow:hidden;">${phone&&shut?n.charAt(0):n}</div>`;
  });
  h+=`</div><div style="display:grid;grid-template-columns:${COLS};gap:${gap}px;">`;
  const first=new Date(cd.getFullYear(),cd.getMonth(),1);
  const gridStart=weekStart(fmt(first));
  for(let i=0;i<42;i++){
    const ds=addDays(gridStart,i);
    const d=parseD(ds);
    const inMonth=d.getMonth()===cd.getMonth();
    const isToday=ds===today;
    const closed=isClosedDay(ds);
    const blackout=isBlackout(ds);
    const entries=entriesFor(ds);
    const ad=adminDayOf(ds);
    const adTint=ad==="meeting"?"#FFE7E1":"#E2FBF4";
    const bg=blackout?"repeating-linear-gradient(135deg,#ECEEF0 0 6px,#F7F8F9 6px 12px)":(ad?adTint:(closed?"#F0F1F3":"#FFFFFF"));
    const border=isToday?"2px solid #1D3EA9":(ad?("1px solid "+(ad==="meeting"?"#FFC8BF":"#C0FBEC")):"1px solid #DCE0E4");
    h+=`<div data-act="open-day" data-date="${ds}" class="hov-cell month-cell" style="position:relative;min-width:0;min-height:${phone?"74px":"118px"};border-radius:${phone?"8px":"12px"};padding:${phone?(closed?"4px 1px":"4px 3px"):"8px"};cursor:pointer;display:flex;flex-direction:column;${phone?"align-items:center;":""}gap:${phone?"3px":"4px"};overflow:hidden;border:${border};background:${bg};opacity:${inMonth?"1":"0.45"};">`;
    if(ad&&!phone) h+=`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;"><span class="disp" style="transform:rotate(-16deg);font-weight:700;font-size:15px;letter-spacing:.16em;color:${ad==="meeting"?"#D8412E":"#1F9E7E"};opacity:.45;white-space:nowrap;">${ad==="meeting"?"Admin + Mtg":"Admin Day"}</span></div>`;
    h+=`<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
        <span style="font-weight:700;font-size:${phone?"13px":"15px"};min-width:${phone?"22px":"26px"};height:${phone?"22px":"26px"};display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:${isToday?"#1D3EA9":"transparent"};color:${isToday?"#FFFFFF":(closed?"#969FAB":"#1B2F4C")};">${d.getDate()}</span>`;
    if(blackout&&!phone) h+=`<span class="disp" style="font-weight:600;letter-spacing:.1em;font-size:10px;background:var(--navy-800);color:#fff;border-radius:4px;padding:2px 6px;">No PTO</span>`;
    h+=`</div>`;
    if(phone){
      /* phones: one small coloured mark per entry; tap the day for the details */
      const cap=closed?2:4, shown=entries.slice(0,cap);
      if(shown.length){
        h+=`<div style="display:flex;flex-wrap:wrap;gap:3px;justify-content:center;">`;
        shown.forEach(e=>{
          const c=typeColors(e.type), done=isDone(e,ds);
          h+=`<span style="width:16px;height:16px;border-radius:4px;background:${c.bg};color:${c.fg};font-size:9px;line-height:1;display:inline-flex;align-items:center;justify-content:center;${done?"opacity:.5;":""}">${done?"✓":c.glyph}</span>`;
        });
        h+=`</div>`;
      }
      if(entries.length>cap) h+=`<div style="font-size:11px;font-weight:700;color:var(--grey-500);line-height:1;">+${entries.length-cap}</div>`;
    } else {
      const MAX=3;
      entries.slice(0,MAX).forEach(e=>{
        const c=typeColors(e.type), done=isDone(e,ds), pp=entryPerson(e);
        const label=e.type==="event"&&e.time?fmtTime(e.time)+" "+entryLabel(e):entryLabel(e);
        const lead=pp&&pp.photo?calAvatar(pp,16):`<span style="font-size:9px;flex:none;">${done?"✓":c.glyph}</span>`;
        h+=`<div style="font-size:13px;font-weight:600;border-radius:6px;padding:3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;background:${c.bg};color:${c.fg};${done?"opacity:.6;":""}">${lead}<span style="overflow:hidden;text-overflow:ellipsis;${done?"text-decoration:line-through;":""}">${esc(label)}</span></div>`;
      });
      if(entries.length>MAX) h+=`<div style="font-size:12px;font-weight:600;color:var(--grey-500);padding:0 8px;">+${entries.length-MAX} more</div>`;
    }
    h+=`</div>`;
  }
  h+=`</div></div>`;
  return h;
}

function weekEntry(e,ds){
  const c=typeColors(e.type), done=isDone(e,ds);
  return `<div style="border-radius:8px;padding:8px 10px;background:${c.bg};">
        <div style="display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;color:${c.fg};">${e.type==="task"?taskBox(e,ds,18):(entryPerson(e)?whoFace(e,20):`<span style="font-size:9px;flex:none;">${c.glyph}</span>`)}<span style="min-width:0;overflow-wrap:break-word;${done?DONE_STYLE:""}">${esc(entryLabel(e))}</span></div>
        <div style="font-size:12.5px;font-weight:500;margin-top:2px;color:${c.fg};opacity:.85;overflow-wrap:break-word;">${esc(entrySub(e))}</div>
      </div>`;
}

function renderWeek(today,cursor){
  const ws=weekStart(cursor);
  if(PHONE.matches) return renderWeekList(today,ws);
  let h=`<div class="${animView?"fadeup":""}" style="padding:8px 24px 28px;"><div style="display:grid;grid-template-columns:${WEEK_COLS};gap:10px;align-items:stretch;">`;
  for(let i=0;i<7;i++){
    const ds=addDays(ws,i);
    const d=parseD(ds);
    const isToday=ds===today;
    const closed=isClosedDay(ds);
    const blackout=isBlackout(ds);
    const adW=adminDayOf(ds);
    const weekBg=adW?(adW==="meeting"?"#FFE7E1":"#E2FBF4"):(closed?"#F0F1F3":"#FFFFFF");
    h+=`<div data-act="open-day" data-date="${ds}" class="hov-cell" style="min-width:0;border-radius:14px;min-height:380px;padding:${closed?"12px 8px":"12px"};display:flex;flex-direction:column;gap:8px;cursor:pointer;border:${isToday?"2px solid #1D3EA9":"1px solid #DCE0E4"};background:${weekBg};">
      <div style="display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;border-bottom:1px solid var(--grey-200);padding-bottom:8px;">
        <span class="disp" style="font-weight:600;letter-spacing:.1em;font-size:13px;color:${isToday?"#1D3EA9":"#6B7685"};">${DAYS[d.getDay()].slice(0,3)}</span>
        <span style="font-weight:700;font-size:20px;color:${isToday?"#1D3EA9":"#1B2F4C"};">${d.getDate()}</span>`;
    if(closed) h+=`<span style="font-size:11px;font-weight:600;color:var(--grey-400);text-transform:uppercase;letter-spacing:.08em;">Closed</span>`;
    h+=`</div>`;
    if(blackout) h+=`<span class="disp" style="font-weight:600;letter-spacing:.1em;font-size:11px;background:var(--navy-800);color:#fff;border-radius:4px;padding:3px 8px;align-self:flex-start;">No PTO — blackout</span>`;
    if(adW) h+=`<div style="align-self:flex-start;">${adminDayTag(ds)}</div>`;
    entriesFor(ds).forEach(e=>{ h+=weekEntry(e,ds); });
    h+=`</div>`;
  }
  h+=`</div></div>`;
  return h;
}

/* phones: the week as a list, one row per day; a closed day with nothing on it is a thin line */
function renderWeekList(today,ws){
  let h=`<div class="${animView?"fadeup":""}" style="padding:2px 14px 28px;display:flex;flex-direction:column;gap:8px;">`;
  for(let i=0;i<7;i++){
    const ds=addDays(ws,i);
    const d=parseD(ds);
    const isToday=ds===today;
    const closed=isClosedDay(ds);
    const blackout=isBlackout(ds);
    const ad=adminDayOf(ds);
    const entries=entriesFor(ds);
    const name=DAYS[d.getDay()].slice(0,3)+" "+d.getDate();
    if(closed&&!entries.length&&!ad&&!isToday){
      h+=`<div data-act="open-day" data-date="${ds}" style="display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:10px;background:#F0F1F3;cursor:pointer;">
        <span class="disp" style="font-weight:600;letter-spacing:.08em;font-size:13px;color:#969FAB;">${name}</span>
        <span style="font-size:11px;font-weight:600;color:var(--grey-400);text-transform:uppercase;letter-spacing:.08em;">Closed</span>
      </div>`;
      continue;
    }
    const bg=blackout?"repeating-linear-gradient(135deg,#ECEEF0 0 6px,#F7F8F9 6px 12px)":(ad?(ad==="meeting"?"#FFE7E1":"#E2FBF4"):(closed?"#F0F1F3":"#FFFFFF"));
    h+=`<div data-act="open-day" data-date="${ds}" style="border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;border:${isToday?"2px solid #1D3EA9":"1px solid #DCE0E4"};background:${bg};">
      <div style="display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;">
        <span class="disp" style="font-weight:700;letter-spacing:.06em;font-size:16px;color:${isToday?"#1D3EA9":"#1B2F4C"};">${name}</span>`;
    if(isToday) h+=`<span class="disp" style="font-weight:600;letter-spacing:.1em;font-size:11px;background:var(--blue-600);color:#fff;border-radius:999px;padding:2px 10px;">Today</span>`;
    if(closed) h+=`<span style="font-size:11px;font-weight:600;color:var(--grey-400);text-transform:uppercase;letter-spacing:.08em;">Closed</span>`;
    if(blackout) h+=`<span class="disp" style="font-weight:600;letter-spacing:.1em;font-size:10px;background:var(--navy-800);color:#fff;border-radius:4px;padding:2px 6px;">No PTO</span>`;
    h+=adminDayTag(ds,true);
    h+=`</div>`;
    if(!entries.length) h+=`<div style="font-size:13px;color:var(--grey-400);">Nothing scheduled</div>`;
    entries.forEach(e=>{ h+=weekEntry(e,ds); });
    h+=`</div>`;
  }
  h+=`</div>`;
  return h;
}

function renderAgenda(today,cursor){
  const phone=PHONE.matches;
  let h=`<div class="${animView?"fadeup":""}" style="padding:${phone?"2px 14px 40px":"8px 24px 40px"};max-width:860px;width:100%;margin:0 auto;">`;
  let count=0;
  for(let i=0;i<45;i++){
    const ds=addDays(cursor,i);
    const entries=entriesFor(ds);
    const ad=adminDayOf(ds);
    if(!entries.length&&!ad) continue;
    count++;
    const d=parseD(ds);
    const isToday=ds===today;
    h+=`<div style="margin-bottom:${phone?"18px":"22px"};">
      <div data-act="open-day" data-date="${ds}" style="display:flex;align-items:center;flex-wrap:wrap;gap:${phone?"8px":"12px"};cursor:pointer;margin-bottom:8px;">
        <span class="disp" style="font-weight:700;letter-spacing:.06em;font-size:${phone?"17px":"20px"};color:${isToday?"#1D3EA9":"#1B2F4C"};">${DAYS[d.getDay()]} · ${SMON[d.getMonth()]} ${d.getDate()}</span>`;
    if(isToday) h+=`<span class="disp" style="font-weight:600;letter-spacing:.1em;font-size:12px;background:var(--blue-600);color:#fff;border-radius:999px;padding:3px 12px;">Today</span>`;
    if(isBlackout(ds)) h+=`<span class="disp" style="font-weight:600;letter-spacing:.1em;font-size:12px;background:var(--navy-800);color:#fff;border-radius:4px;padding:3px 10px;">No PTO</span>`;
    h+=adminDayTag(ds);
    h+=`<div style="flex:1;min-width:20px;height:1px;background:var(--grey-200);"></div></div>
      <div style="display:flex;flex-direction:column;gap:8px;">`;
    entries.forEach(e=>{
      const c=typeColors(e.type), done=isDone(e,ds);
      const timeLabel=e.time?fmtTime(e.time):(e.type==="pto"?prettyRange(e.startDate,e.endDate):"All day");
      h+=`<div style="background:var(--white);border:1px solid var(--grey-200);border-left:6px solid ${c.edge};border-radius:10px;padding:${phone?"12px":"14px 16px"};display:flex;gap:${phone?"10px":"14px"};align-items:center;">
        <span style="font-family:var(--font-mono);font-size:${phone?"12.5px":"14px"};font-weight:500;color:var(--grey-500);min-width:${phone?"58px":"76px"};flex:none;">${esc(timeLabel)}</span>
        ${e.type==="task"?taskBox(e,ds):whoFace(e,phone?28:30)}
        <div style="flex:1;min-width:0;">
          <div style="font-weight:700;font-size:${phone?"16px":"17px"};color:var(--navy-800);overflow-wrap:break-word;${done?DONE_STYLE:""}">${esc(entryLabel(e))}</div>`;
      if(e.notes) h+=`<div style="font-size:14px;color:var(--grey-500);margin-top:3px;overflow-wrap:break-word;">${esc(e.notes)}</div>`;
      h+=`</div><span style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;flex:none;color:${c.edge};">${entryTypeLabel(e)}</span>
      </div>`;
    });
    h+=`</div></div>`;
  }
  if(count===0) h+=`<div style="text-align:center;padding:60px 20px;color:var(--grey-500);font-size:16px;">Nothing scheduled in the next 45 days.</div>`;
  h+=`</div>`;
  return h;
}

function renderDetail(today,dd){
  const d=parseD(dd);
  const ad=adminDayOf(dd);
  const hol=holidayMap()[dd];
  let sub=(dd===today?"Today · ":"")+(hol?("Office closed — "+hol.label):(isClosedDay(dd)?"Office closed (Mon–Thu 8–5)":"Office open 8 AM – 5 PM"));
  const list=entriesFor(dd);
  let h=`<div data-act="close-detail" style="position:fixed;inset:0;background:rgba(17,32,58,.42);z-index:60;"></div>
  <div class="${animDetail?"fadeup-fast ":""}detail-panel" style="position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:#fff;z-index:61;box-shadow:-12px 0 40px rgba(17,32,58,.25);display:flex;flex-direction:column;">
    <div style="background:var(--navy-800);color:#F2F3F4;padding:20px 22px;display:flex;align-items:flex-start;gap:12px;">
      <div style="flex:1;">
        <div class="disp" style="font-weight:700;font-size:26px;line-height:1.05;">${DAYS[d.getDay()]}, ${SMON[d.getMonth()]} ${d.getDate()}</div>
        <div style="font-size:14px;color:#A7B2C2;margin-top:4px;">${esc(sub)}</div>
      </div>
      <button data-act="close-detail" aria-label="Close" style="border:none;background:var(--navy-700);color:#F2F3F4;border-radius:999px;width:34px;height:34px;font-size:16px;">✕</button>
    </div>`;
  if(isBlackout(dd)) h+=`<div class="disp" style="background:var(--navy-800);color:#E29A14;padding:8px 22px;font-size:13px;font-weight:600;letter-spacing:.06em;">Blackout date — PTO not allowed</div>`;
  if(ad==="admin") h+=`<div class="disp" style="background:var(--mint-100);color:var(--mint-700);padding:8px 22px;font-size:13px;font-weight:600;letter-spacing:.06em;border-bottom:1px solid var(--mint-200);">Admin day — flexible (Dr. A can schedule off)</div>`;
  if(ad==="meeting") h+=`<div class="disp" style="background:var(--coral-100);color:var(--coral-700);padding:8px 22px;font-size:13px;font-weight:600;letter-spacing:.06em;border-bottom:1px solid var(--coral-200);">Admin day + staff meeting — Dr. A must attend</div>`;
  /* quick admin-day toggle (admin only) */
  if(S.admin){
    const opt=(val,label,on,onBg,onFg)=>`<button data-act="adminday" data-date="${dd}" data-v="${val}" style="flex:1;border:none;border-radius:999px;padding:8px 6px;font-weight:700;font-size:12.5px;background:${on?onBg:"transparent"};color:${on?onFg:"#4C5868"};">${label}</button>`;
    h+=`<div style="padding:12px 22px;border-bottom:1px solid var(--grey-200);">
      <div class="disp" style="font-weight:600;letter-spacing:.12em;font-size:12px;color:var(--grey-600);margin-bottom:8px;">Mark this day</div>
      <div style="display:flex;gap:6px;background:var(--grey-100);border-radius:999px;padding:4px;">
        ${opt("","Regular",!ad,"#1B2F4C","#FFFFFF")}
        ${opt("admin","Admin day",ad==="admin","#64F4C9","#11203A")}
        ${opt("meeting","Admin + mtg",ad==="meeting","#FA624D","#FFFFFF")}
      </div>
    </div>`;
  }
  h+=`<div data-keep-scroll="detail" style="flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:10px;">`;
  if(!list.length) h+=`<div style="color:var(--grey-500);font-size:15px;padding:20px 0;">Nothing scheduled this day.</div>`;
  list.forEach(e=>{
    const c=typeColors(e.type), done=isDone(e,dd);
    const doneAt=done?(e.recurrence?e.doneDates[dd]:e.doneAt):null;
    h+=`<div style="border:1px solid var(--grey-200);border-left:6px solid ${c.edge};border-radius:10px;padding:12px 14px;">
      <div style="display:flex;align-items:center;gap:10px;">
        ${e.type==="task"?taskBox(e,dd):whoFace(e,30)}
        <div style="flex:1;min-width:0;font-weight:700;font-size:16px;color:var(--navy-800);overflow-wrap:break-word;${done?DONE_STYLE:""}">${esc(entryLabel(e))}</div>
        <span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:${c.edge};flex:none;">${entryTypeLabel(e)}</span>
      </div>
      <div style="font-size:13.5px;color:var(--grey-500);margin-top:3px;">${esc(entrySub(e))}${typeof doneAt==="number"?esc(" · checked off "+fmtStamp(doneAt)):""}</div>`;
    if(e.notes) h+=`<div style="font-size:14px;color:var(--grey-600);margin-top:6px;overflow-wrap:break-word;">${esc(e.notes)}</div>`;
    if(S.admin&&!e.synced){
      h+=`<div style="display:flex;gap:8px;margin-top:10px;">
        <button data-act="edit-entry" data-id="${e.id}" class="hov-grey" style="border:1px solid var(--grey-300);background:#fff;border-radius:8px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--navy-800);">Edit</button>
        <button data-act="del-entry" data-id="${e.id}" class="hov-coral1" style="border:1px solid var(--coral-200);background:#fff;border-radius:8px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--coral-700);">Delete</button>
      </div>`;
    } else if(S.admin&&e.synced&&e.type==="pto"){
      h+=`<div style="font-size:12.5px;color:var(--grey-400);margin-top:8px;">Synced from the Time-Off Request app — manage it there.</div>`;
    } else if(S.admin&&(e.type==="bday"||e.type==="anniv")){
      h+=`<div style="font-size:12.5px;color:var(--grey-400);margin-top:8px;">From the staff list — edit in Settings → Staff.</div>`;
    } else if(S.admin&&e.type==="hr"){
      h+=`<div style="font-size:12.5px;color:var(--grey-400);margin-top:8px;">From Staff Hub — change it there.</div>`;
    }
    h+=`</div>`;
  });
  h+=`</div>`;
  if(S.admin){
    h+=`<div style="padding:14px 22px;border-top:1px solid var(--grey-200);">
      <button data-act="add-for-day" data-date="${dd}" class="pill-btn hov-blue7" style="width:100%;padding:13px;font-size:15px;background:var(--blue-600);color:#fff;">+ Add entry on this day</button>
    </div>`;
  }
  h+=`</div>`;
  return h;
}

function renderEntry(){
  const f=S.form;
  const typeBtn=(t,g,l)=>{
    const on=f.type===t;
    return `<button data-act="form-type" data-v="${t}" style="flex:1;border:none;border-radius:999px;padding:9px;font-weight:700;font-size:14px;background:${on?"#1B2F4C":"transparent"};color:${on?"#FFFFFF":"#4C5868"};">${g} ${l}</button>`;
  };
  const lab=`display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--grey-600);text-transform:uppercase;letter-spacing:.06em;`;
  const inp=`padding:10px;border:2px solid var(--grey-300);border-radius:10px;font-size:15px;color:var(--navy-800);`;
  const rep=f.type!=="pto"&&!!f.recurrence;
  let h=`<div data-act="close-entry" style="position:fixed;inset:0;background:rgba(17,32,58,.5);z-index:70;"></div>
  <div data-keep-scroll="entry" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:71;background:#fff;border-radius:16px;padding:26px;width:min(460px,94vw);max-height:92vh;overflow-y:auto;box-shadow:0 24px 60px rgba(17,32,58,.35);">
    <div class="disp" style="font-weight:700;font-size:24px;color:var(--navy-800);margin-bottom:16px;">${f.id?"Edit entry":"Add entry"}</div>
    <div style="display:flex;gap:6px;background:var(--grey-100);border-radius:999px;padding:4px;margin-bottom:16px;">
      ${typeBtn("pto","●","PTO")}${typeBtn("event","■","Event")}${typeBtn("task","▲","Task")}
    </div>
    <div style="display:flex;flex-direction:column;gap:12px;">`;
  if(f.type==="pto"){
    h+=`<label style="${lab}">Staff member
      <select id="f-staff" style="${inp}background:#fff;"><option value="">— Select staff —</option>`;
    const staffL=calStaff();
    Object.keys(staffL).filter(id=>staffL[id].active||(staffL[id].left&&id===f.staffId)).forEach(id=>{
      h+=`<option value="${id}" ${f.staffId===id?"selected":""}>${esc(staffL[id].name)}</option>`;
    });
    h+=`</select></label>
      <label style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--navy-800);cursor:pointer;">
        <input type="checkbox" id="f-unpaid" ${f.unpaid?"checked":""} style="width:18px;height:18px;accent-color:#1D3EA9;"> Unpaid time off (no PTO balance used)
      </label>`;
  }
  h+=`<label style="${lab}">${f.type==="pto"?"Label (optional)":"Title"}
      <input type="text" id="f-title" value="${esc(f.title)}" placeholder="${f.type==="pto"?"e.g. Vacation, Sick day":(f.type==="task"?"e.g. Supply order due":"e.g. Staff meeting")}" style="${inp}">
    </label>`;
  /* events and tasks can repeat; "Repeat until" (optional) ends the series */
  if(f.type!=="pto"){
    const o=(v,l)=>`<option value="${v}" ${(f.recurrence||"")===v?"selected":""}>${l}</option>`;
    h+=`<label style="${lab}">Repeats
      <select id="f-rec" style="${inp}background:#fff;">${o("","Does not repeat")}${o("weekly","Weekly")}${o("biweekly","Every 2 weeks")}${o("monthly","Monthly")}${o("quarterly","Quarterly")}${o("yearly","Yearly")}</select></label>`;
  }
  h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <label style="${lab}">${rep?"First date":"Start date"}<input type="date" id="f-start" value="${f.startDate}" style="${inp}font-size:14px;"></label>`;
  if(rep) h+=`<label style="${lab}">Repeat until<input type="date" id="f-until" value="${f.until||""}" min="${f.startDate}" style="${inp}font-size:14px;"></label>`;
  else h+=`<label style="${lab}">End date<input type="date" id="f-end" value="${f.endDate}" style="${inp}font-size:14px;"></label>`;
  h+=`</div>`;
  if(rep) h+=`<div style="font-size:12.5px;color:var(--grey-500);margin-top:-6px;">Leave “Repeat until” empty to keep it going.</div>`;
  if(f.type==="event"){
    h+=`<div style="display:flex;align-items:center;gap:14px;">
      <label style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--navy-800);cursor:pointer;">
        <input type="checkbox" id="f-allday" ${f.allDay?"checked":""} style="width:18px;height:18px;accent-color:#1D3EA9;"> All-day
      </label>`;
    if(!f.allDay) h+=`<input type="time" id="f-time" value="${f.time}" style="padding:8px;border:2px solid var(--grey-300);border-radius:10px;font-size:14px;color:var(--navy-800);">`;
    h+=`</div>`;
  }
  h+=`<label style="${lab}">Notes<textarea id="f-notes" rows="2" style="${inp}resize:vertical;min-height:56px;">${esc(f.notes)}</textarea></label>`;
  if(S.formError) h+=`<div style="color:var(--coral-700);font-size:13.5px;font-weight:600;">${esc(S.formError)}</div>`;
  if(S.blackoutWarn){
    h+=`<div style="background:var(--amber-100);border:1px solid #F5DFA9;border-radius:10px;padding:12px 14px;">
      <div style="font-weight:700;font-size:14px;color:var(--amber-700);">⚠ Blackout date conflict</div>

/* ================= EVENTS ================= */
function clearInputs(ids){ ids.forEach(i=>{ const x=document.getElementById(i); if(x) x.value=""; }); }
document.getElementById("app").addEventListener("click",(ev)=>{
  const el=ev.target.closest("[data-act]");
  if(!el) return;
  const act=el.dataset.act;
  const today=todayStr();
  switch(act){
    case "view": S.view=el.dataset.v; render(); break;
    case "prev": case "next": {
      const n=act==="prev"?-1:1;
      if(S.view==="month"){ const cd=parseD(S.cursor||today); S.cursor=fmt(new Date(cd.getFullYear(),cd.getMonth()+n,1)); }
      else S.cursor=addDays(S.cursor||today,n*7);
      render(); break;
    }
    case "today": S.cursor=today; render(); break;
    case "filter": { const k=el.dataset.f; S.filters[k]=!S.filters[k]; render(); break; }
    case "open-day":
      if(S.admin&&S.paintMode){ cycleAdminDay(el.dataset.date); break; }
      S.detailDate=el.dataset.date; render(); break;
    case "paint-toggle": S.paintMode=!S.paintMode; render(); break;
    case "close-detail": if(ev.target===el||el.tagName==="BUTTON"){ S.detailDate=null; render(); } break;
    case "open-pin": S.pinOpen=true; S.pinValue=""; S.pinError=false; render(); break;
    case "close-pin": if(ev.target===el||el.tagName==="BUTTON"){ S.pinOpen=false; S.pinValue=""; S.pinError=false; render(); } break;
    case "submit-pin": trySubmitPin(); break;
    case "lock-admin": S.admin=false; S.paintMode=false; render(); break;
    case "open-add": S.form=blankForm(S.detailDate||today); S.entryOpen=true; S.blackoutWarn=false; S.formError=""; render(); break;
    case "add-for-day": S.form=blankForm(el.dataset.date); S.entryOpen=true; S.blackoutWarn=false; S.formError=""; render(); break;
    case "close-entry": if(ev.target===el||el.tagName==="BUTTON"){ S.entryOpen=false; S.form=null; S.blackoutWarn=false; S.formError=""; render(); } break;
    case "form-type": readFormDom(); S.form.type=el.dataset.v; S.blackoutWarn=false; S.formError=""; render(); break;
    case "save-entry": saveEntry(false); break;
    case "save-anyway": saveEntry(true); break;
    case "del-from-form": deleteEntry(el.dataset.id); break;
    case "edit-entry": {
      const e=S.data.events[el.dataset.id];
      if(!e) break;
      S.form={ id:el.dataset.id, type:e.type, title:(e.type==="pto"&&e.title==="PTO")?"":e.title, staffId:e.staffId||"",
               startDate:e.startDate, endDate:e.endDate||e.startDate, allDay:!e.time, time:e.time||"09:00",
               notes:e.notes||"", recurrence:e.recurrence||"", until:e.until||"", unpaid:!!e.unpaid };
      S.entryOpen=true; S.blackoutWarn=false; S.formError=""; render(); break;
    }
    case "del-entry": deleteEntry(el.dataset.id); break;
    case "task-done": toggleDone(el.dataset.id,el.dataset.date); break;
    case "dismiss-save-err": S.saveErr=null; render(); break;
    case "dismiss-lock-note": S.lockNote=""; render(); break;
    case "adminday": setAdminDay(el.dataset.date, el.dataset.v||null); break;
    case "open-settings": S.settingsOpen=true; S.pinSaved=false; render(); break;
    case "close-settings": if(ev.target===el||el.tagName==="BUTTON"){ S.settingsOpen=false; render(); } break;
    case "sync-now": syncTimeOff(); break;
    case "staff-remove": {
      const id=el.dataset.id;
      if(!window.confirm("Remove "+S.data.staff[id].name+"?\n\nThis also deletes ALL their calendar entries — PTO, birthday, and work-anniversary dates.")) break;
      Object.keys(S.data.events).forEach(eid=>{ if(S.data.events[eid].staffId===id) fbRemove("events/"+eid); });
      fbRemove("staff/"+id);
      if(S.editStaffId===id) S.editStaffId=null;
      break;
    }
    case "staff-add": {
      const name=(document.getElementById("new-staff").value||"").trim();
      if(!name) break;
      const bday=document.getElementById("new-staff-bday").value||null;
      const hire=document.getElementById("new-staff-hire").value||null;
      const rec={name,active:true};
      if(bday) rec.birthday=bday;
      if(hire) rec.hireDate=hire;
      fbSet("staff/s"+Date.now(),rec);
      clearInputs(["new-staff","new-staff-bday","new-staff-hire"]);
      break;
    }
    case "staff-edit": S.editStaffId=el.dataset.id; render(); break;
    case "staff-edit-cancel": S.editStaffId=null; render(); break;
    case "staff-edit-save": {
      const id=el.dataset.id, cur=calStaff()[id]||{};
      const nameEl=document.getElementById("se-name"), hireEl=document.getElementById("se-hire");
      const name=nameEl?(nameEl.value||"").trim():String(cur.savedName||cur.name||"").trim();
      if(!name) break;
      const upd={ birthday: document.getElementById("se-bday").value||null };
      if(hireEl) upd.hireDate=hireEl.value||null;
      /* someone from Staff Hub keeps the name they were saved under (the calendar shows Staff Hub's) */
      if(nameEl||!S.data.staff[id]) upd.name=name;
      /* first save for a Staff Hub-only person creates their calendar record */
      if(!S.data.staff[id]) upd.active=true;
      db.ref(CAL_ROOT+"/staff/"+id).update(upd).catch(fbErr);
      S.editStaffId=null; render();
      break;
    }
    case "closure-remove": fbRemove("settings/closures/"+el.dataset.date); break;
    case "closure-add": {
      const d=document.getElementById("new-closure-date").value;
      const lbl=(document.getElementById("new-closure-label").value||"").trim()||"Office closed";
      if(!d) break;
      fbSet("settings/closures/"+d,lbl);
      clearInputs(["new-closure-date","new-closure-label"]);
      break;
    }
    case "blackout-remove": fbRemove("settings/blackoutDates/"+el.dataset.date); break;
    case "blackout-add": {
      const inp=document.getElementById("new-blackout");
      if(!inp.value) break;
      fbSet("settings/blackoutDates/"+inp.value,true);
      clearInputs(["new-blackout"]); break;
    }
    case "pin-save": {
      const inp=document.getElementById("pin-field");
      const p=(inp.value||"").replace(/\D/g,"").slice(0,6);
      if(p.length<4) break;
      fbSet("settings/adminPin",p);
      clearInputs(["pin-field"]);
      S.pinSaved=true; render(); break;
    }
  }
});

document.getElementById("app").addEventListener("change",(ev)=>{
  const el=ev.target.closest("[data-chg]");
  if(el&&el.dataset.chg==="staff-toggle"){
    fbSet("staff/"+el.dataset.id+"/active",el.checked);
    return;
  }
  if(el&&el.dataset.chg==="hr-reviews-admin"){
    fbSet("settings/hrReviewsAdminOnly",el.checked?true:null);
    return;
  }
  if(ev.target.id==="f-allday"||ev.target.id==="f-rec"){ readFormDom(); render(); }
  if(ev.target.id==="f-start"){
    readFormDom();
    if(S.form.endDate<S.form.startDate){ S.form.endDate=S.form.startDate; render(); }
  }
});

document.getElementById("app").addEventListener("keydown",(ev)=>{
  if(ev.target.id==="pin-input"){
    S.pinValue=ev.target.value;
    if(ev.key==="Enter"){ setTimeout(trySubmitPin,0); }
  }
});
document.getElementById("app").addEventListener("input",(ev)=>{
  if(ev.target.id==="pin-input"){ S.pinValue=ev.target.value; }
});
/* switch between the phone and desktop layouts when the window crosses 700px (rotating a tablet, resizing) */
if(PHONE.addEventListener) PHONE.addEventListener("change",()=>bgRender());
else if(PHONE.addListener) PHONE.addListener(()=>bgRender());

function trySubmitPin(){
  const el=document.getElementById("pin-input");
  const val=el?el.value:S.pinValue;
  const pin=(S.data&&S.data.settings&&S.data.settings.adminPin)||"2468";
  if(val===pin){ S.admin=true; S.pinOpen=false; S.pinValue=""; S.pinError=false; S.lockNote=""; adminSeen=Date.now(); }
  else { S.pinValue=val; S.pinError=true; }
  render();
}

/* ================= ADMIN AUTO-LOCK =================
   On a shared office computer, admin mode locks itself after 10 minutes without a click, tap, key press or
   scroll (also checked when someone comes back to the tab). Open admin panels (Settings, Add/Edit) close with it. */
const ADMIN_IDLE_MIN=10;
let adminSeen=Date.now();
["pointerdown","keydown","wheel","touchstart","scroll"].forEach(t=>document.addEventListener(t,()=>{ adminSeen=Date.now(); },{passive:true,capture:true}));
function lockAdmin(note){
  S.admin=false; S.paintMode=false; S.settingsOpen=false; S.entryOpen=false; S.form=null;
  S.blackoutWarn=false; S.formError=""; S.editStaffId=null; S.pinSaved=false;
  S.lockNote=note||"";
  render();
  if(note) setTimeout(()=>{ if(S.lockNote===note){ S.lockNote=""; bgRender(); } },10000);
}
function adminIdleCheck(){
  if(S.admin&&S.data&&Date.now()-adminSeen>ADMIN_IDLE_MIN*60000) lockAdmin("Admin mode locked after "+ADMIN_IDLE_MIN+" minutes without use.");
}
setInterval(adminIdleCheck,15000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") adminIdleCheck(); });

/* ================= AUTH GATE + BOOT ================= */
let calBooted=false;
auth.onAuthStateChanged(user=>{
  const gate=document.getElementById("authGate");
  const appEl=document.getElementById("app");
  const email=(user&&user.email||"").toLowerCase();
  if(user && isAllowedEmail(email)){
    gate.style.display="none";
    appEl.style.display="";
    if(!calBooted){ calBooted=true; startCalSync(); render(); syncTimeOff(); }
  } else {
    if(user){ document.getElementById("authErr").textContent="Access denied for "+(email||"this account")+"."; auth.signOut(); }
    gate.style.display="flex";
    appEl.style.display="none";
  }
});
document.getElementById("signInBtn").addEventListener("click",()=>{
  const provider=new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({prompt:"select_account"});
  document.getElementById("authErr").textContent="";
  auth.signInWithPopup(provider).catch(e=>{ document.getElementById("authErr").textContent=e.message||"Sign-in failed."; });
});
</script>
</body>
