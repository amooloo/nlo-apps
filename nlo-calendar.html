<title>NLO Office Calendar</title>

<style>
:root{
  --navy-800:#1B2F4C; --navy-900:#11203A; --navy-700:#294169; --navy-border:#385686;
  --off-white:#F2F3F4; --white:#FFFFFF;
  --blue-600:#1D3EA9; --blue-700:#16318C; --blue-500:#2E52C9; --blue-100:#E5EAF8;
  --coral-500:#FA624D; --coral-700:#D8412E; --coral-200:#FFC8BF; --coral-100:#FFE7E1;
  --mint-500:#64F4C9; --mint-700:#1F9E7E; --mint-200:#C0FBEC; --mint-100:#E2FBF4;
  --amber-600:#E29A14; --amber-700:#C2820A; --amber-100:#FEF2D7;
  --grey-50:#F7F8F9; --grey-100:#ECEEF0; --grey-200:#DCE0E4; --grey-300:#C3C9D0;
  --grey-400:#969FAB; --grey-500:#6B7685; --grey-600:#4C5868; --grey-700:#33404F;
  --muted-on-navy:#A7B2C2;
  --font-display:'Oswald',system-ui,sans-serif;
  --font-body:'Montserrat',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
html,body{margin:0;padding:0;background:var(--off-white);}
*{box-sizing:border-box;}
body{font-family:var(--font-body);color:var(--grey-700);}
@keyframes nloFadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
input,select,textarea,button{font-family:var(--font-body);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue-500);outline-offset:1px;}
.disp{font-family:var(--font-display);text-transform:uppercase;}
.fadeup{animation:nloFadeUp .25s ease;}
.fadeup-fast{animation:nloFadeUp .2s ease;}
.hov-cell:hover{box-shadow:0 4px 14px rgba(27,47,76,.14);}
.hov-grey:hover{background:var(--grey-100);}
.hov-navy7:hover{background:var(--navy-700);}
.hov-coral7:hover{background:var(--coral-700) !important;}
.hov-blue7:hover{background:var(--blue-700) !important;}
.hov-navy9:hover{background:var(--navy-900) !important;}
.hov-coral1:hover{background:var(--coral-100);}
.hov-amber7:hover{background:var(--amber-700) !important;}
.hov-staffpill:hover{background:var(--navy-700);color:#F2F3F4 !important;}
button{cursor:pointer;}
.pill-btn{border:none;border-radius:999px;font-family:var(--font-display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;}
.task-box{border-radius:6px;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none;font-weight:700;line-height:1;cursor:pointer;}
.task-box:focus-visible,.pill-btn:focus-visible{outline:2px solid var(--blue-500);outline-offset:2px;}
:root{--violet-500:#7C5CD6;}
.av-ini::before{content:attr(data-ini);}
/* stickers: an emoji with a white die-cut edge and a soft shadow, a little tilted */
.stk{display:inline-block;line-height:1;font-style:normal;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;filter:drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff) drop-shadow(0 2px 2px rgba(17,32,58,.3));user-select:none;-webkit-user-select:none;}
.stk-sm{filter:drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff) drop-shadow(0 1px 0 #fff) drop-shadow(0 -1px 0 #fff) drop-shadow(0 1px 1px rgba(17,32,58,.3));}
.stk-btn{border:1px solid var(--grey-200);background:#fff;border-radius:10px;width:42px;height:42px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:23px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;transition:transform .12s;}
.stk-btn:hover:not([disabled]){background:var(--grey-100);transform:scale(1.1) rotate(-4deg);}
.stk-btn[disabled]{opacity:.35;cursor:default;}
@media print{
  @page{size:landscape;margin:8mm;}
  html,body{background:#fff !important;}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  header,.no-print,nlo-home,button,[role=alert],[role=status],.detail-panel{display:none !important;}
  .fadeup,.fadeup-fast{animation:none !important;}
  .month-cell{min-height:86px !important;box-shadow:none !important;break-inside:avoid;}
}
@media (max-width:700px){
  .month-cell{min-height:74px !important;}
  .detail-panel{width:100vw !important;}
}
</style>
<style id="nlo-home-room">
/* The NLO Apps button (nlo-home.js) sits in the top-left corner: keep this app's header clear of it. */
@media screen{
/* computer header: logo first; phone header: logo row first */
html.nlo-home-on #app>header:first-child>img:first-child{margin-left:calc(var(--nlo-home-space) - 22px)}
html.nlo-home-on #app>header:first-child>div:first-child{padding-left:calc(var(--nlo-home-space) - 14px)}
/* while a panel or window is open (each comes with a click-to-close shade), the button steps aside;
   the "couldn't save" / lock notes drop in at the top center, so on narrower screens it steps aside for them too */
html:has(#app>[data-act^="close-"])>:is(nlo-home,nlo-aisa){display:none!important}
@media (max-width:799px){html:has(#app>[role=alert],#app>[role=status])>nlo-home{display:none!important}}
}
</style>

/* ---------- Access control (must be mirrored in Firebase Security Rules) ---------- */
const ALLOWED_EMAILS = ["akhavan.ak@gmail.com"];
const ALLOWED_DOMAIN = "thenextlevelorthodontics.com";
function isAllowedEmail(email){
  const e = (email || "").toLowerCase();
  if (!e) return false;
  if (ALLOWED_EMAILS.indexOf(e) !== -1) return true;
  return e.endsWith("@" + ALLOWED_DOMAIN);
}

/* Time-Off Request app backend (Apps Script). Approved requests + holiday
   list sync from here — same endpoint the Checklist app uses. */
const TIMEOFF_API = "https://script.google.com/macros/s/AKfycbxvI_d6muf_OepqurNrxnV2O0bMaGjnyNH6SKKNqQcvXMzjN6ZBjc26aa5LkN3Grj2J/exec";
/* NLO Time Off (Oct 2026) replaces that app. Once its feed key is saved here (Admin settings → Time-Off sync), approved
   time off and office closures come from NLO Time Off's feed instead: a public address, but sealed (AES-GCM) so only the
   key opens it. The key is kept at nlo/cadence/timeOffFeed, where the Checklist app (CADANCe) reads it too. */
const TO_FEED_URL = "https://firestore.googleapis.com/v1/projects/nlo-cases/databases/(default)/documents/toFeed/live";
const TO_FEED_CFG = "nlo/cadence/timeOffFeed";
const SYNC_INTERVAL_MIN = 15;
const CAL_VERSION = "2.1 (Oct 31, 2026)";

/* =====================================================================
   On the NLO Cases system (2.0, 31 Oct 2026; nlo-meeting-db.js). Amir: the Office Calendar signs in like Case Tracker, with
   no Google step ("Full move", as the Staff Meeting Hub), and Dr. A plus the people he picks can edit it. Until Dr. A
   moves its data (Admin settings → Move to the NLO Cases system) everything stays as it was (the office Google account, the
   old database, the admin PIN). Once moved (calMeta/moved): each person's NLO Cases username and password; the same calls,
   on the NLO Cases records (events → calEvents, stickers → calStickers, staff / settings / admin days → calState/…); the
   editors in calState/config; Staff Hub's roster from hubRoster/live (Staff Hub keeps it there); NLO Time Off's feed key
   from Cadence's cadMirror/tofeed; Lock; NLO Cases' idle minutes; a login turned off is locked out at once.
   ===================================================================== */
const NLOC = window.NLOM ? NLOM.forApp({
  key: 'nloCal', name: 'the Office Calendar', root: CAL_ROOT, moved: 'calMeta/moved', info: 'calMeta/info', rulesMark: 'meta/rules_cal_1',
  mounts: [
    { path: CAL_ROOT + '/events', col: 'calEvents' },
    { path: CAL_ROOT + '/stickers', col: 'calStickers' },
    { path: CAL_ROOT + '/staff', doc: 'calState/staff' },
    { path: CAL_ROOT + '/settings', doc: 'calState/settings', drop: ['adminPin'] },   /* (the admin PIN stays in the old database: no PIN on the NLO Cases system) */
    { path: CAL_ROOT + '/adminDays', doc: 'calState/adminDays' },
    { path: CAL_ROOT + '/config', doc: 'calState/config' },
    /* Staff Hub's roster: copied in once by the move if Staff Hub hasn't put it there yet; Staff Hub keeps it up to date */
    { path: 'nlo/cadence/roster', doc: 'hubRoster/live', ro: true, copy: 'ifMissing' },
    /* NLO Time Off's feed key: Cadence's copy (Dr. A's Cadence screen or this page's Settings keep it); copied in once too */
    { path: 'nlo/cadence/timeOffFeed', doc: 'cadMirror/tofeed', ro: true, copy: 'ifMissing', stamp: ['up', 'upBy'] }
  ]
}) : null;
let MODE = '', MOVING = false, NCME = null;   /* NCME: the signed-in NLO Cases person { sid, role, name, email } */
const isFs = () => MODE === 'fs';
/* who may edit: Dr. A, and the staff ids in calState/config.editors */
function calEditors(){ const c=S.data&&S.data.config; return c&&Array.isArray(c.editors)?c.editors.filter(x=>typeof x==="string"):[]; }
function canEdit(){ return !!NCME&&(NCME.role==="owner"||calEditors().indexOf(NCME.sid)>=0); }
function isOwnerNc(){ return !!NCME&&NCME.role==="owner"; }

   Names only: birthdays and hire dates are kept in Firebase (Settings > Staff), never in this public file. */

/* Vacation tiers — NLO employee handbook (policy manual):
   Tier 1 after orientation (2.83 hrs/mo, cap 34), Tier 2 after 2 full years
   (5.67 hrs/mo, cap 68), Tier 3 after 5 full years (8.5 hrs/mo, cap 102). */
function tierFor(years){
  if(years>=5) return {n:3,rate:8.5,cap:102};
  if(years>=2) return {n:2,rate:5.67,cap:68};
  return {n:1,rate:2.83,cap:34};
}
function fullYearsSince(dateStr,asOf){
  const h=parseD(dateStr), a=parseD(asOf);
  let y=a.getFullYear()-h.getFullYear();
  const anniv=new Date(a.getFullYear(),h.getMonth(),h.getDate());
  if(a<anniv) y--;
  return Math.max(0,y);
}
/* "Kaylee (OA)" → "Kaylee"; a "Dr." title keeps the surname ("Dr. Akhavan's birthday", not "Dr.'s") */
function firstName(n){ const s=String(n||"").split(" (")[0].trim(); return /^dr\.?\s/i.test(s)?s:s.split(" ")[0]; }

/* ================= DATE HELPERS ================= */
function fmt(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseD(s){ const p=s.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
function addDays(s,n){ const d=parseD(s); d.setDate(d.getDate()+n); return fmt(d); }
function todayStr(){ return fmt(new Date()); }
function weekStart(s){ const d=parseD(s); const off=d.getDay(); return addDays(s,-off); } // weeks start Sunday
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const SMON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function isClosedDay(s){ const g=parseD(s).getDay(); return g===5||g===6||g===0; }
function prettyDate(s){ const d=parseD(s); return SMON[d.getMonth()]+" "+d.getDate(); }
function prettyRange(a,b){
  if(!b||b===a) return prettyDate(a);
  const da=parseD(a),db=parseD(b);
  if(da.getMonth()===db.getMonth()&&da.getFullYear()===db.getFullYear()) return SMON[da.getMonth()]+" "+da.getDate()+"–"+db.getDate();
  return prettyDate(a)+" – "+prettyDate(b);
}
function fmtTime(t){
  if(!t) return "";
  const p=t.split(":").map(Number);
  const h12=((p[0]+11)%12)+1, ampm=p[0]>=12?"PM":"AM";
  return h12+(p[1]?":"+String(p[1]).padStart(2,"0"):"")+" "+ampm;
}
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ================= FIXED HOLIDAYS (fallback — mirrors backend/handbook) ================= */
function nthWeekday(y,m,wd,n){ const first=new Date(y,m,1); const off=(wd-first.getDay()+7)%7; return new Date(y,m,1+off+(n-1)*7); }
function lastWeekday(y,m,wd){ const last=new Date(y,m+1,0); const off=(last.getDay()-wd+7)%7; return new Date(y,m,last.getDate()-off); }
function fixedHolidaysForYear(y){
  const out={};
  out[fmt(new Date(y,0,1))]="New Year's Day";
  out[fmt(lastWeekday(y,4,1))]="Memorial Day";
  out[fmt(new Date(y,6,4))]="Independence Day";
  out[fmt(nthWeekday(y,8,1,1))]="Labor Day";
  const thx=nthWeekday(y,10,4,4);
  const before=new Date(thx); before.setDate(thx.getDate()-1);
  const after=new Date(thx); after.setDate(thx.getDate()+1);
  out[fmt(before)]="Day Before Thanksgiving";
  out[fmt(thx)]="Thanksgiving Day";
  out[fmt(after)]="Day After Thanksgiving";
  out[fmt(new Date(y,11,25))]="Christmas Day";
  return out;
}
let holMemo=null, holMemoSrc=null, holMemoKey="";
function holidayMap(){
  /* asked for many times per screen (every day, every repeating task): rebuilt only when its sources change */
  const cl0=(S.data&&S.data.settings&&S.data.settings.closures)||{}, k0=JSON.stringify(cl0)+"|"+new Date().getFullYear();
  if(holMemo&&holMemoSrc===S.sync.holidays&&holMemoKey===k0) return holMemo;
  holMemoSrc=S.sync.holidays; holMemoKey=k0;
  return (holMemo=holidayMapBuild());
}
function holidayMapBuild(){
  const map={};
  if(S.sync.holidays && S.sync.holidays.length){
    S.sync.holidays.forEach(h=>{ if(h&&h.date) map[String(h.date).slice(0,10)]={label:h.label||"Day Off",source:h.source||"custom"}; });
  } else {
    const y=new Date().getFullYear();
    [y-1,y,y+1].forEach(yy=>{ const f=fixedHolidaysForYear(yy); Object.keys(f).forEach(k=>{ map[k]={label:f[k],source:"fixed"}; }); });
  }
  /* office-specific closures managed in Settings (e.g. First Day of School, Winter Holidays) */
  const cl=(S.data&&S.data.settings&&S.data.settings.closures)||{};
  Object.keys(cl).forEach(d=>{ map[d]={label:cl[d]||"Office closed",source:"office"}; });
  return map;
}

/* ================= TIME-OFF SYNC ================= */
/* S.sync.at = when the Time-Off app last answered (null until it first does); S.sync.err = the last try failed.
   A failed try keeps the last good list, says so in the Who's-out bar, and tries again 2 minutes later. */
let syncRetry=null;
/* NLO Time Off's feed, opened with its key: { v, ok, timeOff:[{id, employeeName, start, end, hours, part}], holidays, pending } */
const b64bytes=x=>Uint8Array.from(atob(String(x)),c=>c.charCodeAt(0));
async function readTimeOffFeed(key,opts){
  const res=await fetch(TO_FEED_URL,Object.assign({},opts||{},{cache:"no-store"}));
  if(res.status===404) throw new Error("NLO Time Off hasn't written its feed yet");
  if(!res.ok) throw new Error("NLO Time Off's feed: HTTP "+res.status);
  const d=await res.json(), f=(d&&d.fields)||{}, iv=f.iv&&f.iv.stringValue, ct=f.ct&&f.ct.stringValue;
  if(!iv||!ct) throw new Error("NLO Time Off's feed is empty");
  let pt;
  try{
    const k=await crypto.subtle.importKey("raw",b64bytes(key),{name:"AES-GCM"},false,["decrypt"]);
    pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64bytes(iv),additionalData:new TextEncoder().encode("tofeed")},k,b64bytes(ct));
  }catch(e){ throw new Error("the saved key doesn't open NLO Time Off's feed (was a new key made there?)"); }
  const j=JSON.parse(new TextDecoder().decode(pt));
  if(!j||!Array.isArray(j.timeOff)) throw new Error("NLO Time Off's feed isn't in the expected shape");
  return j;
}
/* the saved key: "" when none (then the old Time-Off app). A failed read keeps the last key seen, so a blip doesn't
   send the calendar back to the old app. */
async function timeOffFeedKey(){
  try{ const s=await db.ref(TO_FEED_CFG).once("value"); const v=s.val(); S.toFeed.key=v&&typeof v.key==="string"?v.key:""; }catch(e){}
  return S.toFeed.key;
}
async function syncTimeOff(){
  if(S.sync.busy) return;
  S.sync.busy=true;
  if(S.sync.err) bgRender();
  const ctl=typeof AbortController==="function"?new AbortController():null;
  const timer=ctl?setTimeout(()=>ctl.abort(),30000):null;
  try{
    const opts={method:"GET",redirect:"follow"};
    if(ctl) opts.signal=ctl.signal;
    const key=await timeOffFeedKey();
    let j;
    if(key){ j=await readTimeOffFeed(key,opts); }
    else if(isFs()){ throw new Error("NLO Time Off's key isn't saved yet (Admin settings → Time-Off app sync)"); }
    else {
      const sep=TIMEOFF_API.includes("?")?"&":"?";
      const res=await fetch(TIMEOFF_API+sep+"action=getchecklistsync",opts);
      if(!res.ok) throw new Error("HTTP "+res.status);
      j=await res.json();
    }
    if(j.ok===false) throw new Error(j.error||"Sync error");
    S.sync={ timeOff:(j.timeOff||[]), holidays:(j.holidays||[]), at:new Date(), err:null, busy:false, src:key?"timeoff":"old" };
  }catch(e){
    S.sync.err=(e&&e.name==="AbortError")?"no answer after 30 seconds":((e&&e.message)||String(e));
    S.sync.busy=false;
    if(!syncRetry) syncRetry=setTimeout(()=>{ syncRetry=null; syncTimeOff(); },2*60*1000);
  }
  if(timer) clearTimeout(timer);
  bgRender();
}
setInterval(syncTimeOff, SYNC_INTERVAL_MIN*60*1000);
/* back on the tab (phones pause timers in the background): refresh if the last answer is over 5 minutes old */
document.addEventListener("visibilitychange",()=>{

/* "ok" · "loading" (no answer yet) · "failed" (never answered) · "stale" (answered before, last try failed) */

/* ================= SHARED STAFF ROSTER (Staff Hub) =================
   Read-only view of nlo/cadence/roster/people (only Staff Hub writes it). Each calendar staff
   record is matched to a roster person by id, else full name, else first name / nick against the
   "First (Role)" label. People the roster marks as left drop out of birthdays, anniversaries and
   the PTO staff picker (Settings still lists them, marked "Left"). Active roster people missing
   from the calendar list are added at render time only, never written to nlo/calendar/staff.
   No roster (missing, empty or unreadable) = the calendar's own list, exactly as before. */
const ROSTER_PEOPLE = "nlo/cadence/roster/people";
let calRoster = null;
/* staff dates Staff Hub shares for this calendar (see STAFF HUB DATES) and when it last shared the roster */
const ROSTER_DATES = "nlo/cadence/roster/dates";
const ROSTER_AT = "nlo/cadence/roster/updatedAt";
let calDates = null, calRosterAt = null;
function nloRosterToday(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function nloRosterActive(p){return !!p && p.active!==false && !(p.end && p.end<=nloRosterToday());}
const ROSTER_ROLE_SHORT = { "orthodontic assistant":"OA", "treatment coordinator":"TC", "appointment coordinator":"AC", "marketing coordinator":"Marketing", "clinical lead":"Clinical Lead",
  "scheduling coordinator":"SC", "office coordinator":"OC", "office manager":"OM", "financial coordinator":"FC", "front desk / scheduling":"Front Desk",
  "clinical & marketing coordinator":"Marketing", "clinical and marketing coordinator":"Marketing", "lab technician":"Lab" };
function rosterLabel(p){
  const nm=String(p.nick||p.first||p.name||"").trim(), t=String(p.title||"").trim().toLowerCase();
  const r=Object.prototype.hasOwnProperty.call(ROSTER_ROLE_SHORT,t)?ROSTER_ROLE_SHORT[t]:"";
  return r?nm+" ("+r+")":nm;
}
function nloRosterPhoto(p){return p&&typeof p.photo==="string"&&p.photo.indexOf("data:image/jpeg;base64,")===0&&p.photo.length<30000?p.photo:null;}
function calAvatar(st,sz){
  const nm=String(st&&st.name||"?").replace(/\s*\(.*$/,"").trim(), ini=(nm.split(/\s+/).map(w=>w[0]||"").slice(0,2).join("")||"?").toUpperCase();
  const g=st&&st.left?"filter:grayscale(1);":"";
  return `<span aria-hidden="true" style="width:${sz}px;height:${sz}px;border-radius:50%;background:#294169;color:#fff;font-size:${Math.round(sz*.38)}px;font-weight:700;line-height:1;display:inline-flex;align-items:center;justify-content:center;flex:none;overflow:hidden;${g}">${st&&st.photo?`<img src="${st.photo}" alt="" style="width:100%;height:100%;object-fit:cover;display:block;">`:`<span class="av-ini" data-ini="${esc(ini)}"></span>`}</span>`;
}
/* The calendar's staff list, following Staff Hub: anyone matched to a roster person shows Staff Hub's name
   ("goes by" + role) and photo, and is marked left once Staff Hub ends them. Birthdays (and hire dates when
   Staff Hub has none) stay the calendar's own. Memoised until the calendar's list, the roster or the dates change. */
let calStaffMemo=null, calStaffKey=[null,null,null];
function calStaff(){
  const raw=(S.data&&S.data.staff)||{}, ppl=calRoster;
  if(calStaffMemo&&calStaffKey[0]===raw&&calStaffKey[1]===ppl&&calStaffKey[2]===calDates) return calStaffMemo;
  const ids=ppl?Object.keys(ppl).filter(k=>ppl[k]&&typeof ppl[k]==="object"):[];
  let out=raw;
  if(ids.length){
    const norm=x=>String(x==null?"":x).trim().toLowerCase();
    const only=test=>{ const c=ids.filter(test); return c.length===1?c[0]:null; };
    const hubStart=pid=>{ const d=calDates&&calDates[pid]; return d&&typeof d.start==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(d.start)?d.start:null; };
    const claimed={};
    out={};
    Object.keys(raw).forEach(id=>{
      const st=raw[id];
      if(!st||typeof st!=="object"){ out[id]=st; return; }
      const full=norm(st.name), label=norm(String(st.name==null?"":st.name).split(" (")[0]);
      let pid=ids.indexOf(id)>=0?id:null;
      if(!pid&&full) pid=only(k=>{ const n=norm(ppl[k].name); return !!n&&(n===full||n===label); });
      if(!pid&&label) pid=only(k=>norm(ppl[k].nick)===label||norm(ppl[k].first)===label);
      if(!pid){ out[id]=st; return; }
      claimed[pid]=true;
      const p=ppl[pid], ph=nloRosterPhoto(p);
      const o=Object.assign({},st,{ name:rosterLabel(p)||st.name, savedName:st.name, rid:pid });
      if(ph) o.photo=ph; else delete o.photo;
      /* Staff Hub's start date wins; the calendar's own hire date only counts for someone Staff Hub has none for */
      if(hubStart(pid)){ o.hireDate=hubStart(pid); o.hireFromHub=true; }
      if(!nloRosterActive(p)){ o.active=false; o.left=true; }
      out[id]=o;
    });
    ids.forEach(pid=>{
      if(claimed[pid]||raw[pid]||!/^[\w-]+$/.test(pid)||!nloRosterActive(ppl[pid])) return;
      const p=ppl[pid], o={ name:rosterLabel(p)||pid, active:true, roster:true, rid:pid };
      if(nloRosterPhoto(p)) o.photo=nloRosterPhoto(p);
      if(hubStart(pid)){ o.hireDate=hubStart(pid); o.hireFromHub=true; }
      out[pid]=o;
    });
  }
  calStaffMemo=out; calStaffKey=[raw,ppl,calDates];
  return out;
}
/* the person (name, photo, left) for a roster id: their calendar record if they have one, else the roster entry */
function personByRid(rid){
  const staffL=calStaff();
  for(const k in staffL){ if(staffL[k]&&staffL[k].rid===rid) return staffL[k]; }
  const p=calRoster&&calRoster[rid];
  return p?{ name:rosterLabel(p)||p.name||"", photo:nloRosterPhoto(p), left:!nloRosterActive(p), rid:rid }:null;
}
/* the person behind a Time-Off app name. That app can hold legal names ("Maria Jordan" for Wila), so match the
   roster on full name, then first + last, then a last name only one person has, then a lone first name;
   else the calendar's own list by name. No match = the Time-Off name as it is, without a face. */
let ptoWhoMemo={}, ptoWhoKey=null;
function ptoPerson(name){
  const staffL=calStaff();
  if(ptoWhoKey!==staffL){ ptoWhoMemo={}; ptoWhoKey=staffL; }
  const key=String(name==null?"":name);
  if(Object.prototype.hasOwnProperty.call(ptoWhoMemo,key)) return ptoWhoMemo[key];
  const norm=x=>String(x==null?"":x).toLowerCase().replace(/\s*\(.*$/,"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();
  const n=norm(key), w=n?n.split(" "):[], first=w[0]||"", last=w.length>1?w[w.length-1]:"";
  let res=null;
  if(n){
    const ppl=calRoster||{}, ids=Object.keys(ppl).filter(k=>ppl[k]&&typeof ppl[k]==="object");
    const one=f=>{ const c=ids.filter(f); return c.length===1?c[0]:null; };
    const rid=one(k=>norm(ppl[k].name)===n)
      ||(last?one(k=>norm(ppl[k].first)===first&&norm(ppl[k].last)===last):null)
      ||(last?one(k=>norm(ppl[k].last)===last):null)
      ||(!last?one(k=>norm(ppl[k].first)===first||norm(ppl[k].nick)===first):null);
    if(rid) res=personByRid(rid);
    else {
      const c=Object.keys(staffL).filter(k=>{ const st=staffL[k]; if(!st||typeof st!=="object") return false; const m=norm(st.name); return m===n||(!last&&m.split(" ")[0]===first); });
      if(c.length===1) res=staffL[c[0]];
    }
  }
  ptoWhoMemo[key]=res;
  return res;
}
/* the face for an entry: PTO, birthdays, anniversaries and Staff Hub dates belong to a person */
function entryPerson(e){
  if(!e) return null;
  if(e.who) return e.who;
  if(e.type==="hr") return personByRid(e.staffId);
  if(e.staffId&&(e.type==="pto"||e.type==="bday"||e.type==="anniv")){ const st=calStaff()[e.staffId]; return st&&typeof st==="object"?st:{ name:e.staffName||"" }; }
  return null;
}
function whoFace(e,sz){ const p=entryPerson(e); return p?calAvatar(p,sz):""; }

/* ================= ENTRY QUERIES ================= */
/* A repeating task by the month or year (month-end numbers, a license renewal) that falls on a day the office is closed
   is due the last open day before it instead, so it never sits on a Friday, weekend or holiday. Weekly and every-2-weeks
   tasks keep their weekday (payroll is run on Fridays on purpose). */
const SHIFT_REC={monthly:1,quarterly:1,yearly:1,biennial:1,triennial:1};
function occursOn(e,ds){
  if(e&&e.type==="task"&&e.recurrence&&SHIFT_REC[e.recurrence]){
    if(officeClosed(ds)) return false;
    if(rawOccursOn(e,ds)) return true;
    for(let k=1,d=addDays(ds,1);k<=7&&officeClosed(d);k++,d=addDays(d,1)){ if(rawOccursOn(e,d)) return true; }
    return false;
  }
  return rawOccursOn(e,ds);
}
function rawOccursOn(e,ds){
  if(e.recurrence){
    if(ds<e.startDate) return false;
    if(e.until&&ds>e.until) return false;   /* "Repeat until" ends the series */
    const d=parseD(ds), b=parseD(e.startDate);
    if(e.recurrence==="weekly") return d.getDay()===b.getDay();
    if(e.recurrence==="biweekly"){ const days=Math.round((d-b)/86400000); return d.getDay()===b.getDay() && days%14===0; }
    /* monthly / quarterly / yearly: same date; one set on the 29th-31st lands on the last day of shorter months */
    const lastDay=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    if(d.getDate()!==Math.min(b.getDate(),lastDay)) return false;
    if(e.recurrence==="monthly") return true;
    const mdiff=(d.getFullYear()-b.getFullYear())*12+(d.getMonth()-b.getMonth());
    if(e.recurrence==="quarterly") return mdiff%3===0;
    if(e.recurrence==="yearly") return d.getMonth()===b.getMonth();
    if(e.recurrence==="biennial"||e.recurrence==="triennial") return d.getMonth()===b.getMonth()&&(d.getFullYear()-b.getFullYear())%(e.recurrence==="biennial"?2:3)===0;
    return false;
  }
  const end=e.endDate||e.startDate;
  return ds>=e.startDate && ds<=end;
}

function entriesFor(ds,ignoreFilters){
  const data=S.data; if(!data) return [];
  const out=[];
  /* holiday (from Time-Off backend / handbook) */
  const hol=holidayMap()[ds];
  if(hol) out.push({ id:"hol_"+ds, type:"holiday", title:hol.label, startDate:ds, endDate:ds, time:null,
                     notes: hol.source==="fixed" ? "Office closed — paid holiday (policy manual)" : "Office closed",
                     recurrence:null, synced:true });
  /* birthdays + work anniversaries (derived from the staff list — nothing stored) */
  const staffL=calStaff();
  Object.keys(staffL).forEach(sid=>{
    const st=staffL[sid];
    if(!st||!st.active) return;
    const mmdd=ds.slice(5), yr=parseD(ds).getFullYear();
    if(st.birthday && st.birthday.slice(5)===mmdd && yr>parseD(st.birthday).getFullYear()){
      out.push({ id:"bd_"+sid+"_"+yr, type:"bday", title:firstName(st.name)+"'s birthday", staffId:sid, staffName:st.name,
                 startDate:ds, endDate:ds, time:null, notes:"", recurrence:null, synced:true });
    }
    if(st.hireDate && st.hireDate.slice(5)===mmdd){
      const n=yr-parseD(st.hireDate).getFullYear();
      if(n>=1){
        const t=tierFor(n);
        let title=firstName(st.name)+" — "+n+" year"+(n>1?"s":"");
        let notes="Vacation Tier "+t.n+" ("+t.rate+" hrs/mo, cap "+t.cap+" hrs/yr)";
        if(n===2) notes="Moves up to Tier 2 today — 5.67 hrs/mo, cap 68 hrs/yr 🎊";
        if(n===5) notes="Moves up to Tier 3 today — 8.5 hrs/mo, cap 102 hrs/yr 🎊";
        out.push({ id:"an_"+sid+"_"+yr, type:"anniv", title:title, staffId:sid, staffName:st.name,
                   startDate:ds, endDate:ds, time:null, notes:notes, recurrence:null, synced:true });
      }
    }
  });
  /* dates shared from Staff Hub */
  if(ignoreFilters||S.filters.hr!==false) hrEntriesFor(ds).forEach(e=>out.push(e));
  /* manual calendar entries */
  Object.keys(data.events).forEach(id=>{
    const e=data.events[id];
    if(!ignoreFilters && S.filters[e.type]===false) return;
    if(e.type==="pto" && officeClosed(ds)) return; // office is closed — PTO doesn't apply
    if(occursOn(e,ds)){
      const o=Object.assign({id},e);
      /* PTO shows the person's current (Staff Hub) name; the name saved with the entry only if they're no longer listed */
      if(o.type==="pto"&&o.staffId&&staffL[o.staffId]&&staffL[o.staffId].name) o.staffName=staffL[o.staffId].name;
      out.push(o);
    }
  });
  /* approved time off synced from NLO Time Off (or the old Time-Off app): who is out, and the part of the day
     for a half day. The kind of time off and paid/unpaid are never brought into the calendar. */
  if((ignoreFilters || S.filters.pto) && !officeClosed(ds)){
      S.sync.timeOff.forEach((r,i)=>{
        const start=String(r.start||"").slice(0,10), end=String(r.end||r.start||"").slice(0,10);
        if(!start) return;
        if(ds>=start && ds<=(end||start)){
          const who=ptoPerson(r.employeeName);   /* the Staff Hub person behind the Time-Off app's name, if any */
          out.push({ id:"to_"+(r.id||i), type:"pto", title:"Out",
                     staffId:null, staffName:who?who.name:(r.employeeName||OUT_NOBODY), who:who,
                     startDate:start, endDate:end||start, time:null, part:outPartOf(r),
                     notes:"", recurrence:null, synced:true });
        }
    });
  }
  /* a manual "Out" entry for someone NLO Time Off already shows out that day is skipped (Oct 31, 2026): the synced one wins */
  const outKey=x=>String(x==null?"":x).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();
  const syncedOut=out.filter(e=>e.type==="pto"&&e.synced);
  if(syncedOut.length){
    const names={}, ppl=[];
    syncedOut.forEach(e=>{ const k=outKey(e.staffName); if(k) names[k]=1; if(e.who) ppl.push(e.who); });
    for(let i=out.length-1;i>=0;i--){
      const e=out[i];
      if(e.type!=="pto"||e.synced) continue;
      const st=e.staffId?staffL[e.staffId]:null;
      if((st&&ppl.indexOf(st)!==-1)||names[outKey(e.staffName)]) out.splice(i,1);
    }
  }
  const order={holiday:0,pto:1,bday:2,anniv:3,hr:3.5,event:4,task:5};
  /* same kind and time: by what's shown, so the people out are in name order */
  out.sort((a,b)=>(order[a.type]-order[b.type])||String(a.time||"").localeCompare(String(b.time||""))||String(entryLabel(a)).localeCompare(String(entryLabel(b))));
  return out;
}

function typeColors(t){
  if(t==="pto")     return {bg:"#FFE7E1",fg:"#C13A28",edge:"#FA624D",glyph:"●",label:"Out"};
  if(t==="bday")    return {bg:"#E2FBF4",fg:"#137a61",edge:"#64F4C9",glyph:"🎂",label:"Birthday"};
  if(t==="anniv")   return {bg:"#E5EAF8",fg:"#16318C",edge:"#2E52C9",glyph:"🎉",label:"Anniversary"};
  if(t==="task")    return {bg:"#FEF2D7",fg:"#996709",edge:"#E29A14",glyph:"▲",label:"Task"};
  if(t==="holiday") return {bg:"#1B2F4C",fg:"#FFFFFF",edge:"#1B2F4C",glyph:"★",label:"Holiday"};
  if(t==="hr")      return {bg:"#F0EAFB",fg:"#5B3A9E",edge:"#7C5CD6",glyph:"◆",label:"Staff Hub"};
  return {bg:"#E5EAF8",fg:"#16318C",edge:"#1D3EA9",glyph:"■",label:"Event"};
}
/* ================= WHO'S OUT =================
   Time off shows only that someone is out: their name, the dates, and "Morning" / "Afternoon" for a half day (or the
   times, "2–3:30 PM", for part of a day asked for as specific times in NLO Time Off).
   Never the kind of time off (vacation, sick, personal…), paid or unpaid, or a label typed for it, whether it
   comes from NLO Time Off, the old Time-Off app or an entry made here. Entries keep the internal type "pto",
   so saved entries and the Staff Meeting Hub (which skips that type) carry on unchanged. */
const OUT_NOBODY="Staff member";
function outPartOf(r){
  const p=String((r&&r.part)||"").toLowerCase(), h=String(r&&r.hours!=null?r.hours:"").trim();
  if(p==="am") return "Morning";
  if(p==="pm") return "Afternoon";
  if(p==="full") return "";
  /* NLO Time Off: specific times (Oct 14, 2026) → "2–3:30 PM"; its earlier 2-, 4- and 6-hour requests → "2 hrs" */
  if(p==="time") return outTimes(r.from,r.to)||"Part of the day";
  if(/^h[246]$/.test(p)) return p.slice(1)+" hrs";
  if(/morning|\(am\)/i.test(h)) return "Morning";
  if(/afternoon|\(pm\)/i.test(h)) return "Afternoon";
  /* the old Time-Off app can send hours: a part of one day shows as hours, a full day (8.5) as nothing */
  const n=Number(h), one=String((r&&r.start)||"").slice(0,10)===String((r&&(r.end||r.start))||"").slice(0,10);
  if(/^\d+(\.\d+)?$/.test(h)&&n>0&&n<8.5&&one) return n+" hrs";
  return "";
}
/* "14:00", "15:30" → "2–3:30 PM"; "11:30", "13:00" → "11:30 AM–1 PM" ("" unless both are times of day, the first earlier) */
function outTimes(a,b){
  const ok=s=>typeof s==="string"&&/^([01]\d|2[0-3]):[0-5]\d$/.test(s), min=s=>Number(s.slice(0,2))*60+Number(s.slice(3,5));
  if(!ok(a)||!ok(b)||min(b)<=min(a)) return "";
  const c=s=>{ const m=min(s),h=Math.floor(m/60),mm=m%60; return (h%12||12)+(mm?":"+String(mm).padStart(2,"0"):"")+" "+(h<12?"AM":"PM"); };
  const x=c(a), y=c(b); return (x.slice(-2)===y.slice(-2)?x.slice(0,-3):x)+"–"+y;
}
function entryLabel(e){ return e.type==="pto"?(e.staffName||OUT_NOBODY):e.title; }
const HR_LABEL={review:"Review",cert:"Cert",start:"First day",last:"Last day"};
function entryTypeLabel(e){ const ct=catOf(e); if(ct) return ct.glyph+" "+ct.label; return e.type==="pto"?"Out":(e.type==="hr"?(HR_LABEL[e.kind]||"Staff Hub"):typeColors(e.type).label); }
function entrySub(e){
  if(e.type==="pto") return "Out "+prettyRange(e.startDate,e.endDate)+(e.part?" · "+e.part:"");
  if(e.type==="hr") return e.hrSub+" · from Staff Hub";
  if(e.type==="holiday") return "Office closed";
  if(e.type==="bday") return "Happy birthday! 🎂🎈";
  if(e.type==="anniv") return "Work anniversary";
  const parts=[e.time?fmtTime(e.time):"All day"];
  if(e.recurrence){
    let r="repeats "+(REC_LABEL[e.recurrence]||e.recurrence);
    if(e.until){ const u=parseD(e.until); r+=" until "+prettyDate(e.until)+(u.getFullYear()!==new Date().getFullYear()?", "+u.getFullYear():""); }
    parts.push(r);
  }
  if(e.type==="task"&&leadOf(e)) parts.push(leadOf(e)+" day"+(leadOf(e)===1?"":"s")+" heads-up");
  return parts.join(" · ");
}
function isBlackout(ds){ const s=S.data&&S.data.settings; return !!(s&&s.blackoutDates&&s.blackoutDates[ds]); }
/* office is closed Fri/Sat/Sun and on holidays — PTO is meaningless on those days */
function officeClosed(ds){ return isClosedDay(ds) || !!holidayMap()[ds]; }
function nextOpenDay(ds){ let d=ds,i=0; while(officeClosed(d)&&i<14){ d=addDays(d,1); i++; } return d; }
function adminDayOf(ds){ return (S.data&&S.data.adminDays&&S.data.adminDays[ds])||null; } // 'admin' | 'meeting' | null
/* Tasks can be checked off by anyone (no admin PIN). A one-off task keeps done/doneAt;
   a repeating task keeps doneDates/<YYYY-MM-DD> for each date it was done. */
function isDone(e,ds){ return !!e&&e.type==="task"&&(e.recurrence?!!(e.doneDates&&e.doneDates[ds]):!!e.done); }
function toggleDone(id,ds){
  const e=S.data&&S.data.events&&S.data.events[id];
  if(!e||e.type!=="task"||!/^\d{4}-\d{2}-\d{2}$/.test(ds||"")) return;

    else fbSet("events/"+id+"/doneDates/"+ds,Date.now());
  } else {
    db.ref(CAL_ROOT+"/events/"+id).update(e.done?{done:null,doneAt:null}:{done:true,doneAt:Date.now()}).catch(fbErr);
  }
}
function taskBox(e,ds,sz){

  return `<button data-act="task-done" data-id="${esc(e.id)}" data-date="${ds}" class="task-box" aria-pressed="${done}" aria-label="${done?"Mark not done":"Mark done"}" title="${done?"Done · click to undo":"Mark done"}" style="width:${s}px;height:${s}px;border:2px solid ${c.edge};background:${done?c.edge:"#FFFFFF"};color:#FFFFFF;font-size:${Math.round(s*.6)}px;">${done?"✓":""}</button>`;
}

function fmtStamp(ms){ const d=new Date(ms); return isNaN(d)?"":SMON[d.getMonth()]+" "+d.getDate()+", "+d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}); }

/* ================= STICKERS =================
   Decorations for occasions. Put on a day in admin mode (day panel → + Sticker); everyone sees them.
   nlo/calendar/stickers/<id> = { date:"YYYY-MM-DD", emoji, label?, yearly?, at }. A yearly sticker shows on the same
   month and day every year from its first date on. A day holds up to STICKER_MAX. Everything read back is escaped. */
const STICKER_MAX=6;
const STK_TILT=[-8,6,-3,9,-6,4];
const STICKER_SETS=[
  ["Holidays",[["🎊","New Year"],["💝","Valentine's Day"],["☘️","St. Patrick's Day"],["🐣","Easter"],["🗽","Fourth of July"],["🎆","Fireworks"],["🎃","Halloween"],["👻","Spooky"],["🦃","Thanksgiving"],["🎄","Christmas"],["🕎","Hanukkah"],["🎅","Santa"]]],
  ["Celebrate",[["🎉","Celebration"],["🎂","Birthday"],["🎈","Balloons"],["🥳","Party"],["🎁","Gift"],["🏆","Win"],["⭐","Star"],["🥂","Cheers"],["💐","Flowers"],["💍","Wedding"],["👶","Baby"],["🎓","Graduation"]]],
  ["Office",[["🍕","Pizza"],["🍩","Donuts"],["🌮","Tacos"],["🧁","Cupcakes"],["☕","Coffee"],["🍦","Ice cream"],["🍿","Popcorn"],["🥗","Lunch"],["👕","Team shirt day"],["📸","Photo day"],["🦷","Tooth"],["😁","Big smile"]]],
  ["Seasons & fun",[["🌸","Spring"],["🌻","Sunflower"],["☀️","Summer"],["🏖️","Beach"],["🍂","Fall"],["❄️","Winter"],["⛄","Snowman"],["🌈","Rainbow"],["💖","Love"],["💪","Strong"],["😎","Cool"],["🏈","Football"]]]
];
function stickerName(e){ for(const [,items] of STICKER_SETS){ for(const [x,n] of items){ if(x===e) return n; } } return "Sticker"; }
function stickersFor(ds){
  const all=(S.data&&S.data.stickers)||{}, out=[];
  Object.keys(all).forEach(id=>{
    const s=all[id];
    if(!s||typeof s!=="object"||typeof s.emoji!=="string"||!s.emoji||s.emoji.length>16||typeof s.date!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(s.date)) return;
    if(s.date===ds||(s.yearly&&ds>s.date&&s.date.slice(5)===ds.slice(5)))
      out.push({ id:id, emoji:s.emoji, label:typeof s.label==="string"?s.label.slice(0,40):"", yearly:!!s.yearly, date:s.date, at:+s.at||0 });
  });
  out.sort((a,b)=>(a.at-b.at)||String(a.id).localeCompare(String(b.id)));
  return out;
}
/* stickers side by side, overlapping a little like real ones; "+N" when more are on the day than fit */
function stickerCluster(list,max,size,more){
  let h=list.slice(0,max).map((s,i)=>`<span class="stk${size<20?" stk-sm":""}" role="img" aria-label="${esc(s.label||stickerName(s.emoji))}"${s.label?` title="${esc(s.label)}"`:""} style="font-size:${size}px;transform:rotate(${STK_TILT[i%STK_TILT.length]}deg);${i?"margin-left:-"+Math.round(size*.22)+"px;":""}">${esc(s.emoji)}</span>`).join("");
  if(more&&list.length>max) h+=`<span style="font-size:11px;font-weight:700;color:var(--grey-500);margin-left:3px;align-self:center;">+${list.length-max}</span>`;
  return h;
}
/* the labelled stickers of a day as a line ("🍕 Pizza lunch"), for the agenda and the phone's week list */
function stickerLabelLine(list,fs,mb){
  const l=list.filter(s=>s.label);
  return l.length?`<div style="font-size:${fs}px;font-weight:600;color:var(--grey-600);display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin-bottom:${mb||0}px;">${l.map(s=>`<span style="display:inline-flex;align-items:center;gap:6px;">${stickerCluster([s],1,16)}${esc(s.label)}</span>`).join("")}</div>`:"";
}
/* stickers that fit what's on a date: its holiday, birthdays, anniversaries */
function stickerSuggest(ds){
  const out=[], md=ds.slice(5);
  const fixed={"01-01":"🎊","02-14":"💝","03-17":"☘️","07-04":"🎆","10-31":"🎃","12-24":"🎄","12-25":"🎄","12-31":"🥂"};
  if(fixed[md]) out.push(fixed[md]);
  const hol=holidayMap()[ds], l=String((hol&&hol.label)||"").toLowerCase();
  if(/thanksgiving/.test(l)) out.push("🦃");
  else if(/christmas|winter/.test(l)) out.push("🎄");
  else if(/independence/.test(l)) out.push("🎆");
  else if(/memorial|labor|veteran/.test(l)) out.push("🗽");
  else if(/new year/.test(l)) out.push("🎊");
  else if(/easter/.test(l)) out.push("🐣");
  entriesFor(ds,true).forEach(e=>{ if(e.type==="bday") out.push("🎂","🎈"); else if(e.type==="anniv") out.push("🎉"); });
  return out.filter((x,i,a)=>a.indexOf(x)===i).slice(0,6);
}
/* the first emoji someone typed or pasted ("" if it isn't one) */
function oneEmoji(v){
  const s=String(v==null?"":v).trim();
  if(!s||s.length>32) return "";
  let g=s;
  try{ if(typeof Intl!=="undefined"&&Intl.Segmenter){ const it=new Intl.Segmenter(undefined,{granularity:"grapheme"}).segment(s)[Symbol.iterator]().next(); if(it&&it.value) g=it.value.segment; } }catch(_){}
  if(g.length>16||/[<>&"'`\\]/.test(g)) return "";
  try{ return /\p{Extended_Pictographic}|\p{Regional_Indicator}/u.test(g)?g:""; }catch(_){ return ""; }
}
function placeSticker(ds,emoji){
  if(!S.admin||!/^\d{4}-\d{2}-\d{2}$/.test(ds||"")||!emoji) return;

  if(yrEl&&yrEl.checked) rec.yearly=true;
  fbSet("stickers/k"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),rec);

  render();
}
function removeSticker(id){

      ${S.admin?`<button data-act="stk-del" data-id="${esc(s.id)}" aria-label="Remove sticker" title="Remove sticker" style="position:absolute;top:-4px;right:-10px;border:none;background:var(--grey-200);color:var(--navy-800);border-radius:999px;width:20px;height:20px;padding:0;font-size:10px;line-height:1;">✕</button>`:""}

        <button data-act="stk-close" aria-label="Close the stickers" style="border:none;background:var(--grey-200);color:var(--navy-800);border-radius:999px;width:28px;height:28px;padding:0;font-size:12px;">✕</button>

        <button data-act="stk-own" data-date="${dd}" class="hov-navy9"${full?" disabled":""} style="border:none;background:var(--navy-800);border-radius:10px;padding:9px 16px;font-weight:700;font-size:13px;color:#fff;">Add</button>

/* ================= MUTATIONS ================= */
function blankForm(ds){
  const d=ds||todayStr();
  return {id:null,type:"event",title:"",staffId:"",startDate:d,endDate:d,allDay:true,time:"09:00",notes:"",recurrence:"",until:"",cat:"",lead:""};
}
function readFormDom(){
  const f=S.form; if(!f) return;
  const g=id=>document.getElementById(id);
  if(g("f-title")) f.title=g("f-title").value;
  if(g("f-staff")) f.staffId=g("f-staff").value;
  if(g("f-start")) f.startDate=g("f-start").value||f.startDate;
  if(g("f-end")) f.endDate=g("f-end").value||f.endDate;
  if(g("f-until")) f.until=g("f-until").value;
  if(g("f-time")) f.time=g("f-time").value||f.time;
  if(g("f-rec")) f.recurrence=g("f-rec").value;
  if(g("f-notes")) f.notes=g("f-notes").value;
  if(g("f-allday")) f.allDay=g("f-allday").checked;
  if(g("f-cat")) f.cat=g("f-cat").value;
  if(g("f-lead")) f.lead=g("f-lead").value;
}
function saveEntry(force){
  readFormDom();
  const f=S.form, data=S.data;
  if(f.type==="pto"&&!f.staffId){ S.formError="Pick who's out."; S.blackoutWarn=false; return render(); }
  if(f.type!=="pto"&&!f.title.trim()){ S.formError="Give this entry a title."; S.blackoutWarn=false; return render(); }
  if(!f.startDate){ S.formError="Start date is required."; S.blackoutWarn=false; return render(); }
  /* events and tasks can repeat: each repeat is one day, and "Repeat until" (optional) ends the series */
  const rep=f.type!=="pto"&&f.recurrence?f.recurrence:null;
  const until=rep&&f.until?f.until:null;
  if(until&&until<f.startDate){ S.formError="“Repeat until” is before the first date."; S.blackoutWarn=false; return render(); }
  let end=f.endDate||f.startDate;
  if(end<f.startDate||rep) end=f.startDate;
  if(f.type==="pto"&&!force){
    let ds=f.startDate,hit=false;
    while(ds<=end){ if(isBlackout(ds)){hit=true;break;} ds=addDays(ds,1); }
    if(hit){ S.blackoutWarn=true; S.formError=""; return render(); }
  }
  const staff=f.staffId?calStaff()[f.staffId]:null;
  const rec={
    type:f.type,
    title:f.type==="pto"?"Out":f.title.trim(),
    staffId:f.type==="pto"?f.staffId:null,
    staffName:f.type==="pto"&&staff?staff.name:null,
    startDate:f.startDate, endDate:end,
    time:f.type==="event"&&!f.allDay?f.time:null,
    notes:f.notes.trim(),
    recurrence:rep,
    until:until,
    createdAt:Date.now()
  };
  /* a category (vendor visit; compliance or payroll & money) and a task's heads-up days */
  if(f.cat&&CATS[f.cat]&&CATS[f.cat].type===f.type) rec.cat=f.cat;
  if(f.type==="task"&&String(f.lead==null?"":f.lead).trim()!==""){ const n=Math.round(Number(f.lead)); if(isFinite(n)&&n>=0) rec.lead=Math.min(n,120); }
  const id=f.id||("e"+Date.now()+Math.floor(Math.random()*999));
  const old=f.id?data.events[f.id]:null;
  if(old){
    if(old.createdAt) rec.createdAt=old.createdAt;
    if(old.preset&&f.type==="task") rec.preset=old.preset;
    /* editing a task keeps its check-offs */
    if(f.type==="task"){
      if(old.done){ rec.done=true; rec.doneAt=old.doneAt||null; }
      if(old.doneDates) rec.doneDates=old.doneDates;
    }
  }
  fbSet("events/"+id,rec);
  S.entryOpen=false; S.form=null; S.blackoutWarn=false; S.formError="";
  render();
}
function deleteEntry(id){
  const e=S.data&&S.data.events&&S.data.events[id];
  const msg=e&&e.recurrence
    ?"Delete this repeating "+(e.type==="task"?"task":"event")+"?\n\nEvery date in the series goes, past ones too. To stop it from a certain date instead, edit it and set “Repeat until”."
    :"Delete this entry?";
  if(!window.confirm(msg)) return;
  fbRemove("events/"+id);
  S.entryOpen=false; S.form=null;
  render();
}
function setAdminDay(ds,val){
  if(val) fbSet("adminDays/"+ds,val);
  else fbRemove("adminDays/"+ds);
}
function cycleAdminDay(ds){
  const cur=adminDayOf(ds);
  setAdminDay(ds, cur===null?"admin":(cur==="admin"?"meeting":null));
}

/* ================= OFFICE EXTRAS (Oct 31, 2026) =================
   Amir, 31 Oct 2026: watch days (amber) around holidays when debonds and emergencies go up, a "today" line under
   Who's out, compliance and payroll/money deadlines with heads-ups (tasks with a category), vendor/rep visits (events
   with a category), the Alachua County school calendar, a printable month, and themed tiles for the major holidays.
   Everything new is kept in places the calendar already saves (settings.*, an entry's own fields), so the NLO Cases
   records and the Staff Meeting Hub's reads are unchanged: entries stay type "event" / "task". */

/* ---------- categories on events and tasks ---------- */
const CATS={
  visit:{type:"event",glyph:"🚚",label:"Visit",long:"Vendor / rep visit",lead:0},
  compliance:{type:"task",glyph:"🛡",label:"Compliance",long:"Compliance",lead:14},
  money:{type:"task",glyph:"💵",label:"Payroll",long:"Payroll & money",lead:3}
};
function catOf(e){ const c=e&&e.cat&&CATS[e.cat]; return c&&c.type===e.type?c:null; }
function entryGlyph(e,done){ if(done) return "✓"; const c=catOf(e); return c?c.glyph:typeColors(e.type).glyph; }
/* days of heads-up before a task is due (an entry's own `lead`, else its category's) */
function leadOf(e){ if(!e||e.type!=="task") return 0; if(typeof e.lead==="number"&&e.lead>=0) return Math.min(e.lead,120); const c=catOf(e); return c?c.lead:0; }
const REC_LABEL={weekly:"weekly",biweekly:"every 2 weeks",monthly:"monthly",quarterly:"quarterly",yearly:"yearly",biennial:"every 2 years",triennial:"every 3 years"};

/* ---------- heads-up: tasks coming due (and compliance/money ones overdue) ---------- */
function dueSoon(from){
  const ev=(S.data&&S.data.events)||{}, out=[];
  Object.keys(ev).forEach(id=>{
    const e=ev[id];
    if(!e||e.type!=="task") return;
    const lead=leadOf(e), c=catOf(e);
    if(!lead&&!c) return;
    /* a missed compliance / money date stays on the list for a month — only the latest one (a weekly test missed
       three weeks running is one line, not three) */
    if(c){
      for(let i=-1;i>=-30;i--){
        const ds=addDays(from,i);
        if(occursOn(e,ds)){ if(!isDone(e,ds)) out.push({id,e,ds,days:i}); break; }
      }
    }
    for(let i=0;i<=lead;i++){
      const ds=addDays(from,i);
      if(occursOn(e,ds)){ if(!isDone(e,ds)) out.push({id,e,ds,days:i}); break; }
    }
  });
  out.sort((a,b)=>a.ds.localeCompare(b.ds)||String(a.e.title).localeCompare(String(b.e.title)));
  return out;
}
function inDays(n){ return n<0?(n===-1?"yesterday":(-n)+" days ago"):(n===0?"today":(n===1?"tomorrow":"in "+n+" days")); }

/* ---------- watch days: when broken brackets and emergency calls go up ---------- */
function easterSunday(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
    h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
    mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return new Date(y,mo-1,da);
}
const WATCH_RULES=[
  {key:"valentine",label:"Valentine's candy week",days:y=>range(fmt(new Date(y,1,15)),7)},
  {key:"easter",label:"Easter candy week",days:y=>range(addDays(fmt(easterSunday(y)),1),7)},
  {key:"halloween",label:"Halloween candy week",days:y=>range(fmt(new Date(y,10,1)),7)},
  {key:"thanksgiving",label:"Thanksgiving",days:y=>{ const t=fmt(nthWeekday(y,10,4,4)); return range(addDays(t,-3),2).concat(range(addDays(t,4),7)); }},
  {key:"winter",label:"Winter holidays",days:y=>range(fmt(new Date(y,11,18)),6).concat(range(fmt(new Date(y,0,2)),7))}
];
function range(start,n){ const a=[]; for(let i=0;i<n;i++) a.push(addDays(start,i)); return a; }
const WATCH_NOTE="Expect more broken brackets, loose wires and emergency calls — keep emergency slots open.";
let watchMemo=null, watchKey="";
function watchMap(){
  const st=(S.data&&S.data.settings)||{}, off=st.watchOff||{}, custom=st.watchCustom||{};
  const key=JSON.stringify([off,custom,todayStr().slice(0,4)]);
  if(watchMemo&&watchKey===key) return watchMemo;
  const map={}, y=new Date().getFullYear();
  WATCH_RULES.forEach(r=>{
    if(off[r.key]) return;
    [y-1,y,y+1].forEach(yy=>r.days(yy).forEach(ds=>{ if(!map[ds]) map[ds]={label:r.label,key:r.key}; }));
  });
  Object.keys(custom).forEach(start=>{
    const c=custom[start]; if(!c||typeof c!=="object"||!/^\d{4}-\d{2}-\d{2}$/.test(start)) return;
    const end=/^\d{4}-\d{2}-\d{2}$/.test(c.end||"")&&c.end>=start?c.end:start;
    for(let ds=start,i=0;ds<=end&&i<62;ds=addDays(ds,1),i++) map[ds]={label:String(c.label||"Watch"),key:"custom:"+start};
  });
  watchMemo=map; watchKey=key; return map;
}
/* only on days the office is open */
function watchOf(ds){ if(officeClosed(ds)) return null; return watchMap()[ds]||null; }
const WATCH_BG="#FFF5DE", WATCH_EDGE="#F2C66D", WATCH_INK="#A3670A";
function watchTag(ds,small){
  const w=watchOf(ds); if(!w) return "";
  return `<span class="disp" title="${esc(w.label+" — "+WATCH_NOTE)}" style="font-weight:600;letter-spacing:.08em;font-size:${small?"10px":"11px"};background:${WATCH_EDGE};color:#5A3A00;border-radius:4px;padding:2px 6px;white-space:nowrap;">⚠ Watch</span>`;
}

  put("2026-09-07",1,"Labor Day"); put("2026-10-09",1,"UF Homecoming"); put("2026-10-16",1,"Student holiday");
  put("2026-11-11",1,"Veterans Day"); put("2026-11-23",5,"Thanksgiving break"); put("2026-12-21",12,"Winter break");
  put("2027-01-15",1,"Student holiday"); put("2027-01-18",1,"MLK Day"); put("2027-02-15",1,"Presidents' Day");

function schoolOf(ds){
  const own=(S.data&&S.data.settings&&S.data.settings.school)||{};
  if(Object.prototype.hasOwnProperty.call(own,ds)) return own[ds]?String(own[ds]):null;   /* "" hides a built-in day */

}
/* the school line on a day: only on days the office is open, and only when the School filter is on */
function schoolLine(ds){ if(S.filters.school===false||officeClosed(ds)) return null; return schoolOf(ds); }
function schoolIsOff(label){ return !/first day|last day/i.test(label); }

function holidayThemeOf(ds){
  const d=parseD(ds), y=d.getFullYear(), m=d.getMonth(), n=d.getDate();
  if((m===0&&n===1)||(m===11&&n===31)) return "newyear";
  if(m===1&&n===14) return "valentine";
  if(ds===fmt(easterSunday(y))) return "easter";
  if(ds===fmt(lastWeekday(y,4,1))) return "memorial";
  if(m===6&&n===4) return "july4";
  if(ds===fmt(nthWeekday(y,8,1,1))) return "labor";
  if(m===9&&n===31) return "halloween";
  if(ds===fmt(nthWeekday(y,10,4,4))) return "thanksgiving";
  if(m===11&&(n===24||n===25)) return "christmas";
  return null;
}
const HOLI_NAME={newyear:"New Year",valentine:"Valentine's Day",easter:"Easter",memorial:"Memorial Day",july4:"Fourth of July",labor:"Labor Day",halloween:"Halloween",thanksgiving:"Thanksgiving",christmas:"Christmas"};
/* the CSS background for a themed day: the picture in the bottom-right corner over a soft tint */
function holidayBg(ds,size){
  const t=holidayThemeOf(ds); if(!t) return null;
  const a=HOLI_ART[t];
  return `${svgUrl(a.art)} right 2px bottom 2px / ${size||"min(150px,100%)"} auto no-repeat, ${a.tint}`;
}

      const c=catOf(e);
      items.push(chip(d1,`${c?c.glyph:"■"} ${e.time?esc(fmtTime(e.time))+" ":""}${esc(e.title)}`,"var(--blue-100)","var(--blue-700)"));
    } else if(e.type==="task"&&!isDone(e,d1)){
      listed[e.id]=1;
      items.push(chip(d1,`${entryGlyph(e)} ${esc(e.title)} · due`,"var(--amber-100)","#996709"));
    }
  });
  const soon=dueSoon(today).filter(x=>!(listed[x.id]&&x.ds===d1));
  if(!items.length&&!soon.length) return "";
  const lab=t=>`<span class="disp" style="font-weight:600;letter-spacing:.14em;font-size:${phone?"12px":"13px"};color:var(--blue-600);white-space:nowrap;">${t}</span>`;
  let h=`<div style="background:#fff;border-bottom:1px solid var(--grey-200);padding:${phone?"8px 14px":"9px 24px"};display:flex;align-items:center;gap:${phone?"6px 8px":"6px 10px"};flex-wrap:wrap;">`;
  const icap=phone?3:99;
  if(items.length){ h+=lab(lbl1)+items.slice(0,icap).join(""); if(items.length>icap) h+=`<button data-act="goto-day" data-date="${d1}" style="border:none;background:none;font-size:12.5px;font-weight:600;color:var(--grey-500);padding:0;">+${items.length-icap} more</button>`; }
  if(soon.length){
    const cap=phone?2:4, show=soon.slice(0,cap);
    if(items.length) h+=`<span style="width:1px;height:18px;background:var(--grey-200);margin:0 4px;"></span>`;
    h+=lab("Coming up");
    show.forEach(x=>{
      const late=x.days<0;
      h+=chip(x.ds,`${entryGlyph(x.e)} ${esc(x.e.title)} · ${late?"overdue, ":""}${esc(prettyDate(x.ds))}${late?"":" ("+inDays(x.days)+")"}`,late?"var(--coral-100)":"var(--grey-50)",late?"var(--coral-700)":"var(--navy-800)",late?"var(--coral-200)":"var(--grey-200)");
    });
    if(soon.length>cap) h+=`<span style="font-size:12.5px;font-weight:600;color:var(--grey-500);">+${soon.length-cap} more</span>`;
  }
  return h+`</div>`;
}

function addPresets(){
  const picked=DEADLINE_PRESETS.filter(p=>{ const c=document.getElementById("pre-chk-"+p.key); return c&&c.checked&&!presetAdded(p.key); });
  if(!picked.length){ S.presetMsg="Tick at least one."; return render(); }
  const val=k=>{ const x=document.getElementById("pre-date-"+k); return x&&/^\d{4}-\d{2}-\d{2}$/.test(x.value)?x.value:""; };
  const dates={};
  for(const p of picked){
    let d=val(p.key);
    if(!d&&p.after){ const base=val(p.after)||(()=>{ const ev=S.data.events||{}; const id=Object.keys(ev).find(i=>ev[i]&&ev[i].preset===p.after); return id?ev[id].startDate:""; })(); if(base) d=addDays(base,p.afterDays); }
    if(!d){ S.presetMsg="Pick the first date for “"+p.title+"”"+(p.after?" (or for payroll)":"")+"."; return render(); }
    dates[p.key]=d;
  }
  picked.forEach((p,i)=>{
    const id="e"+Date.now()+"p"+i;
    fbSet("events/"+id,{ type:"task", title:p.title, staffId:null, staffName:null, startDate:dates[p.key], endDate:dates[p.key], time:null,
      notes:p.notes||"", recurrence:p.rec, until:null, cat:p.cat, lead:p.lead, preset:p.key, createdAt:Date.now() });
  });
  S.presetOpen=false; S.presetMsg=""; render();
}

/* Columns Sun→Sat. The office is open Mon–Thu, so Fri, Sat and Sun get half a column each. */
const COLS="minmax(0,.5fr) repeat(4,minmax(0,1fr)) repeat(2,minmax(0,.5fr))";
/* the week view shows full entry cards, so closed days keep a little more room there */
const WEEK_COLS="minmax(0,.65fr) repeat(4,minmax(0,1fr)) repeat(2,minmax(0,.65fr))";
/* fade a view or the day panel in when it opens, not again on every refresh or check-off */
let animView=true, animDetail=true, lastViewKey="", lastDetailKey=null;

/* Redraw after a change from outside this screen (another computer saved, the staff roster or the Time-Off
   list updated) without losing what someone is typing: open-form fields, the focused box and its cursor. */
function bgRender(){
  const app=document.getElementById("app");
  if(!app) return;
  if(S.entryOpen&&S.form) readFormDom();
  const keep={};
  app.querySelectorAll("input[id],textarea[id],select[id]").forEach(el=>{ keep[el.id]=el.type==="checkbox"?{c:el.checked}:{v:el.value}; });
  const a=document.activeElement;
  let foc=null;
  if(a&&a.id&&app.contains(a)){ foc={id:a.id}; try{ foc.s=a.selectionStart; foc.e=a.selectionEnd; }catch(_){} }
  render();
  Object.keys(keep).forEach(id=>{
    const el=document.getElementById(id);
    if(!el||!app.contains(el)) return;
    if("c" in keep[id]) el.checked=keep[id].c;
    else if(el.value!==keep[id].v) el.value=keep[id].v;
  });
  if(foc){
    const el=document.getElementById(foc.id);
    if(el&&app.contains(el)&&document.activeElement!==el){
      el.focus({preventScroll:true});
      if(typeof foc.s==="number"){ try{ el.setSelectionRange(foc.s,foc.e); }catch(_){} }
    }
  }
}
