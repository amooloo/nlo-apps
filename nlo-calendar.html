  let who="";
  const faces=list=>list.map((e,i)=>`<span style="display:inline-flex;align-items:center;gap:6px;white-space:nowrap;">${whoFace(e,phone?20:22)}${esc(e.staffName||OUT_NOBODY)}${i<list.length-1?",":""}</span>`).join("");
  if(outToday.length) who+=`<span style="font-size:${bFs};color:var(--navy-800);display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px 6px;"><strong style="font-weight:700;">${lbl1}:</strong> ${faces(outTodayE)}</span>`;
  if(outTomorrow.length) who+=`<span style="font-size:${bFs};color:var(--grey-600);display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px 6px;"><strong style="font-weight:700;color:var(--navy-800);">${lbl2}:</strong> ${faces(outTomorrowE)}</span>`;
  if(st==="ok"){
    if(anyOut) h+=`<div style="background:var(--coral-100);border-bottom:1px solid var(--coral-200);padding:${bPad};display:flex;align-items:center;gap:${bGap};flex-wrap:wrap;">${whoLab("var(--coral-700)")}${who}</div>`;
    else h+=`<div style="background:var(--mint-100);border-bottom:1px solid var(--mint-200);padding:${bPad};display:flex;align-items:baseline;gap:${bGap};flex-wrap:wrap;">${whoLab("var(--mint-700)")}<span style="font-size:${bFs};color:var(--navy-800);">Full team in ${lbl1==="Today"?"today":lbl1} and ${lbl2==="Tomorrow"?"tomorrow":lbl2}.</span></div>`;
  } else {
    const at=S.sync.at?S.sync.at.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):"";
    let note;
    if(st==="loading") note=`<span style="font-size:${bFs};color:var(--grey-500);">Checking the Time-Off app…</span>`;
    else if(st==="failed") note=`<span style="font-size:${bFs};color:var(--amber-700);font-weight:600;">⚠ Couldn't reach the Time-Off app, so anyone out may be missing here.</span>`;
    else note=`<span style="font-size:${bFs};color:var(--amber-700);font-weight:600;">⚠ The Time-Off app isn't answering. ${anyOut?"This list is":"No one was out"} as of ${esc(at)}.</span>`;
    const retry=st==="loading"?"":`<button data-act="sync-now" ${S.sync.busy?"disabled":""} style="border:1px solid var(--amber-600);background:#fff;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700;color:var(--amber-700);cursor:${S.sync.busy?"default":"pointer"};">${S.sync.busy?"Checking…":"Try again"}</button>`;
    const warm=st!=="loading";
    h+=`<div style="background:${warm?"var(--amber-100)":"var(--grey-100)"};border-bottom:1px solid ${warm?"#F5DFA9":"var(--grey-200)"};padding:${bPad};display:flex;align-items:center;gap:${bGap};flex-wrap:wrap;">${whoLab(warm?"var(--amber-700)":"var(--grey-600)")}${who}${note}${retry}</div>`;
  }
  if(S.dbError && !S.connected){
    h+=`<div style="background:var(--amber-100);padding:${phone?"8px 14px":"8px 24px"};font-size:13.5px;color:var(--amber-700);font-weight:600;">⚠ Cannot reach the shared database (${esc(S.dbError)}). Check the Firebase rules for nlo/calendar.</div>`;
  }
  h+=todayStripHtml(today,d1,lbl1,phone)+`</div>`;

  /* ---- toolbar ---- */
  const FILTERS=[["pto","●","Out","--coral-500","#FFE7E1","#C13A28"],["event","■","Events","--blue-600","#E5EAF8","#16318C"],["task","▲","Tasks","--amber-600","#FEF2D7","#996709"],["hr","◆","Staff Hub","--violet-500","#F0EAFB","#5B3A9E"],["school","🏫","School","--grey-400","#ECEEF0","#4C5868"]];
  if(phone){
    h+=`<div style="display:flex;align-items:center;gap:6px;padding:12px 14px 8px;">
      <h1 class="disp" style="margin:0;flex:1;min-width:0;font-weight:700;letter-spacing:.01em;font-size:22px;line-height:1.1;color:var(--navy-800);">${esc(periodLabel)}</h1>
      <button data-act="prev" aria-label="Previous" class="hov-grey" style="border:1px solid var(--grey-300);border-radius:9px;width:34px;height:34px;padding:0;background:#fff;color:var(--navy-800);font-size:16px;line-height:1;flex:none;">‹</button>
      <button data-act="today" class="hov-grey" style="border:1px solid var(--grey-300);border-radius:9px;height:34px;padding:0 10px;background:#fff;color:var(--navy-800);font-weight:600;font-size:13px;flex:none;">Today</button>
      <button data-act="next" aria-label="Next" class="hov-grey" style="border:1px solid var(--grey-300);border-radius:9px;width:34px;height:34px;padding:0;background:#fff;color:var(--navy-800);font-size:16px;line-height:1;flex:none;">›</button>
    </div>
    <div style="display:flex;gap:6px;padding:0 14px 10px;flex-wrap:wrap;align-items:center;">`;
    FILTERS.forEach(([k,g,l,bc,bg,fg])=>{
      const on=S.filters[k];
      h+=`<button data-act="filter" data-f="${k}" aria-pressed="${on}" style="border-radius:999px;padding:4px 11px;font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:6px;border:2px solid var(${bc});background:${on?bg:"#FFFFFF"};color:${on?fg:"#969FAB"};"><span style="font-size:9px;">${g}</span> ${l}</button>`;
    });
    if(S.admin){
      h+=S.paintMode
        ? `<button data-act="paint-toggle" class="disp" style="border:none;border-radius:999px;padding:6px 12px;font-weight:600;letter-spacing:.06em;font-size:12px;background:var(--navy-800);color:var(--mint-500);">✏ Tap days · Done</button>`
        : `<button data-act="paint-toggle" class="disp hov-grey" style="border:2px solid var(--mint-700);border-radius:999px;padding:4px 11px;font-weight:600;letter-spacing:.06em;font-size:12px;background:#fff;color:var(--mint-700);">✏ Admin days</button>`;
    }
    h+=`</div>`;
  } else {
    h+=`<div style="display:flex;align-items:center;gap:16px;padding:18px 24px 10px;flex-wrap:wrap;">
    <h1 class="disp" style="margin:0;font-weight:700;letter-spacing:.01em;font-size:34px;line-height:1;color:var(--navy-800);">${esc(periodLabel)}</h1>
    <div style="display:flex;gap:6px;align-items:center;">
      <button data-act="prev" aria-label="Previous" class="hov-grey" style="border:1px solid var(--grey-300);border-radius:10px;width:38px;height:38px;background:#fff;color:var(--navy-800);font-size:17px;line-height:1;">‹</button>
      <button data-act="today" class="hov-grey" style="border:1px solid var(--grey-300);border-radius:10px;height:38px;padding:0 16px;background:#fff;color:var(--navy-800);font-weight:600;font-size:14px;">Today</button>
      <button data-act="next" aria-label="Next" class="hov-grey" style="border:1px solid var(--grey-300);border-radius:10px;width:38px;height:38px;background:#fff;color:var(--navy-800);font-size:17px;line-height:1;">›</button>
    </div>
    <div style="flex:1;"></div>`;
    if(S.admin){
      h+=S.paintMode
        ? `<button data-act="paint-toggle" class="disp" style="border:none;border-radius:999px;padding:9px 18px;font-weight:600;letter-spacing:.08em;font-size:13px;background:var(--navy-800);color:var(--mint-500);">✏ Click days: admin → +mtg → clear · Done</button>`
        : `<button data-act="paint-toggle" class="disp hov-grey" style="border:2px solid var(--mint-700);border-radius:999px;padding:8px 16px;font-weight:600;letter-spacing:.08em;font-size:13px;background:#fff;color:var(--mint-700);">✏ Mark admin days</button>`;
    }
    h+=`<div style="display:flex;gap:8px;flex-wrap:wrap;">`;
    FILTERS.forEach(([k,g,l,bc,bg,fg])=>{
      const on=S.filters[k];
      h+=`<button data-act="filter" data-f="${k}" aria-pressed="${on}" style="border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;border:2px solid var(${bc});background:${on?bg:"#FFFFFF"};color:${on?fg:"#969FAB"};"><span style="font-size:11px;">${g}</span> ${l}</button>`;
    });
    h+=`<button data-act="print" title="Print this month" class="hov-grey" style="border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;border:2px solid var(--grey-300);background:#fff;color:var(--navy-800);">🖨 Print</button>`;
    h+=`</div></div>`;
  }

  /* ---- views ---- */
  if(view==="month") h+=renderMonth(today,cd);
  else if(view==="week") h+=renderWeek(today,cursor);
  else h+=renderAgenda(today,cursor);

  /* ---- overlays ---- */
  if(S.detailDate) h+=renderDetail(today,S.detailDate);
  if(S.pinOpen) h+=renderPin();
  if(S.entryOpen&&S.form) h+=renderEntry();
  if(S.settingsOpen) h+=renderSettings();
  if(S.saveErr){
    h+=`<div role="alert" style="position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:90;width:min(560px,calc(100vw - 24px));background:var(--coral-700);color:#fff;border-radius:12px;padding:12px 12px 12px 16px;box-shadow:0 14px 34px rgba(17,32,58,.35);display:flex;gap:12px;align-items:flex-start;">
      <div style="flex:1;min-width:0;font-size:14px;line-height:1.45;"><strong>Couldn't save that change.</strong> The shared database turned it down. Check that this computer is signed in with the office Google account, then try again.
        <div style="font-size:12px;opacity:.85;margin-top:4px;overflow-wrap:break-word;">${esc(S.saveErr)}</div></div>
      <button data-act="dismiss-save-err" aria-label="Dismiss" style="border:none;background:rgba(255,255,255,.2);color:#fff;border-radius:999px;width:30px;height:30px;padding:0;font-size:14px;flex:none;">✕</button>
    </div>`;
  }

  if(S.lockNote&&!S.saveErr){
    h+=`<div role="status" style="position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:89;width:max-content;max-width:calc(100vw - 24px);background:var(--navy-800);color:#F2F3F4;border-radius:999px;padding:8px 8px 8px 18px;box-shadow:0 12px 30px rgba(17,32,58,.3);display:flex;gap:10px;align-items:center;font-size:14px;">
      <span>\u{1F512} ${esc(S.lockNote)}</span>
      <button data-act="dismiss-lock-note" aria-label="Dismiss" style="border:none;background:rgba(255,255,255,.16);color:#fff;border-radius:999px;width:26px;height:26px;padding:0;font-size:12px;flex:none;">✕</button>
    </div>`;
  }

  /* keep the scroll position of an open panel or form across redraws */
  const sc={};
  app.querySelectorAll("[data-keep-scroll]").forEach(el=>{ sc[el.getAttribute("data-keep-scroll")]=el.scrollTop; });
  app.innerHTML=h;
  app.querySelectorAll("[data-keep-scroll]").forEach(el=>{ const v=sc[el.getAttribute("data-keep-scroll")]; if(v) el.scrollTop=v; });
  const pin=document.getElementById("pin-input");
  if(pin){ pin.focus(); pin.value=S.pinValue; }
}

function renderMonth(today,cd){
  const phone=PHONE.matches, gap=phone?4:8;
  let h=`<div class="${animView?"fadeup":""}" style="padding:${phone?"2px 10px 24px":"8px 24px 28px"};">
    <div style="display:grid;grid-template-columns:${COLS};gap:0 ${gap}px;padding:0 0 6px;">`;
  ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach((n,i)=>{
    const shut=i===0||i>4;
    h+=`<div class="disp" style="min-width:0;font-weight:600;letter-spacing:${phone?".04em":".12em"};font-size:${phone?"11px":"13px"};color:${shut?"#969FAB":"#4C5868"};text-align:${phone?"center":"left"};padding:${phone?"2px 0":"4px 10px"};white-space:nowrap;overflow:hidden;">${phone&&shut?n.charAt(0):n}</div>`;
  });
  h+=`</div><div style="display:grid;grid-template-columns:${COLS};gap:${gap}px;">`;
  const first=new Date(cd.getFullYear(),cd.getMonth(),1);
  const gridStart=weekStart(fmt(first));
  for(let i=0;i<42;i++){
    const ds=addDays(gridStart,i);
    const d=parseD(ds);
    const inMonth=d.getMonth()===cd.getMonth();
    const isToday=ds===today;
    const closed=isClosedDay(ds);
    const blackout=isBlackout(ds);
    const entries=entriesFor(ds);
    const stk=stickersFor(ds);
    const ad=adminDayOf(ds);
    const adTint=ad==="meeting"?"#FFE7E1":"#E2FBF4";
    const wch=watchOf(ds), sch=schoolLine(ds), hbg=holidayBg(ds,phone?"min(44px,100%)":"min(150px,100%)");
    const bg=blackout?"repeating-linear-gradient(135deg,#ECEEF0 0 6px,#F7F8F9 6px 12px)":(hbg||(ad?adTint:(wch?WATCH_BG:(closed?"#F0F1F3":"#FFFFFF"))));
    const border=isToday?"2px solid #1D3EA9":(ad?("1px solid "+(ad==="meeting"?"#FFC8BF":"#C0FBEC")):(wch?"1px solid "+WATCH_EDGE:"1px solid #DCE0E4"));
    h+=`<div data-act="open-day" data-date="${ds}" class="hov-cell month-cell" style="position:relative;min-width:0;min-height:${phone?"74px":"118px"};border-radius:${phone?"8px":"12px"};padding:${phone?(closed?"4px 1px":"4px 3px"):"8px"};cursor:pointer;display:flex;flex-direction:column;${phone?"align-items:center;":""}gap:${phone?"3px":"4px"};overflow:hidden;border:${border};background:${bg};opacity:${inMonth?"1":"0.45"};">`;
    if(stk.length&&!phone) h+=`<div style="position:absolute;top:6px;right:6px;display:flex;align-items:center;z-index:1;">${stickerCluster(stk,closed?1:3,closed?19:24,true)}</div>`;
    h+=`<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;${stk.length&&!phone?"padding-right:"+(closed?22:64)+"px;":""}">
        <span style="font-weight:700;font-size:${phone?"13px":"15px"};min-width:${phone?"22px":"26px"};height:${phone?"22px":"26px"};display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:${isToday?"#1D3EA9":"transparent"};color:${isToday?"#FFFFFF":(closed?"#969FAB":"#1B2F4C")};">${d.getDate()}</span>`;
    /* admin day: a clean label beside the date (the cell is already tinted) */
    if(ad&&!phone) h+=`<span class="disp" style="font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:${ad==="meeting"?"#C2392A":"#178A6D"};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;">${ad==="meeting"?"Admin + Mtg":"Admin Day"}</span>`;
    if(wch&&!phone) h+=`<span class="disp" title="${esc(wch.label+" — "+WATCH_NOTE)}" style="font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:${WATCH_INK};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;">${ad?"· ":""}⚠ Watch</span>`;
    if(blackout&&!phone) h+=`<span class="disp" style="font-weight:600;letter-spacing:.1em;font-size:10px;background:var(--navy-800);color:#fff;border-radius:4px;padding:2px 6px;">No time off</span>`;
    h+=`</div>`;
    if(sch&&!phone) h+=`<div title="Alachua County schools" style="font-size:11.5px;font-weight:600;color:var(--grey-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-2px;">🏫 ${esc(schoolIsOff(sch)?"No school · "+sch:sch)}</div>`;
    if(phone&&stk.length) h+=`<div style="line-height:1;">${stickerCluster(stk,1,15,false)}</div>`;
    if(phone){
      /* phones: one small coloured mark per entry; tap the day for the details */
      const cap=closed?2:4, shown=entries.slice(0,cap);
      if(shown.length){
        h+=`<div style="display:flex;flex-wrap:wrap;gap:3px;justify-content:center;">`;
        shown.forEach(e=>{
          const c=typeColors(e.type), done=isDone(e,ds);
          h+=`<span style="width:16px;height:16px;border-radius:4px;background:${c.bg};color:${c.fg};font-size:${catOf(e)&&!done?"10px":"9px"};line-height:1;display:inline-flex;align-items:center;justify-content:center;${done?"opacity:.5;":""}">${entryGlyph(e,done)}</span>`;
        });
        h+=`</div>`;
      }
      if(entries.length>cap) h+=`<div style="font-size:11px;font-weight:700;color:var(--grey-500);line-height:1;">+${entries.length-cap}</div>`;
    } else {
      const MAX=3;
      entries.slice(0,MAX).forEach(e=>{
        const c=typeColors(e.type), done=isDone(e,ds), pp=entryPerson(e);
        const label=e.type==="event"&&e.time?fmtTime(e.time)+" "+entryLabel(e):entryLabel(e);
        const lead=pp&&pp.photo?calAvatar(pp,16):`<span style="font-size:${catOf(e)&&!done?"11px":"9px"};flex:none;">${entryGlyph(e,done)}</span>`;
        h+=`<div style="font-size:13px;font-weight:600;border-radius:6px;padding:3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;background:${c.bg};color:${c.fg};${done?"opacity:.6;":""}">${lead}<span style="overflow:hidden;text-overflow:ellipsis;${done?"text-decoration:line-through;":""}">${esc(label)}</span></div>`;
      });
      if(entries.length>MAX) h+=`<div style="font-size:12px;font-weight:600;color:var(--grey-500);padding:0 8px;">+${entries.length-MAX} more</div>`;
    }
    h+=`</div>`;
  }
  h+=`</div></div>`;
  return h;
}

function weekEntry(e,ds){
  const c=typeColors(e.type), done=isDone(e,ds);
  return `<div style="border-radius:8px;padding:8px 10px;background:${c.bg};">
        <div style="display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;color:${c.fg};">${e.type==="task"?taskBox(e,ds,18):(entryPerson(e)?whoFace(e,20):`<span style="font-size:${catOf(e)?"13px":"9px"};flex:none;">${entryGlyph(e)}</span>`)}<span style="min-width:0;overflow-wrap:break-word;${done?DONE_STYLE:""}">${esc(entryLabel(e))}</span></div>
        <div style="font-size:12.5px;font-weight:500;margin-top:2px;color:${c.fg};opacity:.85;overflow-wrap:break-word;">${esc(entrySub(e))}</div>
      </div>`;
}

function renderWeek(today,cursor){
  const ws=weekStart(cursor);
  if(PHONE.matches) return renderWeekList(today,ws);
  let h=`<div class="${animView?"fadeup":""}" style="padding:8px 24px 28px;"><div style="display:grid;grid-template-columns:${WEEK_COLS};gap:10px;align-items:stretch;">`;
  for(let i=0;i<7;i++){
    const ds=addDays(ws,i);
    const d=parseD(ds);
    const isToday=ds===today;
    const closed=isClosedDay(ds);
    const blackout=isBlackout(ds);
    const adW=adminDayOf(ds);
    const wchW=watchOf(ds), schW=schoolLine(ds);
    const weekBg=holidayBg(ds)||(adW?(adW==="meeting"?"#FFE7E1":"#E2FBF4"):(wchW?WATCH_BG:(closed?"#F0F1F3":"#FFFFFF")));
    h+=`<div data-act="open-day" data-date="${ds}" class="hov-cell" style="min-width:0;border-radius:14px;min-height:380px;padding:${closed?"12px 8px":"12px"};display:flex;flex-direction:column;gap:8px;cursor:pointer;border:${isToday?"2px solid #1D3EA9":"1px solid #DCE0E4"};background:${weekBg};">
      <div style="display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;border-bottom:1px solid var(--grey-200);padding-bottom:8px;">
        <span class="disp" style="font-weight:600;letter-spacing:.1em;font-size:13px;color:${isToday?"#1D3EA9":"#6B7685"};">${DAYS[d.getDay()].slice(0,3)}</span>
        <span style="font-weight:700;font-size:20px;color:${isToday?"#1D3EA9":"#1B2F4C"};">${d.getDate()}</span>`;
    if(closed) h+=`<span style="font-size:11px;font-weight:600;color:var(--grey-400);text-transform:uppercase;letter-spacing:.08em;">Closed</span>`;
    const stkW=stickersFor(ds);
    if(stkW.length) h+=`<span style="margin-left:auto;display:inline-flex;align-items:center;">${stickerCluster(stkW,closed?1:3,20,true)}</span>`;
    h+=`</div>`;
    if(blackout) h+=`<span class="disp" style="font-weight:600;letter-spacing:.1em;font-size:11px;background:var(--navy-800);color:#fff;border-radius:4px;padding:3px 8px;align-self:flex-start;">Blackout — no time off</span>`;
    if(adW||wchW) h+=`<div style="align-self:flex-start;display:flex;gap:6px;flex-wrap:wrap;">${adminDayTag(ds)}${watchTag(ds)}</div>`;
    if(schW) h+=`<div style="font-size:12.5px;font-weight:600;color:var(--grey-500);">🏫 ${esc(schoolIsOff(schW)?"No school · "+schW:schW)}</div>`;
    entriesFor(ds).forEach(e=>{ h+=weekEntry(e,ds); });
    h+=`</div>`;
  }
  h+=`</div></div>`;
  return h;
}

/* phones: the week as a list, one row per day; a closed day with nothing on it is a thin line */
function renderWeekList(today,ws){
  let h=`<div class="${animView?"fadeup":""}" style="padding:2px 14px 28px;display:flex;flex-direction:column;gap:8px;">`;
  for(let i=0;i<7;i++){
    const ds=addDays(ws,i);
    const d=parseD(ds);
    const isToday=ds===today;
    const closed=isClosedDay(ds);
    const blackout=isBlackout(ds);
    const ad=adminDayOf(ds);
    const entries=entriesFor(ds);
    const stk=stickersFor(ds);
    const name=DAYS[d.getDay()].slice(0,3)+" "+d.getDate();
    if(closed&&!entries.length&&!ad&&!isToday&&!stk.length){
      h+=`<div data-act="open-day" data-date="${ds}" style="display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:10px;background:#F0F1F3;cursor:pointer;">
        <span class="disp" style="font-weight:600;letter-spacing:.08em;font-size:13px;color:#969FAB;">${name}</span>
        <span style="font-size:11px;font-weight:600;color:var(--grey-400);text-transform:uppercase;letter-spacing:.08em;">Closed</span>
      </div>`;
      continue;
    }
    const wchL=watchOf(ds), schL=schoolLine(ds);
    const bg=blackout?"repeating-linear-gradient(135deg,#ECEEF0 0 6px,#F7F8F9 6px 12px)":(holidayBg(ds,"min(90px,40%)")||(ad?(ad==="meeting"?"#FFE7E1":"#E2FBF4"):(wchL?WATCH_BG:(closed?"#F0F1F3":"#FFFFFF"))));
    h+=`<div data-act="open-day" data-date="${ds}" style="border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;border:${isToday?"2px solid #1D3EA9":"1px solid #DCE0E4"};background:${bg};">
      <div style="display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;">
        <span class="disp" style="font-weight:700;letter-spacing:.06em;font-size:16px;color:${isToday?"#1D3EA9":"#1B2F4C"};">${name}</span>`;
    if(isToday) h+=`<span class="disp" style="font-weight:600;letter-spacing:.1em;font-size:11px;background:var(--blue-600);color:#fff;border-radius:999px;padding:2px 10px;">Today</span>`;
    if(closed) h+=`<span style="font-size:11px;font-weight:600;color:var(--grey-400);text-transform:uppercase;letter-spacing:.08em;">Closed</span>`;
    if(blackout) h+=`<span class="disp" style="font-weight:600;letter-spacing:.1em;font-size:10px;background:var(--navy-800);color:#fff;border-radius:4px;padding:2px 6px;">No time off</span>`;
    h+=adminDayTag(ds,true)+watchTag(ds,true);
    if(stk.length) h+=`<span style="margin-left:auto;display:inline-flex;align-items:center;">${stickerCluster(stk,3,18,true)}</span>`;
    h+=`</div>`;
    if(schL) h+=`<div style="font-size:12.5px;font-weight:600;color:var(--grey-500);">🏫 ${esc(schoolIsOff(schL)?"No school · "+schL:schL)}</div>`;
    h+=stickerLabelLine(stk,13,0);
    if(!entries.length&&!stk.some(s=>s.label)) h+=`<div style="font-size:13px;color:var(--grey-400);">Nothing scheduled</div>`;
    entries.forEach(e=>{ h+=weekEntry(e,ds); });
    h+=`</div>`;
  }
  h+=`</div>`;
  return h;
}

function renderAgenda(today,cursor){
  const phone=PHONE.matches;
  let h=`<div class="${animView?"fadeup":""}" style="padding:${phone?"2px 14px 40px":"8px 24px 40px"};max-width:860px;width:100%;margin:0 auto;">`;
  let count=0;
  for(let i=0;i<45;i++){
    const ds=addDays(cursor,i);
    const entries=entriesFor(ds);
    const ad=adminDayOf(ds);
    const stk=stickersFor(ds);
    if(!entries.length&&!ad&&!stk.length) continue;
    count++;
    const d=parseD(ds);
    const isToday=ds===today;
    h+=`<div style="margin-bottom:${phone?"18px":"22px"};">
      <div data-act="open-day" data-date="${ds}" style="display:flex;align-items:center;flex-wrap:wrap;gap:${phone?"8px":"12px"};cursor:pointer;margin-bottom:8px;">
        <span class="disp" style="font-weight:700;letter-spacing:.06em;font-size:${phone?"17px":"20px"};color:${isToday?"#1D3EA9":"#1B2F4C"};">${DAYS[d.getDay()]} · ${SMON[d.getMonth()]} ${d.getDate()}</span>`;
    if(isToday) h+=`<span class="disp" style="font-weight:600;letter-spacing:.1em;font-size:12px;background:var(--blue-600);color:#fff;border-radius:999px;padding:3px 12px;">Today</span>`;
    if(isBlackout(ds)) h+=`<span class="disp" style="font-weight:600;letter-spacing:.1em;font-size:12px;background:var(--navy-800);color:#fff;border-radius:4px;padding:3px 10px;">No time off</span>`;
    h+=adminDayTag(ds)+watchTag(ds);
    if(stk.length) h+=`<span style="display:inline-flex;align-items:center;">${stickerCluster(stk,4,22,true)}</span>`;
    h+=`<div style="flex:1;min-width:20px;height:1px;background:var(--grey-200);"></div></div>
      ${stickerLabelLine(stk,14,8)}<div style="display:flex;flex-direction:column;gap:8px;">`;
    entries.forEach(e=>{
      const c=typeColors(e.type), done=isDone(e,ds);
      const timeLabel=e.time?fmtTime(e.time):(e.type==="pto"?prettyRange(e.startDate,e.endDate):"All day");
      h+=`<div style="background:var(--white);border:1px solid var(--grey-200);border-left:6px solid ${c.edge};border-radius:10px;padding:${phone?"12px":"14px 16px"};display:flex;gap:${phone?"10px":"14px"};align-items:center;">
        <span style="font-family:var(--font-mono);font-size:${phone?"12.5px":"14px"};font-weight:500;color:var(--grey-500);min-width:${phone?"58px":"76px"};flex:none;">${esc(timeLabel)}</span>
        ${e.type==="task"?taskBox(e,ds):(whoFace(e,phone?28:30)||(catOf(e)?`<span style="font-size:22px;flex:none;">${catOf(e).glyph}</span>`:""))}
        <div style="flex:1;min-width:0;">
          <div style="font-weight:700;font-size:${phone?"16px":"17px"};color:var(--navy-800);overflow-wrap:break-word;${done?DONE_STYLE:""}">${esc(entryLabel(e))}</div>`;
      if(e.type==="pto"&&e.part) h+=`<div style="font-size:14px;color:var(--grey-500);margin-top:3px;">${esc(e.part)}</div>`;
      if(e.notes) h+=`<div style="font-size:14px;color:var(--grey-500);margin-top:3px;overflow-wrap:break-word;">${esc(e.notes)}</div>`;
      h+=`</div><span style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;flex:none;color:${c.edge};">${entryTypeLabel(e)}</span>
      </div>`;
    });
    h+=`</div></div>`;
  }
  if(count===0) h+=`<div style="text-align:center;padding:60px 20px;color:var(--grey-500);font-size:16px;">Nothing scheduled in the next 45 days.</div>`;
  h+=`</div>`;
  return h;
}

function renderDetail(today,dd){
  const d=parseD(dd);
  const ad=adminDayOf(dd);
  const hol=holidayMap()[dd];
  let sub=(dd===today?"Today · ":"")+(hol?("Office closed — "+hol.label):(isClosedDay(dd)?"Office closed (Mon–Thu 8–5)":"Office open 8 AM – 5 PM"));

  let h=`<div data-act="close-detail" style="position:fixed;inset:0;background:rgba(17,32,58,.42);z-index:60;"></div>

        <div class="disp" style="font-weight:700;font-size:26px;line-height:1.05;">${DAYS[d.getDay()]}, ${SMON[d.getMonth()]} ${d.getDate()}</div>

  if(isBlackout(dd)) h+=`<div class="disp" style="background:var(--navy-800);color:#E29A14;padding:8px 22px;font-size:13px;font-weight:600;letter-spacing:.06em;">Blackout date — no time off</div>`;
  const wD=watchOf(dd), sD=schoolLine(dd), tD=holidayThemeOf(dd);

  if(sD) h+=`<div style="background:var(--grey-50);color:var(--grey-600);padding:8px 22px;font-size:13px;font-weight:600;border-bottom:1px solid var(--grey-200);">🏫 ${esc(schoolIsOff(sD)?"No school in Alachua County — "+sD:sD+" (Alachua County)")}</div>`;
  if(ad==="admin") h+=`<div class="disp" style="background:var(--mint-100);color:var(--mint-700);padding:8px 22px;font-size:13px;font-weight:600;letter-spacing:.06em;border-bottom:1px solid var(--mint-200);">Admin day — flexible (Dr. A can schedule off)</div>`;
  if(ad==="meeting") h+=`<div class="disp" style="background:var(--coral-100);color:var(--coral-700);padding:8px 22px;font-size:13px;font-weight:600;letter-spacing:.06em;border-bottom:1px solid var(--coral-200);">Admin day + staff meeting — Dr. A must attend</div>`;
  /* quick admin-day toggle (admin only) */
  if(S.admin){
    const opt=(val,label,on,onBg,onFg)=>`<button data-act="adminday" data-date="${dd}" data-v="${val}" style="flex:1;border:none;border-radius:999px;padding:8px 6px;font-weight:700;font-size:12.5px;background:${on?onBg:"transparent"};color:${on?onFg:"#4C5868"};">${label}</button>`;
    h+=`<div style="padding:12px 22px;border-bottom:1px solid var(--grey-200);">
      <div class="disp" style="font-weight:600;letter-spacing:.12em;font-size:12px;color:var(--grey-600);margin-bottom:8px;">Mark this day</div>
      <div style="display:flex;gap:6px;background:var(--grey-100);border-radius:999px;padding:4px;">
        ${opt("","Regular",!ad,"#1B2F4C","#FFFFFF")}
        ${opt("admin","Admin day",ad==="admin","#64F4C9","#11203A")}
        ${opt("meeting","Admin + mtg",ad==="meeting","#FA624D","#FFFFFF")}
      </div>
    </div>`;
  }
  h+=`<div data-keep-scroll="detail" style="flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:10px;">`;
  h+=stickerPanelHtml(dd);
  if(!list.length) h+=`<div style="color:var(--grey-500);font-size:15px;padding:20px 0;">Nothing scheduled this day.</div>`;
  list.forEach(e=>{
    const c=typeColors(e.type), done=isDone(e,dd);
    const doneAt=done?(e.recurrence?e.doneDates[dd]:e.doneAt):null;
    h+=`<div style="border:1px solid var(--grey-200);border-left:6px solid ${c.edge};border-radius:10px;padding:12px 14px;">
      <div style="display:flex;align-items:center;gap:10px;">
        ${e.type==="task"?taskBox(e,dd):(whoFace(e,30)||(catOf(e)?`<span style="font-size:22px;flex:none;">${catOf(e).glyph}</span>`:""))}
        <div style="flex:1;min-width:0;font-weight:700;font-size:16px;color:var(--navy-800);overflow-wrap:break-word;${done?DONE_STYLE:""}">${esc(entryLabel(e))}</div>
        <span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:${c.edge};flex:none;">${entryTypeLabel(e)}</span>
      </div>
      <div style="font-size:13.5px;color:var(--grey-500);margin-top:3px;">${esc(entrySub(e))}${typeof doneAt==="number"?esc(" · checked off "+fmtStamp(doneAt)):""}</div>`;
    if(e.notes) h+=`<div style="font-size:14px;color:var(--grey-600);margin-top:6px;overflow-wrap:break-word;">${esc(e.notes)}</div>`;
    if(S.admin&&!e.synced){
      h+=`<div style="display:flex;gap:8px;margin-top:10px;">
        <button data-act="edit-entry" data-id="${e.id}" class="hov-grey" style="border:1px solid var(--grey-300);background:#fff;border-radius:8px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--navy-800);">Edit</button>
        <button data-act="del-entry" data-id="${e.id}" class="hov-coral1" style="border:1px solid var(--coral-200);background:#fff;border-radius:8px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--coral-700);">Delete</button>
      </div>`;
    } else if(S.admin&&e.synced&&e.type==="pto"){
      h+=`<div style="font-size:12.5px;color:var(--grey-400);margin-top:8px;">Synced from ${S.sync.src==="timeoff"?"NLO Time Off":"the Time-Off Request app"} — manage it there.</div>`;
    } else if(S.admin&&(e.type==="bday"||e.type==="anniv")){
      h+=`<div style="font-size:12.5px;color:var(--grey-400);margin-top:8px;">From the staff list — edit in Settings → Staff.</div>`;
    } else if(S.admin&&e.type==="hr"){
      h+=`<div style="font-size:12.5px;color:var(--grey-400);margin-top:8px;">From Staff Hub — change it there.</div>`;
    }
    h+=`</div>`;
  });
  h+=`</div>`;
  if(S.admin){
    h+=`<div style="padding:14px 22px;border-top:1px solid var(--grey-200);">
      <button data-act="add-for-day" data-date="${dd}" class="pill-btn hov-blue7" style="width:100%;padding:13px;font-size:15px;background:var(--blue-600);color:#fff;">+ Add entry on this day</button>
    </div>`;
  }
  h+=`</div>`;
  return h;
}

function renderEntry(){
  const f=S.form;
  const typeBtn=(t,g,l)=>{
    const on=f.type===t;
    return `<button data-act="form-type" data-v="${t}" style="flex:1;border:none;border-radius:999px;padding:9px;font-weight:700;font-size:14px;background:${on?"#1B2F4C":"transparent"};color:${on?"#FFFFFF":"#4C5868"};">${g} ${l}</button>`;
  };
  const lab=`display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--grey-600);text-transform:uppercase;letter-spacing:.06em;`;
  const inp=`padding:10px;border:2px solid var(--grey-300);border-radius:10px;font-size:15px;color:var(--navy-800);`;
  const rep=f.type!=="pto"&&!!f.recurrence;
  let h=`<div data-act="close-entry" style="position:fixed;inset:0;background:rgba(17,32,58,.5);z-index:70;"></div>
  <div data-keep-scroll="entry" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:71;background:#fff;border-radius:16px;padding:26px;width:min(460px,94vw);max-height:92vh;overflow-y:auto;box-shadow:0 24px 60px rgba(17,32,58,.35);">
    <div class="disp" style="font-weight:700;font-size:24px;color:var(--navy-800);margin-bottom:16px;">${f.id?"Edit entry":"Add entry"}</div>
    <div style="display:flex;gap:6px;background:var(--grey-100);border-radius:999px;padding:4px;margin-bottom:16px;">
      ${typeBtn("pto","●","Out")}${typeBtn("event","■","Event")}${typeBtn("task","▲","Task")}
    </div>
    <div style="display:flex;flex-direction:column;gap:12px;">`;
  if(f.type==="pto"){
    h+=`<label style="${lab}">Who's out
      <select id="f-staff" style="${inp}background:#fff;"><option value="">— Select staff —</option>`;
    const staffL=calStaff();
    Object.keys(staffL).filter(id=>staffL[id].active||(staffL[id].left&&id===f.staffId)).forEach(id=>{
      h+=`<option value="${id}" ${f.staffId===id?"selected":""}>${esc(staffL[id].name)}</option>`;
    });
    h+=`</select></label>`;
  } else {
    h+=`<label style="${lab}">Title
      <input type="text" id="f-title" value="${esc(f.title)}" placeholder="${f.type==="task"?"e.g. Supply order due":"e.g. Staff meeting"}" style="${inp}">
    </label>`;
  }
  /* events and tasks can repeat; "Repeat until" (optional) ends the series */
  if(f.type!=="pto"){
    const o=(v,l)=>`<option value="${v}" ${(f.recurrence||"")===v?"selected":""}>${l}</option>`;
    h+=`<label style="${lab}">Repeats
      <select id="f-rec" style="${inp}background:#fff;">${o("","Does not repeat")}${o("weekly","Weekly")}${o("biweekly","Every 2 weeks")}${o("monthly","Monthly")}${o("quarterly","Quarterly")}${o("yearly","Yearly")}${o("biennial","Every 2 years")}${o("triennial","Every 3 years")}</select></label>`;
    /* category: events can be a vendor / rep visit; tasks can be compliance or payroll & money (with a heads-up) */
    const co=(v,l)=>`<option value="${v}" ${(f.cat||"")===v?"selected":""}>${l}</option>`;
    const catSel=f.type==="event"?co("","General")+co("visit","🚚 Vendor / rep visit"):co("","General")+co("compliance","🛡 Compliance")+co("money","💵 Payroll & money");
    h+=`<div style="display:grid;grid-template-columns:${f.type==="task"?"1fr 1fr":"1fr"};gap:10px;">
      <label style="${lab}">Category<select id="f-cat" style="${inp}background:#fff;">${catSel}</select></label>`;
    if(f.type==="task"){
      const dl=f.cat&&CATS[f.cat]?CATS[f.cat].lead:0;
      h+=`<label style="${lab}">Heads-up (days)<input type="number" id="f-lead" min="0" max="120" value="${esc(f.lead)}" placeholder="${dl}" style="${inp}"></label>`;
    }
    h+=`</div>`;
  }
  h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <label style="${lab}">${rep?"First date":"Start date"}<input type="date" id="f-start" value="${f.startDate}" style="${inp}font-size:14px;"></label>`;
  if(rep) h+=`<label style="${lab}">Repeat until<input type="date" id="f-until" value="${f.until||""}" min="${f.startDate}" style="${inp}font-size:14px;"></label>`;
  else h+=`<label style="${lab}">End date<input type="date" id="f-end" value="${f.endDate}" style="${inp}font-size:14px;"></label>`;
  h+=`</div>`;
  if(rep) h+=`<div style="font-size:12.5px;color:var(--grey-500);margin-top:-6px;">Leave “Repeat until” empty to keep it going.</div>`;
  if(f.type==="event"){
    h+=`<div style="display:flex;align-items:center;gap:14px;">
      <label style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--navy-800);cursor:pointer;">
        <input type="checkbox" id="f-allday" ${f.allDay?"checked":""} style="width:18px;height:18px;accent-color:#1D3EA9;"> All-day
      </label>`;
    if(!f.allDay) h+=`<input type="time" id="f-time" value="${f.time}" style="padding:8px;border:2px solid var(--grey-300);border-radius:10px;font-size:14px;color:var(--navy-800);">`;
    h+=`</div>`;
  }
  h+=`<label style="${lab}">Notes<textarea id="f-notes" rows="2" style="${inp}resize:vertical;min-height:56px;">${esc(f.notes)}</textarea></label>`;
  if(S.formError) h+=`<div style="color:var(--coral-700);font-size:13.5px;font-weight:600;">${esc(S.formError)}</div>`;
  if(S.blackoutWarn){
    h+=`<div style="background:var(--amber-100);border:1px solid #F5DFA9;border-radius:10px;padding:12px 14px;">
      <div style="font-weight:700;font-size:14px;color:var(--amber-700);">⚠ Blackout date conflict</div>
      <div style="font-size:13.5px;color:var(--grey-600);margin-top:4px;">This overlaps a blackout date. Save anyway?</div>
      <button data-act="save-anyway" class="hov-amber7" style="margin-top:10px;border:none;background:var(--amber-600);border-radius:999px;padding:8px 18px;font-weight:700;font-size:13px;color:#fff;">Save anyway</button>
    </div>`;
  }
  h+=`</div><div style="display:flex;gap:10px;margin-top:20px;align-items:center;">`;
  if(f.id) h+=`<button data-act="del-from-form" data-id="${f.id}" class="hov-coral1" style="border:1px solid var(--coral-200);background:#fff;border-radius:999px;padding:11px 18px;font-weight:600;font-size:14px;color:var(--coral-700);">Delete</button>`;
  h+=`<div style="flex:1;"></div>
    <button data-act="close-entry" class="hov-grey" style="border:1px solid var(--grey-300);background:#fff;border-radius:999px;padding:11px 20px;font-weight:600;font-size:14px;color:var(--navy-800);">Cancel</button>
    <button data-act="save-entry" class="pill-btn hov-blue7" style="padding:11px 26px;font-size:14px;background:var(--blue-600);color:#fff;">Save</button>
  </div></div>`;
  return h;
}

/* ================= EVENTS ================= */
function clearInputs(ids){ ids.forEach(i=>{ const x=document.getElementById(i); if(x) x.value=""; }); }
document.getElementById("app").addEventListener("click",(ev)=>{
  const el=ev.target.closest("[data-act]");
  if(!el) return;
  const act=el.dataset.act;
  const today=todayStr();
  switch(act){
    case "view": S.view=el.dataset.v; render(); break;
    case "prev": case "next": {
      const n=act==="prev"?-1:1;
      if(S.view==="month"){ const cd=parseD(S.cursor||today); S.cursor=fmt(new Date(cd.getFullYear(),cd.getMonth()+n,1)); }
      else S.cursor=addDays(S.cursor||today,n*7);
      render(); break;
    }
    case "today": S.cursor=today; render(); break;
    case "filter": { const k=el.dataset.f; S.filters[k]=!S.filters[k]; render(); break; }
    case "open-day":
      if(S.admin&&S.paintMode){ cycleAdminDay(el.dataset.date); break; }
      S.detailDate=el.dataset.date; render(); break;
    case "paint-toggle": S.paintMode=!S.paintMode; render(); break;
    case "close-detail": if(ev.target===el||el.tagName==="BUTTON"){ S.detailDate=null; S.stickerPick=null; S.stickerMsg=""; render(); } break;
    case "stk-open": S.stickerPick=el.dataset.date; S.stickerMsg=""; render(); break;
    case "stk-close": S.stickerPick=null; S.stickerMsg=""; render(); break;
    case "stk-put": placeSticker(el.dataset.date,el.dataset.e); break;
    case "stk-own": {
      const inp=document.getElementById("stk-own"), e=oneEmoji(inp&&inp.value);
      if(!e){ S.stickerMsg="Type or paste one emoji, like 🎃."; bgRender(); break; }
      placeSticker(el.dataset.date,e); break;
    }
    case "stk-del": removeSticker(el.dataset.id); break;
    case "open-pin": S.pinOpen=true; S.pinValue=""; S.pinError=false; render(); break;
    case "close-pin": if(ev.target===el||el.tagName==="BUTTON"){ S.pinOpen=false; S.pinValue=""; S.pinError=false; render(); } break;
    case "submit-pin": trySubmitPin(); break;
    case "lock-admin": if(isFs()){ NLOC.lock(); break; } S.admin=false; S.paintMode=false; render(); break;
    case "move-open": moveSheet(); break;
    case "move-back-open": moveBackSheet(); break;
    case "editors-save": saveEditors(); break;
    case "open-add": S.form=blankForm(S.detailDate||today); S.entryOpen=true; S.blackoutWarn=false; S.formError=""; render(); break;
    case "add-for-day": S.form=blankForm(el.dataset.date); S.entryOpen=true; S.blackoutWarn=false; S.formError=""; render(); break;
    case "close-entry": if(ev.target===el||el.tagName==="BUTTON"){ S.entryOpen=false; S.form=null; S.blackoutWarn=false; S.formError=""; render(); } break;
    case "form-type": readFormDom(); S.form.type=el.dataset.v; if(S.form.cat&&(!CATS[S.form.cat]||CATS[S.form.cat].type!==S.form.type)) S.form.cat=""; S.blackoutWarn=false; S.formError=""; render(); break;
    case "goto-day": S.detailDate=el.dataset.date; render(); break;
    case "print": S.view="month"; S.detailDate=null; S.paintMode=false; render(); setTimeout(()=>window.print(),60); break;
    case "preset-open": S.presetOpen=true; S.presetMsg=""; render(); break;
    case "preset-close": S.presetOpen=false; S.presetMsg=""; render(); break;
    case "preset-add": addPresets(); break;
    case "watch-remove": fbRemove("settings/watchCustom/"+el.dataset.date); break;
    case "watch-add": {
      const a=document.getElementById("new-watch-start").value, b=document.getElementById("new-watch-end").value;
      const lbl=(document.getElementById("new-watch-label").value||"").trim().slice(0,60)||"Watch";
      if(!a) break;
      fbSet("settings/watchCustom/"+a,{ end:b&&b>=a?b:a, label:lbl });
      clearInputs(["new-watch-start","new-watch-end","new-watch-label"]); break;
    }
    case "school-hide": String(el.dataset.dates||"").split(",").filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)).forEach(d=>{ if(SCHOOL_BUILTIN[d]) fbSet("settings/school/"+d,""); else fbRemove("settings/school/"+d); }); break;
    case "school-add": {
      const d=document.getElementById("new-school-date").value, lbl=(document.getElementById("new-school-label").value||"").trim().slice(0,60)||"No school";
      if(!d) break;
      fbSet("settings/school/"+d,lbl);
      clearInputs(["new-school-date","new-school-label"]); break;
    }
    case "save-entry": saveEntry(false); break;
    case "save-anyway": saveEntry(true); break;
    case "del-from-form": deleteEntry(el.dataset.id); break;
    case "edit-entry": {
      const e=S.data.events[el.dataset.id];
      if(!e) break;
      S.form={ id:el.dataset.id, type:e.type, title:e.type==="pto"?"":e.title, staffId:e.staffId||"",
               startDate:e.startDate, endDate:e.endDate||e.startDate, allDay:!e.time, time:e.time||"09:00",
               notes:e.notes||"", recurrence:e.recurrence||"", until:e.until||"", cat:e.cat||"", lead:typeof e.lead==="number"?String(e.lead):"" };
      if(el.dataset.from==="settings") S.settingsOpen=false;
      S.entryOpen=true; S.blackoutWarn=false; S.formError=""; render(); break;
    }
    case "del-entry": deleteEntry(el.dataset.id); break;
    case "task-done": toggleDone(el.dataset.id,el.dataset.date); break;
    case "dismiss-save-err": S.saveErr=null; render(); break;
    case "dismiss-lock-note": S.lockNote=""; render(); break;
    case "adminday": setAdminDay(el.dataset.date, el.dataset.v||null); break;
    case "open-settings": S.settingsOpen=true; S.pinSaved=false; S.edMsg=""; if(isFs()&&isOwnerNc()) loadNcRoster(); render(); break;
    case "close-settings": if(ev.target===el||el.tagName==="BUTTON"){ S.settingsOpen=false; render(); } break;
    case "sync-now": syncTimeOff(); break;
    case "to-feed-save": saveTimeOffFeedKey(); break;
    case "to-feed-clear": {
      if(isFs()) break;
      if(!window.confirm("Go back to the old Time-Off app?\n\nThe calendar and the Checklist app (CADANCe) will show time off from the old app again.")) break;
      db.ref(TO_FEED_CFG).remove().then(()=>{ S.toFeed.key=""; S.toFeed.msg="Back to the old Time-Off app."; S.toFeed.bad=false; render(); syncTimeOff(); })
        .catch(e=>{ S.toFeed.msg="Couldn't change it: "+((e&&e.message)||e); S.toFeed.bad=true; render(); });
      break;
    }
    case "staff-remove": {
      const id=el.dataset.id;
      if(!window.confirm("Remove "+S.data.staff[id].name+"?\n\nThis also deletes ALL their calendar entries — days out, birthday, and work-anniversary dates.")) break;
      Object.keys(S.data.events).forEach(eid=>{ if(S.data.events[eid].staffId===id) fbRemove("events/"+eid); });
      fbRemove("staff/"+id);
      if(S.editStaffId===id) S.editStaffId=null;
      break;
    }
    case "staff-add": {
      const name=(document.getElementById("new-staff").value||"").trim();
      if(!name) break;
      const bday=document.getElementById("new-staff-bday").value||null;
      const hire=document.getElementById("new-staff-hire").value||null;
      const rec={name,active:true};
      if(bday) rec.birthday=bday;
      if(hire) rec.hireDate=hire;
      fbSet("staff/s"+Date.now(),rec);
      clearInputs(["new-staff","new-staff-bday","new-staff-hire"]);
      break;
    }
    case "staff-edit": S.editStaffId=el.dataset.id; render(); break;
    case "staff-edit-cancel": S.editStaffId=null; render(); break;
    case "staff-edit-save": {
      const id=el.dataset.id, cur=calStaff()[id]||{};
      const nameEl=document.getElementById("se-name"), hireEl=document.getElementById("se-hire");
      const name=nameEl?(nameEl.value||"").trim():String(cur.savedName||cur.name||"").trim();
      if(!name) break;
      const upd={ birthday: document.getElementById("se-bday").value||null };
      if(hireEl) upd.hireDate=hireEl.value||null;
      /* someone from Staff Hub keeps the name they were saved under (the calendar shows Staff Hub's) */
      if(nameEl||!S.data.staff[id]) upd.name=name;
      /* first save for a Staff Hub-only person creates their calendar record */
      if(!S.data.staff[id]) upd.active=true;
      db.ref(CAL_ROOT+"/staff/"+id).update(upd).catch(fbErr);
      S.editStaffId=null; render();
      break;
    }
    case "closure-remove": fbRemove("settings/closures/"+el.dataset.date); break;
    case "closure-add": {
      const d=document.getElementById("new-closure-date").value;
      const lbl=(document.getElementById("new-closure-label").value||"").trim()||"Office closed";
      if(!d) break;
      fbSet("settings/closures/"+d,lbl);
      clearInputs(["new-closure-date","new-closure-label"]);
      break;
    }
    case "blackout-remove": fbRemove("settings/blackoutDates/"+el.dataset.date); break;
    case "blackout-add": {
      const inp=document.getElementById("new-blackout");
      if(!inp.value) break;
      fbSet("settings/blackoutDates/"+inp.value,true);
      clearInputs(["new-blackout"]); break;
    }
    case "pin-save": {
      const inp=document.getElementById("pin-field");
      const p=(inp.value||"").replace(/\D/g,"").slice(0,6);
      if(p.length<4) break;

/* ================= ADMIN AUTO-LOCK =================
   On a shared office computer, admin mode locks itself after 10 minutes without a click, tap, key press or
   scroll (also checked when someone comes back to the tab). Open admin panels (Settings, Add/Edit) close with it. */
const ADMIN_IDLE_MIN=10;
let adminSeen=Date.now();
["pointerdown","keydown","wheel","touchstart","scroll"].forEach(t=>document.addEventListener(t,()=>{ adminSeen=Date.now(); },{passive:true,capture:true}));

  S.admin=false; S.paintMode=false; S.settingsOpen=false; S.entryOpen=false; S.form=null;
  S.blackoutWarn=false; S.formError=""; S.editStaffId=null; S.pinSaved=false; S.stickerPick=null; S.stickerMsg="";
  S.lockNote=note||"";
  render();

}
let ncIdleWarned=false;
function adminIdleCheck(){
  if(isFs()){
    if(!NCME||!NLOC) return;
    const min=NLOC.idleMin(), idle=Date.now()-adminSeen;
    if(idle>min*60000) NLOC.lock("Locked after "+min+" minute"+(min===1?"":"s")+" without activity.");
    else if(idle>min*60000-60000){ if(!ncIdleWarned){ ncIdleWarned=true; S.lockNote="No activity for a while: the calendar locks in about a minute."; bgRender(); setTimeout(()=>{ if(S.lockNote&&/locks in about a minute/.test(S.lockNote)){ S.lockNote=""; bgRender(); } },10000); } }
    else ncIdleWarned=false;
    return;
  }
  if(S.admin&&S.data&&Date.now()-adminSeen>ADMIN_IDLE_MIN*60000) lockAdmin("Admin mode locked after "+ADMIN_IDLE_MIN+" minutes without use.");
}

   only once they say it isn't moving or moved — or after 6 s if they can't be read, as before. */
let oldWatching=false, oldClear=false, oldThen=null;
function oldWatchStart(then){
  if(isFs()||!NLOC) return false;
  const run=()=>{ const f=oldThen; oldThen=null; if(f) f(); };
  if(oldWatching){ oldThen=then; if(oldClear) run(); return true; }
  oldWatching=true; oldThen=then;
  try{ NLOC.watchOldDb(firebase.database(),()=>MOVING,()=>{ oldClear=true; run(); },()=>{ oldWatching=false; oldClear=false; }); }
  catch(e){ oldWatching=false; oldThen=null; return false; }
  setTimeout(()=>{ if(!oldClear&&!document.getElementById("nlomOverlay")) run(); },6000);
  return true;
}

        if(!r.ok) throw new Error("HTTP "+r.status);
        const text=(await r.text()).replace(/__OWNER_EMAIL__/g,ALLOWED_EMAILS[0]);
        if(text.indexOf("rules_cal_1")<0) throw new Error("that file doesn’t have the calendar’s part yet");
        out.textContent=(await copyText(text))?"Copied ✓ — now paste it in the console":"Couldn’t copy: select it from the box below";
        if(!navigator.clipboard){ const ta=document.createElement("textarea"); ta.value=text; ta.rows=6; ta.readOnly=true; ta.style.cssText="width:100%;margin-top:6px;"; out.after(ta); }
      }catch(x){ out.textContent="Couldn’t get the rules: "+(x.message||x); }
    };
    body.querySelector("#mvCheck").onclick=async()=>{
      const m=body.querySelector("#mvRulesMsg"); m.textContent="Checking…";
      try{ await NLOC.fs.disableNetwork(); await NLOC.fs.enableNetwork(); }catch(e){}   /* (a fresh connection: one opened before Publish can keep the older rules for a few minutes) */
      try{ if(await NLOC.rulesLive()) step3(); else m.textContent="Not yet — the database still has the older rules (it can take a few minutes after Publish)."; }catch(x){ m.textContent="Can’t reach the database: "+(x.message||x); }
    };
  };
  let old=null, before=null;
  /* a stop here: say why, with Try again (nothing has been written yet) */
  const stop3=t=>{ body.innerHTML=msg(t,true)+`<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px;"><button data-sheet-close class="hov-grey" style="${SHEET_BTN}border:1px solid var(--grey-300);background:#fff;color:var(--navy-800);">Not now</button><button id="mvAgain" class="hov-coral7" style="${SHEET_BTN}background:var(--coral-500);color:#fff;">Try again</button></div>`; body.querySelector("[data-sheet-close]").onclick=()=>{ closeSheet(); NLOC.signOut(); }; body.querySelector("#mvAgain").onclick=()=>step3(0); };
  const step3=async tries=>{
    tries=tries||0;
    body.innerHTML=msg("Reading the calendar’s data in the old database…");
    const no=await movedAlready(); if(no){ stop3(no); return; }
    try{ old=await NLOC.readOld(db); }catch(x){ stop3("Couldn’t read the old database: "+(x.message||x)); return; }
    try{ before=await NLOC.readNew(NLOC.fs); }catch(x){
      /* right after Publish, parts of the database can still have the older rules for a minute or two: wait and ask again */
      if(/permission/i.test(String((x&&(x.code||x.message))||""))&&tries<12){
        body.innerHTML=msg("The NLO Cases database is still taking in the new rules (this can take a few minutes after Publish). Trying again by itself…");
        setTimeout(async()=>{
          if(document.getElementById("sheetBody")!==body||MOVING) return;
          try{ await NLOC.fs.disableNetwork(); await NLOC.fs.enableNetwork(); }catch(e){}
          step3(tries+1);
        },10000);
        return;
      }
      stop3("Couldn’t read the NLO Cases database: "+(x.message||x)); return;
    }
    if(!Object.keys(before).some(k=>before[k]!=null)) before=null;
    const recs=NLOC.recordsOf(old), bad=NLOC.badIds(recs);
    if(bad.length){ body.innerHTML=msg("These records have ids the new database won’t take, so nothing was moved: "+bad.slice(0,8).join(", "),true); return; }
    const big=NLOC.tooBig(recs);
    if(big.length){ body.innerHTML=msg("These records are too big for one record in the new database (1 MB each), so nothing was moved: "+big.slice(0,8).join(", "),true); return; }
    body.innerHTML=`<p style="margin:0 0 6px;">What moves:</p><ul style="margin:0 0 0 18px;line-height:1.7;">${moveCounts(old)}</ul>
      <p style="margin:12px 0 0;">Best when nobody is using the calendar. Screens open elsewhere pause while it moves and switch over by themselves (a screen opened before today’s update: reload it afterwards). A copy of everything goes to your Downloads first. The old database keeps its copy too. Afterwards only you can edit until you tick other editors in Admin settings.</p>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px;"><button data-sheet-close class="hov-grey" style="${SHEET_BTN}border:1px solid var(--grey-300);background:#fff;color:var(--navy-800);">Not now</button><button id="mvNow" class="hov-coral7" style="${SHEET_BTN}background:var(--coral-500);color:#fff;">Move it now</button></div>`;
    body.querySelector("[data-sheet-close]").onclick=()=>{ closeSheet(); NLOC.signOut(); };
    body.querySelector("#mvNow").onclick=step4;
  };
  const step4=async()=>{
    document.querySelectorAll("#calSheet [data-sheet-close]").forEach(x=>x.remove());
    const line=t=>{ body.insertAdjacentHTML("beforeend",`<p style="margin:0 0 6px;">${esc(t)}</p>`); };
    body.innerHTML="";
    MOVING=true;
    let claim="";
    try{
      download("office-calendar-before-move-"+todayStr()+".json",JSON.stringify(Object.assign({app:"office-calendar",at:new Date().toISOString(),data:old},before?{nloCasesBefore:before}:{}),null,1));
      line("Copy saved to Downloads ✓");
      const no=await movedAlready(); if(no) throw new Error(no);
      claim=await NLOC.claimMove(db,ALLOWED_EMAILS[0]);
      line("Pausing the calendar on other screens…");
      await new Promise(r=>setTimeout(r,4000));
      let cur=await NLOC.readOld(db), res=null;
      for(let k=0;k<3;k++){
        res=await NLOC.writeRecords(NLOC.fs,NLOC.me.sid,NLOC.recordsOf(cur),(n,all)=>{ NLOC.touchMove(db,claim); let p=body.querySelector(".mvProg"); if(!p){ body.insertAdjacentHTML("beforeend",'<p class="mvProg" style="margin:0 0 6px;"></p>'); p=body.querySelector(".mvProg"); } p.textContent="Writing… "+n+" of "+all; });
        if(res.missing.length||res.differ.length||res.left.length) throw new Error("the check after writing found "+(res.missing.length+res.differ.length+res.left.length)+" records not as written — nothing was switched over");
        const again=await NLOC.readOld(db);
        if(NLOC.fpr(again)===NLOC.fpr(cur)) break;
        if(k===2) throw new Error("the old data kept changing while moving (someone is using the calendar) — nothing was switched over; try again when it’s quiet");
        cur=again; line("Something changed meanwhile — writing it too…");
      }
      line("Checked: "+res.written+" record"+(res.written===1?"":"s")+" written and read back the same ✓");
      const FV=firebase.firestore.FieldValue;
      if(!(await NLOC.moveStillMine(db,claim))) throw new Error("the pause on the other screens was interrupted (a connection dropped) — nothing was switched over; try again");
      const no2=await movedAlready(); if(no2) throw new Error(no2);
      await NLOC.fs.doc("calMeta/info").set({ counts:NLOC.counts(cur), by:ALLOWED_EMAILS[0], _up:FV.serverTimestamp(), _by:NLOC.me.sid });
      await NLOC.fs.doc("calMeta/moved").set({ on:true, at:FV.serverTimestamp() });
      NLOC.rememberFs(true);
      let marked=true;
      try{ await db.ref(CAL_ROOT+"/movedTo").set({ at:Date.now(), by:ALLOWED_EMAILS[0], to:"nlo-cases" }); }catch(x){ marked=false; }
      if(marked) await NLOC.releaseMove(db,claim);
      line("Switched over ✓ — the calendar now opens with the NLO Cases login.");
      setTimeout(()=>location.reload(),2500);
    }catch(x){
      if(claim) await NLOC.releaseMove(db,claim);
      MOVING=false;
      NLOC.signOut();
      line("Stopped: "+(x.message||x));
      body.insertAdjacentHTML("beforeend",`<div style="display:flex;justify-content:flex-end;margin-top:10px;"><button id="mvClose" class="hov-grey" style="${SHEET_BTN}border:1px solid var(--grey-300);background:#fff;color:var(--navy-800);">Close</button></div>`);
      body.querySelector("#mvClose").onclick=closeSheet;
    }
  };
  step1("");
}
/* the way back (only if something's wrong): needs this computer's office Google sign-in for the old database */
function moveBackSheet(){
  if(!isFs()||!isOwnerNc()) return;
  const body=openSheet("Move back to the old database");
  const draw=err=>{
    const g=rtExtra();
    body.innerHTML=`<p style="margin:0 0 10px;">Only if something is wrong. Everything in the calendar as it is now goes back to the old database (a copy goes to your Downloads first), and it goes back to the office Google sign-in and the admin PIN.</p>${err?`<p style="margin:0 0 10px;color:var(--coral-700);font-weight:700;">${esc(err)}</p>`:""}
      ${g?"":`<p style="margin:0 0 8px;">This needs the office Google sign-in (Dr. A’s) on this computer.</p><button id="mbG" class="pill-btn" style="background:var(--blue-600);color:#fff;padding:10px 18px;font-size:13px;letter-spacing:.06em;">Sign in with Google</button>`}
      <label style="display:flex;gap:8px;align-items:center;margin-top:12px;"><input type="checkbox" id="mbOk" style="width:18px;height:18px;"> <span>Yes, move it back</span></label>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px;"><button data-sheet-close class="hov-grey" style="${SHEET_BTN}border:1px solid var(--grey-300);background:#fff;color:var(--navy-800);">Cancel</button><button id="mbGo" class="hov-coral7" style="${SHEET_BTN}background:var(--coral-500);color:#fff;" ${g?"":"disabled"}>Move it back</button></div>`;
    body.querySelector("[data-sheet-close]").onclick=closeSheet;
    const gb=body.querySelector("#mbG"); if(gb) gb.onclick=async()=>{ try{ const p=new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"}); await auth.signInWithPopup(p); draw(rtExtra()?"":"That Google account can’t write the old database."); }catch(x){ draw(x.message||"Sign-in failed."); } };
    body.querySelector("#mbGo").onclick=async()=>{
      if(!body.querySelector("#mbOk").checked){ draw("Tick “Yes, move it back” first."); return; }
      const rt=rtExtra(); if(!rt){ draw("Sign in with Google first."); return; }
      document.querySelectorAll("#calSheet [data-sheet-close]").forEach(x=>x.remove());
      body.innerHTML="<p>Moving back…</p>";
      MOVING=true;
      const FV=firebase.firestore.FieldValue;
      let paused=false;
      try{
        const st=await NLOC.moveState();
        if(!st||st.refused) throw new Error("can’t check with the NLO Cases database — try again in a minute");
        if(!st.on) throw new Error("the calendar is already back on the old database — reload this page");
        await NLOC.fs.doc("calMeta/moved").set({ on:true, pause:true, at:FV.serverTimestamp() });
        paused=true;
        body.innerHTML="<p>Pausing the calendar on other screens…</p>";
        await new Promise(r=>setTimeout(r,4000));
        body.innerHTML="<p>Moving back…</p>";
        let cur=await NLOC.readNew(NLOC.fs);
        download("office-calendar-before-move-back-"+todayStr()+".json",JSON.stringify({app:"office-calendar",at:new Date().toISOString(),data:cur},null,1));
        /* the admin PIN never left the old database: it stays as it was there */
        let oldPin=null; try{ oldPin=(await rt.ref(CAL_ROOT+"/settings/adminPin").once("value")).val(); }catch(x){}
        for(let k=0;k<3;k++){
          for(const m of NLOC.MOVED){
            let v=cur[m.path]==null?null:JSON.parse(JSON.stringify(cur[m.path]));
            if(m.path===CAL_ROOT+"/settings"&&typeof oldPin==="string"&&oldPin){ v=v||{}; v.adminPin=oldPin; }
            await rt.ref(m.path).set(v);
          }
          const again=await NLOC.readNew(NLOC.fs);
          if(NLOC.fpr(again)===NLOC.fpr(cur)) break;
          if(k===2) throw new Error("the data kept changing while moving back — nothing was switched back; try again when it’s quiet");
          cur=again;
        }
        /* NLO Time Off's feed key saved while on the NLO Cases system goes back to the old database too (Cadence mirrors the
           old database's copy again once the calendar is back) */
        try{
          const tf=(await NLOC.fs.doc("cadMirror/tofeed").get()).data()||{}, k=typeof tf.key==="string"?tf.key:"";
          const was=(await rt.ref(TO_FEED_CFG).once("value")).val();
          if(k&&!(was&&was.key===k)) await rt.ref(TO_FEED_CFG).set({ key:k, at:firebase.database.ServerValue.TIMESTAMP, by:(auth.currentUser&&auth.currentUser.email)||"" });
        }catch(x){}
        await rt.ref(CAL_ROOT+"/movedTo").remove();
        try{ await rt.ref(CAL_ROOT+"/moving").remove(); }catch(x){}
        await NLOC.fs.doc("calMeta/moved").set({ on:false, at:FV.serverTimestamp() });
        NLOC.rememberFs(false);
        body.innerHTML="<p>Moved back ✓ — the calendar uses the office Google sign-in again.</p>";
        setTimeout(()=>location.reload(),2500);
      }catch(x){
        if(paused){ try{ await NLOC.fs.doc("calMeta/moved").set({ on:true, at:FV.serverTimestamp() }); }catch(y){} }
        MOVING=false;
        body.innerHTML=`<p style="color:var(--coral-700);font-weight:700;">Stopped: ${esc(x.message||x)}</p><p>Nothing was switched back.</p><div style="display:flex;justify-content:flex-end;margin-top:10px;"><button id="mbClose" class="hov-grey" style="${SHEET_BTN}border:1px solid var(--grey-300);background:#fff;color:var(--navy-800);">Close</button></div>`;
        body.querySelector("#mbClose").onclick=closeSheet;
      }
    };
  };
  draw("");
}
start();
</script>
